<script>
"use strict";
/* §1 MANIFEST */
const MANIFEST = {
  id: 'hole-swallow',
  title: 'Hole Swallow',
  version: '1.0.0',
  genre: 'snake',
  theme: 'candy',
  orientation: 'portrait',
  design: { w: 720, h: 1280, maxW: 900 },
  touch: { stick: false, buttons: [] },
};
</script>
<script>
//#KERNEL-BEGIN 1.1.0
/* =========================================================================
   SlopGames KERNEL 1.1.0 — single-file HTML5 game kernel (Canvas2D, zero deps)
   Requires a global `MANIFEST` declared in an earlier <script>. Exposes `K`.
   Source of truth: /kernel/kernel-1.1.0.js  — never edit inside a game file.
   ========================================================================= */
const K = (() => {
  'use strict';
  const KERNEL_VERSION = '1.1.0';
  const TAU = Math.PI * 2;

  /* ---------- manifest defaults ---------- */
  const MF = (typeof MANIFEST !== 'undefined' && MANIFEST) ? MANIFEST : {};
  const DEFAULT_KEYS = {
    up: ['ArrowUp', 'KeyW', 'PadUp'], down: ['ArrowDown', 'KeyS', 'PadDown'],
    left: ['ArrowLeft', 'KeyA', 'PadLeft'], right: ['ArrowRight', 'KeyD', 'PadRight'],
    action: ['Space', 'Enter', 'PadA'], alt: ['ShiftLeft', 'KeyX', 'PadB'],
    pause: ['Escape', 'KeyP', 'PadStart'],
  };
  MF.id = MF.id || 'game';
  MF.title = MF.title || 'Game';
  MF.version = MF.version || '1.0.0';
  MF.design = Object.assign({ w: 720, h: 1280 }, MF.design || {});
  MF.keys = Object.assign({}, DEFAULT_KEYS, MF.keys || {});
  MF.touch = Object.assign({ stick: false, buttons: [] }, MF.touch || {});
  MF.platformOrigins = MF.platformOrigins || [];
  MF.orientation = MF.orientation || 'any';            // 'portrait' | 'landscape' | 'any'
  MF.theme = MF.theme || 'candy';

  /* ---------- canvas bootstrap (games may omit their own <canvas>) ---------- */
  if (!document.getElementById('k-base-css')) {
    const st = document.createElement('style'); st.id = 'k-base-css';
    st.textContent = 'html,body{margin:0;height:100%;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}#stage{position:fixed;inset:0;display:block;width:100%;height:100%;outline:none}';
    document.head.appendChild(st);
  }
  let canvas = document.getElementById('stage');
  if (!canvas) { canvas = document.createElement('canvas'); canvas.id = 'stage'; canvas.tabIndex = 0; document.body.appendChild(canvas); }
  const mainCtx = canvas.getContext('2d');
  let ctx = mainCtx;                                    // swapped while baking sprites

  /* =======================================================================
     MATH / RNG / NOISE / COLOR
     ======================================================================= */
  const M = {
    TAU,
    clamp: (v, a, b) => v < a ? a : v > b ? b : v,
    lerp: (a, b, t) => a + (b - a) * t,
    invLerp: (a, b, v) => (v - a) / (b - a),
    remap: (v, a, b, c, d) => c + (d - c) * ((v - a) / (b - a)),
    smoothstep: (a, b, v) => { const t = Math.max(0, Math.min(1, (v - a) / (b - a))); return t * t * (3 - 2 * t); },
    dist: (ax, ay, bx, by) => Math.hypot(bx - ax, by - ay),
    dist2: (ax, ay, bx, by) => (bx - ax) * (bx - ax) + (by - ay) * (by - ay),
    len: (x, y) => Math.hypot(x, y),
    norm: (x, y) => { const l = Math.hypot(x, y) || 1; return { x: x / l, y: y / l }; },
    dot: (ax, ay, bx, by) => ax * bx + ay * by,
    cross: (ax, ay, bx, by) => ax * by - ay * bx,
    rotate: (x, y, a) => { const c = Math.cos(a), s = Math.sin(a); return { x: x * c - y * s, y: x * s + y * c }; },
    angle: (x, y) => Math.atan2(y, x),
    angleDiff: (a, b) => { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; },
    approach: (v, t, d) => v < t ? Math.min(v + d, t) : Math.max(v - d, t),
    damp: (a, b, lambda, dt) => a + (b - a) * (1 - Math.exp(-lambda * dt)),
    wrap: (v, max) => ((v % max) + max) % max,
    sign: v => v > 0 ? 1 : v < 0 ? -1 : 0,
  };

  function rng(seed = 1) {
    let s = (seed >>> 0) || 1;
    const r = () => {
      s = (s + 0x6D2B79F5) | 0;
      let t = Math.imul(s ^ (s >>> 15), 1 | s);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    r.range = (a, b) => a + (b - a) * r();
    r.int = (a, b) => Math.floor(a + (b - a + 1) * r());
    r.pick = arr => arr[Math.floor(r() * arr.length)];
    r.chance = p => r() < p;
    r.sign = () => r() < 0.5 ? -1 : 1;
    r.shuffle = arr => { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); const t = arr[i]; arr[i] = arr[j]; arr[j] = t; } return arr; };
    r.weighted = (items, weightOf = it => it.w) => {
      let total = 0; for (const it of items) total += weightOf(it);
      let x = r() * total; for (const it of items) { x -= weightOf(it); if (x <= 0) return it; }
      return items[items.length - 1];
    };
    r.state = () => s;
    r.setState = v => { s = v | 0; };
    return r;
  }
  function hashSeed(str) {
    let h = 2166136261;
    str = String(str);
    for (let i = 0; i < str.length; i++) h = Math.imul(h ^ str.charCodeAt(i), 16777619);
    return h >>> 0;
  }
  function dailySeed(offsetDays = 0) {
    const d = new Date(Date.now() + offsetDays * 864e5);
    return hashSeed(MF.id + ':' + d.getUTCFullYear() + '-' + (d.getUTCMonth() + 1) + '-' + d.getUTCDate());
  }

  function noise(seed = 1) {
    const r = rng(seed), p = new Uint16Array(512), vals = new Float32Array(256), perm = [];
    for (let i = 0; i < 256; i++) { perm.push(i); vals[i] = r() * 2 - 1; }
    r.shuffle(perm);
    for (let i = 0; i < 512; i++) p[i] = perm[i & 255];
    const fade = t => t * t * (3 - 2 * t);
    const h1 = i => vals[p[i & 255]];
    const h2 = (i, j) => vals[p[p[i & 255] + (j & 255)]];
    function n1(x) { const xi = Math.floor(x), t = fade(x - xi); return M.lerp(h1(xi), h1(xi + 1), t); }
    function n2(x, y) {
      const xi = Math.floor(x), yi = Math.floor(y), u = fade(x - xi), v = fade(y - yi);
      return M.lerp(M.lerp(h2(xi, yi), h2(xi + 1, yi), u), M.lerp(h2(xi, yi + 1), h2(xi + 1, yi + 1), u), v);
    }
    function fbm(fn, oct, ...c) { let s = 0, a = 1, f = 1, n = 0; for (let i = 0; i < oct; i++) { s += a * fn(...c.map(v => v * f)); n += a; a *= 0.5; f *= 2; } return s / n; }
    return { n1, n2, fbm1: (x, o = 4) => fbm(n1, o, x), fbm2: (x, y, o = 4) => fbm(n2, o, x, y) };
  }

  const color = {
    rgb(hex) { hex = hex.replace('#', ''); if (hex.length === 3) hex = hex.split('').map(c => c + c).join(''); const n = parseInt(hex, 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; },
    hex(r, g, b) { return '#' + [r, g, b].map(v => Math.round(M.clamp(v, 0, 255)).toString(16).padStart(2, '0')).join(''); },
    mix(a, b, t) { const A = color.rgb(a), B = color.rgb(b); return color.hex(M.lerp(A[0], B[0], t), M.lerp(A[1], B[1], t), M.lerp(A[2], B[2], t)); },
    shade(hex, amt) { return amt >= 0 ? color.mix(hex, '#ffffff', amt) : color.mix(hex, '#000000', -amt); },
    alpha(hex, a) { const c = color.rgb(hex); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; },
    hsl(h, s, l) { return `hsl(${h},${s}%,${l}%)`; },
    pal(base) { return [color.shade(base, 0.45), base, color.shade(base, -0.3)]; },
  };

  const fmt = (n) => {
    const a = Math.abs(n);
    if (a < 1000) return String(Math.floor(n));
    const u = ['K', 'M', 'B', 'T', 'Qa', 'Qi']; let i = -1, v = a;
    while (v >= 1000 && i < u.length - 1) { v /= 1000; i++; }
    return (n < 0 ? '-' : '') + (v < 10 ? v.toFixed(2) : v < 100 ? v.toFixed(1) : Math.floor(v)) + u[i];
  };
  const fmtTime = (sec) => { sec = Math.max(0, Math.ceil(sec)); const m = Math.floor(sec / 60), s = sec % 60; return m + ':' + String(s).padStart(2, '0'); };
  function compact(arr, keep) { let j = 0; for (let i = 0; i < arr.length; i++) if (keep(arr[i], i)) arr[j++] = arr[i]; arr.length = j; return arr; }

  /* =======================================================================
     EASING / TWEENS / SPRINGS (cosmetic, real-time)
     ======================================================================= */
  const Ease = {
    linear: t => t,
    inQuad: t => t * t,
    outQuad: t => 1 - (1 - t) * (1 - t),
    inOutQuad: t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2,
    inCubic: t => t * t * t,
    outCubic: t => 1 - Math.pow(1 - t, 3),
    inOutCubic: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
    outQuart: t => 1 - Math.pow(1 - t, 4),
    inBack: t => { const c1 = 1.70158; return (c1 + 1) * t * t * t - c1 * t * t; },
    outBack: t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
    outElastic: t => t === 0 ? 0 : t === 1 ? 1 : Math.pow(2, -10 * t) * Math.sin((t * 10 - .75) * (TAU / 3)) + 1,
    outBounce: t => {
      const n = 7.5625, d = 2.75;
      if (t < 1 / d) return n * t * t;
      if (t < 2 / d) return n * (t -= 1.5 / d) * t + .75;
      if (t < 2.5 / d) return n * (t -= 2.25 / d) * t + .9375;
      return n * (t -= 2.625 / d) * t + .984375;
    },
    pingPong: t => t < 0.5 ? t * 2 : 2 - t * 2,
  };
  const tweens = [];
  function tween(obj, to, dur = 0.3, ease = Ease.outQuad, delay = 0) {
    const tw = { obj, to, from: {}, dur: Math.max(dur, 1e-4), ease, t: -delay, started: false, done: false, _then: null,
      then(fn) { this._then = fn; return this; }, kill() { this.done = true; } };
    tweens.push(tw);
    return tw;
  }
  tween.killOf = obj => { for (const t of tweens) if (t.obj === obj) t.done = true; };
  function wait(sec) { return new Promise(res => tween({}, {}, sec).then(res)); }
  function updateTweens(dt) {
    for (let i = tweens.length - 1; i >= 0; i--) {
      const tw = tweens[i];
      if (tw.done) { tweens.splice(i, 1); continue; }
      tw.t += dt;
      if (tw.t < 0) continue;
      if (!tw.started) { tw.started = true; for (const k in tw.to) tw.from[k] = tw.obj[k]; }
      const p = Math.min(1, tw.t / tw.dur), e = tw.ease(p);
      for (const k in tw.to) tw.obj[k] = tw.from[k] + (tw.to[k] - tw.from[k]) * e;
      if (p >= 1) { tw.done = true; tweens.splice(i, 1); if (tw._then) tw._then(); }
    }
  }
  // Critically-damped-ish spring: call every frame. s = {v, vel}; returns new value.
  function spring(s, target, dt, stiffness = 220, damping = 18) {
    const a = (target - s.v) * stiffness - s.vel * damping;
    s.vel += a * dt; s.v += s.vel * dt;
    return s.v;
  }

  /* =======================================================================
     VIEW / RESIZE / ADAPTIVE QUALITY
     ======================================================================= */
  const view = { w: MF.design.w, h: MF.design.h, fullW: MF.design.w, fullH: MF.design.h, ox: 0, oy: 0,
    scale: 1, dpr: 1, dprCap: 2.5, safe: { top: 0, right: 0, bottom: 0, left: 0 },
    get portrait() { return this.fullH >= this.fullW; } };
  const probe = document.createElement('div');
  probe.style.cssText = 'position:fixed;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)';
  document.body.appendChild(probe);
  function resize() {
    const D = MF.design;
    const cw = Math.max(1, window.innerWidth), ch = Math.max(1, window.innerHeight);
    const dpr = Math.min(window.devicePixelRatio || 1, view.dprCap);
    const scale = Math.min(cw / D.w, ch / D.h);
    view.scale = scale; view.dpr = dpr;
    view.fullW = cw / scale; view.fullH = ch / scale;
    view.w = Math.min(view.fullW, D.maxW || Infinity);
    view.h = Math.min(view.fullH, D.maxH || Infinity);
    view.ox = (view.fullW - view.w) / 2; view.oy = (view.fullH - view.h) / 2;
    canvas.width = Math.round(cw * dpr); canvas.height = Math.round(ch * dpr);
    const cs = getComputedStyle(probe);
    view.safe.top = Math.max(0, (parseFloat(cs.paddingTop) || 0) / scale - view.oy);
    view.safe.right = Math.max(0, (parseFloat(cs.paddingRight) || 0) / scale - view.ox);
    view.safe.bottom = Math.max(0, (parseFloat(cs.paddingBottom) || 0) / scale - view.oy);
    view.safe.left = Math.max(0, (parseFloat(cs.paddingLeft) || 0) / scale - view.ox);
    spriteCache.checkRes();
    input.layoutTouch();
    if (camera.auto) camera.center();
    scenes.layout();
  }

  /* =======================================================================
     THEMES — art-direction presets; every preset has the same color keys
     ======================================================================= */
  const ROUNDED = '"Arial Rounded MT Bold","Nunito","Baloo 2",ui-rounded,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';
  const THEMES = {
    candy: { ink: '#1b1b3a', paper: '#fff7e8', paperText: '#1b1b3a', bg: '#1b1b3a', sky: ['#4fc3ff', '#8a6cff'], font: ROUNDED,
      colors: { green: ['#8af59a', '#2fbf4a', '#1d8a33'], blue: ['#86d0ff', '#2b8cff', '#1a5fc0'], yellow: ['#fff08a', '#ffc21a', '#d48a00'],
        red: ['#ff9a9a', '#ff4b5c', '#c0283a'], purple: ['#d2b0ff', '#8f5bff', '#5f33c4'], orange: ['#ffc48a', '#ff8a1f', '#c45c00'],
        pink: ['#ffb0dc', '#ff5cb4', '#c42d84'], gray: ['#eef0f6', '#aab2c8', '#6f7891'] } },
    neon: { ink: '#07041a', paper: '#1a1440', paperText: '#ffffff', bg: '#07041a', sky: ['#1a0f3d', '#05030f'], font: ROUNDED, glow: true,
      colors: { green: ['#b0ffd0', '#22ff88', '#00a352'], blue: ['#b0f0ff', '#22d3ff', '#0078b8'], yellow: ['#fffbb0', '#ffe600', '#b89f00'],
        red: ['#ffb0c4', '#ff2e63', '#a8002f'], purple: ['#ebc4ff', '#b44cff', '#6d17b0'], orange: ['#ffd8b0', '#ff8c1a', '#b35400'],
        pink: ['#ffc8f2', '#ff3cc7', '#a3007a'], gray: ['#e0e3ff', '#8088c0', '#3a4070'] } },
    pastel: { ink: '#4a3f5c', paper: '#fffaf3', paperText: '#4a3f5c', bg: '#efe4ff', sky: ['#ffe1ec', '#d9e8ff'], font: ROUNDED,
      colors: { green: ['#d4f7dc', '#9be3ad', '#5fb377'], blue: ['#d6ecff', '#9ccbff', '#5f95cf'], yellow: ['#fff6cc', '#ffe08a', '#d1aa45'],
        red: ['#ffd6dc', '#ff9eac', '#cf6575'], purple: ['#ebdcff', '#c3a3ff', '#8b6bc9'], orange: ['#ffe4cc', '#ffbf8a', '#cf8c52'],
        pink: ['#ffdcef', '#ffa8d4', '#cf6fa0'], gray: ['#f4f2f7', '#cfc9d9', '#968ea6'] } },
    jungle: { ink: '#1f2a12', paper: '#fff6dc', paperText: '#1f2a12', bg: '#1f2a12', sky: ['#9be58e', '#2e8b57'], font: ROUNDED,
      colors: { green: ['#c4f28a', '#6cc23a', '#3d7a1c'], blue: ['#9fe3e0', '#2fa8a0', '#1d6b66'], yellow: ['#fff0a0', '#f2c230', '#a8800f'],
        red: ['#ffb09a', '#e8573a', '#a3321c'], purple: ['#d8b8ff', '#9b6ad6', '#63408f'], orange: ['#ffcf8f', '#f08c24', '#a85a0c'],
        pink: ['#ffc0d2', '#e86a94', '#a33a5e'], gray: ['#efe9d8', '#b5ab8f', '#7a7058'] } },
    ocean: { ink: '#0b2545', paper: '#f0fbff', paperText: '#0b2545', bg: '#0b2545', sky: ['#5ee7ff', '#1b6ca8'], font: ROUNDED,
      colors: { green: ['#a8ffe0', '#2ee6a6', '#16a374'], blue: ['#a8e4ff', '#2ab0ff', '#1572b3'], yellow: ['#fff3b0', '#ffd23f', '#b8901a'],
        red: ['#ffb3b3', '#ff5a5f', '#b8323a'], purple: ['#c9c4ff', '#7a6cff', '#4a3fb3'], orange: ['#ffd1a8', '#ff9a3c', '#b8621a'],
        pink: ['#ffc4e1', '#ff70b0', '#b83d78'], gray: ['#e8f4f8', '#9fbccb', '#5e7f8f'] } },
    retro: { ink: '#000000', paper: '#1d1d1d', paperText: '#ffffff', bg: '#000000', sky: ['#1a0033', '#000000'], font: '"Courier New",ui-monospace,Menlo,monospace',
      colors: { green: ['#80ff80', '#00d800', '#008800'], blue: ['#80c0ff', '#3878f8', '#0030b0'], yellow: ['#ffff80', '#f8d800', '#a88800'],
        red: ['#ff8080', '#f83800', '#a80000'], purple: ['#e080ff', '#a000f8', '#6000a8'], orange: ['#ffc080', '#f87800', '#a84800'],
        pink: ['#ffa0e0', '#f878f8', '#a838a8'], gray: ['#ffffff', '#bcbcbc', '#7c7c7c'] } },
    ink: { ink: '#141414', paper: '#ffffff', paperText: '#141414', bg: '#f5f1e8', sky: ['#faf7f0', '#e6dfcf'], font: ROUNDED,
      colors: { green: ['#e6e6e6', '#bdbdbd', '#7a7a7a'], blue: ['#e6e6e6', '#9e9e9e', '#5c5c5c'], yellow: ['#fff3c4', '#ffd84d', '#b89400'],
        red: ['#ffc9c4', '#e8402e', '#9e2216'], purple: ['#e0e0e0', '#8a8a8a', '#4d4d4d'], orange: ['#f0f0f0', '#b0b0b0', '#6e6e6e'],
        pink: ['#ffd6d1', '#f07a6e', '#a83f34'], gray: ['#ffffff', '#d6d6d6', '#8f8f8f'] } },
  };
  const THEME = {};
  function setTheme(name) {
    const t = THEMES[name] || THEMES.candy;
    for (const k in THEME) delete THEME[k];
    Object.assign(THEME, JSON.parse(JSON.stringify(t)), { name: THEMES[name] ? name : 'candy' });
    if (MF.bg) THEME.bg = MF.bg;
    document.body.style.background = THEME.bg;
    spriteCache.clear();
  }

  /* =======================================================================
     STORAGE / SAVE / META-PROGRESSION
     ======================================================================= */
  const store = (() => {
    const ns = 'k:' + MF.id + ':';
    const mem = {};
    return {
      get(k, def) {
        if (k in mem) return mem[k];
        try { const v = localStorage.getItem(ns + k); if (v != null) return (mem[k] = JSON.parse(v)); } catch (e) {}
        return def;
      },
      set(k, v) {
        mem[k] = v;
        try { localStorage.setItem(ns + k, JSON.stringify(v)); } catch (e) {}
        sdk.send('save', { key: k, value: v });
      },
      remove(k) { delete mem[k]; try { localStorage.removeItem(ns + k); } catch (e) {} sdk.send('save', { key: k, value: null }); },
      import(obj) { if (obj && typeof obj === 'object') for (const k in obj) if (obj[k] != null) mem[k] = obj[k]; },
    };
  })();

  const clone = o => JSON.parse(JSON.stringify(o));
  function fillDefaults(target, defs) {
    for (const k in defs) {
      if (!(k in target)) target[k] = clone(defs[k]);
      else if (defs[k] && typeof defs[k] === 'object' && !Array.isArray(defs[k]) && target[k] && typeof target[k] === 'object') fillDefaults(target[k], defs[k]);
    }
    return target;
  }
  const save = (() => {
    let def = null;
    const data = {};
    let commitT = null;
    function load(raw) {
      let d = raw && typeof raw === 'object' ? clone(raw) : null;
      if (!d) d = Object.assign(clone(def.defaults), { _v: def.version });
      let v = d._v || 1;
      while (v < def.version) { const fn = def.migrate[v + 1]; if (fn) d = fn(d) || d; v++; d._v = v; }
      fillDefaults(d, def.defaults);
      for (const k in data) delete data[k];
      Object.assign(data, d);
    }
    return {
      // K.save.define({version, defaults, migrate:{2: d => {...}}}) → returns the live data object
      define(o) { def = { version: o.version || 1, defaults: o.defaults || {}, migrate: o.migrate || {} }; load(store.get('save', null)); return data; },
      get data() { return data; },
      commit() { if (def) { clearTimeout(commitT); commitT = null; store.set('save', data); } },
      later() { if (def && !commitT) commitT = setTimeout(() => save.commit(), 800); },
      reset() { if (!def) return; for (const k in data) delete data[k]; Object.assign(data, clone(def.defaults), { _v: def.version }); save.commit(); },
      reload() { if (def) load(store.get('save', null)); },
      get defined() { return !!def; },
    };
  })();

  const meta = (() => {
    const m = () => {
      if (!save.defined) save.define({ version: 1, defaults: {} });
      const d = save.data;
      return d._meta || (d._meta = { wallet: {}, up: {}, levels: {}, daily: { last: null, streak: 0 }, unlocks: {}, sel: {} });
    };
    const upDefs = {};

      wheel(x, y, dy) { for (let i = W.length - 1; i >= 0; i--) { const w = W[i]; if (w.kind === 'list' && active(w) && inRect(w, x, y, 0)) { const L = kinds.list.layout(w); w.off = M.clamp(w.off + dy, 0, L.maxOff); return true; } } return false; },
      keys() {
        for (const w of W) if (w.kind === 'button' && w.key && active(w) && input.pressed(w.key)) {
          bounce(w, 0.9, 0.06); w._tw.then(() => bounce(w, 1, 0.35, Ease.outElastic));
          if (w.sfx) audio.play(w.sfx); if (w.onTap) w.onTap(w); return;
        }
      },
    };
    return api;
  })();

  /* =======================================================================
     INPUT — keyboard, unified pointer, multitouch, gamepad, typed text, touch overlay
     ======================================================================= */
  const input = (() => {
    const keyMap = {};
    for (const a in MF.keys) for (const c of MF.keys[a]) (keyMap[c] || (keyMap[c] = [])).push(a);
    const held = new Set(), pr = new Set(), rl = new Set(), vHeld = new Set(), padHeld = new Set();
    const axis = { x: 0, y: 0 }, pad = { x: 0, y: 0, ax: 0, ay: 0, connected: false };
    const typed = [];
    const p = { x: 0, y: 0, down: false, pressed: false, released: false, tap: false, dragging: false,
      startX: 0, startY: 0, dx: 0, dy: 0, downAt: 0, holdTime: 0, id: null, vx: 0, vy: 0, _lx: 0, _ly: 0, _lt: 0,
      get wx() { return camera.toWorld(this.x, this.y).x; }, get wy() { return camera.toWorld(this.x, this.y).y; },
      get wStartX() { return camera.toWorld(this.startX, this.startY).x; }, get wStartY() { return camera.toWorld(this.startX, this.startY).y; } };
    const pointers = new Map();     // all non-UI pointers (multitouch)
    let touchMode = window.matchMedia && matchMedia('(pointer: coarse)').matches;
    const stick = { id: null, ox: 0, oy: 0, kx: 0, ky: 0, r: 90 };
    // Touch overlay config: scene.touch overrides MANIFEST.touch (set scene.touch = null to hide).
    const tc = () => { const sc = scenes.current; return sc && sc.touch !== undefined ? (sc.touch || NO_TOUCH) : MF.touch; };
    const NO_TOUCH = { stick: false, buttons: [] };
    let tbtn = [], tbtnFor = null;
    function syncButtons() {
      const c = tc();
      if (c !== tbtnFor) { tbtnFor = c; tbtn = (c.buttons || []).map(b => ({ action: b.action, label: b.label || '', icon: b.icon || null, color: b.color || 'purple', x: 0, y: 0, r: b.r || 72, id: null })); api.layoutTouch(); }
      return tbtn;
    }
    const toL = e => ({ x: e.clientX / view.scale - view.ox, y: e.clientY / view.scale - view.oy });
    const overlayOn = () => { if (!touchMode || !scenes.current || !scenes.current.gameplay || sys.paused || sys.modal) return false; const c = tc(); syncButtons(); return !!(c.stick || tbtn.length); };
    const press = a => { if (a === 'pause') { if (!sys.modal) sys.paused ? resumeGame() : pauseGame(); return; } held.add(a); pr.add(a); };

    window.addEventListener('keydown', e => {
      audio.unlock();
      if (e.code === 'Backquote') { debug.on = !debug.on; return; }
      if (!sys.ad && !e.ctrlKey && !e.metaKey) { if (e.key.length === 1) typed.push(e.key); else if (e.key === 'Backspace') typed.push('\b'); else if (e.key === 'Enter') typed.push('\n'); }
      const acts = keyMap[e.code];
      if (!acts) { if (e.key === 'Backspace' || e.key === ' ') e.preventDefault(); return; }
      e.preventDefault(); touchMode = false;
      if (e.repeat || sys.ad) return;
      acts.forEach(press);
    });
    window.addEventListener('keyup', e => { const acts = keyMap[e.code]; if (!acts) return; acts.forEach(a => { held.delete(a); rl.add(a); }); });
    window.addEventListener('blur', () => held.clear());

    canvas.addEventListener('pointerdown', e => {
      e.preventDefault(); audio.unlock(); try { canvas.focus({ preventScroll: true }); } catch (_) {}
      if (e.pointerType === 'touch' || e.pointerType === 'pen') touchMode = true; else if (e.pointerType === 'mouse') touchMode = false;
      if (sys.ad) return;
      const q = toL(e);
      try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
      if (sys.crashed) { if (q.y > view.h - 260) location.reload(); return; }
      if (ui.down(q.x, q.y, e.pointerId)) return;
      if (overlayOn()) {
        for (const b of tbtn) if (b.id == null && M.dist(q.x, q.y, b.x, b.y) < b.r * 1.3) { b.id = e.pointerId; vHeld.add(b.action); pr.add(b.action); haptic('light'); return; }
        if (tc().stick && stick.id == null && q.x < view.w * 0.5) { stick.id = e.pointerId; stick.ox = q.x; stick.oy = q.y; stick.kx = stick.ky = 0; return; }
      }
      if (sys.paused) return;
      pointers.set(e.pointerId, { id: e.pointerId, x: q.x, y: q.y, startX: q.x, startY: q.y, downAt: performance.now(), pressed: true });
      if (p.id != null) return;
      p.id = e.pointerId; p.down = true; p.pressed = true; p.dragging = false;
      p.x = p.startX = p._lx = q.x; p.y = p.startY = p._ly = q.y; p.dx = p.dy = p.vx = p.vy = 0; p.downAt = p._lt = performance.now(); p.holdTime = 0;
    });
    canvas.addEventListener('pointermove', e => {
      const q = toL(e);
      if (e.pointerId === stick.id) {
        let dx = q.x - stick.ox, dy = q.y - stick.oy; const d = Math.hypot(dx, dy);
        if (d > stick.r) { dx *= stick.r / d; dy *= stick.r / d; }
        stick.kx = dx; stick.ky = dy; axis.x = dx / stick.r; axis.y = dy / stick.r; return;
      }
      ui.move(q.x, q.y, e.pointerId);
      const pt = pointers.get(e.pointerId); if (pt) { pt.x = q.x; pt.y = q.y; }
      if (e.pointerId === p.id || p.id == null) { p.x = q.x; p.y = q.y; }
      if (e.pointerId === p.id) {
        p.dx = p.x - p.startX; p.dy = p.y - p.startY;
        if (!p.dragging && Math.hypot(p.dx, p.dy) > 14) p.dragging = true;
        const now = performance.now(), dt = Math.max(1, now - p._lt) / 1000;
        p.vx = p.vx * 0.5 + (q.x - p._lx) / dt * 0.5; p.vy = p.vy * 0.5 + (q.y - p._ly) / dt * 0.5; p._lx = q.x; p._ly = q.y; p._lt = now;
      }
    });
    const up = (e, cancel) => {
      const q = toL(e);
      if (ui.up(q.x, q.y, e.pointerId)) return;
      for (const b of tbtn) if (b.id === e.pointerId) { b.id = null; if (!tbtn.some(o => o.id != null && o.action === b.action)) { vHeld.delete(b.action); rl.add(b.action); } return; }
      if (e.pointerId === stick.id) { stick.id = null; axis.x = axis.y = 0; return; }
      pointers.delete(e.pointerId);
      if (e.pointerId === p.id) {
        p.x = q.x; p.y = q.y; p.dx = p.x - p.startX; p.dy = p.y - p.startY;
        if (performance.now() - p._lt > 80) { p.vx = 0; p.vy = 0; }
        p.down = false; p.released = !cancel; p.tap = !cancel && !p.dragging && performance.now() - p.downAt < 350; p.id = null;
      }
    };
    canvas.addEventListener('pointerup', e => up(e, false));
    canvas.addEventListener('pointercancel', e => up(e, true));
    canvas.addEventListener('contextmenu', e => e.preventDefault());
    canvas.addEventListener('wheel', e => { e.preventDefault(); const q = toL(e); if (!ui.wheel(q.x, q.y, e.deltaY)) api.wheel += e.deltaY; }, { passive: false });

    const PAD_NAMES = ['PadA', 'PadB', 'PadX', 'PadY', 'PadLB', 'PadRB', 'PadLT', 'PadRT', 'PadBack', 'PadStart', 'PadL3', 'PadR3', 'PadUp', 'PadDown', 'PadLeft', 'PadRight'];
    const dz = v => Math.abs(v) < 0.2 ? 0 : (v - Math.sign(v) * 0.2) / 0.8;
    function pollPad() {
      if (!navigator.getGamepads) return;
      let gp = null; try { for (const g of navigator.getGamepads()) if (g && g.connected) { gp = g; break; } } catch (e) { return; }
      pad.connected = !!gp;
      if (!gp) { if (padHeld.size) { padHeld.forEach(a => rl.add(a)); padHeld.clear(); } pad.x = pad.y = pad.ax = pad.ay = 0; return; }
      const now = new Set();
      gp.buttons.forEach((b, i) => { if (b.pressed && PAD_NAMES[i] && keyMap[PAD_NAMES[i]]) keyMap[PAD_NAMES[i]].forEach(a => now.add(a)); });
      pad.x = dz(gp.axes[0] || 0); pad.y = dz(gp.axes[1] || 0); pad.ax = dz(gp.axes[2] || 0); pad.ay = dz(gp.axes[3] || 0);
      for (const a of now) if (!padHeld.has(a)) { touchMode = false; if (a === 'pause') press(a); else { pr.add(a); } }
      for (const a of padHeld) if (!now.has(a)) rl.add(a);
      padHeld.clear(); now.forEach(a => { if (a !== 'pause') padHeld.add(a); });
    }

    const api = {
      pointer: p, pointers, pad, wheel: 0,
      get typed() { return typed; },
      get touch() { return touchMode; },
      down: a => held.has(a) || vHeld.has(a) || padHeld.has(a),
      pressed: a => pr.has(a),
      released: a => rl.has(a),
      axisX() { let x = axis.x + pad.x; if (api.down('left')) x -= 1; if (api.down('right')) x += 1; return M.clamp(x, -1, 1); },
      axisY() { let y = axis.y + pad.y; if (api.down('up')) y -= 1; if (api.down('down')) y += 1; return M.clamp(y, -1, 1); },
      // Normalized movement vector (diagonals not faster).
      move() { const x = api.axisX(), y = api.axisY(), l = Math.hypot(x, y); return l > 1 ? { x: x / l, y: y / l } : { x, y }; },
      // Aim direction: right stick, else pointer relative to (fromX, fromY) in world space.
      aim(fromX, fromY) {
        if (Math.hypot(pad.ax, pad.ay) > 0.3) return { x: pad.ax, y: pad.ay, active: true };
        const dx = p.wx - fromX, dy = p.wy - fromY, l = Math.hypot(dx, dy) || 1;

      },
      poll() { pollPad(); if (p.down) p.holdTime = (performance.now() - p.downAt) / 1000; },
      endStep() { pr.clear(); rl.clear(); p.pressed = p.released = p.tap = false; typed.length = 0; api.wheel = 0; for (const pt of pointers.values()) pt.pressed = false; },
      reset() {
        held.clear(); vHeld.clear(); pr.clear(); rl.clear(); typed.length = 0; axis.x = axis.y = 0; stick.id = null; pointers.clear();
        tbtn.forEach(b => b.id = null); p.down = p.pressed = p.released = p.tap = p.dragging = false; p.id = null; p.vx = p.vy = 0;
      },
      layoutTouch() {
        tbtn.forEach((b, i) => { b.x = view.w - 110 - view.safe.right - (i % 2) * 165; b.y = view.h - 140 - view.safe.bottom - (i % 2) * 70 - Math.floor(i / 2) * 170; });
      },
      drawTouch() {
        if (!overlayOn()) return;
        if (tc().stick) {
          const ox = stick.id != null ? stick.ox : 150 + view.safe.left, oy = stick.id != null ? stick.oy : view.h - 170 - view.safe.bottom;
          ctx.globalAlpha = stick.id != null ? 0.55 : 0.25;
          ctx.beginPath(); ctx.arc(ox, oy, stick.r + 20, 0, TAU); ctx.fillStyle = color.alpha(THEME.ink, 0.5); ctx.fill();
          ctx.lineWidth = 5; ctx.strokeStyle = '#fff'; ctx.stroke();
          ctx.globalAlpha = stick.id != null ? 0.9 : 0.35;
          blob(ox + (stick.id != null ? stick.kx : 0), oy + (stick.id != null ? stick.ky : 0), 48, THEME.colors.gray);
          ctx.globalAlpha = 1;
        }
        for (const b of tbtn) {
          ctx.globalAlpha = b.id != null ? 0.95 : 0.6;
          blob(b.x, b.y + (b.id != null ? 4 : 0), b.r * (b.id != null ? 0.92 : 1), THEME.colors[b.color] || THEME.colors.purple);
          if (b.icon) icon(b.icon, b.x, b.y, b.r * 0.8); else text(b.label, b.x, b.y, { size: 44 });
          ctx.globalAlpha = 1;
        }
      },
    };
    return api;
  })();

  /* =======================================================================
     SCENES
     ======================================================================= */
  const scenes = (() => {
    const reg = {};
    let cur = null, name = null, busy = false;
    const fade = { a: 0 };
    function swap(n, params) {
      if (!reg[n]) { reportError(new Error('Unknown scene: ' + n), 'scenes.go'); return; }
      if (cur) { if (cur.gameplay) sdk.send('gameplayStop'); safeCall(cur, 'exit'); }
      ui.clearScene(); ui.clearModals(); fx.clear(); input.reset(); camera.reset(); sys.paused = false; hitstopT = 0; acc = 0;
      name = n; cur = reg[n];
      safeCall(cur, 'enter', params || {});
      safeCall(cur, 'layout', view);
      ui.place();
      if (cur.music !== undefined) { if (cur.music) music.play(cur.music); else music.stop(); }
      if (cur.gameplay) sdk.send('gameplayStart');
      sdk.send('scene', { name: n });
    }
    return {
      add(n, def) { reg[n] = def; return def; },
      has(n) { return !!reg[n]; },
      go(n, params, opts = {}) {
        if (busy) return;
        if (!cur || opts.instant) { swap(n, params); return; }
        busy = true;
        tween(fade, { a: 1 }, 0.16, Ease.inQuad).then(() => { swap(n, params); tween(fade, { a: 0 }, 0.22, Ease.outQuad).then(() => busy = false); });
      },
      get current() { return cur; },
      get name() { return name; },
      get list() { return Object.keys(reg); },
      fade,
      layout() { safeCall(cur, 'layout', view); ui.place(); },
    };
  })();

  /* =======================================================================
     ADS
     ======================================================================= */
  const devAd = { on: false, t: 0, kind: '', res: null };
  async function adBreak(kind = 'midgame') {
    if (sys.ad) return { shown: false, granted: false };
    sys.ad = true; input.reset(); updateDuck(); sdk.send('gameplayStop');
    let r = null;
    if (sdk.connected) r = await sdk.request('adBreak', { kind }, 90000);
    else if (!sdk.inFrame) r = await new Promise(res => { Object.assign(devAd, { on: true, t: kind === 'rewarded' ? 2 : 1, kind, res }); });
    sys.ad = false; updateDuck(); last = performance.now();
    if (scenes.current && scenes.current.gameplay && !sys.paused) sdk.send('gameplayStart');
    r = r || {};
    return { shown: !!r.shown, granted: kind === 'rewarded' && !!r.granted };
  }

  /* =======================================================================
     DEBUG
     ======================================================================= */
  const debug = { on: /[?&]debug/.test(location.search), fps: 60, steps: 0, low: 0 };

  /* ---------- system pause overlay widgets ---------- */
  ui.button({ group: 'sys', label: 'RESUME', icon: 'play', color: 'green', w: 400, h: 120, key: 'action', pulse: true,
    place: v => ({ x: v.w / 2, y: v.h / 2 + 10 }), onTap: resumeGame });
  ui.soundButton({ group: 'sys', place: v => ({ x: v.w / 2 - 130, y: v.h / 2 + 165 }) });
  ui.musicButton({ group: 'sys', place: v => ({ x: v.w / 2, y: v.h / 2 + 165 }) });
  const sysHome = ui.button({ group: 'sys', icon: 'home', color: 'red', w: 110, h: 110,
    place: v => ({ x: v.w / 2 + 130, y: v.h / 2 + 165 }),
    onTap: () => { const sc = scenes.current; sys.paused = false; safeCall(sc, 'onQuit'); } });

  /* =======================================================================
     MAIN LOOP — fixed-step sim (60 Hz), per-frame presentation
     ======================================================================= */
  const STEP = 1 / 60, MAX_STEPS = 6;
  let last = 0, acc = 0, clock = 0, frameN = 0;
  function frame(now) {
    requestAnimationFrame(frame);
    let dt = (now - last) / 1000; last = now;
    if (!(dt > 0)) dt = 0; if (dt > 0.1) dt = 0.1;
    if (dt > 0) debug.fps += (1 / dt - debug.fps) * 0.05;
    frameN++;
    // adaptive resolution: drop DPR if we're struggling
    if (frameN > 120 && debug.fps < 42 && view.dprCap > 1) { if (++debug.low > 90) { view.dprCap = Math.max(1, view.dprCap - 0.5); debug.low = 0; resize(); } } else debug.low = 0;
    if (devAd.on) { devAd.t -= dt; if (devAd.t <= 0) { devAd.on = false; devAd.res({ shown: true, granted: true }); } }
    sys.rotate = input.touch && ((MF.orientation === 'landscape' && view.fullH > view.fullW * 1.1) || (MF.orientation === 'portrait' && view.fullW > view.fullH * 1.1));
    const sc = scenes.current;
    input.poll();
    if (!sys.frozen && sc) {
      clock += dt;
      updateTweens(dt);
      ui.update(dt);
      ui.keys();
      if (!sys.simHalted) {
        let steps = 0;
        if (hitstopT > 0) hitstopT -= dt;
        else {
          acc += dt;
          while (acc >= STEP && steps < MAX_STEPS) {
            safeCall(sc, 'update', STEP); input.endStep(); acc -= STEP; steps++;
            if (scenes.current !== sc || sys.simHalted) break;
          }
          if (steps === MAX_STEPS) acc = 0;
        }
        debug.steps = steps;
        safeCall(sc, 'frame', dt);
        fx.update(dt);
      } else if (sys.modal && !sys.paused) { fx.update(dt); input.endStep(); }
      camera.update(dt, M.clamp(acc / STEP, 0, 1));
    }
    ui.place();
    render();
  }

  function render() {
    const s = view.dpr * view.scale, sc = scenes.current, alpha = M.clamp(acc / STEP, 0, 1);
    ctx = mainCtx;
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1;
    ctx.fillStyle = THEME.bg; ctx.fillRect(0, 0, canvas.width, canvas.height);
    const ox = view.ox, oy = view.oy;
    // world layer (shakes; camera)
    ctx.setTransform(s, 0, 0, s, (ox + fx.offset.x) * s, (oy + fx.offset.y) * s);
    if (sc) safeCall(sc, 'backdrop', ctx, alpha);
    ctx.save(); camera.apply(ctx);
    if (sc) safeCall(sc, 'render', ctx, alpha);
    fx.draw(false);
    ctx.restore();
    // screen layer (stable)
    ctx.setTransform(s, 0, 0, s, ox * s, oy * s);
    if (sc) safeCall(sc, 'hud', ctx, alpha);
    fx.draw(true);
    input.drawTouch();
    ui.draw('scene');
    fx.drawFlash();
    ui.drawModals();
    ui.drawToasts();
    if (sys.paused) {
      ctx.fillStyle = 'rgba(20,18,50,0.62)'; ctx.fillRect(-ox, -oy, view.fullW, view.fullH);
      panel(view.w / 2, view.h / 2 + 50, 540, 480, { title: 'PAUSED', color: 'purple' });
      sysHome.visible = !!(sc && sc.onQuit);
      ui.draw('sys');
    }
    if (sys.rotate) {
      ctx.fillStyle = THEME.bg; ctx.fillRect(-ox, -oy, view.fullW, view.fullH);
      ctx.save(); ctx.translate(view.w / 2, view.h / 2 - 60); ctx.rotate(Math.sin(clock * 3) * 0.6);
      block(-70, -110, 140, 220, 'blue', { r: 24 }); ctx.restore();
      text('Rotate your device', view.w / 2, view.h / 2 + 120, { size: 48, maxW: view.w - 60 });
    }
    if (devAd.on) {
      ctx.fillStyle = '#0d0c22'; ctx.fillRect(-ox, -oy, view.fullW, view.fullH);
      text('AD BREAK', view.w / 2, view.h / 2 - 50, { size: 72, color: '#ffe680' });
      text(`${devAd.kind} · dev stub · ${Math.ceil(devAd.t)}`, view.w / 2, view.h / 2 + 40, { size: 32, color: '#aab2c8' });
    }
    if (sys.crashed) {
      ctx.fillStyle = 'rgba(16,10,30,0.88)'; ctx.fillRect(-ox, -oy, view.fullW, view.fullH);
      icon('skull', view.w / 2, view.h / 2 - 170, 140, '#ff9a9a');
      text('Oops! The game crashed.', view.w / 2, view.h / 2 - 40, { size: 50, maxW: view.w - 60 });
      label(sys.crashed.where + ': ' + sys.crashed.message, view.w / 2, view.h / 2 + 40, { size: 26, color: '#ffb0b0', maxW: view.w - 60 });
      block(view.w / 2 - 190, view.h - 220, 380, 110, 'green', { r: 36 }); text('RESTART', view.w / 2, view.h - 170, { size: 48 });
    }
    if (scenes.fade.a > 0) { ctx.globalAlpha = scenes.fade.a; ctx.fillStyle = THEME.bg; ctx.fillRect(-ox, -oy, view.fullW, view.fullH); ctx.globalAlpha = 1; }
    if (debug.on) {
      const lines = [`${debug.fps | 0} fps · ${debug.steps} steps · ${fx.count} fx · ${spriteCache.size} spr`, `${view.w | 0}×${view.h | 0} @${(view.dpr * view.scale).toFixed(2)} · scene ${scenes.name} · k${KERNEL_VERSION}`];
      lines.forEach((l, i) => text(l, 12 - 0, 22 + i * 26 + view.safe.top, { size: 20, align: 'left', shadow: false, sw: 4 }));
    }
  }

  /* =======================================================================
     BOOT
     ======================================================================= */
  let booted = false;
  function boot(startScene, params) {
    if (booted) return; booted = true;
    // Title-card mode: the platform (window.SG_CARD) or a ?card URL boots a game's 'card' key-art scene for thumbnails.
    try { if ((window.SG_CARD || /[?&]card\b/.test(location.search)) && scenes.has('card')) startScene = 'card'; } catch (e) {}
    resize();
    window.addEventListener('resize', resize);
    if (window.visualViewport) visualViewport.addEventListener('resize', resize);
    document.addEventListener('visibilitychange', () => {
      sys.hidden = document.hidden;
      if (document.hidden) { pauseGame(); input.reset(); save.commit(); }
      updateDuck(); last = performance.now();
    });
    window.addEventListener('pagehide', () => save.commit());
    sdk.on('hello', d => {
      sdk.connected = true;
      if (d && d.save) { store.import(d.save); save.reload(); }
      if (d && typeof d.muted === 'boolean') { sys.platformMute = d.muted; updateDuck(); }
      if (d && d.debug) debug.on = true;
    });
    sdk.on('pause', () => { sys.platformPause = true; pauseGame(); updateDuck(); });
    sdk.on('resume', () => { sys.platformPause = false; updateDuck(); last = performance.now(); });
    sdk.on('mute', d => { sys.platformMute = !!(d && d.muted); updateDuck(); });
    sdk.on('debug', d => { debug.on = !!(d && d.on); });
    sdk.on('snapshot', d => {
      try {
        const w = (d && d.width) || 480, c = document.createElement('canvas'); c.width = w; c.height = Math.round(w * canvas.height / canvas.width);
        c.getContext('2d').drawImage(canvas, 0, 0, c.width, c.height);
        sdk.send('snapshot', { id: d && d.id, data: c.toDataURL('image/jpeg', 0.85) });
      } catch (err) { sdk.send('snapshot', { id: d && d.id, error: String(err) }); }
    });
    sdk.send('loadProgress', { p: 1 });
    scenes.go(startScene, params);
    sdk.send('ready', { game: MF.id, title: MF.title, version: MF.version, kernel: KERNEL_VERSION, orientation: MF.orientation, design: MF.design });
    last = performance.now();
    requestAnimationFrame(frame);
  }

<script>
"use strict";
/* §3 GAME — Hole Swallow: be the hole. Swallow cones, cars and buildings and outgrow the rival holes in 60 seconds. */

/* ---------- 3a. DATA ---------- */

  bench: { s: 19, w: 46, d: 18, h: 24, name: 'BENCHES' },
  bike: { s: 18, w: 42, d: 14, h: 28, name: 'BIKES' },
  tree: { s: 24, w: 54, d: 42, h: 92, name: 'TREES' },
  kiosk: { s: 32, w: 62, d: 46, h: 66, name: 'KIOSKS' },

const UNLOCKS = ['bench', 'tree', 'kiosk', 'car', 'bus', 'house', 'shop', 'apt', 'office', 'tower', 'sky'];
const AI_NAMES = ['Gobbler', 'Sinkhole Sam', 'Pitty', 'Void Vera', 'Munchy', 'Deep Dave', 'Grumbles', 'Slurpy'];

const SKINS = [
  { id: 'classic', name: 'Bubblegum', style: 'solid', c: ['#ff5cb4', '#ffb0dc'], price: 0 },
  { id: 'mint', name: 'Mint Swirl', style: 'stripes', c: ['#3fd6a6', '#ffffff'], price: 150 },
  { id: 'donut', name: 'Choco Donut', style: 'sprinkles', c: ['#8a4b2e', '#c07a52'], price: 300 },
  { id: 'cane', name: 'Candy Cane', style: 'stripes', c: ['#ff3b4e', '#ffffff'], price: 500 },
  { id: 'gold', name: 'Gold Rush', style: 'gold', c: ['#ffc21a', '#fff08a'], price: 800 },
  { id: 'lava', name: 'Lava Pit', style: 'lava', c: ['#ff5a1f', '#ffd23f'], price: 1200 },
  { id: 'galaxy', name: 'Galaxy', style: 'galaxy', c: ['#8f5bff', '#d2b0ff'], price: 1700 },
  { id: 'neon', name: 'Neon Ring', style: 'neon', c: ['#22d3ff', '#b0f0ff'], price: 2300 },
  { id: 'rainbow', name: 'Rainbow', style: 'rainbow', c: ['#ff4b5c', '#ffffff'], price: 3000 },

const skinById = id => SKINS.find(k => k.id === id) || SKINS[0];

/* ---------- 3b. SIMULATION (pure: no drawing, no audio, no Math.random) ---------- */
const Sim = {
  create(seed, o = {}) {
    const r = K.rng(seed), city = o.city || 1;
    const nx = Math.min(7, 4 + Math.floor((city - 1) / 2)), ny = Math.min(8, 5 + Math.floor(city / 2));
    const W = nx * BL + (nx + 1) * RD, H = ny * BL + (ny + 1) * RD;
    const s = { rng: r, t: 0, time: o.time || 60, dur: o.time || 60, city, W, H, nx, ny, objs: [], holes: [], blocks: [], rx: [], ry: [], events: [], over: false, nextId: 1,
      stats: { eaten: 0, holes: 0, swallowed: 0, unlocked: 0 }, unlock: 0 };
    for (let i = 0; i <= nx; i++) s.rx.push(i * (BL + RD) + RD / 2);
    for (let j = 0; j <= ny; j++) s.ry.push(j * (BL + RD) + RD / 2);
    // blocks: downtown near the middle, parks / homes / shops elsewhere
    for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) {
      const x = RD + i * (BL + RD), y = RD + j * (BL + RD), dc = Math.hypot((i + 0.5) / nx - 0.5, (j + 0.5) / ny - 0.5);
      let kind = dc < 0.2 ? 'downtown' : r.weighted([{ k: 'park', w: 3 }, { k: 'homes', w: 4 }, { k: 'shops', w: 3 }, { k: 'downtown', w: city > 2 ? 1.5 : 0.3 }], q => q.w).k;
      s.blocks.push({ x, y, w: BL, h: BL, kind });
    }
    if (!s.blocks.some(b => b.kind === 'park')) s.blocks[0].kind = 'park';
    for (const b of s.blocks) Sim.fillBlock(s, b);

    const cx = s.rx[Math.floor(nx / 2)], cy = s.ry[Math.floor(ny / 2)];
    const r0 = o.r0 || 30;
    s.player = Sim.addHole(s, { name: 'You', player: true, x: cx, y: cy, r: r0, spd: o.spd || 1 });
    const names = r.shuffle(AI_NAMES.slice()), spots = [[0, 0], [nx, ny], [nx, 0], [0, ny]];
    for (let i = 0; i < 3; i++) {
      const sp = spots[i];
      Sim.addHole(s, { name: names[i], x: s.rx[sp[0]], y: s.ry[sp[1]], r: 30 * (1 + 0.04 * (city - 1)), spd: Math.min(0.98, 0.8 + 0.03 * (city - 1)), rim: i,
        ai: { t: r.range(0, 0.3), dx: 0, dy: 0, target: null, wx: 0, wy: 0, aggr: r.range(0.2, 0.5) } });
    }
    s.unlocks = UNLOCKS.filter(k => s.objs.some(o => o.type === k));
    while (s.unlock < s.unlocks.length && T[s.unlocks[s.unlock]].s < s.player.r * EDIBLE) s.unlock++;
    return s;
  },
  emit(s, type, d = {}) { d.type = type; s.events.push(d); },
  addObj(s, type, x, y, v = 0, mv = null) {
    const o = { id: s.nextId++, type, s: T[type].s, x, y, px: x, py: y, v, st: 0, ft: 0, hole: null, mv, fx: x, fy: y };
    s.objs.push(o); return o;
  },
  addHole(s, o) {
    const h = { id: s.nextId++, name: o.name, player: !!o.player, x: o.x, y: o.y, px: o.x, py: o.y, r: o.r, r2: o.r * o.r, spd: o.spd || 1, rim: o.rim || 0,
      vx: 0, vy: 0, hidden: 0, ai: o.ai || null, eaten: 0, maxR: o.r };

  },
  fillBlock(s, b) {
    const r = s.rng, x0 = b.x + SW, y0 = b.y + SW, w = b.w - SW * 2, cx = b.x + b.w / 2, cy = b.y + b.h / 2;
    // sidewalk props around the block
    const side = (ax, ay, bx, by) => {
      const len = Math.hypot(bx - ax, by - ay);
      for (let d = 50; d < len - 40; d += r.range(48, 78)) {
        const k = d / len, x = ax + (bx - ax) * k, y = ay + (by - ay) * k;
        const t = r.weighted([{ t: 'cone', w: 2 }, { t: 'hydrant', w: 1 }, { t: 'lamp', w: 1.4 }, { t: 'trash', w: 1.4 }, { t: 'mailbox', w: 0.8 }, { t: 'bush', w: 1.2 }, { t: 'flower', w: 1.5 }, { t: 'person', w: 1.2 }], q => q.w).t;
        Sim.addProp(s, t, x, y);
      }
    };
    const m = SW / 2;
    side(b.x + m, b.y + m, b.x + b.w - m, b.y + m); side(b.x + m, b.y + b.h - m, b.x + b.w - m, b.y + b.h - m);
    side(b.x + m, b.y + m, b.x + m, b.y + b.h - m); side(b.x + b.w - m, b.y + m, b.x + b.w - m, b.y + b.h - m);
    const scatter = (type, n, avoid = 0) => {
      for (let i = 0; i < n; i++) {
        let x, y, tries = 0;
        do { x = r.range(x0 + 30, x0 + w - 30); y = r.range(y0 + 30, y0 + w - 30); tries++; } while (tries < 12 && Math.hypot(x - cx, y - cy) < avoid);

    } else if (b.kind === 'homes') {
      for (const [dx, dy] of [[-95, -100], [95, -100], [-95, 85], [95, 85]]) Sim.addObj(s, 'house', cx + dx, cy + dy, r.int(0, 3));
      for (const [dx, dy] of [[0, -10], [-185, -10], [185, -10]]) Sim.addProp(s, r.pick(['bush', 'tree', 'flower', 'bike', 'mailbox']), cx + dx, cy + dy);
      scatter('person', 2, 0); Sim.addObj(s, 'car', cx + r.range(-60, 60), cy - 8, r.int(0, 5));
    } else if (b.kind === 'shops') {
      Sim.addObj(s, 'shop', cx - 100, cy - 95, r.int(0, 3)); Sim.addObj(s, 'shop', cx + 100, cy - 95, r.int(0, 3));
      Sim.addObj(s, 'kiosk', cx - 120, cy + 90, r.int(0, 2)); Sim.addObj(s, 'kiosk', cx + 120, cy + 90, r.int(0, 2));
      Sim.addObj(s, 'van', cx, cy + 150, r.int(0, 3));
      for (const dx of [-40, 40]) Sim.addProp(s, 'bench', cx + dx, cy + 60);
      scatter('person', r.int(3, 6), 0); scatter('cone', 2, 0); Sim.addProp(s, 'bike', cx, cy + 15);
    } else {
      const big = s.city >= 4 && r.chance(0.6) ? 'sky' : s.city >= 3 && r.chance(0.6) ? 'tower' : s.city >= 2 && r.chance(0.6) ? 'office' : 'apt';
      Sim.addObj(s, big, cx, cy - 20, r.int(0, 2));
      for (const dx of [-170, 170]) Sim.addProp(s, 'tree', cx + dx, cy + 170);
      Sim.addProp(s, 'kiosk', cx, cy + 175); scatter('person', 3, 140);
    }
  },
  addProp(s, type, x, y) {
    const r = s.rng;

  },
  fillRoads(s) {
    const r = s.rng;
    s.ry.forEach((y, j) => {
      for (const dir of [-1, 1]) {
        const ly = y + dir * 34, n = Math.floor(s.W / 520);
        for (let i = 0; i < n; i++) {
          const type = r.chance(0.12) ? 'bus' : r.chance(0.2) ? 'van' : 'car';
          Sim.addObj(s, type, (i + r.range(0.1, 0.8)) * s.W / n, ly, r.int(0, 5), { kind: 'drive', vx: -dir * r.range(70, 120), vy: 0 });
        }
      }
    });
    s.rx.forEach(x => {
      for (const dir of [-1, 1]) {
        const lx = x + dir * 34, n = Math.floor(s.H / 640);
        for (let i = 0; i < n; i++) Sim.addObj(s, 'car', lx, (i + r.range(0.1, 0.8)) * s.H / n, r.int(0, 5), { kind: 'drive', vx: 0, vy: dir * r.range(70, 120), vert: true });
      }

    for (let k = 0; k < s.nx * s.ny; k++) {
      const x = r.pick(s.rx), y = r.range(RD, s.H - RD);

    }
  },
  edible(h, o) { return o.s < h.r * EDIBLE; },
  respawn(s, h) {
    const r = s.rng;

      const x = r.pick(s.rx), y = r.pick(s.ry);
      let d = 1e9; for (const o of s.holes) if (o !== h && !o.hidden) d = Math.min(d, Math.hypot(o.x - x, o.y - y) - o.r);

    }

    Sim.emit(s, 'respawn', { x: h.x, y: h.y, player: h.player });
  },
  think(s, h, dt) {
    const ai = h.ai;
    ai.t -= dt; if (ai.t > 0) return; ai.t = 0.3;
    let fx = 0, fy = 0, danger = 0, chase = null;
    for (const o of s.holes) {
      if (o === h || o.hidden) continue;
      const dx = o.x - h.x, dy = o.y - h.y, d = Math.max(1, Math.hypot(dx, dy));
      if (o.r > h.r * 1.25 && d < o.r + 300) { const w = 1 - Math.max(0, d - o.r) / 300; fx -= dx / d * w; fy -= dy / d * w; danger = Math.max(danger, w); }

    if (danger > 0.25) { tx = fx; ty = fy; ai.target = null; }
    else if (chase) { tx = chase.x - h.x; ty = chase.y - h.y; }
    else {
      const tg = ai.target;
      if (!tg || tg.st !== 0 || !Sim.edible(h, tg) || s.rng.chance(0.08)) {
        let best = null, bs = 0;
        for (const o of s.objs) {
          if (o.st !== 0 || !Sim.edible(h, o)) continue;
          const dx = o.x - h.x, dy = o.y - h.y;
          if (Math.abs(dx) > 900 || Math.abs(dy) > 900) continue;
          const sc = (o.s * o.s + 30) / (Math.hypot(dx, dy) + 160);
          if (sc > bs) { bs = sc; best = o; }
        }
        ai.target = best;
      }
      if (ai.target) { tx = ai.target.x - h.x; ty = ai.target.y - h.y; }
      else { if (Math.hypot(ai.wx - h.x, ai.wy - h.y) < 80 || !ai.wx) { ai.wx = s.rng.range(100, s.W - 100); ai.wy = s.rng.range(100, s.H - 100); } tx = ai.wx - h.x; ty = ai.wy - h.y; }

  step(s, dt, cmd) {

      if (o.st === 2) continue;

      if (o.st !== 0 || !o.mv) continue;
      const m = o.mv;

        const dx = m.tx - o.x, dy = m.ty - o.y, d = Math.hypot(dx, dy);
        if (d > 3) { o.x += dx / d * m.sp * dt; o.y += dy / d * m.sp * dt; }

    for (const h of s.holes) {
      h.px = h.x; h.py = h.y;
      if (h.hidden > 0) { h.hidden -= dt; if (h.hidden <= 0) Sim.respawn(s, h); continue; }
      let dx, dy, mag;
      if (h.player) { dx = cmd.mx || 0; dy = cmd.my || 0; mag = Math.min(1, Math.hypot(dx, dy)); }
      else { Sim.think(s, h, dt); dx = h.ai.dx; dy = h.ai.dy; mag = 1; }
      const l = Math.hypot(dx, dy); if (l > 0.0001) { dx /= l; dy /= l; } else mag = 0;
      const sp = (230 + h.r * 0.5) * h.spd * mag, k = Math.min(1, dt * 9);

      h.x = K.M.clamp(h.x + h.vx * dt, 0, s.W); h.y = K.M.clamp(h.y + h.vy * dt, 0, s.H);
    }

    for (const o of s.objs) {
      if (o.st !== 0) continue;
      for (const h of s.holes) {
        if (h.hidden > 0 || o.s >= h.r * EDIBLE) continue;
        const dx = o.x - h.x, dy = o.y - h.y, lim = h.r - o.s * 0.35;
        if (Math.abs(dx) < lim && Math.abs(dy) < lim && dx * dx + dy * dy < lim * lim) { o.st = 1; o.ft = 0; o.hole = h; o.fx = o.x; o.fy = o.y; break; }
      }
    }
    // falling objects slide toward the hole centre, then vanish
    for (const o of s.objs) {
      if (o.st !== 1) continue;
      const h = o.hole;
      o.ft += dt * (o.s > 60 ? 1.6 : 2.4);
      const k = Math.min(1, o.ft);
      o.x = K.M.lerp(o.fx, h.x, k * 0.7); o.y = K.M.lerp(o.fy, h.y, k * 0.7);
      if (o.ft >= 1 || h.hidden > 0) {
        o.st = 2;
        if (h.hidden > 0) continue;
        h.r2 += o.s * o.s * GROW; h.r = Math.sqrt(h.r2); h.eaten++; if (h.r > h.maxR) h.maxR = h.r;
        if (h.player) s.stats.eaten++;
        Sim.emit(s, 'eat', { x: h.x, y: h.y, ox: o.x, oy: o.y, kind: o.type, v: o.v, s: o.s, player: h.player, hole: h.id });
      }
    }
    // holes swallow smaller holes
    for (const a of s.holes) for (const b of s.holes) {
      if (a === b || a.hidden > 0 || b.hidden > 0 || a.r < b.r * 1.3) continue;
      const d = Math.hypot(a.x - b.x, a.y - b.y);
      if (d < a.r - b.r * 0.5) {
        a.r2 += b.r2 * 0.3; a.r = Math.sqrt(a.r2); if (a.r > a.maxR) a.maxR = a.r;
        b.r2 *= b.player ? 0.88 : 0.7; b.r = Math.sqrt(b.r2); b.hidden = 1.4; b.vx = b.vy = 0;
        if (a.player) s.stats.holes++;
        if (b.player) s.stats.swallowed++;
        Sim.emit(s, 'gulpHole', { x: b.x, y: b.y, r: b.r, eater: a.name, victim: b.name, byPlayer: a.player, playerVictim: b.player });
      }
    }
    K.compact(s.objs, o => o.st !== 2);
    // size thresholds for the player
    const P = s.player;
    while (s.unlock < s.unlocks.length && T[s.unlocks[s.unlock]].s < P.r * EDIBLE) { Sim.emit(s, 'unlock', { kind: s.unlocks[s.unlock] }); s.unlock++; s.stats.unlocked = s.unlock; }
    if (s.time <= 0) { s.time = 0; s.over = true; Sim.emit(s, 'time'); }
  },
  ranking(s) { return s.holes.slice().sort((a, b) => b.r - a.r); },
};

    const rr = K.rng(3), cols = ['#ff5cb4', '#fff08a', '#86d0ff', '#8af59a', '#ffffff'];
    ctx.lineCap = 'round'; ctx.lineWidth = Math.max(2, lw * 0.18);
    for (let i = 0; i < Math.max(14, r * 0.5); i++) { const a = rr() * TAU, d = r + lw * (0.3 + (rr() - 0.5) * 0.6), ang = rr() * TAU, L = lw * 0.25; ctx.strokeStyle = cols[i % 5]; ctx.beginPath(); ctx.moveTo(x + Math.cos(a) * d - Math.cos(ang) * L, y + Math.sin(a) * d - Math.sin(ang) * L); ctx.lineTo(x + Math.cos(a) * d + Math.cos(ang) * L, y + Math.sin(a) * d + Math.sin(ang) * L); ctx.stroke(); }
  }
  if (rim.style === 'gold' || rim.style === 'lava') {
    for (let i = 0; i < 5; i++) { const a = t * 0.8 + i * 1.257; K.draw.star(x + Math.cos(a) * (r + lw * 0.3), y + Math.sin(a) * (r + lw * 0.3), lw * (0.35 + 0.15 * Math.sin(t * 5 + i)), rim.style === 'gold' ? '#ffffff' : '#ffd23f', { points: 4, inner: 0.35, outline: 0 }); }
  }
  // highlight
  ctx.lineWidth = lw * 0.3; ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(x, y, r + lw * 0.3, Math.PI * 1.1, Math.PI * 1.45); ctx.stroke();
  ctx.lineWidth = 3; ctx.strokeStyle = INK; ctx.beginPath(); ctx.arc(x, y, r - lw * 0.2, 0, TAU); ctx.stroke();
}

function drawCity(ctx, s, R, t, border = true) {
  if (border) { ctx.fillStyle = '#ffd9e8'; K.draw.rr(-30, -30, s.W + 60, s.H + 60, 60); ctx.fill(); ctx.lineWidth = 8; ctx.strokeStyle = INK; ctx.stroke(); }
  // roads
  ctx.fillStyle = '#9d92cf';
  for (const x of s.rx) if (x + RD / 2 > R.x0 && x - RD / 2 < R.x1) ctx.fillRect(x - RD / 2 + 10, -20, RD - 20, s.H + 40);
  for (const y of s.ry) if (y + RD / 2 > R.y0 && y - RD / 2 < R.y1) ctx.fillRect(-20, y - RD / 2 + 10, s.W + 40, RD - 20);
  // lane dashes
  ctx.strokeStyle = '#fff08a'; ctx.lineWidth = 6; ctx.setLineDash([36, 34]); ctx.beginPath();
  for (const x of s.rx) if (x > R.x0 && x < R.x1) { ctx.moveTo(x, Math.max(-20, R.y0)); ctx.lineTo(x, Math.min(s.H + 20, R.y1)); }
  for (const y of s.ry) if (y > R.y0 && y < R.y1) { ctx.moveTo(Math.max(-20, R.x0), y); ctx.lineTo(Math.min(s.W + 20, R.x1), y); }
  ctx.stroke(); ctx.setLineDash([]);
  // crossings
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  for (const x of s.rx) for (const y of s.ry) {
    if (x < R.x0 - RD || x > R.x1 + RD || y < R.y0 - RD || y > R.y1 + RD) continue;
    ctx.fillStyle = '#9d92cf'; ctx.fillRect(x - RD / 2 + 10, y - RD / 2 + 10, RD - 20, RD - 20);
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    for (let k = -2; k <= 2; k++) { ctx.fillRect(x + k * 22 - 6, y - RD / 2 - 2, 12, 22); ctx.fillRect(x + k * 22 - 6, y + RD / 2 - 20, 12, 22); ctx.fillRect(x - RD / 2 - 2, y + k * 22 - 6, 22, 12); ctx.fillRect(x + RD / 2 - 20, y + k * 22 - 6, 22, 12); }
  }
  // blocks
  const fills = { park: '#a6eb9a', homes: '#c8f2b4', shops: '#ffe9a8', downtown: '#e0d4ff' };
  for (const b of s.blocks) {
    if (b.x + b.w < R.x0 || b.x > R.x1 || b.y + b.h < R.y0 || b.y > R.y1) continue;
    K.draw.rr(b.x - 4, b.y - 4, b.w + 8, b.h + 8, 30); ctx.fillStyle = '#ffc4dc'; ctx.fill(); ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(27,27,58,0.25)'; ctx.stroke();
    K.draw.rr(b.x + SW, b.y + SW, b.w - SW * 2, b.h - SW * 2, 22); ctx.fillStyle = fills[b.kind]; ctx.fill();
    if (b.kind === 'park') { ctx.save(); ctx.clip(); ctx.fillStyle = 'rgba(255,255,255,0.14)'; for (let i = 0; i < 8; i++) ctx.fillRect(b.x + SW + i * 60, b.y, 30, b.h); ctx.restore(); }
    if (b.kind === 'shops' || b.kind === 'downtown') { ctx.save(); ctx.clip(); ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 3; ctx.beginPath(); for (let i = 0; i < 12; i++) { ctx.moveTo(b.x + i * 40, b.y); ctx.lineTo(b.x + i * 40, b.y + b.h); ctx.moveTo(b.x, b.y + i * 40); ctx.lineTo(b.x + b.w, b.y + i * 40); } ctx.stroke(); ctx.restore(); }
  }
}
function candySky(ctx, par) {
  const v = K.view;
  K.draw.sky('#7fd4ff', '#c79bff');
  const draw = c => {
    for (let i = 0; i < 12; i++) {
      const x = (i * 467) % 2600 - 500, y = (i * 691) % 3000 - 400, r = 60 + (i * 41) % 90;
      c.fillStyle = 'rgba(255,255,255,0.35)';
      c.beginPath(); c.arc(x, y, r, 0, TAU); c.arc(x + r * 0.9, y + r * 0.2, r * 0.75, 0, TAU); c.arc(x - r * 0.9, y + r * 0.25, r * 0.7, 0, TAU); c.fill();
    }
  };
  if (par) K.camera.parallax(ctx, 0.1, draw); else { ctx.save(); ctx.translate(-v.ox + Math.sin(K.time * 0.2) * 20, 0); draw(ctx); ctx.restore(); }
}
function drawLogo(ctx, x, y, s, big = 1, rot = -0.05) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.rotate(rot);
  K.draw.text('HOLE', 0, -72 * big, { size: 150 * big, color: '#ff5cb4', sw: 16 * big });
  K.draw.text('SWALLOW', 0, 60 * big, { size: 116 * big, color: '#fff08a', sw: 15 * big, maxW: 640 * big });
  ctx.restore();
}

K.scenes.add('play', {
  gameplay: true, pausable: true, music: 'upbeat', touch: null,
  enter() {
    const up = K.meta.upgrades;
    this.s = Sim.create((Math.random() * 2 ** 31) | 0, { city: SAVE.city, r0: 30 + up.value('size'), spd: up.value('speed'), time: gameTime() });
    this.skin = curSkin();
    const P = this.s.player;
    K.camera.follow(P, { lerp: 7, snap: true });
    K.camera.zoom = 1.15;
    this.drag = null; this.tut = SAVE.tut ? 9 : 0; this.tutT = 0; this.moved = 0;
    this.sizeFx = { s: 1 }; this.call = []; this.endT = -1; this.lastSec = Math.ceil(this.s.time);
    this.combo = 0; this.comboT = 0; this.bumpT = 0; this.rank = Sim.ranking(this.s); this.rankT = 0;
    this.drawR = new Map();
    K.ui.pauseButton();
    K.audio.play('whoosh');
    this.callout('CITY ' + this.s.city, '#fff08a', 80);
  },
  onQuit() { K.scenes.go('title'); },
  callout(text, color = '#fff08a', size = 76) {
    const c = { text, color, size, s: 0, a: 1 };
    K.tween(c, { s: 1 }, 0.4, K.Ease.outBack);
    K.tween(c, { a: 0 }, 0.35, K.Ease.inQuad, 1.2).then(() => { const i = this.call.indexOf(c); if (i >= 0) this.call.splice(i, 1); });
    this.call.push(c); if (this.call.length > 2) this.call.shift();
  },
  update(dt) {
    const s = this.s, P = s.player, inp = K.input, p = inp.pointer;
    if (this.endT >= 0) { this.endT -= dt; if (this.endT < 0) this.finish(); return; }
    // relative drag steering: direction & strength come from how far the finger moved from where it went down
    let mx = inp.axisX(), my = inp.axisY();
    if (p.down) {
      if (!this.drag) this.drag = { x: p.startX, y: p.startY };
      let dx = p.x - this.drag.x, dy = p.y - this.drag.y; const d = Math.hypot(dx, dy), max = 110;
      if (d > max) { this.drag.x = p.x - dx / d * max; this.drag.y = p.y - dy / d * max; dx = dx / d * max; dy = dy / d * max; }
      if (d > 8) { mx = dx / max; my = dy / max; }
    } else this.drag = null;
    if (Math.hypot(mx, my) > 0.2) this.moved += dt;
    if (this.tut === 0 && this.moved > 1.2) { this.tut = 1; this.tutT = 0; }
    this.tutT += dt;
    if (this.tut === 1 && this.tutT > 4) { this.tut = 9; SAVE.tut = 1; K.save.commit(); }
    Sim.step(s, dt, { mx, my });
    for (const e of s.events) this.present(e);
    s.events.length = 0;
    this.comboT -= dt; if (this.comboT <= 0) this.combo = 0;
    this.rankT -= dt; if (this.rankT <= 0) { this.rankT = 0.25; this.rank = Sim.ranking(s); }
    const sec = Math.ceil(s.time);
    if (sec < this.lastSec && sec <= 5 && sec > 0) { K.audio.play('tick'); this.callout(String(sec), '#ff9a9a', 110); }
    this.lastSec = sec;
    // bump feedback when touching something too big
    this.bumpT -= dt;
    if (this.bumpT <= 0 && P.hidden <= 0) for (const o of s.objs) {
      if (o.st !== 0 || o.s < P.r * EDIBLE) continue;
      const d = Math.hypot(o.x - P.x, o.y - P.y);
      if (d < P.r + o.s * 0.3 && d > o.s * 0.2) { this.bumpT = 1.2; K.audio.play('tink', 0.6); K.fx.text(o.x, o.y - T[o.type].h * HK - 20, 'TOO BIG!', { size: 34 / K.camera.zoom, color: '#ff9a9a', rise: 60 }); break; }
    }
  },
  present(e) {
    const s = this.s, R = K.camera.rect, vis = (x, y) => x > R.x0 && x < R.x1 && y > R.y0 && y < R.y1;
    switch (e.type) {
      case 'eat':
        if (e.player) {
          this.combo++; this.comboT = 1.0;
          const big = e.s >= 30, z = K.camera.zoom;
          K.audio.play(big ? 'thud' : 'gulp', big ? 1 : 0.9 + Math.min(this.combo, 15) * 0.05);
          K.haptic(big ? 'medium' : 'light');
          K.fx.burst(e.x, e.y, { count: big ? 18 : 6, colors: ['#ffffff', this.skin.c[0], this.skin.c[1]], speed: [100, big ? 520 : 260], size: [4, big ? 12 : 7], gravity: 400 });
          K.fx.ring(e.x, e.y, { r0: s.player.r * 0.8, r1: s.player.r * 1.25, color: this.skin.c[1], width: big ? 12 : 6, life: 0.3 });
          K.fx.text(e.x, e.y - s.player.r - 20, '+' + Math.max(1, Math.round(e.s * e.s * GROW / 100)), { size: (big ? 54 : 38) / z, color: '#fff08a', rise: 90 / z });
          if (big) { K.fx.shake(e.s >= 90 ? 16 : 8, 0.25); if (e.s >= 90) K.fx.hitstop(0.05); }
          K.tween(this.sizeFx, { s: 1.25 }, 0.05).then(() => K.tween(this.sizeFx, { s: 1 }, 0.35, K.Ease.outElastic));
          if (this.combo === 10 || this.combo === 25 || this.combo === 50) { this.callout(this.combo + ' COMBO!', '#ff9ad6'); K.audio.play('power'); }
          if (e.s >= 120) this.callout(T[e.kind].name.replace(/S$/, '') + '!', '#86d0ff', 86);
        } else if (vis(e.x, e.y)) { K.audio.play('gulp', 0.7); K.fx.burst(e.x, e.y, { count: 4, colors: ['#ffffff'], speed: [60, 200], size: [3, 6] }); }
        break;
      case 'unlock':
        this.callout('NOW: ' + T[e.kind].name + '!', '#8af59a', 70); K.audio.play('levelup'); K.haptic('success');
        K.fx.burst(K.view.w / 2, K.view.h * 0.32, { screen: true, shape: 'star', colors: ['#fff08a', '#ff5cb4', '#86d0ff'], count: 22, speed: [250, 650] });
        break;
      case 'gulpHole':
        if (e.byPlayer) { this.callout('GULPED ' + e.victim.toUpperCase() + '!', '#fff08a', 64); K.audio.play('explode'); K.fx.shake(18, 0.4); K.haptic('heavy'); K.fx.burst(e.x, e.y, { count: 30, shape: 'star', colors: ['#fff08a', '#ffffff'], speed: [200, 700] }); }
        else if (e.playerVictim) { this.callout('SWALLOWED BY ' + e.eater.toUpperCase() + '!', '#ff9a9a', 56); K.audio.play('hurt'); K.fx.shake(20, 0.4); K.fx.flash('#ff4b5c', 0.4); K.haptic('fail'); }
        else if (vis(e.x, e.y)) { K.audio.play('gulp', 0.5); K.fx.ring(e.x, e.y, { r0: 10, r1: e.r * 2, color: '#ffffff' }); }
        break;
      case 'respawn':
        if (e.player) { K.audio.play('pop'); K.fx.ring(e.x, e.y, { r0: 10, r1: 120, color: this.skin.c[0], width: 12 }); }
        break;
      case 'time':
        this.callout("TIME'S UP!", '#fff08a', 96); K.audio.play('win'); K.haptic('success'); this.endT = 1.4;
        break;
    }
  },
  finish() {
    const s = this.s, rank = Sim.ranking(s);
    K.scenes.go('over', { score: Math.round(s.player.r), rank: rank.map(h => ({ name: h.name, r: Math.round(h.r), player: h.player, rim: h.player ? this.skin : AI_RIMS[h.rim] })), place: rank.indexOf(s.player) + 1, city: s.city, eaten: s.stats.eaten });
  },
  frame(dt) {
    const P = this.s.player;
    for (const h of this.s.holes) { const d = this.drawR.get(h.id) || h.r; this.drawR.set(h.id, K.M.damp(d, h.hidden > 0 ? 0 : h.r, 8, dt)); }
    const z = K.M.clamp(360 / (P.r * 2.7 + 230), 0.2, 1.2);
    K.camera.zoom = K.M.damp(K.camera.zoom, z, 1.4, dt);
  },
  backdrop(ctx) { candySky(ctx, true); },
  render(ctx, al) {
    const s = this.s, R = K.camera.rect, t = K.time;
    drawCity(ctx, s, R, t);
    // holes (with their skins), then whatever is falling into them, clipped by the hole's front lip
    for (const h of s.holes) {
      const r = this.drawR.get(h.id) || h.r; if (r < 2) continue;
      const x = K.M.lerp(h.px, h.x, al), y = K.M.lerp(h.py, h.y, al);
      drawHole(ctx, x, y, r, h.player ? this.skin : AI_RIMS[h.rim], t);
    }
    for (const o of s.objs) {
      if (o.st !== 1) continue;
      const h = o.hole, hx = K.M.lerp(h.px, h.x, al), hy = K.M.lerp(h.py, h.y, al), hr = this.drawR.get(h.id) || h.r;
      const f = Math.min(1, o.ft), x = K.M.lerp(o.px, o.x, al), y = K.M.lerp(o.py, o.y, al);
      ctx.save(); ctx.beginPath(); ctx.arc(hx, hy, hr * 0.98, 0, TAU); ctx.rect(hx - hr * 0.98, hy - 2000, hr * 1.96, 2000); ctx.clip();
      drawObj(o, x, y + f * f * (T[o.type].h * HK + o.s * 1.4), { rot: (x < hx ? 1 : -1) * f * 1.1, scale: 1 - f * 0.3 });
      ctx.restore();
    }
    // standing objects, painter-sorted by ground y; edible ones near a hole teeter toward it
    const list = [];
    for (const o of s.objs) {
      if (o.st !== 0) continue;
      const th = T[o.type].h * HK + 40;
      if (o.x < R.x0 - 180 || o.x > R.x1 + 180 || o.y < R.y0 - 60 || o.y > R.y1 + th) continue;
      list.push(o);
    }
    list.sort((a, b) => a.y - b.y);
    const P = s.player;
    for (const o of list) {
      let x = K.M.lerp(o.px, o.x, al), y = K.M.lerp(o.py, o.y, al), rot = 0;
      if (o.mv && o.mv.kind === 'walk') y -= Math.abs(Math.sin(t * 8 + o.id)) * 3;
      for (const h of s.holes) {
        if (h.hidden > 0) continue;
        const dx = h.x - o.x, dy = h.y - o.y, d = Math.hypot(dx, dy), reach = h.r + o.s * 0.6;
        if (d < reach) {
          if (o.s < h.r * EDIBLE) rot = K.M.clamp((reach - d) / (o.s + 10), 0, 1) * 0.35 * Math.sign(dx || 1);
          else { x += Math.sin(t * 40 + o.id) * 1.5; }
        }
      }
      drawObj(o, x, y, rot ? { rot } : undefined);
    }
    // name tags for rival holes
    for (const h of s.holes) {
      if (h.player || h.hidden > 0) continue;
      const sz = Math.max(26, 30 / K.camera.zoom);
      K.draw.text(h.name, h.x, h.y - h.r - sz, { size: sz, color: AI_RIMS[h.rim].c[1], sw: sz * 0.2 });
    }
    if (P.hidden <= 0) { const hr = this.drawR.get(P.id) || P.r; ctx.lineWidth = 5 / Math.max(0.5, K.camera.zoom); ctx.setLineDash([18, 14]); ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.beginPath(); ctx.arc(K.M.lerp(P.px, P.x, al), K.M.lerp(P.py, P.y, al), hr, 0, TAU); ctx.stroke(); ctx.setLineDash([]); }
    // player progress ring toward the next size class
    if (P.hidden <= 0 && s.unlock < s.unlocks.length) {
      const need = T[s.unlocks[s.unlock]].s / EDIBLE, prev = s.unlock ? T[s.unlocks[s.unlock - 1]].s / EDIBLE : 0;
      const k = K.M.clamp((P.r - prev) / (need - prev), 0, 1), hr = this.drawR.get(P.id) || P.r, rr = hr + Math.max(6, hr * 0.13) + 12;
      const x = K.M.lerp(P.px, P.x, al), y = K.M.lerp(P.py, P.y, al);
      ctx.lineCap = 'round'; ctx.lineWidth = 8 / Math.max(0.5, K.camera.zoom);
      ctx.strokeStyle = 'rgba(27,27,58,0.35)'; ctx.beginPath(); ctx.arc(x, y, rr, 0, TAU); ctx.stroke();
      ctx.strokeStyle = '#8af59a'; ctx.beginPath(); ctx.arc(x, y, rr, -Math.PI / 2, -Math.PI / 2 + k * TAU); ctx.stroke();
    }
  },
  hud(ctx) {
    const v = K.view, st = v.safe.top, s = this.s, P = s.player;
    // size + next class
    ctx.save(); ctx.translate(34 + v.safe.left, 80 + st); ctx.scale(this.sizeFx.s, this.sizeFx.s);
    K.draw.text('SIZE', 0, -32, { size: 26, align: 'left', sw: 5, color: '#ffb0dc' });
    K.draw.text(String(Math.round(P.r)), 0, 14, { size: 60, align: 'left' });
    ctx.restore();
    if (s.unlock < s.unlocks.length) {
      const nk = s.unlocks[s.unlock];
      K.draw.pill(34 + v.safe.left + 110, 158 + st, 'NEXT: ' + T[nk].name, { size: 24, minW: 220, color: '#8af59a' });
    }
    // timer
    const low = s.time <= 10;
    ctx.save(); ctx.translate(v.w / 2, 66 + st); if (low) { const k = 1 + 0.07 * Math.sin(K.time * 12); ctx.scale(k, k); }
    K.draw.pill(0, 0, K.fmtTime(Math.ceil(s.time)), { size: 40, minW: 170, color: low ? '#ff9a9a' : '#ffffff' });
    ctx.restore();
    // live ranking
    const lw = 250, x0 = v.w - 18 - v.safe.right - lw, y0 = 128 + st;
    K.draw.rr(x0, y0, lw, 30 + this.rank.length * 40, 22); ctx.fillStyle = 'rgba(27,27,58,0.45)'; ctx.fill();
    this.rank.forEach((h, i) => {
      const y = y0 + 34 + i * 40, rim = h.player ? this.skin : AI_RIMS[h.rim];
      ctx.beginPath(); ctx.arc(x0 + 26, y, 12, 0, TAU); ctx.fillStyle = '#140828'; ctx.fill(); ctx.lineWidth = 6; ctx.strokeStyle = rim.c[0]; ctx.stroke();
      K.draw.text((i + 1) + '. ' + h.name, x0 + 48, y, { size: 24, align: 'left', sw: 4, color: h.player ? '#fff08a' : '#ffffff', shadow: false, maxW: lw - 110 });
      K.draw.text(String(Math.round(h.r)), x0 + lw - 14, y, { size: 24, align: 'right', sw: 4, color: h.player ? '#fff08a' : '#ffffff', shadow: false });
    });
    // callouts
    this.call.forEach((c, i) => {
      ctx.save(); ctx.globalAlpha = c.a; ctx.translate(v.w / 2, v.h * 0.3 + i * 96); ctx.scale(c.s, c.s); ctx.rotate(-0.04);
      K.draw.text(c.text, 0, 0, { size: c.size, color: c.color, maxW: v.w - 60 }); ctx.restore();
    });
    // drag knob feedback
    const p = K.input.pointer;
    if (this.drag && p.down) {
      ctx.globalAlpha = 0.35; ctx.beginPath(); ctx.arc(this.drag.x, this.drag.y, 110, 0, TAU); ctx.fillStyle = INK; ctx.fill(); ctx.globalAlpha = 0.7;
      K.draw.blob(p.x, p.y, 40, 'pink'); ctx.globalAlpha = 1;
    }
    this.drawHint(ctx);
  },
  drawHint(ctx) {
    if (this.tut >= 9 || this.endT >= 0) return;
    const v = K.view, t = K.time;
    if (this.tut === 0) {
      const a = t * 2.2, fx = v.w / 2 + Math.cos(a) * 90, fy = v.h * 0.72 + Math.sin(a) * 50;
      ctx.globalAlpha = 0.85;
      ctx.beginPath(); ctx.arc(v.w / 2, v.h * 0.72, 12, 0, TAU); ctx.fillStyle = '#ffffff'; ctx.fill();
      ctx.beginPath(); ctx.arc(fx, fy, 32, 0, TAU); ctx.fillStyle = '#ffffff'; ctx.fill(); ctx.lineWidth = 5; ctx.strokeStyle = INK; ctx.stroke();
      K.draw.capsule(fx - 19, fy + 10, 38, 96, ['#ffffff', '#f0eef6', '#cfc9d9'], { outline: 5 });
      ctx.globalAlpha = 1;
      K.draw.text(K.input.touch ? 'DRAG ANYWHERE TO MOVE' : 'DRAG OR USE ARROWS / WASD', v.w / 2, v.h * 0.6, { size: 42, color: '#fff08a', maxW: v.w - 60 });
    } else if (this.tut === 1) {
      const k = 1 + 0.06 * Math.sin(t * 8);
      ctx.save(); ctx.translate(v.w / 2, v.h * 0.62); ctx.scale(k, k);
      K.draw.text('Swallow things SMALLER', 0, 0, { size: 42, color: '#ffffff', maxW: v.w - 60 });
      K.draw.text('than your hole to grow!', 0, 54, { size: 42, color: '#8af59a', maxW: v.w - 60 });
      ctx.restore();
    }
  },
});

K.scenes.add('over', {
  music: 'menuUp',
  enter(p) {
    const v = K.view;
    this.p = p;
    const score = p.score, prev = SAVE.best;
    this.newBest = score > prev; if (this.newBest) SAVE.best = score;
    this.best = Math.max(prev, score);
    SAVE.rounds++;
    this.won = p.place === 1;
    this.cityUp = false;
    if (this.won) { SAVE.wins++; if (p.city === SAVE.city && SAVE.city < 12) { SAVE.city++; this.cityUp = true; } }
    this.coins = Math.round(score / 2.5) + [40, 20, 10, 5][p.place - 1] + Math.floor(p.eaten / 10);
    K.meta.wallet.add('coins', this.coins);
    K.save.commit();
    this.doubled = false;
    K.sdk.send('score', { value: score });
    this.shown = { n: 0 }; this.coinShow = { n: 0 }; this.pan = { s: 0 };
    K.tween(this.shown, { n: score }, 1.0, K.Ease.outCubic, 0.3);
    K.tween(this.coinShow, { n: this.coins }, 0.9, K.Ease.outCubic, 0.9);
    K.tween(this.pan, { s: 1 }, 0.5, K.Ease.outBack);
    K.wait(0.9).then(() => K.audio.play('coin'));
    if (this.newBest || this.won) K.wait(1.0).then(() => {
      K.audio.play('win'); K.haptic('success');
      K.fx.burst(v.w / 2, v.h * 0.3, { screen: true, shape: 'star', colors: ['#fff08a', '#ff5cb4', '#86d0ff', '#ffffff'], count: 46, speed: [300, 900], size: [10, 20] });
    });
    if (this.cityUp) K.wait(1.6).then(() => K.audio.play('levelup'));
    const cy = v => v.h * 0.43;
    K.ui.button({ icon: 'home', color: 'blue', w: 120, h: 120, popIn: 0.35, place: v => ({ x: v.w / 2 - 210, y: cy(v) + 420 }), onTap: () => K.scenes.go('title') });
    K.ui.button({ label: 'RETRY', icon: 'retry', color: 'pink', w: 300, h: 120, key: 'action', pulse: true, popIn: 0.45,
      place: v => ({ x: v.w / 2 + 70, y: cy(v) + 420 }),
      onTap: async () => { runs++; if (runs % 3 === 0) await K.adBreak('midgame'); K.scenes.go('play'); } });
    const dbl = K.ui.button({ label: '2x COINS', icon: 'video', color: 'purple', w: 440, h: 104, popIn: 0.55,
      place: v => ({ x: v.w / 2, y: cy(v) + 550 }),
      onTap: async () => {
        if (this.doubled) return;
        dbl.enabled = false;
        const r = await K.adBreak('rewarded');
        if (r.granted) {
          this.doubled = true; dbl.visible = false;
          K.meta.wallet.add('coins', this.coins); K.save.commit();
          K.tween(this.coinShow, { n: this.coins * 2 }, 0.8, K.Ease.outCubic);
          K.audio.play('coin'); K.audio.play('levelup'); K.haptic('success');
          K.fx.burst(v.w / 2, cy(v) + 170, { screen: true, shape: 'star', colors: ['#fff08a', '#ffc21a'], count: 30, speed: [200, 700] });
        } else dbl.label = 'NO AD';
      } });
  },
  backdrop(ctx) { candySky(ctx, false); },
  hud(ctx) {
    const v = K.view, cy = v.h * 0.43, p = this.p;
    ctx.save(); ctx.translate(v.w / 2, cy); ctx.scale(this.pan.s, this.pan.s);
    K.draw.panel(0, 0, 620, 660, { title: this.won ? 'YOU WIN!' : "TIME'S UP!", color: this.won ? 'yellow' : 'pink' });
    K.draw.label('FINAL SIZE', 0, -240, { size: 30, color: '#7a6f99' });
    K.draw.text(Math.round(this.shown.n).toLocaleString(), 0, -178, { size: 96, color: '#ff5cb4' });
    if (this.newBest) { ctx.save(); ctx.translate(0, -116); ctx.rotate(-0.04 + Math.sin(K.time * 4) * 0.04); K.draw.text('NEW BEST!', 0, 0, { size: 38, color: '#8af59a' }); ctx.restore(); }
    else K.draw.label('Best ' + this.best, 0, -118, { size: 26, color: '#7a6f99' });
    // ranking
    p.rank.forEach((h, i) => {
      const y = -70 + i * 62, me = h.player;
      K.draw.rr(-250, y - 26, 500, 52, 16); ctx.fillStyle = me ? '#fff0b8' : '#f3eefa'; ctx.fill();
      if (me) { ctx.lineWidth = 4; ctx.strokeStyle = '#ffc21a'; ctx.stroke(); }
      K.draw.label(['1st', '2nd', '3rd', '4th'][i], -200, y, { size: 28, color: i === 0 ? '#d48a00' : '#7a6f99' });
      ctx.beginPath(); ctx.arc(-130, y, 15, 0, TAU); ctx.fillStyle = '#140828'; ctx.fill(); ctx.lineWidth = 7; ctx.strokeStyle = h.rim.c[0]; ctx.stroke();
      K.draw.label(h.name, -100, y, { size: 30, align: 'left' });
      K.draw.label(String(h.r), 220, y, { size: 30, align: 'right' });
    });
    // near-miss
    let line = '';
    if (p.place > 1) { const above = p.rank[p.place - 2]; line = 'Only ' + (above.r - p.score) + ' size behind ' + above.name + '!'; }
    else { const n = nextSkinToBuy(); if (n) { const need = n.price - K.meta.wallet.get('coins'); line = need > 0 ? need + ' more coins for ' + n.name : n.name + ' rim is affordable now!'; } else line = 'City champion!'; }
    if (this.cityUp) { ctx.save(); ctx.translate(0, 188); const k = 1 + 0.04 * Math.sin(K.time * 6); ctx.scale(k, k); K.draw.text('CITY ' + SAVE.city + ' UNLOCKED: BIGGER CITY!', 0, 0, { size: 30, color: '#8af59a', maxW: 560 }); ctx.restore(); }
    else K.draw.label(line, 0, 188, { size: 28, color: '#ff5cb4' });
    K.draw.pill(0, 252, '+' + Math.round(this.coinShow.n) + (this.doubled ? '  (x2)' : ''), { icon: 'coin', size: 38, minW: 230 });
    ctx.restore();
  },
});

/* Title card (tools/cards.py renders ?card to thumb.jpg): deterministic key art. */
K.scenes.add('card', {
  music: null,
  enter() { K.camera.zoom = 1; },
  backdrop(ctx) { const v = K.view; K.draw.sky('#7fd4ff', '#c79bff'); },
  render(ctx) {
    const v = K.view, x0 = -v.ox, W = v.fullW, t = 1.0;
    // a slice of candy city
    const s = { W: 4000, H: 4000, rx: [x0 + W * 0.18, x0 + W * 0.82], ry: [v.h * 0.57], blocks: [] };
    ctx.fillStyle = '#ffd9e8'; ctx.fillRect(x0 - 10, -v.oy - 10, W + 20, v.fullH + 20);
    s.blocks.push({ x: x0 + W * 0.18 + 75, y: v.h * 0.57 + 75, w: W * 0.64 - 150, h: 600, kind: 'park' });
    s.blocks.push({ x: x0 + W * 0.18 + 75, y: v.h * 0.57 - 75 - 700, w: W * 0.64 - 150, h: 700, kind: 'downtown' });
    drawCity(ctx, Object.assign(s, { W: x0 + W, H: v.h + 600 }), { x0: x0 - 200, y0: -400, x1: x0 + W + 200, y1: v.h + 600 }, t, false);
    const hx = v.w / 2 + 10, hy = v.h * 0.64, HR = 215;
    // rival hole + skyline in the back
    drawObj({ type: 'office', v: 0 }, x0 + W * 0.1, v.h * 0.5, { scale: 0.9 });
    drawObj({ type: 'apt', v: 1 }, x0 + W * 0.9, v.h * 0.47);
    drawHole(ctx, x0 + W * 0.9, v.h * 0.83, 85, AI_RIMS[0], 2);
    drawObj({ type: 'tree', v: 1 }, x0 + W * 0.05, v.h * 0.62, { scale: 1.3 }); drawObj({ type: 'house', v: 0 }, x0 + W * 0.08, v.h * 0.82);
    // hero hole
    K.draw.glow(hx, hy, 420, '#ffffff', 0.35);
    drawHole(ctx, hx, hy, HR, skinById('rainbow'), 0.7);
    const fall = (type, v2, dx, dy, rot, sc) => { ctx.save(); ctx.beginPath(); ctx.arc(hx, hy, HR - 4, 0, TAU); ctx.rect(hx - HR + 4, hy - 2000, HR * 2 - 8, 2000); ctx.clip(); drawObj({ type, v: v2 }, hx + dx, hy + dy, { rot, scale: sc }); ctx.restore(); };
    fall('person', 4, -60, 120, -0.9, 1.6);
    fall('cone', 0, 70, 130, 0.8, 1.8);
    fall('car', 1, -95, 40, -0.6, 1.35);
    fall('bus', 0, 90, -10, 0.45, 1.25);
    fall('house', 2, 10, -150, -0.12, 0.95);
    // suck-in lines
    ctx.lineCap = 'round';
    for (let i = 0; i < 12; i++) { const a = i / 12 * TAU + 0.2, r1 = HR + 50, r2 = HR + 120; ctx.beginPath(); ctx.moveTo(hx + Math.cos(a) * r1, hy + Math.sin(a) * r1); ctx.lineTo(hx + Math.cos(a) * r2, hy + Math.sin(a) * r2); ctx.lineWidth = 11; ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.stroke(); }
    for (const [dx, dy, k, s2] of [[-330, 260, 'hydrant', 1.8], [330, 250, 'tree', 1.4], [-320, -120, 'lamp', 1.4], [320, -90, 'kiosk', 1.4], [-120, 330, 'bench', 1.7], [150, 340, 'flower', 2.2]]) drawObj({ type: k, v: 2 }, hx + dx, hy + dy, { scale: s2 });
    for (let i = 0; i < 14; i++) { const r = K.rng(i + 5); K.draw.star(hx + r.range(-280, 280), hy + r.range(-300, 220), r.range(9, 16), '#fff6b0', { points: 4, inner: 0.35, outline: 3 }); }
  },
  hud(ctx) { const v = K.view; K.draw.glow(v.w / 2, v.h * 0.2, 480, '#ffffff', 0.4); drawLogo(ctx, v.w / 2, v.h * 0.2, 1, 1.5, -0.06); },
});

K.boot(/[?&]card\b/.test(location.search) ? 'card' : 'title');
