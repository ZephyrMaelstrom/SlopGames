K.audio.define('vip', () => [1047, 1319, 1568, 2093, 2637].forEach((f, i) => K.audio.tone({ wave: 'sine', f0: f, dur: 0.25, vol: 0.12, delay: i * 0.05 })));

/* ---------- 3d. PRESENTATION HELPERS ---------- */
const TAU = K.M.TAU;
const BODY = ['#ffd1e8', '#bff3ff', '#fff3a8', '#c9ffc4', '#ffd8b0', '#e3d1ff', '#ffffff', '#ffc2c2'];
const TILE = 100, TILE_COLS = ['#ff5cb4', '#2b8cff', '#ffc21a', '#8f5bff', '#2fbf4a', '#ff8a1f'];
const teamOf = c => c.isPlayer ? curSkin().team : K.THEME.colors[c.p.col][1];
const bodyOf = c => c.isPlayer ? curSkin().body : c.p.body;
const outfitOf = c => c.isPlayer ? curSkin().outfit : c.p.outfit;
function bodySprite(i, r = 22) { return K.draw.sprite('body' + i + ':' + r, r * 2, r * 2, () => K.draw.critter(r, r, r, K.color.pal(BODY[i]), { mood: 'happy' })); }
function blinkSprite(i, r = 22) { return K.draw.sprite('bodyb' + i + ':' + r, r * 2, r * 2, () => K.draw.critter(r, r, r, K.color.pal(BODY[i]), { mood: 'blink' })); }
function hatSprite(col) {
  return K.draw.sprite('hat:' + col, 30, 34, g => {
    g.beginPath(); g.moveTo(15, 2); g.lineTo(27, 32); g.lineTo(3, 32); g.closePath();
    g.fillStyle = col; g.fill(); g.lineWidth = 3; g.strokeStyle = K.THEME.ink; g.stroke();
    g.strokeStyle = 'rgba(255,255,255,0.85)'; g.lineWidth = 3; g.beginPath(); g.moveTo(9, 22); g.lineTo(21, 18); g.moveTo(12, 13); g.lineTo(18, 11); g.stroke();
    g.fillStyle = '#ffffff'; g.beginPath(); g.arc(15, 3, 4, 0, TAU); g.fill(); g.lineWidth = 2; g.strokeStyle = K.THEME.ink; g.stroke();
  });
}
function shadowSprite(col) {
  return K.draw.sprite('sh:' + col, 56, 22, g => { g.fillStyle = K.color.alpha(col, 0.45); g.beginPath(); g.ellipse(28, 11, 26, 10, 0, 0, TAU); g.fill(); }, { pad: 2 });
}
// bob on the beat: returns { y, sx, sy } — dancers alternate half-beats so the line ripples
function bob(beat, phase) {
  const f = ((beat + phase) % 1 + 1) % 1, hop = Math.sin(f * Math.PI);
  const land = f < 0.12 ? 1 - f / 0.12 : 0;
  return { y: -hop * 12, sx: 1 + land * 0.14 - hop * 0.04, sy: 1 - land * 0.14 + hop * 0.06 };
}
function drawDancer(x, y, bodyIdx, team, beat, phase, blink, scale = 1) {
  const b = bob(beat, phase);
  K.draw.drawSprite(shadowSprite(team || '#1b1b3a'), x, y + 18 * scale, { scale: (1 - b.y / -60) * scale });
  K.draw.drawSprite(blink ? blinkSprite(bodyIdx) : bodySprite(bodyIdx), x, y + b.y * scale, { sx: b.sx * scale, sy: b.sy * scale, ay: 0.5 });
  if (team) K.draw.drawSprite(hatSprite(team), x + 4 * scale, y + b.y * scale - 26 * scale, { rot: 0.18, scale });
}
// leader: big character with an outfit, maracas shaking on the beat
function drawLeader(ctx, x, y, ang, body, team, outfit, beat, o = {}) {
  const b = bob(beat, 0), r = 34 * (o.scale || 1), lx = Math.cos(ang), ly = Math.sin(ang);
  ctx.save(); ctx.translate(x, y);
  ctx.globalAlpha = o.alpha != null ? o.alpha : 1;
  K.draw.drawSprite(shadowSprite(team), 0, r * 0.6, { scale: r / 22 });
  ctx.translate(0, b.y * (r / 34)); ctx.scale(b.sx, b.sy);
  // maraca arms
  const shake = Math.sin(beat * TAU * 2) * 0.5;
  for (const sx of [-1, 1]) {
    const ax = sx * r * 0.85, ay = -r * 0.1, a = -Math.PI / 2 + sx * (0.7 + shake * sx);
    const hx = ax + Math.cos(a) * r * 0.75, hy = ay + Math.sin(a) * r * 0.75;
    K.draw.line([ax, ay, hx, hy], K.color.shade(body, -0.15), 8);
    ctx.save(); ctx.translate(hx, hy); ctx.rotate(a + Math.PI / 2);
    ctx.beginPath(); ctx.ellipse(0, -10, 9, 12, 0, 0, TAU); ctx.fillStyle = sx < 0 ? '#ff4b5c' : '#2fbf4a'; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = K.THEME.ink; ctx.stroke();
    ctx.restore();
  }
  if (outfit === 'afro') { ctx.fillStyle = '#3a2340'; ctx.beginPath(); ctx.arc(0, -r * 0.25, r * 1.25, 0, TAU); ctx.fill(); ctx.lineWidth = 4; ctx.strokeStyle = K.THEME.ink; ctx.stroke(); }
  if (outfit === 'banana') { ctx.fillStyle = '#ffe14d'; ctx.beginPath(); ctx.ellipse(0, -r * 0.5, r * 0.7, r * 1.5, 0, 0, TAU); ctx.fill(); ctx.lineWidth = 4; ctx.strokeStyle = K.THEME.ink; ctx.stroke(); ctx.fillStyle = '#6b4a1f'; ctx.fillRect(-5, -r * 2.05, 10, 12); }
  if (outfit === 'discoball') {
    K.draw.blob(0, 0, r, ['#ffffff', '#c9d2ff', '#7f88b8']);
    ctx.save(); ctx.beginPath(); ctx.arc(0, 0, r - 2, 0, TAU); ctx.clip();
    for (let i = -4; i <= 4; i++) for (let j = -4; j <= 4; j++) { const on = ((i * 3 + j * 5 + Math.floor(beat * 2)) % 4 + 4) % 4 === 0; ctx.fillStyle = on ? '#ffffff' : (i + j) % 2 ? '#dfe4ff' : '#aab2d8'; ctx.fillRect(i * 9 - 4, j * 9 - 4, 8, 8); }
    ctx.restore();
    const ey = 0, ex = r * 0.3; ctx.fillStyle = K.THEME.ink; for (const s of [-1, 1]) { ctx.beginPath(); ctx.ellipse(s * ex + lx * 3, ey + ly * 3, 4.5, 6, 0, 0, TAU); ctx.fill(); }
  } else if (outfit === 'robot') {
    K.draw.block(-r, -r, r * 2, r * 2, K.color.pal(body), { r: 14, depth: 6 });
    ctx.fillStyle = '#1b1b3a'; K.draw.rr(-r * 0.7, -r * 0.35, r * 1.4, r * 0.55, 8); ctx.fill();
    const sx = Math.sin(beat * Math.PI) * r * 0.45; ctx.fillStyle = '#ff4b5c'; ctx.fillRect(sx - 8, -r * 0.25, 16, r * 0.35);
    K.draw.line([0, -r, 0, -r - 18], K.THEME.ink, 4); ctx.fillStyle = Math.floor(beat) % 2 ? '#ffc21a' : '#ff4b5c'; ctx.beginPath(); ctx.arc(0, -r - 20, 7, 0, TAU); ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = K.THEME.ink; ctx.stroke();
  } else {
    K.draw.critter(0, 0, r, K.color.pal(body), { mood: o.mood || (outfit === 'nightcap' ? 'blink' : 'happy'), look: { x: lx, y: ly } });
    // happy open mouth
    ctx.fillStyle = '#7a1f3a'; ctx.beginPath(); ctx.arc(lx * 4, r * 0.35 + ly * 3, r * 0.22, 0, Math.PI); ctx.fill();
  }
  // headwear
  switch (outfit) {
    case 'cone': K.draw.drawSprite(hatSprite(team), 4 * r / 34, -r - 8 * r / 34, { rot: 0.15, scale: 1.5 * r / 34 }); break;
    case 'afro': ctx.fillStyle = '#1b1b3a'; ctx.fillRect(-r * 0.75, -r * 0.18, r * 1.5, 8); for (const s of [-1, 1]) { K.draw.star(s * r * 0.32, -r * 0.05, 14, '#ff5cb4', { outline: 3 }); } break;
    case 'sombrero':
      ctx.fillStyle = '#ffd84a'; ctx.beginPath(); ctx.ellipse(0, -r * 0.75, r * 1.55, r * 0.38, 0, 0, TAU); ctx.fill(); ctx.lineWidth = 4; ctx.strokeStyle = K.THEME.ink; ctx.stroke();
      ctx.beginPath(); ctx.ellipse(0, -r * 1.05, r * 0.55, r * 0.5, 0, Math.PI, TAU); ctx.fill(); ctx.stroke();
      ctx.strokeStyle = '#ff4b5c'; ctx.lineWidth = 5; ctx.beginPath(); ctx.ellipse(0, -r * 0.82, r * 1.2, r * 0.22, 0, 0.2, Math.PI - 0.2); ctx.stroke(); break;
    case 'tiara': for (let i = -2; i <= 2; i++) K.draw.star(i * r * 0.28, -r * 0.95 - (2 - Math.abs(i)) * 5, 9, '#fff6b0', { outline: 2 }); K.draw.star(0, -r * 1.25, 12, '#ff6fa8', { outline: 3 }); break;
    case 'crown':
      ctx.beginPath(); ctx.moveTo(-r * 0.7, -r * 0.7); ctx.lineTo(-r * 0.8, -r * 1.4); ctx.lineTo(-r * 0.35, -r * 1.05); ctx.lineTo(0, -r * 1.55); ctx.lineTo(r * 0.35, -r * 1.05); ctx.lineTo(r * 0.8, -r * 1.4); ctx.lineTo(r * 0.7, -r * 0.7); ctx.closePath();
      ctx.fillStyle = '#ffd23f'; ctx.fill(); ctx.lineWidth = 4; ctx.strokeStyle = K.THEME.ink; ctx.stroke(); ctx.fillStyle = '#ff4b5c'; ctx.beginPath(); ctx.arc(0, -r * 0.95, 6, 0, TAU); ctx.fill(); break;
    case 'shades': ctx.fillStyle = '#1b1b3a'; K.draw.rr(-r * 0.62 + lx * 3, -r * 0.18 + ly * 3, r * 0.55, r * 0.36, 6); ctx.fill(); K.draw.rr(r * 0.07 + lx * 3, -r * 0.18 + ly * 3, r * 0.55, r * 0.36, 6); ctx.fill();
      ctx.fillStyle = '#3a2340'; ctx.beginPath(); ctx.arc(0, -r * 0.85, r * 0.6, Math.PI, TAU); ctx.fill(); break;
    case 'flower': for (let i = 0; i < 5; i++) { const a = i / 5 * TAU; ctx.fillStyle = '#ffe14d'; ctx.beginPath(); ctx.arc(-r * 0.55 + Math.cos(a) * 9, -r * 0.75 + Math.sin(a) * 9, 7, 0, TAU); ctx.fill(); } ctx.fillStyle = '#ff4b5c'; ctx.beginPath(); ctx.arc(-r * 0.55, -r * 0.75, 6, 0, TAU); ctx.fill(); break;
    case 'nightcap': ctx.beginPath(); ctx.moveTo(-r * 0.75, -r * 0.6); ctx.quadraticCurveTo(0, -r * 1.6, r * 1.2, -r * 0.9); ctx.lineTo(r * 0.75, -r * 0.55); ctx.closePath(); ctx.fillStyle = '#2fbf4a'; ctx.fill(); ctx.lineWidth = 4; ctx.strokeStyle = K.THEME.ink; ctx.stroke(); ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(r * 1.2, -r * 0.9, 7, 0, TAU); ctx.fill(); ctx.stroke(); break;
    case 'fedora': ctx.fillStyle = '#3a2340'; ctx.beginPath(); ctx.ellipse(0, -r * 0.72, r * 1.05, r * 0.22, 0, 0, TAU); ctx.fill(); K.draw.rr(-r * 0.55, -r * 1.3, r * 1.1, r * 0.6, 8); ctx.fill(); ctx.fillStyle = '#ff4b5c'; ctx.fillRect(-r * 0.55, -r * 0.88, r * 1.1, 7); break;
    case 'banana': break;
  }
  ctx.restore();
}
function floorPattern(tx, ty, beat) {   // which tiles light up this beat (patterns rotate every 4 bars)
  const b = Math.floor(beat), pat = Math.floor(b / 16) % 4;
  if (pat === 0) return (tx * 3 + ty * 5 + b) % 7 === 0 ? (tx + b) % TILE_COLS.length : -1;
  if (pat === 1) return ((tx - ty + b) % 6 + 6) % 6 === 0 ? (b >> 1) % TILE_COLS.length : -1;
  if (pat === 2) { const d = Math.floor(Math.hypot(tx - WW / TILE / 2, ty - WH / TILE / 2)); return (d - b % 6 + 60) % 6 < 1 ? d % TILE_COLS.length : -1; }
  const h = Math.sin(tx * 12.9898 + ty * 78.233 + b * 37.719) * 43758.5453; return (h - Math.floor(h)) < 0.16 ? (tx + ty) % TILE_COLS.length : -1;
}
function drawFloor(ctx, x0, y0, x1, y1, beat) {
  const tx0 = Math.max(0, Math.floor(x0 / TILE)), ty0 = Math.max(0, Math.floor(y0 / TILE));
  const tx1 = Math.min(WW / TILE - 1, Math.floor(x1 / TILE)), ty1 = Math.min(WH / TILE - 1, Math.floor(y1 / TILE));
  ctx.fillStyle = '#1e1238'; ctx.fillRect(Math.max(0, x0), Math.max(0, y0), Math.min(WW, x1) - Math.max(0, x0), Math.min(WH, y1) - Math.max(0, y0));
  const fr = beat - Math.floor(beat), glowA = 0.72 - fr * 0.5;
  for (let ty = ty0; ty <= ty1; ty++) for (let tx = tx0; tx <= tx1; tx++) {
    const ci = floorPattern(tx, ty, beat), x = tx * TILE + 4, y = ty * TILE + 4;
    ctx.fillStyle = (tx + ty) % 2 ? '#29174a' : '#311c58'; ctx.fillRect(x, y, TILE - 8, TILE - 8);
    if (ci >= 0) {
      ctx.globalAlpha = glowA; ctx.fillStyle = TILE_COLS[ci]; ctx.fillRect(x, y, TILE - 8, TILE - 8);
      ctx.globalAlpha = glowA * 0.45; ctx.fillStyle = '#ffffff'; ctx.fillRect(x + 8, y + 8, TILE - 40, 10);
      ctx.globalAlpha = 1;
    }
  }
  // velvet rope edge around the floor
  ctx.lineWidth = 14; ctx.strokeStyle = '#ffc21a'; ctx.strokeRect(-7, -7, WW + 14, WH + 14);
  ctx.lineWidth = 5; ctx.strokeStyle = K.THEME.ink; ctx.strokeRect(-14, -14, WW + 28, WH + 28);
}
function clubBackdrop(ctx, beat, par = true) {
  const v = K.view;
  K.draw.sky('#2a0f4a', '#120726');
  const draw = c => {
    // crowd silhouettes along the club walls (parallax 0.5)
    c.fillStyle = '#0d0520';
    for (let i = -20; i < 60; i++) {
      const x = i * 70, hop = Math.max(0, Math.sin(beat * Math.PI + i)) * 10;
      c.beginPath(); c.arc(x, -40 - hop, 26, 0, TAU); c.fill(); c.fillRect(x - 30, -20 - hop, 60, 90);
      c.beginPath(); c.arc(x + 20, WH * 0.5 + 1340 - hop, 26, 0, TAU); c.fill();
    }
  };
  if (par) K.camera.parallax(ctx, 0.5, draw);
  // rotating spotlight beams from the ceiling
  const cols = ['rgba(255,92,180,0.13)', 'rgba(43,140,255,0.13)', 'rgba(255,194,26,0.12)'];
  for (let i = 0; i < 3; i++) {
    const ox = v.w * (0.2 + i * 0.3), a = Math.sin(K.time * (0.6 + i * 0.2) + i * 2) * 0.6 + Math.PI / 2;
    ctx.fillStyle = cols[i]; ctx.beginPath(); ctx.moveTo(ox, -v.oy - 10);
    ctx.lineTo(ox + Math.cos(a - 0.16) * 2200, -v.oy + Math.sin(a - 0.16) * 2200); ctx.lineTo(ox + Math.cos(a + 0.16) * 2200, -v.oy + Math.sin(a + 0.16) * 2200); ctx.closePath(); ctx.fill();
  }
}
// collect + depth-sort everything with feet on the floor, then draw
function drawCongas(ctx, s, a, beat, cam) {
  const items = [], t = K.time;
  const vis = (x, y) => x > cam.x0 - 60 && x < cam.x1 + 60 && y > cam.y0 - 80 && y < cam.y1 + 80;
  for (const c of s.congas) {
    const team = teamOf(c), lx = K.M.lerp(c.px, c.x, a), ly = K.M.lerp(c.py, c.y, a);
    // linked-arms rope under the line
    if (c.members.length) {
      ctx.beginPath(); ctx.moveTo(lx, ly);
      for (const m of c.members) ctx.lineTo(K.M.lerp(m.px, m.x, a), K.M.lerp(m.py, m.y, a));
      ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      ctx.lineWidth = 16; ctx.strokeStyle = K.color.alpha(K.THEME.ink, 0.45); ctx.stroke();
      ctx.lineWidth = 9; ctx.strokeStyle = c.immune > 0 && Math.sin(t * 30) > 0 ? '#ffffff' : team; ctx.stroke();
    }
    c.members.forEach((m, i) => {
      const x = K.M.lerp(m.px, m.x, a), y = K.M.lerp(m.py, m.y, a);
      if (vis(x, y)) items.push({ y, k: 1, x, m, i, team, c });
    });
    if (vis(lx, ly)) items.push({ y: ly + 2, k: 2, x: lx, c, team });
  }
  for (const d of s.free) {
    const x = K.M.lerp(d.px, d.x, a), y = K.M.lerp(d.py, d.y, a);
    if (vis(x, y)) items.push({ y, k: 0, x, d });
  }
  items.sort((p, q) => p.y - q.y);
  for (const it of items) {
    if (it.k === 1) drawDancer(it.x, it.y, it.m.c, it.team, beat, (it.i % 2) * 0.5, ((t * 0.5 + it.m.id * 0.37) % 4) < 0.08);
    else if (it.k === 0) {
      const d = it.d;
      if (d.vip) { K.draw.glow(it.x, it.y, 70, '#fff3a0', 0.55 + 0.2 * Math.sin(t * 6)); }
      drawDancer(it.x, it.y, d.c, null, beat * 0.5, d.ph, ((t * 0.5 + d.id * 0.37) % 4) < 0.08, d.vip ? 1.25 : 1);
      if (d.vip) K.draw.star(it.x, it.y - 46 + Math.sin(t * 5) * 4, 16, '#ffc21a', { outline: 3 });
      else { ctx.globalAlpha = 0.85; K.draw.text('?', it.x + 22, it.y - 34 + Math.sin(t * 4 + d.id) * 3, { size: 24, sw: 5 }); ctx.globalAlpha = 1; }
    } else {
      const c = it.c;
      drawLeader(ctx, it.x, it.y, c.ang, bodyOf(c), it.team, outfitOf(c), beat, { scale: c.isPlayer ? 1.05 : 1 });
      if (!c.isPlayer) {
        K.draw.text(c.p.name, it.x, it.y - 82, { size: 22, sw: 5, color: it.team });
        const me = s.congas[0];
        let near = false;
        if (me.immune <= 0) for (let k = 1; k < me.members.length; k += 2) { const m = me.members[k]; if ((m.x - c.x) ** 2 + (m.y - c.y) ** 2 < 230 * 230) { near = true; break; } }
        if (near) { const p = 1 + 0.15 * Math.sin(t * 18); K.draw.blob(it.x + 40, it.y - 60, 20 * p, 'red'); K.draw.text('!', it.x + 40, it.y - 58, { size: 30 * p, sw: 5 }); }
      }
      else { ctx.strokeStyle = 'rgba(255,255,255,0.8)'; ctx.lineWidth = 4; ctx.beginPath(); ctx.ellipse(it.x, it.y + 26, 44, 16, 0, 0, TAU); ctx.stroke(); }
    }
  }
}

/* ---------- 3e. SCENES ---------- */
function backBtn(to) { return K.ui.button({ icon: 'home', color: 'blue', w: 96, h: 96, place: v => ({ x: 66 + v.safe.left, y: 70 + v.safe.top }), onTap: () => K.scenes.go(to) }); }
function demoLine(n, t, cxm, cym, R) {   // a conga marching around an oval (title screen)
  const pts = [];
  for (let i = 0; i <= n; i++) { const u = t * 0.55 - i * 0.16; pts.push({ x: cxm + Math.cos(u) * R, y: cym + Math.sin(u) * R * 0.42, a: u + Math.PI / 2 }); }
  return pts;
}

K.scenes.add('title', {
  enter() {
    startMusic('congaSoft');
    this.logo = { s: 0 };
    K.tween(this.logo, { s: 1 }, 0.7, K.Ease.outBack);
    K.ui.button({ label: 'PLAY', icon: 'play', color: 'green', w: 420, h: 132, pulse: true, key: 'action', popIn: 0.2,
      place: v => ({ x: v.w / 2, y: v.h * 0.69 }), onTap: () => K.scenes.go('play') });
    K.ui.button({ label: 'LEADERS', icon: 'star', color: 'pink', w: 270, h: 104, popIn: 0.3,
      place: v => ({ x: v.w / 2 - 142, y: v.h * 0.69 + 145 }), onTap: () => K.scenes.go('skins') });
    K.ui.button({ label: 'AWARDS', icon: 'trophy', color: 'yellow', w: 270, h: 104, popIn: 0.35,
      place: v => ({ x: v.w / 2 + 142, y: v.h * 0.69 + 145 }), onTap: () => K.scenes.go('awards') });
    K.ui.soundButton({ popIn: 0.4, w: 96, h: 96, place: v => ({ x: v.w / 2 - 60, y: v.h * 0.69 + 268 }) });
    K.ui.musicButton({ popIn: 0.45, w: 96, h: 96, place: v => ({ x: v.w / 2 + 60, y: v.h * 0.69 + 268 }) });
  },
  backdrop(ctx) {
    const v = K.view, beat = beatNow();
    clubBackdrop(ctx, beat, false);
    ctx.save(); ctx.translate(v.w / 2 - 800, v.h * 0.47 - 600);
    drawFloor(ctx, 800 - v.w / 2 - v.ox, 600 - v.h * 0.47 - v.oy, 800 + v.w / 2 + v.ox, 600 + v.h, beat);
    ctx.restore();
  },
  render(ctx) {
    const v = K.view, beat = beatNow(), sk = curSkin();
    const pts = demoLine(9, K.time, v.w / 2, v.h * 0.47, Math.min(250, v.w * 0.36));
    const order = pts.map((p, i) => ({ p, i })).sort((a, b) => a.p.y - b.p.y);
    ctx.lineWidth = 9; ctx.strokeStyle = sk.team; ctx.lineCap = 'round'; ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)); ctx.stroke();
    for (const { p, i } of order) {
      if (i === 0) drawLeader(ctx, p.x, p.y, p.a, sk.body, sk.team, sk.outfit, beat);
      else drawDancer(p.x, p.y, i % NBODY, sk.team, beat, (i % 2) * 0.5, false);
    }
  },
  hud(ctx) {
    const v = K.view, beat = beatNow(), pulse = 1 + 0.04 * Math.max(0, 1 - (beat % 1) * 4);
    ctx.save(); ctx.translate(v.w / 2, v.h * 0.2); ctx.scale(this.logo.s * pulse, this.logo.s * pulse); ctx.rotate(-0.06);
    K.draw.drawSprite(K.draw.sprite('logo1', 600, 180, () => K.draw.text('CONGA', 300, 90, { size: 160, color: '#fff08a', sw: 16 }), { pad: 24 }), 0, -70);
    K.draw.drawSprite(K.draw.sprite('logo2', 560, 170, () => K.draw.text('LINE!', 280, 85, { size: 150, color: '#ff9ad5', sw: 16 }), { pad: 24 }), 20, 70);
    ctx.restore();
    K.draw.text('Recruit dancers · cut rival lines · be the longest', v.w / 2, v.h * 0.2 + 180, { size: 27, sw: 6, maxW: v.w - 40 });
    K.draw.pill(v.w / 2, 70 + v.safe.top, 'BEST ' + K.fmt(SAVE.best), { icon: 'trophy', size: 34 });
  },
});

K.scenes.add('play', {
  gameplay: true, pausable: true,
  enter() {
    this.s = Sim.create((Math.random() * 2 ** 31) | 0, 4);
    startMusic('conga', true);
    this.hot = false; this.lastSec = SONG;
    this.me = this.s.congas[0];
    K.camera.follow(this.me, { lerp: 6 });
    K.camera.setBounds(-160, -160, WW + 320, WH + 320);
    K.camera.snap();
    this.hint = SAVE.songs < 2; this.hintA = 1; this.steered = false;
    this.ax = 0; this.ay = 0; this.lenFx = { s: 1 }; this.rankFx = { s: 1 }; this.rows = this.s.congas.map((c, i) => ({ y: i }));
    this.stats = { vips: 0, cutAgainst: 0 }; this.ended = 0;
    K.ui.pauseButton();
    K.audio.play('whoosh');
    K.fx.text(K.view.w / 2, K.view.h * 0.42, "LET'S DANCE!", { size: 84, color: '#fff08a', life: 1.2, rise: 60, screen: true });
  },
  onQuit() { startMusic('congaSoft'); K.scenes.go('title'); },
  update(dt) {
    const s = this.s;
    if (this.ended > 0) { this.ended -= dt; if (this.ended <= 0) K.scenes.go('over', { s, stats: this.stats }); return; }
    let ang = null;
    const ix = K.input.axisX(), iy = K.input.axisY();
    if (ix || iy) ang = Math.atan2(iy, ix);
    const p = K.input.pointer;
    if (p.pressed) { this.ax = p.x; this.ay = p.y; }
    if (p.down) {
      const dx = p.x - this.ax, dy = p.y - this.ay, d = Math.hypot(dx, dy);
      if (d > 22) {
        ang = Math.atan2(dy, dx);
        if (d > 90) { this.ax = p.x - dx / d * 90; this.ay = p.y - dy / d * 90; }   // drag the anchor so direction changes stay snappy
      }
    }
    if (ang != null && !this.steered && s.t > 0.2) { this.steered = true; }
    Sim.step(s, dt, { ang });
    for (const e of s.events) this.present(e);
    s.events.length = 0;
    const left = Math.ceil(SONG - s.t);
    if (left !== this.lastSec) {
      this.lastSec = left;
      if (left <= 5 && left > 0) { K.audio.play('tick'); K.tween.killOf(this.rankFx); this.rankFx.s = 1.3; K.tween(this.rankFx, { s: 1 }, 0.3, K.Ease.outElastic); }
    }
    if (!this.hot && s.t >= SONG - 15) {
      this.hot = true; startMusic('congaHot', true);
      K.fx.text(K.view.w / 2, K.view.h * 0.4, 'FINAL CHORUS!', { size: 76, color: '#ff9ad5', life: 1.4, rise: 50, screen: true });
      K.audio.play('power'); K.fx.flash('#ffffff', 0.2);
    }
  },
  present(e) {
    const s = this.s, me = this.me, v = K.view;
    const onScreen = (x, y) => { const q = K.camera.toScreen(x, y); return q.x > -80 && q.x < v.w + 80 && q.y > -80 && q.y < v.h + 80; };
    switch (e.type) {
      case 'join': {
        const c = s.congas[e.cid], team = teamOf(c);
        if (c.isPlayer) {
          K.fx.burst(e.x, e.y, { colors: [team, '#ffffff', '#fff08a'], count: e.vip ? 30 : 12, speed: [150, 450], size: [6, 11], shape: e.vip ? 'star' : 'square' });
          K.fx.ring(e.x, e.y, { r0: 10, r1: 80, color: team, width: 8 });
          K.fx.text(e.x, e.y - 40, e.vip ? '+3 VIP!' : '+1', { size: e.vip ? 56 : 42, color: e.vip ? '#fff08a' : '#ffffff' });
          K.audio.play('join', 1 + Math.min(e.len, 40) * 0.015); K.haptic('light');
          K.tween.killOf(this.lenFx); this.lenFx.s = 1.35; K.tween(this.lenFx, { s: 1 }, 0.35, K.Ease.outElastic);
          if (e.vip) { K.audio.play('vip'); this.stats.vips++; if (this.stats.vips >= 3) achieve('vip'); }
          if (e.len % 10 === 0) { K.fx.text(v.w / 2, v.h * 0.36, e.len + ' IN LINE!', { size: 72, color: '#8af59a', rise: 60, life: 1.1, screen: true }); K.audio.play('power'); }
          achieve('first');
          if (e.len >= 10) achieve('len10'); if (e.len >= 25) achieve('len25'); if (e.len >= 40) achieve('len40');
        } else if (onScreen(e.x, e.y)) { K.fx.burst(e.x, e.y, { colors: [team, '#ffffff'], count: 6, speed: [80, 220], size: [5, 9] }); K.audio.play('pop', 0.8); }
        break;
      }
      case 'cut': {
        const A = s.congas[e.a], B = s.congas[e.b];
        if (A.isPlayer) {
          K.fx.shake(14, 0.3); K.fx.hitstop(0.07); K.haptic('heavy'); K.audio.play('steal');
          K.fx.burst(e.x, e.y, { shape: 'star', colors: [teamOf(A), '#fff08a', '#ffffff', teamOf(B)], count: 24 + e.n * 2, speed: [250, 700], size: [8, 15] });
          K.fx.ring(e.x, e.y, { r0: 20, r1: 220, color: '#fff08a', width: 14 });
          K.fx.text(e.x, e.y - 50, 'STOLE ' + e.n + '!', { size: 64 + Math.min(e.n, 12) * 2, color: '#fff08a', rise: 120, life: 1.1 });
          K.fx.text(v.w / 2, v.h * 0.3, 'CUT IN on ' + B.p.name + '!', { size: 44, color: teamOf(B), rise: 40, screen: true });
          achieve('cut1'); if (e.n >= 8) achieve('bigcut'); if (A.steals >= 20) achieve('thief');
        } else if (B.isPlayer) {
          this.stats.cutAgainst++;
          K.fx.shake(22, 0.45); K.fx.flash('#ff4b5c', 0.3); K.haptic('heavy'); K.audio.play('robbed');
          K.fx.burst(e.x, e.y, { colors: ['#ff4b5c', '#ffffff', teamOf(A)], count: 26, speed: [250, 650], size: [7, 13], shape: 'square' });
          K.fx.text(e.x, e.y - 50, '-' + e.n + '!', { size: 72, color: '#ff9a9a', rise: 120 });
          K.fx.text(v.w / 2, v.h * 0.3, A.p.name + ' CUT YOU!', { size: 48, color: '#ff9a9a', rise: 40, screen: true });
        } else if (onScreen(e.x, e.y)) {
          K.fx.burst(e.x, e.y, { colors: [teamOf(A), '#ffffff'], count: 14, speed: [150, 450] }); K.audio.play('swap');
          K.fx.text(e.x, e.y - 40, '-' + e.n, { size: 40, color: teamOf(B) });
        }
        break;
      }
      case 'rank':
        K.tween.killOf(this.rankFx); this.rankFx.s = 1.5; K.tween(this.rankFx, { s: 1 }, 0.5, K.Ease.outElastic);
        if (e.rank < e.prev) { K.audio.play('power'); if (e.rank === 1) K.fx.text(v.w / 2, v.h * 0.25, "YOU'RE #1!", { size: 64, color: '#fff08a', screen: true, rise: 40 }); }
        else K.audio.play('hurt');
        break;
      case 'bump': K.audio.play('bounce', 0.8); K.fx.shake(5, 0.12); K.fx.puff(e.x, e.y); break;
      case 'vip': K.audio.play('coin'); if (onScreen(e.x, e.y)) K.fx.ring(e.x, e.y, { r0: 120, r1: 10, color: '#fff08a', width: 8, life: 0.5 }); break;
      case 'spawn': if (onScreen(e.x, e.y)) K.fx.puff(e.x, e.y, { colors: ['#ffffff', '#ffb0dc'] }); break;
      case 'end':
        K.music.stop(); K.audio.play('whistle'); K.haptic('success');
        K.fx.flash('#ffffff', 0.5);
        K.fx.text(v.w / 2, v.h * 0.42, 'SONG OVER!', { size: 96, color: '#fff08a', life: 1.4, rise: 30, screen: true });
        this.ended = 1.4;
        break;
    }
  },
  frame(dt) {
    if (this.steered) this.hintA = Math.max(0, this.hintA - dt * 2.5);
    const zt = K.M.clamp(1.04 - this.me.members.length * 0.009, 0.66, 1);     // pull back as the line grows so the tail stays readable
    K.camera.zoom = K.M.damp(K.camera.zoom, zt, 1.5, dt);
    const s = this.s, sorted = s.congas.slice().sort((a, b) => b.members.length - a.members.length || a.id - b.id);
    sorted.forEach((c, i) => { const r = this.rows[c.id]; r.y = K.M.damp(r.y, i, 16, dt); });
  },
  backdrop(ctx) { clubBackdrop(ctx, beatNow()); },
  render(ctx, a) {
    const cam = K.camera.rect, beat = beatNow();
    drawFloor(ctx, cam.x0, cam.y0, cam.x1, cam.y1, beat);
    drawCongas(ctx, this.s, a, beat, cam);
  },
  hud(ctx) {
    const v = K.view, s = this.s, st = v.safe.top, me = this.me;
    // song timer
    const left = Math.max(0, SONG - s.t), bw = Math.min(260, v.w - 420);
    K.draw.bar(v.w / 2, 70 + st, bw, 44, left / SONG, left < 10 ? 'red' : 'purple');
    ctx.save(); ctx.translate(v.w / 2, 70 + st); ctx.scale(this.rankFx.s, this.rankFx.s);
    K.draw.text(K.fmtTime(left), 0, 0, { size: 32 }); ctx.restore();
    K.draw.icon('music', v.w / 2 - bw / 2 - 26, 70 + st, 44, '#fff08a');
    // my line length
    ctx.save(); ctx.translate(110 + v.safe.left, 70 + st); ctx.scale(this.lenFx.s, this.lenFx.s);
    K.draw.pill(0, 0, String(me.members.length), { icon: 'heart', size: 40, minW: 150 }); ctx.restore();
    // live ranking: a strip of chips that slide as places change
    const n = s.congas.length, cw = Math.min(150, (v.w - 30 - v.safe.left - v.safe.right) / n), x0 = v.w / 2 - cw * n / 2, cy = 146 + st;
    for (const c of s.congas) {
      const slot = this.rows[c.id].y, rank = Math.round(slot) + 1, x = x0 + slot * cw + 4, w = cw - 8, team = teamOf(c);
      K.draw.rr(x, cy - 24, w, 48, 24); ctx.fillStyle = c.isPlayer ? 'rgba(255,240,138,0.95)' : 'rgba(27,27,58,0.7)'; ctx.fill();
      ctx.lineWidth = c.isPlayer ? 5 : 3; ctx.strokeStyle = c.isPlayer ? K.THEME.ink : team; ctx.stroke();
      ctx.fillStyle = team; ctx.beginPath(); ctx.arc(x + 24, cy, 18, 0, TAU); ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = K.THEME.ink; ctx.stroke();
      K.draw.text(String(rank), x + 24, cy + 1, { size: 22, sw: 4 });
      K.draw.text(String(c.members.length), x + w - 12, cy + 1, { size: 28, sw: c.isPlayer ? 0 : 5, align: 'right', color: c.isPlayer ? K.THEME.ink : '#ffffff' });
      if (c.isPlayer) K.draw.text('YOU', x + w / 2, cy - 36, { size: 20, sw: 4, color: '#fff08a' });
    }
    // off-screen rival indicators
    for (const c of s.congas) {
      if (c.isPlayer) continue;
      const q = K.camera.toScreen(c.x, c.y), m = 46;
      if (q.x > 0 && q.x < v.w && q.y > 0 && q.y < v.h) continue;
      const ex = K.M.clamp(q.x, m + v.safe.left, v.w - m - v.safe.right), ey = K.M.clamp(q.y, 210 + st, v.h - m - v.safe.bottom);
      const ang = Math.atan2(q.y - ey, q.x - ex);
      ctx.save(); ctx.translate(ex, ey); ctx.rotate(ang);
      ctx.fillStyle = teamOf(c); ctx.beginPath(); ctx.moveTo(30, 0); ctx.lineTo(4, -18); ctx.lineTo(4, 18); ctx.closePath(); ctx.fill(); ctx.lineWidth = 4; ctx.strokeStyle = K.THEME.ink; ctx.stroke();
      ctx.restore();
      K.draw.text(String(c.members.length), ex, ey, { size: 26, sw: 5, color: teamOf(c) });
    }
    if (this.hint && this.hintA > 0.01) {   // teach by doing: ghost finger drags, fades after the first steer
      ctx.globalAlpha = this.hintA;
      const ph = (K.time % 1.4) / 1.4, k = K.Ease.inOutCubic(K.M.clamp(ph * 1.3, 0, 1)), hy = v.h * 0.7, dir = Math.floor(K.time / 1.4) % 2 ? -1 : 1;
      const fx = v.w / 2 + dir * (-120 + 240 * k);
      K.draw.arrow(v.w / 2 - dir * 130, hy + 80, v.w / 2 + dir * 140, hy + 80, '#ffffff', 10);
      K.draw.blob(fx, hy, 30, ['#ffffff', '#f0f0ff', '#aab2c8']);
      K.draw.text(K.input.touch ? 'SWIPE TO STEER' : 'ARROWS / SWIPE TO STEER', v.w / 2, hy - 80, { size: 42, color: '#fff08a', maxW: v.w - 60 });
      K.draw.text('Grab the ? dancers!', v.w / 2, hy - 30, { size: 30 });
      ctx.globalAlpha = 1;
    }
  },
});

let retries = 0;
const ORD = ['1st', '2nd', '3rd', '4th', '5th'];
K.scenes.add('over', {
  enter(p) {
    const v = K.view, s = this.s = p.s, st = p.stats, me = s.congas[0];
    K.music.play('victory');
    this.rank = s.rank; const len = me.members.length;
    this.score = len * 10 + me.steals * 5 + ([300, 150, 60, 0, 0][this.rank - 1] || 0);
    this.breakdown = len + ' dancers · ' + me.steals + ' stolen';
    SAVE.songs++; SAVE.recruited += me.recruits; SAVE.stolen += me.steals; SAVE.bestLen = Math.max(SAVE.bestLen, me.bestLen);
    if (this.rank === 1) {
      SAVE.wins++; achieve('win');
      if (st.cutAgainst === 0) achieve('clean');
      const others = s.congas.slice(1).reduce((a, c) => a + c.members.length, 0);
      if (len > others) achieve('dom');
    }
    const prev = SAVE.best; this.newBest = this.score > prev; SAVE.best = Math.max(prev, this.score); this.prevBest = prev;
    this.fresh = checkUnlocks();
    K.save.commit();
    K.sdk.send('score', { value: this.score });
    // near miss
    const ahead = s.standings[0];
    if (this.rank > 1) this.near = 'Only ' + (ahead.len - len + 1) + ' more dancers for 1st!';
    else if (!this.newBest && prev > 0) this.near = 'Only ' + (prev - this.score) + ' pts from your best!';
    else {
      let bs = null, br = -1;
      for (const sk of SKINS) { if (!sk.req || K.meta.unlocks.has('skin:' + sk.id)) continue; const r = stat(sk.req.stat) / sk.req.need; if (r > br) { br = r; bs = sk; } }
      this.near = bs ? (bs.req.need - stat(bs.req.stat)) + ' to go for ' + bs.name + ' (' + bs.req.text.toLowerCase() + ')' : 'Party legend!';
    }
    this.shown = { n: 0 }; this.pan = { s: 0 }; this.pod = { s: 0 };
    K.tween(this.pod, { s: 1 }, 0.7, K.Ease.outBack, 0.1);
    K.tween(this.pan, { s: 1 }, 0.5, K.Ease.outBack, 0.35);
    K.tween(this.shown, { n: this.score }, 1.0, K.Ease.outCubic, 0.6);
    K.audio.play(this.rank === 1 ? 'win' : this.rank <= 3 ? 'coin' : 'lose');
    K.wait(0.5).then(() => {
      for (let i = 0; i < 3; i++) K.fx.burst(v.w * (0.25 + i * 0.25), v.h * 0.12, { screen: true, shape: 'square', colors: ['#ff5cb4', '#ffc21a', '#2b8cff', '#2fbf4a', '#ffffff'], count: 30, speed: [200, 700], gravity: 700, size: [7, 12] });
    });
    if (this.newBest) K.wait(1.4).then(() => { K.audio.play('levelup'); K.haptic('success'); K.fx.burst(v.w / 2, v.h * 0.55, { screen: true, shape: 'star', colors: ['#fff08a', '#ffc21a', '#ffffff'], count: 40, speed: [300, 900], size: [10, 18] }); });
    this.fresh.forEach((sk, i) => K.wait(1.8 + i * 0.6).then(() => { K.ui.toast('New leader: ' + sk.name, { icon: 'star' }); K.audio.play('levelup'); }));
    K.wait(3.2).then(() => { if (K.scenes.current === this) startMusic('congaSoft'); });
    const by = v => Math.min(Math.max(330 + v.safe.top, v.h * 0.33) + 460 + 260, v.h - 76 - v.safe.bottom);
    K.ui.button({ icon: 'home', color: 'blue', w: 116, h: 116, popIn: 0.6, place: v => ({ x: v.w / 2 - 215, y: by(v) }), onTap: () => K.scenes.go('title') });
    K.ui.button({ label: 'DANCE AGAIN', icon: 'retry', color: 'green', w: 330, h: 116, key: 'action', pulse: true, popIn: 0.7,
      place: v => ({ x: v.w / 2 + 70, y: by(v) }),
      onTap: async () => {
        retries++; SAVE.retries++; K.save.later();
        if (retries % 3 === 0) await K.adBreak('midgame');    // interstitial before every 3rd retry, never mid-song
        K.scenes.go('play');
      } });
  },
  backdrop(ctx) {
    const v = K.view, beat = beatNow();
    clubBackdrop(ctx, beat, false);
  },
  render(ctx) {
    const v = K.view, s = this.s, beat = beatNow(), cx = v.w / 2, base = Math.max(330 + v.safe.top, v.h * 0.33);
    // spotlight on the podium
    const g = ctx.createRadialGradient(cx, base, 30, cx, base, 420); g.addColorStop(0, 'rgba(255,240,170,0.35)'); g.addColorStop(1, 'rgba(255,240,170,0)');
    ctx.fillStyle = g; ctx.fillRect(cx - 420, base - 420, 840, 840);
    const steps = [{ i: 1, x: cx - 210, h: 110, col: 'blue' }, { i: 0, x: cx, h: 170, col: 'yellow' }, { i: 2, x: cx + 210, h: 70, col: 'orange' }];
    ctx.save(); ctx.translate(cx, base + 140); ctx.scale(1, this.pod.s); ctx.translate(-cx, -(base + 140));
    for (const st of steps) {
      const e = s.standings[st.i]; if (!e) continue;
      const c = s.congas[e.id], top = base + 140 - st.h;
      K.draw.block(st.x - 95, top, 190, st.h, st.col, { r: 14, depth: 10 });
      K.draw.text(String(st.i + 1), st.x, top + st.h / 2 + 4, { size: 64, color: '#ffffff' });
      drawLeader(ctx, st.x, top - 40, Math.PI / 2, bodyOf(c), teamOf(c), outfitOf(c), beat, { scale: st.i === 0 ? 1.25 : 1, mood: st.i === 0 ? 'happy' : null });
      K.draw.text((c.isPlayer ? 'YOU' : c.p.name), st.x, top + st.h + 34, { size: 26, sw: 5, color: c.isPlayer ? '#fff08a' : '#ffffff', maxW: 180 });
      K.draw.text(e.len + ' dancers', st.x, top + st.h + 64, { size: 22, sw: 4, maxW: 180 });
      if (c.isPlayer) { ctx.strokeStyle = '#fff08a'; ctx.lineWidth = 5; ctx.setLineDash([10, 8]); ctx.strokeRect(st.x - 102, top - 110, 204, st.h + 190); ctx.setLineDash([]); }
    }
    ctx.restore();
  },
  hud(ctx) {
    const v = K.view, cy = Math.min(Math.max(330 + v.safe.top, v.h * 0.33) + 460, v.h - 76 - v.safe.bottom - 260), s = this.s;
    ctx.save(); ctx.translate(v.w / 2, 80 + v.safe.top); ctx.rotate(Math.sin(K.time * 3) * 0.03);
    const title = this.rank === 1 ? 'YOU WON!' : ORD[this.rank - 1] + ' PLACE';
    K.draw.text(title, 0, 0, { size: 84, color: this.rank === 1 ? '#fff08a' : this.rank <= 3 ? '#86d0ff' : '#ff9a9a' });
    ctx.restore();
    ctx.save(); ctx.translate(v.w / 2, cy); ctx.scale(this.pan.s, this.pan.s);
    K.draw.panel(0, 0, 580, 370, { title: 'PARTY SCORE', color: this.rank === 1 ? 'green' : 'purple' });
    K.draw.text(Math.round(this.shown.n).toLocaleString(), 0, -62, { size: 84, color: '#ffc21a' });
    K.draw.label(this.breakdown, 0, 2, { size: 30 });
    K.draw.pill(0, 54, 'BEST ' + SAVE.best.toLocaleString(), { icon: 'trophy', size: 30 });
    if (this.newBest) { ctx.save(); ctx.translate(0, 104); ctx.rotate(Math.sin(K.time * 4) * 0.05); K.draw.text('NEW BEST!', 0, 0, { size: 50, color: '#8af59a' }); ctx.restore(); }
    K.draw.label(this.near, 0, this.newBest ? 148 : 116, { size: 26, maxW: 540, color: '#c42d84' });
    ctx.restore();
  },
});

    const v = K.view, n = SKINS.filter(k => K.meta.unlocks.has('skin:' + k.id)).length;
    K.draw.text('LEADERS', v.w / 2, 70 + v.safe.top, { size: 64, color: '#ff9ad5' });
    K.draw.pill(v.w - 110 - v.safe.right, 70 + v.safe.top, n + '/' + SKINS.length, { icon: 'star', size: 30 });
    K.draw.text('Unlock by dancing — tap to lead', v.w / 2, 150 + v.safe.top, { size: 26, sw: 5 });
  },
});
K.scenes.add('awards', {
  enter() {
    backBtn('title');
    K.ui.list({ items: ACH, itemH: 118, gap: 14, frame: false,
      place: v => ({ x: v.w / 2, y: (190 + v.safe.top + v.h - 30 - v.safe.bottom) / 2, w: Math.min(v.w - 30, 660), h: v.h - 220 - v.safe.top - v.safe.bottom }),
      drawItem: (ctx, a, i, x, y, w, h) => {
        const got = !!SAVE.ach[a.id];
        K.draw.card(x, y, w, h, { selected: got });
        K.draw.blob(x + 62, y + h / 2, 42, got ? 'yellow' : 'gray');
        K.draw.icon(got ? 'trophy' : 'lock', x + 62, y + h / 2, 48);
        K.draw.label(a.name, x + 124, y + h / 2 - 20, { size: 34, align: 'left', maxW: w - 150, color: got ? K.THEME.paperText : '#8a8aa8' });
        K.draw.label(a.desc, x + 124, y + h / 2 + 24, { size: 23, align: 'left', maxW: w - 150, color: '#6f7891' });
      } });
  },
  backdrop(ctx) { clubBackdrop(ctx, beatNow(), false); },
  hud() {
    const v = K.view;
    K.draw.text('AWARDS', v.w / 2, 70 + v.safe.top, { size: 64, color: '#fff08a' });
    K.draw.pill(v.w - 110 - v.safe.right, 70 + v.safe.top, Object.keys(SAVE.ach).length + '/' + ACH.length, { icon: 'trophy', size: 30 });
    K.draw.text('Earn 8 awards to unlock the Mirror Ball', v.w / 2, 150 + v.safe.top, { size: 26, sw: 5, maxW: v.w - 40 });
  },
});

/* Title card (tools/cards.py renders ?card): key art, deterministic (frozen beat). */
K.scenes.add('card', {
  music: null,
  backdrop(ctx) {
    const v = K.view, beat = 2.1;
    K.draw.sky('#2a0f4a', '#120726');
    ctx.save(); ctx.translate(v.w / 2 - 800, v.h * 0.55 - 1200);
    drawFloor(ctx, 800 - v.w / 2 - v.ox - 50, 1200 - v.h * 0.55 - v.oy - 50, 800 + v.w / 2 + v.ox + 50, 1200 + v.h, beat);
    ctx.restore();
    const cols = ['rgba(255,92,180,0.22)', 'rgba(43,140,255,0.2)', 'rgba(255,194,26,0.2)', 'rgba(47,191,74,0.18)'];
    for (let i = 0; i < 4; i++) {
      const ox = -v.ox + v.fullW * (0.12 + i * 0.25), a = Math.PI / 2 + (i - 1.5) * 0.35;
      ctx.fillStyle = cols[i]; ctx.beginPath(); ctx.moveTo(ox, -v.oy); ctx.lineTo(ox + Math.cos(a - 0.14) * 2000, -v.oy + Math.sin(a - 0.14) * 2000); ctx.lineTo(ox + Math.cos(a + 0.14) * 2000, -v.oy + Math.sin(a + 0.14) * 2000); ctx.closePath(); ctx.fill();
    }
  },
  render(ctx) {
    const v = K.view, beat = 2.25, X0 = -v.ox, FW = v.fullW;
    // hero conga swooping across the bottom
    const pts = [];
    for (let i = 0; i < 12; i++) { const u = i / 11; pts.push({ x: v.w * 0.5 + 330 - u * 1150, y: v.h * 0.72 + Math.sin(u * 4.5 + 0.3) * 120 - u * 40 }); }
    const sk = SKINS[0];
    ctx.lineWidth = 14; ctx.strokeStyle = sk.team; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)); ctx.stroke();
    // rival line being cut on the right
    const rv = [];
    for (let i = 0; i < 7; i++) rv.push({ x: X0 + FW - 130 - i * 8, y: v.h * 0.45 + i * 92 });
    ctx.strokeStyle = K.THEME.colors.blue[1]; ctx.beginPath(); rv.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)); ctx.stroke();
    for (let i = rv.length - 1; i >= 1; i--) drawDancer(rv[i].x, rv[i].y, (i + 3) % NBODY, K.THEME.colors.blue[1], beat, (i % 2) * 0.5, false, 1.6);
    drawLeader(ctx, rv[0].x, rv[0].y, Math.PI / 2, RIVALS[0].body, K.THEME.colors.blue[1], 'shades', beat, { scale: 1.5 });
    // motion lines behind the leader
    ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.lineWidth = 7; ctx.lineCap = 'round';
    for (let i = 0; i < 4; i++) { const y = pts[0].y - 150 + i * 30; ctx.beginPath(); ctx.moveTo(pts[0].x - 90 - i * 10, y); ctx.lineTo(pts[0].x - 200 - i * 20, y); ctx.stroke(); }
    const items = pts.map((p, i) => ({ p, i })).sort((a, b) => a.p.y - b.p.y);
    for (const { p, i } of items) {
      if (i === 0) drawLeader(ctx, p.x, p.y, 0, sk.body, sk.team, sk.outfit, beat, { scale: 2.3 });
      else drawDancer(p.x, p.y, i % NBODY, sk.team, beat, (i % 2) * 0.5, false, 1.9);
    }
    // free dancers + golden VIP
    const fr = [[X0 + 150, v.h * 0.43], [X0 + 330, v.h * 0.5]];
    for (const [x, y] of fr) { drawDancer(x, y, 6, null, 0.3, 0, false, 1.7); K.draw.text('?', x + 40, y - 70, { size: 44 }); }
    K.draw.glow(v.w * 0.5 + 520, v.h * 0.62, 120, '#fff3a0', 0.7);
    drawDancer(v.w * 0.5 + 520, v.h * 0.62, 2, null, 0.1, 0, false, 2); K.draw.star(v.w * 0.5 + 520, v.h * 0.62 - 95, 26, '#ffc21a', { outline: 4 });
    // confetti + music notes, drawn by hand
    const r = K.rng(12), cc = ['#ff5cb4', '#ffc21a', '#2b8cff', '#2fbf4a', '#ffffff', '#8f5bff'];
    for (let i = 0; i < 70; i++) { ctx.save(); ctx.translate(X0 + r.range(0, FW), r.range(-v.oy, v.h * 0.95)); ctx.rotate(r.range(0, TAU)); ctx.fillStyle = r.pick(cc); ctx.fillRect(-8, -4, 16, 8); ctx.restore(); }
    for (let i = 0; i < 6; i++) K.draw.icon('music', X0 + r.range(80, FW - 80), r.range(v.h * 0.05, v.h * 0.35), r.range(50, 80), r.pick(['#fff08a', '#ff9ad5', '#86d0ff']));
  },
  hud(ctx) {
    const v = K.view;
    ctx.save(); ctx.translate(v.w / 2, v.h * 0.26); ctx.rotate(-0.07);
    K.draw.text('CONGA', 0, -100, { size: 250, color: '#fff08a', sw: 18 });
    K.draw.text('LINE!', 40, 115, { size: 230, color: '#ff9ad5', sw: 18 });
    ctx.restore();
  },
});

K.boot(/[?&]card\b/.test(location.search) ? 'card' : 'title');
</script>
