<script>
"use strict";
/* §1 MANIFEST */
const MANIFEST = {
  id: 'moss-knight',
  title: 'Moss Knight',
  version: '1.0.0',
  genre: 'platformer',
  theme: 'retro',
  orientation: 'landscape',
  design: { w: 1280, h: 720, maxH: 900 },
  touch: { stick: true, buttons: [{ action: 'action', icon: 'arrowU', color: 'green' }, { action: 'alt', icon: 'bolt', color: 'red' }] },
  keys: {
    action: ['Space', 'Enter', 'KeyZ', 'KeyK', 'PadA'],
    alt: ['ShiftLeft', 'ShiftRight', 'KeyX', 'KeyJ', 'KeyC', 'PadB', 'PadX'],
  },
};
</script>
<script>
//#KERNEL-BEGIN 1.1.0
/* =========================================================================
   SlopGames KERNEL 1.1.0 — single-file HTML5 game kernel (Canvas2D, zero deps)
   Requires a global `MANIFEST` declared in an earlier <script>. Exposes `K`.
   Source of truth: /kernel/kernel-1.1.0.js  — never edit inside a game file.
   ========================================================================= */
const K = (() => {
  'use strict';
  const KERNEL_VERSION = '1.1.0';
  const TAU = Math.PI * 2;

  /* ---------- manifest defaults ---------- */
  const MF = (typeof MANIFEST !== 'undefined' && MANIFEST) ? MANIFEST : {};
  const DEFAULT_KEYS = {
    up: ['ArrowUp', 'KeyW', 'PadUp'], down: ['ArrowDown', 'KeyS', 'PadDown'],
    left: ['ArrowLeft', 'KeyA', 'PadLeft'], right: ['ArrowRight', 'KeyD', 'PadRight'],
    action: ['Space', 'Enter', 'PadA'], alt: ['ShiftLeft', 'KeyX', 'PadB'],
    pause: ['Escape', 'KeyP', 'PadStart'],
  };
  MF.id = MF.id || 'game';
  MF.title = MF.title || 'Game';
  MF.version = MF.version || '1.0.0';
  MF.design = Object.assign({ w: 720, h: 1280 }, MF.design || {});
  MF.keys = Object.assign({}, DEFAULT_KEYS, MF.keys || {});
  MF.touch = Object.assign({ stick: false, buttons: [] }, MF.touch || {});
  MF.platformOrigins = MF.platformOrigins || [];
  MF.orientation = MF.orientation || 'any';            // 'portrait' | 'landscape' | 'any'
  MF.theme = MF.theme || 'candy';

  /* ---------- canvas bootstrap (games may omit their own <canvas>) ---------- */
  if (!document.getElementById('k-base-css')) {
    const st = document.createElement('style'); st.id = 'k-base-css';
    st.textContent = 'html,body{margin:0;height:100%;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}#stage{position:fixed;inset:0;display:block;width:100%;height:100%;outline:none}';
    document.head.appendChild(st);
  }
  let canvas = document.getElementById('stage');
  if (!canvas) { canvas = document.createElement('canvas'); canvas.id = 'stage'; canvas.tabIndex = 0; document.body.appendChild(canvas); }
  const mainCtx = canvas.getContext('2d');
  let ctx = mainCtx;                                    // swapped while baking sprites

  /* =======================================================================
     MATH / RNG / NOISE / COLOR
     ======================================================================= */
  const M = {
    TAU,
    clamp: (v, a, b) => v < a ? a : v > b ? b : v,
    lerp: (a, b, t) => a + (b - a) * t,
    invLerp: (a, b, v) => (v - a) / (b - a),
    remap: (v, a, b, c, d) => c + (d - c) * ((v - a) / (b - a)),
    smoothstep: (a, b, v) => { const t = Math.max(0, Math.min(1, (v - a) / (b - a))); return t * t * (3 - 2 * t); },
    dist: (ax, ay, bx, by) => Math.hypot(bx - ax, by - ay),
    dist2: (ax, ay, bx, by) => (bx - ax) * (bx - ax) + (by - ay) * (by - ay),
    len: (x, y) => Math.hypot(x, y),
    norm: (x, y) => { const l = Math.hypot(x, y) || 1; return { x: x / l, y: y / l }; },
    dot: (ax, ay, bx, by) => ax * bx + ay * by,
    cross: (ax, ay, bx, by) => ax * by - ay * bx,
    rotate: (x, y, a) => { const c = Math.cos(a), s = Math.sin(a); return { x: x * c - y * s, y: x * s + y * c }; },
    angle: (x, y) => Math.atan2(y, x),
    angleDiff: (a, b) => { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; },
    approach: (v, t, d) => v < t ? Math.min(v + d, t) : Math.max(v - d, t),
    damp: (a, b, lambda, dt) => a + (b - a) * (1 - Math.exp(-lambda * dt)),
    wrap: (v, max) => ((v % max) + max) % max,
    sign: v => v > 0 ? 1 : v < 0 ? -1 : 0,
  };

  function rng(seed = 1) {
    let s = (seed >>> 0) || 1;
    const r = () => {
      s = (s + 0x6D2B79F5) | 0;
      let t = Math.imul(s ^ (s >>> 15), 1 | s);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    r.range = (a, b) => a + (b - a) * r();
    r.int = (a, b) => Math.floor(a + (b - a + 1) * r());
    r.pick = arr => arr[Math.floor(r() * arr.length)];
    r.chance = p => r() < p;
    r.sign = () => r() < 0.5 ? -1 : 1;
    r.shuffle = arr => { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); const t = arr[i]; arr[i] = arr[j]; arr[j] = t; } return arr; };
    r.weighted = (items, weightOf = it => it.w) => {
      let total = 0; for (const it of items) total += weightOf(it);
      let x = r() * total; for (const it of items) { x -= weightOf(it); if (x <= 0) return it; }
      return items[items.length - 1];
    };
    r.state = () => s;
    r.setState = v => { s = v | 0; };
    return r;
  }
  function hashSeed(str) {
    let h = 2166136261;
    str = String(str);
    for (let i = 0; i < str.length; i++) h = Math.imul(h ^ str.charCodeAt(i), 16777619);
    return h >>> 0;
  }
  function dailySeed(offsetDays = 0) {
    const d = new Date(Date.now() + offsetDays * 864e5);
    return hashSeed(MF.id + ':' + d.getUTCFullYear() + '-' + (d.getUTCMonth() + 1) + '-' + d.getUTCDate());
  }

  function noise(seed = 1) {
    const r = rng(seed), p = new Uint16Array(512), vals = new Float32Array(256), perm = [];
    for (let i = 0; i < 256; i++) { perm.push(i); vals[i] = r() * 2 - 1; }
    r.shuffle(perm);
    for (let i = 0; i < 512; i++) p[i] = perm[i & 255];
    const fade = t => t * t * (3 - 2 * t);
    const h1 = i => vals[p[i & 255]];
    const h2 = (i, j) => vals[p[p[i & 255] + (j & 255)]];
    function n1(x) { const xi = Math.floor(x), t = fade(x - xi); return M.lerp(h1(xi), h1(xi + 1), t); }
    function n2(x, y) {
      const xi = Math.floor(x), yi = Math.floor(y), u = fade(x - xi), v = fade(y - yi);
      return M.lerp(M.lerp(h2(xi, yi), h2(xi + 1, yi), u), M.lerp(h2(xi, yi + 1), h2(xi + 1, yi + 1), u), v);
    }
    function fbm(fn, oct, ...c) { let s = 0, a = 1, f = 1, n = 0; for (let i = 0; i < oct; i++) { s += a * fn(...c.map(v => v * f)); n += a; a *= 0.5; f *= 2; } return s / n; }
    return { n1, n2, fbm1: (x, o = 4) => fbm(n1, o, x), fbm2: (x, y, o = 4) => fbm(n2, o, x, y) };
  }

  const color = {
    rgb(hex) { hex = hex.replace('#', ''); if (hex.length === 3) hex = hex.split('').map(c => c + c).join(''); const n = parseInt(hex, 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; },
    hex(r, g, b) { return '#' + [r, g, b].map(v => Math.round(M.clamp(v, 0, 255)).toString(16).padStart(2, '0')).join(''); },
    mix(a, b, t) { const A = color.rgb(a), B = color.rgb(b); return color.hex(M.lerp(A[0], B[0], t), M.lerp(A[1], B[1], t), M.lerp(A[2], B[2], t)); },
    shade(hex, amt) { return amt >= 0 ? color.mix(hex, '#ffffff', amt) : color.mix(hex, '#000000', -amt); },
    alpha(hex, a) { const c = color.rgb(hex); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; },
    hsl(h, s, l) { return `hsl(${h},${s}%,${l}%)`; },
    pal(base) { return [color.shade(base, 0.45), base, color.shade(base, -0.3)]; },
  };

  const fmt = (n) => {
    const a = Math.abs(n);
    if (a < 1000) return String(Math.floor(n));
    const u = ['K', 'M', 'B', 'T', 'Qa', 'Qi']; let i = -1, v = a;
    while (v >= 1000 && i < u.length - 1) { v /= 1000; i++; }
    return (n < 0 ? '-' : '') + (v < 10 ? v.toFixed(2) : v < 100 ? v.toFixed(1) : Math.floor(v)) + u[i];
  };
  const fmtTime = (sec) => { sec = Math.max(0, Math.ceil(sec)); const m = Math.floor(sec / 60), s = sec % 60; return m + ':' + String(s).padStart(2, '0'); };
  function compact(arr, keep) { let j = 0; for (let i = 0; i < arr.length; i++) if (keep(arr[i], i)) arr[j++] = arr[i]; arr.length = j; return arr; }

  /* =======================================================================
     EASING / TWEENS / SPRINGS (cosmetic, real-time)
     ======================================================================= */
  const Ease = {
    linear: t => t,
    inQuad: t => t * t,
    outQuad: t => 1 - (1 - t) * (1 - t),
    inOutQuad: t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2,
    inCubic: t => t * t * t,
    outCubic: t => 1 - Math.pow(1 - t, 3),
    inOutCubic: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
    outQuart: t => 1 - Math.pow(1 - t, 4),
    inBack: t => { const c1 = 1.70158; return (c1 + 1) * t * t * t - c1 * t * t; },
    outBack: t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
    outElastic: t => t === 0 ? 0 : t === 1 ? 1 : Math.pow(2, -10 * t) * Math.sin((t * 10 - .75) * (TAU / 3)) + 1,
    outBounce: t => {
      const n = 7.5625, d = 2.75;
      if (t < 1 / d) return n * t * t;
      if (t < 2 / d) return n * (t -= 1.5 / d) * t + .75;
      if (t < 2.5 / d) return n * (t -= 2.25 / d) * t + .9375;
      return n * (t -= 2.625 / d) * t + .984375;
    },
    pingPong: t => t < 0.5 ? t * 2 : 2 - t * 2,
  };
  const tweens = [];
  function tween(obj, to, dur = 0.3, ease = Ease.outQuad, delay = 0) {
    const tw = { obj, to, from: {}, dur: Math.max(dur, 1e-4), ease, t: -delay, started: false, done: false, _then: null,
      then(fn) { this._then = fn; return this; }, kill() { this.done = true; } };
    tweens.push(tw);
    return tw;
  }
  tween.killOf = obj => { for (const t of tweens) if (t.obj === obj) t.done = true; };
  function wait(sec) { return new Promise(res => tween({}, {}, sec).then(res)); }
  function updateTweens(dt) {
    for (let i = tweens.length - 1; i >= 0; i--) {
      const tw = tweens[i];
      if (tw.done) { tweens.splice(i, 1); continue; }
      tw.t += dt;
      if (tw.t < 0) continue;
      if (!tw.started) { tw.started = true; for (const k in tw.to) tw.from[k] = tw.obj[k]; }
      const p = Math.min(1, tw.t / tw.dur), e = tw.ease(p);
      for (const k in tw.to) tw.obj[k] = tw.from[k] + (tw.to[k] - tw.from[k]) * e;
      if (p >= 1) { tw.done = true; tweens.splice(i, 1); if (tw._then) tw._then(); }
    }
  }
  // Critically-damped-ish spring: call every frame. s = {v, vel}; returns new value.
  function spring(s, target, dt, stiffness = 220, damping = 18) {
    const a = (target - s.v) * stiffness - s.vel * damping;
    s.vel += a * dt; s.v += s.vel * dt;
    return s.v;
  }

  /* =======================================================================
     VIEW / RESIZE / ADAPTIVE QUALITY
     ======================================================================= */
  const view = { w: MF.design.w, h: MF.design.h, fullW: MF.design.w, fullH: MF.design.h, ox: 0, oy: 0,
    scale: 1, dpr: 1, dprCap: 2.5, safe: { top: 0, right: 0, bottom: 0, left: 0 },
    get portrait() { return this.fullH >= this.fullW; } };
  const probe = document.createElement('div');
  probe.style.cssText = 'position:fixed;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)';
  document.body.appendChild(probe);
  function resize() {
    const D = MF.design;
    const cw = Math.max(1, window.innerWidth), ch = Math.max(1, window.innerHeight);
    const dpr = Math.min(window.devicePixelRatio || 1, view.dprCap);
    const scale = Math.min(cw / D.w, ch / D.h);
    view.scale = scale; view.dpr = dpr;
    view.fullW = cw / scale; view.fullH = ch / scale;
    view.w = Math.min(view.fullW, D.maxW || Infinity);
    view.h = Math.min(view.fullH, D.maxH || Infinity);
    view.ox = (view.fullW - view.w) / 2; view.oy = (view.fullH - view.h) / 2;
    canvas.width = Math.round(cw * dpr); canvas.height = Math.round(ch * dpr);
    const cs = getComputedStyle(probe);
    view.safe.top = Math.max(0, (parseFloat(cs.paddingTop) || 0) / scale - view.oy);
    view.safe.right = Math.max(0, (parseFloat(cs.paddingRight) || 0) / scale - view.ox);
    view.safe.bottom = Math.max(0, (parseFloat(cs.paddingBottom) || 0) / scale - view.oy);
    view.safe.left = Math.max(0, (parseFloat(cs.paddingLeft) || 0) / scale - view.ox);
    spriteCache.checkRes();
    input.layoutTouch();
    if (camera.auto) camera.center();
    scenes.layout();
  }

  /* =======================================================================
     THEMES — art-direction presets; every preset has the same color keys
     ======================================================================= */
  const ROUNDED = '"Arial Rounded MT Bold","Nunito","Baloo 2",ui-rounded,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';
  const THEMES = {
    candy: { ink: '#1b1b3a', paper: '#fff7e8', paperText: '#1b1b3a', bg: '#1b1b3a', sky: ['#4fc3ff', '#8a6cff'], font: ROUNDED,
      colors: { green: ['#8af59a', '#2fbf4a', '#1d8a33'], blue: ['#86d0ff', '#2b8cff', '#1a5fc0'], yellow: ['#fff08a', '#ffc21a', '#d48a00'],
        red: ['#ff9a9a', '#ff4b5c', '#c0283a'], purple: ['#d2b0ff', '#8f5bff', '#5f33c4'], orange: ['#ffc48a', '#ff8a1f', '#c45c00'],
        pink: ['#ffb0dc', '#ff5cb4', '#c42d84'], gray: ['#eef0f6', '#aab2c8', '#6f7891'] } },
    neon: { ink: '#07041a', paper: '#1a1440', paperText: '#ffffff', bg: '#07041a', sky: ['#1a0f3d', '#05030f'], font: ROUNDED, glow: true,
      colors: { green: ['#b0ffd0', '#22ff88', '#00a352'], blue: ['#b0f0ff', '#22d3ff', '#0078b8'], yellow: ['#fffbb0', '#ffe600', '#b89f00'],
        red: ['#ffb0c4', '#ff2e63', '#a8002f'], purple: ['#ebc4ff', '#b44cff', '#6d17b0'], orange: ['#ffd8b0', '#ff8c1a', '#b35400'],
        pink: ['#ffc8f2', '#ff3cc7', '#a3007a'], gray: ['#e0e3ff', '#8088c0', '#3a4070'] } },
    pastel: { ink: '#4a3f5c', paper: '#fffaf3', paperText: '#4a3f5c', bg: '#efe4ff', sky: ['#ffe1ec', '#d9e8ff'], font: ROUNDED,
      colors: { green: ['#d4f7dc', '#9be3ad', '#5fb377'], blue: ['#d6ecff', '#9ccbff', '#5f95cf'], yellow: ['#fff6cc', '#ffe08a', '#d1aa45'],
        red: ['#ffd6dc', '#ff9eac', '#cf6575'], purple: ['#ebdcff', '#c3a3ff', '#8b6bc9'], orange: ['#ffe4cc', '#ffbf8a', '#cf8c52'],
        pink: ['#ffdcef', '#ffa8d4', '#cf6fa0'], gray: ['#f4f2f7', '#cfc9d9', '#968ea6'] } },
    jungle: { ink: '#1f2a12', paper: '#fff6dc', paperText: '#1f2a12', bg: '#1f2a12', sky: ['#9be58e', '#2e8b57'], font: ROUNDED,
      colors: { green: ['#c4f28a', '#6cc23a', '#3d7a1c'], blue: ['#9fe3e0', '#2fa8a0', '#1d6b66'], yellow: ['#fff0a0', '#f2c230', '#a8800f'],
        red: ['#ffb09a', '#e8573a', '#a3321c'], purple: ['#d8b8ff', '#9b6ad6', '#63408f'], orange: ['#ffcf8f', '#f08c24', '#a85a0c'],
        pink: ['#ffc0d2', '#e86a94', '#a33a5e'], gray: ['#efe9d8', '#b5ab8f', '#7a7058'] } },
    ocean: { ink: '#0b2545', paper: '#f0fbff', paperText: '#0b2545', bg: '#0b2545', sky: ['#5ee7ff', '#1b6ca8'], font: ROUNDED,
      colors: { green: ['#a8ffe0', '#2ee6a6', '#16a374'], blue: ['#a8e4ff', '#2ab0ff', '#1572b3'], yellow: ['#fff3b0', '#ffd23f', '#b8901a'],
        red: ['#ffb3b3', '#ff5a5f', '#b8323a'], purple: ['#c9c4ff', '#7a6cff', '#4a3fb3'], orange: ['#ffd1a8', '#ff9a3c', '#b8621a'],
        pink: ['#ffc4e1', '#ff70b0', '#b83d78'], gray: ['#e8f4f8', '#9fbccb', '#5e7f8f'] } },
    retro: { ink: '#000000', paper: '#1d1d1d', paperText: '#ffffff', bg: '#000000', sky: ['#1a0033', '#000000'], font: '"Courier New",ui-monospace,Menlo,monospace',
      colors: { green: ['#80ff80', '#00d800', '#008800'], blue: ['#80c0ff', '#3878f8', '#0030b0'], yellow: ['#ffff80', '#f8d800', '#a88800'],
        red: ['#ff8080', '#f83800', '#a80000'], purple: ['#e080ff', '#a000f8', '#6000a8'], orange: ['#ffc080', '#f87800', '#a84800'],
        pink: ['#ffa0e0', '#f878f8', '#a838a8'], gray: ['#ffffff', '#bcbcbc', '#7c7c7c'] } },
    ink: { ink: '#141414', paper: '#ffffff', paperText: '#141414', bg: '#f5f1e8', sky: ['#faf7f0', '#e6dfcf'], font: ROUNDED,
      colors: { green: ['#e6e6e6', '#bdbdbd', '#7a7a7a'], blue: ['#e6e6e6', '#9e9e9e', '#5c5c5c'], yellow: ['#fff3c4', '#ffd84d', '#b89400'],
        red: ['#ffc9c4', '#e8402e', '#9e2216'], purple: ['#e0e0e0', '#8a8a8a', '#4d4d4d'], orange: ['#f0f0f0', '#b0b0b0', '#6e6e6e'],
        pink: ['#ffd6d1', '#f07a6e', '#a83f34'], gray: ['#ffffff', '#d6d6d6', '#8f8f8f'] } },
  };
  const THEME = {};
  function setTheme(name) {
    const t = THEMES[name] || THEMES.candy;
    for (const k in THEME) delete THEME[k];
    Object.assign(THEME, JSON.parse(JSON.stringify(t)), { name: THEMES[name] ? name : 'candy' });
    if (MF.bg) THEME.bg = MF.bg;
    document.body.style.background = THEME.bg;
    spriteCache.clear();
  }

  /* =======================================================================
     STORAGE / SAVE / META-PROGRESSION
     ======================================================================= */
  const store = (() => {
    const ns = 'k:' + MF.id + ':';
    const mem = {};
    return {
      get(k, def) {
        if (k in mem) return mem[k];
        try { const v = localStorage.getItem(ns + k); if (v != null) return (mem[k] = JSON.parse(v)); } catch (e) {}
        return def;
      },
      set(k, v) {
        mem[k] = v;
        try { localStorage.setItem(ns + k, JSON.stringify(v)); } catch (e) {}
        sdk.send('save', { key: k, value: v });
      },
      remove(k) { delete mem[k]; try { localStorage.removeItem(ns + k); } catch (e) {} sdk.send('save', { key: k, value: null }); },
      import(obj) { if (obj && typeof obj === 'object') for (const k in obj) if (obj[k] != null) mem[k] = obj[k]; },
    };
  })();

  const clone = o => JSON.parse(JSON.stringify(o));
  function fillDefaults(target, defs) {
    for (const k in defs) {
      if (!(k in target)) target[k] = clone(defs[k]);
      else if (defs[k] && typeof defs[k] === 'object' && !Array.isArray(defs[k]) && target[k] && typeof target[k] === 'object') fillDefaults(target[k], defs[k]);
    }
    return target;
  }
  const save = (() => {
    let def = null;
    const data = {};
    let commitT = null;
    function load(raw) {
      let d = raw && typeof raw === 'object' ? clone(raw) : null;
      if (!d) d = Object.assign(clone(def.defaults), { _v: def.version });
      let v = d._v || 1;
      while (v < def.version) { const fn = def.migrate[v + 1]; if (fn) d = fn(d) || d; v++; d._v = v; }
      fillDefaults(d, def.defaults);
      for (const k in data) delete data[k];
      Object.assign(data, d);
    }
    return {
      // K.save.define({version, defaults, migrate:{2: d => {...}}}) → returns the live data object
      define(o) { def = { version: o.version || 1, defaults: o.defaults || {}, migrate: o.migrate || {} }; load(store.get('save', null)); return data; },
      get data() { return data; },
      commit() { if (def) { clearTimeout(commitT); commitT = null; store.set('save', data); } },
      later() { if (def && !commitT) commitT = setTimeout(() => save.commit(), 800); },
      reset() { if (!def) return; for (const k in data) delete data[k]; Object.assign(data, clone(def.defaults), { _v: def.version }); save.commit(); },
      reload() { if (def) load(store.get('save', null)); },
      get defined() { return !!def; },
    };
  })();

  const meta = (() => {
    const m = () => {
      if (!save.defined) save.define({ version: 1, defaults: {} });

      up(x, y, id) {

      wheel(x, y, dy) { for (let i = W.length - 1; i >= 0; i--) { const w = W[i]; if (w.kind === 'list' && active(w) && inRect(w, x, y, 0)) { const L = kinds.list.layout(w); w.off = M.clamp(w.off + dy, 0, L.maxOff); return true; } } return false; },

  /* =======================================================================
     INPUT — keyboard, unified pointer, multitouch, gamepad, typed text, touch overlay
     ======================================================================= */
  const input = (() => {
    const keyMap = {};
    for (const a in MF.keys) for (const c of MF.keys[a]) (keyMap[c] || (keyMap[c] = [])).push(a);
    const held = new Set(), pr = new Set(), rl = new Set(), vHeld = new Set(), padHeld = new Set();
    const axis = { x: 0, y: 0 }, pad = { x: 0, y: 0, ax: 0, ay: 0, connected: false };
    const typed = [];
    const p = { x: 0, y: 0, down: false, pressed: false, released: false, tap: false, dragging: false,
      startX: 0, startY: 0, dx: 0, dy: 0, downAt: 0, holdTime: 0, id: null, vx: 0, vy: 0, _lx: 0, _ly: 0, _lt: 0,
      get wx() { return camera.toWorld(this.x, this.y).x; }, get wy() { return camera.toWorld(this.x, this.y).y; },
      get wStartX() { return camera.toWorld(this.startX, this.startY).x; }, get wStartY() { return camera.toWorld(this.startX, this.startY).y; } };
    const pointers = new Map();     // all non-UI pointers (multitouch)
    let touchMode = window.matchMedia && matchMedia('(pointer: coarse)').matches;
    const stick = { id: null, ox: 0, oy: 0, kx: 0, ky: 0, r: 90 };
    // Touch overlay config: scene.touch overrides MANIFEST.touch (set scene.touch = null to hide).
    const tc = () => { const sc = scenes.current; return sc && sc.touch !== undefined ? (sc.touch || NO_TOUCH) : MF.touch; };
    const NO_TOUCH = { stick: false, buttons: [] };
    let tbtn = [], tbtnFor = null;
    function syncButtons() {
      const c = tc();
      if (c !== tbtnFor) { tbtnFor = c; tbtn = (c.buttons || []).map(b => ({ action: b.action, label: b.label || '', icon: b.icon || null, color: b.color || 'purple', x: 0, y: 0, r: b.r || 72, id: null })); api.layoutTouch(); }
      return tbtn;
    }
    const toL = e => ({ x: e.clientX / view.scale - view.ox, y: e.clientY / view.scale - view.oy });
    const overlayOn = () => { if (!touchMode || !scenes.current || !scenes.current.gameplay || sys.paused || sys.modal) return false; const c = tc(); syncButtons(); return !!(c.stick || tbtn.length); };
    const press = a => { if (a === 'pause') { if (!sys.modal) sys.paused ? resumeGame() : pauseGame(); return; } held.add(a); pr.add(a); };

    window.addEventListener('keydown', e => {
      audio.unlock();
      if (e.code === 'Backquote') { debug.on = !debug.on; return; }
      if (!sys.ad && !e.ctrlKey && !e.metaKey) { if (e.key.length === 1) typed.push(e.key); else if (e.key === 'Backspace') typed.push('\b'); else if (e.key === 'Enter') typed.push('\n'); }
      const acts = keyMap[e.code];
      if (!acts) { if (e.key === 'Backspace' || e.key === ' ') e.preventDefault(); return; }
      e.preventDefault(); touchMode = false;
      if (e.repeat || sys.ad) return;
      acts.forEach(press);
    });
    window.addEventListener('keyup', e => { const acts = keyMap[e.code]; if (!acts) return; acts.forEach(a => { held.delete(a); rl.add(a); }); });
    window.addEventListener('blur', () => held.clear());

    canvas.addEventListener('pointerdown', e => {
      e.preventDefault(); audio.unlock(); try { canvas.focus({ preventScroll: true }); } catch (_) {}
      if (e.pointerType === 'touch' || e.pointerType === 'pen') touchMode = true; else if (e.pointerType === 'mouse') touchMode = false;
      if (sys.ad) return;
      const q = toL(e);
      try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
      if (sys.crashed) { if (q.y > view.h - 260) location.reload(); return; }
      if (ui.down(q.x, q.y, e.pointerId)) return;
      if (overlayOn()) {
        for (const b of tbtn) if (b.id == null && M.dist(q.x, q.y, b.x, b.y) < b.r * 1.3) { b.id = e.pointerId; vHeld.add(b.action); pr.add(b.action); haptic('light'); return; }
        if (tc().stick && stick.id == null && q.x < view.w * 0.5) { stick.id = e.pointerId; stick.ox = q.x; stick.oy = q.y; stick.kx = stick.ky = 0; return; }
      }
      if (sys.paused) return;
      pointers.set(e.pointerId, { id: e.pointerId, x: q.x, y: q.y, startX: q.x, startY: q.y, downAt: performance.now(), pressed: true });
      if (p.id != null) return;
      p.id = e.pointerId; p.down = true; p.pressed = true; p.dragging = false;
      p.x = p.startX = p._lx = q.x; p.y = p.startY = p._ly = q.y; p.dx = p.dy = p.vx = p.vy = 0; p.downAt = p._lt = performance.now(); p.holdTime = 0;
    });
    canvas.addEventListener('pointermove', e => {
      const q = toL(e);
      if (e.pointerId === stick.id) {
        let dx = q.x - stick.ox, dy = q.y - stick.oy; const d = Math.hypot(dx, dy);
        if (d > stick.r) { dx *= stick.r / d; dy *= stick.r / d; }
        stick.kx = dx; stick.ky = dy; axis.x = dx / stick.r; axis.y = dy / stick.r; return;
      }
      ui.move(q.x, q.y, e.pointerId);
      const pt = pointers.get(e.pointerId); if (pt) { pt.x = q.x; pt.y = q.y; }
      if (e.pointerId === p.id || p.id == null) { p.x = q.x; p.y = q.y; }
      if (e.pointerId === p.id) {
        p.dx = p.x - p.startX; p.dy = p.y - p.startY;
        if (!p.dragging && Math.hypot(p.dx, p.dy) > 14) p.dragging = true;
        const now = performance.now(), dt = Math.max(1, now - p._lt) / 1000;
        p.vx = p.vx * 0.5 + (q.x - p._lx) / dt * 0.5; p.vy = p.vy * 0.5 + (q.y - p._ly) / dt * 0.5; p._lx = q.x; p._ly = q.y; p._lt = now;
      }
    });
    const up = (e, cancel) => {
      const q = toL(e);
      if (ui.up(q.x, q.y, e.pointerId)) return;
      for (const b of tbtn) if (b.id === e.pointerId) { b.id = null; if (!tbtn.some(o => o.id != null && o.action === b.action)) { vHeld.delete(b.action); rl.add(b.action); } return; }
      if (e.pointerId === stick.id) { stick.id = null; axis.x = axis.y = 0; return; }
      pointers.delete(e.pointerId);
      if (e.pointerId === p.id) {
        p.x = q.x; p.y = q.y; p.dx = p.x - p.startX; p.dy = p.y - p.startY;
        if (performance.now() - p._lt > 80) { p.vx = 0; p.vy = 0; }
        p.down = false; p.released = !cancel; p.tap = !cancel && !p.dragging && performance.now() - p.downAt < 350; p.id = null;
      }
    };
    canvas.addEventListener('pointerup', e => up(e, false));
    canvas.addEventListener('pointercancel', e => up(e, true));
    canvas.addEventListener('contextmenu', e => e.preventDefault());
    canvas.addEventListener('wheel', e => { e.preventDefault(); const q = toL(e); if (!ui.wheel(q.x, q.y, e.deltaY)) api.wheel += e.deltaY; }, { passive: false });

    const PAD_NAMES = ['PadA', 'PadB', 'PadX', 'PadY', 'PadLB', 'PadRB', 'PadLT', 'PadRT', 'PadBack', 'PadStart', 'PadL3', 'PadR3', 'PadUp', 'PadDown', 'PadLeft', 'PadRight'];
    const dz = v => Math.abs(v) < 0.2 ? 0 : (v - Math.sign(v) * 0.2) / 0.8;
    function pollPad() {
      if (!navigator.getGamepads) return;

      if (!gp) { if (padHeld.size) { padHeld.forEach(a => rl.add(a)); padHeld.clear(); } pad.x = pad.y = pad.ax = pad.ay = 0; return; }
      const now = new Set();
      gp.buttons.forEach((b, i) => { if (b.pressed && PAD_NAMES[i] && keyMap[PAD_NAMES[i]]) keyMap[PAD_NAMES[i]].forEach(a => now.add(a)); });
      pad.x = dz(gp.axes[0] || 0); pad.y = dz(gp.axes[1] || 0); pad.ax = dz(gp.axes[2] || 0); pad.ay = dz(gp.axes[3] || 0);
      for (const a of now) if (!padHeld.has(a)) { touchMode = false; if (a === 'pause') press(a); else { pr.add(a); } }
      for (const a of padHeld) if (!now.has(a)) rl.add(a);

    }

    const api = {
      pointer: p, pointers, pad, wheel: 0,
      get typed() { return typed; },
      get touch() { return touchMode; },
      down: a => held.has(a) || vHeld.has(a) || padHeld.has(a),
      pressed: a => pr.has(a),
      released: a => rl.has(a),
      axisX() { let x = axis.x + pad.x; if (api.down('left')) x -= 1; if (api.down('right')) x += 1; return M.clamp(x, -1, 1); },
      axisY() { let y = axis.y + pad.y; if (api.down('up')) y -= 1; if (api.down('down')) y += 1; return M.clamp(y, -1, 1); },
      // Normalized movement vector (diagonals not faster).
      move() { const x = api.axisX(), y = api.axisY(), l = Math.hypot(x, y); return l > 1 ? { x: x / l, y: y / l } : { x, y }; },

      },

  })();

  /* =======================================================================
     SCENES
     ======================================================================= */
  const scenes = (() => {
    const reg = {};
    let cur = null, name = null, busy = false;
    const fade = { a: 0 };
    function swap(n, params) {
      if (!reg[n]) { reportError(new Error('Unknown scene: ' + n), 'scenes.go'); return; }
      if (cur) { if (cur.gameplay) sdk.send('gameplayStop'); safeCall(cur, 'exit'); }
      ui.clearScene(); ui.clearModals(); fx.clear(); input.reset(); camera.reset(); sys.paused = false; hitstopT = 0; acc = 0;
      name = n; cur = reg[n];
      safeCall(cur, 'enter', params || {});
      safeCall(cur, 'layout', view);
      ui.place();
      if (cur.music !== undefined) { if (cur.music) music.play(cur.music); else music.stop(); }
      if (cur.gameplay) sdk.send('gameplayStart');
      sdk.send('scene', { name: n });
    }

      add(n, def) { reg[n] = def; return def; },
      has(n) { return !!reg[n]; },
      go(n, params, opts = {}) {

        if (!cur || opts.instant) { swap(n, params); return; }
        busy = true;

      },
      get current() { return cur; },
      get name() { return name; },
      get list() { return Object.keys(reg); },
      fade,

    };
  })();

  /* =======================================================================
     ADS
     ======================================================================= */
  const devAd = { on: false, t: 0, kind: '', res: null };
  async function adBreak(kind = 'midgame') {
    if (sys.ad) return { shown: false, granted: false };
    sys.ad = true; input.reset(); updateDuck(); sdk.send('gameplayStop');
    let r = null;
    if (sdk.connected) r = await sdk.request('adBreak', { kind }, 90000);
    else if (!sdk.inFrame) r = await new Promise(res => { Object.assign(devAd, { on: true, t: kind === 'rewarded' ? 2 : 1, kind, res }); });
    sys.ad = false; updateDuck(); last = performance.now();
    if (scenes.current && scenes.current.gameplay && !sys.paused) sdk.send('gameplayStart');
    r = r || {};
    return { shown: !!r.shown, granted: kind === 'rewarded' && !!r.granted };
  }

  /* =======================================================================
     DEBUG
     ======================================================================= */
  const debug = { on: /[?&]debug/.test(location.search), fps: 60, steps: 0, low: 0 };

  /* ---------- system pause overlay widgets ---------- */
  ui.button({ group: 'sys', label: 'RESUME', icon: 'play', color: 'green', w: 400, h: 120, key: 'action', pulse: true,
    place: v => ({ x: v.w / 2, y: v.h / 2 + 10 }), onTap: resumeGame });
  ui.soundButton({ group: 'sys', place: v => ({ x: v.w / 2 - 130, y: v.h / 2 + 165 }) });
  ui.musicButton({ group: 'sys', place: v => ({ x: v.w / 2, y: v.h / 2 + 165 }) });
  const sysHome = ui.button({ group: 'sys', icon: 'home', color: 'red', w: 110, h: 110,
    place: v => ({ x: v.w / 2 + 130, y: v.h / 2 + 165 }),
    onTap: () => { const sc = scenes.current; sys.paused = false; safeCall(sc, 'onQuit'); } });

  /* =======================================================================
     MAIN LOOP — fixed-step sim (60 Hz), per-frame presentation
     ======================================================================= */
  const STEP = 1 / 60, MAX_STEPS = 6;
  let last = 0, acc = 0, clock = 0, frameN = 0;
  function frame(now) {
    requestAnimationFrame(frame);
    let dt = (now - last) / 1000; last = now;
    if (!(dt > 0)) dt = 0; if (dt > 0.1) dt = 0.1;
    if (dt > 0) debug.fps += (1 / dt - debug.fps) * 0.05;
    frameN++;
    // adaptive resolution: drop DPR if we're struggling
    if (frameN > 120 && debug.fps < 42 && view.dprCap > 1) { if (++debug.low > 90) { view.dprCap = Math.max(1, view.dprCap - 0.5); debug.low = 0; resize(); } } else debug.low = 0;
    if (devAd.on) { devAd.t -= dt; if (devAd.t <= 0) { devAd.on = false; devAd.res({ shown: true, granted: true }); } }
    sys.rotate = input.touch && ((MF.orientation === 'landscape' && view.fullH > view.fullW * 1.1) || (MF.orientation === 'portrait' && view.fullW > view.fullH * 1.1));
    const sc = scenes.current;
    input.poll();
    if (!sys.frozen && sc) {
      clock += dt;
      updateTweens(dt);
      ui.update(dt);
      ui.keys();
      if (!sys.simHalted) {
        let steps = 0;
        if (hitstopT > 0) hitstopT -= dt;
        else {
          acc += dt;
          while (acc >= STEP && steps < MAX_STEPS) {
            safeCall(sc, 'update', STEP); input.endStep(); acc -= STEP; steps++;
            if (scenes.current !== sc || sys.simHalted) break;
          }
          if (steps === MAX_STEPS) acc = 0;
        }
        debug.steps = steps;
        safeCall(sc, 'frame', dt);
        fx.update(dt);
      } else if (sys.modal && !sys.paused) { fx.update(dt); input.endStep(); }
      camera.update(dt, M.clamp(acc / STEP, 0, 1));
    }
    ui.place();
    render();
  }

  function render() {
    const s = view.dpr * view.scale, sc = scenes.current, alpha = M.clamp(acc / STEP, 0, 1);
    ctx = mainCtx;
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1;
    ctx.fillStyle = THEME.bg; ctx.fillRect(0, 0, canvas.width, canvas.height);
    const ox = view.ox, oy = view.oy;
    // world layer (shakes; camera)
    ctx.setTransform(s, 0, 0, s, (ox + fx.offset.x) * s, (oy + fx.offset.y) * s);
    if (sc) safeCall(sc, 'backdrop', ctx, alpha);
    ctx.save(); camera.apply(ctx);
    if (sc) safeCall(sc, 'render', ctx, alpha);
    fx.draw(false);
    ctx.restore();
    // screen layer (stable)
    ctx.setTransform(s, 0, 0, s, ox * s, oy * s);
    if (sc) safeCall(sc, 'hud', ctx, alpha);
    fx.draw(true);
    input.drawTouch();
    ui.draw('scene');
    fx.drawFlash();
    ui.drawModals();
    ui.drawToasts();
    if (sys.paused) {
      ctx.fillStyle = 'rgba(20,18,50,0.62)'; ctx.fillRect(-ox, -oy, view.fullW, view.fullH);
      panel(view.w / 2, view.h / 2 + 50, 540, 480, { title: 'PAUSED', color: 'purple' });
      sysHome.visible = !!(sc && sc.onQuit);
      ui.draw('sys');
    }
    if (sys.rotate) {
      ctx.fillStyle = THEME.bg; ctx.fillRect(-ox, -oy, view.fullW, view.fullH);
      ctx.save(); ctx.translate(view.w / 2, view.h / 2 - 60); ctx.rotate(Math.sin(clock * 3) * 0.6);
      block(-70, -110, 140, 220, 'blue', { r: 24 }); ctx.restore();
      text('Rotate your device', view.w / 2, view.h / 2 + 120, { size: 48, maxW: view.w - 60 });
    }
    if (devAd.on) {
      ctx.fillStyle = '#0d0c22'; ctx.fillRect(-ox, -oy, view.fullW, view.fullH);
      text('AD BREAK', view.w / 2, view.h / 2 - 50, { size: 72, color: '#ffe680' });
      text(`${devAd.kind} · dev stub · ${Math.ceil(devAd.t)}`, view.w / 2, view.h / 2 + 40, { size: 32, color: '#aab2c8' });
    }
    if (sys.crashed) {
      ctx.fillStyle = 'rgba(16,10,30,0.88)'; ctx.fillRect(-ox, -oy, view.fullW, view.fullH);
      icon('skull', view.w / 2, view.h / 2 - 170, 140, '#ff9a9a');
      text('Oops! The game crashed.', view.w / 2, view.h / 2 - 40, { size: 50, maxW: view.w - 60 });
      label(sys.crashed.where + ': ' + sys.crashed.message, view.w / 2, view.h / 2 + 40, { size: 26, color: '#ffb0b0', maxW: view.w - 60 });
      block(view.w / 2 - 190, view.h - 220, 380, 110, 'green', { r: 36 }); text('RESTART', view.w / 2, view.h - 170, { size: 48 });
    }
    if (scenes.fade.a > 0) { ctx.globalAlpha = scenes.fade.a; ctx.fillStyle = THEME.bg; ctx.fillRect(-ox, -oy, view.fullW, view.fullH); ctx.globalAlpha = 1; }
    if (debug.on) {
      const lines = [`${debug.fps | 0} fps · ${debug.steps} steps · ${fx.count} fx · ${spriteCache.size} spr`, `${view.w | 0}×${view.h | 0} @${(view.dpr * view.scale).toFixed(2)} · scene ${scenes.name} · k${KERNEL_VERSION}`];
      lines.forEach((l, i) => text(l, 12 - 0, 22 + i * 26 + view.safe.top, { size: 20, align: 'left', shadow: false, sw: 4 }));
    }
  }

  /* =======================================================================
     BOOT
     ======================================================================= */
  let booted = false;
  function boot(startScene, params) {
    if (booted) return; booted = true;
    // Title-card mode: the platform (window.SG_CARD) or a ?card URL boots a game's 'card' key-art scene for thumbnails.
    try { if ((window.SG_CARD || /[?&]card\b/.test(location.search)) && scenes.has('card')) startScene = 'card'; } catch (e) {}
    resize();
    window.addEventListener('resize', resize);
    if (window.visualViewport) visualViewport.addEventListener('resize', resize);
    document.addEventListener('visibilitychange', () => {
      sys.hidden = document.hidden;
      if (document.hidden) { pauseGame(); input.reset(); save.commit(); }
      updateDuck(); last = performance.now();
    });
    window.addEventListener('pagehide', () => save.commit());
    sdk.on('hello', d => {
      sdk.connected = true;
      if (d && d.save) { store.import(d.save); save.reload(); }
      if (d && typeof d.muted === 'boolean') { sys.platformMute = d.muted; updateDuck(); }
      if (d && d.debug) debug.on = true;
    });
    sdk.on('pause', () => { sys.platformPause = true; pauseGame(); updateDuck(); });
    sdk.on('resume', () => { sys.platformPause = false; updateDuck(); last = performance.now(); });
    sdk.on('mute', d => { sys.platformMute = !!(d && d.muted); updateDuck(); });
    sdk.on('debug', d => { debug.on = !!(d && d.on); });

      for (let tx = x0; tx <= x1; tx++) { const inf = map.info(map.get(tx, ty)); if (inf.oneWay) oneWay = true; if (inf.solid) solid = true; }

    // jumps
    if (p.buf > 0 && p.dashT <= 0) {
      if (p.coyote > 0) {
        p.vy = -PHYS.JUMP; p.buf = 0; p.coyote = 0; p.ride = -1; p.onGround = false;
        Sim.emit(s, 'jump', { x: p.x, y: p.y + p.h / 2 });
      } else if (p.wallT > 0) {
        p.vx = -p.wallDir * PHYS.WJX; p.vy = -PHYS.WJY; p.face = -p.wallDir; p.lock = PHYS.WLOCK; p.buf = 0; p.wallT = 0;
        Sim.emit(s, 'walljump', { x: p.x + p.wallDir * p.w / 2, y: p.y, dir: -p.wallDir });
      }
    }
    // dash / attack
    if (cmd.dash && p.canDash && p.dashCD <= 0) {
      const dir = mx || p.face;
      p.dashT = PHYS.DASHT; p.dashDir = dir; p.face = dir; p.canDash = false; p.dashCD = PHYS.DASHCD; p.vy = 0; p.lock = 0; p.ride = -1;
      Sim.emit(s, 'dash', { x: p.x, y: p.y, dir });
    }
    // gravity + wall slide
    p.slide = false;
    if (p.dashT <= 0) {
      let g = PHYS.GRAV;
      if (p.vy < 0 && !cmd.jumpHeld && p.springT <= 0) g *= PHYS.CUT;
      else if (Math.abs(p.vy) < 140 && cmd.jumpHeld) g *= 0.6;
      p.vy += g * dt;
      if (p.onWall && !p.onGround && mx === p.onWall && p.vy > PHYS.SLIDE) { p.vy = PHYS.SLIDE; p.slide = true; }
      p.vy = Math.min(p.vy, PHYS.MAXFALL);
    }
    p.dropThrough = p.drop > 0;
    const prevBottom = p.y + p.h / 2, wasGround = p.onGround, fallV = p.vy;
    const touched = map.move(p, dt);
    // movers are one-way platforms
    p.ride = -1;
    if (p.vy >= 0 && !p.dropThrough) {
      for (let i = 0; i < s.movers.length; i++) {
        const m = s.movers[i], tol = 6 + Math.abs(m.dy);
        if (p.x + p.w / 2 - 3 > m.x && p.x - p.w / 2 + 3 < m.x + m.w && prevBottom <= m.y + tol && p.y + p.h / 2 >= m.y - 0.5) {
          p.y = m.y - p.h / 2; p.vy = 0; p.onGround = true; p.ride = i; break;
        }
      }
    }
    if (p.onGround && !wasGround && fallV > 380) Sim.emit(s, 'land', { x: p.x, y: p.y + p.h / 2, v: fallV });
    if (p.slide && s.frame % 4 === 0) Sim.emit(s, 'slide', { x: p.x + p.onWall * p.w / 2, y: p.y + 10 });
    // crumble blocks under feet
    if (p.onGround && p.ride < 0) {
      const ty = Math.floor((p.y + p.h / 2 + 2) / TS), x0 = Math.floor((p.x - p.w / 2 + 1) / TS), x1 = Math.floor((p.x + p.w / 2 - 1) / TS);
      for (let tx = x0; tx <= x1; tx++) if (map.get(tx, ty) === 'X' && !s.crumbles.some(c => c.tx === tx && c.ty === ty)) {
        s.crumbles.push({ tx, ty, t: 0, st: 'shake' }); Sim.emit(s, 'crack', { x: (tx + 0.5) * TS, y: ty * TS });
      }
    }
    // tiles
    for (const tt of touched) {
      const inf = tt.info, x0 = tt.tx * TS, y0 = tt.ty * TS;
      if (inf.coin) { map.set(tt.tx, tt.ty, '.'); s.coins++; Sim.emit(s, 'coin', { x: x0 + 32, y: y0 + 32 }); }
      else if (inf.gem) {
        map.set(tt.tx, tt.ty, '.'); const g = s.gems.find(q => q.tx === tt.tx && q.ty === tt.ty); if (g) g.got = true;
        s.gemGot++; Sim.emit(s, 'gem', { x: x0 + 32, y: y0 + 32, n: s.gemGot });
      } else if (inf.heart) { map.set(tt.tx, tt.ty, '.'); if (s.hearts < PHYS.HEARTS) s.hearts++; else s.coins += 5; Sim.emit(s, 'heart', { x: x0 + 32, y: y0 + 32 }); }
      else if (inf.check && s.checkIdx !== tt.ty * 1000 + tt.tx) {
        s.checkIdx = tt.ty * 1000 + tt.tx; s.check = { x: x0 + 32, y: y0 + TS - p.h / 2 }; s.checks++;
        const refill = s.hearts < PHYS.HEARTS; s.hearts = PHYS.HEARTS;
        Sim.emit(s, 'check', { x: x0 + 32, y: y0 + 32, refill });
      } else if (inf.exit && s.exitOpen && Math.abs(p.x - (x0 + 32)) < 30) { s.won = true; Sim.emit(s, 'win', { x: x0 + 32, y: y0 + 32 }); return; }
      else if (inf.spring && p.vy >= -50 && p.y + p.h / 2 > y0 + TS * 0.45) {
        p.vy = -PHYS.SPRING; p.springT = 0.45; p.canDash = true; p.coyote = 0; p.buf = 0; p.onGround = false; p.dashT = 0;
        Sim.emit(s, 'spring', { x: x0 + 32, y: y0 + TS, tx: tt.tx, ty: tt.ty });
      } else if ((inf.spike || inf.lava) && Sim.hazardHit(p, inf, x0, y0)) { Sim.die(s, inf.lava ? 'lava' : 'spike'); return; }
    }
    if (p.y - p.h / 2 > map.ph + 40) { Sim.die(s, 'pit'); return; }
    Sim.stepEnemies(s, dt);
    Sim.stepBoss(s, dt);
  },
  hazardHit(p, inf, x0, y0) {
    let hx0 = x0 + 10, hx1 = x0 + TS - 10, hy0 = y0 + 10, hy1 = y0 + TS - 10;
    if (inf.lava) { hx0 = x0; hx1 = x0 + TS; hy0 = y0 + TS * 0.35; hy1 = y0 + TS; }
    else if (inf.spike === 'up') { hy0 = y0 + TS * 0.5; hy1 = y0 + TS; }
    else if (inf.spike === 'down') { hy0 = y0; hy1 = y0 + TS * 0.5; }
    else if (inf.spike === 'left') { hx0 = x0 + TS * 0.5; hx1 = x0 + TS; }
    else if (inf.spike === 'right') { hx0 = x0; hx1 = x0 + TS * 0.5; }
    const px0 = p.x - p.w / 2 + 5, px1 = p.x + p.w / 2 - 5, py0 = p.y - p.h / 2 + 6, py1 = p.y + p.h / 2 - 2;
    return px1 > hx0 && px0 < hx1 && py1 > hy0 && py0 < hy1;
  },
  die(s, why) {
    const p = s.p;
    s.deaths++; s.hearts--;
    Sim.emit(s, 'die', { x: p.x, y: Math.min(p.y, s.map.ph - 20), why, hearts: s.hearts });
    p.deadT = 0.6; p.vx = p.vy = 0; p.dashT = 0; p.ride = -1;
  },
  hurt(s, fromX) {
    const p = s.p;
    if (p.inv > 0 || p.deadT > 0) return;
    s.hurts++; s.hearts--;
    if (s.hearts <= 0) { s.deaths++; Sim.emit(s, 'die', { x: p.x, y: p.y, why: 'enemy', hearts: 0 }); p.deadT = 0.6; p.vx = p.vy = 0; p.dashT = 0; return; }
    const d = p.x >= fromX ? 1 : -1;
    p.vx = d * 430; p.vy = -560; p.lock = 0.22; p.inv = 1.3; p.dashT = 0; p.ride = -1;
    Sim.emit(s, 'hurt', { x: p.x, y: p.y, hearts: s.hearts });
  },
  stepCrumbles(s, dt) {
    const p = s.p;
    for (let i = s.crumbles.length - 1; i >= 0; i--) {
      const c = s.crumbles[i]; c.t += dt;
      if (c.st === 'shake' && c.t >= 0.42) { c.st = 'gone'; c.t = 0; s.map.set(c.tx, c.ty, '.'); Sim.emit(s, 'crumble', { x: (c.tx + 0.5) * TS, y: (c.ty + 0.5) * TS }); }
      else if (c.st === 'gone' && c.t >= 3) {
        const box = { x: (c.tx + 0.5) * TS, y: (c.ty + 0.5) * TS, w: TS, h: TS };
        if (!Sim.overlap(box, p, -2)) { s.map.set(c.tx, c.ty, 'X'); s.crumbles.splice(i, 1); Sim.emit(s, 'restore', { x: box.x, y: box.y }); }
      }
    }
  },
  stepEnemies(s, dt) {
    const p = s.p, map = s.map, alive = p.deadT <= 0;
    for (const e of s.enemies) {
      if (!e.alive) continue;
      e.px = e.x; e.py = e.y; e.t += dt;
      if (e.kind === 'slime') {
        e.vx = e.dir * 70; e.vy = Math.min(e.vy + PHYS.GRAV * dt, PHYS.MAXFALL);
        map.move(e, dt);
        if (e.onWall) e.dir = -e.onWall;
        else if (e.onGround) {
          const ax = Math.floor((e.x + e.dir * (e.w / 2 + 2)) / TS), fy = Math.floor((e.y + e.h / 2 + 4) / TS), my = Math.floor(e.y / TS);
          const below = map.info(map.get(ax, fy)), here = map.info(map.get(ax, my));
          if (!(below.solid || below.oneWay) || here.spike || here.lava) e.dir = -e.dir;
        }
        if (e.y > map.ph + 100) e.alive = false;
      } else if (e.kind === 'bat') {
        e.cd = Math.max(0, e.cd - dt);
        if (e.st === 'idle') {
          e.x = e.hx + Math.sin(e.t * 1.4) * 34; e.y = e.hy + Math.sin(e.t * 2.8) * 10;
          const dx = p.x - e.x, dy = p.y - e.y;
          if (alive && e.cd <= 0 && Math.abs(dx) < 330 && dy > -60 && dy < 380) {
            const l = Math.hypot(dx, dy) || 1; e.vx = dx / l * 330; e.vy = dy / l * 330; e.st = 'swoop'; e.t2 = 0;
            Sim.emit(s, 'screech', { x: e.x, y: e.y });
          }
        } else if (e.st === 'swoop') {
          e.t2 += dt; e.x += e.vx * dt; e.y += e.vy * dt;
          if (e.t2 > 1.1 || map.solid(Math.floor(e.x / TS), Math.floor(e.y / TS))) { e.st = 'back'; e.x = e.px; e.y = e.py; }
        } else {
          const dx = e.hx - e.x, dy = e.hy - e.y, l = Math.hypot(dx, dy);
          if (l < 6) { e.st = 'idle'; e.t = 0; e.cd = 1.2; }
          else { const v = Math.min(l, 190 * dt); e.x += dx / l * v; e.y += dy / l * v; }
        }
      }
      if (!alive || !e.alive) continue;
      if (Sim.overlap(p, e, 5)) {
        if (p.dashT > 0) Sim.kill(s, e, 'dash');
        else if (p.vy > 40 && p.py + p.h / 2 <= e.y + 4) { Sim.kill(s, e, 'stomp'); p.vy = -PHYS.STOMP; p.springT = 0; }
        else Sim.hurt(s, e.x);
      }
    }
    for (let i = s.waves.length - 1; i >= 0; i--) {
      const w = s.waves[i]; w.px = w.x; w.x += w.dir * 560 * dt; w.t += dt;
      if (w.t > 1.6 || map.solid(Math.floor((w.x + w.dir * 20) / TS), Math.floor((w.y - 10) / TS))) { s.waves.splice(i, 1); continue; }
      if (alive && Math.abs(p.x - w.x) < 20 + p.w / 2 - 4 && p.y + p.h / 2 > w.y - 46 && p.y - p.h / 2 < w.y) Sim.hurt(s, w.x - w.dir * 40);
    }
  },
  kill(s, e, how) {
    e.alive = false; s.kills++; s.p.canDash = true;
    Sim.emit(s, 'kill', { x: e.x, y: e.y, kind: e.kind, how });
  },
  stepBoss(s, dt) {
    const b = s.boss; if (!b) return;
    const p = s.p, alive = p.deadT <= 0;
    b.px = b.x; b.py = b.y; b.t += dt;
    const enraged = b.hp <= 2;
    if (b.st === 'sleep') { if (alive && Math.abs(p.x - b.x) < 560) { b.st = 'idle'; b.t = 0; Sim.emit(s, 'bossWake', { x: b.x, y: b.y }); } return; }
    if (b.st === 'dead') return;
    if (b.st !== 'air') { b.vy = Math.min(b.vy + PHYS.GRAV * dt, PHYS.MAXFALL); b.vx = 0; s.map.move(b, dt); }
    if (b.st === 'idle') { b.face = p.x < b.x ? -1 : 1; if (b.t > (enraged ? 0.55 : 0.9)) { b.st = 'wind'; b.t = 0; Sim.emit(s, 'bossWind', { x: b.x, y: b.y }); } }
    else if (b.st === 'wind') { if (b.t > 0.45) { b.st = 'air'; b.t = 0; b.vy = -1150; b.vx = K.M.clamp((p.x - b.x) / 0.88, -560, 560); Sim.emit(s, 'bossLeap', { x: b.x, y: b.y + b.h / 2 }); } }
    else if (b.st === 'air') {
      b.vy = Math.min(b.vy + PHYS.GRAV * dt, PHYS.MAXFALL);
      s.map.move(b, dt);
      if (b.onGround) {
        b.st = 'stun'; b.t = 0; const fy = b.y + b.h / 2;
        s.waves.push({ x: b.x - b.w / 2, px: b.x - b.w / 2, y: fy, dir: -1, t: 0 }, { x: b.x + b.w / 2, px: b.x + b.w / 2, y: fy, dir: 1, t: 0 });
        if (enraged && s.enemies.filter(e => e.alive && e.spawn).length < 1) s.enemies.push({ kind: 'slime', spawn: true, x: b.x, y: b.y + b.h / 2 - 17, px: b.x, py: b.y + b.h / 2 - 17, w: 46, h: 34, vx: 0, vy: 0, dir: p.x < b.x ? -1 : 1, alive: true, t: 0 });
        Sim.emit(s, 'bossSlam', { x: b.x, y: fy });
      }
    } else if (b.st === 'stun') { if (b.t > (enraged ? 1.25 : 1.6)) { b.st = 'idle'; b.t = 0; } }
    else if (b.st === 'hurt') { if (b.t > 0.6) { b.st = 'idle'; b.t = 0; } }
    if (!alive || b.st === 'hurt') return;
    if (Sim.overlap(p, b, 14)) {
      const fromAbove = p.vy > 40 && p.py + p.h / 2 <= b.y - b.h * 0.15;
      if (b.st === 'stun' && (fromAbove || p.dashT > 0)) {
        b.hp--; p.vy = -PHYS.STOMPHI; p.canDash = true; p.dashT = 0; p.vx = (p.x < b.x ? -1 : 1) * 300; p.lock = 0.15;
        if (b.hp <= 0) { b.st = 'dead'; b.t = 0; s.exitOpen = true; s.coins += 25; s.waves.length = 0; for (const e of s.enemies) if (e.alive && e.kind === 'slime') { e.alive = false; } Sim.emit(s, 'bossDead', { x: b.x, y: b.y }); }
        else { b.st = 'hurt'; b.t = 0; Sim.emit(s, 'bossHit', { x: b.x, y: b.y - b.h / 2, hp: b.hp }); }
      } else if (b.st !== 'stun') Sim.hurt(s, b.x);
    }
  },
  score(s) { return s.coins * 10 + s.gemGot * 500 + Math.max(0, 240 - Math.floor(s.t)) * 3 + Math.max(0, 3 - s.deaths) * 150; },
};

// Knight: x,y = feet center. o: { armor, face, sx, sy, run, bob, dash, slide, mood, t, scale }
function drawKnight(c, x, y, o) {
  const A = ARMORS[o.armor || 0], f = o.face || 1, t = o.t || 0, bob = o.bob || 0, k = o.scale || 1;
  c.save(); c.translate(x, y); c.scale(f * (o.sx || 1) * k, (o.sy || 1) * k);
  c.lineJoin = 'round'; c.lineCap = 'round';
  const [L, B, D] = A.c;
  // cape / scarf behind
  if (A.acc === 'cape' || A.acc === 'scarf') {

// world backdrop (screen space with parallax)
const NZ = [K.noise(11), K.noise(23), K.noise(37)];
function caveBackdrop(ctx, w, camX, camY) {
  const v = K.view, W = WORLDS[w];
  K.draw.sky(W.sky[0], W.sky[1]);
  const x0 = -v.ox - 40, x1 = v.w + v.ox + 40;
  const layer = (f, col, topBase, botBase, amp, sc, seed) => {
    const ox = camX * f, oy = (camY || 0) * f * 0.5, nz = NZ[seed];
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.moveTo(x0, -v.oy - 10);
    for (let x = x0; x <= x1 + 32; x += 32) { const n = nz.fbm1((x + ox) * sc, 3), sp = Math.max(0, nz.n1((x + ox) * sc * 6 + 9)); ctx.lineTo(x, topBase - oy + n * amp + sp * amp * 1.4); }
    ctx.lineTo(x1 + 32, -v.oy - 10); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(x0, v.h + v.oy + 10);
    for (let x = x0; x <= x1 + 32; x += 32) { const n = nz.fbm1((x + ox) * sc + 50, 3), sp = Math.max(0, nz.n1((x + ox) * sc * 5 + 3)); ctx.lineTo(x, botBase - oy - n * amp - sp * amp * 1.2); }
    ctx.lineTo(x1 + 32, v.h + v.oy + 10); ctx.closePath(); ctx.fill();
  };
  layer(0.12, mix(W.sky[0], W.rock, 0.28), v.h * 0.16, v.h * 0.86, 70, 0.004, 0);
  layer(0.3, mix(W.sky[1], W.rock, 0.42), v.h * 0.07, v.h * 0.96, 90, 0.006, 1);
  // glowing flora / crystals / magma vents on a mid layer
  {
    const f = 0.5, ox = camX * f, oy = (camY || 0) * f * 0.25, sp = 230, i0 = Math.floor((x0 + ox) / sp) - 1, i1 = Math.floor((x1 + ox) / sp) + 1;
    for (let i = i0; i <= i1; i++) {
      const hsh = ((i * 2654435761) >>> 0) % 1000 / 1000; if (hsh < 0.35) continue;
      const x = i * sp - ox + hsh * 90, base = v.h * 0.98 - oy - NZ[2].fbm1((x + ox) * 0.006 + 50, 3) * 60, sc = 0.7 + hsh * 0.7, col = W.acc;
      K.draw.glow(x, base - 30 * sc, 90 * sc, col, 0.22);
      ctx.fillStyle = mix(W.sky[1], W.rock, 0.55);
      if (w === 0) { for (let k = -1; k <= 1; k++) { const hx = x + k * 22 * sc, hh = (30 + ((k + 2) * hsh * 40) % 26) * sc; ctx.fillRect(hx - 3, base - hh, 6, hh); ctx.fillStyle = k ? shade(col, -0.2) : col; ctx.beginPath(); ctx.ellipse(hx, base - hh, 14 * sc, 8 * sc, 0, Math.PI, 0); ctx.fill(); ctx.fillStyle = mix(W.sky[1], W.rock, 0.55); } }
      else if (w === 1) { ctx.fillStyle = alpha(col, 0.75); for (let k = -1; k <= 1; k++) { const hh = (50 - Math.abs(k) * 18) * sc; ctx.beginPath(); ctx.moveTo(x + k * 16 * sc - 9 * sc, base); ctx.lineTo(x + k * 20 * sc, base - hh); ctx.lineTo(x + k * 16 * sc + 9 * sc, base); ctx.closePath(); ctx.fill(); } }
      else { ctx.fillStyle = alpha(col, 0.8); ctx.beginPath(); ctx.ellipse(x, base - 4, 40 * sc, 8 * sc, 0, 0, TAU); ctx.fill(); ctx.fillStyle = alpha('#fff3a0', 0.5 + 0.3 * Math.sin(K.time * 3 + i)); ctx.beginPath(); ctx.ellipse(x, base - 5, 18 * sc, 4 * sc, 0, 0, TAU); ctx.fill(); }
    }
  }
  // motes: spores / snow / embers
  const t = K.time, col = w === 2 ? '#ffb347' : w === 1 ? '#bfe8ff' : '#c8ff8a';
  ctx.fillStyle = col;
  for (let i = 0; i < 26; i++) {
    const sp = 14 + (i * 7) % 23, span = v.w + v.ox * 2 + 80;
    let x = ((i * 211.7 - camX * 0.5 + Math.sin(t * 0.6 + i) * 30) % span + span) % span - v.ox - 40;
    let y = w === 2 ? (v.h - ((t * sp * 2 + i * 97) % (v.h + 60))) : ((t * sp + i * 131) % (v.h + 60)) - 30;
    ctx.globalAlpha = 0.25 + 0.35 * (0.5 + 0.5 * Math.sin(t * 2 + i));
    ctx.fillRect(x, y, 4 + (i % 3) * 2, 4 + (i % 3) * 2);
  }
  ctx.globalAlpha = 1;
}

const TOUCH = { stick: true, buttons: [{ action: 'action', icon: 'arrowU', color: 'green' }, { action: 'alt', icon: 'bolt', color: 'red' }] };
K.scenes.add('play', {
  gameplay: true, pausable: true, music: 'retro',
  touch: TOUCH,
  enter(p) {
    this.L = p.L || 0; SAVE.lastL = this.L;
    this.s = Sim.create(this.L);
    this.w = worldOf(this.L);
    this.sq = { v: 1, vel: 0 };
    this.run = 0; this.ghosts = []; this.mood = null; this.moodT = 0; this.combo = 0; this.springs = {}; this.hint = null;
    this.banner = { a: 1 }; K.tween(this.banner, { a: 0 }, 0.6, K.Ease.inQuad, 2.2);
    this.bestX = this.s.p.x; this.exitX = (this.s.map.find('E')[0] || { x: this.s.map.pw }).x;
    this.hpFx = { s: 1 }; this.gemFx = [1, 1, 1].map(() => ({ s: 1 })); this.coinFx = { s: 1 };
    this.doorT = -1; this.ending = false;
    K.camera.follow(this.s.p, { lerp: 9, offY: -50, deadW: 70, deadH: 60, snap: true });
    K.camera.setBounds(0, 0, this.s.map.pw, this.s.map.ph); K.camera.zoom = 1.1; K.camera.snap();
    K.ui.pauseButton();
    K.music.play(this.s.boss ? 'retro' : 'retro');
    SAVE.plays++; K.save.later();
    this.musicBoss = false;
  },
  onQuit() { K.scenes.go('levels'); },
  update(dt) {
    const I = K.input, s = this.s;
    if (this.ending) return;
    const cmd = { mx: I.axisX(), jump: I.pressed('action') || I.pressed('up'), jumpHeld: I.down('action') || I.down('up'), dash: I.pressed('alt'), down: I.down('down') || I.axisY() > 0.55 };
    Sim.step(s, 1 / 60, cmd);
    for (const e of s.events) this.present(e);
    s.events.length = 0;
    const p = s.p;
    if (p.deadT <= 0) this.bestX = Math.max(this.bestX, p.x);
    if (p.onGround) this.combo = 0;
    // presentation timers
    this.run += Math.abs(p.vx) / 430 * 0.32 * (p.onGround ? 1 : 0);
    if (p.dashT > 0) this.ghosts.push({ x: p.x, y: p.y + p.h / 2, f: p.face, t: 0.22 });
    for (const g of this.ghosts) g.t -= 1 / 60;
    K.compact(this.ghosts, g => g.t > 0);
    this.moodT -= 1 / 60;
    K.camera.offX = K.M.damp(K.camera.offX, p.face * 90 + p.vx * 0.08, 3, 1 / 60);
    if (s.boss && s.boss.st !== 'sleep' && s.boss.st !== 'dead' && !this.musicBoss) { this.musicBoss = true; K.music.play('boss'); }
    this.hints(cmd);
  },
  hints(cmd) {
    const H = SAVE.hints, s = this.s, p = s.p;
    let h = null;
    if (this.L === 0 && !H.move) { h = { text: K.input.touch ? 'DRAG TO MOVE' : 'ARROWS / A D TO MOVE', btn: -1 }; if (Math.abs(p.x - s.start.x) > 150) H.move = 1; }
    else if (this.L === 0 && !H.jump) { h = { text: K.input.touch ? 'TAP TO JUMP' : 'SPACE TO JUMP', btn: 0 }; if (cmd.jump) H.jump = 1; }
    else if (this.L === 0 && !H.stomp && s.enemies.some(e => e.alive && Math.abs(e.x - p.x) < 380)) { h = { text: 'JUMP ON SLIMES!', btn: 0 }; if (s.kills > 0) H.stomp = 1; }
    else if (this.L === 1 && !H.wall && (p.slide || p.onWall)) { h = { text: 'JUMP OFF THE WALL!', btn: 0 }; }
    else if (this.L === 2 && !H.drop && p.onGround && p.y < 300) { h = { text: K.input.touch ? 'STICK DOWN + JUMP' : 'DOWN + SPACE: DROP', btn: 0 }; }
    else if (this.L === 5 && !H.dash) { h = { text: K.input.touch ? 'TAP ⚡ TO DASH' : 'X / SHIFT TO DASH', btn: 1 }; if (cmd.dash) H.dash = 1; }
    if (this.hint && !h) K.save.later();
    this.hint = h;
  },
  present(e) {
    const s = this.s, p = s.p, A = ARMORS[armorSel()], W = WORLDS[this.w];
    switch (e.type) {
      case 'jump': K.audio.play('jump'); K.fx.puff(e.x, e.y, { count: 5 }); this.sq.v = 1.3; break;
      case 'walljump': K.audio.play('jump', 1.2); K.fx.puff(e.x, e.y, { count: 6 }); K.fx.burst(e.x, e.y, { count: 6, colors: [W.acc, '#ffffff'], speed: [80, 240], size: [3, 6], shape: 'square' }); this.sq.v = 1.3; K.haptic('light'); if (this.L === 1) SAVE.hints.wall = 1; break;
      case 'land': K.audio.play('land'); K.fx.puff(e.x, e.y, { count: 6 }); this.sq.v = 0.7; if (e.v > 1150) K.fx.shake(6, 0.12); break;
      case 'dash': K.audio.play('dash'); K.fx.burst(e.x, e.y, { count: 10, colors: [A.trail, '#ffffff'], speed: [100, 340], shape: 'spark', angle: e.dir > 0 ? Math.PI : 0, spread: 0.8 }); this.sq.v = 0.82; K.haptic('light'); break;
      case 'slide': K.fx.burst(e.x, e.y, { count: 1, colors: ['#ffffff', W.acc], speed: [20, 60], size: [3, 5], gravity: 200, outline: false }); if (s.frame % 12 === 0) K.audio.play('slide'); break;
      case 'drop': K.fx.puff(e.x, e.y, { count: 4 }); K.audio.play('whoosh'); SAVE.hints.drop = 1; break;
      case 'coin': K.audio.play('coin'); K.fx.burst(e.x, e.y, { shape: 'star', colors: ['#fff36a', '#f8d800'], count: 6, speed: [120, 320], size: [5, 9] }); K.fx.text(e.x, e.y - 24, '+1', { size: 30, color: '#fff36a', rise: 70, life: 0.6 }); this.pop(this.coinFx, 1.35); break;
      case 'gem': {
        K.audio.play('gem'); K.haptic('success'); K.fx.hitstop(0.06); K.fx.flash(GEMC[this.w][1], 0.25);
        K.fx.burst(e.x, e.y, { shape: 'star', colors: [GEMC[this.w][0], GEMC[this.w][1], '#ffffff'], count: 26, speed: [200, 620], size: [7, 13] });
        K.fx.ring(e.x, e.y, { r0: 20, r1: 150, color: GEMC[this.w][0], width: 12 });
        K.fx.text(e.x, e.y - 50, 'GEM ' + e.n + '/3!', { size: 46, color: GEMC[this.w][0], rise: 110, life: 1.1 });
        this.pop(this.gemFx[Math.min(2, e.n - 1)], 1.8); this.mood = 'happy'; this.moodT = 1; break;
      }
      case 'heart': K.audio.play('power'); K.fx.burst(e.x, e.y, { colors: ['#ff6a8a', '#ffffff'], count: 14 }); this.pop(this.hpFx, 1.5); break;
      case 'check':
        K.audio.play('check'); K.fx.ring(e.x, e.y, { r0: 10, r1: 160, color: '#8fe36a', width: 10 }); K.fx.burst(e.x, e.y - 40, { shape: 'star', colors: ['#8fe36a', '#ffffff'], count: 16, speed: [150, 420] });
        K.ui.toast(e.refill ? 'Checkpoint! Hearts refilled' : 'Checkpoint!', { icon: 'check' }); if (e.refill) this.pop(this.hpFx, 1.5); this.mood = 'happy'; this.moodT = 0.8; break;
      case 'spring': K.audio.play('boing'); this.springs[e.tx + ',' + e.ty] = 1; K.fx.burst(e.x, e.y - 20, { count: 10, colors: ['#ffe066', '#ffffff'], speed: [150, 380], angle: -Math.PI / 2, spread: 0.9 }); this.sq.v = 1.45; K.haptic('medium'); break;
      case 'crack': K.audio.play('crack'); K.fx.burst(e.x, e.y, { count: 4, colors: [mix(W.rock, '#c8a878', 0.45)], shape: 'square', speed: [40, 120], size: [4, 7], gravity: 900 }); break;
      case 'crumble': K.audio.play('crumble'); K.fx.shake(5, 0.15); K.fx.burst(e.x, e.y, { count: 14, colors: [mix(W.rock, '#c8a878', 0.45), shade(W.rock, -0.3)], shape: 'square', speed: [60, 260], size: [6, 12], gravity: 1500, life: [0.5, 0.9] }); break;
      case 'restore': K.fx.puff(e.x, e.y, { count: 5 }); break;
      case 'kill': {
        this.combo++;
        K.audio.play('stomp', 1 + this.combo * 0.12); K.fx.hitstop(0.05); K.fx.shake(6, 0.12); K.haptic('medium');
        K.fx.burst(e.x, e.y, { count: 18, colors: e.kind === 'bat' ? ['#9b4ad6', '#6a2aa0', '#ffffff'] : ['#c4ff9a', '#4cd13a', '#ffffff'], speed: [150, 520], size: [5, 11] });
        K.fx.ring(e.x, e.y, { r0: 10, r1: 90, color: '#ffffff', width: 8 });
        const label = this.combo >= 3 ? 'TRIPLE!' : this.combo === 2 ? 'DOUBLE!' : e.how === 'dash' ? 'SLASH!' : 'STOMP!';
        K.fx.text(e.x, e.y - 40, label, { size: this.combo >= 2 ? 48 : 38, color: this.combo >= 2 ? '#ffe066' : '#ffffff', rise: 90 });
        if (e.how === 'stomp') this.sq.v = 1.35;

      }
      case 'screech': K.audio.play('screech'); break;
      case 'hurt': K.audio.play('hurt'); K.fx.shake(14, 0.3); K.fx.flash('#f83800', 0.35); K.haptic('heavy'); K.fx.hitstop(0.08); this.pop(this.hpFx, 1.6); K.fx.burst(e.x, e.y, { count: 10, colors: ['#ff6a6a', '#ffffff'], speed: [150, 400] }); break;

        K.fx.burst(e.x, e.y, { count: 22, colors: [A.c[0], A.c[1], A.accC], speed: [200, 700], size: [6, 13], shape: 'square', gravity: 1400 });

        break;
      case 'respawn': K.camera.snap(); K.fx.ring(e.x, e.y, { r0: 60, r1: 4, color: A.trail, width: 8, life: 0.4 }); K.fx.puff(e.x, e.y + 27, { count: 6 }); K.audio.play('power'); break;
      case 'bossWake': K.audio.play('roar'); K.fx.shake(16, 0.6); K.fx.text(e.x, e.y - 140, 'SLIME KING!', { size: 64, color: '#ff8080', rise: 60, life: 1.6 }); break;

      else if (inf.heart) K.draw.icon('heart', x + S / 2, y + S / 2 + Math.sin(t * 4) * 5, 40 + Math.sin(t * 8) * 3, '#ff4a6a');

        if (!open) { ctx.fillStyle = '#7c7c8c'; for (let i = 0; i < 3; i++) ctx.fillRect(x + 16 + i * 12, y - S * 0.45, 5, S * 1.45); K.draw.icon('lock', x + S / 2, y + 10, 30, '#ffe066'); }

      } else if (inf.spring) {

let RETRIES = 0;
K.scenes.add('result', {
  music: null,
  enter(r) {
    const v = K.view;
    this.r = r; this.pan = { s: 0 }; this.shown = { score: 0, gold: 0, gems: 0 };
    const L = r.L;
    this.prevBest = K.meta.levels.best(L);
    let gold = 0, unlockedArmor = -1;
    if (r.won) {
      const prevW = worldGems(worldOf(L));
      K.meta.levels.complete(L, r.gems, r.score);
      gold = r.coins + r.gems * 15 + 25;
      K.meta.wallet.add(GOLD, gold);
      const w = worldOf(L);
      if (prevW < 12 && worldGems(w) >= 12) { const ai = ARMORS.findIndex(a => a.world === w); if (ai > 0 && K.meta.unlocks.grant('armor:' + ARMORS[ai].id)) unlockedArmor = ai; }
      K.audio.play('win'); K.music.play('victory');
    } else { gold = Math.floor(r.coins / 2); K.meta.wallet.add(GOLD, gold); K.audio.play('lose'); }
    K.save.commit();
    this.gold = gold; this.unlockedArmor = unlockedArmor;
    this.newBest = r.won && r.score > this.prevBest;
    this.best = Math.max(this.prevBest, r.won ? r.score : 0);
    K.sdk.send('score', { value: r.score });
    K.tween(this.pan, { s: 1 }, 0.5, K.Ease.outBack);
    K.tween(this.shown, { score: r.score, gold }, 1.1, K.Ease.outCubic, 0.4);
    if (r.won) for (let i = 0; i < r.gems; i++) K.wait(0.5 + i * 0.3).then(() => { this.shown.gems = i + 1; K.audio.play('gem'); K.haptic('light'); K.fx.burst(v.w / 2 + (i - 1) * 110, v.h * 0.5 - 150, { screen: true, shape: 'star', colors: [GEMC[worldOf(L)][0], '#ffffff'], count: 16, speed: [150, 450] }); });
    if (this.newBest) K.wait(1.5).then(() => { K.audio.play('levelup'); K.fx.burst(v.w / 2, v.h * 0.5, { screen: true, shape: 'star', colors: ['#ffe066', '#ffffff'], count: 40, speed: [300, 900] }); });
    if (unlockedArmor > 0) K.wait(1.9).then(() => { K.ui.toast(ARMORS[unlockedArmor].name + ' armor unlocked!', { icon: 'star', dur: 3 }); K.audio.play('power'); K.fx.flash('#ffffff', 0.4); });
    const by = v => v.h / 2 + 230;
    const next = r.won && L + 1 < LEVELS.length;
    K.ui.button({ icon: 'home', color: 'blue', w: 104, h: 104, popIn: 0.5, place: v => ({ x: v.w / 2 - 300, y: by(v) }), onTap: () => K.scenes.go('levels') });
    K.ui.button({ label: r.won ? 'REPLAY' : 'RETRY', icon: 'retry', color: r.won ? 'purple' : 'green', w: r.won ? 210 : 300, h: 104, popIn: 0.55, pulse: !r.won, key: r.won ? null : 'action',
      place: v => ({ x: v.w / 2 + (r.won ? -105 : 40), y: by(v) }), onTap: () => { RETRIES++; K.scenes.go('play', { L }); } });
    if (r.won) K.ui.button({ label: next ? 'NEXT' : 'MAP', icon: next ? 'arrowR' : 'star', color: 'green', w: 250, h: 104, popIn: 0.6, pulse: true, key: 'action',
      place: v => ({ x: v.w / 2 + 165, y: by(v) }), onTap: () => next ? K.scenes.go('play', { L: L + 1 }) : K.scenes.go('levels') });
    if (gold >= 10) {
      const dbl = K.ui.button({ label: '2× GOLD', icon: 'video', color: 'yellow', w: 260, h: 84, popIn: 0.7, sub: null,
        place: v => ({ x: v.w / 2 + 470, y: by(v) }),
        onTap: async () => {
          dbl.enabled = false;
          const res = await K.adBreak('rewarded');
          if (res.granted) {
            K.meta.wallet.add(GOLD, this.gold); K.save.commit(); this.gold *= 2; K.tween(this.shown, { gold: this.gold }, 0.6, K.Ease.outCubic);
            K.audio.play('coin'); K.audio.play('levelup'); K.haptic('success'); dbl.label = 'DOUBLED!';
            K.fx.burst(v.w / 2, v.h / 2 + 60, { screen: true, shape: 'star', colors: ['#ffe066', '#f8d800', '#ffffff'], count: 30, speed: [200, 700] });
          } else dbl.label = 'NO AD';
        } });
      this.dbl = dbl;
    }
  },
  backdrop(ctx) { caveBackdrop(ctx, worldOf(this.r.L), K.time * 20, 0); ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillRect(-K.view.ox, -K.view.oy, K.view.fullW, K.view.fullH); },

  },

    const r = this.r;

  },

    ctx.save(); ctx.translate(sx, sy + 66); ctx.scale(3, 3); drawSlime(ctx, 0, -17, { w: 46, h: 34, dir: -1 }, 0.4); ctx.restore();
    const r = K.rng(9);
    for (let i = 0; i < 16; i++) { const a = r.range(-2.6, -0.4), d = r.range(80, 200); K.draw.star(sx - 40 + Math.cos(a) * d, sy - 40 + Math.sin(a) * d, r.range(8, 16), i % 2 ? '#ffe066' : '#c4ff9a', { outline: 3 }); }
    ctx.save(); ctx.translate(v.w * 0.86, v.h * 0.43); ctx.scale(2.4, 2.4); drawBat(ctx, 0, 0, { st: 'swoop' }, t); ctx.restore();
    const G = [[0.1, 0.5, 0], [0.19, 0.42, 1], [0.28, 0.5, 2]];
    for (const [gx, gyy, w] of G) { K.draw.glow(v.w * gx, v.h * gyy, 110, GEMC[w][1], 0.55); K.draw.drawSprite(gemSprite(w), v.w * gx, v.h * gyy, { scale: 1.9 }); K.draw.star(v.w * gx + 30, v.h * gyy - 34, 9, '#ffffff', { outline: 0, points: 4 }); }
    for (let i = 0; i < 30; i++) { ctx.fillStyle = r() < 0.5 ? '#c8ff8a' : '#ffe066'; const q = r.range(4, 10); ctx.globalAlpha = r.range(0.4, 0.9); ctx.fillRect(x0 + r.range(0, v.fullW), r.range(-v.oy, v.h * 0.8), q, q); }
    ctx.globalAlpha = 1;
  },
  hud(ctx) {
    const v = K.view;
    K.draw.vignette(0.45);
    ctx.save(); ctx.translate(v.w * 0.5, v.h * 0.2); ctx.rotate(-0.05);
    K.draw.text('MOSS', -150, -30, { size: 200, color: '#8fe36a', sw: 18 });
    K.draw.text('KNIGHT', 120, 130, { size: 170, color: '#ffe066', sw: 18 });
    ctx.restore();
  },
});

K.boot(/[?&]card\b/.test(location.search) ? 'card' : 'title');
