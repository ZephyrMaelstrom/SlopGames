K.audio.define('splat', (p = 1) => { K.audio.tone({ noise: true, dur: 0.17, vol: 0.4, filter: 1000 * p, attack: 0.002 }); K.audio.tone({ wave: 'triangle', f0: 460 * p, f1: 80, dur: 0.15, vol: 0.32 }); K.audio.tone({ wave: 'square', f0: 880 * p, f1: 1320 * p, dur: 0.07, vol: 0.06, delay: 0.05 }); });
K.audio.define('buzz', (p = 1) => K.audio.tone({ wave: 'sawtooth', f0: 150 * p, f1: 162 * p, dur: 0.24, vol: 0.03, filter: 1500, attack: 0.05 }));
K.audio.define('wbuzz', (p = 1) => K.audio.tone({ wave: 'sawtooth', f0: 225 * p, f1: 250 * p, dur: 0.22, vol: 0.045, filter: 2400, attack: 0.04 }));
K.audio.define('zip', () => K.audio.tone({ wave: 'sine', f0: 900, f1: 2400, dur: 0.12, vol: 0.2 }));
K.audio.define('crack', () => { K.audio.tone({ noise: true, dur: 0.1, vol: 0.45, hp: 1800 }); K.audio.tone({ wave: 'square', f0: 300, f1: 110, dur: 0.09, vol: 0.16 }); });
K.audio.define('sting', () => { K.audio.tone({ wave: 'sawtooth', f0: 1400, f1: 220, dur: 0.32, vol: 0.2, filter: 3200 }); K.audio.tone({ noise: true, dur: 0.25, vol: 0.32, filter: 1200 }); });
K.audio.define('aww', () => [520, 440, 330].forEach((f, i) => K.audio.tone({ wave: 'triangle', f0: f, f1: f * 0.93, dur: 0.2, vol: 0.22, delay: i * 0.1 })));
K.audio.define('whiff', () => K.audio.tone({ noise: true, dur: 0.12, vol: 0.16, filter: 2600, hp: 700, attack: 0.03 }));
K.audio.define('dive', () => K.audio.tone({ wave: 'sawtooth', f0: 300, f1: 700, dur: 0.35, vol: 0.09, filter: 2000 }));
K.audio.define('star', (p = 1) => { K.audio.tone({ wave: 'triangle', f0: 880 * p, dur: 0.2, vol: 0.22 }); K.audio.tone({ wave: 'sine', f0: 1760 * p, dur: 0.3, vol: 0.1, delay: 0.04 }); });

/* ---------- 3d. SCENES ---------- */
let adCounter = 0;
async function adGate() { adCounter++; if (adCounter % 3 === 0) await K.adBreak('midgame'); }
function firstOpenLevel() { for (let i = 0; i < LEVELS.length; i++) if (!K.meta.levels.done(i)) return i; return K.M.clamp(SAVE.last || 0, 0, LEVELS.length - 1); }
const TOTAL_STARS = LEVELS.length * 3;

// title-screen deco bugs (cosmetic only)
function decoBug(kind, i) { return { kind, r: BUGS[kind].r, id: 100 + i, ph: i * 1.7, x: 0, y: 0, vx: 0, anger: 0, st: 'fly', flash: 0, dcd: 0, cracked: false }; }

K.scenes.add('title', {
  music: 'chill',
  enter() {
    this.logo = { s: 0 }; K.tween(this.logo, { s: 1 }, 0.7, K.Ease.outBack);
    this.deco = ['fly', 'wasp', 'lady', 'fly', 'mosq', 'moth', 'fly'].map(decoBug);
    this.swats = []; this.splats = [];
    const nxt = firstOpenLevel();
    K.ui.button({ label: nxt === 0 && !K.meta.levels.done(0) ? 'PLAY' : 'LEVEL ' + (nxt + 1), icon: 'play', color: 'green', w: 460, h: 136, pulse: true, key: 'action', popIn: 0.2,
      place: v => ({ x: v.w / 2, y: v.h * 0.74 }), onTap: () => K.scenes.go('play', { lv: firstOpenLevel() }) });
    K.ui.button({ label: 'LEVELS', icon: 'star', color: 'yellow', w: 330, h: 110, popIn: 0.3,
      place: v => ({ x: v.w / 2, y: v.h * 0.74 + 150 }), onTap: () => K.scenes.go('levels') });
    K.ui.soundButton({ popIn: 0.4, place: v => ({ x: v.w / 2 - 70, y: v.h * 0.74 + 280 }) });
    K.ui.musicButton({ popIn: 0.45, place: v => ({ x: v.w / 2 + 70, y: v.h * 0.74 + 280 }) });
    this.t = 0;
  },
  update(dt) {
    this.t += dt;
    const p = K.input.pointer;
    if (p.pressed) {
      this.swats.push({ x: p.startX, y: p.startY, t: 0 }); K.audio.play('smack');
      for (const d of this.deco) if (Math.hypot(d.x - p.startX, d.y - p.startY) < SW_R + d.r && d.kind !== 'lady') {
        K.fx.burst(d.x, d.y, { colors: SPLAT[d.kind].burst, count: 12, speed: [150, 420], gravity: 300 }); K.audio.play('splat'); K.fx.hitstop(0.04);
        K.fx.text(d.x, d.y - 30, 'SPLAT!', { size: 46, color: '#fff08a' }); d.ph += 9;
      }
    }
  },
  frame(dt) { for (const s of this.swats) s.t += dt; K.compact(this.swats, s => s.t < 0.4); },
  backdrop,
  render(ctx) {
    const v = K.view, cx = v.w / 2, cy = v.h * 0.47, t = K.time;
    let near = 0;
    this.deco.forEach((d, i) => {
      const a = t * (0.5 + i * 0.07) + d.ph, rx = 230 + (i % 3) * 50, ry = 150 + (i % 2) * 70;
      const nx = cx + Math.cos(a) * rx + Math.sin(t * 3 + i) * 20, ny = cy - 20 + Math.sin(a * 1.3) * ry;
      d.vx = (nx - d.x) * 60; d.x = nx; d.y = ny;
      if (d.kind === 'wasp') d.anger = 0.5 + 0.5 * Math.sin(t * 0.8);
    });
    const back = this.deco.filter(d => d.y < cy), front = this.deco.filter(d => d.y >= cy);
    for (const d of back) drawBug(ctx, d, d.x, d.y, null);
    const w = this.deco[1];
    drawCake(ctx, cx, cy, 1.25, 3, w.anger > 0.85 ? 'worried' : ((t % 4) < 0.12 ? 'blink' : 'happy'), { x: K.M.clamp((w.x - cx) / 300, -1, 1), y: K.M.clamp((w.y - cy) / 300, -1, 1) }, t);
    for (const d of front) drawBug(ctx, d, d.x, d.y, null);
    for (const s of this.swats) swatterAnim(ctx, s);
  },
  hud(ctx) {
    const v = K.view, st = v.safe.top;
    ctx.save(); ctx.translate(v.w / 2, v.h * 0.17 + 10 + Math.sin(K.time * 2) * 8); ctx.scale(this.logo.s, this.logo.s); ctx.rotate(-0.05);
    drawLogo(0, 0, 150);
    ctx.restore();
    K.draw.text('Swat pests · spare ladybugs · save the cake!', v.w / 2, v.h * 0.17 + 175, { size: 30, sw: 6, maxW: v.w - 60 });
    K.draw.pill(v.w / 2, 60 + st, K.meta.levels.totalStars() + ' / ' + TOTAL_STARS, { icon: 'star', size: 34, minW: 220 });
  },
});

function swatterAnim(ctx, s) {
  const t = s.t;
  let sc, al = 1, off = 0;
  if (t < 0.05) { const k = t / 0.05; sc = 1.45 - 0.45 * k; off = -70 * (1 - k); al = 0.5 + 0.5 * k; }
  else if (t < 0.16) { sc = 1 - 0.04 * Math.sin((t - 0.05) / 0.11 * Math.PI); }
  else { const k = (t - 0.16) / 0.22; sc = 1 + k * 0.3; off = -50 * k; al = Math.max(0, 1 - k); }
  if (t > 0.04 && t < 0.16) {
    const k = (t - 0.04) / 0.12;
    ctx.globalAlpha = 1 - k; ctx.strokeStyle = '#fff'; ctx.lineWidth = 6; ctx.lineCap = 'round';
    for (let i = 0; i < 8; i++) { const a = i / 8 * TAU + 0.3, r0 = 72 + k * 30, r1 = r0 + 26; ctx.beginPath(); ctx.moveTo(s.x + Math.cos(a) * r0, s.y + Math.sin(a) * r0); ctx.lineTo(s.x + Math.cos(a) * r1, s.y + Math.sin(a) * r1); ctx.stroke(); }
    ctx.globalAlpha = 1;
  }
  drawSwatter(ctx, s.x, s.y + off, sc, -0.38, al);
}

K.scenes.add('levels', {
  music: 'chill',
  enter() {
    K.ui.button({ icon: 'home', color: 'blue', w: 100, h: 100, place: v => ({ x: 66 + v.safe.left, y: 70 + v.safe.top }), onTap: () => K.scenes.go('title') });
    const cur = firstOpenLevel();
    this.list = K.ui.list({ items: LEVELS.length, cols: 4, itemH: 176, gap: 16, frame: false, popIn: 0.1,
      place: v => { const w = Math.min(v.w - 30, 700), top = 210 + v.safe.top, h = Math.min(v.h - top - 30 - v.safe.bottom, 4 * 192 + 40); return { x: v.w / 2, y: top + h / 2, w, h }; },
      drawItem: (ctx, i, idx, x, y, w, h) => {
        const L = LEVELS[i], un = K.meta.levels.unlocked(i), st = K.meta.levels.stars(i);
        K.draw.card(x, y, w, h, { fill: un ? (L.boss ? '#ffe0c8' : K.THEME.paper) : '#c9c0a6', selected: i === cur });
        if (!un) { K.draw.icon('lock', x + w / 2, y + h / 2 - 12, 58, '#efe9d8'); K.draw.label(String(i + 1), x + w / 2, y + h - 30, { size: 30, color: '#7a7058' }); return; }
        K.draw.text(String(i + 1), x + w / 2, y + 66, { size: 64, color: L.boss ? '#ff8a5a' : '#ffffff' });
        for (let k = 0; k < 3; k++) K.draw.star(x + w / 2 + (k - 1) * 40, y + h - 40 - (k === 1 ? 6 : 0), 18, k < st ? '#ffd23f' : '#ddd3b8', { outline: 3 });
        if (L.intro) { const sc = L.intro === 'queen' ? 0.26 : 0.55; ctx.save(); ctx.translate(x + w - 26, y + 30); ctx.scale(sc, sc); K.draw.drawSprite(bodySprite(L.intro, 'idle'), 0, 0); ctx.restore(); }
        if (i === cur) { ctx.globalAlpha = 0.5 + 0.5 * Math.sin(K.time * 5); K.draw.icon('arrowD', x + 26, y + 26, 34, '#ffd23f'); ctx.globalAlpha = 1; }
      },
      onItem: i => {
        if (!K.meta.levels.unlocked(i)) { K.audio.play('error'); K.ui.toast('Clear level ' + i + ' first!', { icon: 'lock' }); return; }
        K.scenes.go('play', { lv: i });
      } });
    this.list.off = Math.max(0, Math.floor(cur / 4) * 192 - 200);
  },
  backdrop,
  render(ctx) {
    const v = K.view, L = this.list;
    ctx.fillStyle = 'rgba(31,42,18,0.35)'; ctx.fillRect(-v.ox, -v.oy, v.fullW, v.fullH);
    const y = L.y + L.h / 2 + 150;
    if (v.h - y > 110) drawCake(ctx, v.w / 2, y, 1, 3, (K.time % 3) < 0.12 ? 'blink' : 'happy', null, K.time);
  },
  hud() {
    const v = K.view, st = v.safe.top;
    K.draw.text('PICNIC MAP', v.w / 2, 70 + st, { size: 64, color: '#ffe14a' });
    K.draw.pill(v.w / 2, 150 + st, K.meta.levels.totalStars() + ' / ' + TOTAL_STARS, { icon: 'star', size: 30, minW: 200 });
  },
});

K.scenes.add('play', {
  gameplay: true, pausable: true, music: 'upbeat',
  enter(p) {
    const v = K.view;
    this.lv = p.lv || 0; SAVE.last = this.lv; K.save.later();
    this.s = Sim.create((Math.random() * 2 ** 31) | 0, this.lv, v.w, v.h, this.top(v));
    this.swats = []; this.splats = []; this.corpses = []; this.flyers = []; this.callout = null;
    this.endT = -1; this.buzzT = 0; this.cakeFx = { s: 1, hurt: 0 }; this.scoreFx = { s: 1 }; this.shown = 0;
    this.lastTap = { x: -999, y: -999, t: -9 };
    this.hint = !SAVE.tut && this.lv === 0;
    const L = LEVELS[this.lv];
    this.banner = null;
    if (L.intro && !SAVE.seen[L.intro]) { this.banner = { kind: L.intro, t: 0 }; }
    this.title = { a: 1 };
    K.tween(this.title, { a: 0 }, 0.6, K.Ease.inQuad, 1.6);
    K.ui.pauseButton();
    K.audio.play('whoosh');
  },
  top(v) { return v.safe.top + 220; },
  layout(v) { if (this.s) Sim.resize(this.s, v.w, v.h, this.top(v)); },
  onQuit() { K.scenes.go('levels'); },
  near(b) { const l = this.lastTap; return K.time - l.t < 0.5 && Math.hypot(b.x - l.x, b.y - l.y) < 170; },
  update(dt) {
    const s = this.s;
    const taps = [];
    if (this.endT < 0) {
      const p = K.input.pointer;
      if (p.pressed) taps.push({ x: p.startX, y: p.startY });
      for (const pt of K.input.pointers.values()) if (pt.pressed && pt.id !== p.id) taps.push({ x: pt.startX, y: pt.startY });
      for (const tp of taps) {
        this.swats.push({ x: tp.x, y: tp.y, t: 0 }); if (this.swats.length > 5) this.swats.shift();
        this.lastTap = { x: tp.x, y: tp.y, t: K.time };
        K.audio.play('smack', 0.9 + Math.random() * 0.2); K.haptic('light');
      }
    }
    Sim.step(s, dt, { taps });
    for (const e of s.events) this.present(e);
    s.events.length = 0;
    if (this.endT >= 0) {
      this.endT -= dt;
      if (this.endT < 0) K.scenes.go('result', { lv: this.lv, win: s.won, stars: s.stars, score: s.score, time: s.t + s.pen, acc: s.taps ? s.hitTaps / s.taps : 1, hp: s.cake.hp, left: s.total - s.done, total: s.total, maxCombo: s.maxCombo, lady: s.ladyHits });
    }
  },
  present(e) {
    const v = K.view;
    switch (e.type) {
      case 'kill': {
        const sp = SPLAT[e.kind];
        this.splats.push({ x: e.x, y: e.y, col: sp.decal, v: (e.id * 7) % 4, rot: (e.id * 1.3) % TAU, sc: e.kind === 'queen' ? 2.4 : e.kind === 'moth' ? 0.55 : e.kind === 'beetle' ? 1.2 : 0.9, t: 0 });
        if (this.splats.length > 40) this.splats.shift();
        this.corpses.push({ kind: e.kind, x: e.x, y: e.y, t: 0, rot: K.M.clamp(e.vx * 0.001, -0.4, 0.4) });
        K.fx.burst(e.x, e.y, { colors: sp.burst, count: e.kind === 'moth' ? 6 : 12, speed: [160, 460], size: [5, 11], gravity: 400, life: [0.3, 0.6] });
        K.fx.ring(e.x, e.y, { r0: 20, r1: 80, color: '#ffffff', width: 6, life: 0.25 });
        K.fx.text(e.x, e.y - 34, '+' + e.pts, { size: 38 + Math.min(e.combo, 8) * 3, color: e.combo > 2 ? '#fff08a' : '#ffffff', rise: 100, life: 0.8 });
        K.audio.play('splat', 1 + Math.min(e.combo, 10) * 0.05);
        K.fx.hitstop(e.combo >= 3 ? 0.055 : 0.035); K.fx.shake(e.combo >= 3 ? 9 : 5, 0.15); K.haptic('medium');
        K.tween(this.scoreFx, { s: 1.25 }, 0.05).then(() => K.tween(this.scoreFx, { s: 1 }, 0.35, K.Ease.outElastic));
        if (e.clutch) this.say('CLUTCH SAVE!', '#8af5ff');
        else if (e.combo === 3) this.say('TRIPLE!', '#fff08a');
        else if (e.combo === 5) this.say('SPLATTASTIC!', '#ffb0dc');
        else if (e.combo === 8) this.say('BUG BLITZ!', '#ff9a5a');
        else if (e.combo >= 12 && e.combo % 4 === 0) this.say('UNSTOPPABLE x' + e.combo, '#ff6a5a');
        if (e.combo === 5 || e.combo === 8) { K.audio.play('power'); K.fx.flash('#ffffff', 0.18); }
        if (this.hint) { this.hint = false; SAVE.tut = true; K.save.commit(); }
        break;
      }
      case 'multi':
        this.say(e.n >= 3 ? 'MULTI-SWAT x' + e.n + '!' : 'DOUBLE SWAT!', '#c4f28a');
        K.fx.burst(e.x, e.y, { shape: 'star', colors: ['#fff08a', '#ffffff'], count: 8 + e.n * 2, speed: [250, 600], size: [8, 14], gravity: 200 });
        break;
      case 'whiff':
        K.fx.puff(e.x, e.y, { colors: ['#fff6e4'], count: 5 }); K.audio.play('whiff');
        K.fx.ring(e.x, e.y, { r0: 30, r1: 70, width: 4, color: 'rgba(255,255,255,0.7)', life: 0.2 });
        break;
      case 'dodge':
        K.audio.play('zip'); K.fx.text(e.x, e.y - 40, 'MISSED ME!', { size: 30, color: '#ffd0c8', rise: 60, life: 0.6 });
        K.fx.burst(e.fx, e.fy, { shape: 'spark', colors: ['#ffffff'], count: 6, speed: [200, 400], gravity: 0, life: [0.15, 0.3] });
        break;
      case 'crack':
        K.audio.play('crack'); K.fx.hitstop(0.05); K.fx.shake(10, 0.2); K.haptic('medium');
        K.fx.burst(e.x, e.y, { shape: 'square', colors: ['#7cf0a0', '#146b3e', '#2fb36a'], count: 14, speed: [200, 520], size: [6, 12], gravity: 900 });
        K.fx.text(e.x, e.y - 50, 'CRACK!', { size: 40, color: '#c4ffd8', rise: 70 });
        break;
      case 'lady':
        K.audio.play('aww'); K.haptic('fail'); K.fx.shake(12, 0.25); K.fx.flash('#ff6a5a', 0.25);
        this.splats.push({ x: e.x, y: e.y, col: SPLAT.lady.decal, v: 1, rot: 0.3, sc: 0.8, t: 0 });
        this.flyers.push({ kind: 'ghost', x: e.x, y: e.y, t: 0 });
        K.fx.text(e.x, e.y - 40, 'NOT THE LADYBUG! +3s', { size: 34, color: '#ffb0b0', rise: 90, life: 1.2 });
        break;
      case 'spared':
        K.audio.play('coin'); K.fx.text(e.x, e.y, 'Spared! +25', { size: 32, color: '#ffc0d2', rise: 70 });
        K.fx.burst(e.x, e.y, { shape: 'star', colors: ['#ffb0d0', '#ffffff'], count: 8, speed: [100, 260], gravity: -80, size: [6, 10] });
        break;
      case 'dive': K.audio.play('dive'); break;
      case 'sting': case 'nibble': {
        const c = this.s.cake;
        K.audio.play(e.type === 'sting' ? 'sting' : 'crack'); K.audio.play('hurt');
        K.fx.shake(22, 0.4); K.fx.hitstop(0.1); K.fx.flash('#ff4b3a', 0.35); K.haptic('heavy');
        K.fx.burst(c.x, c.y, { colors: ['#ffc0d4', '#fff6fa', '#f2d39b', '#ff3b4e'], count: 22, speed: [200, 600], size: [6, 13], gravity: 1100 });
        this.flyers.push({ kind: 'slice', x: c.x + (e.x < c.x ? -60 : 60), y: c.y, vx: (e.x < c.x ? -1 : 1) * 260, vy: -620, rot: 0, t: 0 });
        this.cakeFx.hurt = 2.2;
        K.tween(this.cakeFx, { s: 0.85 }, 0.06).then(() => K.tween(this.cakeFx, { s: 1 }, 0.5, K.Ease.outElastic));
        this.say(e.type === 'sting' ? 'OUCH! STUNG!' : 'NOM! A BEETLE BITE!', '#ff9a8a');
        break;
      }
      case 'queenIn': K.audio.play('power'); K.fx.shake(14, 0.5); this.say('THE QUEEN ARRIVES!', '#ffe14a'); break;
      case 'queenAngry': K.audio.play('hurt'); this.say('SHE\'S ANGRY! SMACK HER!', '#ff9a5a'); break;
      case 'summon': K.audio.play('wbuzz', 1.3); K.fx.ring(e.x, e.y, { r0: 40, r1: 160, color: '#ffe14a', width: 10 }); break;
      case 'queenHit':
        K.audio.play('hit'); K.fx.hitstop(0.04); K.fx.shake(8, 0.15); K.haptic('medium');
        K.fx.burst(e.tx, e.ty, { shape: 'star', colors: ['#ffe14a', '#ffffff'], count: 8, speed: [200, 500], gravity: 300, size: [7, 12] });
        break;
      case 'queenDie':
        K.audio.play('explode'); K.fx.hitstop(0.2); K.fx.shake(30, 0.7); K.fx.flash('#ffffff', 0.6);
        K.fx.burst(e.x, e.y, { shape: 'star', colors: ['#ffe14a', '#fff3a0', '#ffffff', '#e8402e'], count: 40, speed: [300, 900], size: [10, 20], gravity: 400 });
        this.say('QUEEN SQUASHED!', '#ffe14a');
        break;
      case 'clear':
        this.endT = 1.6; K.audio.play('win'); K.haptic('success');
        this.say(e.stars === 3 ? 'PERFECT PICNIC!' : 'PICNIC SAVED!', '#c4f28a', 1.5);
        for (let i = 0; i < 4; i++) K.wait(i * 0.18).then(() => K.fx.burst(v.w * (0.2 + i * 0.2), v.h * 0.35, { screen: true, shape: 'star', colors: ['#ffe14a', '#ff6a5a', '#c4f28a', '#ffffff'], count: 18, speed: [300, 800], size: [8, 15], gravity: 600 }));
        break;
      case 'fail':
        this.endT = 1.8; K.audio.play('lose'); K.haptic('fail');
        this.say('THE CAKE IS GONE!', '#ff9a8a', 1.6);
        break;
    }
  },
  say(str, color, life = 1.0) { this.callout = { str, color, t: 0, life }; },
  frame(dt) {
    const s = this.s;
    for (const w of this.swats) w.t += dt; K.compact(this.swats, w => w.t < 0.4);
    for (const sp of this.splats) sp.t += dt; K.compact(this.splats, sp => sp.t < 9);
    for (const c of this.corpses) c.t += dt; K.compact(this.corpses, c => c.t < 1.1);
    for (const f of this.flyers) { f.t += dt; if (f.kind === 'slice') { f.vy += 1600 * dt; f.x += f.vx * dt; f.y += f.vy * dt; f.rot += dt * 9; } else f.y -= 60 * dt; }
    K.compact(this.flyers, f => f.t < 1.4);
    if (this.callout) { this.callout.t += dt; if (this.callout.t > this.callout.life) this.callout = null; }
    if (this.banner) { this.banner.t += dt; if (this.banner.t > 3.4) { SAVE.seen[this.banner.kind] = 1; K.save.later(); this.banner = null; } }
    if (this.cakeFx.hurt > 0) this.cakeFx.hurt -= dt;
    this.shown = K.M.damp(this.shown, s.score, 12, dt);
    this.buzzT -= dt;
    if (this.buzzT <= 0 && !s.over) {
      this.buzzT = 0.2;
      const flying = s.bugs.filter(b => b.kind !== 'beetle').length;
      if (flying) {
        const wasp = s.bugs.some(b => b.kind === 'wasp' || b.kind === 'queen');
        K.audio.play(wasp && Math.random() < 0.5 ? 'wbuzz' : 'buzz', 0.9 + Math.random() * 0.25 + Math.min(flying, 8) * 0.02);
      }
    }
  },
  backdrop,
  render(ctx, a) {
    const s = this.s, c = s.cake, L = K.M.lerp;
    for (const sp of this.splats) {
      const al = sp.t < 6 ? 0.85 : 0.85 * (1 - (sp.t - 6) / 3);
      const k = Math.min(1, sp.t / 0.08);
      K.draw.drawSprite(splatSprite(sp.col, sp.v), sp.x, sp.y, { rot: sp.rot, scale: sp.sc * (0.5 + 0.5 * k), alpha: al });
    }
    // ground layer: beetles and corpses
    for (const b of s.bugs) if (b.kind === 'beetle') drawBug(ctx, b, L(b.px, b.x, a), L(b.py, b.y, a), this);
    for (const cp of this.corpses) {
      const k = Math.min(1, cp.t / 0.06), al = cp.t > 0.7 ? 1 - (cp.t - 0.7) / 0.4 : 1;
      K.draw.drawSprite(bodySprite(cp.kind, cp.kind === 'beetle' ? 'dead' : 'dead'), cp.x, cp.y, { rot: cp.rot, sx: 1 + 0.4 * k, sy: 1 - 0.55 * k, alpha: al });
    }
    // cake: watch the most dangerous bug
    let threat = null, worst = 0;
    for (const b of s.bugs) {
      const d = Math.hypot(b.x - c.x, b.y - c.y);
      const w = b.kind === 'wasp' || b.kind === 'queen' ? b.anger * 2 + 0.3 : b.kind === 'beetle' ? Math.max(0, 1 - d / 400) * 1.5 : b.kind === 'lady' ? 0 : 0.2 * Math.max(0, 1 - d / 500);
      if (w > worst) { worst = w; threat = b; }
    }
    let mood = 'happy';
    if (s.cake.hp <= 0) mood = 'dead';
    else if (this.cakeFx.hurt > 0) mood = 'cry';
    else if (worst > 1.4) mood = 'worried';
    else if ((K.time % 3.5) < 0.12) mood = 'blink';
    const look = threat ? { x: K.M.clamp((threat.x - c.x) / 250, -1, 1), y: K.M.clamp((threat.y - c.y) / 250, -1, 1) } : null;
    ctx.save(); ctx.translate(c.x, c.y + 60); ctx.scale(2 - this.cakeFx.s, this.cakeFx.s); ctx.translate(-c.x, -c.y - 60);
    drawCake(ctx, c.x, c.y, 1, s.cake.hp, mood, look, K.time);
    ctx.restore();
    // wasp anger rings, then flyers
    for (const b of s.bugs) {
      if ((b.kind === 'wasp' || b.kind === 'queen') && b.anger > 0.02 && b.st !== 'leave' && b.st !== 'return') {
        const x = L(b.px, b.x, a), y = L(b.py, b.y, a), R = b.r * 1.25;
        ctx.beginPath(); ctx.arc(x, y + b.r * 0.2, R, 0, TAU); ctx.lineWidth = 9; ctx.strokeStyle = 'rgba(31,42,18,0.35)'; ctx.stroke();
        ctx.beginPath(); ctx.arc(x, y + b.r * 0.2, R, -Math.PI / 2, -Math.PI / 2 + TAU * b.anger); ctx.lineWidth = 7; ctx.lineCap = 'round';
        ctx.strokeStyle = b.anger > 0.75 ? '#ff3b2e' : b.anger > 0.45 ? '#ff9a2e' : '#ffe14a'; ctx.stroke();
        if (b.anger > 0.75 && b.st !== 'dive') K.draw.text('!', x + b.r * 0.9, y - b.r * 1.1, { size: 44 + Math.sin(K.time * 30) * 6, color: '#ff5a4a' });
      }
    }
    for (const b of s.bugs) if (b.kind !== 'beetle') {
      const x = L(b.px, b.x, a), y = L(b.py, b.y, a);
      if (b.kind !== 'moth') { ctx.globalAlpha = 0.18; ctx.fillStyle = INK; ctx.beginPath(); ctx.ellipse(x + 14, y + b.r * 1.6, b.r * 0.7, b.r * 0.22, 0, 0, TAU); ctx.fill(); ctx.globalAlpha = 1; }
      drawBug(ctx, b, x, y, this);
      if (b.kind === 'lady' && this.lv <= 3 && b.st === 'fly') {
        ctx.globalAlpha = 0.85; K.draw.icon('heart', x, y - b.r * 1.55 + Math.sin(K.time * 5 + b.id) * 4, 26, '#ff6a94'); ctx.globalAlpha = 1;
      }
      if (b.kind === 'queen') {
        const bw = 160; K.draw.bar(x, y - b.r * 1.55, bw, 26, b.hp / b.maxHp, 'red');
      }
    }
    for (const f of this.flyers) {
      if (f.kind === 'slice') {
        ctx.save(); ctx.translate(f.x, f.y); ctx.rotate(f.rot);
        ctx.beginPath(); ctx.moveTo(0, -30); ctx.lineTo(44, 26); ctx.lineTo(-44, 26); ctx.closePath(); ctx.fillStyle = '#ffc0d4'; ctx.fill(); ctx.lineWidth = 5; ctx.strokeStyle = INK; ctx.lineJoin = 'round'; ctx.stroke();
        ctx.fillStyle = '#f2d39b'; ctx.fillRect(-40, 12, 80, 12); ctx.restore();
      } else {
        ctx.globalAlpha = Math.max(0, 1 - f.t / 1.4); ctx.save(); ctx.translate(f.x, f.y); ctx.scale(0.8, 0.8);
        K.draw.drawSprite(bodySprite('lady', 'dead'), 0, 0, { alpha: 0.6 });
        ctx.beginPath(); ctx.ellipse(0, -42, 18, 6, 0, 0, TAU); ctx.lineWidth = 4; ctx.strokeStyle = '#ffe14a'; ctx.stroke(); ctx.restore(); ctx.globalAlpha = 1;
      }
    }
    for (const w of this.swats) swatterAnim(ctx, w);
    // desktop: swatter follows the mouse
    const p = K.input.pointer;
    if (!K.input.touch && this.endT < 0 && !this.swats.some(w => w.t < 0.3) && p.y > s.top - 40) drawSwatter(ctx, p.x, p.y, 0.8, -0.38, 0.45);
    // first-run hint: ghost swatter over the first fly
    if (this.hint) {
      const tgt = s.bugs.find(b => b.kind === 'fly' && b.t > 0.8);
      if (tgt) {
        const ph = (K.time * 1.4) % 1, down = ph > 0.55 && ph < 0.7;
        drawSwatter(ctx, tgt.x + 4, tgt.y + (down ? 0 : -24), down ? 0.9 : 1.05, -0.38, 0.55);
        ctx.save(); ctx.translate(tgt.x, tgt.y - 110); const k = 1 + Math.sin(K.time * 8) * 0.08; ctx.scale(k, k);
        K.draw.text('TAP!', 0, 0, { size: 56, color: '#ffe14a' }); ctx.restore();
      }
    }
  },
  hud(ctx) {
    const v = K.view, st = v.safe.top, s = this.s, Lv = LEVELS[this.lv];
    K.draw.pill(110 + v.safe.left, 66 + st, 'LV ' + (this.lv + 1), { size: 34, minW: 160 });
    for (let i = 0; i < 3; i++) {
      const x = 225 + v.safe.left + i * 58, y = 66 + st, on = i < s.cake.hp;
      ctx.save(); ctx.translate(x, y); ctx.globalAlpha = on ? 1 : 0.35;
      ctx.beginPath(); ctx.moveTo(0, -22); ctx.lineTo(24, 20); ctx.lineTo(-24, 20); ctx.closePath(); ctx.fillStyle = on ? '#ffc0d4' : '#8a8070'; ctx.fill(); ctx.lineWidth = 5; ctx.strokeStyle = INK; ctx.lineJoin = 'round'; ctx.stroke();
      if (on) { ctx.fillStyle = '#f2d39b'; ctx.fillRect(-19, 8, 38, 8); ell(ctx, 0, -6, 7, 7, '#ff3b4e', 2.5); }
      ctx.restore(); ctx.globalAlpha = 1;
    }
    ctx.save(); ctx.translate(v.w / 2 + 120, 66 + st); ctx.scale(this.scoreFx.s, this.scoreFx.s);
    K.draw.text(Math.round(this.shown).toLocaleString(), 0, 0, { size: 52 }); ctx.restore();
    const bw = Math.min(v.w - 60, 520), by = 140 + st;
    const prog = s.total ? s.done / s.total : 0;
    K.draw.bar(v.w / 2, by, bw, 34, prog, 'green');
    K.draw.text((s.total - s.done) + ' pests left', v.w / 2, by + 1, { size: 24, sw: 5 });
    const time = s.t + s.pen;
    const goal = Lv.goal === 'time' ? K.fmtTime(time) + ' / ' + K.fmtTime(Lv.par) : Math.round((s.taps ? s.hitTaps / s.taps : 1) * 100) + '% / ' + Math.round(Lv.acc * 100) + '%';
    const ok = Lv.goal === 'time' ? time <= Lv.par : (s.taps ? s.hitTaps / s.taps : 1) >= Lv.acc;
    K.draw.text((Lv.goal === 'time' ? 'TIME ' : 'AIM ') + goal, v.w / 2, by + 44, { size: 26, sw: 5, color: ok ? '#c4f28a' : '#ffb09a' });
    if (s.combo > 1) {
      ctx.globalAlpha = K.M.clamp(s.comboT / 0.3, 0, 1);
      K.draw.text('x' + Math.min(s.combo, 8) + ' COMBO', v.w - 110 - v.safe.right, by + 44, { size: 30, color: '#fff08a' });
      ctx.globalAlpha = 1;
    }
    if (this.title.a > 0.01) {
      ctx.globalAlpha = this.title.a;
      K.draw.text('LEVEL ' + (this.lv + 1), v.w / 2, v.h * 0.3 - 40, { size: 76, color: '#ffe14a' });
      K.draw.text(Lv.name, v.w / 2, v.h * 0.3 + 30, { size: 44 });
      ctx.globalAlpha = 1;
    }
    if (this.banner) {
      const t = this.banner.t, k = t < 0.35 ? K.Ease.outBack(t / 0.35) : t > 3.0 ? 1 - (t - 3.0) / 0.4 : 1;
      const y = v.h - 150 - v.safe.bottom + (1 - K.M.clamp(k, 0, 1)) * 260, w = Math.min(v.w - 40, 640);
      ctx.save(); ctx.globalAlpha = K.M.clamp(k, 0, 1);
      K.draw.panel(v.w / 2, y, w, 150, { color: 'orange' });
      ctx.save(); ctx.translate(v.w / 2 - w / 2 + 85, y); const sc = this.banner.kind === 'queen' ? 0.6 : 1.3; ctx.scale(sc, sc); ctx.rotate(Math.sin(K.time * 6) * 0.1);
      K.draw.drawSprite(bodySprite(this.banner.kind, 'idle'), 0, 0); ctx.restore();
      K.draw.label('NEW: ' + BUGS[this.banner.kind].name.toUpperCase(), v.w / 2 + 60, y - 28, { size: 38, maxW: w - 200, color: '#a85a0c' });
      K.draw.label(INTRO[this.banner.kind], v.w / 2 + 60, y + 24, { size: 28, maxW: w - 200 });
      ctx.restore();
    }
    if (this.callout) {
      const c = this.callout, p = c.t / c.life, sc = p < 0.15 ? K.Ease.outBack(p / 0.15) : 1;
      ctx.save(); ctx.globalAlpha = p > 0.75 ? 1 - (p - 0.75) / 0.25 : 1; ctx.translate(v.w / 2, v.h * 0.3 - p * 30); ctx.scale(sc, sc); ctx.rotate(-0.04);
      K.draw.text(c.str, 0, 0, { size: 68, color: c.color, maxW: v.w - 50 }); ctx.restore();
    }
  },
});

K.scenes.add('result', {
  enter(p) {
    const v = K.view, L = LEVELS[p.lv];
    this.p = p;
    const prevBest = K.meta.levels.best(p.lv), wasDone = K.meta.levels.done(p.lv);
    if (p.win) { K.meta.levels.complete(p.lv, p.stars, p.score); K.save.commit(); }
    K.sdk.send('score', { value: p.score });
    this.newBest = p.win && p.score > prevBest;
    this.best = Math.max(prevBest, p.win ? p.score : 0);
    this.unlockedNext = p.win && !wasDone && p.lv + 1 < LEVELS.length;
    this.shown = { n: 0 }; this.pan = { s: 0 };
    this.st = [0, 1, 2].map(() => ({ s: 0 }));
    K.tween(this.pan, { s: 1 }, 0.5, K.Ease.outBack);
    K.tween(this.shown, { n: p.score }, 1.0, K.Ease.outCubic, 0.3);
    if (!p.win) K.music.stop();
    if (p.win) {
      K.music.play('victory');
      for (let i = 0; i < p.stars; i++) {
        K.tween(this.st[i], { s: 1 }, 0.45, K.Ease.outBack, 0.55 + i * 0.35);
        K.wait(0.6 + i * 0.35).then(() => { K.audio.play('star', 1 + i * 0.12); K.haptic('light'); K.fx.burst(v.w / 2 + (i - 1) * 130, this.cy() - 150, { screen: true, shape: 'star', colors: ['#ffe14a', '#fff6b0'], count: 14, speed: [200, 600], size: [8, 14], gravity: 500 }); });
      }
      if (this.newBest) K.wait(1.5).then(() => { K.audio.play('levelup'); K.haptic('success'); });
    } else K.audio.play('lose');
    // near-miss / coaching line
    const t = p.time, acc = p.acc;
    if (!p.win) this.note = p.left <= 3 ? 'So close! Only ' + p.left + ' pest' + (p.left === 1 ? '' : 's') + ' left!' : 'Swat wasps before their ring fills!';
    else if (p.stars === 3) this.note = p.maxCombo >= 5 ? 'Perfect! Best combo x' + p.maxCombo + '!' : 'Perfect picnic!';
    else if (L.goal === 'time' && t > L.par) this.note = 'Only ' + (t - L.par).toFixed(1) + 's slower than the speed star!';
    else if (L.goal === 'acc' && acc < L.acc) this.note = 'Accuracy ' + Math.round(acc * 100) + '% (need ' + Math.round(L.acc * 100) + '%)';
    else if (p.hp < 3) this.note = 'Keep the whole cake for the bonus star!';
    else this.note = '';
    this.note2 = this.unlockedNext ? 'Level ' + (p.lv + 2) + ' unlocked!' : '';
    const by = v => this.cy() + 330;
    const hasNext = p.win && p.lv + 1 < LEVELS.length;
    K.ui.button({ icon: 'home', color: 'blue', w: 116, h: 116, popIn: 0.4, place: v => ({ x: v.w / 2 - (hasNext ? 230 : 170), y: by(v) }), onTap: () => K.scenes.go('levels') });
    K.ui.button({ label: hasNext ? '' : 'RETRY', icon: 'retry', color: hasNext ? 'orange' : 'green', w: hasNext ? 116 : 300, h: 116, pulse: !hasNext, key: hasNext ? null : 'action', popIn: 0.5,
      place: v => ({ x: hasNext ? v.w / 2 - 90 : v.w / 2 + 60, y: by(v) }),
      onTap: async () => { await adGate(); K.scenes.go('play', { lv: p.lv }); } });
    if (hasNext) K.ui.button({ label: 'NEXT', icon: 'play', color: 'green', w: 300, h: 116, pulse: true, key: 'action', popIn: 0.6,
      place: v => ({ x: v.w / 2 + 120, y: by(v) }),
      onTap: async () => { await adGate(); K.scenes.go('play', { lv: p.lv + 1 }); } });
  },
  cy() { return K.view.h * 0.42; },
  backdrop,
  render(ctx) {
    const v = K.view, p = this.p;
    ctx.fillStyle = 'rgba(31,42,18,0.45)'; ctx.fillRect(-v.ox - 50, -v.oy - 50, v.fullW + 100, v.fullH + 100);
    const y = this.cy() + 520;
    if (v.h - y > 150) drawCake(ctx, v.w / 2, y, 0.9, p.hp, p.win ? ((K.time % 3) < 0.12 ? 'blink' : 'happy') : 'cry', null, K.time);
  },
  hud(ctx) {
    const v = K.view, p = this.p, L = LEVELS[p.lv], cy = this.cy();
    ctx.save(); ctx.translate(v.w / 2, cy); ctx.scale(this.pan.s, this.pan.s);
    const W = Math.min(v.w - 30, 640);
    K.draw.panel(0, 0, W, 560, { title: p.win ? 'LEVEL ' + (p.lv + 1) + ' CLEAR!' : 'CAKE RUINED!', color: p.win ? 'green' : 'red' });
    for (let i = 0; i < 3; i++) {
      const x = (i - 1) * 130, y = -168 + (i === 1 ? -14 : 0), R = i === 1 ? 56 : 46;
      K.draw.star(x, y, R, '#d8cfb6', { outline: 5 });
      const k = this.st[i].s; if (k > 0.01) { ctx.save(); ctx.translate(x, y); ctx.scale(k, k); ctx.rotate((1 - k) * 0.8); K.draw.star(0, 0, R, '#ffd23f', { outline: 5 }); ctx.restore(); }
    }
    K.draw.text(Math.round(this.shown.n).toLocaleString(), 0, -70, { size: 76, color: '#fff08a' });
    if (this.newBest) { ctx.save(); ctx.translate(0, -16); ctx.rotate(-0.04 + Math.sin(K.time * 5) * 0.04); const k = 1 + Math.sin(K.time * 8) * 0.06; ctx.scale(k, k); K.draw.text('NEW BEST!', 0, 0, { size: 36, color: '#8af59a' }); ctx.restore(); }
    else if (this.best > 0) K.draw.label('BEST ' + this.best.toLocaleString(), 0, -18, { size: 26, color: '#7a7058' });
    const rules = [
      ['Clear the level', p.win],
      ['Keep the whole cake', p.win && p.hp === 3],
      [L.goal === 'time' ? 'Finish under ' + K.fmtTime(L.par) + ' (' + K.fmtTime(p.time) + ')' : 'Accuracy ' + Math.round(L.acc * 100) + '%+ (' + Math.round(p.acc * 100) + '%)', p.win && (L.goal === 'time' ? p.time <= L.par : p.acc >= L.acc)],
    ];
    rules.forEach(([str, ok], i) => {
      const y = 30 + i * 52;
      K.draw.icon(ok ? 'check' : 'close', -W / 2 + 70, y, 40, ok ? '#6cc23a' : '#c0a890');
      K.draw.label(str, -W / 2 + 104, y, { size: 30, align: 'left', maxW: W - 150, color: ok ? K.THEME.paperText : '#9a8f78' });
    });
    if (this.note) K.draw.label(this.note, 0, 200, { size: 28, color: '#a85a0c', maxW: W - 60 });
    if (this.note2) K.draw.label(this.note2, 0, 238, { size: 26, color: '#3d7a1c', maxW: W - 60 });
    ctx.restore();
  },
});

/* Title card: full-bleed key art for the store thumbnail (deterministic) */
K.scenes.add('card', {
  music: null,
  backdrop(ctx) {
    const v = K.view;
    ctx.save(); ctx.translate(-v.ox, 0);
    paintBackdrop(ctx, { ox: 60, oy: v.oy, fullW: v.fullW + 120, fullH: v.fullH, w: v.fullW, h: v.h + 40 }, 8);
    ctx.restore();
    const g = ctx.createRadialGradient(v.w / 2, v.h * 0.58, 80, v.w / 2, v.h * 0.58, v.fullW * 0.7);
    g.addColorStop(0, 'rgba(255,240,180,0.35)'); g.addColorStop(1, 'rgba(20,40,10,0.45)');
    ctx.fillStyle = g; ctx.fillRect(-v.ox, -v.oy, v.fullW, v.fullH);
  },
  render(ctx) {
    const v = K.view, t = 1.3, cx = v.w / 2, cy = v.h * 0.72;
    const mk = (kind, x, y, extra) => Object.assign({ kind, r: BUGS[kind].r, id: x | 0, ph: (x * 0.01) % 6, x, y, vx: 0, anger: 0, st: 'fly', flash: 0, dcd: 0, cracked: false }, extra || {});
    const sq = (b, x, y, sc) => { ctx.save(); ctx.translate(x, y); ctx.scale(sc, sc); ctx.translate(-x, -y); drawBug(ctx, b, x, y, null); ctx.restore(); };
    // splats on the blanket
    const sr = K.rng(9);
    for (let i = 0; i < 7; i++) K.draw.drawSprite(splatSprite(sr.pick(['#7a9a3a', '#e8b020', '#3fb36a']), i % 4), cx + sr.range(-700, 700), sr.range(v.h * 0.35, v.h * 0.95), { rot: sr.range(0, 6), scale: sr.range(0.8, 1.4), alpha: 0.75 });
    drawCake(ctx, cx, cy, 2.2, 3, 'worried', { x: -0.9, y: -0.6 }, t);
    // angry wasp diving at the cake from the left
    const wasp = mk('wasp', cx - 430, v.h * 0.5, { anger: 0.9, vx: 300 });
    ctx.strokeStyle = 'rgba(255,255,255,0.75)'; ctx.lineWidth = 8; ctx.lineCap = 'round';
    for (let i = 0; i < 4; i++) { ctx.beginPath(); ctx.moveTo(wasp.x - 120 - i * 10, wasp.y - 60 + i * 34); ctx.lineTo(wasp.x - 240 - i * 30, wasp.y - 100 + i * 34); ctx.stroke(); }
    ctx.beginPath(); ctx.arc(wasp.x, wasp.y + 15, 108, -Math.PI / 2, -Math.PI / 2 + TAU * 0.85); ctx.lineWidth = 14; ctx.strokeStyle = '#ff3b2e'; ctx.stroke();
    sq(wasp, wasp.x, wasp.y, 2.6);
    // fly about to be smacked on the right + swatter mid-smack
    const fx = cx + 330, fy = v.h * 0.47;
    K.draw.drawSprite(splatSprite('#7a9a3a', 2), fx, fy + 20, { scale: 2.4, alpha: 0.9 });
    ctx.save(); ctx.translate(fx, fy); ctx.scale(2.4, 1.0); K.draw.drawSprite(bodySprite('fly', 'dead'), 0, 0); ctx.restore();
    const br = K.rng(4);
    for (let i = 0; i < 16; i++) { const a = br.range(0, TAU), d = br.range(90, 210); K.draw.blob(fx + Math.cos(a) * d, fy + Math.sin(a) * d * 0.8, br.range(6, 14), ['#d8f08a', '#a3c45a', '#5e7a2a'], { outline: 3 }); }
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 10;
    for (let i = 0; i < 10; i++) { const a = i / 10 * TAU, r0 = 170, r1 = 230; ctx.beginPath(); ctx.moveTo(fx + Math.cos(a) * r0, fy + Math.sin(a) * r0); ctx.lineTo(fx + Math.cos(a) * r1, fy + Math.sin(a) * r1); ctx.stroke(); }
    drawSwatter(ctx, fx + 10, fy - 10, 1.9, -0.45, 1);
    // escaping flies + ladybug + mosquito
    sq(mk('fly', cx - 150, v.h * 0.40, { vx: -200 }), cx - 150, v.h * 0.40, 1.9);
    sq(mk('fly', cx + 620, v.h * 0.80, { vx: 150 }), cx + 620, v.h * 0.80, 1.8);
    sq(mk('mosq', cx - 640, v.h * 0.82, { vx: 120 }), cx - 640, v.h * 0.82, 1.9);
    sq(mk('lady', cx + 120, v.h * 0.40, { vx: 100 }), cx + 120, v.h * 0.40, 1.7);
    ctx.globalAlpha = 0.9; K.draw.icon('heart', cx + 120, v.h * 0.40 - 90, 50, '#ff6a94'); ctx.globalAlpha = 1;
  },
  hud(ctx) {
    const v = K.view;
    ctx.save(); ctx.translate(v.w / 2, v.h * 0.2); ctx.rotate(-0.06);
    K.draw.text('SWAT', -60, -90, { size: 240, color: '#ffe14a', sw: 18 });
    K.draw.text('SQUAD', 70, 115, { size: 240, color: '#ff6a5a', sw: 18 });
    ctx.restore();
  },
});

K.boot(/[?&]card\b/.test(location.search) ? 'card' : 'title');
