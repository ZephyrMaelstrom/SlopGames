<body>
<script>
"use strict";
/* §1 MANIFEST */
const MANIFEST = {
  id: 'paper-plane',
  title: 'Paper Plane',
  version: '1.0.0',
  genre: 'runner',
  theme: 'ink',
  orientation: 'landscape',
  design: { w: 1280, h: 720, maxH: 900 },
  touch: { stick: false, buttons: [] },
  keys: { back: ['Escape', 'Backspace'] },
};
</script>
<script>
//#KERNEL-BEGIN 1.1.0
/* =========================================================================
   SlopGames KERNEL 1.1.0 — single-file HTML5 game kernel (Canvas2D, zero deps)
   Requires a global `MANIFEST` declared in an earlier <script>. Exposes `K`.
   Source of truth: /kernel/kernel-1.1.0.js  — never edit inside a game file.
   ========================================================================= */
const K = (() => {
  'use strict';
  const KERNEL_VERSION = '1.1.0';
  const TAU = Math.PI * 2;

  /* ---------- manifest defaults ---------- */
  const MF = (typeof MANIFEST !== 'undefined' && MANIFEST) ? MANIFEST : {};
  const DEFAULT_KEYS = {
    up: ['ArrowUp', 'KeyW', 'PadUp'], down: ['ArrowDown', 'KeyS', 'PadDown'],
    left: ['ArrowLeft', 'KeyA', 'PadLeft'], right: ['ArrowRight', 'KeyD', 'PadRight'],
    action: ['Space', 'Enter', 'PadA'], alt: ['ShiftLeft', 'KeyX', 'PadB'],
    pause: ['Escape', 'KeyP', 'PadStart'],
  };
  MF.id = MF.id || 'game';
  MF.title = MF.title || 'Game';
  MF.version = MF.version || '1.0.0';
  MF.design = Object.assign({ w: 720, h: 1280 }, MF.design || {});
  MF.keys = Object.assign({}, DEFAULT_KEYS, MF.keys || {});
  MF.touch = Object.assign({ stick: false, buttons: [] }, MF.touch || {});
  MF.platformOrigins = MF.platformOrigins || [];
  MF.orientation = MF.orientation || 'any';            // 'portrait' | 'landscape' | 'any'
  MF.theme = MF.theme || 'candy';

  /* ---------- canvas bootstrap (games may omit their own <canvas>) ---------- */
  if (!document.getElementById('k-base-css')) {
    const st = document.createElement('style'); st.id = 'k-base-css';
    st.textContent = 'html,body{margin:0;height:100%;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}#stage{position:fixed;inset:0;display:block;width:100%;height:100%;outline:none}';
    document.head.appendChild(st);
  }
  let canvas = document.getElementById('stage');
  if (!canvas) { canvas = document.createElement('canvas'); canvas.id = 'stage'; canvas.tabIndex = 0; document.body.appendChild(canvas); }
  const mainCtx = canvas.getContext('2d');
  let ctx = mainCtx;                                    // swapped while baking sprites

  /* =======================================================================
     MATH / RNG / NOISE / COLOR
     ======================================================================= */
  const M = {
    TAU,
    clamp: (v, a, b) => v < a ? a : v > b ? b : v,
    lerp: (a, b, t) => a + (b - a) * t,
    invLerp: (a, b, v) => (v - a) / (b - a),
    remap: (v, a, b, c, d) => c + (d - c) * ((v - a) / (b - a)),
    smoothstep: (a, b, v) => { const t = Math.max(0, Math.min(1, (v - a) / (b - a))); return t * t * (3 - 2 * t); },
    dist: (ax, ay, bx, by) => Math.hypot(bx - ax, by - ay),
    dist2: (ax, ay, bx, by) => (bx - ax) * (bx - ax) + (by - ay) * (by - ay),
    len: (x, y) => Math.hypot(x, y),
    norm: (x, y) => { const l = Math.hypot(x, y) || 1; return { x: x / l, y: y / l }; },
    dot: (ax, ay, bx, by) => ax * bx + ay * by,
    cross: (ax, ay, bx, by) => ax * by - ay * bx,
    rotate: (x, y, a) => { const c = Math.cos(a), s = Math.sin(a); return { x: x * c - y * s, y: x * s + y * c }; },
    angle: (x, y) => Math.atan2(y, x),
    angleDiff: (a, b) => { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; },
    approach: (v, t, d) => v < t ? Math.min(v + d, t) : Math.max(v - d, t),
    damp: (a, b, lambda, dt) => a + (b - a) * (1 - Math.exp(-lambda * dt)),
    wrap: (v, max) => ((v % max) + max) % max,
    sign: v => v > 0 ? 1 : v < 0 ? -1 : 0,
  };

  function rng(seed = 1) {
    let s = (seed >>> 0) || 1;
    const r = () => {
      s = (s + 0x6D2B79F5) | 0;
      let t = Math.imul(s ^ (s >>> 15), 1 | s);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    r.range = (a, b) => a + (b - a) * r();
    r.int = (a, b) => Math.floor(a + (b - a + 1) * r());
    r.pick = arr => arr[Math.floor(r() * arr.length)];
    r.chance = p => r() < p;
    r.sign = () => r() < 0.5 ? -1 : 1;
    r.shuffle = arr => { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); const t = arr[i]; arr[i] = arr[j]; arr[j] = t; } return arr; };
    r.weighted = (items, weightOf = it => it.w) => {
      let total = 0; for (const it of items) total += weightOf(it);
      let x = r() * total; for (const it of items) { x -= weightOf(it); if (x <= 0) return it; }
      return items[items.length - 1];
    };
    r.state = () => s;
    r.setState = v => { s = v | 0; };
    return r;
  }
  function hashSeed(str) {
    let h = 2166136261;
    str = String(str);
    for (let i = 0; i < str.length; i++) h = Math.imul(h ^ str.charCodeAt(i), 16777619);
    return h >>> 0;
  }
  function dailySeed(offsetDays = 0) {
    const d = new Date(Date.now() + offsetDays * 864e5);
    return hashSeed(MF.id + ':' + d.getUTCFullYear() + '-' + (d.getUTCMonth() + 1) + '-' + d.getUTCDate());
  }

  function noise(seed = 1) {
    const r = rng(seed), p = new Uint16Array(512), vals = new Float32Array(256), perm = [];
    for (let i = 0; i < 256; i++) { perm.push(i); vals[i] = r() * 2 - 1; }
    r.shuffle(perm);
    for (let i = 0; i < 512; i++) p[i] = perm[i & 255];
    const fade = t => t * t * (3 - 2 * t);
    const h1 = i => vals[p[i & 255]];
    const h2 = (i, j) => vals[p[p[i & 255] + (j & 255)]];
    function n1(x) { const xi = Math.floor(x), t = fade(x - xi); return M.lerp(h1(xi), h1(xi + 1), t); }
    function n2(x, y) {
      const xi = Math.floor(x), yi = Math.floor(y), u = fade(x - xi), v = fade(y - yi);
      return M.lerp(M.lerp(h2(xi, yi), h2(xi + 1, yi), u), M.lerp(h2(xi, yi + 1), h2(xi + 1, yi + 1), u), v);
    }
    function fbm(fn, oct, ...c) { let s = 0, a = 1, f = 1, n = 0; for (let i = 0; i < oct; i++) { s += a * fn(...c.map(v => v * f)); n += a; a *= 0.5; f *= 2; } return s / n; }
    return { n1, n2, fbm1: (x, o = 4) => fbm(n1, o, x), fbm2: (x, y, o = 4) => fbm(n2, o, x, y) };
  }

  const color = {
    rgb(hex) { hex = hex.replace('#', ''); if (hex.length === 3) hex = hex.split('').map(c => c + c).join(''); const n = parseInt(hex, 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; },
    hex(r, g, b) { return '#' + [r, g, b].map(v => Math.round(M.clamp(v, 0, 255)).toString(16).padStart(2, '0')).join(''); },
    mix(a, b, t) { const A = color.rgb(a), B = color.rgb(b); return color.hex(M.lerp(A[0], B[0], t), M.lerp(A[1], B[1], t), M.lerp(A[2], B[2], t)); },
    shade(hex, amt) { return amt >= 0 ? color.mix(hex, '#ffffff', amt) : color.mix(hex, '#000000', -amt); },
    alpha(hex, a) { const c = color.rgb(hex); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; },
    hsl(h, s, l) { return `hsl(${h},${s}%,${l}%)`; },
    pal(base) { return [color.shade(base, 0.45), base, color.shade(base, -0.3)]; },
  };

  const fmt = (n) => {
    const a = Math.abs(n);
    if (a < 1000) return String(Math.floor(n));
    const u = ['K', 'M', 'B', 'T', 'Qa', 'Qi']; let i = -1, v = a;
    while (v >= 1000 && i < u.length - 1) { v /= 1000; i++; }
    return (n < 0 ? '-' : '') + (v < 10 ? v.toFixed(2) : v < 100 ? v.toFixed(1) : Math.floor(v)) + u[i];
  };
  const fmtTime = (sec) => { sec = Math.max(0, Math.ceil(sec)); const m = Math.floor(sec / 60), s = sec % 60; return m + ':' + String(s).padStart(2, '0'); };
  function compact(arr, keep) { let j = 0; for (let i = 0; i < arr.length; i++) if (keep(arr[i], i)) arr[j++] = arr[i]; arr.length = j; return arr; }

  /* =======================================================================
     EASING / TWEENS / SPRINGS (cosmetic, real-time)
     ======================================================================= */
  const Ease = {
    linear: t => t,
    inQuad: t => t * t,
    outQuad: t => 1 - (1 - t) * (1 - t),
    inOutQuad: t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2,
    inCubic: t => t * t * t,
    outCubic: t => 1 - Math.pow(1 - t, 3),
    inOutCubic: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
    outQuart: t => 1 - Math.pow(1 - t, 4),
    inBack: t => { const c1 = 1.70158; return (c1 + 1) * t * t * t - c1 * t * t; },
    outBack: t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
    outElastic: t => t === 0 ? 0 : t === 1 ? 1 : Math.pow(2, -10 * t) * Math.sin((t * 10 - .75) * (TAU / 3)) + 1,
    outBounce: t => {
      const n = 7.5625, d = 2.75;
      if (t < 1 / d) return n * t * t;
      if (t < 2 / d) return n * (t -= 1.5 / d) * t + .75;
      if (t < 2.5 / d) return n * (t -= 2.25 / d) * t + .9375;
      return n * (t -= 2.625 / d) * t + .984375;
    },
    pingPong: t => t < 0.5 ? t * 2 : 2 - t * 2,
  };
  const tweens = [];
  function tween(obj, to, dur = 0.3, ease = Ease.outQuad, delay = 0) {
    const tw = { obj, to, from: {}, dur: Math.max(dur, 1e-4), ease, t: -delay, started: false, done: false, _then: null,
      then(fn) { this._then = fn; return this; }, kill() { this.done = true; } };
    tweens.push(tw);
    return tw;
  }
  tween.killOf = obj => { for (const t of tweens) if (t.obj === obj) t.done = true; };
  function wait(sec) { return new Promise(res => tween({}, {}, sec).then(res)); }
  function updateTweens(dt) {
    for (let i = tweens.length - 1; i >= 0; i--) {
      const tw = tweens[i];
      if (tw.done) { tweens.splice(i, 1); continue; }
      tw.t += dt;
      if (tw.t < 0) continue;
      if (!tw.started) { tw.started = true; for (const k in tw.to) tw.from[k] = tw.obj[k]; }
      const p = Math.min(1, tw.t / tw.dur), e = tw.ease(p);
      for (const k in tw.to) tw.obj[k] = tw.from[k] + (tw.to[k] - tw.from[k]) * e;
      if (p >= 1) { tw.done = true; tweens.splice(i, 1); if (tw._then) tw._then(); }
    }
  }
  // Critically-damped-ish spring: call every frame. s = {v, vel}; returns new value.
  function spring(s, target, dt, stiffness = 220, damping = 18) {
    const a = (target - s.v) * stiffness - s.vel * damping;
    s.vel += a * dt; s.v += s.vel * dt;
    return s.v;
  }

  /* =======================================================================
     VIEW / RESIZE / ADAPTIVE QUALITY
     ======================================================================= */
  const view = { w: MF.design.w, h: MF.design.h, fullW: MF.design.w, fullH: MF.design.h, ox: 0, oy: 0,
    scale: 1, dpr: 1, dprCap: 2.5, safe: { top: 0, right: 0, bottom: 0, left: 0 },
    get portrait() { return this.fullH >= this.fullW; } };
  const probe = document.createElement('div');
  probe.style.cssText = 'position:fixed;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)';
  document.body.appendChild(probe);
  function resize() {
    const D = MF.design;
    const cw = Math.max(1, window.innerWidth), ch = Math.max(1, window.innerHeight);
    const dpr = Math.min(window.devicePixelRatio || 1, view.dprCap);
    const scale = Math.min(cw / D.w, ch / D.h);
    view.scale = scale; view.dpr = dpr;
    view.fullW = cw / scale; view.fullH = ch / scale;
    view.w = Math.min(view.fullW, D.maxW || Infinity);
    view.h = Math.min(view.fullH, D.maxH || Infinity);
    view.ox = (view.fullW - view.w) / 2; view.oy = (view.fullH - view.h) / 2;
    canvas.width = Math.round(cw * dpr); canvas.height = Math.round(ch * dpr);
    const cs = getComputedStyle(probe);
    view.safe.top = Math.max(0, (parseFloat(cs.paddingTop) || 0) / scale - view.oy);
    view.safe.right = Math.max(0, (parseFloat(cs.paddingRight) || 0) / scale - view.ox);
    view.safe.bottom = Math.max(0, (parseFloat(cs.paddingBottom) || 0) / scale - view.oy);
    view.safe.left = Math.max(0, (parseFloat(cs.paddingLeft) || 0) / scale - view.ox);
    spriteCache.checkRes();
    input.layoutTouch();
    if (camera.auto) camera.center();
    scenes.layout();
  }

  /* =======================================================================
     THEMES — art-direction presets; every preset has the same color keys
     ======================================================================= */
  const ROUNDED = '"Arial Rounded MT Bold","Nunito","Baloo 2",ui-rounded,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';
  const THEMES = {
    candy: { ink: '#1b1b3a', paper: '#fff7e8', paperText: '#1b1b3a', bg: '#1b1b3a', sky: ['#4fc3ff', '#8a6cff'], font: ROUNDED,
      colors: { green: ['#8af59a', '#2fbf4a', '#1d8a33'], blue: ['#86d0ff', '#2b8cff', '#1a5fc0'], yellow: ['#fff08a', '#ffc21a', '#d48a00'],
        red: ['#ff9a9a', '#ff4b5c', '#c0283a'], purple: ['#d2b0ff', '#8f5bff', '#5f33c4'], orange: ['#ffc48a', '#ff8a1f', '#c45c00'],
        pink: ['#ffb0dc', '#ff5cb4', '#c42d84'], gray: ['#eef0f6', '#aab2c8', '#6f7891'] } },
    neon: { ink: '#07041a', paper: '#1a1440', paperText: '#ffffff', bg: '#07041a', sky: ['#1a0f3d', '#05030f'], font: ROUNDED, glow: true,
      colors: { green: ['#b0ffd0', '#22ff88', '#00a352'], blue: ['#b0f0ff', '#22d3ff', '#0078b8'], yellow: ['#fffbb0', '#ffe600', '#b89f00'],
        red: ['#ffb0c4', '#ff2e63', '#a8002f'], purple: ['#ebc4ff', '#b44cff', '#6d17b0'], orange: ['#ffd8b0', '#ff8c1a', '#b35400'],
        pink: ['#ffc8f2', '#ff3cc7', '#a3007a'], gray: ['#e0e3ff', '#8088c0', '#3a4070'] } },
    pastel: { ink: '#4a3f5c', paper: '#fffaf3', paperText: '#4a3f5c', bg: '#efe4ff', sky: ['#ffe1ec', '#d9e8ff'], font: ROUNDED,
      colors: { green: ['#d4f7dc', '#9be3ad', '#5fb377'], blue: ['#d6ecff', '#9ccbff', '#5f95cf'], yellow: ['#fff6cc', '#ffe08a', '#d1aa45'],
        red: ['#ffd6dc', '#ff9eac', '#cf6575'], purple: ['#ebdcff', '#c3a3ff', '#8b6bc9'], orange: ['#ffe4cc', '#ffbf8a', '#cf8c52'],
        pink: ['#ffdcef', '#ffa8d4', '#cf6fa0'], gray: ['#f4f2f7', '#cfc9d9', '#968ea6'] } },
    jungle: { ink: '#1f2a12', paper: '#fff6dc', paperText: '#1f2a12', bg: '#1f2a12', sky: ['#9be58e', '#2e8b57'], font: ROUNDED,
      colors: { green: ['#c4f28a', '#6cc23a', '#3d7a1c'], blue: ['#9fe3e0', '#2fa8a0', '#1d6b66'], yellow: ['#fff0a0', '#f2c230', '#a8800f'],
        red: ['#ffb09a', '#e8573a', '#a3321c'], purple: ['#d8b8ff', '#9b6ad6', '#63408f'], orange: ['#ffcf8f', '#f08c24', '#a85a0c'],
        pink: ['#ffc0d2', '#e86a94', '#a33a5e'], gray: ['#efe9d8', '#b5ab8f', '#7a7058'] } },
    ocean: { ink: '#0b2545', paper: '#f0fbff', paperText: '#0b2545', bg: '#0b2545', sky: ['#5ee7ff', '#1b6ca8'], font: ROUNDED,
      colors: { green: ['#a8ffe0', '#2ee6a6', '#16a374'], blue: ['#a8e4ff', '#2ab0ff', '#1572b3'], yellow: ['#fff3b0', '#ffd23f', '#b8901a'],
        red: ['#ffb3b3', '#ff5a5f', '#b8323a'], purple: ['#c9c4ff', '#7a6cff', '#4a3fb3'], orange: ['#ffd1a8', '#ff9a3c', '#b8621a'],
        pink: ['#ffc4e1', '#ff70b0', '#b83d78'], gray: ['#e8f4f8', '#9fbccb', '#5e7f8f'] } },
    retro: { ink: '#000000', paper: '#1d1d1d', paperText: '#ffffff', bg: '#000000', sky: ['#1a0033', '#000000'], font: '"Courier New",ui-monospace,Menlo,monospace',
      colors: { green: ['#80ff80', '#00d800', '#008800'], blue: ['#80c0ff', '#3878f8', '#0030b0'], yellow: ['#ffff80', '#f8d800', '#a88800'],
        red: ['#ff8080', '#f83800', '#a80000'], purple: ['#e080ff', '#a000f8', '#6000a8'], orange: ['#ffc080', '#f87800', '#a84800'],
        pink: ['#ffa0e0', '#f878f8', '#a838a8'], gray: ['#ffffff', '#bcbcbc', '#7c7c7c'] } },
    ink: { ink: '#141414', paper: '#ffffff', paperText: '#141414', bg: '#f5f1e8', sky: ['#faf7f0', '#e6dfcf'], font: ROUNDED,
      colors: { green: ['#e6e6e6', '#bdbdbd', '#7a7a7a'], blue: ['#e6e6e6', '#9e9e9e', '#5c5c5c'], yellow: ['#fff3c4', '#ffd84d', '#b89400'],
        red: ['#ffc9c4', '#e8402e', '#9e2216'], purple: ['#e0e0e0', '#8a8a8a', '#4d4d4d'], orange: ['#f0f0f0', '#b0b0b0', '#6e6e6e'],
        pink: ['#ffd6d1', '#f07a6e', '#a83f34'], gray: ['#ffffff', '#d6d6d6', '#8f8f8f'] } },
  };
  const THEME = {};
  function setTheme(name) {
    const t = THEMES[name] || THEMES.candy;
    for (const k in THEME) delete THEME[k];
    Object.assign(THEME, JSON.parse(JSON.stringify(t)), { name: THEMES[name] ? name : 'candy' });
    if (MF.bg) THEME.bg = MF.bg;
    document.body.style.background = THEME.bg;
    spriteCache.clear();
  }

  /* =======================================================================
     STORAGE / SAVE / META-PROGRESSION
     ======================================================================= */
  const store = (() => {
    const ns = 'k:' + MF.id + ':';
    const mem = {};
    return {
      get(k, def) {
        if (k in mem) return mem[k];
        try { const v = localStorage.getItem(ns + k); if (v != null) return (mem[k] = JSON.parse(v)); } catch (e) {}
        return def;
      },
      set(k, v) {
        mem[k] = v;
        try { localStorage.setItem(ns + k, JSON.stringify(v)); } catch (e) {}
        sdk.send('save', { key: k, value: v });
      },
      remove(k) { delete mem[k]; try { localStorage.removeItem(ns + k); } catch (e) {} sdk.send('save', { key: k, value: null }); },
      import(obj) { if (obj && typeof obj === 'object') for (const k in obj) if (obj[k] != null) mem[k] = obj[k]; },
    };
  })();

  const clone = o => JSON.parse(JSON.stringify(o));
  function fillDefaults(target, defs) {
    for (const k in defs) {
      if (!(k in target)) target[k] = clone(defs[k]);
      else if (defs[k] && typeof defs[k] === 'object' && !Array.isArray(defs[k]) && target[k] && typeof target[k] === 'object') fillDefaults(target[k], defs[k]);
    }
    return target;
  }
  const save = (() => {
    let def = null;
    const data = {};
    let commitT = null;
    function load(raw) {
      let d = raw && typeof raw === 'object' ? clone(raw) : null;
      if (!d) d = Object.assign(clone(def.defaults), { _v: def.version });
      let v = d._v || 1;
      while (v < def.version) { const fn = def.migrate[v + 1]; if (fn) d = fn(d) || d; v++; d._v = v; }
      fillDefaults(d, def.defaults);
      for (const k in data) delete data[k];
      Object.assign(data, d);
    }
    return {
      // K.save.define({version, defaults, migrate:{2: d => {...}}}) → returns the live data object
      define(o) { def = { version: o.version || 1, defaults: o.defaults || {}, migrate: o.migrate || {} }; load(store.get('save', null)); return data; },
      get data() { return data; },
      commit() { if (def) { clearTimeout(commitT); commitT = null; store.set('save', data); } },
      later() { if (def && !commitT) commitT = setTimeout(() => save.commit(), 800); },
      reset() { if (!def) return; for (const k in data) delete data[k]; Object.assign(data, clone(def.defaults), { _v: def.version }); save.commit(); },
      reload() { if (def) load(store.get('save', null)); },
      get defined() { return !!def; },
    };
  })();

  const meta = (() => {
    const m = () => {
      if (!save.defined) save.define({ version: 1, defaults: {} });
      const d = save.data;
      return d._meta || (d._meta = { wallet: {}, up: {}, levels: {}, daily: { last: null, streak: 0 }, unlocks: {}, sel: {} });
    };
    const upDefs = {};
    const listeners = [];

      wheel(x, y, dy) { for (let i = W.length - 1; i >= 0; i--) { const w = W[i]; if (w.kind === 'list' && active(w) && inRect(w, x, y, 0)) { const L = kinds.list.layout(w); w.off = M.clamp(w.off + dy, 0, L.maxOff); return true; } } return false; },
      keys() {
        for (const w of W) if (w.kind === 'button' && w.key && active(w) && input.pressed(w.key)) {
          bounce(w, 0.9, 0.06); w._tw.then(() => bounce(w, 1, 0.35, Ease.outElastic));
          if (w.sfx) audio.play(w.sfx); if (w.onTap) w.onTap(w); return;
        }
      },
    };
    return api;
  })();

  /* =======================================================================
     INPUT — keyboard, unified pointer, multitouch, gamepad, typed text, touch overlay
     ======================================================================= */
  const input = (() => {
    const keyMap = {};
    for (const a in MF.keys) for (const c of MF.keys[a]) (keyMap[c] || (keyMap[c] = [])).push(a);
    const held = new Set(), pr = new Set(), rl = new Set(), vHeld = new Set(), padHeld = new Set();
    const axis = { x: 0, y: 0 }, pad = { x: 0, y: 0, ax: 0, ay: 0, connected: false };
    const typed = [];
    const p = { x: 0, y: 0, down: false, pressed: false, released: false, tap: false, dragging: false,
      startX: 0, startY: 0, dx: 0, dy: 0, downAt: 0, holdTime: 0, id: null, vx: 0, vy: 0, _lx: 0, _ly: 0, _lt: 0,
      get wx() { return camera.toWorld(this.x, this.y).x; }, get wy() { return camera.toWorld(this.x, this.y).y; },
      get wStartX() { return camera.toWorld(this.startX, this.startY).x; }, get wStartY() { return camera.toWorld(this.startX, this.startY).y; } };
    const pointers = new Map();     // all non-UI pointers (multitouch)
    let touchMode = window.matchMedia && matchMedia('(pointer: coarse)').matches;
    const stick = { id: null, ox: 0, oy: 0, kx: 0, ky: 0, r: 90 };
    // Touch overlay config: scene.touch overrides MANIFEST.touch (set scene.touch = null to hide).
    const tc = () => { const sc = scenes.current; return sc && sc.touch !== undefined ? (sc.touch || NO_TOUCH) : MF.touch; };
    const NO_TOUCH = { stick: false, buttons: [] };
    let tbtn = [], tbtnFor = null;
    function syncButtons() {
      const c = tc();
      if (c !== tbtnFor) { tbtnFor = c; tbtn = (c.buttons || []).map(b => ({ action: b.action, label: b.label || '', icon: b.icon || null, color: b.color || 'purple', x: 0, y: 0, r: b.r || 72, id: null })); api.layoutTouch(); }
      return tbtn;
    }
    const toL = e => ({ x: e.clientX / view.scale - view.ox, y: e.clientY / view.scale - view.oy });
    const overlayOn = () => { if (!touchMode || !scenes.current || !scenes.current.gameplay || sys.paused || sys.modal) return false; const c = tc(); syncButtons(); return !!(c.stick || tbtn.length); };
    const press = a => { if (a === 'pause') { if (!sys.modal) sys.paused ? resumeGame() : pauseGame(); return; } held.add(a); pr.add(a); };

    window.addEventListener('keydown', e => {
      audio.unlock();
      if (e.code === 'Backquote') { debug.on = !debug.on; return; }
      if (!sys.ad && !e.ctrlKey && !e.metaKey) { if (e.key.length === 1) typed.push(e.key); else if (e.key === 'Backspace') typed.push('\b'); else if (e.key === 'Enter') typed.push('\n'); }
      const acts = keyMap[e.code];
      if (!acts) { if (e.key === 'Backspace' || e.key === ' ') e.preventDefault(); return; }
      e.preventDefault(); touchMode = false;
      if (e.repeat || sys.ad) return;
      acts.forEach(press);
    });
    window.addEventListener('keyup', e => { const acts = keyMap[e.code]; if (!acts) return; acts.forEach(a => { held.delete(a); rl.add(a); }); });
    window.addEventListener('blur', () => held.clear());

    canvas.addEventListener('pointerdown', e => {
      e.preventDefault(); audio.unlock(); try { canvas.focus({ preventScroll: true }); } catch (_) {}
      if (e.pointerType === 'touch' || e.pointerType === 'pen') touchMode = true; else if (e.pointerType === 'mouse') touchMode = false;
      if (sys.ad) return;
      const q = toL(e);
      try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
      if (sys.crashed) { if (q.y > view.h - 260) location.reload(); return; }
      if (ui.down(q.x, q.y, e.pointerId)) return;
      if (overlayOn()) {
        for (const b of tbtn) if (b.id == null && M.dist(q.x, q.y, b.x, b.y) < b.r * 1.3) { b.id = e.pointerId; vHeld.add(b.action); pr.add(b.action); haptic('light'); return; }
        if (tc().stick && stick.id == null && q.x < view.w * 0.5) { stick.id = e.pointerId; stick.ox = q.x; stick.oy = q.y; stick.kx = stick.ky = 0; return; }
      }
      if (sys.paused) return;
      pointers.set(e.pointerId, { id: e.pointerId, x: q.x, y: q.y, startX: q.x, startY: q.y, downAt: performance.now(), pressed: true });
      if (p.id != null) return;
      p.id = e.pointerId; p.down = true; p.pressed = true; p.dragging = false;
      p.x = p.startX = p._lx = q.x; p.y = p.startY = p._ly = q.y; p.dx = p.dy = p.vx = p.vy = 0; p.downAt = p._lt = performance.now(); p.holdTime = 0;
    });
    canvas.addEventListener('pointermove', e => {
      const q = toL(e);
      if (e.pointerId === stick.id) {
        let dx = q.x - stick.ox, dy = q.y - stick.oy; const d = Math.hypot(dx, dy);
        if (d > stick.r) { dx *= stick.r / d; dy *= stick.r / d; }
        stick.kx = dx; stick.ky = dy; axis.x = dx / stick.r; axis.y = dy / stick.r; return;
      }
      ui.move(q.x, q.y, e.pointerId);
      const pt = pointers.get(e.pointerId); if (pt) { pt.x = q.x; pt.y = q.y; }
      if (e.pointerId === p.id || p.id == null) { p.x = q.x; p.y = q.y; }
      if (e.pointerId === p.id) {
        p.dx = p.x - p.startX; p.dy = p.y - p.startY;
        if (!p.dragging && Math.hypot(p.dx, p.dy) > 14) p.dragging = true;
        const now = performance.now(), dt = Math.max(1, now - p._lt) / 1000;
        p.vx = p.vx * 0.5 + (q.x - p._lx) / dt * 0.5; p.vy = p.vy * 0.5 + (q.y - p._ly) / dt * 0.5; p._lx = q.x; p._ly = q.y; p._lt = now;
      }
    });
    const up = (e, cancel) => {
      const q = toL(e);
      if (ui.up(q.x, q.y, e.pointerId)) return;
      for (const b of tbtn) if (b.id === e.pointerId) { b.id = null; if (!tbtn.some(o => o.id != null && o.action === b.action)) { vHeld.delete(b.action); rl.add(b.action); } return; }
      if (e.pointerId === stick.id) { stick.id = null; axis.x = axis.y = 0; return; }
      pointers.delete(e.pointerId);
      if (e.pointerId === p.id) {
        p.x = q.x; p.y = q.y; p.dx = p.x - p.startX; p.dy = p.y - p.startY;
        if (performance.now() - p._lt > 80) { p.vx = 0; p.vy = 0; }
        p.down = false; p.released = !cancel; p.tap = !cancel && !p.dragging && performance.now() - p.downAt < 350; p.id = null;
      }
    };
    canvas.addEventListener('pointerup', e => up(e, false));
    canvas.addEventListener('pointercancel', e => up(e, true));
    canvas.addEventListener('contextmenu', e => e.preventDefault());
    canvas.addEventListener('wheel', e => { e.preventDefault(); const q = toL(e); if (!ui.wheel(q.x, q.y, e.deltaY)) api.wheel += e.deltaY; }, { passive: false });

    const PAD_NAMES = ['PadA', 'PadB', 'PadX', 'PadY', 'PadLB', 'PadRB', 'PadLT', 'PadRT', 'PadBack', 'PadStart', 'PadL3', 'PadR3', 'PadUp', 'PadDown', 'PadLeft', 'PadRight'];
    const dz = v => Math.abs(v) < 0.2 ? 0 : (v - Math.sign(v) * 0.2) / 0.8;
    function pollPad() {
      if (!navigator.getGamepads) return;
      let gp = null; try { for (const g of navigator.getGamepads()) if (g && g.connected) { gp = g; break; } } catch (e) { return; }
      pad.connected = !!gp;
      if (!gp) { if (padHeld.size) { padHeld.forEach(a => rl.add(a)); padHeld.clear(); } pad.x = pad.y = pad.ax = pad.ay = 0; return; }
      const now = new Set();
      gp.buttons.forEach((b, i) => { if (b.pressed && PAD_NAMES[i] && keyMap[PAD_NAMES[i]]) keyMap[PAD_NAMES[i]].forEach(a => now.add(a)); });
      pad.x = dz(gp.axes[0] || 0); pad.y = dz(gp.axes[1] || 0); pad.ax = dz(gp.axes[2] || 0); pad.ay = dz(gp.axes[3] || 0);
      for (const a of now) if (!padHeld.has(a)) { touchMode = false; if (a === 'pause') press(a); else { pr.add(a); } }
      for (const a of padHeld) if (!now.has(a)) rl.add(a);
      padHeld.clear(); now.forEach(a => { if (a !== 'pause') padHeld.add(a); });
    }

    const api = {
      pointer: p, pointers, pad, wheel: 0,
      get typed() { return typed; },
      get touch() { return touchMode; },
      down: a => held.has(a) || vHeld.has(a) || padHeld.has(a),
      pressed: a => pr.has(a),
      released: a => rl.has(a),
      axisX() { let x = axis.x + pad.x; if (api.down('left')) x -= 1; if (api.down('right')) x += 1; return M.clamp(x, -1, 1); },
      axisY() { let y = axis.y + pad.y; if (api.down('up')) y -= 1; if (api.down('down')) y += 1; return M.clamp(y, -1, 1); },
      // Normalized movement vector (diagonals not faster).
      move() { const x = api.axisX(), y = api.axisY(), l = Math.hypot(x, y); return l > 1 ? { x: x / l, y: y / l } : { x, y }; },
      // Aim direction: right stick, else pointer relative to (fromX, fromY) in world space.
      aim(fromX, fromY) {
        if (Math.hypot(pad.ax, pad.ay) > 0.3) return { x: pad.ax, y: pad.ay, active: true };
        const dx = p.wx - fromX, dy = p.wy - fromY, l = Math.hypot(dx, dy) || 1;

      },
      poll() { pollPad(); if (p.down) p.holdTime = (performance.now() - p.downAt) / 1000; },
      endStep() { pr.clear(); rl.clear(); p.pressed = p.released = p.tap = false; typed.length = 0; api.wheel = 0; for (const pt of pointers.values()) pt.pressed = false; },
      reset() {
        held.clear(); vHeld.clear(); pr.clear(); rl.clear(); typed.length = 0; axis.x = axis.y = 0; stick.id = null; pointers.clear();
        tbtn.forEach(b => b.id = null); p.down = p.pressed = p.released = p.tap = p.dragging = false; p.id = null; p.vx = p.vy = 0;
      },
      layoutTouch() {
        tbtn.forEach((b, i) => { b.x = view.w - 110 - view.safe.right - (i % 2) * 165; b.y = view.h - 140 - view.safe.bottom - (i % 2) * 70 - Math.floor(i / 2) * 170; });
      },
      drawTouch() {
        if (!overlayOn()) return;
        if (tc().stick) {
          const ox = stick.id != null ? stick.ox : 150 + view.safe.left, oy = stick.id != null ? stick.oy : view.h - 170 - view.safe.bottom;
          ctx.globalAlpha = stick.id != null ? 0.55 : 0.25;
          ctx.beginPath(); ctx.arc(ox, oy, stick.r + 20, 0, TAU); ctx.fillStyle = color.alpha(THEME.ink, 0.5); ctx.fill();
          ctx.lineWidth = 5; ctx.strokeStyle = '#fff'; ctx.stroke();
          ctx.globalAlpha = stick.id != null ? 0.9 : 0.35;
          blob(ox + (stick.id != null ? stick.kx : 0), oy + (stick.id != null ? stick.ky : 0), 48, THEME.colors.gray);
          ctx.globalAlpha = 1;
        }
        for (const b of tbtn) {
          ctx.globalAlpha = b.id != null ? 0.95 : 0.6;
          blob(b.x, b.y + (b.id != null ? 4 : 0), b.r * (b.id != null ? 0.92 : 1), THEME.colors[b.color] || THEME.colors.purple);
          if (b.icon) icon(b.icon, b.x, b.y, b.r * 0.8); else text(b.label, b.x, b.y, { size: 44 });
          ctx.globalAlpha = 1;
        }
      },
    };
    return api;
  })();

  /* =======================================================================
     SCENES
     ======================================================================= */
  const scenes = (() => {
    const reg = {};
    let cur = null, name = null, busy = false;
    const fade = { a: 0 };
    function swap(n, params) {
      if (!reg[n]) { reportError(new Error('Unknown scene: ' + n), 'scenes.go'); return; }
      if (cur) { if (cur.gameplay) sdk.send('gameplayStop'); safeCall(cur, 'exit'); }
      ui.clearScene(); ui.clearModals(); fx.clear(); input.reset(); camera.reset(); sys.paused = false; hitstopT = 0; acc = 0;
      name = n; cur = reg[n];
      safeCall(cur, 'enter', params || {});
      safeCall(cur, 'layout', view);
      ui.place();
      if (cur.music !== undefined) { if (cur.music) music.play(cur.music); else music.stop(); }
      if (cur.gameplay) sdk.send('gameplayStart');
      sdk.send('scene', { name: n });
    }
    return {
      add(n, def) { reg[n] = def; return def; },
      has(n) { return !!reg[n]; },
      go(n, params, opts = {}) {
        if (busy) return;
        if (!cur || opts.instant) { swap(n, params); return; }
        busy = true;
        tween(fade, { a: 1 }, 0.16, Ease.inQuad).then(() => { swap(n, params); tween(fade, { a: 0 }, 0.22, Ease.outQuad).then(() => busy = false); });
      },
      get current() { return cur; },
      get name() { return name; },
      get list() { return Object.keys(reg); },
      fade,
      layout() { safeCall(cur, 'layout', view); ui.place(); },
    };
  })();

  /* =======================================================================
     ADS
     ======================================================================= */
  const devAd = { on: false, t: 0, kind: '', res: null };
  async function adBreak(kind = 'midgame') {
    if (sys.ad) return { shown: false, granted: false };
    sys.ad = true; input.reset(); updateDuck(); sdk.send('gameplayStop');
    let r = null;
    if (sdk.connected) r = await sdk.request('adBreak', { kind }, 90000);
    else if (!sdk.inFrame) r = await new Promise(res => { Object.assign(devAd, { on: true, t: kind === 'rewarded' ? 2 : 1, kind, res }); });
    sys.ad = false; updateDuck(); last = performance.now();
    if (scenes.current && scenes.current.gameplay && !sys.paused) sdk.send('gameplayStart');
    r = r || {};
    return { shown: !!r.shown, granted: kind === 'rewarded' && !!r.granted };
  }

  /* =======================================================================
     DEBUG
     ======================================================================= */
  const debug = { on: /[?&]debug/.test(location.search), fps: 60, steps: 0, low: 0 };

  /* ---------- system pause overlay widgets ---------- */
  ui.button({ group: 'sys', label: 'RESUME', icon: 'play', color: 'green', w: 400, h: 120, key: 'action', pulse: true,
    place: v => ({ x: v.w / 2, y: v.h / 2 + 10 }), onTap: resumeGame });
  ui.soundButton({ group: 'sys', place: v => ({ x: v.w / 2 - 130, y: v.h / 2 + 165 }) });
  ui.musicButton({ group: 'sys', place: v => ({ x: v.w / 2, y: v.h / 2 + 165 }) });
  const sysHome = ui.button({ group: 'sys', icon: 'home', color: 'red', w: 110, h: 110,
    place: v => ({ x: v.w / 2 + 130, y: v.h / 2 + 165 }),
    onTap: () => { const sc = scenes.current; sys.paused = false; safeCall(sc, 'onQuit'); } });

  /* =======================================================================
     MAIN LOOP — fixed-step sim (60 Hz), per-frame presentation
     ======================================================================= */
  const STEP = 1 / 60, MAX_STEPS = 6;
  let last = 0, acc = 0, clock = 0, frameN = 0;
  function frame(now) {
    requestAnimationFrame(frame);
    let dt = (now - last) / 1000; last = now;
    if (!(dt > 0)) dt = 0; if (dt > 0.1) dt = 0.1;
    if (dt > 0) debug.fps += (1 / dt - debug.fps) * 0.05;
    frameN++;
    // adaptive resolution: drop DPR if we're struggling
    if (frameN > 120 && debug.fps < 42 && view.dprCap > 1) { if (++debug.low > 90) { view.dprCap = Math.max(1, view.dprCap - 0.5); debug.low = 0; resize(); } } else debug.low = 0;
    if (devAd.on) { devAd.t -= dt; if (devAd.t <= 0) { devAd.on = false; devAd.res({ shown: true, granted: true }); } }
    sys.rotate = input.touch && ((MF.orientation === 'landscape' && view.fullH > view.fullW * 1.1) || (MF.orientation === 'portrait' && view.fullW > view.fullH * 1.1));
    const sc = scenes.current;
    input.poll();
    if (!sys.frozen && sc) {
      clock += dt;
      updateTweens(dt);
      ui.update(dt);
      ui.keys();
      if (!sys.simHalted) {
        let steps = 0;
        if (hitstopT > 0) hitstopT -= dt;
        else {
          acc += dt;
          while (acc >= STEP && steps < MAX_STEPS) {
            safeCall(sc, 'update', STEP); input.endStep(); acc -= STEP; steps++;
            if (scenes.current !== sc || sys.simHalted) break;
          }
          if (steps === MAX_STEPS) acc = 0;
        }
        debug.steps = steps;
        safeCall(sc, 'frame', dt);
        fx.update(dt);
      } else if (sys.modal && !sys.paused) { fx.update(dt); input.endStep(); }
      camera.update(dt, M.clamp(acc / STEP, 0, 1));
    }
    ui.place();
    render();
  }

  function render() {
    const s = view.dpr * view.scale, sc = scenes.current, alpha = M.clamp(acc / STEP, 0, 1);
    ctx = mainCtx;
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1;
    ctx.fillStyle = THEME.bg; ctx.fillRect(0, 0, canvas.width, canvas.height);
    const ox = view.ox, oy = view.oy;
    // world layer (shakes; camera)
    ctx.setTransform(s, 0, 0, s, (ox + fx.offset.x) * s, (oy + fx.offset.y) * s);
    if (sc) safeCall(sc, 'backdrop', ctx, alpha);
    ctx.save(); camera.apply(ctx);
    if (sc) safeCall(sc, 'render', ctx, alpha);
    fx.draw(false);
    ctx.restore();
    // screen layer (stable)
    ctx.setTransform(s, 0, 0, s, ox * s, oy * s);
    if (sc) safeCall(sc, 'hud', ctx, alpha);
    fx.draw(true);
    input.drawTouch();
    ui.draw('scene');
    fx.drawFlash();
    ui.drawModals();
    ui.drawToasts();
    if (sys.paused) {
      ctx.fillStyle = 'rgba(20,18,50,0.62)'; ctx.fillRect(-ox, -oy, view.fullW, view.fullH);
      panel(view.w / 2, view.h / 2 + 50, 540, 480, { title: 'PAUSED', color: 'purple' });
      sysHome.visible = !!(sc && sc.onQuit);
      ui.draw('sys');
    }
    if (sys.rotate) {
      ctx.fillStyle = THEME.bg; ctx.fillRect(-ox, -oy, view.fullW, view.fullH);
      ctx.save(); ctx.translate(view.w / 2, view.h / 2 - 60); ctx.rotate(Math.sin(clock * 3) * 0.6);
      block(-70, -110, 140, 220, 'blue', { r: 24 }); ctx.restore();
      text('Rotate your device', view.w / 2, view.h / 2 + 120, { size: 48, maxW: view.w - 60 });
    }
    if (devAd.on) {
      ctx.fillStyle = '#0d0c22'; ctx.fillRect(-ox, -oy, view.fullW, view.fullH);
      text('AD BREAK', view.w / 2, view.h / 2 - 50, { size: 72, color: '#ffe680' });
      text(`${devAd.kind} · dev stub · ${Math.ceil(devAd.t)}`, view.w / 2, view.h / 2 + 40, { size: 32, color: '#aab2c8' });
    }
    if (sys.crashed) {
      ctx.fillStyle = 'rgba(16,10,30,0.88)'; ctx.fillRect(-ox, -oy, view.fullW, view.fullH);
      icon('skull', view.w / 2, view.h / 2 - 170, 140, '#ff9a9a');
      text('Oops! The game crashed.', view.w / 2, view.h / 2 - 40, { size: 50, maxW: view.w - 60 });
      label(sys.crashed.where + ': ' + sys.crashed.message, view.w / 2, view.h / 2 + 40, { size: 26, color: '#ffb0b0', maxW: view.w - 60 });
      block(view.w / 2 - 190, view.h - 220, 380, 110, 'green', { r: 36 }); text('RESTART', view.w / 2, view.h - 170, { size: 48 });
    }
    if (scenes.fade.a > 0) { ctx.globalAlpha = scenes.fade.a; ctx.fillStyle = THEME.bg; ctx.fillRect(-ox, -oy, view.fullW, view.fullH); ctx.globalAlpha = 1; }
    if (debug.on) {
      const lines = [`${debug.fps | 0} fps · ${debug.steps} steps · ${fx.count} fx · ${spriteCache.size} spr`, `${view.w | 0}×${view.h | 0} @${(view.dpr * view.scale).toFixed(2)} · scene ${scenes.name} · k${KERNEL_VERSION}`];
      lines.forEach((l, i) => text(l, 12 - 0, 22 + i * 26 + view.safe.top, { size: 20, align: 'left', shadow: false, sw: 4 }));
    }
  }

  /* =======================================================================
     BOOT
     ======================================================================= */
  let booted = false;
  function boot(startScene, params) {
    if (booted) return; booted = true;
    // Title-card mode: the platform (window.SG_CARD) or a ?card URL boots a game's 'card' key-art scene for thumbnails.
    try { if ((window.SG_CARD || /[?&]card\b/.test(location.search)) && scenes.has('card')) startScene = 'card'; } catch (e) {}
    resize();
    window.addEventListener('resize', resize);
    if (window.visualViewport) visualViewport.addEventListener('resize', resize);
    document.addEventListener('visibilitychange', () => {
      sys.hidden = document.hidden;
      if (document.hidden) { pauseGame(); input.reset(); save.commit(); }
      updateDuck(); last = performance.now();
    });
    window.addEventListener('pagehide', () => save.commit());
    sdk.on('hello', d => {
      sdk.connected = true;
      if (d && d.save) { store.import(d.save); save.reload(); }
      if (d && typeof d.muted === 'boolean') { sys.platformMute = d.muted; updateDuck(); }
      if (d && d.debug) debug.on = true;
    });
    sdk.on('pause', () => { sys.platformPause = true; pauseGame(); updateDuck(); });
    sdk.on('resume', () => { sys.platformPause = false; updateDuck(); last = performance.now(); });
    sdk.on('mute', d => { sys.platformMute = !!(d && d.muted); updateDuck(); });
    sdk.on('debug', d => { debug.on = !!(d && d.on); });
    sdk.on('snapshot', d => {
      try {
        const w = (d && d.width) || 480, c = document.createElement('canvas'); c.width = w; c.height = Math.round(w * canvas.height / canvas.width);
        c.getContext('2d').drawImage(canvas, 0, 0, c.width, c.height);
        sdk.send('snapshot', { id: d && d.id, data: c.toDataURL('image/jpeg', 0.85) });
      } catch (err) { sdk.send('snapshot', { id: d && d.id, error: String(err) }); }
    });
    sdk.send('loadProgress', { p: 1 });
    scenes.go(startScene, params);
    sdk.send('ready', { game: MF.id, title: MF.title, version: MF.version, kernel: KERNEL_VERSION, orientation: MF.orientation, design: MF.design });
    last = performance.now();
    requestAnimationFrame(frame);
  }

/* ---------- 3a. SIMULATION (pure: no drawing, no audio, no Math.random) ---------- */

  create(seed, fold) {

      }

        p.dead = true; p.deadT = 0; p.cause = hit; p.vy = -260;

      }
    }

    const mg = (F.magnet || 0) + 44;
    for (const st of s.stars) {
      if (st.taken) continue;
      const dx = p.x - st.x, dy = p.y - st.y;

    K.compact(s.vents, v => v.x > cut);
    K.compact(s.cranes, c => c.jib1 > cut);
    K.compact(s.birds, b => b.x > cut);
    K.compact(s.gusts, g => g.x + g.w > cut);

  revive(s) {

function paperBackdrop(ctx, tScroll = 0) {

/* ----- foreground paper city ----- */
const PAPERS = [['#fff1d6', '#f3cf96'], ['#ffd9cc', '#f4a58c'], ['#d2f0e2', '#93cdb4'], ['#e2daf7', '#b4a4e3'], ['#ffeaa8', '#efc650'], ['#d3ebfb', '#8fc3e6']];
function drawBuilding(ctx, b, R) {
  const P = PAPERS[b.col], bot = GROUND + 4, x = b.x, w = b.w, top = b.top;
  ctx.fillStyle = 'rgba(70,50,100,0.22)'; ctx.fillRect(x + 12, top + 10, w, bot - top);

  ctx.fillStyle = 'rgba(255,255,255,0.7)';

  ctx.strokeStyle = 'rgba(60,50,80,0.6)'; ctx.lineWidth = 2.5; ctx.strokeRect(x, top, w, bot - top);

    ctx.fillStyle = 'rgba(70,50,100,0.16)'; ctx.fillRect(vx - 30 + 6, top - 26 + 6, 60, 26);
    ctx.fillStyle = '#c9d3dc'; ctx.fillRect(vx - 30, top - 26, 60, 26); ctx.strokeRect(vx - 30, top - 26, 60, 26);

}
function drawVent(ctx, v, t) {
  // rising air column: soft band + wavy lines + paper bits
  ctx.fillStyle = 'rgba(255,255,255,0.32)'; ctx.fillRect(v.x - v.w / 2, v.top - v.h, v.w, v.h - 26);

function drawCrane(ctx, c) {

  ctx.fillStyle = '#dff0fa'; ctx.fillRect(c.x - 14, c.top + 22, 18, 14);
  ctx.fillStyle = '#9aa6b2'; ctx.fillRect(c.jib1 - 36, c.top + 16, 32, 26); ctx.strokeRect(c.jib1 - 36, c.top + 16, 32, 26);

  ctx.strokeStyle = '#4a4a55'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(c.hookX, c.top + 16); ctx.lineTo(c.hookX, c.hookBot - 40); ctx.stroke();
  ctx.fillStyle = '#e8402e'; ctx.fillRect(c.hookX - 18, c.hookBot - 40, 36, 40); ctx.strokeRect(c.hookX - 18, c.hookBot - 40, 36, 40);
  ctx.fillStyle = '#ffffff'; ctx.fillRect(c.hookX - 18, c.hookBot - 26, 36, 8);

function drawBird(ctx, b, x, y) {
  const fl = Math.sin(b.ph * 3.2);
  ctx.save(); ctx.translate(x, y);
  ctx.fillStyle = 'rgba(70,50,100,0.16)'; ctx.beginPath(); ctx.moveTo(-18 + 8, 2 + 10); ctx.lineTo(22 + 8, 0 + 10); ctx.lineTo(-4 + 8, 10 + 10); ctx.fill();
  ctx.fillStyle = '#6d8fb8'; ctx.beginPath(); ctx.moveTo(-6, 0); ctx.lineTo(14, -2); ctx.lineTo(4 + fl * 4, -26 * fl); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#9fbde0'; ctx.beginPath(); ctx.moveTo(-22, 2); ctx.lineTo(-12, -4); ctx.lineTo(22, -2); ctx.lineTo(28, 4); ctx.lineTo(-2, 10); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(40,50,80,0.7)'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = '#ffb23a'; ctx.beginPath(); ctx.moveTo(-22, 2); ctx.lineTo(-32, 5); ctx.lineTo(-21, 7); ctx.fill();
  ctx.fillStyle = '#c3dbf2'; ctx.beginPath(); ctx.moveTo(-4, 0); ctx.lineTo(12, -2); ctx.lineTo(2 - fl * 6, 22 * fl - 4); ctx.closePath(); ctx.fill(); ctx.stroke();

function drawGust(ctx, g, t, R) {
  const down = g.f > 0, col = down ? 'rgba(120,130,170,0.5)' : 'rgba(255,255,255,0.7)';
  ctx.fillStyle = down ? 'rgba(120,130,170,0.08)' : 'rgba(255,255,255,0.12)'; ctx.fillRect(g.x, CEIL - 60, g.w, GROUND - CEIL + 60);
  ctx.strokeStyle = col; ctx.lineWidth = 3; ctx.lineCap = 'round';
  for (let k = 0; k < 9; k++) {
    const yy = 80 + k * 66 + Math.sin(t + k) * 10, ph = (t * 0.9 + k * 0.37) % 1, xx = g.x + 20 + ph * (g.w - 120);

  ctx.fillStyle = 'rgba(70,60,100,0.16)';
  for (const [dx, dy, r] of [[-rn.w * 0.3, 130, 50], [0, 112, 70], [rn.w * 0.3, 132, 52]]) { ctx.beginPath(); ctx.arc(cx + dx + 8, dy + 10, r, 0, TAU); ctx.fill(); }
  ctx.fillStyle = '#b9c2d6';
  for (const [dx, dy, r] of [[-rn.w * 0.3, 130, 50], [0, 112, 70], [rn.w * 0.3, 132, 52]]) { ctx.beginPath(); ctx.arc(cx + dx, dy, r, 0, TAU); ctx.fill(); }
  ctx.fillStyle = '#ccd3e3'; ctx.fillRect(rn.x + rn.w * 0.1, 130, rn.w * 0.8, 50);
  ctx.fillStyle = INK; ctx.beginPath(); ctx.arc(cx - 16, 140, 3, 0, TAU); ctx.arc(cx + 16, 140, 3, 0, TAU); ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(cx, 158, 8, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke();

    const ph = (t * 1.3 + hh(rn.id, k, 1)) % 1, xx = rn.x + 20 + hh(rn.id, k, 2) * (rn.w - 40), yy = 180 + ph * (GROUND - 180);

function starSprite(big) {

    const c = R + 5;
    const path = (ox, oy) => { g.beginPath(); for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, d = i % 2 ? R * 0.48 : R; i ? g.lineTo(c + ox + Math.cos(a) * d, c + oy + Math.sin(a) * d) : g.moveTo(c + ox + Math.cos(a) * d, c + oy + Math.sin(a) * d); } g.closePath(); };

    g.strokeStyle = 'rgba(150,100,20,0.6)'; g.lineWidth = 1.5; path(0, 0); g.stroke();

/* ----- the plane ----- */
function planePolys(F, t) {
  // [fill, flatPts] in local space, nose at +x: far wing, keel, near wing (+ extras)
  const P = F.paper, S = F.shade, D = K.color.shade(F.shade, -0.05);
  switch (F.shape) {
    case 'needle': return [[D, [42, -1, -30, -22, -34, -12]], [S, [42, 0, -28, 3, -24, 12]], [P, [44, 0, -36, -12, -28, 3]]];
    case 'wide': return [[D, [30, -2, -22, -34, -32, -18]], [S, [30, 0, -18, 4, -16, 14]], [P, [32, 0, -36, -18, -30, -2, -20, 4]]];
    case 'fork': return [[D, [34, -1, -24, -28, -30, -14]], [S, [34, 0, -20, 4, -18, 13]], [P, [36, 0, -34, -16, -22, -5, -34, 4, -18, 4]]];
    case 'stub': return [[D, [28, -1, -20, -26, -26, -14]], [S, [28, 0, -18, 4, -16, 13]], [P, [30, 0, -28, -14, -18, 4]], [F.crease, [-22, -12, -30, -28, -18, -12]]];
    case 'crane': {
      const fl = Math.sin(t * 7) * 0.5 + 0.5;
      return [[D, [6, -4, -14, -4, -4 - fl * 6, -36 + fl * 22]], [S, [-22, 0, 10, 4, 16, -2, -6, -8]], [P, [16, -2, 26, -18, 34, -18, 22, -12, 10, 4]], [P, [-10, -2, -34, -12, -24, 2]], [S, [8, -6, -12, -6, -2 + fl * 4, -44 + fl * 30]]];
    }
    case 'jet': return [[D, [38, -1, -26, -28, -32, -14]], [S, [38, 0, -24, 4, -22, 14]], [P, [40, 0, -34, -14, -24, 4]], [S, [-26, -12, -36, -26, -20, -10]]];
    default: return [[D, [36, -1, -26, -26, -32, -13]], [S, [36, 0, -24, 3, -20, 13]], [P, [38, 0, -34, -13, -24, 3]]];
  }
}
// o: { scale, mood: 'happy'|'calm'|'scared'|'dizzy', t, wet, shadow }
function drawPlane(ctx, x, y, ang, F, o = {}) {
  const t = o.t || 0, polys = planePolys(F, t);
  ctx.save(); ctx.translate(x, y);
  if (o.scale) ctx.scale(o.scale, o.scale);
  if (o.shadow !== false) {
    ctx.save(); ctx.translate(12, 30); ctx.rotate(ang * 0.5); ctx.scale(0.9, 0.4); ctx.fillStyle = 'rgba(60,50,100,0.1)';
    for (const [, pts] of polys) { ctx.beginPath(); ctx.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]); ctx.closePath(); ctx.fill(); }
    ctx.restore();
  }
  ctx.rotate(ang);
  ctx.lineJoin = 'round';
  for (const [col, pts] of polys) {
    ctx.beginPath(); ctx.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]); ctx.closePath();
    ctx.fillStyle = o.wet && col === F.paper ? K.color.mix(col, '#9fb8d6', 0.35) : col; ctx.fill();
    ctx.lineWidth = 2.4; ctx.strokeStyle = INK; ctx.stroke();
  }
  // fold creases
  ctx.strokeStyle = F.crease; ctx.lineWidth = 1.6; ctx.globalAlpha = 0.85;
  if (F.shape === 'crane') { ctx.beginPath(); ctx.moveTo(-20, -2); ctx.lineTo(12, 0); ctx.stroke(); }
  else { const nw = polys[2][1], nx = nw[0], tx = nw[2], ty = nw[3]; ctx.beginPath(); ctx.moveTo(nx - 4, -0.5); ctx.lineTo(tx * 0.8, ty * 0.45); ctx.moveTo(nx - 8, 1); ctx.lineTo(tx * 0.62, 1.5); ctx.stroke(); }
  if (F.id === 'news') { ctx.strokeStyle = 'rgba(60,60,60,0.5)'; ctx.lineWidth = 1.2; ctx.beginPath(); for (let k = 0; k < 3; k++) { ctx.moveTo(-14 + k * 6, -6 + k * 2); ctx.lineTo(8 + k * 4, -2 + k); } ctx.stroke(); }
  if (F.id === 'dart') { ctx.strokeStyle = '#e8402e'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(-20, -6); ctx.lineTo(-8, -4); ctx.stroke(); }
  ctx.globalAlpha = 1;
  // doodled face near the nose
  const mood = o.mood || 'calm', ex = F.shape === 'crane' ? 26 : 12, ey = F.shape === 'crane' ? -14 : 1;
  ctx.fillStyle = INK; ctx.strokeStyle = INK; ctx.lineWidth = 1.8;
  if (mood === 'dizzy') { for (const d of [0, 7]) { ctx.beginPath(); ctx.moveTo(ex + d - 2.5, ey - 2.5); ctx.lineTo(ex + d + 2.5, ey + 2.5); ctx.moveTo(ex + d + 2.5, ey - 2.5); ctx.lineTo(ex + d - 2.5, ey + 2.5); ctx.stroke(); } }
  else if (mood === 'happy') { for (const d of [0, 7]) { ctx.beginPath(); ctx.arc(ex + d, ey + 1, 2.4, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke(); } }
  else if (mood === 'scared') { for (const d of [0, 7]) { ctx.beginPath(); ctx.arc(ex + d, ey, 2.8, 0, TAU); ctx.fillStyle = '#fff'; ctx.fill(); ctx.stroke(); ctx.fillStyle = INK; ctx.fillRect(ex + d - 0.8, ey - 0.8, 1.6, 1.6); } }
  else if (mood === 'blink') { ctx.fillRect(ex - 2, ey, 4, 1.6); ctx.fillRect(ex + 5, ey, 4, 1.6); }
  else { for (const d of [0, 7]) { ctx.beginPath(); ctx.ellipse(ex + d, ey, 1.8, 2.5, 0, 0, TAU); ctx.fill(); } }
  ctx.fillStyle = 'rgba(255,120,140,0.45)'; ctx.beginPath(); ctx.ellipse(ex + 3, ey + 5, 3, 1.6, 0, 0, TAU); ctx.fill();
  ctx.restore();
}

/* ----- world renderer ----- */
function drawGround(ctx, R) {
  ctx.fillStyle = 'rgba(70,50,100,0.14)'; ctx.fillRect(R.x0, GROUND - 6, R.x1 - R.x0, 6);
  ctx.fillStyle = '#d9cbb3'; ctx.fillRect(R.x0, GROUND, R.x1 - R.x0, R.y1 - GROUND + 20);
  ctx.fillStyle = '#c4b495'; ctx.fillRect(R.x0, GROUND, R.x1 - R.x0, 8);
  ctx.fillStyle = '#fff6e6'; const s0 = Math.floor(R.x0 / 80) * 80; for (let x = s0; x < R.x1; x += 80) ctx.fillRect(x, GROUND + 34, 40, 6);
}
function drawWorld(ctx, s, a) {
  const R = K.camera.rect, t = K.time;
  for (const g of s.gusts) if (g.x < R.x1 && g.x + g.w > R.x0) drawGust(ctx, g, t, R);
  for (const rn of s.rains) if (rn.x < R.x1 && rn.x + rn.w > R.x0) drawRain(ctx, rn, t);
  for (const c of s.cranes) if (c.jib0 < R.x1 && c.jib1 > R.x0) drawCrane(ctx, c);
  for (const b of s.blds) if (b.x < R.x1 && b.x + b.w + 14 > R.x0) drawBuilding(ctx, b, R);
  for (const v of s.vents) if (Math.abs(v.x - (R.x0 + R.x1) / 2) < (R.x1 - R.x0) / 2 + 60) drawVent(ctx, v, t);
  drawGround(ctx, R);
  if (SAVE.best > 0) {
    const bx = SAVE.best * PXM;
    if (bx > R.x0 - 60 && bx < R.x1 + 60) {
      ctx.setLineDash([12, 12]); ctx.strokeStyle = 'rgba(232,64,46,0.55)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(bx, CEIL - 20); ctx.lineTo(bx, GROUND); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = '#e8402e'; ctx.beginPath(); ctx.moveTo(bx, CEIL - 10); ctx.lineTo(bx + 84, CEIL - 10); ctx.lineTo(bx + 72, CEIL + 8); ctx.lineTo(bx + 84, CEIL + 26); ctx.lineTo(bx, CEIL + 26); ctx.fill();
      K.draw.text('BEST', bx + 36, CEIL + 8, { size: 20, sw: 4, shadow: false });
    }
  }
  for (const st of s.stars) {
    if (st.taken || st.x < R.x0 - 30 || st.x > R.x1 + 30) continue;
    const sx = 0.35 + 0.65 * Math.abs(Math.cos(t * 2.5 + st.x * 0.01));
    K.draw.drawSprite(starSprite(st.big), st.x, st.y + Math.sin(t * 2 + st.x * 0.02) * 4, { sx, sy: 1 });
  }
  for (const b of s.birds) if (b.x > R.x0 - 40 && b.x < R.x1 + 40) drawBird(ctx, b, M.lerp(b.px || b.x, b.x, a), M.lerp(b.py, b.y, a));
}

/* ----- small UI helpers ----- */
function backBtn(to = 'title') { return K.ui.button({ icon: 'arrowL', color: 'gray', w: 96, h: 96, key: 'back', popIn: 0.05, place: v => ({ x: 70 + v.safe.left, y: 66 + v.safe.top }), onTap: () => K.scenes.go(to) }); }
function starPill(x, y, n, size = 32, minW = 180) {
  const w = K.draw.pill(x, y, String(n), { size, minW });
  K.draw.drawSprite(starSprite(false), x - w / 2 + size * 0.75, y, { scale: size / 30 });
  return w;
}
function wallet() { return K.meta.wallet.get('stars'); }
function nextFold() { let b = null; for (const f of FOLDS) if (!foldOwned(f) && (!b || f.cost < b.cost)) b = f; return b; }
function dimBackdrop(ctx) { const v = K.view; paperBackdrop(ctx, K.time); ctx.fillStyle = 'rgba(60,50,90,0.35)'; ctx.fillRect(-v.ox, -v.oy, v.fullW, v.fullH); }

K.scenes.add('title', {
  music: 'papermenu',
  enter() {
    this.logo = { s: 0 }; K.tween(this.logo, { s: 1 }, 0.8, K.Ease.outBack);

    if (!st.available) { K.ui.toast('Next gift tomorrow!', { icon: 'lock' }); K.audio.play('error'); return; }
    if (this.claiming) return;
    this.claiming = true;
    const day = Math.min(st.streak, 7), reward = DAILY[day - 1];
    const i = await K.ui.dialog({ title: 'DAILY GIFT', color: 'mint', icon: 'gem', text: 'Day ' + st.streak + ' streak! Come back tomorrow for more.', extraH: 130,
      draw: (ctx, x, y) => {
        for (let d = 0; d < 7; d++) {
          const cx = x - 225 + d * 75, cy = y + 62, on = d < day, cur = d === day - 1;
          K.draw.rr(cx - 32, cy - 40, 64, 84, 14); ctx.fillStyle = cur ? '#fff2c4' : on ? '#e2f1ea' : '#f1f1f1'; ctx.fill(); ctx.lineWidth = cur ? 5 : 3; ctx.strokeStyle = cur ? '#d9a520' : '#bdbdbd'; ctx.stroke();
          K.draw.label('D' + (d + 1), cx, cy - 24, { size: 18, color: '#6e6e6e' });

    this.claiming = false;

    K.meta.daily.claim(); K.meta.wallet.add('stars', reward); K.save.commit();
    this.dailyBtn.badge = null;
    K.audio.play('bigstar'); K.haptic('success');
    K.fx.burst(K.view.w / 2, K.view.h / 2, { screen: true, shape: 'star', colors: ['#ffd96a', '#ffc94a', '#ffffff'], count: 40, speed: [300, 800] });
    K.ui.toast('+' + reward + ' stars', { icon: 'star' });
  },
  backdrop(ctx) { paperBackdrop(ctx, K.time); },
  render(ctx) {
    const v = K.view, R = { x0: -v.ox - 20, x1: v.w + v.ox + 20, y0: -v.oy, y1: v.h + v.oy };
    for (let i = 0; i < 9; i++) { const w = 120 + hh(i, 5, 5) * 110, x = -v.ox + i * (v.fullW / 8) - 40; drawBuilding(ctx, { id: 300 + i, x, w, top: 560 + hh(i, 6, 6) * 70, col: i % 6 }, R); }
    drawGround(ctx, R);
    // the hero swooping in loops on the right
    const t = K.time, cx = v.w * 0.72, cy = v.h * 0.4;
    const x = cx + Math.sin(t * 0.8) * 150, y = cy + Math.sin(t * 1.6) * 60;
    const dx = Math.cos(t * 0.8) * 150 * 0.8, dy = Math.cos(t * 1.6) * 60 * 1.6;
    ctx.strokeStyle = 'rgba(80,90,120,0.35)'; ctx.lineWidth = 3; ctx.setLineDash([8, 10]); ctx.beginPath();
    for (let k = 1; k < 26; k++) { const tt = t - k * 0.05; const px = cx + Math.sin(tt * 0.8) * 150 - k * 6, py = cy + Math.sin(tt * 1.6) * 60; k === 1 ? ctx.moveTo(px, py) : ctx.lineTo(px, py); }
    ctx.stroke(); ctx.setLineDash([]);
    drawPlane(ctx, x, y, Math.atan2(dy, Math.abs(dx) + 120) * 0.8, this.fold, { scale: 2.6, t, mood: (t % 3.4) < 0.15 ? 'blink' : 'happy' });
    K.draw.text(this.fold.name.toUpperCase(), cx, cy + 125, { size: 28, sw: 5, color: '#ffffff' });
  },
  hud(ctx) {
    const v = K.view, L = Math.max(330, v.w * 0.3);
    ctx.save(); ctx.translate(L, v.h * 0.29 + Math.sin(K.time * 1.4) * 6); ctx.scale(this.logo.s * 0.95, this.logo.s * 0.95); ctx.rotate(-0.05);
    K.draw.text('PAPER', 0, -64, { size: 130, color: '#ffffff', sw: 14 });
    K.draw.text('PLANE', 20, 64, { size: 140, color: '#7fd0f2', sw: 16 });
    ctx.restore();
    starPill(150 + v.safe.left, 62 + v.safe.top, K.fmt(wallet()), 32, 190);
    if (SAVE.best > 0) K.draw.pill(380 + v.safe.left, 62 + v.safe.top, 'BEST ' + SAVE.best + ' m', { icon: 'trophy', size: 30, minW: 230 });
  },
});

const banked = new WeakMap();
K.scenes.add('play', {
  gameplay: true, pausable: true, music: 'chill', touch: null,
  enter(p) {
    if (p.resume) { this.s = p.resume; Sim.revive(this.s); }
    else { this.fold = currentFold(); this.s = Sim.create((Math.random() * 2 ** 31) | 0, this.fold); SAVE.runs++; K.save.commit(); }
    this.fold = this.s.fold;
    this.cam = { x: 0, y: 400, px: 0, py: 400 };
    this.placeCam();
    K.camera.follow(this.cam, { lerp: 10000, snap: true });
    this.trail = []; this.trailT = 0; this.tAnim = 0; this.hint = null; this.hintT = 0;
    this.distPop = { s: 1 }; this.starPop = { s: 1 }; this.tilt = { a: 0 }; this.wasHeld = false; this.starT = 0; this.starP = 1;
    K.ui.pauseButton();
    K.audio.play('whoosh');
    for (const e of this.s.events) this.present(e);
    this.s.events.length = 0;
  },
  layout() { if (this.s) { this.placeCam(); this.cam.px = this.cam.x; } },
  onQuit() { K.scenes.go('title'); },
  placeCam() { this.cam.x = this.s.p.x + K.view.w * 0.2; },
  update(dt) {
    const s = this.s, p = s.p, I = K.input;
    const held = I.down('action') || I.down('up') || K.input.pointer.down;
    if (held && !this.wasHeld && !p.dead) { K.audio.play('lift'); }
    this.wasHeld = held;
    const ts = this.hint === 'hold' ? 0.3 : 1;
    this.cam.px = this.cam.x;
    Sim.step(s, dt * ts, { held });
    this.placeCam();
    this.tAnim += dt * ts;
    for (const e of s.events) this.present(e);
    s.events.length = 0;
    // hints
    const H = SAVE.hint;
    let h = null;
    if (!p.dead && !H.hold) h = 'hold';
    else if (!p.dead && !H.vent) { for (const v of s.vents) if (v.x > p.x && v.x - p.x < 600) { h = 'vent'; this.hintV = v; break; } }
    if (!H.hold && p.held > 0.25) { H.hold = 1; K.save.later(); }
    if (h !== this.hint) { this.hint = h; this.hintT = 0; }
    // pencil trail
    if ((this.trailT -= dt) <= 0) { this.trailT = 0.03; this.trail.push(p.x - 20, p.y + 2); if (this.trail.length > 60) this.trail.splice(0, 2); }
    if (p.wet > 0 && !this.fold.rainproof && Math.random() < 0.3) K.fx.burst(p.x - 6, p.y + 6, { count: 1, colors: ['#7fb2e6'], speed: [20, 60], angle: Math.PI / 2, spread: 0.6, size: [3, 5], gravity: 900, outline: false });
    if (this.fold.id === 'jet' && Math.random() < 0.4) K.fx.trail(p.x - 26, p.y, { colors: ['#fff3b8', '#ffd96a'], shape: 'star', size: [3, 6] });
  },
  present(e) {
    const v = K.view, s = this.s;
    switch (e.type) {
      case 'star': {
        const now = K.time; this.starP = now - this.starT < 0.5 ? Math.min(1.7, this.starP + 0.07) : 1; this.starT = now;
        if (e.v > 1) { K.audio.play('bigstar'); K.fx.text(e.x, e.y - 30, '+' + e.v, { size: 48, color: '#ffc94a' }); K.fx.ring(e.x, e.y, { r0: 10, r1: 80, color: '#ffd96a', width: 8 }); K.haptic('medium'); }
        else K.audio.play('star', this.starP);
        K.fx.burst(e.x, e.y, { shape: 'star', colors: ['#ffd96a', '#ffffff', '#ffc94a'], count: e.v > 1 ? 16 : 6, speed: [80, 280], size: [4, 8], gravity: 0, life: [0.3, 0.5], outline: false });
        K.tween.killOf(this.starPop); this.starPop.s = 1.3; K.tween(this.starPop, { s: 1 }, 0.35, K.Ease.outElastic);
        break;
      }
      case 'updraft':
        K.audio.play('updraft'); K.haptic('light');
        K.fx.ring(e.x, e.y, { r0: 10, r1: 70, color: '#ffffff', width: 6 });
        K.fx.text(e.x, e.y - 50, 'UPDRAFT!', { size: 36, color: '#ffffff' });
        if (!SAVE.hint.vent) { SAVE.hint.vent = 1; K.save.later(); }
        break;
      case 'gust':
        K.audio.play('gust'); K.fx.shake(4, 0.25);
        K.fx.text(e.x + 40, e.y + (e.f > 0 ? -50 : 50), e.f > 0 ? 'DOWNDRAFT!' : 'TAILWIND!', { size: 32, color: e.f > 0 ? '#d9e2ff' : '#ffffff' });
        break;
      case 'rain':
        K.audio.play('rain');
        K.fx.text(e.x + 40, e.y - 50, e.proof ? 'RAINPROOF!' : 'SOGGY! heavier', { size: 30, color: '#cfe3ff' });
        break;
      case 'mile':
        K.audio.play('chime');
        K.tween.killOf(this.distPop); this.distPop.s = 1.45; K.tween(this.distPop, { s: 1 }, 0.5, K.Ease.outElastic);
        K.fx.burst(v.w / 2, 60 + v.safe.top, { screen: true, shape: 'star', colors: ['#ffd96a', '#ffffff', '#7fd0f2'], count: 16, speed: [150, 400], size: [5, 10], gravity: 400 });
        break;
      case 'skid':
        K.audio.play('crumple'); K.haptic('medium'); K.fx.shake(7, 0.2);
        K.fx.burst(e.x, e.y - 4, { shape: 'square', colors: [this.fold.paper, this.fold.shade], count: 10, speed: [100, 300], angle: -Math.PI / 2, spread: 2, size: [4, 7], gravity: 600 });
        K.fx.text(e.x, e.y - 70, e.left === 1 ? 'SCUFF! last one!' : 'SCUFF!', { size: 36, color: e.left === 1 ? '#ff9f80' : '#ffffff' });
        break;
      case 'crash':
        K.audio.play('crumple'); K.haptic('heavy'); K.fx.shake(14, 0.35); K.fx.hitstop(0.1);
        K.fx.burst(e.x, e.y, { shape: 'square', colors: [this.fold.paper, this.fold.shade, '#ffffff'], count: 22, speed: [150, 500], size: [5, 10], gravity: 700 });
        K.fx.text(e.x, e.y - 60, e.cause === 'bird' ? 'TWEET!' : e.cause === 'crane' ? 'CLANG!' : 'CRUMPLE!', { size: 56, color: '#ff9f80' });
        break;
      case 'revive':
        K.audio.play('power'); K.fx.flash('#ffffff', 0.5); K.fx.ring(e.x, e.y, { r0: 20, r1: 160, color: '#7fd0f2', width: 10 });
        K.fx.text(e.x, e.y - 90, 'REFOLDED!', { size: 50, color: '#ffffff' });
        break;
      case 'over':
        K.audio.play('lose');
        K.scenes.go('over', { s, cam: { x: this.cam.x, y: this.cam.y } });
        break;
    }
  },
  backdrop(ctx) { paperBackdrop(ctx, this.tAnim); },
  render(ctx, a) {
    const s = this.s, p = s.p;
    drawWorld(ctx, s, a);
    // pencil trail
    const tr = this.trail;
    if (tr.length > 4) {
      ctx.strokeStyle = 'rgba(80,90,120,0.4)'; ctx.lineWidth = 3; ctx.setLineDash([8, 9]); ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(tr[0], tr[1]); for (let i = 2; i < tr.length; i += 2) ctx.lineTo(tr[i], tr[i + 1]); ctx.stroke(); ctx.setLineDash([]);
    }
    const x = M.lerp(p.px, p.x, a), y = M.lerp(p.py, p.y, a);
    const ang = p.dead ? p.deadT * 9 : Math.atan2(p.vy, s.spd) * 0.85;
    let near = false;
    if (!p.dead) { for (const b of s.blds) if (b.x - x < 140 && b.x + b.w > x && b.top - y < 46 && b.top - y > -10) near = true; for (const b of s.birds) if (Math.abs(b.x - x) < 120 && Math.abs(b.y - y) < 60) near = true; }
    const mood = p.dead ? 'dizzy' : near ? 'scared' : (K.time - this.starT < 0.6) ? 'happy' : (K.time % 3.1) < 0.12 ? 'blink' : 'calm';
    const alpha = p.inv > 0 && Math.floor(K.time * 12) % 2 ? 0.4 : 1;
    ctx.save(); ctx.globalAlpha = alpha;
    drawPlane(ctx, x, y, ang, this.fold, { scale: 1.7, t: this.tAnim, mood, wet: p.wet > 0 && !this.fold.rainproof });
    ctx.restore();
  },
  hud(ctx) {
    const v = K.view, s = this.s, st = v.safe.top, sl = v.safe.left;
    ctx.save(); ctx.translate(v.w / 2, 58 + st); ctx.scale(this.distPop.s, this.distPop.s);
    K.draw.text(s.dist + ' m', 0, 0, { size: 60, color: '#ffffff' }); ctx.restore();
    if (SAVE.best > 0) {
      const k = M.clamp(s.dist / SAVE.best, 0, 1);
      K.draw.bar(v.w / 2, 108 + st, 240, 22, k, s.dist > SAVE.best ? 'yellow' : 'sky');
      K.draw.text(s.dist > SAVE.best ? 'NEW BEST!' : 'BEST ' + SAVE.best + ' m', v.w / 2, 138 + st, { size: 20, sw: 4, color: s.dist > SAVE.best ? '#ffd96a' : '#ffffff' });
    }
    ctx.save(); ctx.translate(120 + sl, 56 + st); ctx.scale(this.starPop.s, this.starPop.s); starPill(0, 0, s.starsGot, 32, 170); ctx.restore();
    for (let i = 0; i < 3; i++) { ctx.save(); ctx.globalAlpha = i < 3 - s.p.scuffs ? 1 : 0.25; drawPlane(ctx, 62 + sl + i * 52, 116 + st, -0.1, this.fold, { scale: 0.6, shadow: false, mood: i < 3 - s.p.scuffs ? 'calm' : 'dizzy' }); ctx.restore(); }
    if (s.p.wet > 0 && !this.fold.rainproof) K.draw.text('SOGGY ' + s.p.wet.toFixed(1) + 's', 120 + sl, 158 + st, { size: 24, sw: 4, color: '#cfe3ff' });
    if (this.hint) this.drawHint(ctx);
  },
  drawHint(ctx) {
    const v = K.view, s = this.s, p = s.p, touch = K.input.touch;
    this.hintT += 1 / 60;
    ctx.save(); ctx.globalAlpha = Math.min(1, this.hintT * 3);
    if (this.hint === 'hold') {
      const sp = K.camera.toScreen(p.x, p.y), px = M.clamp(sp.x + 200, 220, v.w - 200), py = M.clamp(sp.y + 40, 200, v.h - 160);
      const press = (K.time * 1.2) % 1 < 0.6;
      ctx.beginPath(); ctx.arc(px, py + (press ? 6 : 0), press ? 26 : 30, 0, TAU); ctx.fillStyle = 'rgba(255,255,255,0.9)'; ctx.fill(); ctx.lineWidth = 5; ctx.strokeStyle = INK; ctx.stroke();
      if (press) { const k = ((K.time * 1.2) % 1) / 0.6; ctx.beginPath(); ctx.arc(px, py + 6, 30 + k * 30, 0, TAU); ctx.globalAlpha *= 1 - k; ctx.lineWidth = 4; ctx.strokeStyle = '#ffffff'; ctx.stroke(); ctx.globalAlpha = Math.min(1, this.hintT * 3); }
      K.draw.text(touch ? 'HOLD TO CLIMB' : 'HOLD SPACE TO CLIMB', px, py - 70, { size: 44, color: '#ffffff' });
      K.draw.text('let go to glide', px, py + 70, { size: 26, sw: 5 });
      K.draw.arrow(sp.x, sp.y - 30, sp.x, sp.y - 110, '#ffffff', 10);
    } else if (this.hint === 'vent' && this.hintV) {
      const sp = K.camera.toScreen(this.hintV.x, this.hintV.top - 200), k = Math.sin(K.time * 6) * 8;
      K.draw.text('RIDE THE UPDRAFT!', sp.x, sp.y - 150 + k, { size: 34, color: '#ffffff', maxW: 420 });
      K.draw.arrow(sp.x, sp.y - 120 + k, sp.x, sp.y - 40 + k, '#ffffff', 10);
    }
    ctx.restore();
  },
});

K.scenes.add('over', {
  music: 'papermenu',
  enter(p) {
    const v = K.view, s = this.s = p.s;
    K.camera.moveTo(p.cam.x, p.cam.y);
    this.fold = s.fold;
    const dist = s.dist, prev = SAVE.best;
    this.newBest = dist > prev;
    if (this.newBest) SAVE.best = dist;
    const earned = s.starsGot - (banked.get(s) || 0); banked.set(s, s.starsGot);
    if (earned > 0) { K.meta.wallet.add('stars', earned); SAVE.starsTotal += earned; }
    K.save.commit();
    K.sdk.send('score', { value: dist });
    if (prev <= 0) this.line = 'Your first flight — lovely!';
    else if (this.newBest) this.line = (dist - prev) + ' m past your old best!';
    else if (dist === prev) this.line = 'Exactly your best — so close!';
    else this.line = (prev - dist <= Math.max(40, prev * 0.25) ? 'Only ' + (prev - dist) + ' m from your best!' : (prev - dist) + ' m to beat your best');
    const nf = nextFold(), w = wallet();
    this.line2 = nf ? (w >= nf.cost ? 'You can fold the ' + nf.name + ' now!' : (nf.cost - w) + ' more stars for the ' + nf.name) : 'Every fold unlocked!';
    this.title = s.p.cause === 'creased' ? 'TOO CREASED!' : s.p.cause === 'bird' ? 'BIRD STRIKE!' : s.p.cause === 'crane' ? 'CLANG!' : s.p.cause === 'ground' ? 'TOUCHDOWN!' : 'CRUMPLED!';
    this.shown = { d: 0, c: 0 }; this.pan = { s: 0 };
    K.tween(this.shown, { d: dist, c: s.starsGot }, 1.0, K.Ease.outCubic, 0.3);
    K.tween(this.pan, { s: 1 }, 0.5, K.Ease.outBack);
    if (this.newBest) K.wait(1.0).then(() => {
      if (K.scenes.current !== this) return;
      K.audio.play('win'); K.haptic('success');
      K.fx.burst(v.w / 2, v.h * 0.36, { screen: true, shape: 'star', colors: ['#ffd96a', '#7fd0f2', '#ffffff', '#ff9f80'], count: 46, speed: [300, 900], size: [8, 16] });
    });
    const by = v => Math.min(v.h - 80 - v.safe.bottom, v.h * 0.45 + 300);
    K.ui.button({ icon: 'home', color: 'gray', w: 110, h: 110, popIn: 0.35, place: v => ({ x: v.w / 2 - 300, y: by(v) }), onTap: () => K.scenes.go('title') });
    K.ui.button({ label: 'FLY AGAIN', icon: 'retry', color: 'sky', w: 320, h: 116, key: 'action', pulse: true, popIn: 0.45, place: v => ({ x: v.w / 2 - 40, y: by(v) }), onTap: () => K.scenes.go('play') });
    if (!s.continued) {
      const cont = K.ui.button({ label: 'REFOLD', icon: 'video', color: 'peach', w: 240, h: 116, popIn: 0.55, sub: 'watch ad', place: v => ({ x: v.w / 2 + 260, y: by(v) }),
        onTap: async () => {
          cont.enabled = false;
          const r = await K.adBreak('rewarded');
          if (r.granted && K.scenes.current === this) { K.audio.play('coin'); K.scenes.go('play', { resume: s }); }
          else cont.label = 'NO AD';
        } });
    }
  },
  backdrop(ctx) { paperBackdrop(ctx, K.time); },
  render(ctx) {
    drawWorld(ctx, this.s, 1);
    const R = K.camera.rect;
    ctx.fillStyle = 'rgba(60,50,90,0.35)'; ctx.fillRect(R.x0, R.y0, R.x1 - R.x0, R.y1 - R.y0);
  },
  hud(ctx) {
    const v = K.view, cy = v.h * 0.4;
    ctx.save(); ctx.translate(v.w / 2, cy); ctx.scale(this.pan.s, this.pan.s);
    K.draw.panel(0, 0, 660, 440, { title: this.title, color: 'sky' });
    drawPlane(ctx, -230, 10 + Math.sin(K.time * 2) * 8, -0.15 + Math.sin(K.time * 1.3) * 0.08, this.fold, { scale: 2.1, t: K.time, mood: this.newBest ? 'happy' : 'dizzy', shadow: false });
    K.draw.label('DISTANCE', 50, -140, { size: 28, color: '#8a8a8a' });
    K.draw.text(Math.round(this.shown.d) + ' m', 50, -80, { size: 92, color: '#7fd0f2' });
    if (this.newBest) {
      ctx.save(); ctx.translate(50, -2); ctx.rotate(Math.sin(K.time * 4) * 0.05);
      K.draw.text('NEW BEST!', 0, 0, { size: 50, color: '#ffd96a' }); ctx.restore();
    } else K.draw.pill(50, -2, 'BEST ' + SAVE.best + ' m', { icon: 'trophy', size: 30 });
    K.draw.label(this.line, 50, 56, { size: 28, maxW: 410, color: this.newBest ? '#2f8a68' : '#c4644a' });
    starPill(50, 116, '+' + Math.round(this.shown.c), 30, 150);
    K.draw.label(this.line2, 0, 178, { size: 23, color: '#6e6e6e', maxW: 580 });
    ctx.restore();
  },
});

K.scenes.add('hangar', {
  music: 'papermenu',
  enter() {
    backBtn();
    K.ui.list({ items: FOLDS, cols: 4, itemH: 250, gap: 18, frame: false, popIn: 0.1,
      place: v => ({ x: v.w / 2, y: v.h / 2 + 60, w: Math.min(v.w - 80, 1120), h: Math.min(v.h - 160, 540) }),
      drawItem(ctx, f, i, x, y, w, h) {
        const own = foldOwned(f), sel = currentFold().id === f.id;
        K.draw.card(x, y, w, h, { selected: sel, outline: sel ? 9 : 5, fill: sel ? '#f2fbff' : undefined });
        ctx.save(); K.draw.rr(x + 8, y + 8, w - 16, 110, 18); ctx.clip();
        const g = ctx.createLinearGradient(0, y, 0, y + 118); g.addColorStop(0, '#bfe3f2'); g.addColorStop(1, '#fde7d3'); ctx.fillStyle = g; ctx.fillRect(x, y, w, 120);
        if (!own) ctx.globalAlpha = 0.5;
        drawPlane(ctx, x + w / 2, y + 62 + Math.sin(K.time * 2 + i) * 5, -0.12 + Math.sin(K.time * 1.5 + i) * 0.06, f, { scale: 1.6, t: K.time + i, mood: own ? 'happy' : 'blink' });
        ctx.globalAlpha = 1; ctx.restore();
        K.draw.label(f.name, x + w / 2, y + 140, { size: 28, maxW: w - 20 });
        K.draw.label(f.desc, x + w / 2, y + 166, { size: 17, color: '#6e6e6e', maxW: w - 16 });
        const stats = [['SPD', (f.speed - 230) / 150], ['FLOAT', 1 - (f.grav - 260) / 620], ['CLIMB', (f.up - 230) / 260]];
        stats.forEach(([lb, k], j) => {
          const sy = y + 186 + j * 16;
          K.draw.label(lb, x + 40, sy, { size: 13, color: '#8a8a8a' });
          K.draw.rr(x + 70, sy - 5, w - 90, 10, 5); ctx.fillStyle = '#ececec'; ctx.fill();
          K.draw.rr(x + 70, sy - 5, Math.max(10, (w - 90) * M.clamp(k, 0.06, 1)), 10, 5); ctx.fillStyle = ['#ff9f80', '#7fd0f2', '#5cc7a0'][j]; ctx.fill();
        });
        if (sel) K.draw.label('FLYING', x + w / 2, y + h - 14, { size: 18, color: '#2f8a68' });
        else if (own) K.draw.label('tap to fly', x + w / 2, y + h - 14, { size: 18, color: '#6e6e6e' });
        else { K.draw.drawSprite(starSprite(false), x + w / 2 - 34, y + h - 15, { scale: 0.7 }); K.draw.label(String(f.cost), x + w / 2 + 10, y + h - 14, { size: 20, color: wallet() >= f.cost ? '#2a8a3a' : '#c4644a' }); }
      },
      onItem: async f => {
        if (foldOwned(f)) { K.meta.unlocks.select('fold', f.id); K.save.commit(); K.audio.play('swap'); K.ui.toast(f.name + ' ready to fly', { icon: 'check' }); return; }
        if (wallet() < f.cost) { K.audio.play('error'); K.haptic('fail'); K.ui.toast('Need ' + (f.cost - wallet()) + ' more stars', { icon: 'star' }); return; }
        const i = await K.ui.dialog({ title: 'NEW FOLD?', color: 'sky', text: 'Fold the ' + f.name + ' for ' + f.cost + ' stars?', buttons: [{ label: 'NO', color: 'gray' }, { label: 'FOLD IT', icon: 'check', color: 'sky', key: 'action' }] });
        if (i === 1 && K.meta.wallet.spend('stars', f.cost)) {
          K.meta.unlocks.grant('fold:' + f.id); K.meta.unlocks.select('fold', f.id); K.save.commit();
          K.audio.play('levelup'); K.haptic('success'); K.ui.toast(f.name + ' folded!', { icon: 'star' });
          K.fx.burst(K.view.w / 2, K.view.h / 2, { screen: true, shape: 'star', colors: [f.paper, f.shade, f.crease, '#ffd96a'], count: 40, speed: [300, 800] });
        }
      } });
  },
  backdrop: dimBackdrop,
  hud() { const v = K.view; K.draw.text('FOLDS', v.w / 2, 66 + v.safe.top, { size: 64, color: '#ffffff' }); starPill(v.w - 140 - v.safe.right, 66 + v.safe.top, K.fmt(wallet()), 32, 200); },
});

/* Title card (tools/cards.py renders ?card to thumb.jpg): full-bleed key art, no buttons. */
K.scenes.add('card', {
  music: null,
  backdrop(ctx) { K.camera.moveTo(K.view.w / 2, K.view.h / 2); paperBackdrop(ctx, 0); },
  render(ctx) {
    const v = K.view, R = { x0: -v.ox - 20, x1: v.w + v.ox + 20, y0: -v.oy - 300, y1: v.h + v.oy };
    ctx.save(); ctx.translate(0, 180);
    drawCrane(ctx, { x: 1120, top: 250, jib0: 900, jib1: 1220, hookX: 950, hookBot: 470 });
    const B = [[-80, 170, 520, 0], [100, 150, 450, 3], [270, 190, 560, 1], [600, 160, 470, 5], [790, 200, 410, 2], [1010, 150, 540, 4], [1170, 180, 480, 0]];
    B.forEach(([x, w, top, col], i) => drawBuilding(ctx, { id: 50 + i, x, w, top, col, vent: i === 3 }, R));
    drawVent(ctx, { x: 680, w: 90, top: 470, h: 470 }, 0.6);
    drawGround(ctx, { x0: R.x0, x1: R.x1, y1: v.h + v.oy });
    ctx.restore();
    for (const [bx, by, ph] of [[990, 530, 0.4], [1170, 395, 1.5]]) { ctx.save(); ctx.translate(bx, by); ctx.scale(1.9, 1.9); drawBird(ctx, { ph }, 0, 0); ctx.restore(); }
    for (let i = 0; i < 6; i++) { const k = i / 5; K.draw.drawSprite(starSprite(i === 5), 690 + k * 300, 560 - Math.sin(k * Math.PI * 0.8) * 150, { scale: i === 5 ? 1.5 : 1.35 }); }
    // pencil trail swooping up from below
    ctx.strokeStyle = 'rgba(70,80,120,0.55)'; ctx.lineWidth = 7; ctx.setLineDash([18, 16]); ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-v.ox - 20, 760); ctx.bezierCurveTo(180, 820, 260, 560, 380, 560); ctx.stroke(); ctx.setLineDash([]);
    ctx.strokeStyle = 'rgba(255,255,255,0.95)'; ctx.lineWidth = 7;
    for (let i = 0; i < 4; i++) { ctx.beginPath(); ctx.moveTo(190 + i * 18, 500 + i * 30); ctx.lineTo(330, 500 + i * 30); ctx.stroke(); }
    for (let i = 0; i < 10; i++) { ctx.save(); ctx.translate(600 + Math.sin(i * 2.1) * 40, 760 - i * 46); ctx.rotate(i); ctx.fillStyle = i % 2 ? '#ffffff' : '#ffe2a0'; ctx.fillRect(-7, -4, 14, 8); ctx.restore(); }
    K.draw.glow(470, 520, 330, '#fff3d0', 0.85);
    drawPlane(ctx, 500, 520, -0.34, FOLDS[0], { scale: 4.8, t: 0, mood: 'happy' });
  },
  hud(ctx) {
    const v = K.view;
    ctx.save(); ctx.translate(v.w * 0.5, v.h * 0.19); ctx.rotate(-0.06);
    K.draw.text('PAPER', -120, -24, { size: 170, color: '#ffffff', sw: 18 });
    K.draw.text('PLANE', 130, 132, { size: 180, color: '#7fd0f2', sw: 18 });
    ctx.restore();
  },
});

K.boot(/[?&]card\b/.test(location.search) ? 'card' : 'title');
