K.scenes.add('play', {
  gameplay: true, pausable: true, music: 'orbitPlay', touch: null,
  enter(p) {
    if (p.resume) { this.run = p.resume; Sim.revive(this.run.s); award('cont'); }
    else { this.run = { s: Sim.create((Math.random() * 2 ** 31) | 0), banked: 0 }; SAVE.stats.runs++; runCount++; K.save.later(); if (SAVE.stats.runs >= 10) award('runs10'); }
    const s = this.run.s;
    this.skin = skinById(K.meta.unlocks.selected('skin', 'blip'));
    this.cam = { x: 360, y: Sim.pl(s, s.cur).y - K.view.h * 0.21 };
    K.camera.follow(this.cam, { lerp: 5, snap: true });
    this.fxScore = { s: 1 }; this.sq = { x: 1, y: 1 }; this.rot = 0;
    this.win = null; this.winT = 0; this.aim = null; this.dots = [];
    this.deadT = -1; this.galShown = s.galaxy; this.galFx = { t0: -99, g: s.galaxy }; this.galBlend = s.galaxy;
    this.dustStreak = 0; this.dustT = 0;
    K.ui.pauseButton();
    K.audio.play('whoosh');
  },
  onQuit() { this.bank(); K.save.commit(); K.scenes.go('title'); },
  bank() { const s = this.run.s, n = s.dustRun - this.run.banked; if (n > 0) { K.meta.wallet.add('dust', n); this.run.banked = s.dustRun; } },
  update(dt) {
    const s = this.run.s, ptr = K.input.pointer;
    const tap = ptr.pressed || K.input.pressed('action') || K.input.pressed('up');
    Sim.step(s, dt, { tap });
    for (const e of s.events) this.present(e);
    s.events.length = 0;
    if (this.deadT >= 0) { this.deadT += dt; if (this.deadT > 1.15) { this.deadT = -99; this.bank(); K.scenes.go('over', { run: this.run }); } }
  },
  present(e) {
    const s = this.run.s, v = K.view, sk = this.skin;
    switch (e.type) {
      case 'jump':
        K.audio.play('hop'); K.haptic('light');
        K.fx.burst(e.x, e.y, { count: 10, colors: [sk.trail, '#ffffff'], speed: [80, 260], angle: Math.atan2(-e.vy, -e.vx), spread: 1.4, gravity: 0, size: [4, 9], outline: false });
        K.tween.killOf(this.sq); this.sq.x = 0.72; this.sq.y = 1.35; K.tween(this.sq, { x: 1, y: 1 }, 0.5, K.Ease.outElastic);
        break;
      case 'land': {
        K.tween.killOf(this.sq); this.sq.x = 1.3; this.sq.y = 0.74; K.tween(this.sq, { x: 1, y: 1 }, 0.55, K.Ease.outElastic);
        K.fx.ring(e.cx, e.cy, { r0: e.r, r1: e.r + 120, color: e.perfect ? '#ffe600' : '#7ae8ff', width: 12 });
        K.fx.burst(e.x, e.y, { count: 12, colors: [sk.col, sk.trail, '#ffffff'], speed: [120, 380], gravity: 0, size: [4, 10] });
        if (!e.fresh) { K.audio.play('capture', 0.8); break; }
        SAVE.stats.hops++; award('first');
        if (SAVE.tut < 3) SAVE.tut++;
        if (e.perfect) {
          K.audio.play('perfect', e.combo); K.haptic('success'); K.fx.flash('#fff6b0', 0.18); K.fx.hitstop(0.05);
          K.fx.burst(e.cx, e.cy, { shape: 'star', colors: ['#ffe600', '#fff6b0', '#ffffff'], count: 14 + Math.min(e.combo, 10) * 2, speed: [250, 700], size: [8, 15], gravity: 0 });
          K.fx.text(v.w / 2, v.h * 0.36, e.combo > 1 ? 'PERFECT x' + Math.min(e.combo + 1, 8) : 'PERFECT!', { size: 64 + Math.min(e.combo, 6) * 6, color: '#ffe600', screen: true, life: 1.0, rise: 70 });
          SAVE.stats.perfects++; SAVE.stats.dust++; award('perfect');
          if (e.combo >= 5) award('combo5');
          SAVE.stats.bestCombo = Math.max(SAVE.stats.bestCombo, e.combo);
        } else { K.audio.play('capture', 1 + Math.min(s.reached, 40) * 0.01); K.haptic('light'); }
        K.fx.text(e.cx, e.cy - e.r - 50, '+' + e.pts, { size: 46, color: e.perfect ? '#ffe600' : '#ffffff' });
        if (e.skip > 0) K.fx.text(e.cx, e.cy - e.r - 110, 'SKIP!', { size: 52, color: '#22ff88' });
        if (e.bent) award('hole');
        K.tween.killOf(this.fxScore); this.fxScore.s = 1.3; K.tween(this.fxScore, { s: 1 }, 0.4, K.Ease.outElastic);
        if (e.newGal) {
          K.audio.play('levelup'); K.fx.flash(gal(e.g).neb[0], 0.35); this.galFx = { t0: K.time, g: e.g };
          K.tween(this, { galBlend: e.g }, 2.2, K.Ease.inOutCubic);
          if (e.g > SAVE.maxGalaxy) SAVE.maxGalaxy = e.g;
          award('gal2');
        }
        if (s.reached > SAVE.bestPlanet) SAVE.bestPlanet = s.reached;
        if (s.reached >= 25) award('p25');
        if (s.reached >= 60) award('p60');
        if (s.score >= 1000) award('score1k');
        checkMilestones(s);
        K.save.later();
        break;
      }
      case 'dust': {
        this.dustStreak = this.dustT > 0 ? this.dustStreak + 1 : 0; this.dustT = 0.6;
        K.audio.play('dust', 1 + Math.min(this.dustStreak, 8) * 0.08);
        K.fx.burst(e.x, e.y, { shape: 'star', colors: ['#fff6b0', '#ffe600'], count: 8, speed: [120, 320], size: [5, 10], gravity: 0 });
        K.fx.text(e.x, e.y - 20, '+1', { size: 34, color: '#fff6b0', rise: 70, life: 0.6 });
        SAVE.stats.dust++; if (SAVE.stats.dust >= 100) award('dust100');
        break;
      }
      case 'warp':
        K.audio.play('warp'); K.haptic('medium'); K.fx.shake(8, 0.2);
        K.fx.ring(e.x, e.y, { r0: 50, r1: 170, color: '#22ff88', width: 14 });
        K.fx.text(e.x, e.y - 60, 'WARP +15', { size: 44, color: '#22ff88' });
        SAVE.stats.warps++; if (SAVE.stats.warps >= 5) award('warp');
        break;
      case 'belt':
        SAVE.stats.belts++; if (SAVE.stats.belts >= 10) award('belt');
        K.fx.text(s.p.x, s.p.y + 60, 'DODGE!', { size: 36, color: '#c4b5ff', rise: 60, life: 0.6 });
        break;
      case 'dead':
        this.deadT = 0;
        if (e.cause === 'rock') { K.audio.play('explode'); K.fx.shake(24, 0.45); K.fx.hitstop(0.1); K.fx.flash('#ff2e63', 0.4); K.haptic('heavy'); K.fx.burst(e.x, e.y, { shape: 'square', colors: ['#6d5a8f', '#ff2e63', sk.col], count: 26, speed: [250, 750], gravity: 300 }); }
        else if (e.cause === 'hole') { K.audio.play('suck'); K.fx.shake(14, 0.8); K.fx.flash('#b44cff', 0.35); K.haptic('heavy'); }
        else { K.audio.play('lost'); K.fx.shake(6, 0.3); K.haptic('fail'); }
        K.save.later();
        break;
    }
  },
  frame(dt) {
    const s = this.run.s, p = s.p, v = K.view;
    this.dustT -= dt;
    // camera: keep the current planet in the lower third; rise with the critter in flight
    const cur = Sim.pl(s, s.cur);
    let fy = cur.y;
    if (s.mode === 'fly') fy = Math.min(cur.y, p.y + 120);
    if (s.mode !== 'dead') this.cam.y = fy - v.h * 0.21;
    // hero rotation
    const target = s.mode === 'orbit' ? p.ang + Math.PI / 2 : s.mode === 'fly' ? Math.atan2(p.vy, p.vx) + Math.PI / 2 : this.rot + dt * 8;
    this.rot += M.angleDiff(this.rot, target) * Math.min(1, dt * (s.mode === 'orbit' ? 20 : 12));
    if (s.mode === 'fly') {
      K.fx.trail(p.x, p.y, { color: this.skin.trail, size: [7, 12], life: [0.25, 0.45] });
      if (this.skin.shape && Math.random() < 0.4) K.fx.burst(p.x, p.y, { count: 1, shape: this.skin.shape, colors: [this.skin.trail], speed: [10, 60], gravity: 0, size: [5, 9], life: [0.3, 0.5] });
    }
    // trajectory prediction (pure reads)
    this.aimTick = (this.aimTick || 0) + 1;
    if (s.mode !== 'orbit') { this.dots.length = 0; this.aim = null; }
    else if (this.aimTick % 2 === 0 || !this.aim) {
      const k = diffK(s.reached);
      this.dots.length = 0;
      this.aim = Sim.trace(s, p.ang + p.dir * Sim.pl(s, s.cur).w / 60, p.rad, s.t + 1 / 60, 2.6, this.dots, M.lerp(1050, 430, k));
    }
    if (s.mode === 'orbit') {
      this.winT -= dt;
      if (this.winT <= 0 || !this.win || this.win.cur !== s.cur) { this.winT = 0.1; this.win = this.computeWindow(s); }
    }
  },
  computeWindow(s) {
    const p = s.p, pl = Sim.pl(s, s.cur), N = 72, arr = new Uint8Array(N);
    for (let k = 0; k < N; k++) {
      const a = k / N * TAU, da = M.wrap((a - p.ang) * p.dir, TAU), tl = s.t + da / pl.w;
      const r = Sim.trace(s, a, p.radT, tl, 1.8, null, 0);
      arr[k] = r.type === 'land' && r.i > s.cur ? (r.perfect ? 2 : 1) : 0;
    }
    return { cur: s.cur, arr, N };
  },
  backdrop(ctx) { spaceBackdrop(ctx, this.galBlend, K.camera.y); },
  render(ctx, a) {
    const s = this.run.s, t = s.t - (1 - a) / 60, rc = K.camera.rect, p = s.p;
    for (const ho of s.holes) if (ho.y > rc.y0 - 200 && ho.y < rc.y1 + 200) drawHole(ctx, ho, t);
    for (const rg of s.rings) if (rg.y > rc.y0 - 80 && rg.y < rc.y1 + 80) drawRing(ctx, rg, t);
    const ds = dustSprite();
    for (const d of s.dust) if (!d.taken && d.y > rc.y0 - 40 && d.y < rc.y1 + 40) K.draw.drawSprite(ds, d.x, d.y + Math.sin(t * 3 + d.id) * 5, { rot: Math.sin(t * 2 + d.id) * 0.3 });
    const cur = Sim.pl(s, s.cur), tgt = Sim.pl(s, s.cur + 1);
    const inWin = this.aim && this.aim.type === 'land' && this.aim.i > s.cur;
    // planets + rings
    for (const pl of s.planets) {
      if (pl.y < rc.y0 - 250 || pl.y > rc.y1 + 250) continue;
      const x = plX(pl, t);
      if (pl === tgt && s.mode !== 'dead') {
        const R = capR(pl, t), gl = inWin ? (this.aim.perfect ? '#ffe600' : '#22ff88') : null;
        ctx.save();
        if (gl) { ctx.lineWidth = 22; ctx.strokeStyle = gl; ctx.globalAlpha = 0.3; ctx.beginPath(); ctx.arc(x, pl.y, R, 0, TAU); ctx.stroke(); ctx.lineWidth = 9 + 3 * Math.sin(K.time * 20); ctx.globalAlpha = 0.95; }
        else { ctx.setLineDash([10, 14]); ctx.lineDashOffset = K.time * 30; ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(255,255,255,0.35)'; }
        ctx.beginPath(); ctx.arc(x, pl.y, R, 0, TAU); ctx.stroke(); ctx.restore();
        if (gl) K.draw.glow(x, pl.y, R * 1.5, gl, 0.25);
      }
      if (pl === cur && s.mode === 'orbit') {
        ctx.save(); ctx.setLineDash([4, 12]); ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(255,255,255,0.28)';
        ctx.beginPath(); ctx.arc(x, pl.y, orbitR(pl), 0, TAU); ctx.stroke(); ctx.restore();
        if (this.win && this.win.cur === s.cur) this.drawWindow(ctx, x, pl.y, orbitR(pl));
      }
      drawPlanet(ctx, pl, t, x);
    }
    for (const bl of s.belts) if (bl.y > rc.y0 - 80 && bl.y < rc.y1 + 80) {
      const gb = ctx.createLinearGradient(0, bl.y - 60, 0, bl.y + 60); gb.addColorStop(0, 'rgba(160,130,220,0)'); gb.addColorStop(0.5, 'rgba(160,130,220,0.16)'); gb.addColorStop(1, 'rgba(160,130,220,0)');
      ctx.fillStyle = gb; ctx.fillRect(rc.x0, bl.y - 60, rc.x1 - rc.x0, 120);
      ctx.fillStyle = 'rgba(200,180,255,0.35)';
      for (let j = 0; j < 40; j++) { const px = M.wrap(j * 97 + t * 40 * (j % 2 ? 1 : -0.6), 1320) - 300, py = bl.y + ((j * 37) % 70) - 35; ctx.fillRect(px, py, 3 + (j % 3), 3 + (j % 3)); }
    }
    for (const rk of s.rocks) if (rk.y > rc.y0 - 60 && rk.y < rc.y1 + 60) K.draw.drawSprite(rockSprite(rk.v, rk.r), rockX(rk, t), rk.y, { rot: t * rk.spin });
    // predicted path
    if (this.dots.length > 2) {
      const col = inWin ? (this.aim.perfect ? '#ffe600' : '#22ff88') : this.aim && this.aim.type === 'dead' && this.aim.cause !== 'lost' ? '#ff6b8a' : '#ffffff';
      K.draw.dots(this.dots, col, inWin ? 8 : 6);
    }
    // hero
    const x = M.lerp(p.px, p.x, a), y = M.lerp(p.py, p.y, a);
    const dead = s.mode === 'dead';
    let look = null;
    if (tgt && !dead) { const n = M.norm(plX(tgt, t) - x, tgt.y - y), r = M.rotate(n.x, n.y, -this.rot); look = { x: r.x, y: r.y }; }
    const blink = (K.time % 2.7) < 0.1;
    const mood = dead ? (s.cause === 'lost' ? 'sad' : 'dead') : s.mode === 'fly' ? null : blink ? 'blink' : 'happy';
    const sc = dead && s.cause === 'hole' ? Math.max(0.05, 1 - this.deadT * 1.1) : 1;
    drawCritter(this.skin, x, y, 30 * sc, { ctx, rot: this.rot, sx: this.sq.x, sy: this.sq.y, mood, look });
  },
  drawWindow(ctx, cx, cy, R) {
    const w = this.win, N = w.N, step = TAU / N;
    ctx.save(); ctx.lineCap = 'round';
    for (const lvl of [1, 2]) {
      ctx.lineWidth = lvl === 1 ? 18 : 10; ctx.strokeStyle = lvl === 1 ? 'rgba(34,255,136,0.6)' : 'rgba(255,230,0,0.95)';
      let k = 0;
      // find a starting index that is outside a run so wrap-around runs draw as one arc
      let start = 0; while (start < N && w.arr[start] >= lvl) start++;
      if (start === N) { ctx.beginPath(); ctx.arc(cx, cy, R, 0, TAU); ctx.stroke(); continue; }
      for (k = 0; k < N; k++) {
        const i = (start + k) % N;
        if (w.arr[i] >= lvl) {
          let j = 0; while (j < N && w.arr[(i + j) % N] >= lvl) j++;
          const a0 = i * step - step * 0.5, a1 = (i + j - 1) * step + step * 0.5;
          ctx.beginPath(); ctx.arc(cx, cy, R, a0, a1); ctx.stroke();
          k += j - 1;
        }
      }
    }
    ctx.restore();
  },
  hud(ctx) {
    const s = this.run.s, v = K.view, st = v.safe.top, sb = v.safe.bottom;
    const gr = ctx.createLinearGradient(0, -v.oy, 0, 260 + st); gr.addColorStop(0, 'rgba(5,3,15,0.65)'); gr.addColorStop(1, 'rgba(5,3,15,0)');
    ctx.fillStyle = gr; ctx.fillRect(-v.ox, -v.oy, v.fullW, 260 + st + v.oy);
    const gb = ctx.createLinearGradient(0, v.h - 150 - sb, 0, v.h + v.oy); gb.addColorStop(0, 'rgba(5,3,15,0)'); gb.addColorStop(1, 'rgba(5,3,15,0.6)');
    ctx.fillStyle = gb; ctx.fillRect(-v.ox, v.h - 150 - sb, v.fullW, 150 + sb + v.oy);
    K.draw.pill(150 + v.safe.left, 70 + st, K.fmt(K.meta.wallet.get('dust') + s.dustRun - this.run.banked), { icon: 'star', iconColor: '#fff6b0', size: 34, minW: 190 });
    ctx.save(); ctx.translate(v.w / 2, 150 + st); ctx.scale(this.fxScore.s, this.fxScore.s);
    K.draw.text(s.score.toLocaleString(), 0, 0, { size: 96, color: '#ffffff', maxW: v.w - 360 }); ctx.restore();
    if (s.combo > 0) {
      ctx.save(); ctx.translate(v.w / 2, 228 + st); ctx.rotate(Math.sin(K.time * 6) * 0.05);
      K.draw.text('x' + Math.min(s.combo + 1, 8) + ' COMBO', 0, 0, { size: 40, color: '#ffe600' }); ctx.restore();
    }
    const g = gal(s.galaxy), into = s.reached - s.galaxy * GAL_N, by = v.h - 50 - sb;
    K.draw.text('PLANET ' + s.reached + '  ·  ' + galName(s.galaxy), v.w / 2, by - 38, { size: 28, sw: 5, color: '#cfe8ff', maxW: v.w - 80 });
    K.draw.bar(v.w / 2, by, 320, 24, into / GAL_N, [g.neb[0], g.neb[1], g.neb[1]]);
    // galaxy banner
    if (K.time - this.galFx.t0 < 2.6 && this.galFx.g > 0) {
      const tt = K.time - this.galFx.t0, k = tt < 0.3 ? K.Ease.outBack(tt / 0.3) : tt > 2.2 ? 1 - (tt - 2.2) / 0.4 : 1;
      ctx.save(); ctx.globalAlpha = M.clamp(k, 0, 1); ctx.translate(v.w / 2, v.h * 0.42); ctx.scale(Math.max(0.01, k), Math.max(0.01, k)); ctx.rotate(-0.04);
      K.draw.text('GALAXY ' + (this.galFx.g + 1), 0, -40, { size: 54, color: '#ffffff' });
      K.draw.text(galName(this.galFx.g).toUpperCase(), 0, 30, { size: 66, color: gal(this.galFx.g).neb[0], maxW: v.w - 60 });
      ctx.restore();
    }
    // teach by doing: first runs show the tap cue
    if (SAVE.tut < 3 && s.mode === 'orbit' && this.deadT < 0) {
      const inWin = this.aim && this.aim.type === 'land' && this.aim.i > s.cur;
      const y = v.h - 250 - v.safe.bottom, pulse = 1 + 0.12 * Math.sin(K.time * 12);
      if (inWin) {
        ctx.save(); ctx.translate(v.w / 2, y); ctx.scale(pulse, pulse);
        K.draw.text(K.input.touch ? 'TAP!' : 'CLICK!', 0, 0, { size: 96, color: '#22ff88' }); ctx.restore();
        this.finger(ctx, v.w / 2 + 120, y + 30 + Math.sin(K.time * 12) * 10);
      } else {
        K.draw.text('Wait for the green glow...', v.w / 2, y, { size: 38, color: '#cfe8ff', maxW: v.w - 60 });
      }
    }
  },
  finger(ctx, x, y) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(-0.4);
    K.draw.capsule(-16, -70, 32, 80, ['#ffffff', '#ffe0cc', '#c8a090'], { depth: 0 });
    K.draw.block(-34, -10, 68, 70, ['#ffffff', '#ffe0cc', '#c8a090'], { r: 26, depth: 0 });
    ctx.restore();
    ctx.globalAlpha = 0.6; ctx.beginPath(); ctx.arc(x - 14, y - 100, 30 + (K.time * 60) % 30, 0, TAU); ctx.lineWidth = 5; ctx.strokeStyle = '#ffffff'; ctx.stroke(); ctx.globalAlpha = 1;
  },
});

K.scenes.add('over', {
  music: 'orbitMenu',
  enter(p) {
    const v = K.view, run = this.run = p.run, s = run.s;
    const prev = SAVE.best;
    this.newBest = s.score > prev && s.score > 0;
    if (s.score > prev) SAVE.best = s.score;
    this.best = SAVE.best;
    K.save.commit();
    K.sdk.send('score', { value: s.score });
    this.line = this.nearMiss(s, prev);
    this.shown = { n: 0 }; this.pan = { s: 0 };
    K.tween(this.shown, { n: s.score }, 1.0, K.Ease.outCubic, 0.3);
    K.tween(this.pan, { s: 1 }, 0.5, K.Ease.outBack);
    if (this.newBest) K.wait(1.0).then(() => {
      K.audio.play('win'); K.haptic('success');
      K.fx.burst(v.w / 2, v.h * 0.33, { screen: true, shape: 'star', colors: ['#ffe600', '#22ff88', '#ff3cc7', '#ffffff'], count: 46, speed: [300, 900], size: [10, 20] });
    });
    const cy = v => v.h * 0.4;
    K.ui.button({ icon: 'home', color: 'blue', w: 120, h: 120, popIn: 0.35, place: v => ({ x: v.w / 2 - 210, y: cy(v) + 360 }), onTap: () => K.scenes.go('title') });
    K.ui.button({ label: 'RETRY', icon: 'retry', color: 'green', w: 300, h: 120, key: 'action', pulse: true, popIn: 0.45,
      place: v => ({ x: v.w / 2 + 70, y: cy(v) + 360 }), onTap: () => K.scenes.go('play') });
    if (!s.continued) {
      const cont = K.ui.button({ label: 'CONTINUE', icon: 'video', color: 'purple', w: 440, h: 110, popIn: 0.55, sub: 'respawn on your last planet',
        place: v => ({ x: v.w / 2, y: cy(v) + 505 }),
        onTap: async () => {
          cont.enabled = false;
          const r = await K.adBreak('rewarded');
          if (r.granted) { K.audio.play('power'); K.scenes.go('play', { resume: run }); }
          else { cont.label = 'NO AD'; }
        } });
    }
  },
  nearMiss(s, prev) {
    if (s.score <= prev && prev - s.score <= Math.max(60, prev * 0.25)) return 'Only ' + (prev - s.score + 1) + ' points from your best!';
    const wal = K.meta.wallet.get('dust');
    const next = SKINS.filter(k => k.cost && !K.meta.unlocks.has(k.id)).sort((a, b) => a.cost - b.cost)[0];
    if (next && wal < next.cost && next.cost - wal <= 60) return (next.cost - wal) + ' more stardust for ' + next.name + '!';
    if (next && wal >= next.cost) return 'You can afford ' + next.name + '! Check CRITTERS';
    const ms = SKINS.find(k => k.ms && !K.meta.unlocks.has(k.id));
    if (ms && ms.ms.planets && s.reached < ms.ms.planets) return (ms.ms.planets - s.reached) + ' more planets to unlock ' + ms.name + '!';
    if (s.reached % GAL_N >= GAL_N - 4) return 'Only ' + (GAL_N - s.reached % GAL_N) + ' planets from a new galaxy!';
    if (ms) return ms.msText + ' to unlock ' + ms.name;
    return 'Planet ' + s.reached + ' reached';
  },
  backdrop(ctx) { spaceBackdrop(ctx, this.run.s.galaxy, K.time * 20); },
  render(ctx) {
    const v = K.view; ctx.fillStyle = 'rgba(5,3,15,0.35)'; ctx.fillRect(-v.ox - 9999, -9999, 99999, 99999);
    const sk = skinById(K.meta.unlocks.selected('skin', 'blip')), y = v.h * 0.4 - 360 + Math.sin(K.time * 2) * 10;
    drawCritter(sk, v.w / 2, y, 56 * this.pan.s, { ctx, rot: Math.sin(K.time * 1.5) * 0.2, mood: this.newBest ? 'happy' : 'sad' });
  },
  hud(ctx) {
    const v = K.view, cy = v.h * 0.4, s = this.run.s;
    headerPills();
    ctx.save(); ctx.translate(v.w / 2, cy); ctx.scale(this.pan.s, this.pan.s);
    const title = s.cause === 'rock' ? 'CRASHED!' : s.cause === 'hole' ? 'SWALLOWED!' : 'LOST IN SPACE';
    K.draw.panel(0, 0, 600, 520, { title, color: s.cause === 'hole' ? 'purple' : s.cause === 'rock' ? 'red' : 'blue' });
    K.draw.label('SCORE', 0, -165, { size: 34, color: '#a8b0e0' });
    K.draw.text(Math.round(this.shown.n).toLocaleString(), 0, -95, { size: 100, color: '#ffe600' });
    K.draw.pill(0, 5, 'BEST ' + this.best.toLocaleString(), { icon: 'trophy', size: 32 });
    if (this.newBest) { ctx.save(); ctx.translate(0, 80); ctx.rotate(Math.sin(K.time * 4) * 0.05); K.draw.text('NEW BEST!', 0, 0, { size: 56, color: '#22ff88' }); ctx.restore(); }
    else K.draw.paragraph(this.line, 0, 80, 520, { size: 32, color: '#ffffff' });
    const stats = [['PLANET', s.reached], ['PERFECTS', s.perfects], ['STARDUST', '+' + s.dustRun]];
    stats.forEach(([l, n], i) => { const x = (i - 1) * 180; K.draw.label(l, x, 160, { size: 24, color: '#a8b0e0' }); K.draw.text(String(n), x, 202, { size: 42 }); });
    ctx.restore();
  },
});

/* ---- collection screens ---- */
function backBtn() { return K.ui.button({ icon: 'arrowL', color: 'blue', w: 100, h: 100, place: v => ({ x: 70 + v.safe.left, y: 70 + v.safe.top }), onTap: () => K.scenes.go('title') }); }

K.scenes.add('skins', {
  music: 'orbitMenu',
  enter() {
    backBtn();
    K.ui.list({ items: SKINS, cols: 2, itemH: 310, gap: 20, frame: false, popIn: 0.1,
      place: v => ({ x: v.w / 2, y: (200 + v.safe.top + v.h - 30) / 2, w: Math.min(v.w - 30, 680), h: v.h - 30 - (200 + v.safe.top) }),
      drawItem: (ctx, k, i, x, y, w, h) => {
        const own = K.meta.unlocks.has(k.id), sel = K.meta.unlocks.selected('skin', 'blip') === k.id;
        K.draw.card(x, y, w, h, { selected: sel, fill: sel ? '#2a1f66' : K.THEME.paper, outline: sel ? 8 : 5 });
        ctx.save(); if (!own) ctx.globalAlpha = 0.55;
        for (let j = 1; j < 8; j++) { ctx.globalAlpha = (own ? 0.6 : 0.3) * (1 - j / 8); ctx.beginPath(); ctx.arc(x + w / 2 - j * 16, y + 125 + j * 7, 13 - j, 0, TAU); ctx.fillStyle = k.trail; ctx.fill(); }
        ctx.globalAlpha = own ? 1 : 0.55;
        drawCritter(k, x + w / 2 + 10, y + 120, 54, { ctx, mood: own ? 'happy' : 'blink', rot: 0.15, t: K.time + i });
        ctx.restore();
        K.draw.text(k.name, x + w / 2, y + 222, { size: 40, maxW: w - 30 });
        if (sel) K.draw.text('SELECTED', x + w / 2, y + 272, { size: 28, color: '#22ff88', sw: 5 });
        else if (own) K.draw.text('TAP TO USE', x + w / 2, y + 272, { size: 26, color: '#cfe8ff', sw: 5 });
        else if (k.cost) { const can = K.meta.wallet.can('dust', k.cost); K.draw.pill(x + w / 2, y + 272, String(k.cost), { icon: 'star', iconColor: '#fff6b0', size: 28, color: can ? '#22ff88' : '#ff9ab0' }); }
        else { K.draw.icon('lock', x + 40, y + 40, 40, '#a8b0e0'); K.draw.text(k.msText, x + w / 2, y + 272, { size: 24, color: '#ffcf6a', sw: 5, maxW: w - 24 }); }
      },
      onItem: k => {
        if (K.meta.unlocks.has(k.id)) { K.meta.unlocks.select('skin', k.id); K.audio.play('capture'); K.save.commit(); return; }
        if (k.cost) {
          if (K.meta.wallet.spend('dust', k.cost)) { grantSkin(k.id); K.meta.unlocks.select('skin', k.id); K.haptic('success'); K.save.commit();
            K.fx.burst(K.view.w / 2, K.view.h / 2, { screen: true, shape: 'star', colors: [k.col, '#ffe600', '#ffffff'], count: 36, speed: [300, 800] }); }
          else { K.audio.play('error'); K.haptic('fail'); K.ui.toast('Need ' + (k.cost - K.meta.wallet.get('dust')) + ' more stardust', { icon: 'star', iconColor: '#fff6b0' }); }
        } else { K.audio.play('error'); K.ui.toast(k.msText + ' to unlock', { icon: 'lock' }); }
      } });
  },
  backdrop(ctx) { spaceBackdrop(ctx, 1, K.time * 25); },
  hud() {
    const v = K.view;
    K.draw.text('CRITTERS', v.w / 2, 70 + v.safe.top, { size: 60, color: '#7ae8ff', maxW: v.w - 280 });
    K.draw.text(ownedCount() + ' / ' + SKINS.length + ' collected', 40 + v.safe.left, 150 + v.safe.top, { size: 28, sw: 5, color: '#cfe8ff', align: 'left' });
    K.draw.pill(v.w - 130 - v.safe.right, 150 + v.safe.top, K.fmt(K.meta.wallet.get('dust')), { icon: 'star', iconColor: '#fff6b0', size: 32, minW: 170 });
  },
});

K.scenes.add('awards', {
  music: 'orbitMenu',
  enter() {
    backBtn();
    K.ui.list({ items: ACH, itemH: 118, gap: 14, frame: false, popIn: 0.1,
      place: v => ({ x: v.w / 2, y: (200 + v.safe.top + v.h - 30) / 2, w: Math.min(v.w - 30, 680), h: v.h - 30 - (200 + v.safe.top) }),
      drawItem: (ctx, a, i, x, y, w, h) => {
        const got = !!SAVE.ach[a.id];
        K.draw.card(x, y, w, h, { fill: got ? '#2a1f66' : '#141030' });
        K.draw.blob(x + 62, y + h / 2, 40, got ? 'yellow' : 'gray', { glow: got });
        K.draw.icon(got ? 'trophy' : 'lock', x + 62, y + h / 2, 44, got ? '#fffbb0' : '#3a4070');
        K.draw.label(a.name, x + 125, y + h / 2 - 20, { size: 34, align: 'left', color: got ? '#ffffff' : '#8088c0', maxW: w - 150 });
        K.draw.label(a.desc, x + 125, y + h / 2 + 22, { size: 24, align: 'left', color: got ? '#cfe8ff' : '#5f669a', maxW: w - 150 });
        if (got) K.draw.icon('check', x + w - 44, y + h / 2, 44, '#22ff88');
      } });
  },
  backdrop(ctx) { spaceBackdrop(ctx, 2, K.time * 25); },
  hud() {
    const v = K.view, n = ACH.filter(a => SAVE.ach[a.id]).length;
    K.draw.text('AWARDS', v.w / 2, 70 + v.safe.top, { size: 60, color: '#ffcf6a', maxW: v.w - 380 });
    K.draw.text(n + ' / ' + ACH.length + ' earned  ·  best combo x' + (SAVE.stats.bestCombo + 1), v.w / 2, 140 + v.safe.top, { size: 28, sw: 5, color: '#cfe8ff', maxW: v.w - 220 });
  },
});

/* ---- title card (tools/cards.py renders ?card to thumb.jpg) ---- */
K.scenes.add('card', {
  music: null,
  backdrop(ctx) {
    const v = K.view;
    spaceBackdrop(ctx, 0, 300);
    const g = ctx.createRadialGradient(v.w / 2, v.h * 0.55, 30, v.w / 2, v.h * 0.55, v.fullW * 0.6);
    g.addColorStop(0, 'rgba(180,76,255,0.35)'); g.addColorStop(1, 'rgba(180,76,255,0)');
    ctx.fillStyle = g; ctx.fillRect(-v.ox, -v.oy, v.fullW, v.fullH);
  },
  render(ctx) {
    const v = K.view, t = 1.3, H = v.h;
    const P1 = { r0: 150, style: 0, col: 1, g: 0, ring: true, pulse: 0, spin: 0 }, P2 = { r0: 110, style: 1, col: 2, g: 0, ring: false, pulse: 0, spin: 0 };
    const P3 = { r0: 80, style: 3, col: 0, g: 1, ring: false, pulse: 0, spin: 0 }, P4 = { r0: 70, style: 2, col: 3, g: 2, ring: false, pulse: 0, spin: 0 };
    const a = { x: v.w * 0.1, y: H * 0.98 }, b = { x: v.w * 0.92, y: H * 0.64 };
    P3.y = H * 0.62; drawPlanet(ctx, P3, t, -v.ox + 120);
    P4.y = H * 0.3; drawPlanet(ctx, P4, t, v.w + v.ox - 120);
    drawHole(ctx, { x: -v.ox + 190, y: H * 0.36 }, 1.1);
    // capture window glow on the target
    ctx.save(); ctx.shadowColor = '#22ff88'; ctx.shadowBlur = 40; ctx.lineWidth = 14; ctx.strokeStyle = '#22ff88';
    ctx.beginPath(); ctx.arc(b.x, b.y, 185, 0, TAU); ctx.stroke(); ctx.restore();
    K.draw.glow(b.x, b.y, 300, '#22ff88', 0.3);
    P1.y = a.y; drawPlanet(ctx, P1, t, a.x);
    P2.y = b.y; drawPlanet(ctx, P2, t, b.x);
    // orbit window arc on the launch planet
    ctx.save(); ctx.lineCap = 'round'; ctx.shadowColor = '#22ff88'; ctx.shadowBlur = 18; ctx.lineWidth = 16; ctx.strokeStyle = 'rgba(34,255,136,0.7)';
    ctx.beginPath(); ctx.arc(a.x, a.y, 200, -1.25, -0.55); ctx.stroke(); ctx.lineWidth = 10; ctx.strokeStyle = '#ffe600'; ctx.beginPath(); ctx.arc(a.x, a.y, 200, -0.98, -0.82); ctx.stroke(); ctx.restore();
    // dotted path & hero mid-flight
    const hx = M.lerp(a.x + 110, b.x - 120, 0.45), hy = M.lerp(a.y - 170, b.y + 60, 0.45);
    const pts = []; for (let i = 0; i <= 7; i++) { const f = i / 7; pts.push(M.lerp(hx + 70, b.x - 75, f), M.lerp(hy - 40, b.y + 25, f)); }
    K.draw.dots(pts, '#22ff88', 13);
    const ang = Math.atan2(b.y - a.y, b.x - a.x);
    for (let i = 0; i < 9; i++) { const f = i / 9; ctx.globalAlpha = 0.85 * (1 - f); ctx.beginPath(); ctx.arc(hx - Math.cos(ang) * (40 + i * 26), hy - Math.sin(ang) * (40 + i * 26), 30 - i * 2.6, 0, TAU); ctx.fillStyle = i % 2 ? '#7ae8ff' : '#ffffff'; ctx.fill(); }
    ctx.globalAlpha = 1;
    for (let i = 0; i < 5; i++) { const o = (i - 2) * 26; K.draw.line([hx - Math.cos(ang) * 120 - Math.sin(ang) * o, hy - Math.sin(ang) * 120 + Math.cos(ang) * o, hx - Math.cos(ang) * (220 + i * 20) - Math.sin(ang) * o, hy - Math.sin(ang) * (220 + i * 20) + Math.cos(ang) * o], 'rgba(255,255,255,0.7)', 5, { outline: 0 }); }
    drawCritter(SKINS[0], hx, hy, 88, { ctx, rot: ang + Math.PI / 2, sx: 0.85, sy: 1.2, mood: 'happy', look: { x: 0, y: -1 }, t: 0.4 });
    // stardust + rocks
    const ds = dustSprite();
    [[0.62, 0.42], [0.7, 0.36], [0.06, 0.45], [0.9, 0.78], [0.45, 0.62]].forEach(([fx, fy], i) => K.draw.drawSprite(ds, -v.ox + fx * v.fullW, fy * H, { scale: 1.5, rot: i * 0.4 }));
    K.draw.drawSprite(rockSprite(0, 32), v.w + v.ox - 110, H * 0.86, { scale: 1.6, rot: 0.5 });
    K.draw.drawSprite(rockSprite(1, 28), -v.ox + 60, H * 0.95, { scale: 1.3, rot: 1.2 });
    K.draw.drawSprite(rockSprite(2, 24), v.w + v.ox - 30, H * 0.66, { scale: 1.2, rot: 2.2 });
  },
  hud(ctx) {
    const v = K.view;
    ctx.save(); ctx.translate(v.w / 2, v.h * 0.2); ctx.rotate(-0.07);
    K.draw.text('ORBIT', 0, -95, { size: 230, color: '#7ae8ff', sw: 18 });
    K.draw.text('HOP!', 40, 110, { size: 250, color: '#ff7ad1', sw: 18 });
    ctx.restore();
  },
});

K.boot(/[?&]card\b/.test(location.search) ? 'card' : 'title');
</script>
