<script>
"use strict";
/* §1 MANIFEST */
const MANIFEST = {
  id: 'orbit-hop',
  title: 'Orbit Hop',
  version: '1.0.0',
  genre: 'stack',
  theme: 'neon',
  orientation: 'portrait',
  design: { w: 720, h: 1280, maxW: 900 },
  touch: { stick: false, buttons: [] },
};
</script>
<script>
//#KERNEL-BEGIN 1.1.0
/* =========================================================================
   SlopGames KERNEL 1.1.0 — single-file HTML5 game kernel (Canvas2D, zero deps)
   Requires a global `MANIFEST` declared in an earlier <script>. Exposes `K`.
   Source of truth: /kernel/kernel-1.1.0.js  — never edit inside a game file.
   ========================================================================= */
const K = (() => {
  'use strict';
  const KERNEL_VERSION = '1.1.0';
  const TAU = Math.PI * 2;

  /* ---------- manifest defaults ---------- */
  const MF = (typeof MANIFEST !== 'undefined' && MANIFEST) ? MANIFEST : {};
  const DEFAULT_KEYS = {
    up: ['ArrowUp', 'KeyW', 'PadUp'], down: ['ArrowDown', 'KeyS', 'PadDown'],
    left: ['ArrowLeft', 'KeyA', 'PadLeft'], right: ['ArrowRight', 'KeyD', 'PadRight'],
    action: ['Space', 'Enter', 'PadA'], alt: ['ShiftLeft', 'KeyX', 'PadB'],
    pause: ['Escape', 'KeyP', 'PadStart'],
  };
  MF.id = MF.id || 'game';
  MF.title = MF.title || 'Game';
  MF.version = MF.version || '1.0.0';
  MF.design = Object.assign({ w: 720, h: 1280 }, MF.design || {});
  MF.keys = Object.assign({}, DEFAULT_KEYS, MF.keys || {});
  MF.touch = Object.assign({ stick: false, buttons: [] }, MF.touch || {});
  MF.platformOrigins = MF.platformOrigins || [];
  MF.orientation = MF.orientation || 'any';            // 'portrait' | 'landscape' | 'any'
  MF.theme = MF.theme || 'candy';

  /* ---------- canvas bootstrap (games may omit their own <canvas>) ---------- */
  if (!document.getElementById('k-base-css')) {
    const st = document.createElement('style'); st.id = 'k-base-css';
    st.textContent = 'html,body{margin:0;height:100%;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}#stage{position:fixed;inset:0;display:block;width:100%;height:100%;outline:none}';
    document.head.appendChild(st);
  }
  let canvas = document.getElementById('stage');
  if (!canvas) { canvas = document.createElement('canvas'); canvas.id = 'stage'; canvas.tabIndex = 0; document.body.appendChild(canvas); }
  const mainCtx = canvas.getContext('2d');
  let ctx = mainCtx;                                    // swapped while baking sprites

  /* =======================================================================
     MATH / RNG / NOISE / COLOR
     ======================================================================= */
  const M = {
    TAU,
    clamp: (v, a, b) => v < a ? a : v > b ? b : v,
    lerp: (a, b, t) => a + (b - a) * t,
    invLerp: (a, b, v) => (v - a) / (b - a),
    remap: (v, a, b, c, d) => c + (d - c) * ((v - a) / (b - a)),
    smoothstep: (a, b, v) => { const t = Math.max(0, Math.min(1, (v - a) / (b - a))); return t * t * (3 - 2 * t); },
    dist: (ax, ay, bx, by) => Math.hypot(bx - ax, by - ay),
    dist2: (ax, ay, bx, by) => (bx - ax) * (bx - ax) + (by - ay) * (by - ay),
    len: (x, y) => Math.hypot(x, y),
    norm: (x, y) => { const l = Math.hypot(x, y) || 1; return { x: x / l, y: y / l }; },
    dot: (ax, ay, bx, by) => ax * bx + ay * by,
    cross: (ax, ay, bx, by) => ax * by - ay * bx,
    rotate: (x, y, a) => { const c = Math.cos(a), s = Math.sin(a); return { x: x * c - y * s, y: x * s + y * c }; },
    angle: (x, y) => Math.atan2(y, x),
    angleDiff: (a, b) => { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; },
    approach: (v, t, d) => v < t ? Math.min(v + d, t) : Math.max(v - d, t),
    damp: (a, b, lambda, dt) => a + (b - a) * (1 - Math.exp(-lambda * dt)),
    wrap: (v, max) => ((v % max) + max) % max,
    sign: v => v > 0 ? 1 : v < 0 ? -1 : 0,
  };

  function rng(seed = 1) {
    let s = (seed >>> 0) || 1;
    const r = () => {
      s = (s + 0x6D2B79F5) | 0;
      let t = Math.imul(s ^ (s >>> 15), 1 | s);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    r.range = (a, b) => a + (b - a) * r();
    r.int = (a, b) => Math.floor(a + (b - a + 1) * r());
    r.pick = arr => arr[Math.floor(r() * arr.length)];
    r.chance = p => r() < p;
    r.sign = () => r() < 0.5 ? -1 : 1;
    r.shuffle = arr => { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); const t = arr[i]; arr[i] = arr[j]; arr[j] = t; } return arr; };
    r.weighted = (items, weightOf = it => it.w) => {
      let total = 0; for (const it of items) total += weightOf(it);
      let x = r() * total; for (const it of items) { x -= weightOf(it); if (x <= 0) return it; }
      return items[items.length - 1];
    };
    r.state = () => s;
    r.setState = v => { s = v | 0; };
    return r;
  }
  function hashSeed(str) {
    let h = 2166136261;
    str = String(str);
    for (let i = 0; i < str.length; i++) h = Math.imul(h ^ str.charCodeAt(i), 16777619);
    return h >>> 0;
  }
  function dailySeed(offsetDays = 0) {
    const d = new Date(Date.now() + offsetDays * 864e5);
    return hashSeed(MF.id + ':' + d.getUTCFullYear() + '-' + (d.getUTCMonth() + 1) + '-' + d.getUTCDate());
  }

  function noise(seed = 1) {
    const r = rng(seed), p = new Uint16Array(512), vals = new Float32Array(256), perm = [];
    for (let i = 0; i < 256; i++) { perm.push(i); vals[i] = r() * 2 - 1; }
    r.shuffle(perm);
    for (let i = 0; i < 512; i++) p[i] = perm[i & 255];
    const fade = t => t * t * (3 - 2 * t);
    const h1 = i => vals[p[i & 255]];
    const h2 = (i, j) => vals[p[p[i & 255] + (j & 255)]];
    function n1(x) { const xi = Math.floor(x), t = fade(x - xi); return M.lerp(h1(xi), h1(xi + 1), t); }
    function n2(x, y) {
      const xi = Math.floor(x), yi = Math.floor(y), u = fade(x - xi), v = fade(y - yi);
      return M.lerp(M.lerp(h2(xi, yi), h2(xi + 1, yi), u), M.lerp(h2(xi, yi + 1), h2(xi + 1, yi + 1), u), v);
    }
    function fbm(fn, oct, ...c) { let s = 0, a = 1, f = 1, n = 0; for (let i = 0; i < oct; i++) { s += a * fn(...c.map(v => v * f)); n += a; a *= 0.5; f *= 2; } return s / n; }
    return { n1, n2, fbm1: (x, o = 4) => fbm(n1, o, x), fbm2: (x, y, o = 4) => fbm(n2, o, x, y) };
  }

  const color = {
    rgb(hex) { hex = hex.replace('#', ''); if (hex.length === 3) hex = hex.split('').map(c => c + c).join(''); const n = parseInt(hex, 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; },
    hex(r, g, b) { return '#' + [r, g, b].map(v => Math.round(M.clamp(v, 0, 255)).toString(16).padStart(2, '0')).join(''); },
    mix(a, b, t) { const A = color.rgb(a), B = color.rgb(b); return color.hex(M.lerp(A[0], B[0], t), M.lerp(A[1], B[1], t), M.lerp(A[2], B[2], t)); },
    shade(hex, amt) { return amt >= 0 ? color.mix(hex, '#ffffff', amt) : color.mix(hex, '#000000', -amt); },
    alpha(hex, a) { const c = color.rgb(hex); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; },
    hsl(h, s, l) { return `hsl(${h},${s}%,${l}%)`; },
    pal(base) { return [color.shade(base, 0.45), base, color.shade(base, -0.3)]; },
  };

  const fmt = (n) => {
    const a = Math.abs(n);
    if (a < 1000) return String(Math.floor(n));
    const u = ['K', 'M', 'B', 'T', 'Qa', 'Qi']; let i = -1, v = a;
    while (v >= 1000 && i < u.length - 1) { v /= 1000; i++; }
    return (n < 0 ? '-' : '') + (v < 10 ? v.toFixed(2) : v < 100 ? v.toFixed(1) : Math.floor(v)) + u[i];
  };
  const fmtTime = (sec) => { sec = Math.max(0, Math.ceil(sec)); const m = Math.floor(sec / 60), s = sec % 60; return m + ':' + String(s).padStart(2, '0'); };
  function compact(arr, keep) { let j = 0; for (let i = 0; i < arr.length; i++) if (keep(arr[i], i)) arr[j++] = arr[i]; arr.length = j; return arr; }

  /* =======================================================================
     EASING / TWEENS / SPRINGS (cosmetic, real-time)
     ======================================================================= */
  const Ease = {
    linear: t => t,
    inQuad: t => t * t,
    outQuad: t => 1 - (1 - t) * (1 - t),
    inOutQuad: t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2,
    inCubic: t => t * t * t,
    outCubic: t => 1 - Math.pow(1 - t, 3),
    inOutCubic: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
    outQuart: t => 1 - Math.pow(1 - t, 4),
    inBack: t => { const c1 = 1.70158; return (c1 + 1) * t * t * t - c1 * t * t; },
    outBack: t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
    outElastic: t => t === 0 ? 0 : t === 1 ? 1 : Math.pow(2, -10 * t) * Math.sin((t * 10 - .75) * (TAU / 3)) + 1,
    outBounce: t => {
      const n = 7.5625, d = 2.75;
      if (t < 1 / d) return n * t * t;
      if (t < 2 / d) return n * (t -= 1.5 / d) * t + .75;
      if (t < 2.5 / d) return n * (t -= 2.25 / d) * t + .9375;
      return n * (t -= 2.625 / d) * t + .984375;
    },
    pingPong: t => t < 0.5 ? t * 2 : 2 - t * 2,
  };
  const tweens = [];
  function tween(obj, to, dur = 0.3, ease = Ease.outQuad, delay = 0) {
    const tw = { obj, to, from: {}, dur: Math.max(dur, 1e-4), ease, t: -delay, started: false, done: false, _then: null,
      then(fn) { this._then = fn; return this; }, kill() { this.done = true; } };
    tweens.push(tw);
    return tw;
  }
  tween.killOf = obj => { for (const t of tweens) if (t.obj === obj) t.done = true; };
  function wait(sec) { return new Promise(res => tween({}, {}, sec).then(res)); }
  function updateTweens(dt) {
    for (let i = tweens.length - 1; i >= 0; i--) {
      const tw = tweens[i];
      if (tw.done) { tweens.splice(i, 1); continue; }
      tw.t += dt;
      if (tw.t < 0) continue;
      if (!tw.started) { tw.started = true; for (const k in tw.to) tw.from[k] = tw.obj[k]; }
      const p = Math.min(1, tw.t / tw.dur), e = tw.ease(p);
      for (const k in tw.to) tw.obj[k] = tw.from[k] + (tw.to[k] - tw.from[k]) * e;
      if (p >= 1) { tw.done = true; tweens.splice(i, 1); if (tw._then) tw._then(); }
    }
  }
  // Critically-damped-ish spring: call every frame. s = {v, vel}; returns new value.
  function spring(s, target, dt, stiffness = 220, damping = 18) {
    const a = (target - s.v) * stiffness - s.vel * damping;
    s.vel += a * dt; s.v += s.vel * dt;
    return s.v;
  }

  /* =======================================================================
     VIEW / RESIZE / ADAPTIVE QUALITY
     ======================================================================= */
  const view = { w: MF.design.w, h: MF.design.h, fullW: MF.design.w, fullH: MF.design.h, ox: 0, oy: 0,
    scale: 1, dpr: 1, dprCap: 2.5, safe: { top: 0, right: 0, bottom: 0, left: 0 },
    get portrait() { return this.fullH >= this.fullW; } };
  const probe = document.createElement('div');
  probe.style.cssText = 'position:fixed;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)';
  document.body.appendChild(probe);
  function resize() {
    const D = MF.design;
    const cw = Math.max(1, window.innerWidth), ch = Math.max(1, window.innerHeight);
    const dpr = Math.min(window.devicePixelRatio || 1, view.dprCap);
    const scale = Math.min(cw / D.w, ch / D.h);
    view.scale = scale; view.dpr = dpr;
    view.fullW = cw / scale; view.fullH = ch / scale;
    view.w = Math.min(view.fullW, D.maxW || Infinity);
    view.h = Math.min(view.fullH, D.maxH || Infinity);
    view.ox = (view.fullW - view.w) / 2; view.oy = (view.fullH - view.h) / 2;
    canvas.width = Math.round(cw * dpr); canvas.height = Math.round(ch * dpr);
    const cs = getComputedStyle(probe);
    view.safe.top = Math.max(0, (parseFloat(cs.paddingTop) || 0) / scale - view.oy);
    view.safe.right = Math.max(0, (parseFloat(cs.paddingRight) || 0) / scale - view.ox);
    view.safe.bottom = Math.max(0, (parseFloat(cs.paddingBottom) || 0) / scale - view.oy);
    view.safe.left = Math.max(0, (parseFloat(cs.paddingLeft) || 0) / scale - view.ox);
    spriteCache.checkRes();
    input.layoutTouch();
    if (camera.auto) camera.center();
    scenes.layout();
  }

  /* =======================================================================
     THEMES — art-direction presets; every preset has the same color keys
     ======================================================================= */
  const ROUNDED = '"Arial Rounded MT Bold","Nunito","Baloo 2",ui-rounded,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';
  const THEMES = {
    candy: { ink: '#1b1b3a', paper: '#fff7e8', paperText: '#1b1b3a', bg: '#1b1b3a', sky: ['#4fc3ff', '#8a6cff'], font: ROUNDED,
      colors: { green: ['#8af59a', '#2fbf4a', '#1d8a33'], blue: ['#86d0ff', '#2b8cff', '#1a5fc0'], yellow: ['#fff08a', '#ffc21a', '#d48a00'],
        red: ['#ff9a9a', '#ff4b5c', '#c0283a'], purple: ['#d2b0ff', '#8f5bff', '#5f33c4'], orange: ['#ffc48a', '#ff8a1f', '#c45c00'],
        pink: ['#ffb0dc', '#ff5cb4', '#c42d84'], gray: ['#eef0f6', '#aab2c8', '#6f7891'] } },
    neon: { ink: '#07041a', paper: '#1a1440', paperText: '#ffffff', bg: '#07041a', sky: ['#1a0f3d', '#05030f'], font: ROUNDED, glow: true,
      colors: { green: ['#b0ffd0', '#22ff88', '#00a352'], blue: ['#b0f0ff', '#22d3ff', '#0078b8'], yellow: ['#fffbb0', '#ffe600', '#b89f00'],
        red: ['#ffb0c4', '#ff2e63', '#a8002f'], purple: ['#ebc4ff', '#b44cff', '#6d17b0'], orange: ['#ffd8b0', '#ff8c1a', '#b35400'],
        pink: ['#ffc8f2', '#ff3cc7', '#a3007a'], gray: ['#e0e3ff', '#8088c0', '#3a4070'] } },
    pastel: { ink: '#4a3f5c', paper: '#fffaf3', paperText: '#4a3f5c', bg: '#efe4ff', sky: ['#ffe1ec', '#d9e8ff'], font: ROUNDED,
      colors: { green: ['#d4f7dc', '#9be3ad', '#5fb377'], blue: ['#d6ecff', '#9ccbff', '#5f95cf'], yellow: ['#fff6cc', '#ffe08a', '#d1aa45'],
        red: ['#ffd6dc', '#ff9eac', '#cf6575'], purple: ['#ebdcff', '#c3a3ff', '#8b6bc9'], orange: ['#ffe4cc', '#ffbf8a', '#cf8c52'],
        pink: ['#ffdcef', '#ffa8d4', '#cf6fa0'], gray: ['#f4f2f7', '#cfc9d9', '#968ea6'] } },
    jungle: { ink: '#1f2a12', paper: '#fff6dc', paperText: '#1f2a12', bg: '#1f2a12', sky: ['#9be58e', '#2e8b57'], font: ROUNDED,
      colors: { green: ['#c4f28a', '#6cc23a', '#3d7a1c'], blue: ['#9fe3e0', '#2fa8a0', '#1d6b66'], yellow: ['#fff0a0', '#f2c230', '#a8800f'],
        red: ['#ffb09a', '#e8573a', '#a3321c'], purple: ['#d8b8ff', '#9b6ad6', '#63408f'], orange: ['#ffcf8f', '#f08c24', '#a85a0c'],
        pink: ['#ffc0d2', '#e86a94', '#a33a5e'], gray: ['#efe9d8', '#b5ab8f', '#7a7058'] } },
    ocean: { ink: '#0b2545', paper: '#f0fbff', paperText: '#0b2545', bg: '#0b2545', sky: ['#5ee7ff', '#1b6ca8'], font: ROUNDED,
      colors: { green: ['#a8ffe0', '#2ee6a6', '#16a374'], blue: ['#a8e4ff', '#2ab0ff', '#1572b3'], yellow: ['#fff3b0', '#ffd23f', '#b8901a'],
        red: ['#ffb3b3', '#ff5a5f', '#b8323a'], purple: ['#c9c4ff', '#7a6cff', '#4a3fb3'], orange: ['#ffd1a8', '#ff9a3c', '#b8621a'],
        pink: ['#ffc4e1', '#ff70b0', '#b83d78'], gray: ['#e8f4f8', '#9fbccb', '#5e7f8f'] } },
    retro: { ink: '#000000', paper: '#1d1d1d', paperText: '#ffffff', bg: '#000000', sky: ['#1a0033', '#000000'], font: '"Courier New",ui-monospace,Menlo,monospace',
      colors: { green: ['#80ff80', '#00d800', '#008800'], blue: ['#80c0ff', '#3878f8', '#0030b0'], yellow: ['#ffff80', '#f8d800', '#a88800'],
        red: ['#ff8080', '#f83800', '#a80000'], purple: ['#e080ff', '#a000f8', '#6000a8'], orange: ['#ffc080', '#f87800', '#a84800'],
        pink: ['#ffa0e0', '#f878f8', '#a838a8'], gray: ['#ffffff', '#bcbcbc', '#7c7c7c'] } },
    ink: { ink: '#141414', paper: '#ffffff', paperText: '#141414', bg: '#f5f1e8', sky: ['#faf7f0', '#e6dfcf'], font: ROUNDED,
      colors: { green: ['#e6e6e6', '#bdbdbd', '#7a7a7a'], blue: ['#e6e6e6', '#9e9e9e', '#5c5c5c'], yellow: ['#fff3c4', '#ffd84d', '#b89400'],
        red: ['#ffc9c4', '#e8402e', '#9e2216'], purple: ['#e0e0e0', '#8a8a8a', '#4d4d4d'], orange: ['#f0f0f0', '#b0b0b0', '#6e6e6e'],
        pink: ['#ffd6d1', '#f07a6e', '#a83f34'], gray: ['#ffffff', '#d6d6d6', '#8f8f8f'] } },
  };
  const THEME = {};
  function setTheme(name) {
    const t = THEMES[name] || THEMES.candy;
    for (const k in THEME) delete THEME[k];
    Object.assign(THEME, JSON.parse(JSON.stringify(t)), { name: THEMES[name] ? name : 'candy' });
    if (MF.bg) THEME.bg = MF.bg;
    document.body.style.background = THEME.bg;
    spriteCache.clear();
  }

  /* =======================================================================
     STORAGE / SAVE / META-PROGRESSION
     ======================================================================= */
  const store = (() => {
    const ns = 'k:' + MF.id + ':';
    const mem = {};
    return {
      get(k, def) {
        if (k in mem) return mem[k];
        try { const v = localStorage.getItem(ns + k); if (v != null) return (mem[k] = JSON.parse(v)); } catch (e) {}
        return def;
      },
      set(k, v) {
        mem[k] = v;
        try { localStorage.setItem(ns + k, JSON.stringify(v)); } catch (e) {}
        sdk.send('save', { key: k, value: v });
      },
      remove(k) { delete mem[k]; try { localStorage.removeItem(ns + k); } catch (e) {} sdk.send('save', { key: k, value: null }); },
      import(obj) { if (obj && typeof obj === 'object') for (const k in obj) if (obj[k] != null) mem[k] = obj[k]; },
    };
  })();

  const clone = o => JSON.parse(JSON.stringify(o));
  function fillDefaults(target, defs) {
    for (const k in defs) {
      if (!(k in target)) target[k] = clone(defs[k]);
      else if (defs[k] && typeof defs[k] === 'object' && !Array.isArray(defs[k]) && target[k] && typeof target[k] === 'object') fillDefaults(target[k], defs[k]);
    }
    return target;
  }
  const save = (() => {
    let def = null;
    const data = {};
    let commitT = null;
    function load(raw) {
      let d = raw && typeof raw === 'object' ? clone(raw) : null;
      if (!d) d = Object.assign(clone(def.defaults), { _v: def.version });
      let v = d._v || 1;
      while (v < def.version) { const fn = def.migrate[v + 1]; if (fn) d = fn(d) || d; v++; d._v = v; }
      fillDefaults(d, def.defaults);
      for (const k in data) delete data[k];
      Object.assign(data, d);
    }
    return {
      // K.save.define({version, defaults, migrate:{2: d => {...}}}) → returns the live data object
      define(o) { def = { version: o.version || 1, defaults: o.defaults || {}, migrate: o.migrate || {} }; load(store.get('save', null)); return data; },
      get data() { return data; },
      commit() { if (def) { clearTimeout(commitT); commitT = null; store.set('save', data); } },
      later() { if (def && !commitT) commitT = setTimeout(() => save.commit(), 800); },
      reset() { if (!def) return; for (const k in data) delete data[k]; Object.assign(data, clone(def.defaults), { _v: def.version }); save.commit(); },
      reload() { if (def) load(store.get('save', null)); },
      get defined() { return !!def; },
    };
  })();

  const meta = (() => {
    const m = () => {
      if (!save.defined) save.define({ version: 1, defaults: {} });
      const d = save.data;
      return d._meta || (d._meta = { wallet: {}, up: {}, levels: {}, daily: { last: null, streak: 0 }, unlocks: {}, sel: {} });
    };
    const upDefs = {};
    const listeners = [];

      wheel(x, y, dy) { for (let i = W.length - 1; i >= 0; i--) { const w = W[i]; if (w.kind === 'list' && active(w) && inRect(w, x, y, 0)) { const L = kinds.list.layout(w); w.off = M.clamp(w.off + dy, 0, L.maxOff); return true; } } return false; },
      keys() {
        for (const w of W) if (w.kind === 'button' && w.key && active(w) && input.pressed(w.key)) {
          bounce(w, 0.9, 0.06); w._tw.then(() => bounce(w, 1, 0.35, Ease.outElastic));
          if (w.sfx) audio.play(w.sfx); if (w.onTap) w.onTap(w); return;
        }
      },
    };
    return api;
  })();

  /* =======================================================================
     INPUT — keyboard, unified pointer, multitouch, gamepad, typed text, touch overlay
     ======================================================================= */
  const input = (() => {
    const keyMap = {};
    for (const a in MF.keys) for (const c of MF.keys[a]) (keyMap[c] || (keyMap[c] = [])).push(a);
    const held = new Set(), pr = new Set(), rl = new Set(), vHeld = new Set(), padHeld = new Set();
    const axis = { x: 0, y: 0 }, pad = { x: 0, y: 0, ax: 0, ay: 0, connected: false };
    const typed = [];
    const p = { x: 0, y: 0, down: false, pressed: false, released: false, tap: false, dragging: false,
      startX: 0, startY: 0, dx: 0, dy: 0, downAt: 0, holdTime: 0, id: null, vx: 0, vy: 0, _lx: 0, _ly: 0, _lt: 0,
      get wx() { return camera.toWorld(this.x, this.y).x; }, get wy() { return camera.toWorld(this.x, this.y).y; },
      get wStartX() { return camera.toWorld(this.startX, this.startY).x; }, get wStartY() { return camera.toWorld(this.startX, this.startY).y; } };
    const pointers = new Map();     // all non-UI pointers (multitouch)
    let touchMode = window.matchMedia && matchMedia('(pointer: coarse)').matches;
    const stick = { id: null, ox: 0, oy: 0, kx: 0, ky: 0, r: 90 };
    // Touch overlay config: scene.touch overrides MANIFEST.touch (set scene.touch = null to hide).
    const tc = () => { const sc = scenes.current; return sc && sc.touch !== undefined ? (sc.touch || NO_TOUCH) : MF.touch; };
    const NO_TOUCH = { stick: false, buttons: [] };
    let tbtn = [], tbtnFor = null;
    function syncButtons() {
      const c = tc();
      if (c !== tbtnFor) { tbtnFor = c; tbtn = (c.buttons || []).map(b => ({ action: b.action, label: b.label || '', icon: b.icon || null, color: b.color || 'purple', x: 0, y: 0, r: b.r || 72, id: null })); api.layoutTouch(); }
      return tbtn;
    }
    const toL = e => ({ x: e.clientX / view.scale - view.ox, y: e.clientY / view.scale - view.oy });
    const overlayOn = () => { if (!touchMode || !scenes.current || !scenes.current.gameplay || sys.paused || sys.modal) return false; const c = tc(); syncButtons(); return !!(c.stick || tbtn.length); };
    const press = a => { if (a === 'pause') { if (!sys.modal) sys.paused ? resumeGame() : pauseGame(); return; } held.add(a); pr.add(a); };

    window.addEventListener('keydown', e => {
      audio.unlock();
      if (e.code === 'Backquote') { debug.on = !debug.on; return; }
      if (!sys.ad && !e.ctrlKey && !e.metaKey) { if (e.key.length === 1) typed.push(e.key); else if (e.key === 'Backspace') typed.push('\b'); else if (e.key === 'Enter') typed.push('\n'); }
      const acts = keyMap[e.code];
      if (!acts) { if (e.key === 'Backspace' || e.key === ' ') e.preventDefault(); return; }
      e.preventDefault(); touchMode = false;
      if (e.repeat || sys.ad) return;
      acts.forEach(press);
    });
    window.addEventListener('keyup', e => { const acts = keyMap[e.code]; if (!acts) return; acts.forEach(a => { held.delete(a); rl.add(a); }); });
    window.addEventListener('blur', () => held.clear());

    canvas.addEventListener('pointerdown', e => {
      e.preventDefault(); audio.unlock(); try { canvas.focus({ preventScroll: true }); } catch (_) {}
      if (e.pointerType === 'touch' || e.pointerType === 'pen') touchMode = true; else if (e.pointerType === 'mouse') touchMode = false;
      if (sys.ad) return;
      const q = toL(e);
      try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
      if (sys.crashed) { if (q.y > view.h - 260) location.reload(); return; }
      if (ui.down(q.x, q.y, e.pointerId)) return;
      if (overlayOn()) {
        for (const b of tbtn) if (b.id == null && M.dist(q.x, q.y, b.x, b.y) < b.r * 1.3) { b.id = e.pointerId; vHeld.add(b.action); pr.add(b.action); haptic('light'); return; }
        if (tc().stick && stick.id == null && q.x < view.w * 0.5) { stick.id = e.pointerId; stick.ox = q.x; stick.oy = q.y; stick.kx = stick.ky = 0; return; }
      }
      if (sys.paused) return;
      pointers.set(e.pointerId, { id: e.pointerId, x: q.x, y: q.y, startX: q.x, startY: q.y, downAt: performance.now(), pressed: true });
      if (p.id != null) return;
      p.id = e.pointerId; p.down = true; p.pressed = true; p.dragging = false;
      p.x = p.startX = p._lx = q.x; p.y = p.startY = p._ly = q.y; p.dx = p.dy = p.vx = p.vy = 0; p.downAt = p._lt = performance.now(); p.holdTime = 0;
    });
    canvas.addEventListener('pointermove', e => {
      const q = toL(e);
      if (e.pointerId === stick.id) {
        let dx = q.x - stick.ox, dy = q.y - stick.oy; const d = Math.hypot(dx, dy);
        if (d > stick.r) { dx *= stick.r / d; dy *= stick.r / d; }
        stick.kx = dx; stick.ky = dy; axis.x = dx / stick.r; axis.y = dy / stick.r; return;
      }
      ui.move(q.x, q.y, e.pointerId);
      const pt = pointers.get(e.pointerId); if (pt) { pt.x = q.x; pt.y = q.y; }
      if (e.pointerId === p.id || p.id == null) { p.x = q.x; p.y = q.y; }
      if (e.pointerId === p.id) {
        p.dx = p.x - p.startX; p.dy = p.y - p.startY;
        if (!p.dragging && Math.hypot(p.dx, p.dy) > 14) p.dragging = true;
        const now = performance.now(), dt = Math.max(1, now - p._lt) / 1000;
        p.vx = p.vx * 0.5 + (q.x - p._lx) / dt * 0.5; p.vy = p.vy * 0.5 + (q.y - p._ly) / dt * 0.5; p._lx = q.x; p._ly = q.y; p._lt = now;
      }
    });
    const up = (e, cancel) => {
      const q = toL(e);
      if (ui.up(q.x, q.y, e.pointerId)) return;
      for (const b of tbtn) if (b.id === e.pointerId) { b.id = null; if (!tbtn.some(o => o.id != null && o.action === b.action)) { vHeld.delete(b.action); rl.add(b.action); } return; }
      if (e.pointerId === stick.id) { stick.id = null; axis.x = axis.y = 0; return; }
      pointers.delete(e.pointerId);
      if (e.pointerId === p.id) {
        p.x = q.x; p.y = q.y; p.dx = p.x - p.startX; p.dy = p.y - p.startY;
        if (performance.now() - p._lt > 80) { p.vx = 0; p.vy = 0; }
        p.down = false; p.released = !cancel; p.tap = !cancel && !p.dragging && performance.now() - p.downAt < 350; p.id = null;
      }
    };
    canvas.addEventListener('pointerup', e => up(e, false));
    canvas.addEventListener('pointercancel', e => up(e, true));
    canvas.addEventListener('contextmenu', e => e.preventDefault());
    canvas.addEventListener('wheel', e => { e.preventDefault(); const q = toL(e); if (!ui.wheel(q.x, q.y, e.deltaY)) api.wheel += e.deltaY; }, { passive: false });

    const PAD_NAMES = ['PadA', 'PadB', 'PadX', 'PadY', 'PadLB', 'PadRB', 'PadLT', 'PadRT', 'PadBack', 'PadStart', 'PadL3', 'PadR3', 'PadUp', 'PadDown', 'PadLeft', 'PadRight'];
    const dz = v => Math.abs(v) < 0.2 ? 0 : (v - Math.sign(v) * 0.2) / 0.8;
    function pollPad() {
      if (!navigator.getGamepads) return;
      let gp = null; try { for (const g of navigator.getGamepads()) if (g && g.connected) { gp = g; break; } } catch (e) { return; }
      pad.connected = !!gp;
      if (!gp) { if (padHeld.size) { padHeld.forEach(a => rl.add(a)); padHeld.clear(); } pad.x = pad.y = pad.ax = pad.ay = 0; return; }
      const now = new Set();
      gp.buttons.forEach((b, i) => { if (b.pressed && PAD_NAMES[i] && keyMap[PAD_NAMES[i]]) keyMap[PAD_NAMES[i]].forEach(a => now.add(a)); });
      pad.x = dz(gp.axes[0] || 0); pad.y = dz(gp.axes[1] || 0); pad.ax = dz(gp.axes[2] || 0); pad.ay = dz(gp.axes[3] || 0);
      for (const a of now) if (!padHeld.has(a)) { touchMode = false; if (a === 'pause') press(a); else { pr.add(a); } }
      for (const a of padHeld) if (!now.has(a)) rl.add(a);
      padHeld.clear(); now.forEach(a => { if (a !== 'pause') padHeld.add(a); });
    }

    const api = {
      pointer: p, pointers, pad, wheel: 0,
      get typed() { return typed; },
      get touch() { return touchMode; },
      down: a => held.has(a) || vHeld.has(a) || padHeld.has(a),
      pressed: a => pr.has(a),
      released: a => rl.has(a),
      axisX() { let x = axis.x + pad.x; if (api.down('left')) x -= 1; if (api.down('right')) x += 1; return M.clamp(x, -1, 1); },
      axisY() { let y = axis.y + pad.y; if (api.down('up')) y -= 1; if (api.down('down')) y += 1; return M.clamp(y, -1, 1); },
      // Normalized movement vector (diagonals not faster).
      move() { const x = api.axisX(), y = api.axisY(), l = Math.hypot(x, y); return l > 1 ? { x: x / l, y: y / l } : { x, y }; },
      // Aim direction: right stick, else pointer relative to (fromX, fromY) in world space.
      aim(fromX, fromY) {
        if (Math.hypot(pad.ax, pad.ay) > 0.3) return { x: pad.ax, y: pad.ay, active: true };
        const dx = p.wx - fromX, dy = p.wy - fromY, l = Math.hypot(dx, dy) || 1;

      },
      poll() { pollPad(); if (p.down) p.holdTime = (performance.now() - p.downAt) / 1000; },
      endStep() { pr.clear(); rl.clear(); p.pressed = p.released = p.tap = false; typed.length = 0; api.wheel = 0; for (const pt of pointers.values()) pt.pressed = false; },
      reset() {
        held.clear(); vHeld.clear(); pr.clear(); rl.clear(); typed.length = 0; axis.x = axis.y = 0; stick.id = null; pointers.clear();
        tbtn.forEach(b => b.id = null); p.down = p.pressed = p.released = p.tap = p.dragging = false; p.id = null; p.vx = p.vy = 0;
      },
      layoutTouch() {
        tbtn.forEach((b, i) => { b.x = view.w - 110 - view.safe.right - (i % 2) * 165; b.y = view.h - 140 - view.safe.bottom - (i % 2) * 70 - Math.floor(i / 2) * 170; });
      },
      drawTouch() {
        if (!overlayOn()) return;
        if (tc().stick) {
          const ox = stick.id != null ? stick.ox : 150 + view.safe.left, oy = stick.id != null ? stick.oy : view.h - 170 - view.safe.bottom;
          ctx.globalAlpha = stick.id != null ? 0.55 : 0.25;
          ctx.beginPath(); ctx.arc(ox, oy, stick.r + 20, 0, TAU); ctx.fillStyle = color.alpha(THEME.ink, 0.5); ctx.fill();
          ctx.lineWidth = 5; ctx.strokeStyle = '#fff'; ctx.stroke();
          ctx.globalAlpha = stick.id != null ? 0.9 : 0.35;
          blob(ox + (stick.id != null ? stick.kx : 0), oy + (stick.id != null ? stick.ky : 0), 48, THEME.colors.gray);
          ctx.globalAlpha = 1;
        }
        for (const b of tbtn) {
          ctx.globalAlpha = b.id != null ? 0.95 : 0.6;
          blob(b.x, b.y + (b.id != null ? 4 : 0), b.r * (b.id != null ? 0.92 : 1), THEME.colors[b.color] || THEME.colors.purple);
          if (b.icon) icon(b.icon, b.x, b.y, b.r * 0.8); else text(b.label, b.x, b.y, { size: 44 });
          ctx.globalAlpha = 1;
        }
      },
    };
    return api;
  })();

  /* =======================================================================
     SCENES
     ======================================================================= */
  const scenes = (() => {
    const reg = {};
    let cur = null, name = null, busy = false;
    const fade = { a: 0 };
    function swap(n, params) {
      if (!reg[n]) { reportError(new Error('Unknown scene: ' + n), 'scenes.go'); return; }
      if (cur) { if (cur.gameplay) sdk.send('gameplayStop'); safeCall(cur, 'exit'); }
      ui.clearScene(); ui.clearModals(); fx.clear(); input.reset(); camera.reset(); sys.paused = false; hitstopT = 0; acc = 0;
      name = n; cur = reg[n];
      safeCall(cur, 'enter', params || {});
      safeCall(cur, 'layout', view);
      ui.place();
      if (cur.music !== undefined) { if (cur.music) music.play(cur.music); else music.stop(); }
      if (cur.gameplay) sdk.send('gameplayStart');
      sdk.send('scene', { name: n });
    }
    return {
      add(n, def) { reg[n] = def; return def; },
      has(n) { return !!reg[n]; },
      go(n, params, opts = {}) {
        if (busy) return;
        if (!cur || opts.instant) { swap(n, params); return; }
        busy = true;
        tween(fade, { a: 1 }, 0.16, Ease.inQuad).then(() => { swap(n, params); tween(fade, { a: 0 }, 0.22, Ease.outQuad).then(() => busy = false); });
      },
      get current() { return cur; },
      get name() { return name; },
      get list() { return Object.keys(reg); },
      fade,
      layout() { safeCall(cur, 'layout', view); ui.place(); },
    };
  })();

  /* =======================================================================
     ADS
     ======================================================================= */
  const devAd = { on: false, t: 0, kind: '', res: null };
  async function adBreak(kind = 'midgame') {
    if (sys.ad) return { shown: false, granted: false };
    sys.ad = true; input.reset(); updateDuck(); sdk.send('gameplayStop');
    let r = null;
    if (sdk.connected) r = await sdk.request('adBreak', { kind }, 90000);
    else if (!sdk.inFrame) r = await new Promise(res => { Object.assign(devAd, { on: true, t: kind === 'rewarded' ? 2 : 1, kind, res }); });
    sys.ad = false; updateDuck(); last = performance.now();
    if (scenes.current && scenes.current.gameplay && !sys.paused) sdk.send('gameplayStart');
    r = r || {};
    return { shown: !!r.shown, granted: kind === 'rewarded' && !!r.granted };
  }

  /* =======================================================================
     DEBUG
     ======================================================================= */
  const debug = { on: /[?&]debug/.test(location.search), fps: 60, steps: 0, low: 0 };

  /* ---------- system pause overlay widgets ---------- */
  ui.button({ group: 'sys', label: 'RESUME', icon: 'play', color: 'green', w: 400, h: 120, key: 'action', pulse: true,
    place: v => ({ x: v.w / 2, y: v.h / 2 + 10 }), onTap: resumeGame });
  ui.soundButton({ group: 'sys', place: v => ({ x: v.w / 2 - 130, y: v.h / 2 + 165 }) });
  ui.musicButton({ group: 'sys', place: v => ({ x: v.w / 2, y: v.h / 2 + 165 }) });
  const sysHome = ui.button({ group: 'sys', icon: 'home', color: 'red', w: 110, h: 110,
    place: v => ({ x: v.w / 2 + 130, y: v.h / 2 + 165 }),
    onTap: () => { const sc = scenes.current; sys.paused = false; safeCall(sc, 'onQuit'); } });

  /* =======================================================================
     MAIN LOOP — fixed-step sim (60 Hz), per-frame presentation
     ======================================================================= */
  const STEP = 1 / 60, MAX_STEPS = 6;
  let last = 0, acc = 0, clock = 0, frameN = 0;
  function frame(now) {
    requestAnimationFrame(frame);
    let dt = (now - last) / 1000; last = now;
    if (!(dt > 0)) dt = 0; if (dt > 0.1) dt = 0.1;
    if (dt > 0) debug.fps += (1 / dt - debug.fps) * 0.05;
    frameN++;
    // adaptive resolution: drop DPR if we're struggling
    if (frameN > 120 && debug.fps < 42 && view.dprCap > 1) { if (++debug.low > 90) { view.dprCap = Math.max(1, view.dprCap - 0.5); debug.low = 0; resize(); } } else debug.low = 0;
    if (devAd.on) { devAd.t -= dt; if (devAd.t <= 0) { devAd.on = false; devAd.res({ shown: true, granted: true }); } }
    sys.rotate = input.touch && ((MF.orientation === 'landscape' && view.fullH > view.fullW * 1.1) || (MF.orientation === 'portrait' && view.fullW > view.fullH * 1.1));
    const sc = scenes.current;
    input.poll();
    if (!sys.frozen && sc) {
      clock += dt;
      updateTweens(dt);
      ui.update(dt);
      ui.keys();
      if (!sys.simHalted) {
        let steps = 0;
        if (hitstopT > 0) hitstopT -= dt;
        else {
          acc += dt;
          while (acc >= STEP && steps < MAX_STEPS) {
            safeCall(sc, 'update', STEP); input.endStep(); acc -= STEP; steps++;
            if (scenes.current !== sc || sys.simHalted) break;
          }
          if (steps === MAX_STEPS) acc = 0;
        }
        debug.steps = steps;
        safeCall(sc, 'frame', dt);
        fx.update(dt);
      } else if (sys.modal && !sys.paused) { fx.update(dt); input.endStep(); }
      camera.update(dt, M.clamp(acc / STEP, 0, 1));
    }
    ui.place();
    render();
  }

  function render() {
    const s = view.dpr * view.scale, sc = scenes.current, alpha = M.clamp(acc / STEP, 0, 1);
    ctx = mainCtx;
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1;
    ctx.fillStyle = THEME.bg; ctx.fillRect(0, 0, canvas.width, canvas.height);
    const ox = view.ox, oy = view.oy;
    // world layer (shakes; camera)
    ctx.setTransform(s, 0, 0, s, (ox + fx.offset.x) * s, (oy + fx.offset.y) * s);
    if (sc) safeCall(sc, 'backdrop', ctx, alpha);
    ctx.save(); camera.apply(ctx);
    if (sc) safeCall(sc, 'render', ctx, alpha);
    fx.draw(false);
    ctx.restore();
    // screen layer (stable)
    ctx.setTransform(s, 0, 0, s, ox * s, oy * s);
    if (sc) safeCall(sc, 'hud', ctx, alpha);
    fx.draw(true);
    input.drawTouch();
    ui.draw('scene');
    fx.drawFlash();
    ui.drawModals();
    ui.drawToasts();
    if (sys.paused) {
      ctx.fillStyle = 'rgba(20,18,50,0.62)'; ctx.fillRect(-ox, -oy, view.fullW, view.fullH);
      panel(view.w / 2, view.h / 2 + 50, 540, 480, { title: 'PAUSED', color: 'purple' });
      sysHome.visible = !!(sc && sc.onQuit);
      ui.draw('sys');
    }
    if (sys.rotate) {
      ctx.fillStyle = THEME.bg; ctx.fillRect(-ox, -oy, view.fullW, view.fullH);
      ctx.save(); ctx.translate(view.w / 2, view.h / 2 - 60); ctx.rotate(Math.sin(clock * 3) * 0.6);
      block(-70, -110, 140, 220, 'blue', { r: 24 }); ctx.restore();
      text('Rotate your device', view.w / 2, view.h / 2 + 120, { size: 48, maxW: view.w - 60 });
    }
    if (devAd.on) {
      ctx.fillStyle = '#0d0c22'; ctx.fillRect(-ox, -oy, view.fullW, view.fullH);
      text('AD BREAK', view.w / 2, view.h / 2 - 50, { size: 72, color: '#ffe680' });
      text(`${devAd.kind} · dev stub · ${Math.ceil(devAd.t)}`, view.w / 2, view.h / 2 + 40, { size: 32, color: '#aab2c8' });
    }
    if (sys.crashed) {
      ctx.fillStyle = 'rgba(16,10,30,0.88)'; ctx.fillRect(-ox, -oy, view.fullW, view.fullH);
      icon('skull', view.w / 2, view.h / 2 - 170, 140, '#ff9a9a');
      text('Oops! The game crashed.', view.w / 2, view.h / 2 - 40, { size: 50, maxW: view.w - 60 });
      label(sys.crashed.where + ': ' + sys.crashed.message, view.w / 2, view.h / 2 + 40, { size: 26, color: '#ffb0b0', maxW: view.w - 60 });
      block(view.w / 2 - 190, view.h - 220, 380, 110, 'green', { r: 36 }); text('RESTART', view.w / 2, view.h - 170, { size: 48 });
    }
    if (scenes.fade.a > 0) { ctx.globalAlpha = scenes.fade.a; ctx.fillStyle = THEME.bg; ctx.fillRect(-ox, -oy, view.fullW, view.fullH); ctx.globalAlpha = 1; }
    if (debug.on) {
      const lines = [`${debug.fps | 0} fps · ${debug.steps} steps · ${fx.count} fx · ${spriteCache.size} spr`, `${view.w | 0}×${view.h | 0} @${(view.dpr * view.scale).toFixed(2)} · scene ${scenes.name} · k${KERNEL_VERSION}`];
      lines.forEach((l, i) => text(l, 12 - 0, 22 + i * 26 + view.safe.top, { size: 20, align: 'left', shadow: false, sw: 4 }));
    }
  }

  /* =======================================================================
     BOOT
     ======================================================================= */
  let booted = false;
  function boot(startScene, params) {
    if (booted) return; booted = true;
    // Title-card mode: the platform (window.SG_CARD) or a ?card URL boots a game's 'card' key-art scene for thumbnails.
    try { if ((window.SG_CARD || /[?&]card\b/.test(location.search)) && scenes.has('card')) startScene = 'card'; } catch (e) {}
    resize();
    window.addEventListener('resize', resize);
    if (window.visualViewport) visualViewport.addEventListener('resize', resize);
    document.addEventListener('visibilitychange', () => {
      sys.hidden = document.hidden;
      if (document.hidden) { pauseGame(); input.reset(); save.commit(); }
      updateDuck(); last = performance.now();
    });
    window.addEventListener('pagehide', () => save.commit());
    sdk.on('hello', d => {
      sdk.connected = true;
      if (d && d.save) { store.import(d.save); save.reload(); }
      if (d && typeof d.muted === 'boolean') { sys.platformMute = d.muted; updateDuck(); }
      if (d && d.debug) debug.on = true;
    });
    sdk.on('pause', () => { sys.platformPause = true; pauseGame(); updateDuck(); });
    sdk.on('resume', () => { sys.platformPause = false; updateDuck(); last = performance.now(); });
    sdk.on('mute', d => { sys.platformMute = !!(d && d.muted); updateDuck(); });
    sdk.on('debug', d => { debug.on = !!(d && d.on); });
    sdk.on('snapshot', d => {
      try {
        const w = (d && d.width) || 480, c = document.createElement('canvas'); c.width = w; c.height = Math.round(w * canvas.height / canvas.width);
        c.getContext('2d').drawImage(canvas, 0, 0, c.width, c.height);
        sdk.send('snapshot', { id: d && d.id, data: c.toDataURL('image/jpeg', 0.85) });
      } catch (err) { sdk.send('snapshot', { id: d && d.id, error: String(err) }); }
    });
    sdk.send('loadProgress', { p: 1 });
    scenes.go(startScene, params);
    sdk.send('ready', { game: MF.id, title: MF.title, version: MF.version, kernel: KERNEL_VERSION, orientation: MF.orientation, design: MF.design });
    last = performance.now();
    requestAnimationFrame(frame);
  }

  setTheme(MF.theme);

  return {
    VERSION: KERNEL_VERSION, MANIFEST: MF,
    // core
    M, rng, hashSeed, dailySeed, noise, color, fmt, fmtTime, compact, clone, Ease, tween, wait, spring,
    view, THEME, THEMES, setTheme, store, save, meta, sdk, audio, music, haptic, input, camera, fx, ui, scenes, adBreak, boot, fsm,
    // systems
    col, SpatialHash, Physics, Tilemap, Grid, Heap, path,
    draw: { text, label, measure, wrap, paragraph, rr, rrp, starPath, blob, blobS, block, critter, star, poly, line, capsule, arrow, dots,
      panel, card, bar, pill, hearts, sky, vignette, glow, icon, sprite, drawSprite: (s, x, y, o) => spriteCache.draw(s, x, y, o) },
    pause: pauseGame, resume: resumeGame,
    setHaptics(v) { hapticsOn = !!v; store.set('haptics', hapticsOn); }, get haptics() { return hapticsOn; },
    get time() { return clock; },
    get paused() { return sys.paused; },
    get debug() { return debug; },
    get errors() { return errors; },
  };
})();
//#KERNEL-END
</script>
<script>
"use strict";
/* §3 GAME — Orbit Hop: circle a planet, tap to leap through the orbit window to the next one. */

const TAU = K.M.TAU, M = K.M;
const GAL_N = 12;                 // planets per galaxy
const V_FLY = 950;                // launch speed (px/s)
const HOLE_KILL = 40;

/* ---------- 3a. DATA ---------- */
const GALAXIES = [
  { name: 'Nebula Nursery', sky: ['#24104f', '#06030f'], neb: ['#b44cff', '#ff3cc7'], planets: ['#22d3ff', '#ff3cc7', '#ffb02e', '#7cff6b'] },
  { name: 'Cyan Drift', sky: ['#05324a', '#010810'], neb: ['#22d3ff', '#22ff88'], planets: ['#22ff88', '#7ad8ff', '#a77bff', '#ffe600'] },
  { name: 'Solar Bloom', sky: ['#4a1426', '#0f0306'], neb: ['#ff8c1a', '#ff2e63'], planets: ['#ffcf3a', '#ff6a3d', '#ff3cc7', '#5ee7ff'] },
  { name: 'Emerald Void', sky: ['#063a22', '#010a05'], neb: ['#22ff88', '#d4ff3a'], planets: ['#b6ff3a', '#22e6c4', '#ffe600', '#ff7ad1'] },
  { name: 'Crimson Rift', sky: ['#4a0718', '#0a0104'], neb: ['#ff2e63', '#b44cff'], planets: ['#ff4b6e', '#ffa63d', '#c47bff', '#4be1ff'] },
  { name: 'Ultraviolet Abyss', sky: ['#1a0850', '#000000'], neb: ['#7a3cff', '#22d3ff'], planets: ['#8f5bff', '#22d3ff', '#ff3cc7', '#e0e3ff'] },
  { name: 'Golden Halo', sky: ['#3d2e06', '#080600'], neb: ['#ffe600', '#ff8c1a'], planets: ['#ffe600', '#ff8c1a', '#22ff88', '#ff3cc7'] },
];
const gal = g => GALAXIES[g % GALAXIES.length];
const galName = g => gal(g).name + (g >= GALAXIES.length ? ' ' + ['', 'II', 'III', 'IV', 'V', 'VI'][Math.min(5, Math.floor(g / GALAXIES.length))] : '');

const SKINS = [
  { id: 'blip',   name: 'Blip',   col: '#22d3ff', trail: '#7ae8ff', acc: 'none' },
  { id: 'mochi',  name: 'Mochi',  col: '#ff5cc8', trail: '#ffb0e6', acc: 'ears', cost: 40 },
  { id: 'zap',    name: 'Zap',    col: '#ffe600', trail: '#fffbb0', acc: 'antenna', cost: 100, shape: 'spark' },
  { id: 'glorp',  name: 'Glorp',  col: '#22ff88', trail: '#b0ffd0', acc: 'stalks', cost: 180 },
  { id: 'saucer', name: 'Saucer', col: '#b44cff', trail: '#ebc4ff', acc: 'saucer', cost: 300 },
  { id: 'comet',  name: 'Comet',  col: '#ff8c1a', trail: '#ffcf6a', acc: 'flame', ms: { planets: 20 }, msText: 'Reach planet 20' },
  { id: 'astro',  name: 'Astro',  col: '#e8ecff', trail: '#9fdcff', acc: 'helmet', ms: { galaxy: 3 }, msText: 'Find galaxy 4' },
  { id: 'void',   name: 'Void',   col: '#3a2470', trail: '#ffe600', acc: 'crown', shape: 'star', ms: { combo: 8 }, msText: 'Perfect combo x8' },
];
const skinById = id => SKINS.find(k => k.id === id) || SKINS[0];

const ACH = [
  { id: 'first',   name: 'Lift Off',         desc: 'Hop to your first planet' },
  { id: 'perfect', name: 'Bullseye',         desc: 'Land a PERFECT hop' },
  { id: 'combo5',  name: 'On Fire',          desc: 'Reach a x5 perfect combo' },
  { id: 'p25',     name: 'Star Sailor',      desc: 'Reach planet 25' },
  { id: 'gal2',    name: 'Galaxy Hopper',    desc: 'Discover the 2nd galaxy' },
  { id: 'p60',     name: 'Deep Space',       desc: 'Reach planet 60' },
  { id: 'dust100', name: 'Stardust Hoarder', desc: 'Collect 100 stardust in total' },
  { id: 'hole',    name: 'Event Horizon',    desc: 'Land a hop bent by a black hole' },
  { id: 'belt',    name: 'Rock Dodger',      desc: 'Cross 10 asteroid belts in total' },
  { id: 'warp',    name: 'Warp Speed',       desc: 'Fly through 5 warp rings in total' },
  { id: 'cont',    name: 'Second Wind',      desc: 'Use a continue' },
  { id: 'skins4',  name: 'Fashionista',      desc: 'Own 4 critters' },
  { id: 'score1k', name: 'Big Numbers',      desc: 'Score 1,000 in one run' },
  { id: 'runs10',  name: 'Frequent Flyer',   desc: 'Play 10 runs' },
];

const SAVE = K.save.define({ version: 1, defaults: {
  best: 0, bestPlanet: 0, maxGalaxy: 0, tut: 0, ach: {},
  stats: { runs: 0, hops: 0, dust: 0, perfects: 0, belts: 0, warps: 0, bestCombo: 0 },
} });
if (!K.meta.unlocks.has('blip')) { K.meta.unlocks.grant('blip'); K.meta.unlocks.select('skin', 'blip'); K.save.commit(); }

/* ---------- 3b. SIMULATION (pure: no drawing, no audio, no Math.random) ---------- */
const plX = (pl, t) => pl.bx + (pl.amp ? pl.amp * Math.sin(t * pl.osp + pl.oph) : 0);
const plR = (pl, t) => pl.r0 * (1 + (pl.pulse ? pl.pulse * Math.sin(t * pl.ps) : 0));
const orbitR = pl => pl.r0 * (1 + pl.pulse) + 40;
const capR = (pl, t) => Math.max(orbitR(pl) + 14, plR(pl, t) + pl.cap);
const rockX = (rk, t) => M.wrap(rk.x0 + rk.vx * t + 300, 1320) - 300;
const diffK = i => M.clamp((i - 5) / 65, 0, 1);

const Sim = {
  create(seed) {
    const s = { rng: K.rng(seed), t: 0, mode: 'orbit', planets: [], rocks: [], holes: [], dust: [], rings: [], belts: [],
      cur: 0, reached: 0, score: 0, combo: 0, maxCombo: 0, perfects: 0, dustRun: 0, galaxy: 0, lockT: 0.3,
      nextId: 1, cause: null, continued: false, events: [],
      p: { x: 0, y: 0, px: 0, py: 0, vx: 0, vy: 0, ang: 2.4, rad: 140, radT: 140, dir: 1, from: 0, flyT: 0, bent: false, ring: -1 } };
    s.planets.push({ i: 0, bx: 360, y: 0, r0: 95, amp: 0, osp: 0, oph: 0, pulse: 0, ps: 0, w: 2.4, cap: 90, style: 0, col: 0, g: 0, ring: false, spin: 0.2 });
    while (s.planets[s.planets.length - 1].y > -2600) Sim.gen(s);
    const p = s.p, pl = s.planets[0];
    p.rad = p.radT = orbitR(pl);
    p.x = p.px = pl.bx + Math.cos(p.ang) * p.rad; p.y = p.py = pl.y + Math.sin(p.ang) * p.rad;
    return s;
  },
  emit(s, type, d = {}) { d.type = type; s.events.push(d); },
  pl(s, i) { return s.planets[i - s.planets[0].i]; },
  gen(s) {
    const r = s.rng, prev = s.planets[s.planets.length - 1], i = prev.i + 1, k = diffK(i);
    const r0 = M.lerp(84, 52, k) * r.range(0.9, 1.1);
    const gap = M.lerp(420, 560, k) + r.range(-30, 30);
    const pl = { i, bx: 0, y: prev.y - gap, r0, amp: 0, osp: 0, oph: 0, pulse: 0, ps: 0,
      w: M.lerp(2.6, 3.6, k) * r.range(0.94, 1.06), cap: M.lerp(88, 50, k), style: r.int(0, 3), col: (prev.col + r.int(1, 3)) % 4,
      g: Math.floor(i / GAL_N), ring: r.chance(0.3), spin: r.range(-0.4, 0.4) };
    if (i > 9 && r.chance(M.lerp(0.25, 0.55, k))) { pl.amp = r.range(50, M.lerp(90, 150, k)); pl.osp = r.range(0.7, 1.2) * M.lerp(1, 1.5, k); pl.oph = r.range(0, TAU); }
    if (i > 17 && r.chance(0.3)) { pl.pulse = M.lerp(0.14, 0.24, k); pl.ps = r.range(1.6, 2.6); }
    const margin = orbitR(pl) + 32 + pl.amp;
    const lo = Math.min(360, margin), hi = Math.max(360, 720 - margin);
    const dx = r.sign() * r.range(90, M.lerp(220, 300, k));
    let bx = prev.bx + dx; if (bx < lo || bx > hi) bx = prev.bx - dx;
    pl.bx = M.clamp(bx, lo, hi);
    s.planets.push(pl);
    // ---- what lives in the gap between prev and pl ----
    const ax = prev.bx, ay = prev.y, bx2 = pl.bx, by = pl.y, mx = (ax + bx2) / 2, my = (ay + by) / 2;
    const ux = bx2 - ax, uy = by - ay, ul = Math.hypot(ux, uy), nx = -uy / ul, ny = ux / ul;
    let hazard = false;
    if (i > 24 && r.chance(M.lerp(0.3, 0.5, k))) {         // asteroid belt
      hazard = true;
      const id = s.nextId++, n = r.int(4, 5) + Math.round(k * 2), vx = r.sign() * r.range(70, 130) * M.lerp(1, 1.5, k), off = r.range(0, 1320);
      s.belts.push({ id, y: my, crossed: false });
      for (let j = 0; j < n; j++) s.rocks.push({ id: s.nextId++, x0: off + j * 1320 / n + r.range(-30, 30), y: my + r.range(-14, 14), vx, r: r.range(26, 36), v: r.int(0, 2), spin: r.range(-2, 2) });
    } else if (i > 32 && r.chance(0.28)) {                  // black hole beside the lane
      const side = r.sign(), hx = M.clamp(mx + side * r.range(150, 220), 60, 660), hy = my + r.range(-40, 40);
      if (M.dist(hx, hy, ax, ay) > orbitR(prev) + 120 && M.dist(hx, hy, bx2, by) > orbitR(pl) + 120) {
        hazard = true; s.holes.push({ id: s.nextId++, x: hx, y: hy, gm: r.range(2.2e7, 3.0e7) });
      }
    }
    if (!hazard && i > 14 && r.chance(0.22)) s.rings.push({ id: s.nextId++, x: M.lerp(ax, bx2, 0.55), y: M.lerp(ay, by, 0.55) });
    const nd = r.int(1, 3);
    for (let j = 0; j < nd; j++) {
      const f = 0.35 + (nd === 1 ? 0.15 : j * 0.3 / (nd - 1)), o = r.range(-16, 16);
      s.dust.push({ id: s.nextId++, x: M.lerp(ax, bx2, f) + nx * o, y: M.lerp(ay, by, f) + ny * o, taken: false });
    }
    if (i % 4 === 2) {                                       // risky off-lane cluster
      const sd = r.sign() * r.range(95, 130);
      for (let j = 0; j < 3; j++) { const f = 0.4 + j * 0.1; s.dust.push({ id: s.nextId++, x: M.lerp(ax, bx2, f) + nx * sd, y: M.lerp(ay, by, f) + ny * sd, taken: false }); }
    }
  },
  // Advance a flying body b by dt from time t. Shared by the live sim and by trajectory prediction.
  flyStep(s, b, t, dt, live) {
    const SUB = 4, h = dt / SUB, from = Sim.pl(s, b.from);
    for (let k = 0; k < SUB; k++) {
      const tt = t + h * (k + 1), oy = b.y;
      for (const ho of s.holes) {
        const dx = ho.x - b.x, dy = ho.y - b.y;
        if (dx > 560 || dx < -560 || dy > 560 || dy < -560) continue;
        const d2 = dx * dx + dy * dy, d = Math.sqrt(d2);
        if (d < HOLE_KILL) return { type: 'dead', cause: 'hole', x: ho.x, y: ho.y };
        if (d < 560) { const a = Math.min(ho.gm / d2, 6000); b.vx += dx / d * a * h; b.vy += dy / d * a * h; if (a > 260) b.bent = true; }
      }
      b.x += b.vx * h; b.y += b.vy * h;
      for (const rk of s.rocks) {
        if (Math.abs(rk.y - b.y) > rk.r + 22) continue;
        const rx = rockX(rk, tt), rr = rk.r + 20;
        if ((rx - b.x) * (rx - b.x) + (rk.y - b.y) * (rk.y - b.y) < rr * rr) return { type: 'dead', cause: 'rock', x: rx, y: rk.y };
      }
      for (const rg of s.rings) {
        if (rg.id === b.ring) continue;
        if ((rg.x - b.x) * (rg.x - b.x) + (rg.y - b.y) * (rg.y - b.y) < 60 * 60) {
          b.ring = rg.id; b.vx *= 1.4; b.vy *= 1.4;
          if (live) { s.score += 15; Sim.emit(s, 'warp', { x: rg.x, y: rg.y }); }
        }
      }
      if (live) {
        for (const d of s.dust) if (!d.taken && (d.x - b.x) * (d.x - b.x) + (d.y - b.y) * (d.y - b.y) < 50 * 50) { d.taken = true; s.dustRun++; Sim.emit(s, 'dust', { x: d.x, y: d.y }); }
        for (const bl of s.belts) if (!bl.crossed && oy > bl.y && b.y <= bl.y) { bl.crossed = true; Sim.emit(s, 'belt', { y: bl.y }); }
      }
      for (let i = b.from - 1; i <= b.from + 3; i++) {
        if (i === b.from) continue;
        const pl = Sim.pl(s, i); if (!pl) continue;
        const dx = plX(pl, tt) - b.x, dy = pl.y - b.y, R = capR(pl, tt);
        if (dx * dx + dy * dy < R * R) {
          const sp = Math.hypot(b.vx, b.vy) || 1, miss = Math.abs(dx * b.vy - dy * b.vx) / sp;
          return { type: 'land', i, miss, perfect: miss < pl.r0 * 0.45 + 6 };
        }
      }
    }
    b.flyT += dt;
    const far = Sim.pl(s, b.from + 2) || Sim.pl(s, b.from + 1);
    if (b.flyT > 2.6 || b.x < -260 || b.x > 980 || b.y > from.y + 650 || (far && b.y < far.y - 500)) return { type: 'dead', cause: 'lost' };
    return null;
  },
  // Pure prediction of a launch at angle `ang` and time t0 (does not touch s).
  trace(s, ang, rad, t0, maxT, pts, maxLen) {
    const pl = Sim.pl(s, s.cur), dir = s.p.dir, px = plX(pl, t0);
    const b = { x: px + Math.cos(ang) * rad, y: pl.y + Math.sin(ang) * rad, vx: -Math.sin(ang) * dir * V_FLY, vy: Math.cos(ang) * dir * V_FLY,
      from: s.cur, flyT: 0, bent: false, ring: -1 };
    let t = t0, len = 0, acc = 0;
    if (pts) pts.push(b.x, b.y);
    while (b.flyT < maxT) {
      const ox = b.x, oy = b.y;
      const r = Sim.flyStep(s, b, t, 1 / 60, false); t += 1 / 60;
      if (pts && len < maxLen) { const d = Math.hypot(b.x - ox, b.y - oy); len += d; acc += d; if (acc >= 34) { acc = 0; pts.push(b.x, b.y); } }
      if (r) { r.bent = b.bent; return r; }
    }
    return { type: 'dead', cause: 'lost' };
  },
  step(s, dt, cmd) {
    s.t += dt;
    const p = s.p; p.px = p.x; p.py = p.y;
    const cur = Sim.pl(s, s.cur);
    while (s.planets[s.planets.length - 1].y > cur.y - 2600) Sim.gen(s);
    while (s.planets[0].i < s.cur - 2) s.planets.shift();
    const cutY = cur.y + 1400;
    if (s.t % 1 < dt) { K.compact(s.rocks, o => o.y < cutY); K.compact(s.dust, o => o.y < cutY); K.compact(s.holes, o => o.y < cutY); K.compact(s.rings, o => o.y < cutY); K.compact(s.belts, o => o.y < cutY); }
    if (s.mode === 'orbit') {
      p.ang += p.dir * cur.w * dt;
      p.rad = M.damp(p.rad, p.radT, 12, dt);
      p.x = plX(cur, s.t) + Math.cos(p.ang) * p.rad; p.y = cur.y + Math.sin(p.ang) * p.rad;
      s.lockT -= dt;
      if (cmd && cmd.tap && s.lockT <= 0) {
        p.vx = -Math.sin(p.ang) * p.dir * V_FLY; p.vy = Math.cos(p.ang) * p.dir * V_FLY;
        p.from = s.cur; p.flyT = 0; p.bent = false; p.ring = -1;
        s.mode = 'fly';
        Sim.emit(s, 'jump', { x: p.x, y: p.y, vx: p.vx, vy: p.vy });
      }
    } else if (s.mode === 'fly') {
      const r = Sim.flyStep(s, p, s.t - dt, dt, true);
      if (r && r.type === 'land') Sim.land(s, r);
      else if (r) { s.mode = 'dead'; s.cause = r.cause; s.deadAt = { x: r.x, y: r.y }; s.over = true; Sim.emit(s, 'dead', { cause: r.cause, x: p.x, y: p.y }); }
    } else if (s.mode === 'dead') {
      if (s.cause === 'hole') { p.x = M.damp(p.x, s.deadAt.x, 6, dt); p.y = M.damp(p.y, s.deadAt.y, 6, dt); }
      else if (s.cause === 'rock') { p.vy += 900 * dt; p.x += p.vx * 0.15 * dt; p.y += p.vy * 0.25 * dt; }
      else { p.x += p.vx * 0.6 * dt; p.y += p.vy * 0.6 * dt; }
    }
  },
  land(s, r) {
    const p = s.p, pl = Sim.pl(s, r.i), cx = plX(pl, s.t);
    const rx = p.x - cx, ry = p.y - pl.y;
    p.ang = Math.atan2(ry, rx); p.rad = Math.hypot(rx, ry); p.radT = orbitR(pl);
    p.dir = (-Math.sin(p.ang) * p.vx + Math.cos(p.ang) * p.vy) >= 0 ? 1 : -1;
    s.mode = 'orbit'; s.lockT = 0.14; s.cur = r.i;
    const fresh = r.i > s.reached;
    let pts = 0, skip = 0, newGal = false;
    if (fresh) {
      skip = r.i - s.reached - 1; s.reached = r.i;
      if (r.perfect) { s.combo++; s.perfects++; s.dustRun++; s.maxCombo = Math.max(s.maxCombo, s.combo); } else s.combo = 0;
      pts = 10 * Math.min(1 + s.combo, 8) + skip * 20;
      s.score += pts;
      const g = Math.floor(r.i / GAL_N);
      if (g > s.galaxy) { s.galaxy = g; newGal = true; }
    }
    Sim.emit(s, 'land', { x: p.x, y: p.y, cx, cy: pl.y, r: pl.r0, i: r.i, fresh, perfect: fresh && r.perfect, combo: s.combo, pts, skip, bent: p.bent, newGal, g: s.galaxy });
  },
  revive(s) {
    const pl = Sim.pl(s, s.cur), p = s.p;
    s.mode = 'orbit'; s.over = false; s.cause = null; s.combo = 0; s.lockT = 0.6; s.continued = true; s.events.length = 0;
    p.radT = orbitR(pl); p.rad = p.radT + 140;
    p.x = p.px = plX(pl, s.t) + Math.cos(p.ang) * p.rad; p.y = p.py = pl.y + Math.sin(p.ang) * p.rad;
  },
};

/* ---------- 3c. PRESENTATION HELPERS (read-only views of the sim) ---------- */
let runCount = 0;
const T = () => K.time;
function award(id) {
  if (SAVE.ach[id]) return;
  SAVE.ach[id] = 1; K.save.later();
  const a = ACH.find(x => x.id === id);
  K.ui.toast('Award: ' + a.name, { icon: 'trophy', iconColor: '#ffe600', dur: 2.4 });
  K.audio.play('award');
}
function ownedCount() { return SKINS.filter(k => K.meta.unlocks.has(k.id)).length; }
function grantSkin(id) {
  if (K.meta.unlocks.grant(id)) {
    K.ui.toast('New critter: ' + skinById(id).name + '!', { icon: 'star', iconColor: skinById(id).col, dur: 2.6 });
    K.audio.play('levelup');
    if (ownedCount() >= 4) award('skins4');
  }
}
function checkMilestones(s) {
  if (s.reached >= 20) grantSkin('comet');
  if (s.galaxy >= 3) grantSkin('astro');
  if (s.maxCombo >= 8) grantSkin('void');
}

/* ---- audio ---- */
K.audio.define('hop', () => { K.audio.tone({ wave: 'triangle', f0: 280, f1: 820, dur: 0.13, vol: 0.22 }); K.audio.tone({ noise: true, dur: 0.16, vol: 0.07, hp: 2500, attack: 0.02 }); });
K.audio.define('capture', (p = 1) => { K.audio.tone({ wave: 'sine', f0: 523 * p, dur: 0.16, vol: 0.2 }); K.audio.tone({ wave: 'triangle', f0: 784 * p, dur: 0.2, vol: 0.12, delay: 0.05 }); });
K.audio.define('perfect', (n = 1) => { const b = 523 * Math.pow(2, Math.min(n, 12) / 12); [1, 1.25, 1.5, 2].forEach((m, i) => K.audio.tone({ wave: 'sine', f0: b * m, dur: 0.25, vol: 0.16, delay: i * 0.045 })); });
K.audio.define('dust', (p = 1) => K.audio.tone({ wave: 'sine', f0: 1500 * p, f1: 2300 * p, dur: 0.08, vol: 0.12 }));
K.audio.define('warp', () => { K.audio.tone({ wave: 'sawtooth', f0: 220, f1: 1500, dur: 0.32, vol: 0.12, filter: 3200 }); K.audio.tone({ noise: true, dur: 0.3, vol: 0.12, hp: 1500 }); });
K.audio.define('lost', () => K.audio.tone({ wave: 'triangle', f0: 620, f1: 110, dur: 0.9, vol: 0.25 }));
K.audio.define('suck', () => { K.audio.tone({ wave: 'sine', f0: 420, f1: 35, dur: 1.0, vol: 0.35 }); K.audio.tone({ noise: true, dur: 0.8, vol: 0.2, filter: 500, attack: 0.2 }); });
K.audio.define('award', () => [784, 988, 1319].forEach((f, i) => K.audio.tone({ wave: 'triangle', f0: f, dur: 0.22, vol: 0.14, delay: i * 0.07 })));

/* ---- music: chill, menu quieter than gameplay ---- */
(() => {
  const hold = (n, len) => [n].concat(Array(len - 1).fill('-')).join(' ');
  const bars = f => ['A', 'F', 'C', 'G'].map(f).join(' ');

/* ---- sprites ---- */
function planetSprite(pl) {
  const rq = Math.max(20, Math.round(pl.r0 / 3) * 3), col = gal(pl.g).planets[pl.col];
  const key = 'pl:' + pl.style + ':' + col + ':' + rq + ':' + (pl.ring ? 1 : 0);
  const W = pl.ring ? rq * 3.4 : rq * 2, H = pl.ring ? rq * 2.2 : rq * 2;
  return K.draw.sprite(key, W, H, (g) => {
    const cx = W / 2, cy = H / 2, pal = K.color.pal(col), ink = K.THEME.ink;
    const ringPath = (a0, a1) => { g.beginPath(); g.ellipse(cx, cy, rq * 1.62, rq * 0.42, -0.32, a0, a1); };
    if (pl.ring) { ringPath(Math.PI, TAU); g.lineWidth = rq * 0.2; g.strokeStyle = ink; g.stroke(); g.lineWidth = rq * 0.12; g.strokeStyle = K.color.alpha(pal[0], 0.9); g.stroke(); }
    K.draw.blob(cx, cy, rq, pal, { shine: false, outline: 0 });
    g.save(); g.beginPath(); g.arc(cx, cy, rq, 0, TAU); g.clip();
    const dk = K.color.alpha(pal[2], 0.55), lt = K.color.alpha(pal[0], 0.45);
    if (pl.style === 0) { for (let i = -2; i <= 2; i++) { g.fillStyle = i % 2 ? dk : lt; g.fillRect(cx - rq, cy + i * rq * 0.36 - rq * 0.09, rq * 2, rq * 0.18); } }
    else if (pl.style === 1) { [[-0.35, -0.3, 0.26], [0.35, 0.15, 0.2], [-0.1, 0.45, 0.15], [0.45, -0.45, 0.12]].forEach(([x, y, r]) => { g.beginPath(); g.arc(cx + x * rq, cy + y * rq, r * rq, 0, TAU); g.fillStyle = dk; g.fill(); g.beginPath(); g.arc(cx + x * rq - r * rq * 0.2, cy + y * rq - r * rq * 0.2, r * rq * 0.7, 0, TAU); g.fillStyle = K.color.alpha(pal[1], 0.8); g.fill(); }); }
    else if (pl.style === 2) { g.beginPath(); g.ellipse(cx + rq * 0.25, cy + rq * 0.2, rq * 0.38, rq * 0.22, -0.2, 0, TAU); g.fillStyle = dk; g.fill(); g.beginPath(); g.ellipse(cx + rq * 0.25, cy + rq * 0.2, rq * 0.2, rq * 0.1, -0.2, 0, TAU); g.fillStyle = lt; g.fill(); g.fillStyle = dk; g.fillRect(cx - rq, cy - rq * 0.45, rq * 2, rq * 0.14); }
    else { g.fillStyle = 'rgba(255,255,255,0.55)'; g.beginPath(); g.ellipse(cx, cy - rq * 0.95, rq * 0.75, rq * 0.32, 0, 0, TAU); g.fill(); g.beginPath(); g.ellipse(cx, cy + rq, rq * 0.6, rq * 0.25, 0, 0, TAU); g.fill(); }
    g.beginPath(); g.arc(cx + rq * 0.35, cy + rq * 0.35, rq * 1.05, 0, TAU); g.fillStyle = 'rgba(0,0,0,0.0)'; g.fill();
    const sh = g.createRadialGradient(cx - rq * 0.4, cy - rq * 0.4, rq * 0.2, cx, cy, rq * 1.05); sh.addColorStop(0, 'rgba(255,255,255,0.12)'); sh.addColorStop(0.7, 'rgba(0,0,0,0)'); sh.addColorStop(1, 'rgba(0,0,10,0.45)');
    g.fillStyle = sh; g.fillRect(cx - rq, cy - rq, rq * 2, rq * 2);
    g.restore();
    g.beginPath(); g.arc(cx, cy, rq, 0, TAU); g.lineWidth = Math.max(4, rq * 0.08); g.strokeStyle = ink; g.stroke();
    g.beginPath(); g.ellipse(cx - rq * 0.38, cy - rq * 0.45, rq * 0.26, rq * 0.13, -0.6, 0, TAU); g.fillStyle = 'rgba(255,255,255,0.6)'; g.fill();
    if (pl.ring) { ringPath(0, Math.PI); g.lineWidth = rq * 0.2; g.strokeStyle = ink; g.stroke(); g.lineWidth = rq * 0.12; g.strokeStyle = K.color.alpha(pal[0], 0.95); g.stroke(); }
  }, { pad: 46 });
}
function dustSprite() {

function rockSprite(v, r) {

    const rr = K.rng(v * 31 + rq), pts = [];

    K.draw.poly(pts, '#6d5a8f', { outline: 5 });
    g.fillStyle = '#4a3a66'; [[0.7, 0.8, 0.22], [1.3, 1.1, 0.16], [0.95, 1.35, 0.12]].forEach(([x, y, s]) => { g.beginPath(); g.arc(x * rq, y * rq, s * rq, 0, TAU); g.fill(); });
    g.fillStyle = 'rgba(255,255,255,0.25)'; g.beginPath(); g.ellipse(rq * 0.75, rq * 0.6, rq * 0.3, rq * 0.14, -0.6, 0, TAU); g.fill();

function nebulaSprite(c) {

    for (let i = 0; i < 3; i++) {

/* ---- the hero ---- */
function drawCritter(skin, x, y, r, o = {}) {
  const g = o.ctx;
  g.save(); g.translate(x, y); g.rotate(o.rot || 0); g.scale(o.sx || 1, o.sy || 1);
  const pal = K.color.pal(skin.col), ink = K.THEME.ink, t = o.t != null ? o.t : T();
  // behind-body accessories
  if (skin.acc === 'ears') { for (const sx of [-1, 1]) { K.draw.poly([sx * r * 0.95, -r * 0.2, sx * r * 0.95, -r * 1.45, sx * r * 0.2, -r * 0.88], pal[1], { outline: 5 }); K.draw.poly([sx * r * 0.8, -r * 0.5, sx * r * 0.82, -r * 1.12, sx * r * 0.42, -r * 0.85], '#ffd1ee', { outline: 0 }); } }
  if (skin.acc === 'antenna') { K.draw.line([0, -r * 0.8, r * 0.15, -r * 1.45], ink, 4, { outline: 0 }); K.draw.blob(r * 0.17, -r * 1.5, r * 0.22, ['#ffffff', '#ff2e63', '#a8002f'], { outline: 3 }); }
  if (skin.acc === 'stalks') { for (const sx of [-1, 1]) { K.draw.line([sx * r * 0.35, -r * 0.7, sx * r * 0.6, -r * 1.35], pal[1], 7, { outline: 4 }); K.draw.blob(sx * r * 0.62, -r * 1.42, r * 0.26, ['#ffffff', '#ffffff', '#c8c8d8'], { outline: 3, shine: false, glow: false }); g.beginPath(); g.arc(sx * r * 0.62, -r * 1.4, r * 0.11, 0, TAU); g.fillStyle = ink; g.fill(); } }
  if (skin.acc === 'saucer') { g.beginPath(); g.ellipse(0, r * 0.25, r * 1.55, r * 0.42, 0, Math.PI, TAU); g.lineWidth = 9; g.strokeStyle = ink; g.stroke(); g.lineWidth = 5; g.strokeStyle = '#e0e3ff'; g.stroke(); }
  if (skin.acc === 'flame') { const f = 1 + 0.15 * Math.sin(t * 30); K.draw.poly([-r * 0.6, r * 0.3, 0, r * (1.9 * f), r * 0.6, r * 0.3], '#ff2e63', { outline: 4 }); K.draw.poly([-r * 0.35, r * 0.4, 0, r * (1.4 * f), r * 0.35, r * 0.4], '#ffe600', { outline: 0 }); }
  K.draw.critter(0, 0, r, pal, { mood: o.mood, look: o.look });
  // front accessories
  if (skin.acc === 'saucer') { g.beginPath(); g.ellipse(0, r * 0.25, r * 1.55, r * 0.42, 0, 0, Math.PI); g.lineWidth = 9; g.strokeStyle = ink; g.stroke(); g.lineWidth = 5; g.strokeStyle = '#e0e3ff'; g.stroke(); for (let i = 0; i < 5; i++) { const a = (i / 5 + t * 0.6) % 1 * Math.PI; g.beginPath(); g.arc(Math.cos(a) * r * 1.4, r * 0.25 + Math.sin(a) * r * 0.38, 4, 0, TAU); g.fillStyle = i % 2 ? '#ffe600' : '#22ff88'; g.fill(); } }
  if (skin.acc === 'helmet') { g.beginPath(); g.arc(0, 0, r * 1.22, 0, TAU); g.fillStyle = 'rgba(160,230,255,0.18)'; g.fill(); g.lineWidth = 5; g.strokeStyle = ink; g.stroke(); g.lineWidth = 3; g.strokeStyle = 'rgba(200,240,255,0.8)'; g.stroke(); g.beginPath(); g.ellipse(-r * 0.5, -r * 0.6, r * 0.32, r * 0.14, -0.7, 0, TAU); g.fillStyle = 'rgba(255,255,255,0.7)'; g.fill(); }
  if (skin.acc === 'crown') { K.draw.poly([-r * 0.55, -r * 0.75, -r * 0.6, -r * 1.25, -r * 0.28, -r * 1.0, 0, -r * 1.4, r * 0.28, -r * 1.0, r * 0.6, -r * 1.25, r * 0.55, -r * 0.75], '#ffe600', { outline: 4 }); g.beginPath(); g.arc(0, -r * 1.05, r * 0.1, 0, TAU); g.fillStyle = '#ff2e63'; g.fill(); }
  if (o.mood === 'happy' || o.mood == null) { g.globalAlpha = 0.45; g.fillStyle = '#ff7ab8'; g.beginPath(); g.ellipse(-r * 0.52, r * 0.28, r * 0.14, r * 0.08, 0, 0, TAU); g.ellipse(r * 0.52, r * 0.28, r * 0.14, r * 0.08, 0, 0, TAU); g.fill(); g.globalAlpha = 1; }
  g.restore();
}

/* ---- world backdrop ---- */
const STARS = (() => { const r = K.rng(99), a = []; for (let i = 0; i < 150; i++) a.push({ x: r.range(0, 1400), y: r.range(0, 1800), s: r.range(1.2, 3.6), l: i % 3, tw: r.range(0, TAU) }); return a; })();
function spaceBackdrop(ctx, gi, camY) {
  const v = K.view, G0 = gal(Math.floor(gi)), G1 = gal(Math.floor(gi) + 1), f = gi - Math.floor(gi);
  const top = f > 0 ? K.color.mix(G0.sky[0], G1.sky[0], f) : G0.sky[0], bot = f > 0 ? K.color.mix(G0.sky[1], G1.sky[1], f) : G0.sky[1];
  K.draw.sky(top, bot);
  const x0 = -v.ox, W = v.fullW;
  // nebulae (slow parallax)
  const nb = [G0.neb[0], G0.neb[1]];
  for (let i = 0; i < 4; i++) {
    const py = M.wrap(i * 520 - camY * 0.06, 2080) - 520, px = x0 + M.wrap(i * 430 + 120, W + 300) - 300;
    ctx.globalAlpha = 1 - f * 0.6;
    K.draw.drawSprite(nebulaSprite(nb[i % 2]), px, py, { scale: 1.6 });
    if (f > 0) { ctx.globalAlpha = f; K.draw.drawSprite(nebulaSprite(G1.neb[i % 2]), px, py, { scale: 1.6 }); }
  }
  ctx.globalAlpha = 1;
  // star layers
  const par = [0.04, 0.12, 0.25], t = T();
  for (const st of STARS) {
    const y = M.wrap(st.y - camY * par[st.l], 1800) - 260;
    if (y > v.h + v.oy + 10) continue;
    const x = x0 + M.wrap(st.x, 1400) * (W / 1400);
    ctx.globalAlpha = 0.45 + 0.4 * Math.sin(t * 2 + st.tw) * (st.l === 0 ? 1 : 0.3) + st.l * 0.1;
    ctx.fillStyle = st.l === 2 ? '#ffffff' : st.l === 1 ? '#cfe8ff' : '#ffe9ff';
    const s = st.s * (0.6 + st.l * 0.35);
    ctx.fillRect(x - s / 2, y - s / 2, s, s);
    if (st.l === 2 && st.s > 3.2) { ctx.fillRect(x - s * 2, y - 0.6, s * 4, 1.2); ctx.fillRect(x - 0.6, y - s * 2, 1.2, s * 4); }
  }
  ctx.globalAlpha = 1;
}

function holeSprite() {
  return K.draw.sprite('hole', 320, 320, (g) => {
    const c = 160, gr = g.createRadialGradient(c, c, 30, c, c, 160);
    gr.addColorStop(0, 'rgba(180,76,255,0.6)'); gr.addColorStop(0.55, 'rgba(255,60,199,0.18)'); gr.addColorStop(1, 'rgba(180,76,255,0)');
    g.fillStyle = gr; g.fillRect(0, 0, 320, 320);
    const cols = ['#ff3cc7', '#ffe600', '#22d3ff', '#b44cff'];
    g.lineCap = 'round';
    for (let arm = 0; arm < 4; arm++) {
      g.beginPath();
      for (let k = 0; k <= 40; k++) { const f = k / 40, a = arm * TAU / 4 + f * 4.4, r = 128 - f * 86; const x = c + Math.cos(a) * r, y = c + Math.sin(a) * r; k ? g.lineTo(x, y) : g.moveTo(x, y); }
      g.lineWidth = 12; g.strokeStyle = K.THEME.ink; g.stroke(); g.lineWidth = 7; g.strokeStyle = cols[arm]; g.stroke();
    }
    g.beginPath(); g.arc(c, c, HOLE_KILL + 2, 0, TAU); g.fillStyle = '#000000'; g.fill(); g.lineWidth = 6; g.strokeStyle = '#ebc4ff'; g.stroke();
  }, { pad: 0 });
}
function drawHole(ctx, ho, t) {
  ctx.save(); ctx.setLineDash([12, 18]); ctx.lineDashOffset = t * 40; ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(235,196,255,0.35)';
  ctx.beginPath(); ctx.arc(ho.x, ho.y, 230, 0, TAU); ctx.stroke(); ctx.restore();
  K.draw.drawSprite(holeSprite(), ho.x, ho.y, { rot: -t * 1.8 });
}
function drawRing(ctx, rg, t) {
  const s = 1 + 0.06 * Math.sin(t * 6);
  ctx.save(); ctx.translate(rg.x, rg.y); ctx.scale(s, s);
  ctx.beginPath(); ctx.arc(0, 0, 54, 0, TAU); ctx.lineWidth = 16; ctx.strokeStyle = K.THEME.ink; ctx.stroke();
  ctx.shadowColor = '#22ff88'; ctx.shadowBlur = 20; ctx.lineWidth = 9; ctx.strokeStyle = '#22ff88'; ctx.stroke(); ctx.shadowBlur = 0;
  ctx.setLineDash([10, 14]); ctx.lineDashOffset = -t * 60; ctx.lineWidth = 3; ctx.strokeStyle = '#ffffff'; ctx.beginPath(); ctx.arc(0, 0, 40, 0, TAU); ctx.stroke(); ctx.setLineDash([]);

function drawPlanet(ctx, pl, t, x) {

K.scenes.add('title', {

    this.logo = { s: 0 }; K.tween(this.logo, { s: 1 }, 0.7, K.Ease.outBack);

    const skin = skinById(K.meta.unlocks.selected('skin', 'blip'));
    ctx.save(); ctx.setLineDash([6, 16]); ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(255,255,255,0.3)';
    ctx.beginPath(); ctx.arc(cx, cy, 200, 0, TAU); ctx.stroke(); ctx.restore();
    const a = t * 1.3;
    for (let i = 1; i < 14; i++) { const b = a - i * 0.07; ctx.globalAlpha = 0.5 * (1 - i / 14); ctx.beginPath(); ctx.arc(cx + Math.cos(b) * 200, cy + Math.sin(b) * 200, 14 - i * 0.7, 0, TAU); ctx.fillStyle = skin.trail; ctx.fill(); }
    ctx.globalAlpha = 1;
