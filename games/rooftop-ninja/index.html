<script>
"use strict";
/* §1 MANIFEST */
const MANIFEST = {
  id: 'rooftop-ninja',
  title: 'Rooftop Ninja',
  version: '1.0.0',
  genre: 'runner',
  theme: 'ink',
  orientation: 'landscape',
  design: { w: 1280, h: 720, maxH: 900 },
  touch: { stick: false, buttons: [] },
  keys: { back: ['Escape', 'Backspace'] },
};
</script>
<script>
//#KERNEL-BEGIN 1.1.0
/* =========================================================================
   SlopGames KERNEL 1.1.0 — single-file HTML5 game kernel (Canvas2D, zero deps)
   Requires a global `MANIFEST` declared in an earlier <script>. Exposes `K`.
   Source of truth: /kernel/kernel-1.1.0.js  — never edit inside a game file.
   ========================================================================= */
const K = (() => {
  'use strict';
  const KERNEL_VERSION = '1.1.0';
  const TAU = Math.PI * 2;

  /* ---------- manifest defaults ---------- */
  const MF = (typeof MANIFEST !== 'undefined' && MANIFEST) ? MANIFEST : {};
  const DEFAULT_KEYS = {
    up: ['ArrowUp', 'KeyW', 'PadUp'], down: ['ArrowDown', 'KeyS', 'PadDown'],
    left: ['ArrowLeft', 'KeyA', 'PadLeft'], right: ['ArrowRight', 'KeyD', 'PadRight'],
    action: ['Space', 'Enter', 'PadA'], alt: ['ShiftLeft', 'KeyX', 'PadB'],
    pause: ['Escape', 'KeyP', 'PadStart'],
  };
  MF.id = MF.id || 'game';
  MF.title = MF.title || 'Game';
  MF.version = MF.version || '1.0.0';
  MF.design = Object.assign({ w: 720, h: 1280 }, MF.design || {});
  MF.keys = Object.assign({}, DEFAULT_KEYS, MF.keys || {});
  MF.touch = Object.assign({ stick: false, buttons: [] }, MF.touch || {});
  MF.platformOrigins = MF.platformOrigins || [];
  MF.orientation = MF.orientation || 'any';            // 'portrait' | 'landscape' | 'any'
  MF.theme = MF.theme || 'candy';

  /* ---------- canvas bootstrap (games may omit their own <canvas>) ---------- */
  if (!document.getElementById('k-base-css')) {
    const st = document.createElement('style'); st.id = 'k-base-css';
    st.textContent = 'html,body{margin:0;height:100%;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}#stage{position:fixed;inset:0;display:block;width:100%;height:100%;outline:none}';
    document.head.appendChild(st);
  }
  let canvas = document.getElementById('stage');
  if (!canvas) { canvas = document.createElement('canvas'); canvas.id = 'stage'; canvas.tabIndex = 0; document.body.appendChild(canvas); }
  const mainCtx = canvas.getContext('2d');
  let ctx = mainCtx;                                    // swapped while baking sprites

  /* =======================================================================
     MATH / RNG / NOISE / COLOR
     ======================================================================= */
  const M = {
    TAU,
    clamp: (v, a, b) => v < a ? a : v > b ? b : v,
    lerp: (a, b, t) => a + (b - a) * t,
    invLerp: (a, b, v) => (v - a) / (b - a),
    remap: (v, a, b, c, d) => c + (d - c) * ((v - a) / (b - a)),
    smoothstep: (a, b, v) => { const t = Math.max(0, Math.min(1, (v - a) / (b - a))); return t * t * (3 - 2 * t); },
    dist: (ax, ay, bx, by) => Math.hypot(bx - ax, by - ay),
    dist2: (ax, ay, bx, by) => (bx - ax) * (bx - ax) + (by - ay) * (by - ay),
    len: (x, y) => Math.hypot(x, y),
    norm: (x, y) => { const l = Math.hypot(x, y) || 1; return { x: x / l, y: y / l }; },
    dot: (ax, ay, bx, by) => ax * bx + ay * by,
    cross: (ax, ay, bx, by) => ax * by - ay * bx,
    rotate: (x, y, a) => { const c = Math.cos(a), s = Math.sin(a); return { x: x * c - y * s, y: x * s + y * c }; },
    angle: (x, y) => Math.atan2(y, x),
    angleDiff: (a, b) => { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; },
    approach: (v, t, d) => v < t ? Math.min(v + d, t) : Math.max(v - d, t),
    damp: (a, b, lambda, dt) => a + (b - a) * (1 - Math.exp(-lambda * dt)),
    wrap: (v, max) => ((v % max) + max) % max,
    sign: v => v > 0 ? 1 : v < 0 ? -1 : 0,
  };

  function rng(seed = 1) {
    let s = (seed >>> 0) || 1;
    const r = () => {
      s = (s + 0x6D2B79F5) | 0;
      let t = Math.imul(s ^ (s >>> 15), 1 | s);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    r.range = (a, b) => a + (b - a) * r();
    r.int = (a, b) => Math.floor(a + (b - a + 1) * r());
    r.pick = arr => arr[Math.floor(r() * arr.length)];
    r.chance = p => r() < p;
    r.sign = () => r() < 0.5 ? -1 : 1;
    r.shuffle = arr => { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); const t = arr[i]; arr[i] = arr[j]; arr[j] = t; } return arr; };
    r.weighted = (items, weightOf = it => it.w) => {
      let total = 0; for (const it of items) total += weightOf(it);
      let x = r() * total; for (const it of items) { x -= weightOf(it); if (x <= 0) return it; }
      return items[items.length - 1];
    };
    r.state = () => s;
    r.setState = v => { s = v | 0; };
    return r;
  }
  function hashSeed(str) {
    let h = 2166136261;
    str = String(str);
    for (let i = 0; i < str.length; i++) h = Math.imul(h ^ str.charCodeAt(i), 16777619);
    return h >>> 0;
  }
  function dailySeed(offsetDays = 0) {
    const d = new Date(Date.now() + offsetDays * 864e5);
    return hashSeed(MF.id + ':' + d.getUTCFullYear() + '-' + (d.getUTCMonth() + 1) + '-' + d.getUTCDate());
  }

  function noise(seed = 1) {
    const r = rng(seed), p = new Uint16Array(512), vals = new Float32Array(256), perm = [];
    for (let i = 0; i < 256; i++) { perm.push(i); vals[i] = r() * 2 - 1; }
    r.shuffle(perm);
    for (let i = 0; i < 512; i++) p[i] = perm[i & 255];
    const fade = t => t * t * (3 - 2 * t);
    const h1 = i => vals[p[i & 255]];
    const h2 = (i, j) => vals[p[p[i & 255] + (j & 255)]];
    function n1(x) { const xi = Math.floor(x), t = fade(x - xi); return M.lerp(h1(xi), h1(xi + 1), t); }
    function n2(x, y) {
      const xi = Math.floor(x), yi = Math.floor(y), u = fade(x - xi), v = fade(y - yi);
      return M.lerp(M.lerp(h2(xi, yi), h2(xi + 1, yi), u), M.lerp(h2(xi, yi + 1), h2(xi + 1, yi + 1), u), v);
    }
    function fbm(fn, oct, ...c) { let s = 0, a = 1, f = 1, n = 0; for (let i = 0; i < oct; i++) { s += a * fn(...c.map(v => v * f)); n += a; a *= 0.5; f *= 2; } return s / n; }
    return { n1, n2, fbm1: (x, o = 4) => fbm(n1, o, x), fbm2: (x, y, o = 4) => fbm(n2, o, x, y) };
  }

  const color = {
    rgb(hex) { hex = hex.replace('#', ''); if (hex.length === 3) hex = hex.split('').map(c => c + c).join(''); const n = parseInt(hex, 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; },
    hex(r, g, b) { return '#' + [r, g, b].map(v => Math.round(M.clamp(v, 0, 255)).toString(16).padStart(2, '0')).join(''); },
    mix(a, b, t) { const A = color.rgb(a), B = color.rgb(b); return color.hex(M.lerp(A[0], B[0], t), M.lerp(A[1], B[1], t), M.lerp(A[2], B[2], t)); },
    shade(hex, amt) { return amt >= 0 ? color.mix(hex, '#ffffff', amt) : color.mix(hex, '#000000', -amt); },
    alpha(hex, a) { const c = color.rgb(hex); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; },
    hsl(h, s, l) { return `hsl(${h},${s}%,${l}%)`; },
    pal(base) { return [color.shade(base, 0.45), base, color.shade(base, -0.3)]; },
  };

  const fmt = (n) => {
    const a = Math.abs(n);
    if (a < 1000) return String(Math.floor(n));
    const u = ['K', 'M', 'B', 'T', 'Qa', 'Qi']; let i = -1, v = a;
    while (v >= 1000 && i < u.length - 1) { v /= 1000; i++; }
    return (n < 0 ? '-' : '') + (v < 10 ? v.toFixed(2) : v < 100 ? v.toFixed(1) : Math.floor(v)) + u[i];
  };
  const fmtTime = (sec) => { sec = Math.max(0, Math.ceil(sec)); const m = Math.floor(sec / 60), s = sec % 60; return m + ':' + String(s).padStart(2, '0'); };
  function compact(arr, keep) { let j = 0; for (let i = 0; i < arr.length; i++) if (keep(arr[i], i)) arr[j++] = arr[i]; arr.length = j; return arr; }

  /* =======================================================================
     EASING / TWEENS / SPRINGS (cosmetic, real-time)
     ======================================================================= */
  const Ease = {
    linear: t => t,
    inQuad: t => t * t,
    outQuad: t => 1 - (1 - t) * (1 - t),
    inOutQuad: t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2,
    inCubic: t => t * t * t,
    outCubic: t => 1 - Math.pow(1 - t, 3),
    inOutCubic: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
    outQuart: t => 1 - Math.pow(1 - t, 4),
    inBack: t => { const c1 = 1.70158; return (c1 + 1) * t * t * t - c1 * t * t; },
    outBack: t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
    outElastic: t => t === 0 ? 0 : t === 1 ? 1 : Math.pow(2, -10 * t) * Math.sin((t * 10 - .75) * (TAU / 3)) + 1,
    outBounce: t => {
      const n = 7.5625, d = 2.75;
      if (t < 1 / d) return n * t * t;
      if (t < 2 / d) return n * (t -= 1.5 / d) * t + .75;
      if (t < 2.5 / d) return n * (t -= 2.25 / d) * t + .9375;
      return n * (t -= 2.625 / d) * t + .984375;
    },
    pingPong: t => t < 0.5 ? t * 2 : 2 - t * 2,
  };
  const tweens = [];
  function tween(obj, to, dur = 0.3, ease = Ease.outQuad, delay = 0) {
    const tw = { obj, to, from: {}, dur: Math.max(dur, 1e-4), ease, t: -delay, started: false, done: false, _then: null,
      then(fn) { this._then = fn; return this; }, kill() { this.done = true; } };
    tweens.push(tw);
    return tw;
  }
  tween.killOf = obj => { for (const t of tweens) if (t.obj === obj) t.done = true; };
  function wait(sec) { return new Promise(res => tween({}, {}, sec).then(res)); }
  function updateTweens(dt) {
    for (let i = tweens.length - 1; i >= 0; i--) {
      const tw = tweens[i];
      if (tw.done) { tweens.splice(i, 1); continue; }
      tw.t += dt;
      if (tw.t < 0) continue;
      if (!tw.started) { tw.started = true; for (const k in tw.to) tw.from[k] = tw.obj[k]; }
      const p = Math.min(1, tw.t / tw.dur), e = tw.ease(p);
      for (const k in tw.to) tw.obj[k] = tw.from[k] + (tw.to[k] - tw.from[k]) * e;
      if (p >= 1) { tw.done = true; tweens.splice(i, 1); if (tw._then) tw._then(); }
    }
  }
  // Critically-damped-ish spring: call every frame. s = {v, vel}; returns new value.
  function spring(s, target, dt, stiffness = 220, damping = 18) {
    const a = (target - s.v) * stiffness - s.vel * damping;
    s.vel += a * dt; s.v += s.vel * dt;
    return s.v;
  }

  /* =======================================================================
     VIEW / RESIZE / ADAPTIVE QUALITY
     ======================================================================= */
  const view = { w: MF.design.w, h: MF.design.h, fullW: MF.design.w, fullH: MF.design.h, ox: 0, oy: 0,
    scale: 1, dpr: 1, dprCap: 2.5, safe: { top: 0, right: 0, bottom: 0, left: 0 },
    get portrait() { return this.fullH >= this.fullW; } };
  const probe = document.createElement('div');
  probe.style.cssText = 'position:fixed;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)';
  document.body.appendChild(probe);
  function resize() {
    const D = MF.design;
    const cw = Math.max(1, window.innerWidth), ch = Math.max(1, window.innerHeight);
    const dpr = Math.min(window.devicePixelRatio || 1, view.dprCap);
    const scale = Math.min(cw / D.w, ch / D.h);
    view.scale = scale; view.dpr = dpr;
    view.fullW = cw / scale; view.fullH = ch / scale;
    view.w = Math.min(view.fullW, D.maxW || Infinity);
    view.h = Math.min(view.fullH, D.maxH || Infinity);
    view.ox = (view.fullW - view.w) / 2; view.oy = (view.fullH - view.h) / 2;
    canvas.width = Math.round(cw * dpr); canvas.height = Math.round(ch * dpr);
    const cs = getComputedStyle(probe);
    view.safe.top = Math.max(0, (parseFloat(cs.paddingTop) || 0) / scale - view.oy);
    view.safe.right = Math.max(0, (parseFloat(cs.paddingRight) || 0) / scale - view.ox);
    view.safe.bottom = Math.max(0, (parseFloat(cs.paddingBottom) || 0) / scale - view.oy);
    view.safe.left = Math.max(0, (parseFloat(cs.paddingLeft) || 0) / scale - view.ox);
    spriteCache.checkRes();
    input.layoutTouch();
    if (camera.auto) camera.center();
    scenes.layout();
  }

  /* =======================================================================
     THEMES — art-direction presets; every preset has the same color keys
     ======================================================================= */
  const ROUNDED = '"Arial Rounded MT Bold","Nunito","Baloo 2",ui-rounded,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';
  const THEMES = {
    candy: { ink: '#1b1b3a', paper: '#fff7e8', paperText: '#1b1b3a', bg: '#1b1b3a', sky: ['#4fc3ff', '#8a6cff'], font: ROUNDED,
      colors: { green: ['#8af59a', '#2fbf4a', '#1d8a33'], blue: ['#86d0ff', '#2b8cff', '#1a5fc0'], yellow: ['#fff08a', '#ffc21a', '#d48a00'],
        red: ['#ff9a9a', '#ff4b5c', '#c0283a'], purple: ['#d2b0ff', '#8f5bff', '#5f33c4'], orange: ['#ffc48a', '#ff8a1f', '#c45c00'],
        pink: ['#ffb0dc', '#ff5cb4', '#c42d84'], gray: ['#eef0f6', '#aab2c8', '#6f7891'] } },
    neon: { ink: '#07041a', paper: '#1a1440', paperText: '#ffffff', bg: '#07041a', sky: ['#1a0f3d', '#05030f'], font: ROUNDED, glow: true,
      colors: { green: ['#b0ffd0', '#22ff88', '#00a352'], blue: ['#b0f0ff', '#22d3ff', '#0078b8'], yellow: ['#fffbb0', '#ffe600', '#b89f00'],
        red: ['#ffb0c4', '#ff2e63', '#a8002f'], purple: ['#ebc4ff', '#b44cff', '#6d17b0'], orange: ['#ffd8b0', '#ff8c1a', '#b35400'],
        pink: ['#ffc8f2', '#ff3cc7', '#a3007a'], gray: ['#e0e3ff', '#8088c0', '#3a4070'] } },
    pastel: { ink: '#4a3f5c', paper: '#fffaf3', paperText: '#4a3f5c', bg: '#efe4ff', sky: ['#ffe1ec', '#d9e8ff'], font: ROUNDED,
      colors: { green: ['#d4f7dc', '#9be3ad', '#5fb377'], blue: ['#d6ecff', '#9ccbff', '#5f95cf'], yellow: ['#fff6cc', '#ffe08a', '#d1aa45'],
        red: ['#ffd6dc', '#ff9eac', '#cf6575'], purple: ['#ebdcff', '#c3a3ff', '#8b6bc9'], orange: ['#ffe4cc', '#ffbf8a', '#cf8c52'],
        pink: ['#ffdcef', '#ffa8d4', '#cf6fa0'], gray: ['#f4f2f7', '#cfc9d9', '#968ea6'] } },
    jungle: { ink: '#1f2a12', paper: '#fff6dc', paperText: '#1f2a12', bg: '#1f2a12', sky: ['#9be58e', '#2e8b57'], font: ROUNDED,
      colors: { green: ['#c4f28a', '#6cc23a', '#3d7a1c'], blue: ['#9fe3e0', '#2fa8a0', '#1d6b66'], yellow: ['#fff0a0', '#f2c230', '#a8800f'],
        red: ['#ffb09a', '#e8573a', '#a3321c'], purple: ['#d8b8ff', '#9b6ad6', '#63408f'], orange: ['#ffcf8f', '#f08c24', '#a85a0c'],
        pink: ['#ffc0d2', '#e86a94', '#a33a5e'], gray: ['#efe9d8', '#b5ab8f', '#7a7058'] } },
    ocean: { ink: '#0b2545', paper: '#f0fbff', paperText: '#0b2545', bg: '#0b2545', sky: ['#5ee7ff', '#1b6ca8'], font: ROUNDED,
      colors: { green: ['#a8ffe0', '#2ee6a6', '#16a374'], blue: ['#a8e4ff', '#2ab0ff', '#1572b3'], yellow: ['#fff3b0', '#ffd23f', '#b8901a'],
        red: ['#ffb3b3', '#ff5a5f', '#b8323a'], purple: ['#c9c4ff', '#7a6cff', '#4a3fb3'], orange: ['#ffd1a8', '#ff9a3c', '#b8621a'],
        pink: ['#ffc4e1', '#ff70b0', '#b83d78'], gray: ['#e8f4f8', '#9fbccb', '#5e7f8f'] } },
    retro: { ink: '#000000', paper: '#1d1d1d', paperText: '#ffffff', bg: '#000000', sky: ['#1a0033', '#000000'], font: '"Courier New",ui-monospace,Menlo,monospace',
      colors: { green: ['#80ff80', '#00d800', '#008800'], blue: ['#80c0ff', '#3878f8', '#0030b0'], yellow: ['#ffff80', '#f8d800', '#a88800'],
        red: ['#ff8080', '#f83800', '#a80000'], purple: ['#e080ff', '#a000f8', '#6000a8'], orange: ['#ffc080', '#f87800', '#a84800'],
        pink: ['#ffa0e0', '#f878f8', '#a838a8'], gray: ['#ffffff', '#bcbcbc', '#7c7c7c'] } },
    ink: { ink: '#141414', paper: '#ffffff', paperText: '#141414', bg: '#f5f1e8', sky: ['#faf7f0', '#e6dfcf'], font: ROUNDED,
      colors: { green: ['#e6e6e6', '#bdbdbd', '#7a7a7a'], blue: ['#e6e6e6', '#9e9e9e', '#5c5c5c'], yellow: ['#fff3c4', '#ffd84d', '#b89400'],
        red: ['#ffc9c4', '#e8402e', '#9e2216'], purple: ['#e0e0e0', '#8a8a8a', '#4d4d4d'], orange: ['#f0f0f0', '#b0b0b0', '#6e6e6e'],
        pink: ['#ffd6d1', '#f07a6e', '#a83f34'], gray: ['#ffffff', '#d6d6d6', '#8f8f8f'] } },
  };
  const THEME = {};
  function setTheme(name) {
    const t = THEMES[name] || THEMES.candy;
    for (const k in THEME) delete THEME[k];
    Object.assign(THEME, JSON.parse(JSON.stringify(t)), { name: THEMES[name] ? name : 'candy' });
    if (MF.bg) THEME.bg = MF.bg;
    document.body.style.background = THEME.bg;
    spriteCache.clear();
  }

  /* =======================================================================
     STORAGE / SAVE / META-PROGRESSION
     ======================================================================= */
  const store = (() => {
    const ns = 'k:' + MF.id + ':';
    const mem = {};
    return {
      get(k, def) {
        if (k in mem) return mem[k];
        try { const v = localStorage.getItem(ns + k); if (v != null) return (mem[k] = JSON.parse(v)); } catch (e) {}
        return def;
      },
      set(k, v) {
        mem[k] = v;
        try { localStorage.setItem(ns + k, JSON.stringify(v)); } catch (e) {}
        sdk.send('save', { key: k, value: v });
      },
      remove(k) { delete mem[k]; try { localStorage.removeItem(ns + k); } catch (e) {} sdk.send('save', { key: k, value: null }); },
      import(obj) { if (obj && typeof obj === 'object') for (const k in obj) if (obj[k] != null) mem[k] = obj[k]; },
    };
  })();

  const clone = o => JSON.parse(JSON.stringify(o));
  function fillDefaults(target, defs) {
    for (const k in defs) {
      if (!(k in target)) target[k] = clone(defs[k]);
      else if (defs[k] && typeof defs[k] === 'object' && !Array.isArray(defs[k]) && target[k] && typeof target[k] === 'object') fillDefaults(target[k], defs[k]);
    }
    return target;
  }
  const save = (() => {
    let def = null;
    const data = {};
    let commitT = null;
    function load(raw) {
      let d = raw && typeof raw === 'object' ? clone(raw) : null;
      if (!d) d = Object.assign(clone(def.defaults), { _v: def.version });
      let v = d._v || 1;
      while (v < def.version) { const fn = def.migrate[v + 1]; if (fn) d = fn(d) || d; v++; d._v = v; }
      fillDefaults(d, def.defaults);
      for (const k in data) delete data[k];
      Object.assign(data, d);
    }
    return {
      // K.save.define({version, defaults, migrate:{2: d => {...}}}) → returns the live data object
      define(o) { def = { version: o.version || 1, defaults: o.defaults || {}, migrate: o.migrate || {} }; load(store.get('save', null)); return data; },
      get data() { return data; },
      commit() { if (def) { clearTimeout(commitT); commitT = null; store.set('save', data); } },
      later() { if (def && !commitT) commitT = setTimeout(() => save.commit(), 800); },
      reset() { if (!def) return; for (const k in data) delete data[k]; Object.assign(data, clone(def.defaults), { _v: def.version }); save.commit(); },
      reload() { if (def) load(store.get('save', null)); },
      get defined() { return !!def; },
    };
  })();

  const meta = (() => {
    const m = () => {
      if (!save.defined) save.define({ version: 1, defaults: {} });
      const d = save.data;
      return d._meta || (d._meta = { wallet: {}, up: {}, levels: {}, daily: { last: null, streak: 0 }, unlocks: {}, sel: {} });
    };
    const upDefs = {};
    const listeners = [];

      wheel(x, y, dy) { for (let i = W.length - 1; i >= 0; i--) { const w = W[i]; if (w.kind === 'list' && active(w) && inRect(w, x, y, 0)) { const L = kinds.list.layout(w); w.off = M.clamp(w.off + dy, 0, L.maxOff); return true; } } return false; },
      keys() {
        for (const w of W) if (w.kind === 'button' && w.key && active(w) && input.pressed(w.key)) {
          bounce(w, 0.9, 0.06); w._tw.then(() => bounce(w, 1, 0.35, Ease.outElastic));
          if (w.sfx) audio.play(w.sfx); if (w.onTap) w.onTap(w); return;
        }
      },
    };
    return api;
  })();

  /* =======================================================================
     INPUT — keyboard, unified pointer, multitouch, gamepad, typed text, touch overlay
     ======================================================================= */
  const input = (() => {
    const keyMap = {};
    for (const a in MF.keys) for (const c of MF.keys[a]) (keyMap[c] || (keyMap[c] = [])).push(a);
    const held = new Set(), pr = new Set(), rl = new Set(), vHeld = new Set(), padHeld = new Set();
    const axis = { x: 0, y: 0 }, pad = { x: 0, y: 0, ax: 0, ay: 0, connected: false };
    const typed = [];
    const p = { x: 0, y: 0, down: false, pressed: false, released: false, tap: false, dragging: false,
      startX: 0, startY: 0, dx: 0, dy: 0, downAt: 0, holdTime: 0, id: null, vx: 0, vy: 0, _lx: 0, _ly: 0, _lt: 0,
      get wx() { return camera.toWorld(this.x, this.y).x; }, get wy() { return camera.toWorld(this.x, this.y).y; },
      get wStartX() { return camera.toWorld(this.startX, this.startY).x; }, get wStartY() { return camera.toWorld(this.startX, this.startY).y; } };
    const pointers = new Map();     // all non-UI pointers (multitouch)
    let touchMode = window.matchMedia && matchMedia('(pointer: coarse)').matches;
    const stick = { id: null, ox: 0, oy: 0, kx: 0, ky: 0, r: 90 };
    // Touch overlay config: scene.touch overrides MANIFEST.touch (set scene.touch = null to hide).
    const tc = () => { const sc = scenes.current; return sc && sc.touch !== undefined ? (sc.touch || NO_TOUCH) : MF.touch; };
    const NO_TOUCH = { stick: false, buttons: [] };
    let tbtn = [], tbtnFor = null;
    function syncButtons() {
      const c = tc();
      if (c !== tbtnFor) { tbtnFor = c; tbtn = (c.buttons || []).map(b => ({ action: b.action, label: b.label || '', icon: b.icon || null, color: b.color || 'purple', x: 0, y: 0, r: b.r || 72, id: null })); api.layoutTouch(); }
      return tbtn;
    }
    const toL = e => ({ x: e.clientX / view.scale - view.ox, y: e.clientY / view.scale - view.oy });
    const overlayOn = () => { if (!touchMode || !scenes.current || !scenes.current.gameplay || sys.paused || sys.modal) return false; const c = tc(); syncButtons(); return !!(c.stick || tbtn.length); };
    const press = a => { if (a === 'pause') { if (!sys.modal) sys.paused ? resumeGame() : pauseGame(); return; } held.add(a); pr.add(a); };

    window.addEventListener('keydown', e => {
      audio.unlock();
      if (e.code === 'Backquote') { debug.on = !debug.on; return; }
      if (!sys.ad && !e.ctrlKey && !e.metaKey) { if (e.key.length === 1) typed.push(e.key); else if (e.key === 'Backspace') typed.push('\b'); else if (e.key === 'Enter') typed.push('\n'); }
      const acts = keyMap[e.code];
      if (!acts) { if (e.key === 'Backspace' || e.key === ' ') e.preventDefault(); return; }
      e.preventDefault(); touchMode = false;
      if (e.repeat || sys.ad) return;
      acts.forEach(press);
    });
    window.addEventListener('keyup', e => { const acts = keyMap[e.code]; if (!acts) return; acts.forEach(a => { held.delete(a); rl.add(a); }); });
    window.addEventListener('blur', () => held.clear());

    canvas.addEventListener('pointerdown', e => {
      e.preventDefault(); audio.unlock(); try { canvas.focus({ preventScroll: true }); } catch (_) {}
      if (e.pointerType === 'touch' || e.pointerType === 'pen') touchMode = true; else if (e.pointerType === 'mouse') touchMode = false;
      if (sys.ad) return;
      const q = toL(e);
      try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
      if (sys.crashed) { if (q.y > view.h - 260) location.reload(); return; }
      if (ui.down(q.x, q.y, e.pointerId)) return;
      if (overlayOn()) {
        for (const b of tbtn) if (b.id == null && M.dist(q.x, q.y, b.x, b.y) < b.r * 1.3) { b.id = e.pointerId; vHeld.add(b.action); pr.add(b.action); haptic('light'); return; }
        if (tc().stick && stick.id == null && q.x < view.w * 0.5) { stick.id = e.pointerId; stick.ox = q.x; stick.oy = q.y; stick.kx = stick.ky = 0; return; }
      }
      if (sys.paused) return;
      pointers.set(e.pointerId, { id: e.pointerId, x: q.x, y: q.y, startX: q.x, startY: q.y, downAt: performance.now(), pressed: true });
      if (p.id != null) return;
      p.id = e.pointerId; p.down = true; p.pressed = true; p.dragging = false;
      p.x = p.startX = p._lx = q.x; p.y = p.startY = p._ly = q.y; p.dx = p.dy = p.vx = p.vy = 0; p.downAt = p._lt = performance.now(); p.holdTime = 0;
    });
    canvas.addEventListener('pointermove', e => {
      const q = toL(e);
      if (e.pointerId === stick.id) {
        let dx = q.x - stick.ox, dy = q.y - stick.oy; const d = Math.hypot(dx, dy);
        if (d > stick.r) { dx *= stick.r / d; dy *= stick.r / d; }
        stick.kx = dx; stick.ky = dy; axis.x = dx / stick.r; axis.y = dy / stick.r; return;
      }
      ui.move(q.x, q.y, e.pointerId);
      const pt = pointers.get(e.pointerId); if (pt) { pt.x = q.x; pt.y = q.y; }
      if (e.pointerId === p.id || p.id == null) { p.x = q.x; p.y = q.y; }
      if (e.pointerId === p.id) {
        p.dx = p.x - p.startX; p.dy = p.y - p.startY;
        if (!p.dragging && Math.hypot(p.dx, p.dy) > 14) p.dragging = true;
        const now = performance.now(), dt = Math.max(1, now - p._lt) / 1000;
        p.vx = p.vx * 0.5 + (q.x - p._lx) / dt * 0.5; p.vy = p.vy * 0.5 + (q.y - p._ly) / dt * 0.5; p._lx = q.x; p._ly = q.y; p._lt = now;
      }
    });
    const up = (e, cancel) => {
      const q = toL(e);
      if (ui.up(q.x, q.y, e.pointerId)) return;
      for (const b of tbtn) if (b.id === e.pointerId) { b.id = null; if (!tbtn.some(o => o.id != null && o.action === b.action)) { vHeld.delete(b.action); rl.add(b.action); } return; }
      if (e.pointerId === stick.id) { stick.id = null; axis.x = axis.y = 0; return; }
      pointers.delete(e.pointerId);
      if (e.pointerId === p.id) {
        p.x = q.x; p.y = q.y; p.dx = p.x - p.startX; p.dy = p.y - p.startY;
        if (performance.now() - p._lt > 80) { p.vx = 0; p.vy = 0; }
        p.down = false; p.released = !cancel; p.tap = !cancel && !p.dragging && performance.now() - p.downAt < 350; p.id = null;
      }
    };
    canvas.addEventListener('pointerup', e => up(e, false));
    canvas.addEventListener('pointercancel', e => up(e, true));
    canvas.addEventListener('contextmenu', e => e.preventDefault());
    canvas.addEventListener('wheel', e => { e.preventDefault(); const q = toL(e); if (!ui.wheel(q.x, q.y, e.deltaY)) api.wheel += e.deltaY; }, { passive: false });

    const PAD_NAMES = ['PadA', 'PadB', 'PadX', 'PadY', 'PadLB', 'PadRB', 'PadLT', 'PadRT', 'PadBack', 'PadStart', 'PadL3', 'PadR3', 'PadUp', 'PadDown', 'PadLeft', 'PadRight'];
    const dz = v => Math.abs(v) < 0.2 ? 0 : (v - Math.sign(v) * 0.2) / 0.8;
    function pollPad() {
      if (!navigator.getGamepads) return;
      let gp = null; try { for (const g of navigator.getGamepads()) if (g && g.connected) { gp = g; break; } } catch (e) { return; }
      pad.connected = !!gp;
      if (!gp) { if (padHeld.size) { padHeld.forEach(a => rl.add(a)); padHeld.clear(); } pad.x = pad.y = pad.ax = pad.ay = 0; return; }
      const now = new Set();
      gp.buttons.forEach((b, i) => { if (b.pressed && PAD_NAMES[i] && keyMap[PAD_NAMES[i]]) keyMap[PAD_NAMES[i]].forEach(a => now.add(a)); });
      pad.x = dz(gp.axes[0] || 0); pad.y = dz(gp.axes[1] || 0); pad.ax = dz(gp.axes[2] || 0); pad.ay = dz(gp.axes[3] || 0);
      for (const a of now) if (!padHeld.has(a)) { touchMode = false; if (a === 'pause') press(a); else { pr.add(a); } }
      for (const a of padHeld) if (!now.has(a)) rl.add(a);
      padHeld.clear(); now.forEach(a => { if (a !== 'pause') padHeld.add(a); });
    }

    const api = {
      pointer: p, pointers, pad, wheel: 0,
      get typed() { return typed; },
      get touch() { return touchMode; },
      down: a => held.has(a) || vHeld.has(a) || padHeld.has(a),
      pressed: a => pr.has(a),
      released: a => rl.has(a),
      axisX() { let x = axis.x + pad.x; if (api.down('left')) x -= 1; if (api.down('right')) x += 1; return M.clamp(x, -1, 1); },
      axisY() { let y = axis.y + pad.y; if (api.down('up')) y -= 1; if (api.down('down')) y += 1; return M.clamp(y, -1, 1); },
      // Normalized movement vector (diagonals not faster).
      move() { const x = api.axisX(), y = api.axisY(), l = Math.hypot(x, y); return l > 1 ? { x: x / l, y: y / l } : { x, y }; },
      // Aim direction: right stick, else pointer relative to (fromX, fromY) in world space.
      aim(fromX, fromY) {
        if (Math.hypot(pad.ax, pad.ay) > 0.3) return { x: pad.ax, y: pad.ay, active: true };
        const dx = p.wx - fromX, dy = p.wy - fromY, l = Math.hypot(dx, dy) || 1;

      },
      poll() { pollPad(); if (p.down) p.holdTime = (performance.now() - p.downAt) / 1000; },
      endStep() { pr.clear(); rl.clear(); p.pressed = p.released = p.tap = false; typed.length = 0; api.wheel = 0; for (const pt of pointers.values()) pt.pressed = false; },
      reset() {
        held.clear(); vHeld.clear(); pr.clear(); rl.clear(); typed.length = 0; axis.x = axis.y = 0; stick.id = null; pointers.clear();
        tbtn.forEach(b => b.id = null); p.down = p.pressed = p.released = p.tap = p.dragging = false; p.id = null; p.vx = p.vy = 0;
      },
      layoutTouch() {
        tbtn.forEach((b, i) => { b.x = view.w - 110 - view.safe.right - (i % 2) * 165; b.y = view.h - 140 - view.safe.bottom - (i % 2) * 70 - Math.floor(i / 2) * 170; });
      },
      drawTouch() {
        if (!overlayOn()) return;
        if (tc().stick) {
          const ox = stick.id != null ? stick.ox : 150 + view.safe.left, oy = stick.id != null ? stick.oy : view.h - 170 - view.safe.bottom;
          ctx.globalAlpha = stick.id != null ? 0.55 : 0.25;
          ctx.beginPath(); ctx.arc(ox, oy, stick.r + 20, 0, TAU); ctx.fillStyle = color.alpha(THEME.ink, 0.5); ctx.fill();
          ctx.lineWidth = 5; ctx.strokeStyle = '#fff'; ctx.stroke();
          ctx.globalAlpha = stick.id != null ? 0.9 : 0.35;
          blob(ox + (stick.id != null ? stick.kx : 0), oy + (stick.id != null ? stick.ky : 0), 48, THEME.colors.gray);
          ctx.globalAlpha = 1;
        }
        for (const b of tbtn) {
          ctx.globalAlpha = b.id != null ? 0.95 : 0.6;
          blob(b.x, b.y + (b.id != null ? 4 : 0), b.r * (b.id != null ? 0.92 : 1), THEME.colors[b.color] || THEME.colors.purple);
          if (b.icon) icon(b.icon, b.x, b.y, b.r * 0.8); else text(b.label, b.x, b.y, { size: 44 });
          ctx.globalAlpha = 1;
        }
      },
    };
    return api;
  })();

  /* =======================================================================
     SCENES
     ======================================================================= */
  const scenes = (() => {
    const reg = {};
    let cur = null, name = null, busy = false;
    const fade = { a: 0 };
    function swap(n, params) {
      if (!reg[n]) { reportError(new Error('Unknown scene: ' + n), 'scenes.go'); return; }
      if (cur) { if (cur.gameplay) sdk.send('gameplayStop'); safeCall(cur, 'exit'); }
      ui.clearScene(); ui.clearModals(); fx.clear(); input.reset(); camera.reset(); sys.paused = false; hitstopT = 0; acc = 0;
      name = n; cur = reg[n];
      safeCall(cur, 'enter', params || {});
      safeCall(cur, 'layout', view);
      ui.place();
      if (cur.music !== undefined) { if (cur.music) music.play(cur.music); else music.stop(); }
      if (cur.gameplay) sdk.send('gameplayStart');
      sdk.send('scene', { name: n });
    }
    return {
      add(n, def) { reg[n] = def; return def; },
      has(n) { return !!reg[n]; },
      go(n, params, opts = {}) {
        if (busy) return;
        if (!cur || opts.instant) { swap(n, params); return; }
        busy = true;
        tween(fade, { a: 1 }, 0.16, Ease.inQuad).then(() => { swap(n, params); tween(fade, { a: 0 }, 0.22, Ease.outQuad).then(() => busy = false); });
      },
      get current() { return cur; },
      get name() { return name; },
      get list() { return Object.keys(reg); },
      fade,
      layout() { safeCall(cur, 'layout', view); ui.place(); },
    };
  })();

  /* =======================================================================
     ADS
     ======================================================================= */
  const devAd = { on: false, t: 0, kind: '', res: null };
  async function adBreak(kind = 'midgame') {
    if (sys.ad) return { shown: false, granted: false };
    sys.ad = true; input.reset(); updateDuck(); sdk.send('gameplayStop');
    let r = null;
    if (sdk.connected) r = await sdk.request('adBreak', { kind }, 90000);
    else if (!sdk.inFrame) r = await new Promise(res => { Object.assign(devAd, { on: true, t: kind === 'rewarded' ? 2 : 1, kind, res }); });
    sys.ad = false; updateDuck(); last = performance.now();
    if (scenes.current && scenes.current.gameplay && !sys.paused) sdk.send('gameplayStart');
    r = r || {};
    return { shown: !!r.shown, granted: kind === 'rewarded' && !!r.granted };
  }

  /* =======================================================================
     DEBUG
     ======================================================================= */
  const debug = { on: /[?&]debug/.test(location.search), fps: 60, steps: 0, low: 0 };

  /* ---------- system pause overlay widgets ---------- */
  ui.button({ group: 'sys', label: 'RESUME', icon: 'play', color: 'green', w: 400, h: 120, key: 'action', pulse: true,
    place: v => ({ x: v.w / 2, y: v.h / 2 + 10 }), onTap: resumeGame });
  ui.soundButton({ group: 'sys', place: v => ({ x: v.w / 2 - 130, y: v.h / 2 + 165 }) });
  ui.musicButton({ group: 'sys', place: v => ({ x: v.w / 2, y: v.h / 2 + 165 }) });
  const sysHome = ui.button({ group: 'sys', icon: 'home', color: 'red', w: 110, h: 110,
    place: v => ({ x: v.w / 2 + 130, y: v.h / 2 + 165 }),
    onTap: () => { const sc = scenes.current; sys.paused = false; safeCall(sc, 'onQuit'); } });

  /* =======================================================================
     MAIN LOOP — fixed-step sim (60 Hz), per-frame presentation
     ======================================================================= */
  const STEP = 1 / 60, MAX_STEPS = 6;
  let last = 0, acc = 0, clock = 0, frameN = 0;
  function frame(now) {
    requestAnimationFrame(frame);
    let dt = (now - last) / 1000; last = now;
    if (!(dt > 0)) dt = 0; if (dt > 0.1) dt = 0.1;
    if (dt > 0) debug.fps += (1 / dt - debug.fps) * 0.05;
    frameN++;
    // adaptive resolution: drop DPR if we're struggling
    if (frameN > 120 && debug.fps < 42 && view.dprCap > 1) { if (++debug.low > 90) { view.dprCap = Math.max(1, view.dprCap - 0.5); debug.low = 0; resize(); } } else debug.low = 0;
    if (devAd.on) { devAd.t -= dt; if (devAd.t <= 0) { devAd.on = false; devAd.res({ shown: true, granted: true }); } }
    sys.rotate = input.touch && ((MF.orientation === 'landscape' && view.fullH > view.fullW * 1.1) || (MF.orientation === 'portrait' && view.fullW > view.fullH * 1.1));
    const sc = scenes.current;
    input.poll();
    if (!sys.frozen && sc) {
      clock += dt;
      updateTweens(dt);
      ui.update(dt);
      ui.keys();
      if (!sys.simHalted) {
        let steps = 0;
        if (hitstopT > 0) hitstopT -= dt;
        else {
          acc += dt;
          while (acc >= STEP && steps < MAX_STEPS) {
            safeCall(sc, 'update', STEP); input.endStep(); acc -= STEP; steps++;
            if (scenes.current !== sc || sys.simHalted) break;
          }
          if (steps === MAX_STEPS) acc = 0;
        }
        debug.steps = steps;
        safeCall(sc, 'frame', dt);
        fx.update(dt);
      } else if (sys.modal && !sys.paused) { fx.update(dt); input.endStep(); }
      camera.update(dt, M.clamp(acc / STEP, 0, 1));
    }
    ui.place();
    render();
  }

  function render() {
    const s = view.dpr * view.scale, sc = scenes.current, alpha = M.clamp(acc / STEP, 0, 1);
    ctx = mainCtx;
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1;
    ctx.fillStyle = THEME.bg; ctx.fillRect(0, 0, canvas.width, canvas.height);
    const ox = view.ox, oy = view.oy;
    // world layer (shakes; camera)
    ctx.setTransform(s, 0, 0, s, (ox + fx.offset.x) * s, (oy + fx.offset.y) * s);
    if (sc) safeCall(sc, 'backdrop', ctx, alpha);
    ctx.save(); camera.apply(ctx);
    if (sc) safeCall(sc, 'render', ctx, alpha);
    fx.draw(false);
    ctx.restore();
    // screen layer (stable)
    ctx.setTransform(s, 0, 0, s, ox * s, oy * s);
    if (sc) safeCall(sc, 'hud', ctx, alpha);
    fx.draw(true);
    input.drawTouch();
    ui.draw('scene');
    fx.drawFlash();
    ui.drawModals();
    ui.drawToasts();
    if (sys.paused) {
      ctx.fillStyle = 'rgba(20,18,50,0.62)'; ctx.fillRect(-ox, -oy, view.fullW, view.fullH);
      panel(view.w / 2, view.h / 2 + 50, 540, 480, { title: 'PAUSED', color: 'purple' });
      sysHome.visible = !!(sc && sc.onQuit);
      ui.draw('sys');
    }
    if (sys.rotate) {
      ctx.fillStyle = THEME.bg; ctx.fillRect(-ox, -oy, view.fullW, view.fullH);
      ctx.save(); ctx.translate(view.w / 2, view.h / 2 - 60); ctx.rotate(Math.sin(clock * 3) * 0.6);
      block(-70, -110, 140, 220, 'blue', { r: 24 }); ctx.restore();
      text('Rotate your device', view.w / 2, view.h / 2 + 120, { size: 48, maxW: view.w - 60 });
    }
    if (devAd.on) {
      ctx.fillStyle = '#0d0c22'; ctx.fillRect(-ox, -oy, view.fullW, view.fullH);
      text('AD BREAK', view.w / 2, view.h / 2 - 50, { size: 72, color: '#ffe680' });
      text(`${devAd.kind} · dev stub · ${Math.ceil(devAd.t)}`, view.w / 2, view.h / 2 + 40, { size: 32, color: '#aab2c8' });
    }
    if (sys.crashed) {
      ctx.fillStyle = 'rgba(16,10,30,0.88)'; ctx.fillRect(-ox, -oy, view.fullW, view.fullH);
      icon('skull', view.w / 2, view.h / 2 - 170, 140, '#ff9a9a');
      text('Oops! The game crashed.', view.w / 2, view.h / 2 - 40, { size: 50, maxW: view.w - 60 });
      label(sys.crashed.where + ': ' + sys.crashed.message, view.w / 2, view.h / 2 + 40, { size: 26, color: '#ffb0b0', maxW: view.w - 60 });
      block(view.w / 2 - 190, view.h - 220, 380, 110, 'green', { r: 36 }); text('RESTART', view.w / 2, view.h - 170, { size: 48 });
    }
    if (scenes.fade.a > 0) { ctx.globalAlpha = scenes.fade.a; ctx.fillStyle = THEME.bg; ctx.fillRect(-ox, -oy, view.fullW, view.fullH); ctx.globalAlpha = 1; }
    if (debug.on) {
      const lines = [`${debug.fps | 0} fps · ${debug.steps} steps · ${fx.count} fx · ${spriteCache.size} spr`, `${view.w | 0}×${view.h | 0} @${(view.dpr * view.scale).toFixed(2)} · scene ${scenes.name} · k${KERNEL_VERSION}`];
      lines.forEach((l, i) => text(l, 12 - 0, 22 + i * 26 + view.safe.top, { size: 20, align: 'left', shadow: false, sw: 4 }));
    }
  }

  /* =======================================================================
     BOOT
     ======================================================================= */
  let booted = false;
  function boot(startScene, params) {
    if (booted) return; booted = true;
    // Title-card mode: the platform (window.SG_CARD) or a ?card URL boots a game's 'card' key-art scene for thumbnails.
    try { if ((window.SG_CARD || /[?&]card\b/.test(location.search)) && scenes.has('card')) startScene = 'card'; } catch (e) {}
    resize();
    window.addEventListener('resize', resize);
    if (window.visualViewport) visualViewport.addEventListener('resize', resize);
    document.addEventListener('visibilitychange', () => {
      sys.hidden = document.hidden;
      if (document.hidden) { pauseGame(); input.reset(); save.commit(); }
      updateDuck(); last = performance.now();
    });
    window.addEventListener('pagehide', () => save.commit());
    sdk.on('hello', d => {
      sdk.connected = true;
      if (d && d.save) { store.import(d.save); save.reload(); }
      if (d && typeof d.muted === 'boolean') { sys.platformMute = d.muted; updateDuck(); }
      if (d && d.debug) debug.on = true;
    });
    sdk.on('pause', () => { sys.platformPause = true; pauseGame(); updateDuck(); });
    sdk.on('resume', () => { sys.platformPause = false; updateDuck(); last = performance.now(); });
    sdk.on('mute', d => { sys.platformMute = !!(d && d.muted); updateDuck(); });
    sdk.on('debug', d => { debug.on = !!(d && d.on); });
    sdk.on('snapshot', d => {
      try {
        const w = (d && d.width) || 480, c = document.createElement('canvas'); c.width = w; c.height = Math.round(w * canvas.height / canvas.width);
        c.getContext('2d').drawImage(canvas, 0, 0, c.width, c.height);
        sdk.send('snapshot', { id: d && d.id, data: c.toDataURL('image/jpeg', 0.85) });
      } catch (err) { sdk.send('snapshot', { id: d && d.id, error: String(err) }); }
    });
    sdk.send('loadProgress', { p: 1 });
    scenes.go(startScene, params);
    sdk.send('ready', { game: MF.id, title: MF.title, version: MF.version, kernel: KERNEL_VERSION, orientation: MF.orientation, design: MF.design });
    last = performance.now();
    requestAnimationFrame(frame);
  }

  setTheme(MF.theme);

  return {
    VERSION: KERNEL_VERSION, MANIFEST: MF,
    // core
    M, rng, hashSeed, dailySeed, noise, color, fmt, fmtTime, compact, clone, Ease, tween, wait, spring,
    view, THEME, THEMES, setTheme, store, save, meta, sdk, audio, music, haptic, input, camera, fx, ui, scenes, adBreak, boot, fsm,
    // systems
    col, SpatialHash, Physics, Tilemap, Grid, Heap, path,
    draw: { text, label, measure, wrap, paragraph, rr, rrp, starPath, blob, blobS, block, critter, star, poly, line, capsule, arrow, dots,
      panel, card, bar, pill, hearts, sky, vignette, glow, icon, sprite, drawSprite: (s, x, y, o) => spriteCache.draw(s, x, y, o) },
    pause: pauseGame, resume: resumeGame,
    setHaptics(v) { hapticsOn = !!v; store.set('haptics', hapticsOn); }, get haptics() { return hapticsOn; },
    get time() { return clock; },
    get paused() { return sys.paused; },
    get debug() { return debug; },
    get errors() { return errors; },
  };
})();
//#KERNEL-END
</script>
<script>
"use strict";
/* §3 GAME — Rooftop Ninja: leap between dusk rooftops, slide under billboards, shatter glass with shuriken. */

const TAU = K.M.TAU, M = K.M;
const PXM = 40;                       // pixels per meter
const G = 3000, JV = 860, AJV = 800, HOLD_T = 0.25, HOLD_G = 0.45;
const HW = 15, STAND_H = 84, SLIDE_H = 40;
const X0 = 200;
const INK = '#141414';

// extra accent palettes for the ink theme (buttons / panels)
K.THEME.colors.dusk = ['#ffd2a6', '#ff8a4c', '#b8461e'];
K.THEME.colors.night = ['#a9a0ee', '#5b4fc0', '#2c2470'];

const SAVE = K.save.define({ version: 1, defaults: { best: 0, runs: 0, coinsTotal: 0, hint: { jump: 0, hold: 0, slide: 0 } } });

const UPDEF = {
  jumps:  { max: 2, cost: l => [250, 900][l], value: l => l },
  slide:  { max: 5, base: 60, growth: 1.65, value: l => 0.5 + l * 0.12 },
  magnet: { max: 5, base: 45, growth: 1.7, value: l => (l ? 60 + l * 40 : 0) },
  stars:  { max: 4, base: 80, growth: 1.8, value: l => 2 + l },
};
K.meta.upgrades.define(UPDEF);
const UPS = [
  { id: 'jumps', name: 'Double Jump', icon: 'arrowU', color: 'dusk', fmt: v => v + (v === 1 ? ' air jump' : ' air jumps') },
  { id: 'slide', name: 'Shadow Slide', icon: 'arrowR', color: 'night', fmt: v => v.toFixed(2) + 's slide' },
  { id: 'magnet', name: 'Coin Magnet', icon: 'coin', color: 'yellow', fmt: v => (v ? v + 'px pull' : 'no pull') },
  { id: 'stars', name: 'Shuriken Pouch', icon: 'star', color: 'red', fmt: v => 'carry ' + v },
];

const SKINS = [
  { id: 'kage', name: 'Kage', body: '#24212e', dark: '#121018', scarf: '#e8402e', acc: 'band', trail: ['#e8402e', '#ff8a6e'], tshape: 'circle', cost: 0 },
  { id: 'kitsune', name: 'Kitsune', body: '#4a3026', dark: '#22150f', scarf: '#ff8a3d', acc: 'fox', trail: ['#ffb36b', '#ff8a3d'], tshape: 'circle', cost: 250 },
  { id: 'yuki', name: 'Yuki', body: '#e8eef6', dark: '#9aa8bd', scarf: '#5aa9ff', acc: 'pom', trail: ['#ffffff', '#cfe8ff'], tshape: 'star', cost: 500 },
  { id: 'sakura', name: 'Sakura', body: '#2f2036', dark: '#170f1c', scarf: '#ff8fc0', acc: 'flower', trail: ['#ffc2dc', '#ff8fc0'], tshape: 'square', cost: 800 },
  { id: 'oni', name: 'Oni', body: '#4a1626', dark: '#1e0910', scarf: '#ffd84d', acc: 'horns', trail: ['#ff6a3d', '#ffd84d'], tshape: 'spark', cost: 1200 },
  { id: 'ronin', name: 'Ronin', body: '#2c3848', dark: '#141a22', scarf: '#c9a46a', acc: 'kasa', trail: ['#e6d3a8', '#c9a46a'], tshape: 'circle', dist: 500 },
  { id: 'tengu', name: 'Tengu', body: '#1f3328', dark: '#0f1612', scarf: '#e8402e', acc: 'tengu', trail: ['#2a2a2a', '#5a5a5a'], tshape: 'square', dist: 1000 },
  { id: 'kin', name: 'Kin', body: '#e0aa22', dark: '#8a6510', scarf: '#ffffff', acc: 'crown', trail: ['#fff3a0', '#ffd84d'], tshape: 'star', cost: 3000 },
];
const skinOwned = sk => sk.cost === 0 || K.meta.unlocks.has('skin:' + sk.id);
const currentSkin = () => { const id = K.meta.unlocks.selected('skin', 'kage'); return SKINS.find(s => s.id === id && skinOwned(s)) || SKINS[0]; };

/* ---------- 3a. SIMULATION (pure: no drawing, no audio, no Math.random) ---------- */
const speedAt = m => Math.min(880, 470 + m * 0.42);

const Sim = {
  create(seed, up) {
    const s = {
      rng: K.rng(seed), t: 0, events: [], over: false, continued: false, up,
      p: { x: X0, y: 520, px: X0, py: 520, vy: 0, ground: true, bid: 1, lastBid: 1, coyote: 0, jbuf: 0, holdT: 0, holding: false,
        air: up.air, slideT: 0, slideQ: false, fast: false, dead: false, deadT: 0, dvx: 0, cause: '', slow: 0, inv: 0, gtop: 520, falling: false },
      blds: [], obs: [], coins: [], picks: [], shots: [], nid: 2,
      spd: speedAt(0), dist: 0, coinsGot: 0, stars: 0, roofs: 0, shattered: 0, closeCalls: 0, nextMile: 100, slides: 0,
    };
    s.blds.push({ id: 1, x: -900, w: 900 + X0 + 1150, top: 520, style: 0 });
    for (let i = 0; i < 6; i++) Sim.coin(s, X0 + 520 + i * 58, 520 - 40);
    while (Sim.edge(s) < X0 + 3400) Sim.gen(s);
    return s;
  },
  emit(s, type, d = {}) { d.type = type; s.events.push(d); },
  edge(s) { const b = s.blds[s.blds.length - 1]; return b.x + b.w; },
  coin(s, x, y) { s.coins.push({ x, y, px: x, py: y, taken: false, mag: false }); },
  // horizontal distance covered by a jump that lands dh lower (dh<0 = higher roof)
  reach(spd, dh, hold) {
    let y = 0, vy = -JV, t = 0, ht = 0; const dt = 1 / 120;
    for (let i = 0; i < 400; i++) {
      let g = G;
      if (hold && vy < 0 && ht < HOLD_T) { g = G * HOLD_G; ht += dt; }
      vy += g * dt; y += vy * dt; t += dt;
      if (vy > 0 && y >= dh) break;
    }
    return t * spd;
  },
  arc(s, x, y0, spd, hold, n, dx) {    // coins along a jump trajectory starting at (x, y0)
    let y = 0, vy = -JV, ht = 0, t = 0, k = 0; const dt = 1 / 120;
    for (let i = 0; i < 400 && k < n; i++) {
      let g = G;
      if (hold && vy < 0 && ht < HOLD_T) { g = G * HOLD_G; ht += dt; }
      vy += g * dt; y += vy * dt; t += dt;
      if (t * spd >= dx * (k + 1)) { Sim.coin(s, x + t * spd, y0 + y - 44); k++; }
    }
  },
  gen(s) {
    const r = s.rng, last = s.blds[s.blds.length - 1], ex = last.x + last.w;
    const m = (ex - X0) / PXM, spd = speedAt(m), diff = M.clamp(m / 800, 0, 1);
    const top = Math.round(M.clamp(last.top + r.range(-55 - 55 * diff, 80 + 60 * diff), 380, 610));
    const dh = top - last.top;
    const rh = Sim.reach(spd, dh, true), rt = Sim.reach(spd, dh, false);
    let gap;
    if (m < 70) gap = r.range(0.32, 0.55) * rt;
    else gap = r.range(0.38, 0.5 + 0.3 * diff) * (r.chance(0.35 + 0.4 * diff) ? rh : rt);
    gap = Math.round(Math.max(90, Math.min(gap, rh - 70)));
    const w = Math.round(Math.max(440, r.range(1.0, 2.1) * spd * (1 - 0.18 * diff)));
    const b = { id: s.nid++, x: ex + gap, w, top, style: r.int(0, 3) };
    s.blds.push(b);
    // coin arc over the gap (follows a real jump)
    if (r.chance(0.5)) Sim.arc(s, ex - 40, last.top, spd, gap > rt * 0.8, 6, (gap + 80) / 6.5);
    // features on the roof
    const feats = [];
    if (m > 95 && r.chance(0.22 + 0.3 * diff)) feats.push('bill');
    if (m > 45 && r.chance(0.2 + 0.25 * diff)) feats.push('crate');
    if (m > 20 && r.chance(0.26)) feats.push('glass');
    r.shuffle(feats);
    let cx = b.x + 230;
    const xEnd = b.x + w - Math.max(220, spd * 0.55);
    for (const f of feats) {
      if (f === 'bill') {
        const bw = Math.round(r.range(150, 230) / 10) * 10;
        cx = Math.max(cx, b.x + spd * 0.9);     // leave room to land from a long jump before the sign
        if (cx + bw > xEnd) continue;
        s.obs.push({ id: s.nid++, type: 'bill', x: cx, w: bw, y0: top - 300, y1: top - 56, top, v: r.int(0, 3), broken: false });
        for (let i = 0; i < 3; i++) Sim.coin(s, cx + 30 + i * (bw - 60) / 2, top - 22);
        cx += bw + 300;
      } else if (f === 'crate') {
        if (cx + 66 > xEnd) continue;
        s.obs.push({ id: s.nid++, type: 'crate', x: cx, w: 66, y0: top - 58, y1: top, top, broken: false });
        Sim.coin(s, cx + 33, top - 120);
        cx += 66 + 300;
      } else {
        const gx = cx + 120;
        if (gx + 64 > xEnd) continue;
        s.picks.push({ x: gx - r.range(240, 330), y: top - 64, taken: false });
        s.obs.push({ id: s.nid++, type: 'glass', x: gx, w: 64, y0: top - 112, y1: top, top, bonus: r.int(5, 8), broken: false, targeted: false });
        cx = gx + 64 + 300;
      }
    }
    // a line of coins on clear roofs
    if (!feats.length && r.chance(0.65)) { const n = r.int(4, 7), x0 = b.x + r.range(120, Math.max(130, w - n * 58 - 160)); for (let i = 0; i < n; i++) Sim.coin(s, x0 + i * 58, top - 40); }
    if (r.chance(0.12 + (s.stars ? 0 : 0.1)) && w > 600) s.picks.push({ x: b.x + w * 0.5, y: top - 150, taken: false });
  },
  curB(s) { const p = s.p; for (const b of s.blds) if (b.id === p.bid) return b; return null; },
  overhead(s) {
    const p = s.p;
    for (const o of s.obs) if (o.type === 'bill' && o.x < p.x + HW + 6 && o.x + o.w > p.x - HW) return true;
    return false;
  },
  startSlide(s) { const p = s.p; p.slideT = s.up.slide; p.slideQ = false; s.slides++; Sim.emit(s, 'slide', { x: p.x, y: p.y }); },
  jump(s, v, air) {
    const p = s.p;
    p.vy = -v; p.ground = false; p.coyote = 0; p.jbuf = 0; p.holding = true; p.holdT = 0; p.slideT = 0; p.slideQ = false; p.fast = false;
    Sim.emit(s, air ? 'airjump' : 'jump', { x: p.x, y: p.y });
  },
  land(s, b, mantle) {
    const p = s.p, hard = p.vy > 1300;
    p.y = b.top; p.vy = 0; p.ground = true; p.bid = b.id; p.air = s.up.air; p.fast = false; p.holding = false; p.gtop = b.top; p.falling = false;
    let close = false;
    if (b.id !== p.lastBid) {
      p.lastBid = b.id; s.roofs++;
      if (!mantle && p.x - HW - b.x < 26) { close = true; s.closeCalls++; s.coinsGot += 2; }
      if (s.roofs % 10 === 0) Sim.emit(s, 'streak', { n: s.roofs });
    }
    Sim.emit(s, 'land', { x: p.x, y: p.y, hard, mantle, close });
    if (p.slideQ) Sim.startSlide(s);
  },
  die(s, cause) {
    const p = s.p;
    p.dead = true; p.deadT = 0; p.cause = cause; p.dvx = -170; p.vy = -560; p.ground = false; p.slideT = 0;
    Sim.emit(s, 'dead', { x: p.x, y: p.y - 50, cause });
  },
  end(s) { s.over = true; Sim.emit(s, 'over', {}); },
  step(s, dt, cmd) {
    if (s.over) return;
    s.t += dt;
    const p = s.p;
    p.px = p.x; p.py = p.y;
    for (const sh of s.shots) { sh.px = sh.x; sh.py = sh.y; }
    if (p.dead) {
      p.deadT += dt; p.x += p.dvx * dt; p.vy = Math.min(p.vy + G * dt, 1800); p.y += p.vy * dt;
      if (p.deadT > 1.05 || p.y > 1500) Sim.end(s);
      return;
    }
    const m = (p.x - X0) / PXM;
    p.slow = Math.max(0, p.slow - dt); p.inv = Math.max(0, p.inv - dt);
    const spd = speedAt(m) * (1 - 0.32 * Math.min(1, p.slow / 0.9));
    s.spd = spd;
    // input
    if (cmd.jump) p.jbuf = 0.13;
    if (cmd.slide) {
      if (p.ground) Sim.startSlide(s);
      else if (!p.fast) { p.fast = true; p.vy = Math.max(p.vy, 950); p.holding = false; p.slideQ = true; Sim.emit(s, 'dive', { x: p.x, y: p.y }); }
    }
    if (p.jbuf > 0) {
      const under = p.ground && p.slideT > 0 && Sim.overhead(s);
      if (!under && (p.ground || p.coyote > 0)) Sim.jump(s, JV, false);
      else if (!under && p.air > 0 && !p.ground) { p.air--; Sim.jump(s, AJV, true); }
      else p.jbuf -= dt;
    }
    p.holding = p.holding && !!cmd.held;
    let g = G;
    if (p.holding && p.vy < 0 && p.holdT < HOLD_T) { g = G * HOLD_G; p.holdT += dt; }
    // move
    p.x += spd * dt;
    const prevFront = p.px + HW;
    if (p.ground) {
      const b = Sim.curB(s);
      if (!b || p.x - 4 > b.x + b.w) { p.ground = false; p.coyote = 0.09; p.vy = 0; p.slideT = 0; }
    }
    if (!p.ground) {
      p.coyote -= dt;
      p.vy = Math.min(p.vy + g * dt, 1800); p.y += p.vy * dt;
      for (const b of s.blds) {
        if (p.x + HW <= b.x || p.x - HW >= b.x + b.w) continue;
        if (p.py <= b.top + 0.5 && p.y >= b.top && p.vy >= 0) { Sim.land(s, b, false); break; }
        if (p.y > b.top + 0.5 && prevFront <= b.x + 0.5) {
          if (p.y - b.top <= 30) Sim.land(s, b, true);
          else if (p.y - STAND_H < b.top + 500) Sim.die(s, 'wall');
          break;
        }
      }
      if (!p.ground && !p.dead && !p.falling && p.y > p.gtop + 170) { p.falling = true; Sim.emit(s, 'falling', { x: p.x, y: p.y }); }
    }
    if (p.dead) return;
    // slide
    if (p.slideT > 0) { p.slideT -= dt; if (p.slideT <= 0 && p.ground && Sim.overhead(s)) p.slideT = 0.05; }
    const h = p.slideT > 0 ? SLIDE_H : STAND_H;
    // obstacles
    for (const o of s.obs) {
      if (o.broken || o.x > p.x + 40 || o.x + o.w < p.x - 40) continue;
      if (p.x + HW > o.x && p.x - HW < o.x + o.w && p.y > o.y0 && p.y - h < o.y1) {
        if (o.type === 'bill') { if (!p.inv) { Sim.die(s, 'bill'); return; } }
        else {
          o.broken = true;
          if (!p.inv) { p.slow = 0.9; Sim.emit(s, o.type === 'glass' ? 'crash' : 'crate', { x: o.x + o.w / 2, y: o.y0 + (o.y1 - o.y0) / 2 }); }
          else Sim.emit(s, 'smash', { x: o.x + o.w / 2, y: o.y0 + (o.y1 - o.y0) / 2, glass: o.type === 'glass' });
        }
      }
    }
    // auto-throw shuriken at glass cases ahead
    if (s.stars > 0) for (const o of s.obs) {
      if (o.type !== 'glass' || o.broken || o.targeted || o.x < p.x + 20 || o.x - p.x > 470) continue;
      o.targeted = true; s.stars--;
      const y = p.y - h * 0.62;
      s.shots.push({ x: p.x + 16, y, px: p.x + 16, py: y, vx: spd + 1300, tx: o.x + 6, ty: o.y0 + 56, oid: o.id });
      Sim.emit(s, 'throw', { x: p.x + 16, y });
      break;
    }
    for (let i = s.shots.length - 1; i >= 0; i--) {
      const sh = s.shots[i];
      sh.x += sh.vx * dt; sh.y += (sh.ty - sh.y) * Math.min(1, dt * 12);
      if (sh.x >= sh.tx) {
        s.shots.splice(i, 1);
        const o = s.obs.find(q => q.id === sh.oid);
        if (o && !o.broken) { o.broken = true; s.coinsGot += o.bonus; s.shattered++; Sim.emit(s, 'shatter', { x: o.x + o.w / 2, y: o.y0 + 56, bonus: o.bonus }); }
      }
    }
    // coins & pickups
    const cx = p.x, cy = p.y - h / 2, mg = s.up.magnet;
    for (const c of s.coins) {
      if (c.taken) continue;
      const dx = cx - c.x, dy = cy - c.y;
      if (dx > 200 || dx < -mg - 60) continue;
      const d2 = dx * dx + dy * dy;
      if (mg && !c.mag && d2 < mg * mg) c.mag = true;
      if (c.mag) {
        c.px = c.x; c.py = c.y;
        const d = Math.sqrt(d2) || 1, st = Math.min(d, (spd + 900) * dt);
        c.x += dx / d * st; c.y += dy / d * st;
      }
      if (d2 < 46 * 46) { c.taken = true; s.coinsGot++; Sim.emit(s, 'coin', { x: c.x, y: c.y }); }
    }
    for (const k of s.picks) {
      if (k.taken) continue;
      const dx = cx - k.x, dy = cy - k.y;
      if (dx * dx + dy * dy < 50 * 50) {
        k.taken = true;
        if (s.stars < s.up.cap) { s.stars++; Sim.emit(s, 'star', { x: k.x, y: k.y }); }
        else { s.coinsGot += 3; Sim.emit(s, 'starFull', { x: k.x, y: k.y }); }
      }
    }
    if (p.y > 1250) { Sim.end(s); return; }
    // progress
    s.dist = Math.max(0, Math.floor((p.x - X0) / PXM));
    if (s.dist >= s.nextMile) { Sim.emit(s, 'mile', { m: s.nextMile }); s.nextMile += 100; }
    while (Sim.edge(s) < p.x + 3400) Sim.gen(s);
    const cut = p.x - 1700;
    K.compact(s.blds, b => b.x + b.w > cut || b.id === p.bid);
    K.compact(s.obs, o => o.x + o.w > cut);
    K.compact(s.coins, c => !c.taken && c.x > cut);
    K.compact(s.picks, k => !k.taken && k.x > cut);
  },
  revive(s) {
    const p = s.p;
    let b = null;
    if (p.cause !== 'gap' && p.cause !== '') b = s.blds.find(q => p.x >= q.x - 5 && p.x < q.x + q.w - 460);
    if (!b) b = s.blds.find(q => q.x > p.x - 60) || s.blds[s.blds.length - 1];
    p.x = Math.max(p.x, b.x + 50); p.px = p.x;
    p.y = p.py = b.top; p.vy = 0; p.ground = true; p.bid = p.lastBid = b.id; p.gtop = b.top; p.dead = false; p.falling = false;
    p.slideT = 0; p.slideQ = false; p.fast = false; p.air = s.up.air; p.slow = 0; p.inv = 2.2; p.jbuf = 0; p.cause = '';
    K.compact(s.obs, o => o.x + o.w < p.x - 40 || o.x > p.x + 900);
    s.shots.length = 0;
    s.over = false; s.continued = true;
    Sim.emit(s, 'revive', { x: p.x, y: p.y });
  },
};

/* ---------- 3b. PRESENTATION (reads sim state, never writes it) ---------- */
const hh = (a, b, c) => { let h = (a * 374761393 + b * 668265263 + c * 1442695041) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };

K.music.define('dusk', { bpm: 76, tracks: [
  { inst: 'pad', p: 'D3 - - - - - - - - - - - - - - - Bb2 - - - - - - - - - - - - - - - F3 - - - - - - - - - - - - - - - A2 - - - - - - - - - - - - - - -', v: 0.55 },
  { inst: 'pluck', p: 'D5 . . A4 . . Bb4 . A4 . . . F4 . . . E4 . . . F4 . A4 . D4 . . . . . . . D5 . . E5 . . F5 . E5 . . . D5 . . . A4 . . . Bb4 . A4 . E4 . . . . . . .', v: 0.45 },
  { inst: 'kick', p: 'x . . . . . . . . . . . . . . . x . . . . . . . . . x . . . . .', v: 0.3 },
] });

K.audio.define('mon', (p = 1) => { K.audio.tone({ wave: 'square', f0: 1046 * p, dur: 0.06, vol: 0.1 }); K.audio.tone({ wave: 'square', f0: 1568 * p, dur: 0.14, vol: 0.09, delay: 0.05 }); });
K.audio.define('slide', () => K.audio.tone({ noise: true, dur: 0.32, vol: 0.28, filter: 1100, attack: 0.02 }));
K.audio.define('throw', () => { K.audio.tone({ noise: true, dur: 0.14, vol: 0.2, hp: 2500, filter: 7000 }); K.audio.tone({ wave: 'triangle', f0: 1900, f1: 900, dur: 0.12, vol: 0.08 }); });
K.audio.define('shatter', () => {
  K.audio.tone({ noise: true, dur: 0.35, vol: 0.4, hp: 2600 });
  [2637, 3520, 2960, 4186].forEach((f, i) => K.audio.tone({ wave: 'triangle', f0: f, f1: f * 0.98, dur: 0.12, vol: 0.07, delay: 0.03 + i * 0.045 }));
});

/* ----- backdrop: dusk sky, sun, ink-wash skyline layers ----- */
function pagoda(g, cx, by, w, col) {
  g.fillStyle = col;
  let y = by, ww = w;
  for (let k = 0; k < 3; k++) {
    const th = 16 + (2 - k) * 2;
    g.fillRect(cx - ww * 0.32, y - th, ww * 0.64, th);
    y -= th;
    g.beginPath(); g.moveTo(cx - ww * 0.62, y + 4); g.quadraticCurveTo(cx - ww * 0.4, y - 2, cx - ww * 0.36, y - 10);
    g.lineTo(cx + ww * 0.36, y - 10); g.quadraticCurveTo(cx + ww * 0.4, y - 2, cx + ww * 0.62, y + 4); g.closePath(); g.fill();
    y -= 10; ww *= 0.78;
  }
  g.fillRect(cx - 1.5, y - 26, 3, 26);
}
const LAYERS = [
  { key: 'far', seed: 11, col: '#a25277', mist: '#b8607a', f: 0.1, base: 0.80, wmin: 50, wmax: 140, hmin: 70, hmax: 230, pag: 0.16, win: null, res: 0.6 },
  { key: 'mid', seed: 23, col: '#6b2f62', mist: '#80405f', f: 0.24, base: 0.88, wmin: 60, wmax: 150, hmin: 60, hmax: 200, pag: 0.08, win: 'rgba(255,184,110,0.55)', res: 0.7 },
  { key: 'near', seed: 37, col: '#3c2046', mist: '#33193c', f: 0.45, base: 0.98, wmin: 70, wmax: 170, hmin: 50, hmax: 180, pag: 0.0, win: 'rgba(255,200,120,0.8)', res: 0.8 },

// device-pixel aligned, unscaled blit: by far the cheapest way to draw a big cached sprite
function blit(ctx, spr, x, y) {
  const T = ctx.getTransform();
  const dx = Math.round(T.a * (x - spr.pad) + T.e), dy = Math.round(T.d * (y - spr.pad) + T.f);
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(spr.canvas, dx, dy); ctx.restore();
}
function layerSprite(L) {
  const W = 1600, H = 330;
  return K.draw.sprite('sky:' + L.key, W, H, g => {
    const r = K.rng(L.seed);
    let x = 0;
    while (x < W) {
      const bw = Math.min(r.range(L.wmin, L.wmax), W - x), bh = r.range(L.hmin, L.hmax), by = H - bh;
      g.fillStyle = L.col; g.fillRect(x, by, bw, bh);
      const roll = r();
      if (roll < L.pag && bw > 70) pagoda(g, x + bw / 2, by, bw * 0.9, L.col);
      else if (roll < 0.4) { g.fillRect(x + bw * r.range(0.2, 0.7), by - r.range(18, 60), 3, 60); }
      else if (roll < 0.58) { const tx = x + bw * r.range(0.2, 0.6); g.fillRect(tx, by - 30, 26, 22); g.fillRect(tx + 3, by - 10, 3, 10); g.fillRect(tx + 20, by - 10, 3, 10); g.beginPath(); g.moveTo(tx - 2, by - 30); g.lineTo(tx + 13, by - 42); g.lineTo(tx + 28, by - 30); g.fill(); }
      if (L.win) {
        g.fillStyle = L.win;

      }

    g.globalCompositeOperation = 'source-atop';
    const mg = g.createLinearGradient(0, H - 100, 0, H);
    mg.addColorStop(0, K.color.alpha(L.mist, 0)); mg.addColorStop(1, L.mist);
    g.fillStyle = mg; g.fillRect(0, H - 100, W, 100);
    g.globalCompositeOperation = 'source-over';
  }, { pad: 0 });
}

function duskBackdrop(ctx, tScroll = 0) {
  const v = K.view, c = K.camera;
  blit(ctx, skySprite(), -v.ox - 1, -v.oy - 1);
  const camOffX = c.x - v.w / 2, camOffY = c.y - 420;
  // clouds
  const cs = cloudSprite(), cox = camOffX * 0.04 + tScroll * 12;
  for (let x = Math.floor((cox - v.ox) / 1600) * 1600; x < cox + v.w + v.ox; x += 1600) blit(ctx, cs, x - cox, v.h * 0.12 - camOffY * 0.03);

  ctx.strokeStyle = 'rgba(30,18,40,0.75)'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
  for (let i = 0; i < 5; i++) {
    const span = v.fullW + 400, bx = ((K.time * (22 + i * 5) + i * 333 - camOffX * 0.08) % span + span) % span - v.ox - 200, by = v.h * (0.2 + 0.05 * i) + Math.sin(K.time * 0.7 + i) * 12;
    const fl = Math.sin(K.time * 9 + i * 2) * 5;

  for (const L of LAYERS) {
    const spr = layerSprite(L), ox = camOffX * L.f, baseY = Math.round(v.h * L.base - camOffY * L.f);
    for (let x = Math.floor((ox - v.ox) / 1600) * 1600; x < ox + v.w + v.ox; x += 1600) blit(ctx, spr, x - ox, baseY - 330);
    if (baseY < v.h + v.oy) { ctx.fillStyle = L.mist; ctx.fillRect(-v.ox - 2, baseY - 1, v.fullW + 4, v.h + v.oy - baseY + 4); }
  }
}

const FAC = ['#221a2c', '#1d1928', '#281c2a', '#1b1724'];
function drawBuilding(ctx, b, R) {

  ctx.fillStyle = '#ff9e6b'; ctx.fillRect(x - 6, top, w + 12, 4);

/* ----- the ninja ----- */
function stroke2(ctx, pts, col, w) {
  ctx.beginPath(); ctx.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.lineWidth = w + 5; ctx.strokeStyle = INK; ctx.stroke();
  ctx.lineWidth = w; ctx.strokeStyle = col; ctx.stroke();
}
function ribbon(ctx, x, y, len, n, t, amp, col, w, droop) {

function legPts(hx, hy, thigh, knee) {

// o: { skin, pose: run|jump|fall|flail|slide|dead|idle, phase, t, sx, sy, rot, mood, alpha, wind }
function drawNinja(ctx, x, y, o) {

  if (o.scale) ctx.scale(o.scale, o.scale);
  ctx.scale(o.sx || 1, o.sy || 1);
  if (pose === 'slide') { ctx.translate(-2, -8); ctx.rotate(-1.18); ctx.translate(0, 8); }
  if (o.rot) { ctx.translate(0, -42); ctx.rotate(o.rot); ctx.translate(0, 42); }
  const lean = pose === 'run' ? 0.26 : pose === 'jump' || pose === 'leap' ? 0.14 : pose === 'idle' ? 0.02 : pose === 'slide' ? 0 : 0.06;
  const hipY = -26;
  let L1, L2;
  const a = ph * TAU;
  if (pose === 'run') { L1 = legPts(0, hipY, Math.sin(a) * 0.95, 0.25 + Math.max(0, -Math.cos(a)) * 1.3); L2 = legPts(0, hipY, Math.sin(a + Math.PI) * 0.95, 0.25 + Math.max(0, -Math.cos(a + Math.PI)) * 1.3); }
  else if (pose === 'jump') { L1 = legPts(0, hipY, 1.1, 1.9); L2 = legPts(0, hipY, 0.5, 1.6); }
  else if (pose === 'leap') { L1 = legPts(0, hipY, 1.25, 0.35); L2 = legPts(0, hipY, -0.95, 0.9); }
  else if (pose === 'fall') { L1 = legPts(0, hipY, 0.35, 0.4); L2 = legPts(0, hipY, -0.25, 0.3); }
  else if (pose === 'flail' || pose === 'dead') { L1 = legPts(0, hipY, Math.sin(t * 22) * 0.8, 0.6); L2 = legPts(0, hipY, Math.sin(t * 22 + 2) * 0.8, 0.6); }
  else if (pose === 'slide') { L1 = legPts(0, hipY, 0.08, 0); L2 = legPts(0, hipY, -0.06, 0.15); }
  else { const br = Math.sin(t * 2.4) * 0.03; L1 = legPts(-1, hipY, 0.14 + br, 0); L2 = legPts(1, hipY, -0.14 - br, 0); }

  const sp = pose === 'idle' ? 0.9 : 0.25;

/* ----- shared world renderer ----- */
function poseOf(p) {
  if (p.dead) return 'dead';
  if (p.falling) return 'flail';
  if (p.ground) return p.slideT > 0 ? 'slide' : 'run';
  return p.vy < -380 ? 'leap' : p.vy < 120 ? 'jump' : 'fall';
}
function drawWorld(ctx, s, a) {
  const R = K.camera.rect;
  for (const b of s.blds) if (b.x < R.x1 && b.x + b.w > R.x0) drawBuilding(ctx, b, R);
  drawBestFlag(ctx, s, R, SAVE.best);
  for (const o of s.obs) {
    if (o.x > R.x1 + 40 || o.x + o.w < R.x0 - 40) continue;
    if (o.type === 'bill') K.draw.drawSprite(billSprite(o), o.x, o.y0, { ax: 0, ay: 0 });
    else if (o.type === 'crate') { if (!o.broken) K.draw.drawSprite(acSprite(), o.x, o.y1, { ax: 0, ay: 1 }); }
    else { if (!o.broken) K.draw.glow(o.x + 32, o.y0 + 56, 90, '#ffd84d', 0.3); K.draw.drawSprite(glassSprite(o.broken), o.x, o.y1, { ax: 0, ay: 1 }); }
  }
  for (const k of s.picks) {
    if (k.taken || k.x < R.x0 || k.x > R.x1) continue;
    const bob = Math.sin(K.time * 4 + k.x) * 6;
    K.draw.glow(k.x, k.y + bob, 46, '#bfe6ff', 0.5);
    drawShuriken(ctx, k.x, k.y + bob, 19, K.time * 5);
  }
  for (const c of s.coins) {
    if (c.taken || c.x < R.x0 - 20 || c.x > R.x1 + 20) continue;
    drawCoin(M.lerp(c.px, c.x, a), M.lerp(c.py, c.y, a) + Math.sin(K.time * 3 + c.x * 0.02) * 3, K.time * 4 + c.x * 0.013);
  }
  for (const sh of s.shots) {
    const x = M.lerp(sh.px, sh.x, a), y = M.lerp(sh.py, sh.y, a);
    ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(x - 70, y); ctx.lineTo(x, y); ctx.stroke();
    drawShuriken(ctx, x, y, 14, K.time * 30);
  }
}

function backBtn(to = 'title') {
  return K.ui.button({ icon: 'arrowL', color: 'gray', w: 96, h: 96, key: 'back', popIn: 0.05, place: v => ({ x: 70 + v.safe.left, y: 66 + v.safe.top }), onTap: () => K.scenes.go(to) });
}
function coinPill() { const v = K.view; K.draw.pill(v.w - 140 - v.safe.right, 66 + v.safe.top, K.fmt(K.meta.wallet.get('coins')), { icon: 'coin', size: 34, minW: 200 }); }
function dimBackdrop(ctx) { const v = K.view; duskBackdrop(ctx, K.time); ctx.fillStyle = 'rgba(20,12,30,0.55)'; ctx.fillRect(-v.ox, -v.oy, v.fullW, v.fullH); }
function upgradeSnapshot() {
  return { air: K.meta.upgrades.value('jumps'), slide: K.meta.upgrades.value('slide'), magnet: K.meta.upgrades.value('magnet'), cap: K.meta.upgrades.value('stars') };
}
function cheapestTarget() {   // next skin to save up for
  let best = null;
  for (const sk of SKINS) if (!skinOwned(sk) && sk.cost) if (!best || sk.cost < best.cost) best = sk;
  return best;
}
function canAffordSomething() {
  for (const u of UPS) if (K.meta.wallet.can('coins', K.meta.upgrades.cost(u.id))) return true;
  return false;
}

      const dy = P.y - P.startY, dx = P.x - P.startX;

      case 'shatter':

        K.fx.burst(e.x, e.y, { shape: 'square', colors: ['#bfefff', '#ffffff', '#8fd8ff'], count: 26, speed: [250, 750], size: [4, 10], gravity: 1400 });
        K.fx.burst(e.x, e.y, { colors: ['#ffd84d', '#f2c437'], count: 14, speed: [200, 600], size: [7, 11], gravity: 1200 });
        K.fx.ring(e.x, e.y, { r0: 20, r1: 120, color: '#ffd84d', width: 8 });
        K.fx.text(e.x, e.y - 60, '+' + e.bonus, { size: 56, color: '#ffd84d' });
        K.tween.killOf(this.coinPop); this.coinPop.s = 1.5; K.tween(this.coinPop, { s: 1 }, 0.45, K.Ease.outElastic);
        break;
      case 'crash':
        K.audio.play('hit'); K.haptic('heavy'); K.fx.shake(12, 0.3);
        K.fx.burst(e.x, e.y, { shape: 'square', colors: ['#bfefff', '#ffffff'], count: 20, speed: [200, 600], size: [4, 9], gravity: 1400 });
        K.fx.text(e.x, e.y - 70, 'OUCH!', { size: 48, color: '#ff9a8a' });
        break;
      case 'crate':
        K.audio.play('hit'); K.haptic('heavy'); K.fx.shake(10, 0.28);
        K.fx.burst(e.x, e.y, { shape: 'square', colors: ['#8d8799', '#5f596e', '#3a3546'], count: 16, speed: [200, 600], size: [5, 10], gravity: 1500 });
        K.fx.text(e.x, e.y - 70, 'STUMBLE!', { size: 42, color: '#ff9a8a' });
        break;
      case 'smash':
        K.audio.play(e.glass ? 'shatter' : 'hit'); K.fx.burst(e.x, e.y, { shape: 'square', colors: e.glass ? ['#bfefff', '#ffffff'] : ['#8d8799', '#5f596e'], count: 16, speed: [200, 600], size: [4, 9], gravity: 1400 });
        break;
      case 'streak':
        K.audio.play('power');
        K.fx.text(v.w / 2, v.h * 0.32, e.n + ' ROOFS!', { size: 70, color: '#ffd2a6', screen: true, life: 1.1, rise: 50 });
        break;
      case 'mile':
        K.audio.play('levelup');
        K.tween.killOf(this.distPop); this.distPop.s = 1.5; K.tween(this.distPop, { s: 1 }, 0.5, K.Ease.outElastic);
        K.fx.burst(v.w / 2, 66 + v.safe.top, { screen: true, shape: 'star', colors: ['#ffd84d', '#ff8a4c', '#ffffff'], count: 18, speed: [200, 500], size: [6, 12], gravity: 600 });
        break;
      case 'dead':
        K.audio.play('bonk'); K.haptic('heavy'); K.fx.shake(22, 0.45); K.fx.hitstop(0.12); K.fx.flash('#e8402e', 0.35);
        K.fx.burst(e.x, e.y, { shape: 'star', colors: ['#ffffff', '#ffd84d'], count: 14, speed: [200, 600], size: [6, 12], gravity: 600 });
        K.fx.text(e.x, e.y - 70, e.cause === 'bill' ? 'BONK!' : 'SPLAT!', { size: 72, color: '#ff6a4c' });
        break;
      case 'falling':
        K.audio.play('scream'); K.haptic('medium');
        break;
      case 'revive':
        K.audio.play('power'); K.fx.flash('#ffffff', 0.5); K.fx.ring(e.x, e.y - 40, { r0: 20, r1: 180, color: '#ffd84d', width: 10 });
        K.fx.text(e.x, e.y - 130, 'AGAIN!', { size: 60, color: '#ffd84d' });
        break;
      case 'over':
        K.audio.play('lose');
        K.scenes.go('over', { s, cam: { x: this.cam.x, y: this.cam.y } });
        break;
    }
  },
  updateHints() {
    const s = this.s, p = s.p, H = SAVE.hint;
    let h = null;
    if (!p.dead && p.ground) {
      const b = Sim.curB(s);
      const toEdge = b ? b.x + b.w - p.x : 9999;
      let bill = null;
      for (const o of s.obs) if (o.type === 'bill' && o.x > p.x && o.x - p.x < 520) { bill = o; break; }
      if (!H.slide && bill) h = 'slide';
      else if (!H.jump && toEdge < 330) h = 'jump';
      else if (H.jump && !H.hold && toEdge < 360) {
        const nb = s.blds[s.blds.indexOf(b) + 1];
        if (nb && nb.x - (b.x + b.w) > 230) h = 'hold';
      }
    }
    if (this.hint === 'hold' && p.holdT > HOLD_T * 0.7) { H.hold = 1; K.save.later(); }
    if (h !== this.hint) { this.hint = h; this.hintT = 0; }
  },
  backdrop(ctx) { duskBackdrop(ctx, this.tAnim); },
  render(ctx, a) {
    const s = this.s, p = s.p;
    drawWorld(ctx, s, a);
    const x = M.lerp(p.px, p.x, a), y = M.lerp(p.py, p.y, a);
    const pose = poseOf(p);
    if (p.ground && pose !== 'slide') { ctx.globalAlpha = 0.35; ctx.fillStyle = '#000'; ctx.beginPath(); ctx.ellipse(x, y + 2, 22, 5, 0, 0, TAU); ctx.fill(); ctx.globalAlpha = 1; }
    const blink = !p.dead && (K.time % 2.7) < 0.1;
    const mood = p.dead ? 'dead' : p.falling ? 'scared' : blink ? 'blink' : 'focus';
    const alpha = p.inv > 0 && Math.floor(K.time * 14) % 2 ? 0.35 : 1;
    drawNinja(ctx, x, y, { skin: this.skin, pose, phase: x / 64, scale: 1.15, t: this.tAnim, sx: this.fx.sx, sy: this.fx.sy, rot: p.dead ? p.deadT * 11 : this.fx.flip, mood, alpha, wind: M.clamp((s.spd - 400) / 400, 0.3, 1.2) });
  },
  hud(ctx) {
    const v = K.view, s = this.s, st = v.safe.top, sl = v.safe.left;
    // speed lines
    if (s.spd > 600 && !s.p.dead) {
      const k = M.clamp((s.spd - 600) / 280, 0, 1);
      ctx.strokeStyle = `rgba(255,230,210,${0.25 * k})`; ctx.lineWidth = 3;
      for (let i = 0; i < 8; i++) { const yy = hh(i, 3, 9) * v.h, len = 80 + hh(i, 4, 9) * 160, xx = v.w + v.ox - ((K.time * (1600 + i * 140) + i * 300) % (v.fullW + 400)); ctx.beginPath(); ctx.moveTo(xx, yy); ctx.lineTo(xx + len, yy); ctx.stroke(); }
    }
    ctx.save(); ctx.translate(v.w / 2, 60 + st); ctx.scale(this.distPop.s, this.distPop.s);
    K.draw.text(s.dist + ' m', 0, 0, { size: 62 }); ctx.restore();
    if (SAVE.best > 0) {
      const k = M.clamp(s.dist / SAVE.best, 0, 1), bw = 240;
      K.draw.bar(v.w / 2, 112 + st, bw, 22, k, s.dist > SAVE.best ? 'yellow' : 'dusk');
      K.draw.text(s.dist > SAVE.best ? 'NEW BEST!' : 'BEST ' + SAVE.best + ' m', v.w / 2, 142 + st, { size: 20, sw: 4, color: s.dist > SAVE.best ? '#ffd84d' : '#ffd2a6' });
    }
    ctx.save(); ctx.translate(120 + sl, 56 + st); ctx.scale(this.coinPop.s, this.coinPop.s);
    K.draw.pill(0, 0, String(s.coinsGot), { icon: 'coin', size: 32, minW: 170 }); ctx.restore();
    for (let i = 0; i < s.up.cap; i++) drawShuriken(ctx, 58 + sl + i * 40, 116 + st, 16, i < s.stars ? K.time * 2 : 0, i < s.stars ? 1 : 0.3);
    if (this.hint) this.drawHint(ctx);
  },
  drawHint(ctx) {
    const v = K.view, s = this.s, p = s.p, touch = K.input.touch;
    this.hintT = (this.hintT || 0) + 1 / 60;
    const sp = K.camera.toScreen(p.x, p.y);
    const px = M.clamp(sp.x + 150, 200, v.w - 200), py = M.clamp(sp.y - 190, 170, v.h - 120);
    const pul = 1 + Math.sin(K.time * 10) * 0.08;
    ctx.save(); ctx.globalAlpha = Math.min(1, this.hintT * 4);
    if (this.hint === 'jump' || this.hint === 'hold') {
      const hold = this.hint === 'hold';
      const fy = py + 40 + (hold ? 0 : Math.abs(Math.sin(K.time * 6)) * -18);
      ctx.beginPath(); ctx.arc(px, fy, 30 * pul, 0, TAU); ctx.fillStyle = 'rgba(255,255,255,0.85)'; ctx.fill(); ctx.lineWidth = 5; ctx.strokeStyle = INK; ctx.stroke();
      if (hold) { const k = (K.time * 1.2) % 1; ctx.beginPath(); ctx.arc(px, fy, 44, -Math.PI / 2, -Math.PI / 2 + k * TAU); ctx.lineWidth = 8; ctx.strokeStyle = '#ffd84d'; ctx.stroke(); }
      else { const k = (K.time * 2) % 1; ctx.globalAlpha *= 1 - k; ctx.beginPath(); ctx.arc(px, fy, 30 + k * 40, 0, TAU); ctx.lineWidth = 5; ctx.strokeStyle = '#ffffff'; ctx.stroke(); ctx.globalAlpha = Math.min(1, this.hintT * 4); }
      K.draw.text(hold ? (touch ? 'HOLD = BIG JUMP' : 'HOLD SPACE = BIG JUMP') : (touch ? 'TAP!' : 'SPACE!'), px, py - 34, { size: hold ? 40 : 60 * pul, color: '#ffd84d' });
    } else if (this.hint === 'slide') {
      const k = (K.time * 1.6) % 1;
      K.draw.arrow(px, py - 40 + k * 30, px, py + 40 + k * 30, '#ffd84d', 14);
      K.draw.text(touch ? 'SWIPE DOWN!' : 'PRESS DOWN!', px, py - 80, { size: 48 * pul, color: '#ffd84d' });
      K.draw.text('slide under the sign', px, py + 110, { size: 26, sw: 5 });
    }
    ctx.restore();
  },
});

K.scenes.add('over', {
  music: 'dusk',
  enter(p) {
    const v = K.view, s = this.s = p.s;
    this.cam = p.cam; K.camera.moveTo(p.cam.x, p.cam.y);
    this.skin = currentSkin();
    const dist = s.dist, prev = SAVE.best;
    this.prev = prev; this.newBest = dist > prev;
    if (this.newBest) SAVE.best = dist;
    const earned = s.coinsGot - (banked.get(s) || 0); banked.set(s, s.coinsGot);
    if (earned > 0) { K.meta.wallet.add('coins', earned); SAVE.coinsTotal += earned; }
    this.unlocked = [];
    for (const sk of SKINS) if (sk.dist && SAVE.best >= sk.dist && K.meta.unlocks.grant('skin:' + sk.id)) this.unlocked.push(sk);
    K.save.commit();
    K.sdk.send('score', { value: dist });
    if (prev <= 0) this.line = 'First run in the books!';
    else if (this.newBest) this.line = (dist - prev) + ' m past your old best!';
    else if (dist === prev) this.line = 'Tied your best — so close!';
    else this.line = (prev - dist <= Math.max(40, prev * 0.25) ? 'Only ' + (prev - dist) + ' m short of your best!' : (prev - dist) + ' m to beat your best');
    const tgt = cheapestTarget(), wal = K.meta.wallet.get('coins');
    this.line2 = tgt ? (wal >= tgt.cost ? 'You can afford ' + tgt.name + '! Visit NINJAS' : (tgt.cost - wal) + ' more coins for ' + tgt.name) : '';
    this.title = s.p.cause === 'bill' ? 'BONK!' : s.p.cause === 'wall' ? 'SPLAT!' : 'FELL!';
    this.shown = { d: 0, c: 0 }; this.pan = { s: 0 };
    K.tween(this.shown, { d: dist, c: s.coinsGot }, 1.0, K.Ease.outCubic, 0.3);
    K.tween(this.pan, { s: 1 }, 0.5, K.Ease.outBack);
    if (this.newBest) K.wait(1.0).then(() => {
      if (K.scenes.current !== this) return;
      K.audio.play('win'); K.haptic('success');
      K.fx.burst(v.w / 2, v.h * 0.36, { screen: true, shape: 'star', colors: ['#ffd84d', '#ff8a4c', '#ffffff'], count: 46, speed: [300, 900], size: [8, 16] });
    });
    if (this.unlocked.length) { this.line2 = 'NEW NINJA UNLOCKED: ' + this.unlocked.map(k => k.name).join(' & ') + '!'; K.wait(1.4).then(() => { if (K.scenes.current === this) K.audio.play('levelup'); }); }
    const by = v => Math.min(v.h - 80 - v.safe.bottom, v.h * 0.45 + 300);
    K.ui.button({ icon: 'home', color: 'gray', w: 110, h: 110, popIn: 0.35, place: v => ({ x: v.w / 2 - 300, y: by(v) }), onTap: () => K.scenes.go('title') });
    K.ui.button({ label: 'RETRY', icon: 'retry', color: 'dusk', w: 300, h: 116, key: 'action', pulse: true, popIn: 0.45, place: v => ({ x: v.w / 2 - 50, y: by(v) }), onTap: () => K.scenes.go('play') });
    if (!s.continued) {
      const cont = K.ui.button({ label: 'REVIVE', icon: 'video', color: 'night', w: 250, h: 116, popIn: 0.55, sub: 'watch ad', place: v => ({ x: v.w / 2 + 250, y: by(v) }),
        onTap: async () => {
          cont.enabled = false;
          const r = await K.adBreak('rewarded');
          if (r.granted && K.scenes.current === this) { K.audio.play('coin'); K.scenes.go('play', { resume: s }); }
          else { cont.label = 'NO AD'; }
        } });
    }
  },
  backdrop(ctx) { duskBackdrop(ctx, K.time); },
  render(ctx) {
    drawWorld(ctx, this.s, 1);
    const R = K.camera.rect;
    ctx.fillStyle = 'rgba(20,12,30,0.55)'; ctx.fillRect(R.x0, R.y0, R.x1 - R.x0, R.y1 - R.y0);
  },
  hud(ctx) {
    const v = K.view, cy = v.h * 0.4;
    ctx.save(); ctx.translate(v.w / 2, cy); ctx.scale(this.pan.s, this.pan.s);
    K.draw.panel(0, 0, 660, 440, { title: this.title, color: 'red' });
    drawNinja(ctx, -235, 50, { skin: this.skin, pose: 'idle', mood: this.newBest ? 'happy' : 'dead', t: K.time, scale: 1.5, wind: 0.5 });
    K.draw.label('DISTANCE', 50, -140, { size: 28, color: '#8a8a8a' });
    K.draw.text(Math.round(this.shown.d) + ' m', 50, -80, { size: 92, color: '#ffd2a6' });
    if (this.newBest) {
      ctx.save(); ctx.translate(50, -2); ctx.rotate(Math.sin(K.time * 4) * 0.05);
      K.draw.text('NEW BEST!', 0, 0, { size: 50, color: '#ffd84d' }); ctx.restore();
    } else K.draw.pill(50, -2, 'BEST ' + SAVE.best + ' m', { icon: 'trophy', size: 30 });
    K.draw.label(this.line, 50, 56, { size: 28, maxW: 410, color: this.newBest ? '#b8461e' : '#9e2216' });
    K.draw.pill(50, 116, '+' + Math.round(this.shown.c), { icon: 'coin', size: 30, minW: 150 });

    const left = { id: 77, x: -v.ox - 40, w: v.w * 0.34 + v.ox + 40, top: v.h * 0.74, style: 1 };
    const right = { id: 78, x: v.w * 0.62, w: v.w * 0.38 + v.ox + 40, top: v.h * 0.68, style: 0 };
    drawBuilding(ctx, left, R); drawBuilding(ctx, right, R);
    // billboard on the right roof
    const bo = { type: 'bill', x: v.w * 0.8, w: 220, y0: right.top - 300, y1: right.top - 56, top: right.top, v: 1 };
    K.draw.drawSprite(billSprite(bo), bo.x, bo.y0, { ax: 0, ay: 0 });
    // shattering glass case on the right roof
    const gx = v.w * 0.66, gy = right.top;
    K.draw.glow(gx + 32, gy - 60, 160, '#ffd84d', 0.55);
    K.draw.drawSprite(glassSprite(true), gx, gy, { ax: 0, ay: 1 });
    const r = K.rng(42);
    for (let i = 0; i < 26; i++) { const a = r.range(-2.6, 0.2), d = r.range(30, 170); ctx.save(); ctx.translate(gx + 32 + Math.cos(a) * d, gy - 70 + Math.sin(a) * d); ctx.rotate(r.range(0, 6)); ctx.fillStyle = r() < 0.5 ? 'rgba(200,240,255,0.85)' : '#ffffff'; ctx.strokeStyle = INK; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(-8, -5); ctx.lineTo(9, -3); ctx.lineTo(-2, 8); ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore(); }
    for (let i = 0; i < 9; i++) { const a = r.range(-2.4, -0.4), d = r.range(60, 190); drawCoin(gx + 32 + Math.cos(a) * d, gy - 80 + Math.sin(a) * d, r.range(0, 3)); }
    // coin arc across the gap
    for (let i = 0; i < 5; i++) { const k = i / 4; drawCoin(v.w * 0.5 + k * v.w * 0.12, v.h * 0.5 - Math.sin(k * Math.PI * 0.8) * 90 + k * 40, i); }
    // shuriken in flight with motion lines
    const sx = v.w * 0.6, sy = v.h * 0.6;
    ctx.strokeStyle = 'rgba(255,255,255,0.8)'; ctx.lineWidth = 5; ctx.lineCap = 'round';
    for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.moveTo(sx - 160 + i * 20, sy - 12 + i * 12); ctx.lineTo(sx - 30, sy - 12 + i * 12); ctx.stroke(); }
    K.draw.glow(sx, sy, 60, '#bfe6ff', 0.7); drawShuriken(ctx, sx, sy, 30, 0.4);
    // the hero mid-leap
    ctx.strokeStyle = 'rgba(255,240,220,0.85)'; ctx.lineWidth = 7;
    for (let i = 0; i < 5; i++) { ctx.beginPath(); ctx.moveTo(nx - 330 + i * 22, ny - 170 + i * 34); ctx.lineTo(nx - 120, ny - 170 + i * 34); ctx.stroke(); }
    for (let i = 0; i < 14; i++) { ctx.globalAlpha = 0.8 - i * 0.05; ctx.fillStyle = i % 2 ? '#ff8a6e' : '#e8402e'; ctx.beginPath(); ctx.arc(nx - 90 - i * 22, ny - 120 + Math.sin(i * 0.8) * 10 + i * 4, 9 - i * 0.4, 0, TAU); ctx.fill(); }
    ctx.globalAlpha = 1;
    drawNinja(ctx, nx, ny, { skin: SKINS[0], pose: 'leap', mood: 'focus', t: 1.3, scale: 3.3, rot: -0.1, wind: 1.3 });
  },
  hud(ctx) {
    const v = K.view;
    ctx.save(); ctx.translate(v.w / 2, v.h * 0.17); ctx.rotate(-0.05);
    K.draw.text('ROOFTOP', -40, -20, { size: 150, color: '#ffd2a6', sw: 18 });
    K.draw.text('NINJA', 150, 125, { size: 170, color: '#ff6a4c', sw: 18 });
    ctx.restore();
  },
});

K.boot(/[?&]card\b/.test(location.search) ? 'card' : 'title');
</script>
