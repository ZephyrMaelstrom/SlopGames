<script>
"use strict";
/* §1 MANIFEST */
const MANIFEST = {
  id: 'piratepinball',
  title: 'PiratePinball',
  version: '1.0.0',
  theme: 'ocean',
  orientation: 'portrait',
  design: { w: 720, h: 1280, maxW: 900 },
  touch: { stick: false, buttons: [] },
  keys: {
    flipL: ['ArrowLeft', 'KeyA', 'KeyZ', 'ShiftLeft', 'PadLB', 'PadLT', 'PadLeft', 'PadX'],
    flipR: ['ArrowRight', 'KeyD', 'KeyM', 'Slash', 'ShiftRight', 'PadRB', 'PadRT', 'PadRight', 'PadB'],
    plunge: ['Space', 'ArrowDown', 'KeyS', 'Enter', 'PadA', 'PadDown'],
  },
};
</script>
<script>
//#KERNEL-BEGIN 1.1.0
/* =========================================================================
   SlopGames KERNEL 1.1.0 — single-file HTML5 game kernel (Canvas2D, zero deps)
   Requires a global `MANIFEST` declared in an earlier <script>. Exposes `K`.
   Source of truth: /kernel/kernel-1.1.0.js  — never edit inside a game file.
   ========================================================================= */
const K = (() => {
  'use strict';
  const KERNEL_VERSION = '1.1.0';
  const TAU = Math.PI * 2;

  /* ---------- manifest defaults ---------- */
  const MF = (typeof MANIFEST !== 'undefined' && MANIFEST) ? MANIFEST : {};
  const DEFAULT_KEYS = {
    up: ['ArrowUp', 'KeyW', 'PadUp'], down: ['ArrowDown', 'KeyS', 'PadDown'],
    left: ['ArrowLeft', 'KeyA', 'PadLeft'], right: ['ArrowRight', 'KeyD', 'PadRight'],
    action: ['Space', 'Enter', 'PadA'], alt: ['ShiftLeft', 'KeyX', 'PadB'],
    pause: ['Escape', 'KeyP', 'PadStart'],
  };
  MF.id = MF.id || 'game';
  MF.title = MF.title || 'Game';
  MF.version = MF.version || '1.0.0';
  MF.design = Object.assign({ w: 720, h: 1280 }, MF.design || {});
  MF.keys = Object.assign({}, DEFAULT_KEYS, MF.keys || {});
  MF.touch = Object.assign({ stick: false, buttons: [] }, MF.touch || {});
  MF.platformOrigins = MF.platformOrigins || [];
  MF.orientation = MF.orientation || 'any';            // 'portrait' | 'landscape' | 'any'
  MF.theme = MF.theme || 'candy';

  /* ---------- canvas bootstrap (games may omit their own <canvas>) ---------- */
  if (!document.getElementById('k-base-css')) {
    const st = document.createElement('style'); st.id = 'k-base-css';
    st.textContent = 'html,body{margin:0;height:100%;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}#stage{position:fixed;inset:0;display:block;width:100%;height:100%;outline:none}';
    document.head.appendChild(st);
  }
  let canvas = document.getElementById('stage');
  if (!canvas) { canvas = document.createElement('canvas'); canvas.id = 'stage'; canvas.tabIndex = 0; document.body.appendChild(canvas); }
  const mainCtx = canvas.getContext('2d');
  let ctx = mainCtx;                                    // swapped while baking sprites

  /* =======================================================================
     MATH / RNG / NOISE / COLOR
     ======================================================================= */
  const M = {
    TAU,
    clamp: (v, a, b) => v < a ? a : v > b ? b : v,
    lerp: (a, b, t) => a + (b - a) * t,
    invLerp: (a, b, v) => (v - a) / (b - a),
    remap: (v, a, b, c, d) => c + (d - c) * ((v - a) / (b - a)),
    smoothstep: (a, b, v) => { const t = Math.max(0, Math.min(1, (v - a) / (b - a))); return t * t * (3 - 2 * t); },
    dist: (ax, ay, bx, by) => Math.hypot(bx - ax, by - ay),
    dist2: (ax, ay, bx, by) => (bx - ax) * (bx - ax) + (by - ay) * (by - ay),
    len: (x, y) => Math.hypot(x, y),
    norm: (x, y) => { const l = Math.hypot(x, y) || 1; return { x: x / l, y: y / l }; },
    dot: (ax, ay, bx, by) => ax * bx + ay * by,
    cross: (ax, ay, bx, by) => ax * by - ay * bx,
    rotate: (x, y, a) => { const c = Math.cos(a), s = Math.sin(a); return { x: x * c - y * s, y: x * s + y * c }; },
    angle: (x, y) => Math.atan2(y, x),
    angleDiff: (a, b) => { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; },
    approach: (v, t, d) => v < t ? Math.min(v + d, t) : Math.max(v - d, t),
    damp: (a, b, lambda, dt) => a + (b - a) * (1 - Math.exp(-lambda * dt)),
    wrap: (v, max) => ((v % max) + max) % max,
    sign: v => v > 0 ? 1 : v < 0 ? -1 : 0,
  };

  function rng(seed = 1) {
    let s = (seed >>> 0) || 1;
    const r = () => {
      s = (s + 0x6D2B79F5) | 0;
      let t = Math.imul(s ^ (s >>> 15), 1 | s);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    r.range = (a, b) => a + (b - a) * r();
    r.int = (a, b) => Math.floor(a + (b - a + 1) * r());
    r.pick = arr => arr[Math.floor(r() * arr.length)];
    r.chance = p => r() < p;
    r.sign = () => r() < 0.5 ? -1 : 1;
    r.shuffle = arr => { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); const t = arr[i]; arr[i] = arr[j]; arr[j] = t; } return arr; };
    r.weighted = (items, weightOf = it => it.w) => {
      let total = 0; for (const it of items) total += weightOf(it);
      let x = r() * total; for (const it of items) { x -= weightOf(it); if (x <= 0) return it; }
      return items[items.length - 1];
    };
    r.state = () => s;
    r.setState = v => { s = v | 0; };
    return r;
  }
  function hashSeed(str) {
    let h = 2166136261;
    str = String(str);
    for (let i = 0; i < str.length; i++) h = Math.imul(h ^ str.charCodeAt(i), 16777619);
    return h >>> 0;
  }
  function dailySeed(offsetDays = 0) {
    const d = new Date(Date.now() + offsetDays * 864e5);
    return hashSeed(MF.id + ':' + d.getUTCFullYear() + '-' + (d.getUTCMonth() + 1) + '-' + d.getUTCDate());
  }

  function noise(seed = 1) {
    const r = rng(seed), p = new Uint16Array(512), vals = new Float32Array(256), perm = [];
    for (let i = 0; i < 256; i++) { perm.push(i); vals[i] = r() * 2 - 1; }
    r.shuffle(perm);
    for (let i = 0; i < 512; i++) p[i] = perm[i & 255];
    const fade = t => t * t * (3 - 2 * t);
    const h1 = i => vals[p[i & 255]];
    const h2 = (i, j) => vals[p[p[i & 255] + (j & 255)]];
    function n1(x) { const xi = Math.floor(x), t = fade(x - xi); return M.lerp(h1(xi), h1(xi + 1), t); }
    function n2(x, y) {
      const xi = Math.floor(x), yi = Math.floor(y), u = fade(x - xi), v = fade(y - yi);
      return M.lerp(M.lerp(h2(xi, yi), h2(xi + 1, yi), u), M.lerp(h2(xi, yi + 1), h2(xi + 1, yi + 1), u), v);
    }
    function fbm(fn, oct, ...c) { let s = 0, a = 1, f = 1, n = 0; for (let i = 0; i < oct; i++) { s += a * fn(...c.map(v => v * f)); n += a; a *= 0.5; f *= 2; } return s / n; }
    return { n1, n2, fbm1: (x, o = 4) => fbm(n1, o, x), fbm2: (x, y, o = 4) => fbm(n2, o, x, y) };
  }

  const color = {
    rgb(hex) { hex = hex.replace('#', ''); if (hex.length === 3) hex = hex.split('').map(c => c + c).join(''); const n = parseInt(hex, 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; },
    hex(r, g, b) { return '#' + [r, g, b].map(v => Math.round(M.clamp(v, 0, 255)).toString(16).padStart(2, '0')).join(''); },
    mix(a, b, t) { const A = color.rgb(a), B = color.rgb(b); return color.hex(M.lerp(A[0], B[0], t), M.lerp(A[1], B[1], t), M.lerp(A[2], B[2], t)); },
    shade(hex, amt) { return amt >= 0 ? color.mix(hex, '#ffffff', amt) : color.mix(hex, '#000000', -amt); },
    alpha(hex, a) { const c = color.rgb(hex); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; },
    hsl(h, s, l) { return `hsl(${h},${s}%,${l}%)`; },
    pal(base) { return [color.shade(base, 0.45), base, color.shade(base, -0.3)]; },
  };

  const fmt = (n) => {
    const a = Math.abs(n);
    if (a < 1000) return String(Math.floor(n));
    const u = ['K', 'M', 'B', 'T', 'Qa', 'Qi']; let i = -1, v = a;
    while (v >= 1000 && i < u.length - 1) { v /= 1000; i++; }
    return (n < 0 ? '-' : '') + (v < 10 ? v.toFixed(2) : v < 100 ? v.toFixed(1) : Math.floor(v)) + u[i];
  };
  const fmtTime = (sec) => { sec = Math.max(0, Math.ceil(sec)); const m = Math.floor(sec / 60), s = sec % 60; return m + ':' + String(s).padStart(2, '0'); };
  function compact(arr, keep) { let j = 0; for (let i = 0; i < arr.length; i++) if (keep(arr[i], i)) arr[j++] = arr[i]; arr.length = j; return arr; }

  /* =======================================================================
     EASING / TWEENS / SPRINGS (cosmetic, real-time)
     ======================================================================= */
  const Ease = {
    linear: t => t,
    inQuad: t => t * t,
    outQuad: t => 1 - (1 - t) * (1 - t),
    inOutQuad: t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2,
    inCubic: t => t * t * t,
    outCubic: t => 1 - Math.pow(1 - t, 3),
    inOutCubic: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
    outQuart: t => 1 - Math.pow(1 - t, 4),
    inBack: t => { const c1 = 1.70158; return (c1 + 1) * t * t * t - c1 * t * t; },
    outBack: t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
    outElastic: t => t === 0 ? 0 : t === 1 ? 1 : Math.pow(2, -10 * t) * Math.sin((t * 10 - .75) * (TAU / 3)) + 1,
    outBounce: t => {
      const n = 7.5625, d = 2.75;
      if (t < 1 / d) return n * t * t;
      if (t < 2 / d) return n * (t -= 1.5 / d) * t + .75;
      if (t < 2.5 / d) return n * (t -= 2.25 / d) * t + .9375;
      return n * (t -= 2.625 / d) * t + .984375;
    },
    pingPong: t => t < 0.5 ? t * 2 : 2 - t * 2,
  };
  const tweens = [];
  function tween(obj, to, dur = 0.3, ease = Ease.outQuad, delay = 0) {
    const tw = { obj, to, from: {}, dur: Math.max(dur, 1e-4), ease, t: -delay, started: false, done: false, _then: null,
      then(fn) { this._then = fn; return this; }, kill() { this.done = true; } };
    tweens.push(tw);
    return tw;
  }
  tween.killOf = obj => { for (const t of tweens) if (t.obj === obj) t.done = true; };
  function wait(sec) { return new Promise(res => tween({}, {}, sec).then(res)); }
  function updateTweens(dt) {
    for (let i = tweens.length - 1; i >= 0; i--) {
      const tw = tweens[i];
      if (tw.done) { tweens.splice(i, 1); continue; }
      tw.t += dt;
      if (tw.t < 0) continue;
      if (!tw.started) { tw.started = true; for (const k in tw.to) tw.from[k] = tw.obj[k]; }
      const p = Math.min(1, tw.t / tw.dur), e = tw.ease(p);
      for (const k in tw.to) tw.obj[k] = tw.from[k] + (tw.to[k] - tw.from[k]) * e;
      if (p >= 1) { tw.done = true; tweens.splice(i, 1); if (tw._then) tw._then(); }
    }
  }
  // Critically-damped-ish spring: call every frame. s = {v, vel}; returns new value.
  function spring(s, target, dt, stiffness = 220, damping = 18) {
    const a = (target - s.v) * stiffness - s.vel * damping;
    s.vel += a * dt; s.v += s.vel * dt;
    return s.v;
  }

  /* =======================================================================
     VIEW / RESIZE / ADAPTIVE QUALITY
     ======================================================================= */
  const view = { w: MF.design.w, h: MF.design.h, fullW: MF.design.w, fullH: MF.design.h, ox: 0, oy: 0,
    scale: 1, dpr: 1, dprCap: 2.5, safe: { top: 0, right: 0, bottom: 0, left: 0 },
    get portrait() { return this.fullH >= this.fullW; } };
  const probe = document.createElement('div');
  probe.style.cssText = 'position:fixed;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)';
  document.body.appendChild(probe);
  function resize() {
    const D = MF.design;
    const cw = Math.max(1, window.innerWidth), ch = Math.max(1, window.innerHeight);
    const dpr = Math.min(window.devicePixelRatio || 1, view.dprCap);
    const scale = Math.min(cw / D.w, ch / D.h);
    view.scale = scale; view.dpr = dpr;
    view.fullW = cw / scale; view.fullH = ch / scale;
    view.w = Math.min(view.fullW, D.maxW || Infinity);
    view.h = Math.min(view.fullH, D.maxH || Infinity);
    view.ox = (view.fullW - view.w) / 2; view.oy = (view.fullH - view.h) / 2;
    canvas.width = Math.round(cw * dpr); canvas.height = Math.round(ch * dpr);
    const cs = getComputedStyle(probe);
    view.safe.top = Math.max(0, (parseFloat(cs.paddingTop) || 0) / scale - view.oy);
    view.safe.right = Math.max(0, (parseFloat(cs.paddingRight) || 0) / scale - view.ox);
    view.safe.bottom = Math.max(0, (parseFloat(cs.paddingBottom) || 0) / scale - view.oy);
    view.safe.left = Math.max(0, (parseFloat(cs.paddingLeft) || 0) / scale - view.ox);
    spriteCache.checkRes();
    input.layoutTouch();
    if (camera.auto) camera.center();
    scenes.layout();
  }

  /* =======================================================================
     THEMES — art-direction presets; every preset has the same color keys
     ======================================================================= */
  const ROUNDED = '"Arial Rounded MT Bold","Nunito","Baloo 2",ui-rounded,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';
  const THEMES = {
    candy: { ink: '#1b1b3a', paper: '#fff7e8', paperText: '#1b1b3a', bg: '#1b1b3a', sky: ['#4fc3ff', '#8a6cff'], font: ROUNDED,
      colors: { green: ['#8af59a', '#2fbf4a', '#1d8a33'], blue: ['#86d0ff', '#2b8cff', '#1a5fc0'], yellow: ['#fff08a', '#ffc21a', '#d48a00'],
        red: ['#ff9a9a', '#ff4b5c', '#c0283a'], purple: ['#d2b0ff', '#8f5bff', '#5f33c4'], orange: ['#ffc48a', '#ff8a1f', '#c45c00'],
        pink: ['#ffb0dc', '#ff5cb4', '#c42d84'], gray: ['#eef0f6', '#aab2c8', '#6f7891'] } },
    neon: { ink: '#07041a', paper: '#1a1440', paperText: '#ffffff', bg: '#07041a', sky: ['#1a0f3d', '#05030f'], font: ROUNDED, glow: true,
      colors: { green: ['#b0ffd0', '#22ff88', '#00a352'], blue: ['#b0f0ff', '#22d3ff', '#0078b8'], yellow: ['#fffbb0', '#ffe600', '#b89f00'],
        red: ['#ffb0c4', '#ff2e63', '#a8002f'], purple: ['#ebc4ff', '#b44cff', '#6d17b0'], orange: ['#ffd8b0', '#ff8c1a', '#b35400'],
        pink: ['#ffc8f2', '#ff3cc7', '#a3007a'], gray: ['#e0e3ff', '#8088c0', '#3a4070'] } },
    pastel: { ink: '#4a3f5c', paper: '#fffaf3', paperText: '#4a3f5c', bg: '#efe4ff', sky: ['#ffe1ec', '#d9e8ff'], font: ROUNDED,
      colors: { green: ['#d4f7dc', '#9be3ad', '#5fb377'], blue: ['#d6ecff', '#9ccbff', '#5f95cf'], yellow: ['#fff6cc', '#ffe08a', '#d1aa45'],
        red: ['#ffd6dc', '#ff9eac', '#cf6575'], purple: ['#ebdcff', '#c3a3ff', '#8b6bc9'], orange: ['#ffe4cc', '#ffbf8a', '#cf8c52'],
        pink: ['#ffdcef', '#ffa8d4', '#cf6fa0'], gray: ['#f4f2f7', '#cfc9d9', '#968ea6'] } },
    jungle: { ink: '#1f2a12', paper: '#fff6dc', paperText: '#1f2a12', bg: '#1f2a12', sky: ['#9be58e', '#2e8b57'], font: ROUNDED,
      colors: { green: ['#c4f28a', '#6cc23a', '#3d7a1c'], blue: ['#9fe3e0', '#2fa8a0', '#1d6b66'], yellow: ['#fff0a0', '#f2c230', '#a8800f'],
        red: ['#ffb09a', '#e8573a', '#a3321c'], purple: ['#d8b8ff', '#9b6ad6', '#63408f'], orange: ['#ffcf8f', '#f08c24', '#a85a0c'],
        pink: ['#ffc0d2', '#e86a94', '#a33a5e'], gray: ['#efe9d8', '#b5ab8f', '#7a7058'] } },
    ocean: { ink: '#0b2545', paper: '#f0fbff', paperText: '#0b2545', bg: '#0b2545', sky: ['#5ee7ff', '#1b6ca8'], font: ROUNDED,
      colors: { green: ['#a8ffe0', '#2ee6a6', '#16a374'], blue: ['#a8e4ff', '#2ab0ff', '#1572b3'], yellow: ['#fff3b0', '#ffd23f', '#b8901a'],
        red: ['#ffb3b3', '#ff5a5f', '#b8323a'], purple: ['#c9c4ff', '#7a6cff', '#4a3fb3'], orange: ['#ffd1a8', '#ff9a3c', '#b8621a'],
        pink: ['#ffc4e1', '#ff70b0', '#b83d78'], gray: ['#e8f4f8', '#9fbccb', '#5e7f8f'] } },
    retro: { ink: '#000000', paper: '#1d1d1d', paperText: '#ffffff', bg: '#000000', sky: ['#1a0033', '#000000'], font: '"Courier New",ui-monospace,Menlo,monospace',
      colors: { green: ['#80ff80', '#00d800', '#008800'], blue: ['#80c0ff', '#3878f8', '#0030b0'], yellow: ['#ffff80', '#f8d800', '#a88800'],
        red: ['#ff8080', '#f83800', '#a80000'], purple: ['#e080ff', '#a000f8', '#6000a8'], orange: ['#ffc080', '#f87800', '#a84800'],
        pink: ['#ffa0e0', '#f878f8', '#a838a8'], gray: ['#ffffff', '#bcbcbc', '#7c7c7c'] } },
    ink: { ink: '#141414', paper: '#ffffff', paperText: '#141414', bg: '#f5f1e8', sky: ['#faf7f0', '#e6dfcf'], font: ROUNDED,
      colors: { green: ['#e6e6e6', '#bdbdbd', '#7a7a7a'], blue: ['#e6e6e6', '#9e9e9e', '#5c5c5c'], yellow: ['#fff3c4', '#ffd84d', '#b89400'],
        red: ['#ffc9c4', '#e8402e', '#9e2216'], purple: ['#e0e0e0', '#8a8a8a', '#4d4d4d'], orange: ['#f0f0f0', '#b0b0b0', '#6e6e6e'],
        pink: ['#ffd6d1', '#f07a6e', '#a83f34'], gray: ['#ffffff', '#d6d6d6', '#8f8f8f'] } },
  };
  const THEME = {};
  function setTheme(name) {
    const t = THEMES[name] || THEMES.candy;
    for (const k in THEME) delete THEME[k];
    Object.assign(THEME, JSON.parse(JSON.stringify(t)), { name: THEMES[name] ? name : 'candy' });
    if (MF.bg) THEME.bg = MF.bg;
    document.body.style.background = THEME.bg;
    spriteCache.clear();
  }

  /* =======================================================================
     STORAGE / SAVE / META-PROGRESSION
     ======================================================================= */
  const store = (() => {
    const ns = 'k:' + MF.id + ':';
    const mem = {};
    return {
      get(k, def) {
        if (k in mem) return mem[k];
        try { const v = localStorage.getItem(ns + k); if (v != null) return (mem[k] = JSON.parse(v)); } catch (e) {}
        return def;
      },
      set(k, v) {
        mem[k] = v;
        try { localStorage.setItem(ns + k, JSON.stringify(v)); } catch (e) {}
        sdk.send('save', { key: k, value: v });
      },
      remove(k) { delete mem[k]; try { localStorage.removeItem(ns + k); } catch (e) {} sdk.send('save', { key: k, value: null }); },
      import(obj) { if (obj && typeof obj === 'object') for (const k in obj) if (obj[k] != null) mem[k] = obj[k]; },
    };
  })();

  const clone = o => JSON.parse(JSON.stringify(o));
  function fillDefaults(target, defs) {
    for (const k in defs) {
      if (!(k in target)) target[k] = clone(defs[k]);
      else if (defs[k] && typeof defs[k] === 'object' && !Array.isArray(defs[k]) && target[k] && typeof target[k] === 'object') fillDefaults(target[k], defs[k]);
    }
    return target;
  }
  const save = (() => {
    let def = null;
    const data = {};
    let commitT = null;
    function load(raw) {
      let d = raw && typeof raw === 'object' ? clone(raw) : null;
      if (!d) d = Object.assign(clone(def.defaults), { _v: def.version });
      let v = d._v || 1;
      while (v < def.version) { const fn = def.migrate[v + 1]; if (fn) d = fn(d) || d; v++; d._v = v; }
      fillDefaults(d, def.defaults);
      for (const k in data) delete data[k];
      Object.assign(data, d);
    }
    return {
      // K.save.define({version, defaults, migrate:{2: d => {...}}}) → returns the live data object
      define(o) { def = { version: o.version || 1, defaults: o.defaults || {}, migrate: o.migrate || {} }; load(store.get('save', null)); return data; },
      get data() { return data; },
      commit() { if (def) { clearTimeout(commitT); commitT = null; store.set('save', data); } },
      later() { if (def && !commitT) commitT = setTimeout(() => save.commit(), 800); },
      reset() { if (!def) return; for (const k in data) delete data[k]; Object.assign(data, clone(def.defaults), { _v: def.version }); save.commit(); },
      reload() { if (def) load(store.get('save', null)); },
      get defined() { return !!def; },
    };
  })();

  const meta = (() => {
    const m = () => {

  /* =======================================================================
     INPUT — keyboard, unified pointer, multitouch, gamepad, typed text, touch overlay
     ======================================================================= */
  const input = (() => {
    const keyMap = {};
    for (const a in MF.keys) for (const c of MF.keys[a]) (keyMap[c] || (keyMap[c] = [])).push(a);
    const held = new Set(), pr = new Set(), rl = new Set(), vHeld = new Set(), padHeld = new Set();
    const axis = { x: 0, y: 0 }, pad = { x: 0, y: 0, ax: 0, ay: 0, connected: false };
    const typed = [];
    const p = { x: 0, y: 0, down: false, pressed: false, released: false, tap: false, dragging: false,
      startX: 0, startY: 0, dx: 0, dy: 0, downAt: 0, holdTime: 0, id: null, vx: 0, vy: 0, _lx: 0, _ly: 0, _lt: 0,
      get wx() { return camera.toWorld(this.x, this.y).x; }, get wy() { return camera.toWorld(this.x, this.y).y; },
      get wStartX() { return camera.toWorld(this.startX, this.startY).x; }, get wStartY() { return camera.toWorld(this.startX, this.startY).y; } };
    const pointers = new Map();     // all non-UI pointers (multitouch)
    let touchMode = window.matchMedia && matchMedia('(pointer: coarse)').matches;
    const stick = { id: null, ox: 0, oy: 0, kx: 0, ky: 0, r: 90 };
    // Touch overlay config: scene.touch overrides MANIFEST.touch (set scene.touch = null to hide).
    const tc = () => { const sc = scenes.current; return sc && sc.touch !== undefined ? (sc.touch || NO_TOUCH) : MF.touch; };
    const NO_TOUCH = { stick: false, buttons: [] };
    let tbtn = [], tbtnFor = null;
    function syncButtons() {
      const c = tc();
      if (c !== tbtnFor) { tbtnFor = c; tbtn = (c.buttons || []).map(b => ({ action: b.action, label: b.label || '', icon: b.icon || null, color: b.color || 'purple', x: 0, y: 0, r: b.r || 72, id: null })); api.layoutTouch(); }
      return tbtn;
    }
    const toL = e => ({ x: e.clientX / view.scale - view.ox, y: e.clientY / view.scale - view.oy });
    const overlayOn = () => { if (!touchMode || !scenes.current || !scenes.current.gameplay || sys.paused || sys.modal) return false; const c = tc(); syncButtons(); return !!(c.stick || tbtn.length); };
    const press = a => { if (a === 'pause') { if (!sys.modal) sys.paused ? resumeGame() : pauseGame(); return; } held.add(a); pr.add(a); };

    window.addEventListener('keydown', e => {
      audio.unlock();
      if (e.code === 'Backquote') { debug.on = !debug.on; return; }
      if (!sys.ad && !e.ctrlKey && !e.metaKey) { if (e.key.length === 1) typed.push(e.key); else if (e.key === 'Backspace') typed.push('\b'); else if (e.key === 'Enter') typed.push('\n'); }

    });

      e.preventDefault(); audio.unlock(); try { canvas.focus({ preventScroll: true }); } catch (_) {}

      }
    });
    const up = (e, cancel) => {
      const q = toL(e);
      if (ui.up(q.x, q.y, e.pointerId)) return;
      for (const b of tbtn) if (b.id === e.pointerId) { b.id = null; if (!tbtn.some(o => o.id != null && o.action === b.action)) { vHeld.delete(b.action); rl.add(b.action); } return; }

      pointers.delete(e.pointerId);

    canvas.addEventListener('pointercancel', e => up(e, true));
    canvas.addEventListener('contextmenu', e => e.preventDefault());

    const PAD_NAMES = ['PadA', 'PadB', 'PadX', 'PadY', 'PadLB', 'PadRB', 'PadLT', 'PadRT', 'PadBack', 'PadStart', 'PadL3', 'PadR3', 'PadUp', 'PadDown', 'PadLeft', 'PadRight'];

  /* =======================================================================
     SCENES
     ======================================================================= */
  const scenes = (() => {
    const reg = {};
    let cur = null, name = null, busy = false;
    const fade = { a: 0 };
    function swap(n, params) {
      if (!reg[n]) { reportError(new Error('Unknown scene: ' + n), 'scenes.go'); return; }
      if (cur) { if (cur.gameplay) sdk.send('gameplayStop'); safeCall(cur, 'exit'); }
      ui.clearScene(); ui.clearModals(); fx.clear(); input.reset(); camera.reset(); sys.paused = false; hitstopT = 0; acc = 0;
      name = n; cur = reg[n];

      get name() { return name; },

  /* =======================================================================
     ADS
     ======================================================================= */
  const devAd = { on: false, t: 0, kind: '', res: null };
  async function adBreak(kind = 'midgame') {
    if (sys.ad) return { shown: false, granted: false };
    sys.ad = true; input.reset(); updateDuck(); sdk.send('gameplayStop');
    let r = null;
    if (sdk.connected) r = await sdk.request('adBreak', { kind }, 90000);
    else if (!sdk.inFrame) r = await new Promise(res => { Object.assign(devAd, { on: true, t: kind === 'rewarded' ? 2 : 1, kind, res }); });
    sys.ad = false; updateDuck(); last = performance.now();
    if (scenes.current && scenes.current.gameplay && !sys.paused) sdk.send('gameplayStart');
    r = r || {};

  }

  /* =======================================================================
     DEBUG
     ======================================================================= */
  const debug = { on: /[?&]debug/.test(location.search), fps: 60, steps: 0, low: 0 };

  /* ---------- system pause overlay widgets ---------- */
  ui.button({ group: 'sys', label: 'RESUME', icon: 'play', color: 'green', w: 400, h: 120, key: 'action', pulse: true,
    place: v => ({ x: v.w / 2, y: v.h / 2 + 10 }), onTap: resumeGame });
  ui.soundButton({ group: 'sys', place: v => ({ x: v.w / 2 - 130, y: v.h / 2 + 165 }) });
  ui.musicButton({ group: 'sys', place: v => ({ x: v.w / 2, y: v.h / 2 + 165 }) });
  const sysHome = ui.button({ group: 'sys', icon: 'home', color: 'red', w: 110, h: 110,
    place: v => ({ x: v.w / 2 + 130, y: v.h / 2 + 165 }),
    onTap: () => { const sc = scenes.current; sys.paused = false; safeCall(sc, 'onQuit'); } });

  /* =======================================================================
     MAIN LOOP — fixed-step sim (60 Hz), per-frame presentation
     ======================================================================= */
  const STEP = 1 / 60, MAX_STEPS = 6;
  let last = 0, acc = 0, clock = 0, frameN = 0;
  function frame(now) {
    requestAnimationFrame(frame);

    if (!(dt > 0)) dt = 0; if (dt > 0.1) dt = 0.1;

    if (frameN > 120 && debug.fps < 42 && view.dprCap > 1) { if (++debug.low > 90) { view.dprCap = Math.max(1, view.dprCap - 0.5); debug.low = 0; resize(); } } else debug.low = 0;
    if (devAd.on) { devAd.t -= dt; if (devAd.t <= 0) { devAd.on = false; devAd.res({ shown: true, granted: true }); } }

      ui.keys();

        let steps = 0;
        if (hitstopT > 0) hitstopT -= dt;
        else {
          acc += dt;
          while (acc >= STEP && steps < MAX_STEPS) {
            safeCall(sc, 'update', STEP); input.endStep(); acc -= STEP; steps++;

          }
          if (steps === MAX_STEPS) acc = 0;

      camera.update(dt, M.clamp(acc / STEP, 0, 1));
    }

    render();
  }

  function render() {
    const s = view.dpr * view.scale, sc = scenes.current, alpha = M.clamp(acc / STEP, 0, 1);
    ctx = mainCtx;
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1;
    ctx.fillStyle = THEME.bg; ctx.fillRect(0, 0, canvas.width, canvas.height);
    const ox = view.ox, oy = view.oy;
    // world layer (shakes; camera)
    ctx.setTransform(s, 0, 0, s, (ox + fx.offset.x) * s, (oy + fx.offset.y) * s);
    if (sc) safeCall(sc, 'backdrop', ctx, alpha);
    ctx.save(); camera.apply(ctx);
    if (sc) safeCall(sc, 'render', ctx, alpha);
    fx.draw(false);
    ctx.restore();
    // screen layer (stable)

    ui.draw('scene');

    ui.drawModals();

      text(`${devAd.kind} · dev stub · ${Math.ceil(devAd.t)}`, view.w / 2, view.h / 2 + 40, { size: 32, color: '#aab2c8' });
    }
    if (sys.crashed) {
      ctx.fillStyle = 'rgba(16,10,30,0.88)'; ctx.fillRect(-ox, -oy, view.fullW, view.fullH);
      icon('skull', view.w / 2, view.h / 2 - 170, 140, '#ff9a9a');
      text('Oops! The game crashed.', view.w / 2, view.h / 2 - 40, { size: 50, maxW: view.w - 60 });
      label(sys.crashed.where + ': ' + sys.crashed.message, view.w / 2, view.h / 2 + 40, { size: 26, color: '#ffb0b0', maxW: view.w - 60 });
      block(view.w / 2 - 190, view.h - 220, 380, 110, 'green', { r: 36 }); text('RESTART', view.w / 2, view.h - 170, { size: 48 });
    }
    if (scenes.fade.a > 0) { ctx.globalAlpha = scenes.fade.a; ctx.fillStyle = THEME.bg; ctx.fillRect(-ox, -oy, view.fullW, view.fullH); ctx.globalAlpha = 1; }
    if (debug.on) {
      const lines = [`${debug.fps | 0} fps · ${debug.steps} steps · ${fx.count} fx · ${spriteCache.size} spr`, `${view.w | 0}×${view.h | 0} @${(view.dpr * view.scale).toFixed(2)} · scene ${scenes.name} · k${KERNEL_VERSION}`];
      lines.forEach((l, i) => text(l, 12 - 0, 22 + i * 26 + view.safe.top, { size: 20, align: 'left', shadow: false, sw: 4 }));
    }
  }

  /* =======================================================================
     BOOT
     ======================================================================= */
  let booted = false;
  function boot(startScene, params) {
    if (booted) return; booted = true;
    resize();
    window.addEventListener('resize', resize);
    if (window.visualViewport) visualViewport.addEventListener('resize', resize);
    document.addEventListener('visibilitychange', () => {
      sys.hidden = document.hidden;
      if (document.hidden) { pauseGame(); input.reset(); save.commit(); }
      updateDuck(); last = performance.now();
    });
    window.addEventListener('pagehide', () => save.commit());
    sdk.on('hello', d => {
      sdk.connected = true;
      if (d && d.save) { store.import(d.save); save.reload(); }
      if (d && typeof d.muted === 'boolean') { sys.platformMute = d.muted; updateDuck(); }
      if (d && d.debug) debug.on = true;
    });
    sdk.on('pause', () => { sys.platformPause = true; pauseGame(); updateDuck(); });
    sdk.on('resume', () => { sys.platformPause = false; updateDuck(); last = performance.now(); });
    sdk.on('mute', d => { sys.platformMute = !!(d && d.muted); updateDuck(); });
    sdk.on('debug', d => { debug.on = !!(d && d.on); });
    sdk.on('snapshot', d => {
      try {
        const w = (d && d.width) || 480, c = document.createElement('canvas'); c.width = w; c.height = Math.round(w * canvas.height / canvas.width);
        c.getContext('2d').drawImage(canvas, 0, 0, c.width, c.height);
        sdk.send('snapshot', { id: d && d.id, data: c.toDataURL('image/jpeg', 0.85) });
      } catch (err) { sdk.send('snapshot', { id: d && d.id, error: String(err) }); }
    });
    sdk.send('loadProgress', { p: 1 });
    scenes.go(startScene, params);
    sdk.send('ready', { game: MF.id, title: MF.title, version: MF.version, kernel: KERNEL_VERSION, orientation: MF.orientation, design: MF.design });
    last = performance.now();
    requestAnimationFrame(frame);
  }

  setTheme(MF.theme);

  return {
    VERSION: KERNEL_VERSION, MANIFEST: MF,
    // core
    M, rng, hashSeed, dailySeed, noise, color, fmt, fmtTime, compact, clone, Ease, tween, wait, spring,
    view, THEME, THEMES, setTheme, store, save, meta, sdk, audio, music, haptic, input, camera, fx, ui, scenes, adBreak, boot, fsm,
    // systems
    col, SpatialHash, Physics, Tilemap, Grid, Heap, path,
    draw: { text, label, measure, wrap, paragraph, rr, rrp, starPath, blob, blobS, block, critter, star, poly, line, capsule, arrow, dots,
      panel, card, bar, pill, hearts, sky, vignette, glow, icon, sprite, drawSprite: (s, x, y, o) => spriteCache.draw(s, x, y, o) },
    pause: pauseGame, resume: resumeGame,
    setHaptics(v) { hapticsOn = !!v; store.set('haptics', hapticsOn); }, get haptics() { return hapticsOn; },
    get time() { return clock; },
    get paused() { return sys.paused; },
    get debug() { return debug; },
    get errors() { return errors; },
  };
})();
//#KERNEL-END
</script>
<script>
"use strict";
/* §3 GAME — PiratePinball
   Table space is a fixed 720×1280 box (identical physics on every device); the play scene
   offsets it inside K.view. Flippers use custom moving-surface collision between K.Physics
   sub-steps; everything else (walls, slings, kegs, sensors, multiball) is K.Physics. */

/* ===================================================================
   3a. SIM — pure & deterministic (state.rng only), reports via events
   =================================================================== */
const TAU = Math.PI * 2;
const FL = { len: 116, r0: 15, r1: 8, rest: 0.5, up: -0.45, upSpd: 20, downSpd: 12, e: 0.3 };
const BALL_R = 15, VMAX = 3200, SUBSTEPS = 4;
const PLUNGE = { x: 669, y: 1237 };
const SCOOP = { x: 515, y: 500 };
const BUMPERS = [[262, 372], [432, 372], [347, 470]], BUMP_R = 34;
const LANE_X = [276, 356, 436], LANE_Y = 238, LANE_POSTS = [236, 316, 396, 476];
const LOOT_X = 124, LOOT_Y = [536, 580, 624, 668], LOOT_LEN = 36;
const TENT = [[205, 790], [292, 852], [378, 852], [462, 790]];
const SHIP_ROWS = [610, 690], SHIP_X0 = 182, SHIP_X1 = 478;
const REPLAYS = [500000, 1500000, 4000000];
const ARCH = (() => {
  const p = [], cx = 359, cy = 455, rx = 339, ry = 335, n = 36;
  for (let i = 0; i <= n; i++) { const a = Math.PI + Math.PI * i / n; p.push(+(cx + Math.cos(a) * rx).toFixed(1), +(cy + Math.sin(a) * ry).toFixed(1)); }
  return p;
})();
const GEO = {
  outer: [20, 1300, ...ARCH, 698, 1262],
  field: [20, 1280, ...ARCH, 698, 1280],
  laneWall: [640, 1300, 640, 430],
  laneFloor: [640, 1252, 698, 1252],
  gate: [693, 400, 640, 430],
  orbitL: [82, 722, 82, 470],
  orbitR: [580, 690, 580, 470],
  gateL: [82, 772, 20, 735],
  gateR: [640, 702, 580, 735],
  lootBlock: [82, 512, 112, 522, 112, 712, 82, 722],
  inL: [60, 950, 60, 1045, 191, 1090],
  inR: [600, 950, 600, 1045, 469, 1090],
  slingL: [110, 905, 110, 1012, 172, 1050],
  slingR: [550, 905, 550, 1012, 488, 1050],
};
const SHIPS = {
  sloop:   { r: 26, hp: 1, speed: 140, pts: 10000, life: 22, name: 'SLOOP' },
  galleon: { r: 36, hp: 3, speed: 70, pts: 30000, life: 30, name: 'GALLEON', fires: true },
  ghost:   { r: 30, hp: 2, speed: 105, pts: 50000, life: 26, name: 'GHOST SHIP', ghost: true },
};
const MISSIONS = {
  broadside: { name: 'BROADSIDE!', goal: 'Sink 3 ships', need: 3, dur: 45, short: 'SHIPS' },
  kegs: { name: 'POWDER KEGS!', goal: 'Blast 20 kegs', need: 20, dur: 30, short: 'KEGS' },
  kraken: { name: 'KRAKEN RISING!', goal: 'Smash 4 tentacles', need: 4, dur: 45, short: 'KRAKEN' },
  plunder: { name: 'PLUNDER!', goal: 'Shoot 3 orbits', need: 3, dur: 40, short: 'ORBITS' },
  treasure: { name: 'TREASURE HUNT!', goal: 'Roll over 3 X marks', need: 3, dur: 45, short: 'X MARKS' },
};
const ITEM_DEF = {
  coin: { r: 16, life: 11 }, gem: { r: 17, life: 9 }, rum: { r: 18, life: 10 }, bottle: { r: 18, life: 10 },
  mine: { r: 17, life: 12 }, bomb: { r: 15, life: 14 },
};
const ZONES = [{ x: 150, y: 282, w: 90, h: 40, w8: 1 }, { x: 175, y: 760, w: 310, h: 115, w8: 4 },
  { x: 165, y: 520, w: 130, h: 30, w8: 1.2 }, { x: 468, y: 404, w: 70, h: 34, w8: 0.8 }];

const DIFF = {
  gravity: t => 1500 + K.M.clamp((t - 60) * 1.8, 0, 650),
  save: t => t < 60 ? 15 : Math.max(4, 12 - (t - 60) / 30),
  shipEvery: t => Math.max(6, 16 - Math.max(0, t - 30) / 22),
  maxShips: t => t < 90 ? 1 : t < 200 ? 2 : 3,
  level: t => Math.min(9, 1 + Math.floor(t / 60)),
};

const ev = (s, type, o) => { o = o || {}; o.type = type; s.events.push(o); return o; };
const newTally = () => ({ lanes: 0, targets: 0, ships: 0, orbits: 0, coins: 0, bumpers: 0 });

const Sim = {
  create(seed) {
    const r = K.rng(seed);
    const s = {
      rng: r, seed, t: 0, clock: 0, score: 0, events: [], phase: 'plunge', phaseT: 0,
      ballsLeft: 2, ballNum: 1, continued: false, extraGiven: 0, replayIdx: 0,
      mult: 1, multT: 0, bonusX: 1, lanes: [false, false, false], skillLane: 0, skillT: 0, mysteryT: 0,
      loot: [false, false, false, false], lootDone: 0, lootResetT: 0,
      missionLit: true, missionRelightT: 0, mission: null, missionOrder: r.shuffle(Object.keys(MISSIONS)), missionIdx: 0, mapPieces: 0, cycle: 0,
      cannon: 0, mbLit: false, mb: false, mbSaveT: 0, jackpot: 75000, mbJ: 0, superLit: false, jpShot: 0,
      wizardLit: false, wizard: false,
      kickback: false, ballSaveT: 0, anchorT: 0, anchorRaised: false, rumT: 0, comboT: 0, combo: 0,
      ships: [], tentacles: [], tentLife: 0, items: [], xspot: null, nextId: 1,
      shipT: 14, itemT: 3, krakenT: 200, launchQueue: 0, launchT: 0,
      lastL: false, lastR: false, dangerLv: 1, ballTime: 0,
      tally: newTally(), bonus: null,
      stats: { bumpers: 0, coins: 0, ships: 0, ghosts: 0, jackpots: 0, skill: 0, krakens: 0, missions: 0, mbs: 0, wizards: 0, orbits: 0, bestBall: 0 },
      balls: [], plunger: { pull: 0, ppull: 0 },
      flippers: [
        { side: -1, x: 198, y: 1112, a: FL.rest, pa: FL.rest, w: 0, up: false },
        { side: 1, x: 462, y: 1112, a: FL.rest, pa: FL.rest, w: 0, up: false },
      ],
    };
    Sim.build(s);
    Sim.serve(s);
    return s;
  },

  build(s) {
    const P = s.P = new K.Physics({ gravity: [0, 1500], iterations: 4 });
    const W = { restitution: 0.35, friction: 0.004, data: { k: 'wall' } };
    P.addPolyline(GEO.outer, W);
    P.addPolyline(GEO.laneWall, W);
    P.addPolyline(GEO.laneFloor, { restitution: 0.1, friction: 0.05, data: { k: 'floor' } });
    for (const g of [GEO.gate, GEO.gateL, GEO.gateR]) P.addSegment(g[0], g[1], g[2], g[3], { oneWay: true, restitution: 0.3, friction: 0.004, data: { k: 'gate' } });
    P.addPolyline(GEO.orbitL, W); P.addPolyline(GEO.orbitR, W); P.addPolyline(GEO.lootBlock, W);
    P.addPolyline(GEO.inL, W); P.addPolyline(GEO.inR, W);
    for (const x of LANE_POSTS) P.addSegment(x, 205, x, 262, { restitution: 0.5, friction: 0.004, data: { k: 'post' } });
    [GEO.slingL, GEO.slingR].forEach((g, side) => {
      P.addSegment(g[0], g[1], g[2], g[3], W);
      P.addSegment(g[2], g[3], g[4], g[5], W);
      P.addSegment(g[4], g[5], g[0], g[1], { restitution: 0.75, friction: 0.004, data: { k: 'sling', side } });
    });
    s.bumpers = BUMPERS.map(([x, y], i) => P.addCircle({ x, y, r: BUMP_R, isStatic: true, restitution: 1.1, data: { k: 'bumper', i } }));
    s.targets = LOOT_Y.map((y, i) => P.addSegment(LOOT_X, y, LOOT_X, y + LOOT_LEN, { restitution: 0.4, friction: 0.004, data: { k: 'target', i } }));
    const sensor = (x, y, r, data) => P.addCircle({ x, y, r, isStatic: true, sensor: true, data });
    LANE_X.forEach((x, i) => sensor(x, LANE_Y, 12, { k: 'lane', i }));
    sensor(85, 985, 8, { k: 'inlane', side: 0 }); sensor(575, 985, 8, { k: 'inlane', side: 1 });
    sensor(40, 1080, 8, { k: 'outlane', side: 0 }); sensor(620, 1080, 8, { k: 'outlane', side: 1 });
    sensor(51, 712, 8, { k: 'orbit', lane: 0, pos: 'bot' }); sensor(51, 520, 8, { k: 'orbit', lane: 0, pos: 'top' });
    sensor(610, 676, 8, { k: 'orbit', lane: 1, pos: 'bot' }); sensor(610, 515, 8, { k: 'orbit', lane: 1, pos: 'top' });
    sensor(SCOOP.x, SCOOP.y, 6, { k: 'scoop' });
    s.anchor = P.addCircle({ x: 330, y: 1176, r: 9, isStatic: true, restitution: 0.5, data: { k: 'anchor' } });
  },

  /* ---------- balls ---------- */
  addBall(s, x, y) {
    const body = s.P.addCircle({ x, y, r: BALL_R, mass: 1, restitution: 0.2, friction: 0, damping: 0.04, data: { k: 'ball' } });
    const b = { id: s.nextId++, body, held: null, heldT: 0, inside: new Set(), seen: new Set(), cd: {}, scoopCd: 0,
      flipT: 9, still: 0, laneRest: 0, orbit: null, skill: false };
    body.data.ball = b;
    s.balls.push(b);
    return b;
  },
  serve(s) {
    s.phase = 'plunge'; s.phaseT = 0; s.mult = 1; s.multT = 0; s.bonusX = 1; s.lanes = [false, false, false]; s.tally = newTally();
    s.ballTime = 0; s.combo = 0; s.comboT = 0; s.skillLane = s.rng.int(0, 2);
    const b = Sim.addBall(s, PLUNGE.x, PLUNGE.y);
    b.held = 'plunger'; b.body.gravityScale = 0;
  },
  launch(s, p) {
    const b = s.balls.find(o => o.held === 'plunger');
    if (!b) return;
    b.held = null; b.body.gravityScale = 1; b.body.vx = 0; b.body.vy = -Sim.launchSpeed(s, p);
    b.skill = true; s.skillT = 4.5;
    s.ballSaveT = Math.max(s.ballSaveT, DIFF.save(s.t));
    s.phase = 'play'; s.phaseT = 0;
    ev(s, 'launch', { p, x: PLUNGE.x, y: PLUNGE.y });
  },
  // plunger curve: soft pulls drop into the top-right, the middle band feeds the R-U-M lanes (skill shot),
  // a hard pull orbits the whole table. Scaled with gravity so the feel survives the difficulty ramp.
  launchSpeed(s, p) {
    const v = p < 0.3 ? 1700 + p / 0.3 * 170 : p < 0.7 ? 1870 + (p - 0.3) / 0.4 * 110 : 1980 + (p - 0.7) / 0.3 * 720;
    return v * Math.sqrt(s.P.gy / 1500);
  },
  removeBall(s, b) {
    s.P.remove(b.body);
    const i = s.balls.indexOf(b); if (i >= 0) s.balls.splice(i, 1);
  },
  loseBall(s, b) {
    const x = b.body.x;
    Sim.removeBall(s, b);
    s.stats.bestBall = Math.max(s.stats.bestBall, s.ballTime);
    if (s.ballSaveT > 0 || (s.mb && s.mbSaveT > 0)) { s.launchQueue++; s.launchT = Math.min(s.launchT, 0.5); ev(s, 'saved', { x, y: 1240 }); return; }
    const inPlay = s.balls.length + s.launchQueue;
    ev(s, 'drain', { x, y: 1250, last: inPlay === 0 });
    if (inPlay === 0) Sim.endBall(s);
    else if (inPlay === 1 && s.mb) Sim.endMultiball(s);
  },
  inPlay(s) { return s.balls.length + s.launchQueue; },

  /* ---------- step ---------- */
  step(s, dt, cmd) {
    if (s.phase === 'over') return;
    cmd = cmd || {};
    s.phaseT += dt; s.clock += dt;
    for (const f of s.flippers) f.pa = f.a;
    s.plunger.ppull = s.plunger.pull;
    const live = s.phase === 'play' || s.phase === 'plunge';
    const L = live && !!cmd.L, R = live && !!cmd.R;
    if (L && !s.lastL) Sim.flipPress(s, 0);
    if (R && !s.lastR) Sim.flipPress(s, 1);
    s.lastL = L; s.lastR = R;
    s.flippers[0].up = L; s.flippers[1].up = R;

    if (s.phase === 'plunge') {
      s.plunger.pull = K.M.clamp(cmd.pull || 0, 0, 1);
      if (cmd.launch != null) Sim.launch(s, K.M.clamp(cmd.launch, 0, 1));
    } else s.plunger.pull = Math.max(0, s.plunger.pull - dt * 8);

    if (s.phase === 'play') Sim.tick(s, dt);
    Sim.entities(s, dt);
    Sim.physics(s, dt);
    if (live) Sim.checkBalls(s, dt);

    if (s.phase === 'drain' && s.phaseT > 1.1) Sim.startBonus(s);
    else if (s.phase === 'bonus' && (s.phaseT > s.bonus.dur || (cmd.skip && s.phaseT > 0.5))) Sim.nextBall(s);
  },

  flipPress(s, side) {
    ev(s, 'flip', { side });
    if (s.phase === 'plunge') { s.skillLane = (s.skillLane + (side ? 1 : 2)) % 3; return; }
    const l = s.lanes;
    s.lanes = side ? [l[2], l[0], l[1]] : [l[1], l[2], l[0]];
  },

  tick(s, dt) {
    s.t += dt; s.ballTime += dt;
    s.P.gy = DIFF.gravity(s.t);
    const lv = DIFF.level(s.t);
    if (lv !== s.dangerLv) { s.dangerLv = lv; ev(s, 'danger', { lv }); }
    if (!s.anchorRaised && s.t >= 60) { s.anchorRaised = true; ev(s, 'anchorUp', { x: 330, y: 1176 }); }
    const anchorOn = s.t < 60 || s.anchorT > 0;
    s.anchor.sensor = !anchorOn;
    if (s.anchorT > 0) { s.anchorT -= dt; if (s.anchorT <= 0) ev(s, 'anchorUp', { x: 330, y: 1176 }); }
    if (s.ballSaveT > 0) s.ballSaveT -= dt;
    if (s.mbSaveT > 0) s.mbSaveT -= dt;
    if (s.rumT > 0) { s.rumT -= dt; if (s.rumT <= 0) ev(s, 'rumEnd'); }
    if (s.comboT > 0) { s.comboT -= dt; if (s.comboT <= 0) s.combo = 0; }
    if (s.mysteryT > 0) s.mysteryT -= dt;
    if (s.mult > 1) { s.multT -= dt; if (s.multT <= 0) { s.mult--; s.multT = s.mult > 1 ? 20 : 0; ev(s, 'multDown', { mult: s.mult }); } }
    if (s.skillT > 0) { s.skillT -= dt; if (s.skillT <= 0) for (const b of s.balls) b.skill = false; }
    if (s.lootResetT > 0) { s.lootResetT -= dt; if (s.lootResetT <= 0) Sim.lootReset(s); }
    if (s.mission) { s.mission.t -= dt; if (s.mission.t <= 0) Sim.missionFail(s); }
    else if (!s.missionLit && s.missionRelightT > 0) { s.missionRelightT -= dt; if (s.missionRelightT <= 0) { s.missionLit = true; ev(s, 'missionLit', { x: SCOOP.x, y: SCOOP.y }); } }

    // spawns (difficulty ramps with run time)
    const broadside = s.mission && s.mission.kind === 'broadside', krakenM = s.mission && s.mission.kind === 'kraken';
    if (!krakenM) {
      s.shipT -= dt;
      if (s.shipT <= 0) {
        s.shipT = broadside ? 2.5 : DIFF.shipEvery(s.t);
        if (s.ships.length < (broadside ? 3 : DIFF.maxShips(s.t))) Sim.spawnShip(s, Sim.pickShip(s));
      }
    }
    s.itemT -= dt;
    if (s.itemT <= 0) {
      s.itemT = s.rng.range(2.5, 5.2) * (s.t < 60 ? 1 : 0.85);
      if (s.items.filter(i => i.kind !== 'bomb').length < 4) Sim.spawnItem(s, Sim.pickItem(s));
    }
    if (s.t > 180 && !s.mission && !s.tentacles.length && !s.mb) {
      s.krakenT -= dt;
      if (s.krakenT <= 0) { s.krakenT = 100; Sim.spawnKraken(s, 25); }
    }
    if (s.launchQueue > 0) {
      s.launchT -= dt;
      if (s.launchT <= 0) {
        const busy = s.balls.some(b => !b.held && b.body.x > 642 && b.body.y > 1080);
        if (!busy) {
          s.launchQueue--; s.launchT = 0.9;
          const b = Sim.addBall(s, PLUNGE.x, PLUNGE.y);
          b.body.vy = -s.rng.range(2350, 2700);
          ev(s, 'autoLaunch', { x: PLUNGE.x, y: PLUNGE.y });
        }
      }
    }
  },

  pickShip(s) {
    const t = s.t, o = [{ k: 'sloop', w: 6 }];
    if (t > 90) o.push({ k: 'galleon', w: 3 + t / 120 });
    if (t > 210) o.push({ k: 'ghost', w: 2 + t / 150 });
    return s.rng.weighted(o).k;
  },
  pickItem(s) {
    const t = s.t, o = [{ k: 'coin', w: 10 }, { k: 'gem', w: t > 45 ? 2 : 0.6 }, { k: 'rum', w: 1.1 }, { k: 'bottle', w: 1.4 }];
    if (t > 120) o.push({ k: 'mine', w: Math.min(4, 1 + (t - 120) / 60) });
    return s.rng.weighted(o).k;
  },

  /* ---------- physics: sub-stepped so flippers can't tunnel ---------- */
  physics(s, dt) {
    const P = s.P, h = dt / SUBSTEPS;
    for (const b of s.balls) { b.sx = b.body.x; b.sy = b.body.y; }
    for (let k = 0; k < SUBSTEPS; k++) {
      for (const f of s.flippers) {
        const prev = f.a;
        f.a = K.M.approach(f.a, f.up ? FL.up : FL.rest, (f.up ? FL.upSpd : FL.downSpd) * h);
        f.w = (f.a - prev) / h;
      }
      Sim.holdBalls(s);
      for (const b of s.balls) if (!b.held) for (const f of s.flippers) Sim.flipperCollide(s, f, b);
      P.step(h);
      Sim.holdBalls(s);
      for (const c of P.contacts) Sim.contact(s, c);
      for (const b of s.balls) {
        if (b.held) continue;
        for (const f of s.flippers) Sim.flipperCollide(s, f, b);
        const B = b.body, sp = Math.hypot(B.vx, B.vy);
        if (sp > VMAX) { B.vx *= VMAX / sp; B.vy *= VMAX / sp; }
      }
    }
    for (const b of s.balls) { b.body.px = b.sx; b.body.py = b.sy; }
  },
  holdBalls(s) {
    for (const b of s.balls) {
      if (!b.held) continue;
      const B = b.body, p = b.held === 'scoop' ? SCOOP : PLUNGE;
      B.x = p.x; B.y = p.y; B.vx = 0; B.vy = 0;
    }
  },
  tip(f, a) { const c = Math.cos(a) * FL.len; return { x: f.x + (f.side < 0 ? c : -c), y: f.y + Math.sin(a) * FL.len }; },
  flipperCollide(s, f, b) {
    const B = b.body, t = Sim.tip(f, f.a);
    const q = K.col.closestOnSeg(B.x, B.y, f.x, f.y, t.x, t.y);
    const rf = FL.r0 + (FL.r1 - FL.r0) * q.t;
    const dx = B.x - q.x, dy = B.y - q.y, d = Math.hypot(dx, dy), min = B.r + rf;
    if (d >= min || d < 1e-6) return;
    const nx = dx / d, ny = dy / d;
    B.x += nx * (min - d); B.y += ny * (min - d);
    const om = f.side < 0 ? f.w : -f.w;                  // world angular velocity
    const cx = q.x + nx * rf - f.x, cy = q.y + ny * rf - f.y;
    const svx = -om * cy, svy = om * cx;                  // surface velocity at the contact
    const rvx = B.vx - svx, rvy = B.vy - svy, vn = rvx * nx + rvy * ny;
    if (vn < 0) {
      B.vx = rvx - (1 + FL.e) * vn * nx + svx;
      B.vy = rvy - (1 + FL.e) * vn * ny + svy;
      if (-vn > 700 && Math.abs(om) > 1 && !b.cd.flip) { b.cd.flip = 0.12; ev(s, 'flipHit', { x: q.x + nx * rf, y: q.y + ny * rf, power: -vn }); }
    }
    b.flipT = 0;
  },

  /* ---------- contacts ---------- */
  contact(s, c) {
    const ball = c.a.data && c.a.data.ball;
    if (!ball) return;
    const O = c.b, d = O.data || {};
    if (d.ball) {
      if (!c.sensor && c.impulse > 350 && !ball.cd.clack) { ball.cd.clack = 0.1; ev(s, 'clack', { x: c.a.x, y: c.a.y }); }
      return;
    }
    if (ball.held) return;
    if (c.sensor) {
      ball.seen.add(O.id);
      if (ball.inside.has(O.id)) return;
      ball.inside.add(O.id);
      Sim.enter(s, ball, O, d);
      return;
    }
    Sim.hit(s, ball, O, d, c);
  },
  kick(B, nx, ny, speed) {
    const vn = B.vx * nx + B.vy * ny;
    if (vn < speed) { B.vx += nx * (speed - vn); B.vy += ny * (speed - vn); }
  },
  hit(s, b, O, d, c) {
    const B = b.body;
    switch (d.k) {
      case 'bumper':
        if (b.cd[O.id]) return;
        b.cd[O.id] = 0.06;
        Sim.kick(B, c.nx, c.ny, 1050 + s.dangerLv * 25);
        Sim.bumper(s, d.i);
        break;
      case 'sling':
        if (b.cd[O.id] || c.impulse < 120) return;
        b.cd[O.id] = 0.15;
        Sim.kick(B, c.nx, c.ny, 980);
        ev(s, 'sling', { side: d.side, x: B.x - c.nx * BALL_R, y: B.y - c.ny * BALL_R, pts: Sim.award(s, 50) });
        break;
      case 'target': Sim.target(s, d.i, O); break;
      case 'ship': Sim.hitShip(s, b, d.ship, c); break;
      case 'tentacle': Sim.hitTentacle(s, b, d.tent, c); break;
      default:
        if (c.impulse > 900 && !b.cd.thud) { b.cd.thud = 0.1; ev(s, 'thud', { x: B.x - c.nx * BALL_R, y: B.y - c.ny * BALL_R }); }
    }
  },
  enter(s, b, O, d) {
    const B = b.body;
    switch (d.k) {
      case 'lane': Sim.lane(s, b, d.i); break;
      case 'inlane': ev(s, 'inlane', { side: d.side, x: B.x, y: B.y, pts: Sim.award(s, 500) }); break;
      case 'outlane':
        if (d.side === 0 && s.kickback) {
          s.kickback = false; B.vx = 0; B.vy = -2300;
          ev(s, 'kickback', { x: B.x, y: B.y, pts: Sim.award(s, 2500) });
        } else ev(s, 'outlane', { side: d.side, x: B.x, y: B.y, pts: Sim.award(s, 2500, true) });
        break;
      case 'orbit':
        if (d.pos === 'bot') { if (B.vy < 0) b.orbit = { lane: d.lane, t: 1.6 }; }
        else if (b.orbit && b.orbit.lane === d.lane && B.vy < 0) { b.orbit = null; Sim.orbit(s, d.lane, B.x, B.y); }
        break;
      case 'scoop': if (b.scoopCd <= 0) Sim.scoopIn(s, b); break;
      case 'item': Sim.collect(s, b, d.item); break;
      case 'xspot': Sim.xFound(s); break;
    }
  },

  /* ---------- scoring ---------- */
  award(s, base, flat) {
    const pts = Math.round(base * (flat ? 1 : s.mult) * (s.rumT > 0 ? 2 : 1) * (s.wizard ? 3 : 1));
    s.score += pts;
    Sim.checkReplay(s);
    return pts;
  },
  multUp(s) {
    if (s.mult < 6) s.mult++;
    s.multT = 30; s.bonusX = Math.max(s.bonusX, s.mult);
  },
  checkReplay(s) {
    while (s.replayIdx < REPLAYS.length && s.score >= REPLAYS[s.replayIdx]) { s.replayIdx++; s.ballsLeft++; ev(s, 'replay'); }
  },
  comboShot(s, x, y) {
    if (s.comboT > 0) { s.combo++; ev(s, 'combo', { n: s.combo + 1, x, y, pts: Sim.award(s, 10000 * Math.min(s.combo, 5), true) }); }
    else s.combo = 0;
    s.comboT = 4;
  },
  bumper(s, i) {
    s.stats.bumpers++; s.tally.bumpers++;
    const kegs = !!(s.mission && s.mission.kind === 'kegs');
    if (s.mb) s.jackpot += 1000;
    ev(s, 'bumper', { i, x: BUMPERS[i][0], y: BUMPERS[i][1], pts: Sim.award(s, kegs ? 1500 : 250), kegs });
    if (kegs) Sim.missionProgress(s, 'kegs');
  },
  lane(s, b, i) {
    const x = LANE_X[i], y = LANE_Y;
    if (b.skill && s.skillT > 0) {
      b.skill = false; s.skillT = 0;
      if (i === s.skillLane) { s.stats.skill++; ev(s, 'skill', { x, y, pts: Sim.award(s, 50000) }); }
      else ev(s, 'skillMiss', { x, y });
    }
    if (s.lanes[i]) { ev(s, 'laneAgain', { i, x, y, pts: Sim.award(s, 250) }); return; }
    s.lanes[i] = true;
    ev(s, 'lane', { i, x, y, pts: Sim.award(s, 1000) });
    if (s.lanes.every(Boolean)) {
      s.lanes = [false, false, false]; s.tally.lanes++;
      Sim.multUp(s);
      ev(s, 'lanesDone', { mult: s.mult, x: 356, y: 290, pts: Sim.award(s, 10000) });
    }
  },
  target(s, i, O) {
    if (s.loot[i]) return;
    s.loot[i] = true; O.sensor = true; s.tally.targets++;
    ev(s, 'target', { i, x: LOOT_X, y: LOOT_Y[i] + LOOT_LEN / 2, pts: Sim.award(s, 1500) });
    if (s.mb) s.jackpot += 5000;
    if (s.loot.every(Boolean)) Sim.lootComplete(s);
  },
  lootComplete(s) {
    s.lootDone++; s.lootResetT = 1.2;
    let label;
    if (!s.missionLit) { s.missionLit = true; label = 'MISSION LIT'; }
    else if (!s.kickback) { s.kickback = true; label = 'KICKBACK LIT'; }
    else { Sim.multUp(s); label = 'MULTIPLIER ×' + s.mult; }
    if (s.mb) s.jackpot += 10000;
    ev(s, 'lootDone', { label, x: 150, y: 620, pts: Sim.award(s, 10000 + 2500 * Math.min(s.lootDone, 6)) });
  },
  lootReset(s) {
    s.loot = [false, false, false, false];
    for (const t of s.targets) t.sensor = false;
    ev(s, 'lootReset', { x: LOOT_X, y: 620 });
  },
  orbit(s, lane, x, y) {
    s.tally.orbits++; s.stats.orbits++;
    ev(s, 'orbit', { lane, x, y, pts: Sim.award(s, 5000) });
    Sim.comboShot(s, x, y);
    if (!Sim.jackpotShot(s, lane, x, y)) Sim.cannonAdd(s, 1);
    Sim.missionProgress(s, 'plunder');
  },
  cannonAdd(s, n) {
    if (s.mb || s.mbLit) return;
    s.cannon = Math.min(4, s.cannon + n);
    ev(s, 'cannon', { n: s.cannon });
    if (s.cannon >= 4) { s.mbLit = true; ev(s, 'mbLit'); }
  },

  /* ---------- scoop / modes ---------- */
  scoopIn(s, b) {
    const B = b.body;
    b.held = 'scoop'; b.heldT = 1.1; b.orbit = null; b.skill = false;
    B.sensor = true; B.gravityScale = 0; B.vx = B.vy = 0; B.x = SCOOP.x; B.y = SCOOP.y;
    ev(s, 'scoop', { x: SCOOP.x, y: SCOOP.y, pts: Sim.award(s, 2500) });
    Sim.comboShot(s, SCOOP.x, SCOOP.y);
    if (s.wizardLit && !s.mb) { b.heldT = 2.2; Sim.startWizard(s); }
    else if (s.mb) { if (!Sim.jackpotShot(s, 2, SCOOP.x, SCOOP.y)) ev(s, 'cabin', { x: SCOOP.x, y: SCOOP.y, pts: Sim.award(s, 5000) }); }
    else if (s.mbLit) { b.heldT = 1.8; Sim.startMultiball(s); }
    else if (s.missionLit && !s.mission) { b.heldT = 1.8; Sim.startMission(s); }
    else if (s.mysteryT <= 0) { s.mysteryT = 15; Sim.mystery(s, SCOOP.x, SCOOP.y, "CAPTAIN'S LOOT"); }
    else ev(s, 'cabin', { x: SCOOP.x, y: SCOOP.y, pts: Sim.award(s, 5000) });
  },
  eject(s, b) {
    const B = b.body;
    b.held = null; B.sensor = false; B.gravityScale = 1;
    B.vx = -560 + s.rng.range(-90, 90); B.vy = 430; b.scoopCd = 0.8;
    ev(s, 'eject', { x: SCOOP.x, y: SCOOP.y });
  },
  // During multiball one shot is lit for JACKPOT (0 left orbit, 1 right orbit, 2 cabin); every 3rd lights SUPER at the cabin.
  jackpotShot(s, shot, x, y) {
    if (!s.mb) return false;
    if (s.superLit) { if (shot !== 2) return false; Sim.jackpot(s, x, y, true); return true; }
    if (shot !== s.jpShot) return false;
    Sim.jackpot(s, x, y, false);
    return true;
  },
  jackpot(s, x, y, sup) {
    const pts = Sim.award(s, sup ? s.jackpot * 3 : s.jackpot, true);
    s.stats.jackpots++; s.mbJ++;
    if (sup) s.superLit = false;
    else { s.jackpot += 15000; if (s.mbJ % 3 === 0) s.superLit = true; }
    s.jpShot = (s.jpShot + 1 + s.rng.int(0, 1)) % 3;
    ev(s, 'jackpot', { x, y, pts, sup, superLit: s.superLit });
  },
  startMultiball(s) {
    s.mb = true; s.mbLit = false; s.cannon = 0; s.mbJ = 0; s.superLit = false;
    s.launchQueue += 2; s.launchT = 1.0; s.mbSaveT = 14; s.stats.mbs++; s.jpShot = s.rng.int(0, 1);
    ev(s, 'mbStart', { x: SCOOP.x, y: SCOOP.y });
  },
  startWizard(s) {
    if (s.mission) Sim.missionEnd(s, false, true);
    s.wizard = true; s.wizardLit = false; s.mb = true; s.mbLit = false; s.mbJ = 0; s.superLit = false;
    s.launchQueue += 3; s.launchT = 1.2; s.mbSaveT = 20; s.stats.wizards++; s.jpShot = s.rng.int(0, 2);
    ev(s, 'wizardStart', { x: SCOOP.x, y: SCOOP.y });
  },
  endMultiball(s) {
    if (s.wizard) {
      s.wizard = false; s.mapPieces = 0; s.cycle++;
      ev(s, 'wizardEnd', { x: 330, y: 600, pts: Sim.award(s, 500000, true) });
    }
    s.mb = false; s.superLit = false; s.mbSaveT = 0;
    ev(s, 'mbEnd');
  },
  startMission(s) {
    const kind = s.missionOrder[s.missionIdx % s.missionOrder.length];
    s.missionIdx++;
    const def = MISSIONS[kind];
    const need = def.need + (kind === 'kegs' ? s.cycle * 8 : s.cycle);
    s.mission = { kind, t: def.dur, dur: def.dur, need, got: 0 };
    s.missionLit = false;
    if (kind === 'kraken') Sim.spawnKraken(s, 0);
    if (kind === 'treasure') Sim.placeX(s);
    if (kind === 'broadside') s.shipT = 0.6;
    ev(s, 'missionStart', { kind, need, x: SCOOP.x, y: SCOOP.y });
  },
  missionProgress(s, kind) {
    const m = s.mission;
    if (!m || m.kind !== kind) return;
    m.got++;
    if (m.got >= m.need) Sim.missionEnd(s, true);
    else ev(s, 'missionProg', { kind, got: m.got, need: m.need });
  },
  missionFail(s) { Sim.missionEnd(s, false); },
  missionEnd(s, ok, silent) {
    const m = s.mission;
    if (!m) return;
    s.mission = null; s.missionRelightT = 20;
    if (s.xspot) { s.P.remove(s.xspot.body); s.xspot = null; }
    if (m.kind === 'kraken' && s.tentacles.length) Sim.clearTentacles(s);
    if (ok) {
      s.mapPieces = Math.min(5, s.mapPieces + 1); s.stats.missions++;
      if (m.kind === 'kraken') s.stats.krakens++;
      ev(s, 'missionDone', { kind: m.kind, pieces: s.mapPieces, x: 330, y: 600, pts: Sim.award(s, 100000 + 50000 * s.cycle, true) });
      if (s.mapPieces >= 5 && !s.wizardLit && !s.wizard) { s.wizardLit = true; ev(s, 'wizardLit'); }
    } else if (!silent) ev(s, 'missionFail', { kind: m.kind });
  },
  mystery(s, x, y, title) {
    const o = [{ id: 'pts', w: 26 }, { id: 'save', w: 14 }, { id: 'storm', w: 12 }, { id: 'rum', w: 10 }, { id: 'cannon', w: 10 }, { id: 'anchor', w: 6 }];
    if (!s.kickback) o.push({ id: 'kick', w: 14 });
    if (s.mult < 6) o.push({ id: 'mult', w: 12 });
    if (s.t > 120 && s.extraGiven < 2) o.push({ id: 'extra', w: 3 });
    const id = s.rng.weighted(o).id;
    let label = '', pts = 0;
    switch (id) {
      case 'pts': pts = Sim.award(s, s.rng.pick([15000, 25000, 40000]), true); label = 'BURIED TREASURE'; break;
      case 'save': s.ballSaveT = Math.max(s.ballSaveT, 12); label = 'BALL SAVE'; break;
      case 'storm': for (let i = 0; i < 5; i++) Sim.spawnItem(s, 'coin'); label = 'DOUBLOON STORM'; break;
      case 'rum': s.rumT = 15; label = 'RUM RUSH 2×'; break;
      case 'cannon': Sim.cannonAdd(s, 2); label = 'CANNON POWDER'; if (s.mb || s.mbLit) pts = Sim.award(s, 20000); break;
      case 'anchor': s.anchorT = 25; label = 'ANCHOR DROPPED'; break;
      case 'kick': s.kickback = true; label = 'KICKBACK LIT'; break;
      case 'mult': Sim.multUp(s); label = 'MULTIPLIER ×' + s.mult; break;
      case 'extra': s.extraGiven++; s.ballsLeft++; label = 'EXTRA BALL!'; break;
    }
    ev(s, 'mystery', { title, label, id, x, y, pts });
  },

  /* ---------- ships ---------- */
  spawnShip(s, kind) {
    const def = SHIPS[kind];
    const counts = SHIP_ROWS.map(y => s.ships.filter(sh => sh.y === y).length);
    const min = Math.min(...counts);
    const rows = SHIP_ROWS.filter((y, i) => counts[i] === min);
    const y = s.rng.pick(rows), dir = s.rng.sign(), x = dir > 0 ? SHIP_X0 : SHIP_X1;
    if (s.ships.some(sh => sh.y === y && Math.abs(sh.x - x) < sh.r + def.r + 30)) return;
    const body = s.P.addCircle({ x, y, r: def.r, isStatic: true, sensor: true, restitution: 0.6, data: { k: 'ship' } });
    const sh = { id: s.nextId++, kind, x, y, px: x, py: y, vx: dir * def.speed * (1 + s.t / 600), hp: def.hp, maxHp: def.hp, r: def.r,
      body, t: 0, rise: 0.8, life: def.life, fireT: 2.5, hitT: 0, solid: false, dead: false };
    body.data.ship = sh;
    s.ships.push(sh);
    ev(s, 'shipSpawn', { kind, x, y });
  },
  updateShips(s, dt) {
    for (const sh of s.ships) {
      const def = SHIPS[sh.kind];
      sh.px = sh.x; sh.py = sh.y; sh.t += dt; sh.hitT = Math.max(0, sh.hitT - dt);
      if (sh.rise > 0) sh.rise -= dt;
      sh.x += sh.vx * dt;
      if (sh.x < SHIP_X0) { sh.x = SHIP_X0; sh.vx = Math.abs(sh.vx); }
      else if (sh.x > SHIP_X1) { sh.x = SHIP_X1; sh.vx = -Math.abs(sh.vx); }
      const ethereal = def.ghost && (sh.t % 4) > 2.6;
      sh.solid = sh.rise <= 0 && !ethereal;
      sh.body.sensor = !sh.solid; sh.body.x = sh.x; sh.body.y = sh.y;
      if (def.fires && sh.solid) {
        sh.fireT -= dt;
        if (sh.fireT <= 0) { sh.fireT = s.rng.range(4, 6.5); Sim.spawnItem(s, 'bomb', sh.x, sh.y + sh.r + 12); ev(s, 'shipFire', { x: sh.x, y: sh.y + sh.r }); }
      }
      sh.life -= dt;
      if (sh.life <= 0 && sh.hitT <= 0) { sh.dead = true; s.P.remove(sh.body); ev(s, 'shipEscape', { kind: sh.kind, x: sh.x, y: sh.y }); }
    }
    for (let i = 0; i < s.ships.length; i++) for (let j = i + 1; j < s.ships.length; j++) {
      const a = s.ships[i], b = s.ships[j];
      if (a.y !== b.y || Math.abs(a.x - b.x) > a.r + b.r + 8) continue;
      const left = a.x < b.x ? a : b, right = left === a ? b : a;
      left.vx = -Math.abs(left.vx); right.vx = Math.abs(right.vx);
    }
    K.compact(s.ships, sh => !sh.dead);
  },
  hitShip(s, b, sh, c) {
    if (!sh || sh.dead || sh.hitT > 0) return;
    sh.hitT = 0.25;
    Sim.kick(b.body, c.nx, c.ny, 650);
    sh.hp--;
    if (sh.hp > 0) { ev(s, 'shipHit', { kind: sh.kind, x: sh.x, y: sh.y, hp: sh.hp, pts: Sim.award(s, 1000) }); return; }
    sh.dead = true; s.P.remove(sh.body);
    s.stats.ships++; s.tally.ships++;
    if (sh.kind === 'ghost') s.stats.ghosts++;
    ev(s, 'shipSink', { kind: sh.kind, x: sh.x, y: sh.y, dir: Math.sign(sh.vx), pts: Sim.award(s, SHIPS[sh.kind].pts) });
    Sim.cannonAdd(s, 1);
    Sim.missionProgress(s, 'broadside');
  },

  /* ---------- kraken ---------- */
  spawnKraken(s, life) {
    Sim.clearTentacles(s, true);
    s.tentLife = life;
    TENT.forEach(([x, y], i) => {
      const body = s.P.addCircle({ x, y, r: 24, isStatic: true, sensor: true, restitution: 0.7, data: { k: 'tentacle' } });
      const tn = { id: s.nextId++, i, x0: x, y0: y, x, y, px: x, py: y, hp: 2, body, rise: 0.9 + i * 0.12, ph: i * 1.7, hitT: 0, dead: false };
      body.data.tent = tn;
      s.tentacles.push(tn);
    });
    ev(s, 'krakenRise', { mission: !life, x: 330, y: 820 });
  },
  clearTentacles(s, silent) {
    for (const tn of s.tentacles) { s.P.remove(tn.body); if (!silent) ev(s, 'tentRetreat', { x: tn.x, y: tn.y }); }
    s.tentacles.length = 0; s.tentLife = 0;
  },
  updateTentacles(s, dt) {
    for (const tn of s.tentacles) {
      tn.px = tn.x; tn.py = tn.y;
      if (tn.rise > 0) tn.rise -= dt;
      tn.hitT = Math.max(0, tn.hitT - dt);
      tn.x = tn.x0 + Math.sin(s.clock * 2 + tn.ph) * 10;
      tn.body.x = tn.x; tn.body.sensor = tn.rise > 0;
    }
    if (s.tentLife > 0) { s.tentLife -= dt; if (s.tentLife <= 0 && s.tentacles.length) { Sim.clearTentacles(s); ev(s, 'krakenGone'); } }
  },
  hitTentacle(s, b, tn, c) {
    if (!tn || tn.dead || tn.hitT > 0) return;
    tn.hitT = 0.3;
    Sim.kick(b.body, c.nx, c.ny, 750);
    tn.hp--;
    if (tn.hp > 0) { ev(s, 'tentHit', { x: tn.x, y: tn.y, pts: Sim.award(s, 2500) }); return; }
    tn.dead = true; s.P.remove(tn.body);
    K.compact(s.tentacles, t => !t.dead);
    ev(s, 'tentSmash', { x: tn.x, y: tn.y, pts: Sim.award(s, 10000) });
    if (s.mission && s.mission.kind === 'kraken') Sim.missionProgress(s, 'kraken');
    else if (!s.tentacles.length) { s.tentLife = 0; s.stats.krakens++; ev(s, 'krakenFlee', { x: 330, y: 800, pts: Sim.award(s, 50000) }); }
  },

  /* ---------- items ---------- */
  freeSpot(s, minD) {
    for (let tries = 0; tries < 14; tries++) {
      const z = s.rng.weighted(ZONES, o => o.w8);
      const x = z.x + s.rng() * z.w, y = z.y + s.rng() * z.h;
      const far = (ox, oy, d) => (x - ox) * (x - ox) + (y - oy) * (y - oy) > d * d;
      if (!s.items.every(i => far(i.x, i.y, minD))) continue;
      if (!s.tentacles.every(t => far(t.x0, t.y0, 64))) continue;
      if (!s.ships.every(sh => far(sh.x, sh.y, sh.r + 40))) continue;
      if (s.xspot && !far(s.xspot.x, s.xspot.y, 70)) continue;
      if (!BUMPERS.every(([bx, by]) => far(bx, by, BUMP_R + 30))) continue;
      if (!far(SCOOP.x, SCOOP.y, 55)) continue;
      return { x, y };
    }
    return null;
  },
  spawnItem(s, kind, x, y) {
    if (x == null) { const p = Sim.freeSpot(s, 56); if (!p) return; x = p.x; y = p.y; }
    const def = ITEM_DEF[kind];
    const body = s.P.addCircle({ x, y, r: def.r, isStatic: true, sensor: true, data: { k: 'item' } });
    const it = { id: s.nextId++, kind, x, y, px: x, py: y, r: def.r, life: def.life, max: def.life, body,
      vy: kind === 'bomb' ? 55 : 0, arm: kind === 'bomb' ? 0.4 : 0, dead: false };
    body.data.item = it;
    s.items.push(it);
    ev(s, 'itemSpawn', { kind, x, y });
  },
  updateItems(s, dt) {
    for (const it of s.items) {
      it.px = it.x; it.py = it.y; it.life -= dt;
      if (it.arm > 0) it.arm -= dt;
      if (it.vy) { it.y += it.vy * dt; it.body.y = it.y; if (it.y > 930) { it.dead = true; ev(s, 'fizzle', { x: it.x, y: it.y }); } }
      if (!it.dead && it.life <= 0) { it.dead = true; ev(s, 'itemGone', { kind: it.kind, x: it.x, y: it.y }); }
      if (it.dead) s.P.remove(it.body);
    }
    K.compact(s.items, i => !i.dead);
  },
  collect(s, b, it) {
    if (!it || it.dead || it.arm > 0) return;
    it.dead = true; s.P.remove(it.body);
    const B = b.body, x = it.x, y = it.y;
    switch (it.kind) {
      case 'coin': {
        s.stats.coins++; s.tally.coins++;
        ev(s, 'coin', { x, y, pts: Sim.award(s, 500), n: s.stats.coins });
        if (s.stats.coins % 10 === 0) ev(s, 'hoard', { x, y: y - 40, n: s.stats.coins, pts: Sim.award(s, 10000) });
        break;
      }
      case 'gem': ev(s, 'gem', { x, y, pts: Sim.award(s, 7500) }); break;
      case 'rum': s.rumT = 15; ev(s, 'rum', { x, y }); break;
      case 'bottle': Sim.mystery(s, x, y, 'MESSAGE IN A BOTTLE'); break;
      case 'mine': case 'bomb': {
        const dx = B.x - x, dy = B.y - y, d = Math.hypot(dx, dy) || 1;
        B.vx = dx / d * 1300; B.vy = dy / d * 1300 - 350;
        ev(s, 'boom', { x, y, pts: Sim.award(s, 1000) });
        break;
      }
    }
  },
  placeX(s) {
    if (s.xspot) s.P.remove(s.xspot.body);
    const p = Sim.freeSpot(s, 40) || { x: 330, y: 820 };
    s.xspot = { x: p.x, y: p.y, t: 0, body: s.P.addCircle({ x: p.x, y: p.y, r: 14, isStatic: true, sensor: true, data: { k: 'xspot' } }) };
  },
  xFound(s) {
    if (!s.xspot) return;
    const { x, y } = s.xspot;
    ev(s, 'xFound', { x, y, pts: Sim.award(s, 15000) });
    s.P.remove(s.xspot.body); s.xspot = null;
    Sim.missionProgress(s, 'treasure');
    if (s.mission && s.mission.kind === 'treasure') Sim.placeX(s);
  },

  entities(s, dt) {
    Sim.updateShips(s, dt);
    Sim.updateTentacles(s, dt);
    Sim.updateItems(s, dt);
    if (s.xspot) s.xspot.t += dt;
  },

  /* ---------- per-ball bookkeeping ---------- */
  checkBalls(s, dt) {
    for (const b of s.balls.slice()) {
      const B = b.body;
      for (const k in b.cd) if ((b.cd[k] -= dt) <= 0) delete b.cd[k];
      if (b.scoopCd > 0) b.scoopCd -= dt;
      if (b.orbit && (b.orbit.t -= dt) <= 0) b.orbit = null;
      b.flipT += dt;
      for (const id of b.inside) if (!b.seen.has(id)) b.inside.delete(id);
      b.seen.clear();
      if (b.held === 'scoop') { b.heldT -= dt; if (b.heldT <= 0) Sim.eject(s, b); continue; }
      if (b.held) continue;
      if (B.y > 1310) { Sim.loseBall(s, b); continue; }
      if (!(B.x > -20 && B.x < 740 && B.y > 60) || !isFinite(B.vx + B.vy)) {   // escaped the table: re-serve, no penalty
        Sim.removeBall(s, b); s.launchQueue++; s.launchT = 0.3; continue;
      }
      const sp = Math.hypot(B.vx, B.vy);
      // ball rolled back onto the plunger
      if (B.x > 645 && B.y > 1180 && sp < 90) {
        b.laneRest += dt;
        if (b.laneRest > 0.3) {
          b.laneRest = 0;
          if (s.balls.length === 1 && s.launchQueue === 0 && !s.mb) { b.held = 'plunger'; B.gravityScale = 0; s.phase = 'plunge'; s.phaseT = 0; ev(s, 'rollback'); }
          else { B.vy = -2450; ev(s, 'autoLaunch', { x: PLUNGE.x, y: PLUNGE.y }); }
        }
      } else b.laneRest = 0;
      // stuck somewhere (not cradled on a flipper): nudge it free
      if (sp < 25 && b.flipT > 0.4) {
        b.still += dt;
        if (b.still > 2.5) { b.still = 0; B.vy = -900; B.vx = s.rng.range(-320, 320); ev(s, 'nudge', { x: B.x, y: B.y }); }
      } else b.still = 0;
    }
  },

  /* ---------- end of ball ---------- */
  endBall(s) {
    s.phase = 'drain'; s.phaseT = 0;
    if (s.mission) Sim.missionFail(s);
    if (s.tentacles.length) Sim.clearTentacles(s);
    s.rumT = 0; s.ballSaveT = 0; s.mbSaveT = 0; s.skillT = 0;
    if (s.mb) Sim.endMultiball(s);
    for (const f of s.flippers) f.up = false;
  },
  startBonus(s) {
    const T = s.tally;
    const lines = [['RUM LANES', T.lanes, 5000], ['LOOT TARGETS', T.targets, 1000], ['SHIPS SUNK', T.ships, 7500],
      ['ORBITS', T.orbits, 2500], ['DOUBLOONS', T.coins, 300], ['POWDER KEGS', T.bumpers, 75]]
      .filter(l => l[1] > 0).map(l => ({ label: l[0], n: l[1], each: l[2], v: l[1] * l[2] }));
    const sub = lines.reduce((a, l) => a + l.v, 0), total = sub * s.bonusX;
    s.score += total; Sim.checkReplay(s);
    s.bonus = { lines, sub, mult: s.bonusX, total, dur: 1.6 + lines.length * 0.35 + 1.3 };
    s.phase = 'bonus'; s.phaseT = 0;
    ev(s, 'bonus', { total, last: s.ballsLeft === 0 });
  },
  nextBall(s) {
    if (s.ballsLeft > 0) { s.ballsLeft--; s.ballNum++; Sim.serve(s); ev(s, 'newBall', { n: s.ballNum }); }
    else { s.phase = 'over'; s.stats.bestBall = Math.max(s.stats.bestBall, s.ballTime); ev(s, 'gameover', { score: s.score }); }
  },
  continueRun(s) {
    s.continued = true; s.ballsLeft = 0; s.ballNum++; s.events.length = 0;
    Sim.serve(s);
    ev(s, 'continue');
  },
};

/* ------------------------------------------------------------------- (end of pure sim) */

/* ---------- drawing helpers ---------- */
function pathPts(c, p, close) { c.beginPath(); c.moveTo(p[0], p[1]); for (let i = 2; i < p.length; i += 2) c.lineTo(p[i], p[i + 1]); if (close) c.closePath(); }
function tableRes() { const v = K.view; return Math.min(1, 2.2 / Math.max(1, v.dpr * v.scale)); }

function drawCompass(c, x, y, r) {
  c.save(); c.translate(x, y);
  c.globalAlpha = 0.2; c.strokeStyle = '#f3e3b8'; c.lineWidth = 3;
  c.beginPath(); c.arc(0, 0, r, 0, TAU); c.stroke();
  c.beginPath(); c.arc(0, 0, r * 0.78, 0, TAU); c.stroke();
  for (let i = 0; i < 16; i++) { const a = i * TAU / 16, l = i % 4 === 0 ? r * 1.15 : i % 2 ? r * 0.82 : r * 0.95; c.beginPath(); c.moveTo(0, 0); c.lineTo(Math.cos(a) * l, Math.sin(a) * l); c.stroke(); }
  c.globalAlpha = 0.28; c.fillStyle = '#f3e3b8';
  for (let i = 0; i < 4; i++) { const a = i * TAU / 4 - Math.PI / 2; c.beginPath(); c.moveTo(Math.cos(a) * r * 1.1, Math.sin(a) * r * 1.1); c.lineTo(Math.cos(a + 0.35) * r * 0.25, Math.sin(a + 0.35) * r * 0.25); c.lineTo(Math.cos(a - 0.35) * r * 0.25, Math.sin(a - 0.35) * r * 0.25); c.closePath(); c.fill(); }
  c.globalAlpha = 0.35;
  K.draw.text('N', 0, -r * 1.32, { size: 30, color: '#f3e3b8', sw: 0, stroke: false });
  c.restore(); c.globalAlpha = 1;
}

    const sail = kind === 'ghost' ? '#c9fff0' : kind === 'galleon' ? '#f4f7ff' : C.red[1];
    const hullPath = k => {
      c.beginPath();
      c.moveTo(cx - w * 0.46 * k, cy - h * 0.3 * k);
      c.quadraticCurveTo(cx + w * 0.12 * k, cy - h * 0.5 * k, cx + w * 0.48 * k, cy);
      c.quadraticCurveTo(cx + w * 0.12 * k, cy + h * 0.5 * k, cx - w * 0.46 * k, cy + h * 0.3 * k);
      c.closePath();
    };
    c.globalAlpha = kind === 'ghost' ? 0.85 : 1;
    hullPath(1);
    const hg = c.createLinearGradient(0, 0, 0, h); hg.addColorStop(0, hull[0]); hg.addColorStop(1, hull[1]);
    c.fillStyle = hg; c.fill(); c.lineWidth = 4; c.strokeStyle = INK; c.stroke();
