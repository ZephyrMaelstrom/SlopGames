    }
    if (kind === 'galleon') { c.strokeStyle = C.blue[1]; c.lineWidth = 3; c.beginPath(); c.moveTo(cx + 0.02 * w, cy - h * 0.38); c.lineTo(cx + 0.02 * w, cy + h * 0.38); c.stroke(); }
    if (kind !== 'galleon') K.draw.icon('skull', cx + masts[0] * w, cy, Math.min(20, h * 0.36), kind === 'ghost' ? '#2f8f78' : '#ffffff');
    const fx = cx - w * 0.44;
    c.beginPath(); c.moveTo(fx, cy - 3); c.lineTo(fx - 16, cy - 10); c.lineTo(fx - 12, cy); c.lineTo(fx - 16, cy + 6); c.closePath();
    c.fillStyle = kind === 'galleon' ? C.blue[1] : '#1b1b1b'; c.fill(); c.lineWidth = 2; c.strokeStyle = INK; c.stroke();
    c.globalAlpha = 1;
  }, { pad: 22 });
}

const PAL_FLIP = [GOLD[0], GOLD[1], GOLD[2]];
function flipperPath(c) {
  c.beginPath(); c.arc(0, 0, FL.r0, Math.PI / 2, Math.PI * 1.5);
  c.lineTo(FL.len, -FL.r1); c.arc(FL.len, 0, FL.r1, -Math.PI / 2, Math.PI / 2); c.closePath();
}
function renderFlipper(c, f, a, lit) {
  const ang = f.side < 0 ? a : Math.PI - a;
  c.save(); c.translate(f.x, f.y); c.rotate(ang);
  c.save(); c.translate(4, 7); flipperPath(c); c.fillStyle = 'rgba(0,0,0,0.35)'; c.fill(); c.restore();
  flipperPath(c);
  const g = c.createLinearGradient(0, -FL.r0, 0, FL.r0); g.addColorStop(0, PAL_FLIP[0]); g.addColorStop(1, PAL_FLIP[1]);
  c.fillStyle = g;
  if (lit > 0) { c.shadowColor = '#fff3b0'; c.shadowBlur = 24 * lit; }
  c.fill(); c.shadowBlur = 0;
  c.lineWidth = 5; c.strokeStyle = C.red[2]; c.stroke();
  c.lineWidth = 2.5; c.strokeStyle = INK; c.stroke();
  c.beginPath(); c.moveTo(6, -5); c.lineTo(FL.len - 6, -3); c.lineWidth = 4; c.lineCap = 'round'; c.strokeStyle = 'rgba(255,255,255,0.6)'; c.stroke();
  c.beginPath(); c.arc(0, 0, 6, 0, TAU); c.fillStyle = '#5e7f8f'; c.fill(); c.lineWidth = 2; c.strokeStyle = INK; c.stroke();
  c.restore();
}

function lamp(c, x, y, r, pal, on, label, size) {
  const P = C[pal] || pal;
  if (on) K.draw.glow(x, y, r * 2.6, P[0], 0.5);
  c.beginPath(); c.arc(x, y, r, 0, TAU);
  c.fillStyle = on ? P[1] : 'rgba(6,22,44,0.82)'; c.fill();
  c.lineWidth = 3; c.strokeStyle = on ? P[0] : P[2]; c.stroke();
  if (on) { c.beginPath(); c.arc(x - r * 0.3, y - r * 0.35, r * 0.28, 0, TAU); c.fillStyle = 'rgba(255,255,255,0.7)'; c.fill(); }
  if (label) K.draw.text(label, x, y + 1, { size: size || r * 1.15, color: on ? '#ffffff' : P[2], sw: on ? 4 : 0, stroke: on ? undefined : false, shadow: false });
}
function arrowLamp(c, x, y, ang, sz, pal, on) {
  const P = C[pal] || pal;
  c.save(); c.translate(x, y); c.rotate(ang);
  if (on) { c.shadowColor = P[0]; c.shadowBlur = 22; }
  c.beginPath(); c.moveTo(sz, 0); c.lineTo(-sz * 0.6, -sz * 0.75); c.lineTo(-sz * 0.25, 0); c.lineTo(-sz * 0.6, sz * 0.75); c.closePath();
  c.fillStyle = on ? P[1] : 'rgba(6,22,44,0.8)'; c.fill(); c.shadowBlur = 0;
  c.lineWidth = 3; c.strokeStyle = on ? P[0] : P[2]; c.stroke();
  c.restore();
}
const blink = (hz = 3, off = 0) => ((K.time + off) * hz) % 1 < 0.55;

function drawItem(c, it, x, y) {
  const fade = it.life < 2.5 && it.kind !== 'bomb' ? (Math.sin(K.time * 22) > 0 ? 1 : 0.35) : 1;
  c.save(); c.globalAlpha = fade; c.translate(x, y);
  const bob = Math.sin(K.time * 4 + it.id) * 3;
  switch (it.kind) {
    case 'coin': {
      K.draw.glow(0, 0, 40, GOLD[0], 0.35);
      c.save(); c.translate(0, bob); c.scale(Math.max(0.15, Math.abs(Math.cos(K.time * 3 + it.id))), 1);
      K.draw.icon('coin', 0, 0, 36); c.restore(); break;
    }
    case 'gem': K.draw.glow(0, 0, 44, '#a8e4ff', 0.5); K.draw.icon('gem', 0, bob, 38, '#5ee7ff');
      if (blink(2, it.id)) K.draw.star(10, bob - 12, 7, '#ffffff', { outline: 0 }); break;
    case 'rum': case 'bottle': {
      const rum = it.kind === 'rum';
      c.rotate(Math.sin(K.time * 3 + it.id) * 0.3);
      K.draw.glow(0, 0, 42, rum ? '#ffd1a8' : '#a8ffe0', 0.4);
      K.draw.block(-11, -10 + bob, 22, 30, rum ? ['#c98a52', '#8a4e1c', '#4e2a10'] : ['#bff5da', '#3fbf8a', '#1c7a55'], { r: 8, depth: 3, outline: 3 });
      K.draw.block(-5, -22 + bob, 10, 14, rum ? ['#c98a52', '#8a4e1c', '#4e2a10'] : ['#bff5da', '#3fbf8a', '#1c7a55'], { r: 3, depth: 2, outline: 3 });
      c.fillStyle = rum ? '#fff3e0' : '#f3e3b8'; c.fillRect(-8, -2 + bob, 16, 11);
      K.draw.text(rum ? 'XXX' : '?', 0, 4 + bob, { size: rum ? 9 : 14, color: rum ? C.red[2] : INK, stroke: false });
      break;
    }
    case 'mine': case 'bomb': {
      const r = it.r, armed = it.arm <= 0;
      if (it.kind === 'mine') for (let i = 0; i < 8; i++) { const a = i * TAU / 8 + K.time; c.beginPath(); c.moveTo(Math.cos(a) * r * 0.8, Math.sin(a) * r * 0.8); c.lineTo(Math.cos(a) * (r + 7), Math.sin(a) * (r + 7)); c.lineWidth = 5; c.strokeStyle = INK; c.stroke(); }
      K.draw.blobS(0, 0, r, ['#6a7a86', '#2a3440', '#0b1018']);
      if (it.kind === 'bomb') { c.beginPath(); c.moveTo(r * 0.4, -r * 0.8); c.quadraticCurveTo(r * 0.9, -r * 1.3, r * 0.5, -r * 1.6); c.lineWidth = 4; c.strokeStyle = '#d9b27a'; c.stroke();
        K.draw.star(r * 0.5, -r * 1.6, 7 + Math.sin(K.time * 40) * 3, '#ffe680', { outline: 2, points: 6 }); }
      if (armed && blink(4, it.id)) { c.beginPath(); c.arc(0, 0, 5, 0, TAU); c.fillStyle = '#ff5a5f'; c.fill(); K.draw.glow(0, 0, 22, '#ff5a5f', 0.6); }
      break;
    }
  }
  c.restore();
}

function drawTentacle(c, tn, x, y) {
  const k = tn.rise > 0 ? 1 - tn.rise / 0.9 : 1, t = K.time * 3 + tn.ph;
  c.save(); c.translate(x, y);
  c.beginPath(); c.ellipse(0, 6, 34, 16, 0, 0, TAU); c.fillStyle = 'rgba(255,255,255,0.18)'; c.fill();
  c.lineWidth = 3; c.strokeStyle = 'rgba(255,255,255,0.4)'; c.stroke();
  c.scale(k, k);
  const pts = [];
  for (let i = 0; i <= 8; i++) { const u = i / 8; pts.push(Math.sin(t + u * 3) * 10 * u + u * 12 * Math.sin(t * 0.5), -u * 46 + Math.cos(t + u * 4) * 4 * u); }
  K.draw.line(pts, tn.hitT > 0 ? '#ffffff' : C.purple[1], 26 - 4, { outline: 6 });
  c.lineWidth = 16; c.strokeStyle = C.purple[0]; c.globalAlpha = 0.35; pathPts(c, pts); c.lineCap = 'round'; c.stroke(); c.globalAlpha = 1;
  for (let i = 1; i < 8; i += 2) { c.beginPath(); c.arc(pts[i * 2] + 6, pts[i * 2 + 1], 3.5, 0, TAU); c.fillStyle = C.pink[0]; c.fill(); }
  K.draw.blob(0, 0, 22, C.purple);
  for (let i = 0; i < tn.hp; i++) { c.beginPath(); c.arc(-6 + i * 12, 10, 4, 0, TAU); c.fillStyle = C.pink[1]; c.fill(); }
  c.restore();
}

function drawWaves(c, t, y0, amp, col, speed, len) {
  const v = K.view;
  c.beginPath(); c.moveTo(-v.ox - 10, v.h + v.oy + 10);
  for (let x = -v.ox - 10; x <= v.w + v.ox + 20; x += 20) c.lineTo(x, y0 + Math.sin(x / len + t * speed) * amp + Math.sin(x / (len * 0.43) - t * speed * 1.3) * amp * 0.35);
  c.lineTo(v.w + v.ox + 20, v.h + v.oy + 10); c.closePath(); c.fillStyle = col; c.fill();
}
function drawShipSide(c, x, y, s, t, tilt) {
  c.save(); c.translate(x, y); c.rotate(Math.sin(t * 1.3) * 0.05 + (tilt || 0)); c.scale(s, s);
  // masts + sails
  for (const [mx, mh] of [[-70, 190], [10, 230], [85, 170]]) {
    c.fillStyle = WOOD[2]; c.fillRect(mx - 5, -mh, 10, mh);
    c.lineWidth = 3; c.strokeStyle = INK; c.strokeRect(mx - 5, -mh, 10, mh);
    for (let k = 0; k < 2; k++) {
      const sy = -mh + 18 + k * (mh * 0.42), sw = 64 - k * 4, sh = mh * 0.36;
      c.beginPath(); c.moveTo(mx - sw / 2, sy); c.quadraticCurveTo(mx, sy - 12, mx + sw / 2, sy);
      c.quadraticCurveTo(mx + sw / 2 + 10, sy + sh / 2, mx + sw / 2, sy + sh); c.quadraticCurveTo(mx, sy + sh - 10, mx - sw / 2, sy + sh);
      c.quadraticCurveTo(mx - sw / 2 + 10, sy + sh / 2, mx - sw / 2, sy); c.closePath();
      c.fillStyle = '#fbf4e4'; c.fill(); c.lineWidth = 4; c.strokeStyle = INK; c.stroke();
    }
  }
  K.draw.icon('skull', 10, -120, 50, '#1b1b1b');
  // flag
  const fw = Math.sin(t * 6) * 6;
  c.beginPath(); c.moveTo(10, -230); c.lineTo(60, -222 + fw); c.lineTo(52, -205 + fw * 0.5); c.lineTo(10, -200); c.closePath();
  c.fillStyle = '#1b1b1b'; c.fill(); c.lineWidth = 3; c.strokeStyle = INK; c.stroke();
  // hull
  c.beginPath(); c.moveTo(-170, -40); c.lineTo(150, -40); c.quadraticCurveTo(190, -50, 205, -80); c.lineTo(185, 10);
  c.quadraticCurveTo(150, 55, 0, 58); c.quadraticCurveTo(-140, 55, -160, 10); c.lineTo(-185, -70); c.closePath();
  const g = c.createLinearGradient(0, -60, 0, 60); g.addColorStop(0, WOOD[0]); g.addColorStop(1, WOOD[2]);
  c.fillStyle = g; c.fill(); c.lineWidth = 6; c.strokeStyle = INK; c.stroke();
  c.fillStyle = GOLD[1]; c.fillRect(-160, -22, 330, 7);
  for (let i = 0; i < 6; i++) { c.beginPath(); c.arc(-110 + i * 48, 8, 9, 0, TAU); c.fillStyle = '#1b1b1b'; c.fill(); c.lineWidth = 3; c.strokeStyle = GOLD[2]; c.stroke(); }
  c.restore();
}

function scorePopup(X, Y, pts, color, big) {
  if (!pts) return;
  K.fx.text(X, Y, '+' + (pts >= 10000 ? K.fmt(pts) : pts.toLocaleString()), { size: big ? 58 : pts >= 5000 ? 44 : 34, color: color || '#ffffff', rise: big ? 120 : 90, life: big ? 1.2 : 0.8 });
}

K.scenes.add('play', {
  gameplay: true, pausable: true, music: 'upbeat', touch: null,
  enter(p) {
    if (p.resume) { this.s = p.resume; Sim.continueRun(this.s); }
    else this.s = Sim.create((Math.random() * 2 ** 31) | 0);   // seed picked outside the sim; the sim itself is deterministic
    this.layout(K.view);
    this.scoreFx = { s: 1 }; this.disp = this.s.score;
    this.banners = []; this.flash = { keg: [0, 0, 0], sling: [0, 0], flip: [0, 0], lane: [0, 0, 0], scoop: 0, loot: [0, 0, 0, 0] };
    this.sink = []; this.armed = false; this.karmed = false; this.kpull = 0; this.trailT = 0; this.achT = 0; this.hintT = 0;
    this.musicMode = 'upbeat';
    K.ui.pauseButton();
    K.audio.play('whoosh');
    if (!p.resume) this.banner('BALL 1', 'Pull back the plunger, matey!', 'blue', 1.8);
    else this.banner('ONE MORE BALL', 'The crew fights on!', 'green', 1.8);
  },
  layout(v) { this.ox = Math.round((v.w - 720) / 2); this.oy = Math.round(Math.max(0, v.h - 1280) * 0.5); },
  onQuit() { K.scenes.go('title'); },
  banner(title, sub, color, dur) {
    if (this.banners.length > 3) this.banners.splice(1, 1);
    this.banners.push({ title, sub, color: color || 'yellow', t: 0, dur: dur || 1.5 });
  },
  bump(k) { K.tween.killOf(this.scoreFx); K.tween(this.scoreFx, { s: 1 + (k || 0.14) }, 0.05).then(() => K.tween(this.scoreFx, { s: 1 }, 0.35, K.Ease.outElastic)); },
  setMusic(m) { if (m !== this.musicMode) { this.musicMode = m; K.music.play(m); } },

  cmd(dt) {
    const s = this.s, I = K.input, v = K.view;
    let L = I.down('flipL'), R = I.down('flipR');
    const plunging = s.phase === 'plunge';
    if (!plunging) for (const pt of I.pointers.values()) { if (pt.x < v.w / 2) L = true; else R = true; }
    const cmd = { L, R, pull: 0, launch: null, skip: false };
    if (plunging) {
      const p = I.pointer;
      if (p.pressed) this.armed = true;
      if (I.pressed('plunge')) this.karmed = true;
      if (this.karmed && I.down('plunge')) this.kpull = Math.min(1, this.kpull + dt / 0.9);
      let pull = this.kpull;
      if (this.armed && p.down) pull = Math.max(pull, K.M.clamp(p.dy / 280, 0, 1));
      cmd.pull = pull;
      if (this.armed && p.released) cmd.launch = pull > 0.04 ? pull : 0.82;
      if (this.karmed && I.released('plunge')) cmd.launch = Math.max(this.kpull, 0.05);
      if (cmd.launch != null) { this.armed = this.karmed = false; this.kpull = 0; }
    } else { this.armed = this.karmed = false; this.kpull = 0; }
    if (s.phase === 'bonus' && (I.pointer.pressed || I.pressed('plunge') || I.pressed('flipL') || I.pressed('flipR'))) cmd.skip = true;
    return cmd;
  },

  update(dt) {
    const s = this.s;
    Sim.step(s, dt, this.cmd(dt));
    for (const e of s.events) this.present(e);
    s.events.length = 0;
    if ((this.achT += dt) > 0.5) { this.achT = 0; this.checkAch(); }
    const mode = s.wizard ? 'retro' : s.mb ? 'tense' : 'upbeat';
    if (s.phase !== 'over') this.setMusic(mode);
  },
  checkAch() {
    let changed = false;
    for (const a of ACH) if (!SAVE.ach[a.id] && a.test(this.s)) {
      SAVE.ach[a.id] = 1; changed = true;
      K.ui.toast(a.name, { icon: 'trophy', dur: 2.6 });
      K.haptic('success');
    }
    if (changed) K.save.commit();
  },

  present(e) {
    const s = this.s, v = K.view, X = K.M.clamp((e.x || 0) + this.ox, 70, v.w - 70), Y = (e.y || 0) + this.oy, F = K.fx, A = K.audio;
    const pts = e.pts || 0;
    if (pts) this.bump(pts >= 25000 ? 0.3 : pts >= 5000 ? 0.18 : 0.08);
    switch (e.type) {
      case 'flip': A.play('flip'); this.flash.flip[e.side] = 1; K.haptic('light'); break;
      case 'flipHit': A.play('thwack', 0.85 + Math.min(0.5, e.power / 6000));
        F.burst(X, Y, { count: 5, speed: [120, 300], size: [3, 6], colors: ['#ffffff', GOLD[0]], life: [0.12, 0.25], gravity: 0, shape: 'spark' }); break;
      case 'launch':
        A.play('plunger', e.p); F.shake(4 + e.p * 8, 0.18); K.haptic('medium');
        F.burst(X, Y - 20, { count: 12, speed: [150, 420], angle: -Math.PI / 2, spread: 1.4, colors: ['#ffffff', C.blue[0]], size: [4, 8], gravity: 300 });
        F.ring(X, Y, { r0: 10, r1: 70, color: '#ffffff', width: 6 }); break;
      case 'autoLaunch': A.play('plunger', 1); F.ring(X, Y, { r0: 10, r1: 60, color: GOLD[0], width: 6 }); break;
      case 'bumper': {
        this.flash.keg[e.i] = 1;
        A.play('keg', [1, 1.19, 1.41][e.i] * (e.kegs ? 1.2 : 1)); K.haptic('light');
        F.ring(X, Y, { r0: BUMP_R, r1: BUMP_R + 40, color: e.kegs ? C.orange[0] : GOLD[0], width: 8, life: 0.25 });
        F.burst(X, Y, { count: e.kegs ? 14 : 7, speed: [200, 520], colors: [GOLD[0], C.orange[1], '#ffffff'], size: [4, 9], life: [0.25, 0.5], shape: 'spark', gravity: 0 });
        scorePopup(X, Y - 40, pts, e.kegs ? C.orange[0] : '#ffffff');
        if (e.kegs) F.shake(5, 0.12);
        break;
      }
      case 'sling': this.flash.sling[e.side] = 1; A.play('sling'); K.haptic('light');
        F.burst(X, Y, { count: 6, speed: [150, 380], colors: ['#ffffff', C.red[0]], size: [3, 7], shape: 'spark', gravity: 0, life: [0.15, 0.3] });
        scorePopup(X, Y - 10, pts); break;
      case 'thud': A.play('thud'); break;
      case 'clack': A.play('clack'); break;
      case 'lane': this.flash.lane[e.i] = 1; A.play('chime', 1 + e.i * 0.12);
        F.burst(X, Y, { count: 10, colors: [GOLD[0], '#ffffff'], shape: 'star', speed: [120, 360], size: [5, 10] }); scorePopup(X, Y - 30, pts, GOLD[0]); break;
      case 'laneAgain': A.play('tick'); scorePopup(X, Y - 30, pts); break;
      case 'lanesDone': A.play('levelup'); K.haptic('success'); F.flash(GOLD[0], 0.25);
        this.banner('RUM LANES!', 'Multiplier ×' + e.mult, 'yellow'); scorePopup(X, Y, pts, GOLD[0], true);
        for (const lx of LANE_X) F.burst(lx + this.ox, LANE_Y + this.oy, { count: 14, shape: 'star', colors: [GOLD[0], GOLD[1], '#ffffff'], speed: [200, 500] });
        break;

        this.banner('KICKBACK!', 'Back into the fray', 'orange'); scorePopup(X, Y - 60, pts); break;
      case 'target': this.flash.loot[e.i] = 1; A.play('drop'); K.haptic('light');
        F.burst(X, Y, { count: 10, colors: [C.red[0], GOLD[0], '#ffffff'], speed: [150, 450], angle: 0, spread: 1.6, shape: 'square', size: [4, 8] });
        scorePopup(X + 40, Y - 10, pts); break;
      case 'lootDone': A.play('win'); K.haptic('success'); F.flash(GOLD[0], 0.25); F.shake(8, 0.2);
        this.banner('LOOT PLUNDERED!', e.label, 'red'); scorePopup(X + 60, Y, pts, GOLD[0], true); break;
      case 'lootReset': A.play('swap'); break;
      case 'orbit': A.play('whoosh'); K.haptic('medium');
        F.burst(X, Y, { count: 16, colors: [C.blue[0], '#ffffff'], speed: [200, 600], angle: -Math.PI / 2, spread: 1.4, shape: 'spark' });
        scorePopup(X + (e.lane ? -50 : 60), Y + 30, pts, C.blue[0], true); F.text(X + (e.lane ? -60 : 70), Y - 20, 'ORBIT!', { size: 40, color: C.blue[0], rise: 70 }); break;
      case 'combo': A.play('power'); F.flash('#ffffff', 0.2);
        this.banner('COMBO ×' + e.n + '!', '+' + pts.toLocaleString(), 'purple', 1.4); break;
      case 'cannon': A.play('tick'); break;
      case 'mbLit': A.play('bell'); this.banner('MULTIBALL LIT', 'Shoot the Captain\'s Cabin!', 'red', 2); break;

      case 'eject': A.play('eject'); F.puff(X, Y); F.shake(5, 0.12); break;
      case 'jackpot':
        A.play('jackpot'); K.haptic('heavy'); F.flash(e.sup ? C.purple[0] : GOLD[0], 0.55); F.shake(18, 0.45); F.hitstop(0.12);
        F.burst(X, Y, { count: 50, shape: 'star', colors: [GOLD[0], GOLD[1], '#ffffff', C.orange[0]], speed: [300, 1000], size: [7, 16], life: [0.6, 1.2] });
        this.banner(e.sup ? 'SUPER JACKPOT!!' : 'JACKPOT!', '+' + pts.toLocaleString(), e.sup ? 'purple' : 'yellow', 2.2);
        if (e.superLit) this.banner('SUPER JACKPOT LIT', 'Shoot the Cabin!', 'purple', 1.6);
        break;
      case 'mbStart': A.play('cannon'); A.play('power'); K.haptic('heavy'); F.flash(C.red[0], 0.5); F.shake(20, 0.5); F.hitstop(0.1);
        this.banner('CANNON MULTIBALL!', 'Hit the flashing shot for JACKPOT', 'red', 2.4); break;
      case 'mbEnd': this.banner('MULTIBALL OVER', 'Jackpots: ' + s.mbJ, 'blue', 1.6); break;
      case 'wizardLit': A.play('bell'); this.banner('MAP COMPLETE!', "Davy Jones' Locker is open!", 'purple', 2.6); break;
      case 'wizardStart': A.play('kraken'); A.play('jackpot'); K.haptic('heavy'); F.flash(C.purple[0], 0.7); F.shake(26, 0.7); F.hitstop(0.15);
        this.banner("DAVY JONES' LOCKER", '4 balls · everything 3×!', 'purple', 3); break;
      case 'wizardEnd': A.play('win'); this.banner('LOCKER RAIDED!', '+' + pts.toLocaleString(), 'purple', 2.4); break;
      case 'missionStart': {
        const m = MISSIONS[e.kind]; A.play('bell'); K.haptic('medium'); F.flash(C.green[0], 0.3);
        this.banner(m.name, m.goal.replace(/\d+/, e.need), 'green', 2.4); break;

      case 'missionProg': A.play('coin'); break;
      case 'missionLit': A.play('bell'); this.banner('MISSION LIT', "Shoot the Captain's Cabin", 'green', 1.6); break;
      case 'missionDone': K.sdk.track('mission', { kind: e.kind, ok: true }); A.play('win'); A.play('jackpot'); K.haptic('success'); F.flash(C.green[0], 0.5); F.shake(14, 0.35); F.hitstop(0.1);
        this.banner('MISSION COMPLETE!', 'Map piece ' + e.pieces + '/5 · +' + pts.toLocaleString(), 'green', 2.6);
        F.burst(X, Y, { count: 40, shape: 'star', colors: [C.green[0], GOLD[0], '#ffffff'], speed: [300, 900], size: [6, 14] }); break;
      case 'missionFail': K.sdk.track('mission', { kind: e.kind, ok: false }); A.play('lose'); this.banner('MISSION FAILED', MISSIONS[e.kind].name, 'gray', 1.8); break;
      case 'mystery': {
        A.play('levelup'); K.haptic('medium');
        this.banner(e.title, e.label, e.id === 'extra' ? 'green' : 'yellow', 2);
        F.burst(X, Y, { count: 24, shape: 'star', colors: [GOLD[0], '#ffffff', C.green[0]], speed: [200, 600] });
        if (pts) scorePopup(X, Y - 40, pts, GOLD[0], true);

      }
      case 'shipSpawn': A.play('splash'); F.ring(X, Y, { r0: 10, r1: 70, color: '#ffffff', width: 6, life: 0.5 }); F.puff(X, Y, { colors: ['#ffffff', '#a8e4ff'] }); break;
      case 'shipFire': A.play('shoot'); F.puff(X, Y, { colors: ['#9fbccb', '#ffffff'], count: 5 }); break;
      case 'shipHit': A.play('hit'); K.haptic('medium'); F.shake(8, 0.18);
        F.burst(X, Y, { count: 14, colors: [WOOD[0], WOOD[1], '#ffffff'], shape: 'square', speed: [150, 450], size: [4, 9] });
        scorePopup(X, Y - 40, pts); break;
      case 'shipSink':
        A.play('cannon'); A.play('splash'); K.haptic('heavy'); F.shake(16, 0.4); F.flash('#ffffff', 0.35); F.hitstop(0.07);
        F.burst(X, Y, { count: 34, colors: [WOOD[0], WOOD[1], WOOD[2], '#ffffff'], shape: 'square', speed: [200, 700], size: [5, 12] });
        F.burst(X, Y, { count: 18, colors: ['#ffffff', '#a8e4ff'], speed: [100, 300], gravity: -200, size: [6, 14], outline: false });
        F.ring(X, Y, { r0: 20, r1: 130, color: '#ffffff', width: 10, life: 0.5 });
        this.sink.push({ kind: e.kind, x: e.x, y: e.y, dir: e.dir || 1, t: 0 });
        this.banner(SHIPS[e.kind].name + ' SUNK!', '+' + pts.toLocaleString(), 'blue', 1.5); scorePopup(X, Y - 50, pts, '#ffffff', true); break;
      case 'shipEscape': F.puff(X, Y, { colors: ['#ffffff'] }); this.sink.push({ kind: e.kind, x: e.x, y: e.y, dir: 1, t: 0, escape: true }); break;
      case 'krakenRise': A.play('kraken'); K.haptic('heavy'); F.shake(18, 0.6); F.flash(C.purple[1], 0.35);
        if (!e.mission) this.banner('THE KRAKEN!', 'Smash its tentacles!', 'purple', 2); break;
      case 'tentHit': A.play('hit'); K.haptic('medium'); F.burst(X, Y, { count: 10, colors: [C.purple[0], C.pink[0]], speed: [150, 400] }); scorePopup(X, Y - 50, pts); F.shake(6, 0.15); break;
      case 'tentSmash': A.play('kraken'); K.haptic('heavy'); F.shake(14, 0.3); F.hitstop(0.06);
        F.burst(X, Y, { count: 26, colors: [C.purple[0], C.purple[1], C.pink[0], '#ffffff'], speed: [200, 700], size: [6, 13] }); scorePopup(X, Y - 50, pts, C.pink[0], true); break;
      case 'tentRetreat': F.puff(X, Y, { colors: [C.purple[0], '#ffffff'] }); break;
      case 'krakenFlee': A.play('win'); this.banner('KRAKEN DEFEATED!', '+' + pts.toLocaleString(), 'purple', 2.2); F.flash(C.purple[0], 0.4); break;
      case 'krakenGone': this.banner('THE KRAKEN SINKS', 'It will return...', 'gray', 1.4); break;
      case 'itemSpawn': if (e.kind !== 'bomb') { F.ring(X, Y, { r0: 4, r1: 34, color: e.kind === 'mine' ? C.red[0] : '#ffffff', width: 4, life: 0.3 }); A.play('pop', 0.7); } break;
      case 'itemGone': F.puff(X, Y); break;
      case 'fizzle': F.puff(X, Y, { colors: ['#9fbccb'] }); A.play('land'); break;
      case 'coin': A.play('coin'); F.burst(X, Y, { count: 10, colors: [GOLD[0], GOLD[1]], shape: 'circle', speed: [120, 380], size: [4, 8] }); scorePopup(X, Y - 26, pts, GOLD[0]); break;
      case 'hoard': A.play('levelup'); this.banner('TREASURE HOARD!', e.n + ' doubloons', 'yellow', 1.4); scorePopup(X, Y, pts, GOLD[0], true); break;
      case 'gem': A.play('power'); F.burst(X, Y, { count: 18, shape: 'star', colors: ['#5ee7ff', '#ffffff', C.blue[0]], speed: [200, 600] }); scorePopup(X, Y - 30, pts, '#a8e4ff', true); break;
      case 'rum': A.play('power'); K.haptic('medium'); F.flash(C.orange[0], 0.3); this.banner('RUM RUSH!', 'Double points for 15s', 'orange', 1.6);
        F.burst(X, Y, { count: 18, colors: [C.orange[0], GOLD[0]], speed: [200, 500] }); break;
      case 'rumEnd': break;
      case 'boom': A.play('explode'); K.haptic('heavy'); F.shake(20, 0.4); F.flash(C.orange[1], 0.4); F.hitstop(0.05);
        F.burst(X, Y, { count: 36, colors: ['#2a3440', C.orange[1], GOLD[0], '#ffffff'], speed: [250, 900], size: [6, 14], shape: 'square' });
        F.ring(X, Y, { r0: 10, r1: 150, color: C.orange[0], width: 14, life: 0.4 }); scorePopup(X, Y - 40, pts); break;
      case 'xFound': A.play('coin'); A.play('levelup'); F.burst(X, Y, { count: 30, shape: 'star', colors: [C.red[0], GOLD[0], '#ffffff'], speed: [200, 700] });
        scorePopup(X, Y - 40, pts, GOLD[0], true); F.shake(8, 0.2); break;
      case 'danger': A.play('error'); this.banner('DANGER LEVEL ' + e.lv, e.lv === 2 ? 'Rough seas ahead' : 'The sea grows angry', 'red', 1.6); break;
      case 'anchorUp': A.play('creak'); F.burst(X, Y, { count: 12, colors: [GOLD[0], '#ffffff'], speed: [100, 300] });
        if (!s.anchorT) this.banner('ANCHOR WEIGHED', 'Mind the center gap!', 'orange', 1.8); break;
      case 'saved': A.play('power'); this.banner('BALL SAVED', 'Back to the plunger!', 'green', 1.2); F.flash(C.green[0], 0.25); break;
      case 'rollback': break;
      case 'multDown': A.play('error'); F.text(v.w / 2 + 180, this.oy + 980, '×' + e.mult, { size: 40, color: C.orange[0], screen: true, rise: 40 }); break;
      case 'cabin': scorePopup(X, Y - 40, pts); break;
      case 'nudge': A.play('whoosh'); F.puff(X, Y); break;
      case 'replay': A.play('win'); K.haptic('success'); this.banner('REPLAY!', 'Extra ball earned', 'green', 2); break;
      case 'drain':
        A.play(e.last ? 'lose' : 'hurt'); K.haptic('fail'); F.shake(e.last ? 18 : 10, 0.4); F.flash(C.red[1], e.last ? 0.45 : 0.25);
        F.burst(X, Y - 30, { count: 20, colors: [C.red[0], '#ffffff'], speed: [150, 500], angle: -Math.PI / 2, spread: 1.6 });
        if (e.last) this.banner('BALL LOST', s.ballsLeft ? s.ballsLeft + ' left in the hold' : 'Last ball...', 'red', 1.3);
        break;
      case 'bonus': A.play('tick'); this.banners.length = 0; break;
      case 'newBall': A.play('swap'); this.banner('BALL ' + e.n, 'Pull back the plunger!', 'blue', 1.4); break;
      case 'continue': break;
      case 'gameover':
        this.checkAch(); SAVE.games++; K.save.commit();
        K.sdk.track('run_end', { score: s.score, time: Math.round(s.t), missions: s.stats.missions, ships: s.stats.ships, multiballs: s.stats.mbs });
        K.scenes.go('over', { state: s });
        break;
    }
  },

  frame(dt) {
    const s = this.s;
    for (const k of ['keg', 'sling', 'flip', 'lane', 'loot']) { const a = this.flash[k]; for (let i = 0; i < a.length; i++) a[i] = Math.max(0, a[i] - dt * 4); }
    this.flash.scoop = Math.max(0, this.flash.scoop - dt * 3);
    this.disp += (s.score - this.disp) * (1 - Math.exp(-10 * dt));
    if (Math.abs(s.score - this.disp) < 1) this.disp = s.score;
    for (const b of this.banners.slice(0, 1)) b.t += dt;
    if (this.banners.length && this.banners[0].t > this.banners[0].dur) this.banners.shift();
    for (const k of this.sink) k.t += dt;
    K.compact(this.sink, k => k.t < 1.4);
    if ((this.trailT += dt) > 1 / 40) {
      this.trailT = 0;
      for (const b of s.balls) {
        const B = b.body, sp = Math.hypot(B.vx, B.vy);
        if (!b.held && sp > 1100) K.fx.trail(B.x + this.ox, B.y + this.oy, { color: s.wizard ? C.purple[0] : s.mb ? C.orange[0] : 'rgba(220,240,255,0.9)', size: [5, 9] });
      }
    }
    this.hintT += dt;
  },

  backdrop(ctx) {
    const v = K.view, t = K.time;
    K.draw.sky('#0f5f96', '#061a33');
    ctx.save(); ctx.globalAlpha = 0.07; ctx.fillStyle = '#a8e4ff';
    for (let i = 0; i < 5; i++) { const x = -v.ox + ((i * 331 + t * 12) % (v.fullW + 300)) - 150; ctx.beginPath(); ctx.moveTo(x, -v.oy); ctx.lineTo(x + 90, -v.oy); ctx.lineTo(x + 260, v.h + v.oy); ctx.lineTo(x + 110, v.h + v.oy); ctx.closePath(); ctx.fill(); }
    ctx.restore();
    for (let i = 0; i < 14; i++) {
      const side = i % 2 ? 1 : -1, gx = side < 0 ? this.ox - 30 - (i * 37) % Math.max(40, this.ox + v.ox) : this.ox + 750 + (i * 37) % Math.max(40, this.ox + v.ox);
      const y = v.h + v.oy - ((t * (30 + i * 4) + i * 190) % (v.fullH + 80));
      ctx.beginPath(); ctx.arc(gx + Math.sin(t * 2 + i) * 8, y, 4 + (i % 4) * 3, 0, TAU); ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 2; ctx.stroke();
    }
    ctx.strokeStyle = 'rgba(255,255,255,0.07)'; ctx.lineWidth = 4;
    for (let i = 0; i < 9; i++) {
      const y = ((i * 173 + t * 22) % (v.h + 200)) - 100;
      ctx.beginPath();
      for (let x = -v.ox; x <= v.w + v.ox; x += 24) ctx.lineTo(x, y + Math.sin(x / 60 + t + i) * 8);
      ctx.stroke();
    }
  },

  render(ctx, a) {
    const s = this.s, L = K.M.lerp, t = K.time;
    ctx.save(); ctx.translate(this.ox, this.oy);
    K.draw.drawSprite(K.draw.sprite('pp-table', 720, 1280, c => drawTable(c), { res: tableRes(), pad: 0 }), 360, 640);
    if (s.rumT > 0) { ctx.globalAlpha = 0.12 + 0.06 * Math.sin(t * 8); ctx.fillStyle = C.orange[1]; pathPts(ctx, GEO.field, true); ctx.fill(); ctx.globalAlpha = 1; }
    if (s.wizard) { ctx.globalAlpha = 0.14 + 0.08 * Math.sin(t * 5); ctx.fillStyle = C.purple[1]; pathPts(ctx, GEO.field, true); ctx.fill(); ctx.globalAlpha = 1; }

    /* --- chase lights on the arch rail --- */
    const nChase = (ARCH.length / 2) | 0, speed = s.wizard ? 26 : s.mb ? 18 : 7, hot = s.mb || s.wizard || s.rumT > 0;
    for (let i = 1; i < nChase - 1; i++) {
      const ph = ((i - t * speed) % 6 + 6) % 6, on = ph < (hot ? 2 : 1);
      const x = ARCH[i * 2], y = ARCH[i * 2 + 1];
      const col = s.wizard ? C.purple[0] : s.mb ? (i % 2 ? C.red[0] : GOLD[0]) : s.rumT > 0 ? C.orange[0] : GOLD[0];
      ctx.beginPath(); ctx.arc(x, y, on ? 4.5 : 3, 0, TAU); ctx.fillStyle = on ? col : 'rgba(255,243,176,0.35)'; ctx.fill();
      if (on && hot) K.draw.glow(x, y, 16, col, 0.6);
    }

    /* --- inserts / lamps --- */
    const plunge = s.phase === 'plunge';
    LANE_X.forEach((x, i) => {
      const skill = (plunge || s.skillT > 0) && i === s.skillLane;
      lamp(ctx, x, LANE_Y + 2, 17, skill ? 'green' : 'yellow', s.lanes[i] || (skill && blink(5)) || this.flash.lane[i] > 0.3, 'RUM'[i], 20);
    });
    for (let i = 0; i < 5; i++) {
      const x = 250 + i * 40, y = 972 + Math.abs(i - 2) * -4;
      lamp(ctx, x, y, 15, 'orange', s.mult >= i + 2, '×' + (i + 2), 14);
    }
    for (let i = 0; i < 5; i++) {
      const a2 = Math.PI * (0.15 + i * 0.175), x = 330 - Math.cos(a2) * 92, y = 925 - Math.sin(a2) * 28;
      const lit = s.mapPieces > i || (s.wizardLit && blink(4, i * 0.1));
      lamp(ctx, x, y, 13, 'purple', lit, null);
      if (lit || s.mapPieces === i && s.mission) K.draw.icon('star', x, y, 14, lit ? '#ffffff' : C.purple[2]);
    }
    LOOT_Y.forEach((y, i) => lamp(ctx, 152, y + LOOT_LEN / 2, 11, 'red', s.loot[i], 'LOOT'[i], 13));
    for (let i = 0; i < 4; i++) lamp(ctx, 549, 572 + i * 30, 9, 'orange', s.cannon > i || (s.mbLit && blink(4)), null);
    const jp = s.mb && !s.superLit ? s.jpShot : -1;
    const scoopState = s.wizardLit ? 'purple' : s.mb ? (s.superLit ? 'purple' : jp === 2 ? 'yellow' : null) : s.mbLit ? 'red' : (s.missionLit && !s.mission) ? 'green' : null;
    arrowLamp(ctx, 474, 548, -0.85, 20, scoopState || 'blue', !!scoopState && blink(scoopState === 'yellow' ? 6 : 3));
    const plunder = !!(s.mission && s.mission.kind === 'plunder');
    arrowLamp(ctx, 51, 810, -Math.PI / 2, 18, jp === 0 ? 'yellow' : 'green', (jp === 0 || plunder) && blink(5));
    arrowLamp(ctx, 610, 765, -Math.PI / 2, 18, jp === 1 ? 'yellow' : 'green', (jp === 1 || plunder) && blink(5, 0.1));
    arrowLamp(ctx, 42, 1040, -Math.PI / 2, 15, 'green', s.kickback);
    const saving = s.ballSaveT > 0 || (s.mb && s.mbSaveT > 0);
    lamp(ctx, 330, 1036, 16, 'green', saving && (s.ballSaveT > 3 || blink(6)), null);
    K.draw.icon('heart', 330, 1036, 18, saving ? '#ffffff' : C.green[2]);

    /* --- scoop glow --- */
    if (scoopState) K.draw.glow(SCOOP.x, SCOOP.y, 52, C[scoopState][0], 0.35 + 0.2 * Math.sin(t * 6));
    if (this.flash.scoop > 0) K.draw.glow(SCOOP.x, SCOOP.y, 70, '#ffffff', this.flash.scoop * 0.8);

    /* --- X spot --- */
    if (s.xspot) {
      const xs = s.xspot, pr = 22 + Math.sin(t * 6) * 4;
      K.draw.glow(xs.x, xs.y, 60, C.red[0], 0.45);
      ctx.beginPath(); ctx.arc(xs.x, xs.y, pr, 0, TAU); ctx.lineWidth = 4; ctx.strokeStyle = GOLD[0]; ctx.setLineDash([6, 6]); ctx.stroke(); ctx.setLineDash([]);
      K.draw.line([xs.x - 14, xs.y - 14, xs.x + 14, xs.y + 14], C.red[1], 9, { outline: 5 });
      K.draw.line([xs.x + 14, xs.y - 14, xs.x - 14, xs.y + 14], C.red[1], 9, { outline: 5 });
    }

    /* --- anchor post --- */
    const anchorOn = s.t < 60 || s.anchorT > 0;
    if (anchorOn) {
      K.draw.glow(330, 1176, 34, GOLD[0], 0.4);
      K.draw.blob(330, 1176, 10, GOLD);
      ctx.save(); ctx.translate(330, 1206); ctx.globalAlpha = 0.9;
      ctx.beginPath(); ctx.moveTo(0, -14); ctx.lineTo(0, 10); ctx.moveTo(-12, 2); ctx.quadraticCurveTo(0, 18, 12, 2); ctx.moveTo(-6, -8); ctx.lineTo(6, -8);
      ctx.lineWidth = 7; ctx.strokeStyle = INK; ctx.lineCap = 'round'; ctx.stroke(); ctx.lineWidth = 3.5; ctx.strokeStyle = GOLD[0]; ctx.stroke();
      ctx.restore();
    }

    /* --- items --- */
    for (const it of s.items) if (!it.dead) drawItem(ctx, it, L(it.px, it.x, a), L(it.py, it.y, a));

    /* --- LOOT drop targets --- */
    s.targets.forEach((tg, i) => {
      const y = LOOT_Y[i];
      if (s.loot[i]) { ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(112, y + 2, 8, LOOT_LEN - 4); return; }
      K.draw.block(113, y, 14, LOOT_LEN, this.flash.loot[i] > 0 ? 'yellow' : 'red', { r: 4, depth: 3, outline: 3 });
    });

    /* --- kegs (pop bumpers) --- */
    BUMPERS.forEach(([x, y], i) => {
      const f = this.flash.keg[i], sc = 1 + f * 0.14;
      if (f > 0) K.draw.glow(x, y, 80, GOLD[0], f * 0.7);
      K.draw.drawSprite(kegSprite(f > 0.3), x, y, { scale: sc });
    });

    /* --- sling flashes --- */
    [GEO.slingL, GEO.slingR].forEach((g, i) => {
      const f = this.flash.sling[i];
      if (f > 0) { ctx.globalAlpha = f; K.draw.line([g[4], g[5], g[0], g[1]], GOLD[0], 9, { outline: 0 }); ctx.globalAlpha = 1; }
    });

    /* --- sinking ships (cosmetic) --- */
    for (const k of this.sink) {
      const p = k.t / 1.4;
      ctx.save(); ctx.translate(k.x, k.y + p * 18); ctx.rotate((k.escape ? 0 : 0.6) * p * k.dir); ctx.globalAlpha = 1 - p;
      K.draw.drawSprite(shipSprite(k.kind), 0, 0, { scale: 1 - p * 0.5 });
      ctx.restore();
    }
    /* --- ships --- */
    for (const sh of s.ships) {
      if (sh.dead) continue;
      const x = L(sh.px, sh.x, a), y = L(sh.py, sh.y, a);
      const rise = sh.rise > 0 ? 1 - sh.rise / 0.8 : 1;
      ctx.save(); ctx.translate(x, y);
      ctx.beginPath(); ctx.ellipse(0, 6, sh.r * 1.5, sh.r * 0.7, 0, 0, TAU); ctx.fillStyle = 'rgba(255,255,255,0.12)'; ctx.fill();
      const wob = sh.hitT > 0 ? Math.sin(sh.hitT * 60) * 0.15 : Math.sin(t * 2 + sh.id) * 0.04;
      ctx.rotate(wob);
      const ghostA = sh.kind === 'ghost' ? (sh.solid ? 0.95 : 0.3 + 0.1 * Math.sin(t * 20)) : 1;
      K.draw.drawSprite(shipSprite(sh.kind), 0, 0, { sx: (sh.vx < 0 ? -1 : 1) * rise, sy: rise, alpha: ghostA * rise });
      if (sh.hitT > 0) { ctx.globalAlpha = sh.hitT * 3; K.draw.glow(0, 0, sh.r * 1.6, '#ffffff', 0.8); ctx.globalAlpha = 1; }
      ctx.restore();
      if (sh.maxHp > 1 && rise >= 1) for (let i = 0; i < sh.maxHp; i++) {
        ctx.beginPath(); ctx.arc(x - (sh.maxHp - 1) * 7 + i * 14, y - sh.r - 12, 5, 0, TAU);
        ctx.fillStyle = i < sh.hp ? C.red[1] : 'rgba(0,0,0,0.4)'; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = INK; ctx.stroke();
      }
      if (sh.life < 3 && blink(6)) K.draw.icon('arrowR', x + (sh.vx < 0 ? -sh.r - 18 : sh.r + 18), y, 18, '#ffffff');
    }
    /* --- kraken --- */
    for (const tn of s.tentacles) drawTentacle(ctx, tn, L(tn.px, tn.x, a), L(tn.py, tn.y, a));

    /* --- plunger --- */
    const pull = L(s.plunger.ppull, s.plunger.pull, a);
    const ky = 1254 + pull * 34;
    ctx.save();
    ctx.lineWidth = 4; ctx.strokeStyle = '#9fbccb';
    ctx.beginPath(); for (let i = 0; i <= 8; i++) { const yy = ky + 4 + i * (1280 - ky - 4) / 8; ctx.lineTo(669 + (i % 2 ? 12 : -12), yy); } ctx.stroke();
    K.draw.block(650, ky - 8, 38, 14, 'red', { r: 6, depth: 4, outline: 3 });
    ctx.restore();

    /* --- flippers --- */
    s.flippers.forEach((f, i) => renderFlipper(ctx, f, L(f.pa, f.a, a), this.flash.flip[i]));

    /* --- balls --- */
    for (const b of s.balls) {
      const B = b.body;
      let x = L(B.px, B.x, a), y = L(B.py, B.y, a);
      if (b.held === 'plunger') y += pull * 34;
      if (b.held === 'scoop') { ctx.globalAlpha = 0.6; K.draw.blobS(x, y, BALL_R * 0.85, BALL_PAL); ctx.globalAlpha = 1; continue; }
      ctx.beginPath(); ctx.ellipse(x + 5, y + 8, 14, 10, 0, 0, TAU); ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.fill();
      K.draw.blobS(x, y, BALL_R, BALL_PAL);
    }

    /* --- plunger aim dots (drag-aim feedback) --- */
    if (plunge && pull > 0.02) {
      const v = Sim.launchSpeed(s, pull), pts = s.P.predict(PLUNGE.x, PLUNGE.y, 0, -v, 18, 1 / 50, BALL_R, false), out = [];
      for (let i = 0; i < pts.length; i += 2) if (pts[i + 1] > 440 && pts[i + 1] < PLUNGE.y - 30) out.push(pts[i], pts[i + 1]);
      if (out.length) K.draw.dots(out, pull > 0.9 ? C.red[0] : pull > 0.6 ? GOLD[0] : '#ffffff', 7);
    }
    ctx.restore();
  },

  hud(ctx) {
    const v = K.view, s = this.s, st = v.safe.top, t = K.time;
    // score
    ctx.save(); ctx.translate(v.w / 2, 48 + st); ctx.scale(this.scoreFx.s, this.scoreFx.s);
    K.draw.text(Math.round(this.disp).toLocaleString(), 0, 0, { size: 56, color: s.wizard ? C.purple[0] : s.rumT > 0 ? C.orange[0] : '#fff3b0', maxW: v.w - 330 });
    ctx.restore();
    // balls in the hold
    const spare = s.phase === 'over' ? 0 : s.ballsLeft;
    K.draw.text('BALL ' + s.ballNum, 26 + v.safe.left, 34 + st, { size: 26, align: 'left', sw: 5 });
    for (let i = 0; i < Math.min(spare, 6); i++) K.draw.blobS(40 + v.safe.left + i * 26, 70 + st, 10, BALL_PAL);
    // multiplier + danger
    K.draw.pill(v.w - 180 - v.safe.right, 48 + st, '×' + s.mult, { size: 28, color: s.mult > 1 ? C.orange[0] : '#ffffff' });
    if (s.mult > 1) K.draw.bar(v.w - 180 - v.safe.right, 82 + st, 70, 14, s.multT / 30, 'orange');
    // status row
    const row = 96 + st;
    if (s.mission) {
      const m = s.mission, def = MISSIONS[m.kind];
      K.draw.bar(v.w / 2, row, 360, 34, m.t / m.dur, m.t < 8 ? 'red' : 'green');
      K.draw.text(def.short + ' ' + m.got + '/' + m.need + '  ' + Math.ceil(m.t) + 's', v.w / 2, row, { size: 22, sw: 4, shadow: false });
    } else {
      let msg = null, col = '#ffffff';
      if (s.wizardLit) { msg = "SHOOT THE CABIN: DAVY JONES' LOCKER"; col = C.purple[0]; }
      else if (s.mb) { msg = s.superLit ? 'SUPER JACKPOT ' + K.fmt(s.jackpot * 3) + ': CABIN' : 'JACKPOT ' + K.fmt(s.jackpot) + ': ' + ['LEFT ORBIT', 'RIGHT ORBIT', 'CABIN'][s.jpShot]; col = GOLD[0]; }
      else if (s.mbLit) { msg = 'MULTIBALL LIT: SHOOT THE CABIN'; col = C.red[0]; }
      else if (s.missionLit) { msg = 'MISSION LIT: SHOOT THE CABIN'; col = C.green[0]; }
      else if (s.rumT > 0) { msg = 'RUM RUSH 2× · ' + Math.ceil(s.rumT) + 's'; col = C.orange[0]; }
      else if (s.phase === 'play') { msg = 'DANGER LV ' + s.dangerLv + ' · MAP ' + s.mapPieces + '/5'; col = '#a8e4ff'; }
      if (msg && (s.mb || s.phase !== 'play' || blink(1.2) || msg.startsWith('DANGER'))) K.draw.text(msg, v.w / 2, row, { size: 22, color: col, sw: 5, maxW: v.w - 40 });
    }
    // banners
    const bn = this.banners[0];
    if (bn) {
      const p = bn.t / bn.dur, sc = bn.t < 0.2 ? K.Ease.outBack(bn.t / 0.2) : 1, al = p > 0.82 ? 1 - (p - 0.82) / 0.18 : 1;
      const by = Math.max(this.oy + 330, 300 + v.safe.top + 110);
      ctx.save(); ctx.translate(v.w / 2, by); ctx.scale(sc, sc); ctx.globalAlpha = al;
      const pal = C[bn.color] || C.yellow;
      const w = Math.min(v.w - 30, Math.max(K.draw.measure(bn.title, 58), K.draw.measure(bn.sub || '', 28)) + 90);
      K.draw.rr(-w / 2, -58, w, bn.sub ? 116 : 84, 30); ctx.fillStyle = K.color.alpha(INK, 0.72); ctx.fill();
      ctx.lineWidth = 5; ctx.strokeStyle = pal[1]; ctx.stroke();
      K.draw.text(bn.title, 0, -18, { size: 54, color: pal[0], maxW: w - 40 });
      if (bn.sub) K.draw.text(bn.sub, 0, 32, { size: 28, color: '#ffffff', sw: 5, maxW: w - 40 });
      ctx.restore();
    }
    // plunge hint
    if (s.phase === 'plunge' && s.phaseT > 0.6) {
      const hx = 669 + this.ox, hy = 1150 + this.oy + Math.sin(t * 6) * 8;
      K.draw.arrow(hx, hy - 50, hx, hy + 10, '#ffffff', 10);
      K.draw.text(K.input.touch ? 'PULL DOWN' : 'HOLD SPACE', 552 + this.ox, 1112 + this.oy, { size: 26, color: GOLD[0], sw: 5 });
      K.draw.text('& release', 552 + this.ox, 1140 + this.oy, { size: 20, sw: 4 });
    }
    // first-ball control hints
    if (s.ballNum === 1 && s.phase === 'play' && s.phaseT < 5 && this.hintT < 30) {
      ctx.globalAlpha = Math.min(1, (5 - s.phaseT) / 1);
      const y = this.oy + 1110;
      if (K.input.touch) {
        K.draw.text('TAP', v.w * 0.18, y, { size: 34, color: '#ffffff' }); K.draw.text('TAP', v.w * 0.82, y, { size: 34, color: '#ffffff' });
        K.draw.text('left flipper', v.w * 0.18, y + 34, { size: 20, sw: 4 }); K.draw.text('right flipper', v.w * 0.82, y + 34, { size: 20, sw: 4 });
      } else K.draw.text('←  /  →  FLIP', v.w / 2, this.oy + 1240, { size: 30, color: '#ffffff' });
      ctx.globalAlpha = 1;
    }
    // end-of-ball bonus
    if (s.phase === 'bonus' && s.bonus) {
      const B = s.bonus, pt = s.phaseT, cy = this.oy + 620, H = 220 + B.lines.length * 46;
      const sc = pt < 0.3 ? K.Ease.outBack(pt / 0.3) : 1;
      ctx.save(); ctx.translate(v.w / 2, cy); ctx.scale(sc, sc);
      K.draw.panel(0, 0, 560, H, { title: 'BALL BONUS', color: 'blue' });
      let y = -H / 2 + 80;
      B.lines.forEach((l, i) => {
        if (pt < 0.4 + i * 0.35) return;
        K.draw.label(l.label + '  ' + l.n + ' × ' + l.each.toLocaleString(), -230, y, { size: 26, align: 'left' });
        K.draw.label(l.v.toLocaleString(), 230, y, { size: 26, align: 'right' });
        y += 46;
      });
      const tStart = 0.4 + B.lines.length * 0.35;
      if (pt > tStart) {
        const k = K.M.clamp((pt - tStart) / 0.8, 0, 1);
        K.draw.label('× ' + B.mult + ' MULTIPLIER', 0, H / 2 - 100, { size: 28, color: C.orange[2] });
        K.draw.text(Math.round(B.total * K.Ease.outCubic(k)).toLocaleString(), 0, H / 2 - 50, { size: 54, color: GOLD[1] });
      }
      ctx.restore();
      K.draw.text('tap to skip', v.w / 2, cy + H / 2 + 50, { size: 22, sw: 4 });
    }
  },
});

K.scenes.add('over', {
  music: 'chill',
  enter(p) {
    const s = this.s = p.state;
    const prev = SAVE.best;
    this.newBest = s.score > prev;
    if (this.newBest) { SAVE.best = s.score; K.save.commit(); }
    this.best = Math.max(prev, s.score);
    K.sdk.send('score', { value: s.score });
    this.shown = { n: 0 }; this.pan = { s: 0 };
    K.tween(this.shown, { n: s.score }, 1.4, K.Ease.outCubic, 0.35);
    K.tween(this.pan, { s: 1 }, 0.5, K.Ease.outBack);
    K.audio.play('lose');
    if (this.newBest) K.wait(1.5).then(() => {
      const v = K.view;
      K.audio.play('win'); K.haptic('success');
      K.fx.burst(v.w / 2, v.h * 0.36, { shape: 'star', colors: [GOLD[0], GOLD[1], '#ffffff'], count: 46, speed: [300, 950], size: [10, 20] });
    });
    K.ui.button({ label: 'RETRY', icon: 'retry', color: 'green', w: 320, h: 124, key: 'action', pulse: true, popIn: 0.4,
      place: v => ({ x: v.w / 2 + 75, y: v.h * 0.4 + 340 }), onTap: () => K.scenes.go('play') });
    K.ui.button({ icon: 'home', color: 'blue', w: 124, h: 124, popIn: 0.35,
      place: v => ({ x: v.w / 2 - 190, y: v.h * 0.4 + 340 }), onTap: () => K.scenes.go('title') });
    if (!s.continued) {
      const cont = K.ui.button({ label: 'ONE MORE BALL', icon: 'video', color: 'purple', w: 470, h: 110, popIn: 0.55, sub: 'watch an ad to keep plundering',
        place: v => ({ x: v.w / 2, y: v.h * 0.4 + 490 }),
        onTap: async () => {
          cont.enabled = false;
          const r = await K.adBreak('rewarded');
          if (r.granted) { K.audio.play('coin'); K.scenes.go('play', { resume: s }); }
          else { cont.label = 'NO AD AVAILABLE'; cont.sub = null; }
        } });
    }
  },
  backdrop(ctx) {
    const t = K.time, v = K.view;
    K.draw.sky('#14466e', '#061a33');
    drawWaves(ctx, t, v.h * 0.83, 10, '#0f4f88', 0.8, 90);
    drawShipSide(ctx, v.w * 0.5, v.h * 0.86 + 40, 0.6, t, 0.35);
    drawWaves(ctx, t + 2, v.h * 0.88, 12, '#0b2c50', 1, 70);
    for (let i = 0; i < 8; i++) { const y = v.h - ((t * 60 + i * 140) % (v.h * 0.3)); ctx.beginPath(); ctx.arc(v.w * 0.5 + Math.sin(t * 2 + i) * 30 + (i - 4) * 18, y, 5 + i % 3 * 3, 0, TAU); ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 3; ctx.stroke(); }
  },
  hud(ctx) {
    const v = K.view, s = this.s, cy = v.h * 0.4;
    ctx.save(); ctx.translate(v.w / 2, cy); ctx.scale(this.pan.s, this.pan.s);
    K.draw.panel(0, 0, 600, 500, { title: 'SHIPWRECKED!', color: 'red' });
    K.draw.label('PLUNDER', 0, -150, { size: 34, color: C.gray[2] });
    K.draw.text(Math.round(this.shown.n).toLocaleString(), 0, -82, { size: 80, color: GOLD[1], maxW: 540 });
    K.draw.pill(0, 10, 'BEST ' + this.best.toLocaleString(), { icon: 'star', size: 32 });
    if (this.newBest) {
      ctx.save(); ctx.translate(0, 82); ctx.rotate(Math.sin(K.time * 4) * 0.05);
      K.draw.text('NEW BEST!', 0, 0, { size: 50, color: C.green[0] }); ctx.restore();
    } else K.draw.label('Time at sea ' + K.fmtTime(s.t), 0, 82, { size: 30 });
    const st = s.stats;
    [['skull', st.ships, 'ships'], ['star', st.missions, 'missions'], ['coin', st.coins, 'gold'], ['trophy', st.jackpots, 'jackpots']].forEach(([ic, n, lb], i) => {
      const x = -210 + i * 140;
      K.draw.icon(ic, x, 160, 44, ic === 'skull' ? '#ffffff' : GOLD[1]);
      K.draw.label(String(n), x, 202, { size: 30 });
      K.draw.label(lb, x, 228, { size: 18, color: C.gray[2] });
    });
    ctx.restore();
  },
});

K.boot('title');
</script>
