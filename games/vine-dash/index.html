<script>
"use strict";
/* §1 MANIFEST */
const MANIFEST = {
  id: 'vine-dash',
  title: 'Vine Dash',
  version: '1.0.0',
  genre: 'runner',
  theme: 'jungle',
  orientation: 'portrait',
  design: { w: 720, h: 1280, maxW: 900 },
  touch: { stick: false, buttons: [] },
};
</script>
<script>
//#KERNEL-BEGIN 1.1.0
/* =========================================================================
   SlopGames KERNEL 1.1.0 — single-file HTML5 game kernel (Canvas2D, zero deps)
   Requires a global `MANIFEST` declared in an earlier <script>. Exposes `K`.
   Source of truth: /kernel/kernel-1.1.0.js  — never edit inside a game file.
   ========================================================================= */
const K = (() => {
  'use strict';
  const KERNEL_VERSION = '1.1.0';
  const TAU = Math.PI * 2;

  /* ---------- manifest defaults ---------- */
  const MF = (typeof MANIFEST !== 'undefined' && MANIFEST) ? MANIFEST : {};
  const DEFAULT_KEYS = {
    up: ['ArrowUp', 'KeyW', 'PadUp'], down: ['ArrowDown', 'KeyS', 'PadDown'],
    left: ['ArrowLeft', 'KeyA', 'PadLeft'], right: ['ArrowRight', 'KeyD', 'PadRight'],
    action: ['Space', 'Enter', 'PadA'], alt: ['ShiftLeft', 'KeyX', 'PadB'],
    pause: ['Escape', 'KeyP', 'PadStart'],
  };
  MF.id = MF.id || 'game';
  MF.title = MF.title || 'Game';
  MF.version = MF.version || '1.0.0';
  MF.design = Object.assign({ w: 720, h: 1280 }, MF.design || {});
  MF.keys = Object.assign({}, DEFAULT_KEYS, MF.keys || {});
  MF.touch = Object.assign({ stick: false, buttons: [] }, MF.touch || {});
  MF.platformOrigins = MF.platformOrigins || [];
  MF.orientation = MF.orientation || 'any';            // 'portrait' | 'landscape' | 'any'
  MF.theme = MF.theme || 'candy';

  /* ---------- canvas bootstrap (games may omit their own <canvas>) ---------- */
  if (!document.getElementById('k-base-css')) {
    const st = document.createElement('style'); st.id = 'k-base-css';
    st.textContent = 'html,body{margin:0;height:100%;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}#stage{position:fixed;inset:0;display:block;width:100%;height:100%;outline:none}';
    document.head.appendChild(st);
  }
  let canvas = document.getElementById('stage');
  if (!canvas) { canvas = document.createElement('canvas'); canvas.id = 'stage'; canvas.tabIndex = 0; document.body.appendChild(canvas); }
  const mainCtx = canvas.getContext('2d');
  let ctx = mainCtx;                                    // swapped while baking sprites

  /* =======================================================================
     MATH / RNG / NOISE / COLOR
     ======================================================================= */
  const M = {
    TAU,
    clamp: (v, a, b) => v < a ? a : v > b ? b : v,
    lerp: (a, b, t) => a + (b - a) * t,
    invLerp: (a, b, v) => (v - a) / (b - a),
    remap: (v, a, b, c, d) => c + (d - c) * ((v - a) / (b - a)),
    smoothstep: (a, b, v) => { const t = Math.max(0, Math.min(1, (v - a) / (b - a))); return t * t * (3 - 2 * t); },
    dist: (ax, ay, bx, by) => Math.hypot(bx - ax, by - ay),
    dist2: (ax, ay, bx, by) => (bx - ax) * (bx - ax) + (by - ay) * (by - ay),
    len: (x, y) => Math.hypot(x, y),
    norm: (x, y) => { const l = Math.hypot(x, y) || 1; return { x: x / l, y: y / l }; },
    dot: (ax, ay, bx, by) => ax * bx + ay * by,
    cross: (ax, ay, bx, by) => ax * by - ay * bx,
    rotate: (x, y, a) => { const c = Math.cos(a), s = Math.sin(a); return { x: x * c - y * s, y: x * s + y * c }; },
    angle: (x, y) => Math.atan2(y, x),
    angleDiff: (a, b) => { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; },
    approach: (v, t, d) => v < t ? Math.min(v + d, t) : Math.max(v - d, t),
    damp: (a, b, lambda, dt) => a + (b - a) * (1 - Math.exp(-lambda * dt)),
    wrap: (v, max) => ((v % max) + max) % max,
    sign: v => v > 0 ? 1 : v < 0 ? -1 : 0,
  };

  function rng(seed = 1) {
    let s = (seed >>> 0) || 1;
    const r = () => {
      s = (s + 0x6D2B79F5) | 0;
      let t = Math.imul(s ^ (s >>> 15), 1 | s);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    r.range = (a, b) => a + (b - a) * r();
    r.int = (a, b) => Math.floor(a + (b - a + 1) * r());
    r.pick = arr => arr[Math.floor(r() * arr.length)];
    r.chance = p => r() < p;
    r.sign = () => r() < 0.5 ? -1 : 1;
    r.shuffle = arr => { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); const t = arr[i]; arr[i] = arr[j]; arr[j] = t; } return arr; };
    r.weighted = (items, weightOf = it => it.w) => {
      let total = 0; for (const it of items) total += weightOf(it);
      let x = r() * total; for (const it of items) { x -= weightOf(it); if (x <= 0) return it; }
      return items[items.length - 1];
    };
    r.state = () => s;
    r.setState = v => { s = v | 0; };
    return r;
  }
  function hashSeed(str) {
    let h = 2166136261;
    str = String(str);
    for (let i = 0; i < str.length; i++) h = Math.imul(h ^ str.charCodeAt(i), 16777619);
    return h >>> 0;
  }
  function dailySeed(offsetDays = 0) {
    const d = new Date(Date.now() + offsetDays * 864e5);
    return hashSeed(MF.id + ':' + d.getUTCFullYear() + '-' + (d.getUTCMonth() + 1) + '-' + d.getUTCDate());
  }

  function noise(seed = 1) {
    const r = rng(seed), p = new Uint16Array(512), vals = new Float32Array(256), perm = [];
    for (let i = 0; i < 256; i++) { perm.push(i); vals[i] = r() * 2 - 1; }
    r.shuffle(perm);
    for (let i = 0; i < 512; i++) p[i] = perm[i & 255];
    const fade = t => t * t * (3 - 2 * t);
    const h1 = i => vals[p[i & 255]];
    const h2 = (i, j) => vals[p[p[i & 255] + (j & 255)]];
    function n1(x) { const xi = Math.floor(x), t = fade(x - xi); return M.lerp(h1(xi), h1(xi + 1), t); }
    function n2(x, y) {
      const xi = Math.floor(x), yi = Math.floor(y), u = fade(x - xi), v = fade(y - yi);
      return M.lerp(M.lerp(h2(xi, yi), h2(xi + 1, yi), u), M.lerp(h2(xi, yi + 1), h2(xi + 1, yi + 1), u), v);
    }
    function fbm(fn, oct, ...c) { let s = 0, a = 1, f = 1, n = 0; for (let i = 0; i < oct; i++) { s += a * fn(...c.map(v => v * f)); n += a; a *= 0.5; f *= 2; } return s / n; }
    return { n1, n2, fbm1: (x, o = 4) => fbm(n1, o, x), fbm2: (x, y, o = 4) => fbm(n2, o, x, y) };
  }

  const color = {
    rgb(hex) { hex = hex.replace('#', ''); if (hex.length === 3) hex = hex.split('').map(c => c + c).join(''); const n = parseInt(hex, 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; },
    hex(r, g, b) { return '#' + [r, g, b].map(v => Math.round(M.clamp(v, 0, 255)).toString(16).padStart(2, '0')).join(''); },
    mix(a, b, t) { const A = color.rgb(a), B = color.rgb(b); return color.hex(M.lerp(A[0], B[0], t), M.lerp(A[1], B[1], t), M.lerp(A[2], B[2], t)); },
    shade(hex, amt) { return amt >= 0 ? color.mix(hex, '#ffffff', amt) : color.mix(hex, '#000000', -amt); },
    alpha(hex, a) { const c = color.rgb(hex); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; },
    hsl(h, s, l) { return `hsl(${h},${s}%,${l}%)`; },
    pal(base) { return [color.shade(base, 0.45), base, color.shade(base, -0.3)]; },
  };

  const fmt = (n) => {
    const a = Math.abs(n);
    if (a < 1000) return String(Math.floor(n));
    const u = ['K', 'M', 'B', 'T', 'Qa', 'Qi']; let i = -1, v = a;
    while (v >= 1000 && i < u.length - 1) { v /= 1000; i++; }
    return (n < 0 ? '-' : '') + (v < 10 ? v.toFixed(2) : v < 100 ? v.toFixed(1) : Math.floor(v)) + u[i];
  };
  const fmtTime = (sec) => { sec = Math.max(0, Math.ceil(sec)); const m = Math.floor(sec / 60), s = sec % 60; return m + ':' + String(s).padStart(2, '0'); };
  function compact(arr, keep) { let j = 0; for (let i = 0; i < arr.length; i++) if (keep(arr[i], i)) arr[j++] = arr[i]; arr.length = j; return arr; }

  /* =======================================================================
     EASING / TWEENS / SPRINGS (cosmetic, real-time)
     ======================================================================= */
  const Ease = {
    linear: t => t,
    inQuad: t => t * t,
    outQuad: t => 1 - (1 - t) * (1 - t),
    inOutQuad: t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2,
    inCubic: t => t * t * t,
    outCubic: t => 1 - Math.pow(1 - t, 3),
    inOutCubic: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
    outQuart: t => 1 - Math.pow(1 - t, 4),
    inBack: t => { const c1 = 1.70158; return (c1 + 1) * t * t * t - c1 * t * t; },
    outBack: t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
    outElastic: t => t === 0 ? 0 : t === 1 ? 1 : Math.pow(2, -10 * t) * Math.sin((t * 10 - .75) * (TAU / 3)) + 1,
    outBounce: t => {
      const n = 7.5625, d = 2.75;
      if (t < 1 / d) return n * t * t;
      if (t < 2 / d) return n * (t -= 1.5 / d) * t + .75;
      if (t < 2.5 / d) return n * (t -= 2.25 / d) * t + .9375;
      return n * (t -= 2.625 / d) * t + .984375;
    },
    pingPong: t => t < 0.5 ? t * 2 : 2 - t * 2,
  };
  const tweens = [];
  function tween(obj, to, dur = 0.3, ease = Ease.outQuad, delay = 0) {
    const tw = { obj, to, from: {}, dur: Math.max(dur, 1e-4), ease, t: -delay, started: false, done: false, _then: null,
      then(fn) { this._then = fn; return this; }, kill() { this.done = true; } };
    tweens.push(tw);
    return tw;
  }
  tween.killOf = obj => { for (const t of tweens) if (t.obj === obj) t.done = true; };
  function wait(sec) { return new Promise(res => tween({}, {}, sec).then(res)); }
  function updateTweens(dt) {
    for (let i = tweens.length - 1; i >= 0; i--) {
      const tw = tweens[i];
      if (tw.done) { tweens.splice(i, 1); continue; }
      tw.t += dt;
      if (tw.t < 0) continue;
      if (!tw.started) { tw.started = true; for (const k in tw.to) tw.from[k] = tw.obj[k]; }
      const p = Math.min(1, tw.t / tw.dur), e = tw.ease(p);
      for (const k in tw.to) tw.obj[k] = tw.from[k] + (tw.to[k] - tw.from[k]) * e;
      if (p >= 1) { tw.done = true; tweens.splice(i, 1); if (tw._then) tw._then(); }
    }
  }
  // Critically-damped-ish spring: call every frame. s = {v, vel}; returns new value.
  function spring(s, target, dt, stiffness = 220, damping = 18) {
    const a = (target - s.v) * stiffness - s.vel * damping;
    s.vel += a * dt; s.v += s.vel * dt;
    return s.v;
  }

  /* =======================================================================
     VIEW / RESIZE / ADAPTIVE QUALITY
     ======================================================================= */
  const view = { w: MF.design.w, h: MF.design.h, fullW: MF.design.w, fullH: MF.design.h, ox: 0, oy: 0,
    scale: 1, dpr: 1, dprCap: 2.5, safe: { top: 0, right: 0, bottom: 0, left: 0 },
    get portrait() { return this.fullH >= this.fullW; } };
  const probe = document.createElement('div');
  probe.style.cssText = 'position:fixed;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)';
  document.body.appendChild(probe);
  function resize() {
    const D = MF.design;
    const cw = Math.max(1, window.innerWidth), ch = Math.max(1, window.innerHeight);
    const dpr = Math.min(window.devicePixelRatio || 1, view.dprCap);
    const scale = Math.min(cw / D.w, ch / D.h);
    view.scale = scale; view.dpr = dpr;
    view.fullW = cw / scale; view.fullH = ch / scale;
    view.w = Math.min(view.fullW, D.maxW || Infinity);
    view.h = Math.min(view.fullH, D.maxH || Infinity);
    view.ox = (view.fullW - view.w) / 2; view.oy = (view.fullH - view.h) / 2;
    canvas.width = Math.round(cw * dpr); canvas.height = Math.round(ch * dpr);
    const cs = getComputedStyle(probe);
    view.safe.top = Math.max(0, (parseFloat(cs.paddingTop) || 0) / scale - view.oy);
    view.safe.right = Math.max(0, (parseFloat(cs.paddingRight) || 0) / scale - view.ox);
    view.safe.bottom = Math.max(0, (parseFloat(cs.paddingBottom) || 0) / scale - view.oy);
    view.safe.left = Math.max(0, (parseFloat(cs.paddingLeft) || 0) / scale - view.ox);
    spriteCache.checkRes();
    input.layoutTouch();
    if (camera.auto) camera.center();
    scenes.layout();
  }

  /* =======================================================================
     THEMES — art-direction presets; every preset has the same color keys
     ======================================================================= */
  const ROUNDED = '"Arial Rounded MT Bold","Nunito","Baloo 2",ui-rounded,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';
  const THEMES = {
    candy: { ink: '#1b1b3a', paper: '#fff7e8', paperText: '#1b1b3a', bg: '#1b1b3a', sky: ['#4fc3ff', '#8a6cff'], font: ROUNDED,
      colors: { green: ['#8af59a', '#2fbf4a', '#1d8a33'], blue: ['#86d0ff', '#2b8cff', '#1a5fc0'], yellow: ['#fff08a', '#ffc21a', '#d48a00'],
        red: ['#ff9a9a', '#ff4b5c', '#c0283a'], purple: ['#d2b0ff', '#8f5bff', '#5f33c4'], orange: ['#ffc48a', '#ff8a1f', '#c45c00'],
        pink: ['#ffb0dc', '#ff5cb4', '#c42d84'], gray: ['#eef0f6', '#aab2c8', '#6f7891'] } },
    neon: { ink: '#07041a', paper: '#1a1440', paperText: '#ffffff', bg: '#07041a', sky: ['#1a0f3d', '#05030f'], font: ROUNDED, glow: true,
      colors: { green: ['#b0ffd0', '#22ff88', '#00a352'], blue: ['#b0f0ff', '#22d3ff', '#0078b8'], yellow: ['#fffbb0', '#ffe600', '#b89f00'],
        red: ['#ffb0c4', '#ff2e63', '#a8002f'], purple: ['#ebc4ff', '#b44cff', '#6d17b0'], orange: ['#ffd8b0', '#ff8c1a', '#b35400'],
        pink: ['#ffc8f2', '#ff3cc7', '#a3007a'], gray: ['#e0e3ff', '#8088c0', '#3a4070'] } },
    pastel: { ink: '#4a3f5c', paper: '#fffaf3', paperText: '#4a3f5c', bg: '#efe4ff', sky: ['#ffe1ec', '#d9e8ff'], font: ROUNDED,
      colors: { green: ['#d4f7dc', '#9be3ad', '#5fb377'], blue: ['#d6ecff', '#9ccbff', '#5f95cf'], yellow: ['#fff6cc', '#ffe08a', '#d1aa45'],
        red: ['#ffd6dc', '#ff9eac', '#cf6575'], purple: ['#ebdcff', '#c3a3ff', '#8b6bc9'], orange: ['#ffe4cc', '#ffbf8a', '#cf8c52'],
        pink: ['#ffdcef', '#ffa8d4', '#cf6fa0'], gray: ['#f4f2f7', '#cfc9d9', '#968ea6'] } },
    jungle: { ink: '#1f2a12', paper: '#fff6dc', paperText: '#1f2a12', bg: '#1f2a12', sky: ['#9be58e', '#2e8b57'], font: ROUNDED,
      colors: { green: ['#c4f28a', '#6cc23a', '#3d7a1c'], blue: ['#9fe3e0', '#2fa8a0', '#1d6b66'], yellow: ['#fff0a0', '#f2c230', '#a8800f'],
        red: ['#ffb09a', '#e8573a', '#a3321c'], purple: ['#d8b8ff', '#9b6ad6', '#63408f'], orange: ['#ffcf8f', '#f08c24', '#a85a0c'],
        pink: ['#ffc0d2', '#e86a94', '#a33a5e'], gray: ['#efe9d8', '#b5ab8f', '#7a7058'] } },
    ocean: { ink: '#0b2545', paper: '#f0fbff', paperText: '#0b2545', bg: '#0b2545', sky: ['#5ee7ff', '#1b6ca8'], font: ROUNDED,
      colors: { green: ['#a8ffe0', '#2ee6a6', '#16a374'], blue: ['#a8e4ff', '#2ab0ff', '#1572b3'], yellow: ['#fff3b0', '#ffd23f', '#b8901a'],
        red: ['#ffb3b3', '#ff5a5f', '#b8323a'], purple: ['#c9c4ff', '#7a6cff', '#4a3fb3'], orange: ['#ffd1a8', '#ff9a3c', '#b8621a'],
        pink: ['#ffc4e1', '#ff70b0', '#b83d78'], gray: ['#e8f4f8', '#9fbccb', '#5e7f8f'] } },
    retro: { ink: '#000000', paper: '#1d1d1d', paperText: '#ffffff', bg: '#000000', sky: ['#1a0033', '#000000'], font: '"Courier New",ui-monospace,Menlo,monospace',
      colors: { green: ['#80ff80', '#00d800', '#008800'], blue: ['#80c0ff', '#3878f8', '#0030b0'], yellow: ['#ffff80', '#f8d800', '#a88800'],
        red: ['#ff8080', '#f83800', '#a80000'], purple: ['#e080ff', '#a000f8', '#6000a8'], orange: ['#ffc080', '#f87800', '#a84800'],
        pink: ['#ffa0e0', '#f878f8', '#a838a8'], gray: ['#ffffff', '#bcbcbc', '#7c7c7c'] } },
    ink: { ink: '#141414', paper: '#ffffff', paperText: '#141414', bg: '#f5f1e8', sky: ['#faf7f0', '#e6dfcf'], font: ROUNDED,
      colors: { green: ['#e6e6e6', '#bdbdbd', '#7a7a7a'], blue: ['#e6e6e6', '#9e9e9e', '#5c5c5c'], yellow: ['#fff3c4', '#ffd84d', '#b89400'],
        red: ['#ffc9c4', '#e8402e', '#9e2216'], purple: ['#e0e0e0', '#8a8a8a', '#4d4d4d'], orange: ['#f0f0f0', '#b0b0b0', '#6e6e6e'],
        pink: ['#ffd6d1', '#f07a6e', '#a83f34'], gray: ['#ffffff', '#d6d6d6', '#8f8f8f'] } },
  };
  const THEME = {};
  function setTheme(name) {
    const t = THEMES[name] || THEMES.candy;
    for (const k in THEME) delete THEME[k];
    Object.assign(THEME, JSON.parse(JSON.stringify(t)), { name: THEMES[name] ? name : 'candy' });
    if (MF.bg) THEME.bg = MF.bg;
    document.body.style.background = THEME.bg;
    spriteCache.clear();
  }

  /* =======================================================================
     STORAGE / SAVE / META-PROGRESSION
     ======================================================================= */
  const store = (() => {
    const ns = 'k:' + MF.id + ':';
    const mem = {};
    return {
      get(k, def) {
        if (k in mem) return mem[k];
        try { const v = localStorage.getItem(ns + k); if (v != null) return (mem[k] = JSON.parse(v)); } catch (e) {}
        return def;
      },
      set(k, v) {
        mem[k] = v;
        try { localStorage.setItem(ns + k, JSON.stringify(v)); } catch (e) {}
        sdk.send('save', { key: k, value: v });
      },
      remove(k) { delete mem[k]; try { localStorage.removeItem(ns + k); } catch (e) {} sdk.send('save', { key: k, value: null }); },
      import(obj) { if (obj && typeof obj === 'object') for (const k in obj) if (obj[k] != null) mem[k] = obj[k]; },
    };
  })();

  const clone = o => JSON.parse(JSON.stringify(o));
  function fillDefaults(target, defs) {
    for (const k in defs) {
      if (!(k in target)) target[k] = clone(defs[k]);
      else if (defs[k] && typeof defs[k] === 'object' && !Array.isArray(defs[k]) && target[k] && typeof target[k] === 'object') fillDefaults(target[k], defs[k]);
    }
    return target;
  }
  const save = (() => {
    let def = null;
    const data = {};
    let commitT = null;
    function load(raw) {
      let d = raw && typeof raw === 'object' ? clone(raw) : null;
      if (!d) d = Object.assign(clone(def.defaults), { _v: def.version });
      let v = d._v || 1;
      while (v < def.version) { const fn = def.migrate[v + 1]; if (fn) d = fn(d) || d; v++; d._v = v; }
      fillDefaults(d, def.defaults);
      for (const k in data) delete data[k];
      Object.assign(data, d);
    }
    return {
      // K.save.define({version, defaults, migrate:{2: d => {...}}}) → returns the live data object
      define(o) { def = { version: o.version || 1, defaults: o.defaults || {}, migrate: o.migrate || {} }; load(store.get('save', null)); return data; },
      get data() { return data; },
      commit() { if (def) { clearTimeout(commitT); commitT = null; store.set('save', data); } },
      later() { if (def && !commitT) commitT = setTimeout(() => save.commit(), 800); },
      reset() { if (!def) return; for (const k in data) delete data[k]; Object.assign(data, clone(def.defaults), { _v: def.version }); save.commit(); },
      reload() { if (def) load(store.get('save', null)); },
      get defined() { return !!def; },
    };
  })();

  const meta = (() => {
    const m = () => {
      if (!save.defined) save.define({ version: 1, defaults: {} });
      const d = save.data;
      return d._meta || (d._meta = { wallet: {}, up: {}, levels: {}, daily: { last: null, streak: 0 }, unlocks: {}, sel: {} });
    };
    const upDefs = {};
    const listeners = [];
    const emit = (type, data) => listeners.forEach(fn => fn(type, data));

      wheel(x, y, dy) { for (let i = W.length - 1; i >= 0; i--) { const w = W[i]; if (w.kind === 'list' && active(w) && inRect(w, x, y, 0)) { const L = kinds.list.layout(w); w.off = M.clamp(w.off + dy, 0, L.maxOff); return true; } } return false; },
      keys() {
        for (const w of W) if (w.kind === 'button' && w.key && active(w) && input.pressed(w.key)) {
          bounce(w, 0.9, 0.06); w._tw.then(() => bounce(w, 1, 0.35, Ease.outElastic));
          if (w.sfx) audio.play(w.sfx); if (w.onTap) w.onTap(w); return;
        }
      },
    };
    return api;
  })();

  /* =======================================================================
     INPUT — keyboard, unified pointer, multitouch, gamepad, typed text, touch overlay
     ======================================================================= */
  const input = (() => {
    const keyMap = {};
    for (const a in MF.keys) for (const c of MF.keys[a]) (keyMap[c] || (keyMap[c] = [])).push(a);
    const held = new Set(), pr = new Set(), rl = new Set(), vHeld = new Set(), padHeld = new Set();
    const axis = { x: 0, y: 0 }, pad = { x: 0, y: 0, ax: 0, ay: 0, connected: false };
    const typed = [];
    const p = { x: 0, y: 0, down: false, pressed: false, released: false, tap: false, dragging: false,
      startX: 0, startY: 0, dx: 0, dy: 0, downAt: 0, holdTime: 0, id: null, vx: 0, vy: 0, _lx: 0, _ly: 0, _lt: 0,
      get wx() { return camera.toWorld(this.x, this.y).x; }, get wy() { return camera.toWorld(this.x, this.y).y; },
      get wStartX() { return camera.toWorld(this.startX, this.startY).x; }, get wStartY() { return camera.toWorld(this.startX, this.startY).y; } };
    const pointers = new Map();     // all non-UI pointers (multitouch)
    let touchMode = window.matchMedia && matchMedia('(pointer: coarse)').matches;
    const stick = { id: null, ox: 0, oy: 0, kx: 0, ky: 0, r: 90 };
    // Touch overlay config: scene.touch overrides MANIFEST.touch (set scene.touch = null to hide).
    const tc = () => { const sc = scenes.current; return sc && sc.touch !== undefined ? (sc.touch || NO_TOUCH) : MF.touch; };
    const NO_TOUCH = { stick: false, buttons: [] };
    let tbtn = [], tbtnFor = null;
    function syncButtons() {
      const c = tc();
      if (c !== tbtnFor) { tbtnFor = c; tbtn = (c.buttons || []).map(b => ({ action: b.action, label: b.label || '', icon: b.icon || null, color: b.color || 'purple', x: 0, y: 0, r: b.r || 72, id: null })); api.layoutTouch(); }
      return tbtn;
    }
    const toL = e => ({ x: e.clientX / view.scale - view.ox, y: e.clientY / view.scale - view.oy });
    const overlayOn = () => { if (!touchMode || !scenes.current || !scenes.current.gameplay || sys.paused || sys.modal) return false; const c = tc(); syncButtons(); return !!(c.stick || tbtn.length); };
    const press = a => { if (a === 'pause') { if (!sys.modal) sys.paused ? resumeGame() : pauseGame(); return; } held.add(a); pr.add(a); };

    window.addEventListener('keydown', e => {
      audio.unlock();
      if (e.code === 'Backquote') { debug.on = !debug.on; return; }
      if (!sys.ad && !e.ctrlKey && !e.metaKey) { if (e.key.length === 1) typed.push(e.key); else if (e.key === 'Backspace') typed.push('\b'); else if (e.key === 'Enter') typed.push('\n'); }
      const acts = keyMap[e.code];
      if (!acts) { if (e.key === 'Backspace' || e.key === ' ') e.preventDefault(); return; }
      e.preventDefault(); touchMode = false;
      if (e.repeat || sys.ad) return;
      acts.forEach(press);
    });
    window.addEventListener('keyup', e => { const acts = keyMap[e.code]; if (!acts) return; acts.forEach(a => { held.delete(a); rl.add(a); }); });
    window.addEventListener('blur', () => held.clear());

    canvas.addEventListener('pointerdown', e => {
      e.preventDefault(); audio.unlock(); try { canvas.focus({ preventScroll: true }); } catch (_) {}
      if (e.pointerType === 'touch' || e.pointerType === 'pen') touchMode = true; else if (e.pointerType === 'mouse') touchMode = false;
      if (sys.ad) return;
      const q = toL(e);
      try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
      if (sys.crashed) { if (q.y > view.h - 260) location.reload(); return; }
      if (ui.down(q.x, q.y, e.pointerId)) return;
      if (overlayOn()) {
        for (const b of tbtn) if (b.id == null && M.dist(q.x, q.y, b.x, b.y) < b.r * 1.3) { b.id = e.pointerId; vHeld.add(b.action); pr.add(b.action); haptic('light'); return; }
        if (tc().stick && stick.id == null && q.x < view.w * 0.5) { stick.id = e.pointerId; stick.ox = q.x; stick.oy = q.y; stick.kx = stick.ky = 0; return; }
      }
      if (sys.paused) return;
      pointers.set(e.pointerId, { id: e.pointerId, x: q.x, y: q.y, startX: q.x, startY: q.y, downAt: performance.now(), pressed: true });
      if (p.id != null) return;
      p.id = e.pointerId; p.down = true; p.pressed = true; p.dragging = false;
      p.x = p.startX = p._lx = q.x; p.y = p.startY = p._ly = q.y; p.dx = p.dy = p.vx = p.vy = 0; p.downAt = p._lt = performance.now(); p.holdTime = 0;
    });
    canvas.addEventListener('pointermove', e => {
      const q = toL(e);
      if (e.pointerId === stick.id) {
        let dx = q.x - stick.ox, dy = q.y - stick.oy; const d = Math.hypot(dx, dy);
        if (d > stick.r) { dx *= stick.r / d; dy *= stick.r / d; }
        stick.kx = dx; stick.ky = dy; axis.x = dx / stick.r; axis.y = dy / stick.r; return;
      }
      ui.move(q.x, q.y, e.pointerId);
      const pt = pointers.get(e.pointerId); if (pt) { pt.x = q.x; pt.y = q.y; }
      if (e.pointerId === p.id || p.id == null) { p.x = q.x; p.y = q.y; }
      if (e.pointerId === p.id) {
        p.dx = p.x - p.startX; p.dy = p.y - p.startY;
        if (!p.dragging && Math.hypot(p.dx, p.dy) > 14) p.dragging = true;
        const now = performance.now(), dt = Math.max(1, now - p._lt) / 1000;
        p.vx = p.vx * 0.5 + (q.x - p._lx) / dt * 0.5; p.vy = p.vy * 0.5 + (q.y - p._ly) / dt * 0.5; p._lx = q.x; p._ly = q.y; p._lt = now;
      }
    });
    const up = (e, cancel) => {
      const q = toL(e);
      if (ui.up(q.x, q.y, e.pointerId)) return;
      for (const b of tbtn) if (b.id === e.pointerId) { b.id = null; if (!tbtn.some(o => o.id != null && o.action === b.action)) { vHeld.delete(b.action); rl.add(b.action); } return; }
      if (e.pointerId === stick.id) { stick.id = null; axis.x = axis.y = 0; return; }
      pointers.delete(e.pointerId);
      if (e.pointerId === p.id) {
        p.x = q.x; p.y = q.y; p.dx = p.x - p.startX; p.dy = p.y - p.startY;
        if (performance.now() - p._lt > 80) { p.vx = 0; p.vy = 0; }
        p.down = false; p.released = !cancel; p.tap = !cancel && !p.dragging && performance.now() - p.downAt < 350; p.id = null;
      }
    };
    canvas.addEventListener('pointerup', e => up(e, false));
    canvas.addEventListener('pointercancel', e => up(e, true));
    canvas.addEventListener('contextmenu', e => e.preventDefault());
    canvas.addEventListener('wheel', e => { e.preventDefault(); const q = toL(e); if (!ui.wheel(q.x, q.y, e.deltaY)) api.wheel += e.deltaY; }, { passive: false });

    const PAD_NAMES = ['PadA', 'PadB', 'PadX', 'PadY', 'PadLB', 'PadRB', 'PadLT', 'PadRT', 'PadBack', 'PadStart', 'PadL3', 'PadR3', 'PadUp', 'PadDown', 'PadLeft', 'PadRight'];
    const dz = v => Math.abs(v) < 0.2 ? 0 : (v - Math.sign(v) * 0.2) / 0.8;
    function pollPad() {
      if (!navigator.getGamepads) return;
      let gp = null; try { for (const g of navigator.getGamepads()) if (g && g.connected) { gp = g; break; } } catch (e) { return; }
      pad.connected = !!gp;
      if (!gp) { if (padHeld.size) { padHeld.forEach(a => rl.add(a)); padHeld.clear(); } pad.x = pad.y = pad.ax = pad.ay = 0; return; }
      const now = new Set();
      gp.buttons.forEach((b, i) => { if (b.pressed && PAD_NAMES[i] && keyMap[PAD_NAMES[i]]) keyMap[PAD_NAMES[i]].forEach(a => now.add(a)); });
      pad.x = dz(gp.axes[0] || 0); pad.y = dz(gp.axes[1] || 0); pad.ax = dz(gp.axes[2] || 0); pad.ay = dz(gp.axes[3] || 0);
      for (const a of now) if (!padHeld.has(a)) { touchMode = false; if (a === 'pause') press(a); else { pr.add(a); } }
      for (const a of padHeld) if (!now.has(a)) rl.add(a);
      padHeld.clear(); now.forEach(a => { if (a !== 'pause') padHeld.add(a); });
    }

    const api = {
      pointer: p, pointers, pad, wheel: 0,
      get typed() { return typed; },
      get touch() { return touchMode; },
      down: a => held.has(a) || vHeld.has(a) || padHeld.has(a),
      pressed: a => pr.has(a),
      released: a => rl.has(a),
      axisX() { let x = axis.x + pad.x; if (api.down('left')) x -= 1; if (api.down('right')) x += 1; return M.clamp(x, -1, 1); },
      axisY() { let y = axis.y + pad.y; if (api.down('up')) y -= 1; if (api.down('down')) y += 1; return M.clamp(y, -1, 1); },
      // Normalized movement vector (diagonals not faster).
      move() { const x = api.axisX(), y = api.axisY(), l = Math.hypot(x, y); return l > 1 ? { x: x / l, y: y / l } : { x, y }; },
      // Aim direction: right stick, else pointer relative to (fromX, fromY) in world space.
      aim(fromX, fromY) {
        if (Math.hypot(pad.ax, pad.ay) > 0.3) return { x: pad.ax, y: pad.ay, active: true };
        const dx = p.wx - fromX, dy = p.wy - fromY, l = Math.hypot(dx, dy) || 1;

      },
      poll() { pollPad(); if (p.down) p.holdTime = (performance.now() - p.downAt) / 1000; },
      endStep() { pr.clear(); rl.clear(); p.pressed = p.released = p.tap = false; typed.length = 0; api.wheel = 0; for (const pt of pointers.values()) pt.pressed = false; },
      reset() {
        held.clear(); vHeld.clear(); pr.clear(); rl.clear(); typed.length = 0; axis.x = axis.y = 0; stick.id = null; pointers.clear();
        tbtn.forEach(b => b.id = null); p.down = p.pressed = p.released = p.tap = p.dragging = false; p.id = null; p.vx = p.vy = 0;
      },
      layoutTouch() {
        tbtn.forEach((b, i) => { b.x = view.w - 110 - view.safe.right - (i % 2) * 165; b.y = view.h - 140 - view.safe.bottom - (i % 2) * 70 - Math.floor(i / 2) * 170; });
      },
      drawTouch() {
        if (!overlayOn()) return;
        if (tc().stick) {
          const ox = stick.id != null ? stick.ox : 150 + view.safe.left, oy = stick.id != null ? stick.oy : view.h - 170 - view.safe.bottom;
          ctx.globalAlpha = stick.id != null ? 0.55 : 0.25;
          ctx.beginPath(); ctx.arc(ox, oy, stick.r + 20, 0, TAU); ctx.fillStyle = color.alpha(THEME.ink, 0.5); ctx.fill();
          ctx.lineWidth = 5; ctx.strokeStyle = '#fff'; ctx.stroke();
          ctx.globalAlpha = stick.id != null ? 0.9 : 0.35;
          blob(ox + (stick.id != null ? stick.kx : 0), oy + (stick.id != null ? stick.ky : 0), 48, THEME.colors.gray);
          ctx.globalAlpha = 1;
        }
        for (const b of tbtn) {
          ctx.globalAlpha = b.id != null ? 0.95 : 0.6;
          blob(b.x, b.y + (b.id != null ? 4 : 0), b.r * (b.id != null ? 0.92 : 1), THEME.colors[b.color] || THEME.colors.purple);
          if (b.icon) icon(b.icon, b.x, b.y, b.r * 0.8); else text(b.label, b.x, b.y, { size: 44 });
          ctx.globalAlpha = 1;
        }
      },
    };
    return api;
  })();

  /* =======================================================================
     SCENES
     ======================================================================= */
  const scenes = (() => {
    const reg = {};
    let cur = null, name = null, busy = false;
    const fade = { a: 0 };
    function swap(n, params) {
      if (!reg[n]) { reportError(new Error('Unknown scene: ' + n), 'scenes.go'); return; }
      if (cur) { if (cur.gameplay) sdk.send('gameplayStop'); safeCall(cur, 'exit'); }
      ui.clearScene(); ui.clearModals(); fx.clear(); input.reset(); camera.reset(); sys.paused = false; hitstopT = 0; acc = 0;
      name = n; cur = reg[n];
      safeCall(cur, 'enter', params || {});
      safeCall(cur, 'layout', view);
      ui.place();
      if (cur.music !== undefined) { if (cur.music) music.play(cur.music); else music.stop(); }
      if (cur.gameplay) sdk.send('gameplayStart');
      sdk.send('scene', { name: n });
    }
    return {
      add(n, def) { reg[n] = def; return def; },
      has(n) { return !!reg[n]; },
      go(n, params, opts = {}) {
        if (busy) return;
        if (!cur || opts.instant) { swap(n, params); return; }
        busy = true;
        tween(fade, { a: 1 }, 0.16, Ease.inQuad).then(() => { swap(n, params); tween(fade, { a: 0 }, 0.22, Ease.outQuad).then(() => busy = false); });
      },
      get current() { return cur; },
      get name() { return name; },
      get list() { return Object.keys(reg); },
      fade,
      layout() { safeCall(cur, 'layout', view); ui.place(); },
    };
  })();

  /* =======================================================================
     ADS
     ======================================================================= */
  const devAd = { on: false, t: 0, kind: '', res: null };
  async function adBreak(kind = 'midgame') {
    if (sys.ad) return { shown: false, granted: false };
    sys.ad = true; input.reset(); updateDuck(); sdk.send('gameplayStop');
    let r = null;
    if (sdk.connected) r = await sdk.request('adBreak', { kind }, 90000);
    else if (!sdk.inFrame) r = await new Promise(res => { Object.assign(devAd, { on: true, t: kind === 'rewarded' ? 2 : 1, kind, res }); });
    sys.ad = false; updateDuck(); last = performance.now();
    if (scenes.current && scenes.current.gameplay && !sys.paused) sdk.send('gameplayStart');
    r = r || {};
    return { shown: !!r.shown, granted: kind === 'rewarded' && !!r.granted };
  }

  /* =======================================================================
     DEBUG
     ======================================================================= */
  const debug = { on: /[?&]debug/.test(location.search), fps: 60, steps: 0, low: 0 };

  /* ---------- system pause overlay widgets ---------- */
  ui.button({ group: 'sys', label: 'RESUME', icon: 'play', color: 'green', w: 400, h: 120, key: 'action', pulse: true,
    place: v => ({ x: v.w / 2, y: v.h / 2 + 10 }), onTap: resumeGame });
  ui.soundButton({ group: 'sys', place: v => ({ x: v.w / 2 - 130, y: v.h / 2 + 165 }) });
  ui.musicButton({ group: 'sys', place: v => ({ x: v.w / 2, y: v.h / 2 + 165 }) });
  const sysHome = ui.button({ group: 'sys', icon: 'home', color: 'red', w: 110, h: 110,
    place: v => ({ x: v.w / 2 + 130, y: v.h / 2 + 165 }),
    onTap: () => { const sc = scenes.current; sys.paused = false; safeCall(sc, 'onQuit'); } });

  /* =======================================================================
     MAIN LOOP — fixed-step sim (60 Hz), per-frame presentation
     ======================================================================= */
  const STEP = 1 / 60, MAX_STEPS = 6;
  let last = 0, acc = 0, clock = 0, frameN = 0;
  function frame(now) {
    requestAnimationFrame(frame);
    let dt = (now - last) / 1000; last = now;
    if (!(dt > 0)) dt = 0; if (dt > 0.1) dt = 0.1;
    if (dt > 0) debug.fps += (1 / dt - debug.fps) * 0.05;
    frameN++;
    // adaptive resolution: drop DPR if we're struggling
    if (frameN > 120 && debug.fps < 42 && view.dprCap > 1) { if (++debug.low > 90) { view.dprCap = Math.max(1, view.dprCap - 0.5); debug.low = 0; resize(); } } else debug.low = 0;
    if (devAd.on) { devAd.t -= dt; if (devAd.t <= 0) { devAd.on = false; devAd.res({ shown: true, granted: true }); } }
    sys.rotate = input.touch && ((MF.orientation === 'landscape' && view.fullH > view.fullW * 1.1) || (MF.orientation === 'portrait' && view.fullW > view.fullH * 1.1));
    const sc = scenes.current;
    input.poll();
    if (!sys.frozen && sc) {
      clock += dt;
      updateTweens(dt);
      ui.update(dt);
      ui.keys();
      if (!sys.simHalted) {
        let steps = 0;
        if (hitstopT > 0) hitstopT -= dt;
        else {
          acc += dt;
          while (acc >= STEP && steps < MAX_STEPS) {
            safeCall(sc, 'update', STEP); input.endStep(); acc -= STEP; steps++;
            if (scenes.current !== sc || sys.simHalted) break;
          }
          if (steps === MAX_STEPS) acc = 0;
        }
        debug.steps = steps;
        safeCall(sc, 'frame', dt);
        fx.update(dt);
      } else if (sys.modal && !sys.paused) { fx.update(dt); input.endStep(); }
      camera.update(dt, M.clamp(acc / STEP, 0, 1));
    }
    ui.place();
    render();
  }

  function render() {
    const s = view.dpr * view.scale, sc = scenes.current, alpha = M.clamp(acc / STEP, 0, 1);
    ctx = mainCtx;
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1;
    ctx.fillStyle = THEME.bg; ctx.fillRect(0, 0, canvas.width, canvas.height);
    const ox = view.ox, oy = view.oy;
    // world layer (shakes; camera)
    ctx.setTransform(s, 0, 0, s, (ox + fx.offset.x) * s, (oy + fx.offset.y) * s);
    if (sc) safeCall(sc, 'backdrop', ctx, alpha);
    ctx.save(); camera.apply(ctx);
    if (sc) safeCall(sc, 'render', ctx, alpha);
    fx.draw(false);
    ctx.restore();
    // screen layer (stable)
    ctx.setTransform(s, 0, 0, s, ox * s, oy * s);
    if (sc) safeCall(sc, 'hud', ctx, alpha);
    fx.draw(true);
    input.drawTouch();
    ui.draw('scene');
    fx.drawFlash();
    ui.drawModals();
    ui.drawToasts();
    if (sys.paused) {
      ctx.fillStyle = 'rgba(20,18,50,0.62)'; ctx.fillRect(-ox, -oy, view.fullW, view.fullH);
      panel(view.w / 2, view.h / 2 + 50, 540, 480, { title: 'PAUSED', color: 'purple' });
      sysHome.visible = !!(sc && sc.onQuit);
      ui.draw('sys');
    }
    if (sys.rotate) {
      ctx.fillStyle = THEME.bg; ctx.fillRect(-ox, -oy, view.fullW, view.fullH);
      ctx.save(); ctx.translate(view.w / 2, view.h / 2 - 60); ctx.rotate(Math.sin(clock * 3) * 0.6);
      block(-70, -110, 140, 220, 'blue', { r: 24 }); ctx.restore();
      text('Rotate your device', view.w / 2, view.h / 2 + 120, { size: 48, maxW: view.w - 60 });
    }
    if (devAd.on) {
      ctx.fillStyle = '#0d0c22'; ctx.fillRect(-ox, -oy, view.fullW, view.fullH);
      text('AD BREAK', view.w / 2, view.h / 2 - 50, { size: 72, color: '#ffe680' });
      text(`${devAd.kind} · dev stub · ${Math.ceil(devAd.t)}`, view.w / 2, view.h / 2 + 40, { size: 32, color: '#aab2c8' });
    }
    if (sys.crashed) {
      ctx.fillStyle = 'rgba(16,10,30,0.88)'; ctx.fillRect(-ox, -oy, view.fullW, view.fullH);
      icon('skull', view.w / 2, view.h / 2 - 170, 140, '#ff9a9a');
      text('Oops! The game crashed.', view.w / 2, view.h / 2 - 40, { size: 50, maxW: view.w - 60 });
      label(sys.crashed.where + ': ' + sys.crashed.message, view.w / 2, view.h / 2 + 40, { size: 26, color: '#ffb0b0', maxW: view.w - 60 });
      block(view.w / 2 - 190, view.h - 220, 380, 110, 'green', { r: 36 }); text('RESTART', view.w / 2, view.h - 170, { size: 48 });
    }
    if (scenes.fade.a > 0) { ctx.globalAlpha = scenes.fade.a; ctx.fillStyle = THEME.bg; ctx.fillRect(-ox, -oy, view.fullW, view.fullH); ctx.globalAlpha = 1; }
    if (debug.on) {
      const lines = [`${debug.fps | 0} fps · ${debug.steps} steps · ${fx.count} fx · ${spriteCache.size} spr`, `${view.w | 0}×${view.h | 0} @${(view.dpr * view.scale).toFixed(2)} · scene ${scenes.name} · k${KERNEL_VERSION}`];
      lines.forEach((l, i) => text(l, 12 - 0, 22 + i * 26 + view.safe.top, { size: 20, align: 'left', shadow: false, sw: 4 }));
    }
  }

  /* =======================================================================
     BOOT
     ======================================================================= */
  let booted = false;
  function boot(startScene, params) {
    if (booted) return; booted = true;
    // Title-card mode: the platform (window.SG_CARD) or a ?card URL boots a game's 'card' key-art scene for thumbnails.
    try { if ((window.SG_CARD || /[?&]card\b/.test(location.search)) && scenes.has('card')) startScene = 'card'; } catch (e) {}
    resize();
    window.addEventListener('resize', resize);
    if (window.visualViewport) visualViewport.addEventListener('resize', resize);
    document.addEventListener('visibilitychange', () => {
      sys.hidden = document.hidden;
      if (document.hidden) { pauseGame(); input.reset(); save.commit(); }
      updateDuck(); last = performance.now();
    });
    window.addEventListener('pagehide', () => save.commit());
    sdk.on('hello', d => {
      sdk.connected = true;
      if (d && d.save) { store.import(d.save); save.reload(); }
      if (d && typeof d.muted === 'boolean') { sys.platformMute = d.muted; updateDuck(); }
      if (d && d.debug) debug.on = true;
    });
    sdk.on('pause', () => { sys.platformPause = true; pauseGame(); updateDuck(); });
    sdk.on('resume', () => { sys.platformPause = false; updateDuck(); last = performance.now(); });
    sdk.on('mute', d => { sys.platformMute = !!(d && d.muted); updateDuck(); });
    sdk.on('debug', d => { debug.on = !!(d && d.on); });
    sdk.on('snapshot', d => {
      try {
        const w = (d && d.width) || 480, c = document.createElement('canvas'); c.width = w; c.height = Math.round(w * canvas.height / canvas.width);
        c.getContext('2d').drawImage(canvas, 0, 0, c.width, c.height);
        sdk.send('snapshot', { id: d && d.id, data: c.toDataURL('image/jpeg', 0.85) });
      } catch (err) { sdk.send('snapshot', { id: d && d.id, error: String(err) }); }
    });
    sdk.send('loadProgress', { p: 1 });
    scenes.go(startScene, params);
    sdk.send('ready', { game: MF.id, title: MF.title, version: MF.version, kernel: KERNEL_VERSION, orientation: MF.orientation, design: MF.design });
    last = performance.now();
    requestAnimationFrame(frame);
  }

/* ---------- 3b. SIMULATION (pure: no drawing, no audio, no Math.random) ---------- */

const Sim = {
  create(seed, opts = {}) {

      rng: K.rng(seed), t: 0, dist: 0, pdist: 0, speed: 14, seeds: 0, bonus: 0, score: 0,
      over: false, continued: false, cause: null, events: [],
      p: { lane: 0, x: 0, px: 0, y: 0, py: 0, vy: 0, slide: 0, air: false, slideQ: false, laneAt: -9, jumpBuf: 0 },
      obs: [], seedArr: [], nextZ: 42, invuln: 0, mag: 0, dbl: 0, swing: 0, streak: 0, streakT: 0,

  },
  emit(s, type, d = {}) { d.type = type; s.events.push(d); },
  diff(s) { return K.M.clamp(s.dist / 2000, 0, 1); },
  add(s, o) { o.id = s.nid++; o.pz = o.z; s.obs.push(o); return o; },
  seedLine(s, lane, z0, n, step = 2.6) { for (let i = 0; i < n; i++) s.seedArr.push({ x: lane, px: lane, z: z0 + i * step, pz: z0 + i * step, h: 0, ph: 0, mag: false }); },
  seedArc(s, lane, zc) { for (let i = -3; i <= 3; i++) { const h = 250 * (1 - (i / 3.6) ** 2); s.seedArr.push({ x: lane, px: lane, z: zc + i * 2.1, pz: zc + i * 2.1, h, ph: h, mag: false }); } },
  tutorial(s) {   // first run: a gentle scripted opening that teaches swipe, jump and slide
    Sim.seedLine(s, -1, 26, 6);
    for (const l of [-1, 0, 1]) Sim.add(s, { k: 'log', lane: l, z: 78 });
    Sim.seedArc(s, -1, 78); Sim.seedArc(s, 0, 78);
    Sim.seedLine(s, 0, 92, 5);
    Sim.add(s, { k: 'branch', lane: -1, z: 125 }); Sim.add(s, { k: 'branch', lane: 0, z: 125 }); Sim.add(s, { k: 'branch', lane: 1, z: 125 });
    Sim.seedLine(s, 0, 112, 4, 3);
    s.nextZ = 165;
  },
  gen(s) {
    const r = s.rng, d = Sim.diff(s), z = s.nextZ, L = [-1, 0, 1];
    let extra = 0;
    const pats = [
      { id: 'log1', w: 3, min: 0 }, { id: 'branch1', w: 2.4, min: 0 }, { id: 'snap', w: 1.6, min: 0.04 },
      { id: 'log2', w: 2.2, min: 0.08 }, { id: 'river', w: 1.5, min: 0.1 }, { id: 'branch2', w: 1.8, min: 0.12 },
      { id: 'mix', w: 2.4, min: 0.16 }, { id: 'monkey', w: 1.5, min: 0.2 }, { id: 'walllog', w: 1.2, min: 0.3 },
      { id: 'wallbranch', w: 1.1, min: 0.36 }, { id: 'snapmix', w: 1.4, min: 0.42 }, { id: 'double', w: 1.6, min: 0.5 },
    ].filter(p => d >= p.min);
    const pat = r.weighted(pats).id;
    const free = l => { const o = L.filter(x => x !== l); return r.pick(o); };
    const place = (id, zz) => {
      switch (id) {
        case 'log1': { const l = r.pick(L); Sim.add(s, { k: 'log', lane: l, z: zz }); if (r.chance(0.55)) Sim.seedArc(s, l, zz); else Sim.seedLine(s, free(l), zz - 6, 5); break; }
        case 'branch1': { const l = r.pick(L); Sim.add(s, { k: 'branch', lane: l, z: zz }); Sim.seedLine(s, r.chance(0.5) ? l : free(l), zz - 5, 4); break; }
        case 'log2': { const f = r.pick(L); for (const l of L) if (l !== f) Sim.add(s, { k: 'log', lane: l, z: zz }); Sim.seedLine(s, f, zz - 6, 5); break; }
        case 'branch2': { const f = r.pick(L); for (const l of L) if (l !== f) Sim.add(s, { k: 'branch', lane: l, z: zz }); Sim.seedLine(s, f, zz - 6, 5); break; }
        case 'mix': { const o = r.shuffle(L.slice()); Sim.add(s, { k: 'log', lane: o[0], z: zz }); Sim.add(s, { k: 'branch', lane: o[1], z: zz }); Sim.seedLine(s, o[2], zz - 6, 5); break; }
        case 'walllog': { for (const l of L) Sim.add(s, { k: 'log', lane: l, z: zz }); Sim.seedArc(s, r.pick(L), zz); extra += 8; break; }
        case 'wallbranch': { for (const l of L) Sim.add(s, { k: 'branch', lane: l, z: zz }); Sim.seedLine(s, r.pick(L), zz - 4, 4, 2); extra += 8; break; }
        case 'snap': { const side = r.sign(); Sim.add(s, { k: 'snap', side, lane: side, z: zz, snapped: false }); Sim.seedLine(s, 0, zz - 8, 6); break; }
        case 'snapmix': { const side = r.sign(); Sim.add(s, { k: 'snap', side, lane: side, z: zz, snapped: false }); Sim.add(s, { k: r.chance(0.5) ? 'log' : 'branch', lane: 0, z: zz }); Sim.seedLine(s, -side, zz - 6, 5); break; }
        case 'river': {
          const len = r.range(11, 15), pads = [false, false, false];
          const n = d < 0.55 ? 2 : r.chance(0.5) ? 2 : 1, order = r.shuffle([0, 1, 2]);
          for (let i = 0; i < n; i++) pads[order[i]] = true;
          Sim.add(s, { k: 'river', lane: 0, z: zz, len, pads });
          Sim.seedLine(s, order[0] - 1, zz + 1.5, Math.floor(len / 2.6));
          extra += len; break;
        }
        case 'monkey': { const side = r.sign(); Sim.add(s, { k: 'monkey', side, lane: side * 2.3, z: zz + 18, thrown: false }); Sim.seedLine(s, r.pick(L), zz - 4, 5); break; }
      }
    };
    if (pat === 'double') {
      const a = r.pick(['log1', 'branch1', 'log2', 'branch2']), b = r.pick(['log1', 'branch1', 'mix']);
      place(a, z); place(b, z + 10 + s.speed * 0.25); extra += 10 + s.speed * 0.25;
    } else place(pat, z);

      const type = r.weighted([{ t: 'magnet', w: 3 }, { t: 'double', w: 2.5 }, { t: 'vine', w: 1.6 }], o => o.w).t;
      Sim.add(s, { k: 'pow', type, lane: r.pick(L), z: z + extra + 9 });
      extra += 6;
    }

  },
  revive(s) {
    s.over = false; s.continued = true; s.invuln = 2.6; s.cause = null; s.events.length = 0;
    const p = s.p; p.y = p.py = 0; p.vy = 0; p.air = false; p.slide = 0; p.x = p.px = p.lane;
    K.compact(s.obs, o => o.k === 'pow' || o.z - s.dist > 34 || o.z - s.dist < -2);
    if (s.nextZ < s.dist + 34) s.nextZ = s.dist + 34;
  },
  hitTest(s, o, rz) {
    const p = s.p, lx = Math.abs(p.x - o.lane);
    switch (o.k) {
      case 'log': return lx < 0.55 && Math.abs(rz) < 0.75 && p.y < LOG_H - 8;
      case 'branch': return lx < 0.55 && Math.abs(rz) < 0.6 && p.slide <= 0;
      case 'snap': return Sim.snapExt(rz) > 0.72 && lx < 0.6 && Math.abs(rz) < 0.9 && p.y < 150;
      case 'fruit': return o.land && Math.abs(p.x - o.x) < 0.5 && Math.abs(rz) < 0.6 && p.y < 70;
      case 'river': return rz <= 0.2 && rz + o.len >= -0.2 && !p.air && !o.pads[Math.round(K.M.clamp(p.x, -1, 1)) + 1];
    }
    return false;
  },
  snapExt(rz) { return rz > -3 ? K.M.clamp((15 - rz) / 5, 0, 1) : K.M.clamp(1 - (-3 - rz) / 3, 0, 1); },
  step(s, dt, cmd) {
    if (s.over) return;
    const p = s.p, r = s.rng;
    s.t += dt; s.pdist = s.dist;
    p.px = p.x; p.py = p.y;
    const base = 14 + 14 * K.M.clamp(s.dist / 2400, 0, 1);
    s.speed = K.M.approach(s.speed, base * (s.swing > 0 ? 1.3 : 1), 20 * dt);
    s.dist += s.speed * dt;
    s.invuln = Math.max(0, s.invuln - dt); s.mag = Math.max(0, s.mag - dt); s.dbl = Math.max(0, s.dbl - dt);
    // --- input
    if (cmd.left && p.lane > -1) { p.lane--; p.laneAt = s.t; Sim.emit(s, 'lane', { dir: -1 }); }
    if (cmd.right && p.lane < 1) { p.lane++; p.laneAt = s.t; Sim.emit(s, 'lane', { dir: 1 }); }
    if ((cmd.left && p.lane === -1 && p.x <= -0.99) || (cmd.right && p.lane === 1 && p.x >= 0.99)) Sim.emit(s, 'bump', { dir: cmd.left ? -1 : 1 });
    if (cmd.jump) p.jumpBuf = 0.16;
    if (cmd.slide) {
      if (s.swing > 0) { /* ignore */ }
      else if (p.air) { p.vy = Math.min(p.vy, -2700); p.slideQ = true; Sim.emit(s, 'dive'); }
      else { p.slide = SLIDE_T; Sim.emit(s, 'slide'); }
    }
    p.jumpBuf -= dt;
    if (p.jumpBuf > 0 && !p.air && s.swing <= 0) { p.jumpBuf = 0; p.vy = JUMP_V; p.air = true; p.slide = 0; Sim.emit(s, 'jump'); }
    p.x = K.M.approach(p.x, p.lane, LANE_SPEED * dt);

    if (s.swing > 0) {
      s.swing -= dt; p.air = true; p.slide = 0;
      p.y = K.M.damp(p.y, 250, 6, dt); p.vy = 0;
      if (s.swing <= 0) { s.swing = 0; s.invuln = Math.max(s.invuln, 1.2); Sim.emit(s, 'swingEnd'); }
    } else if (p.air) {
      p.vy -= GRAV * dt; p.y += p.vy * dt;

        o.thrown = true;

        Sim.emit(s, 'throw', { side: o.side });
      }
      if (o.k === 'fruit') {
        o.px = o.x; o.ph = o.h;
        if (!o.land) {
          o.ft += dt; const k = K.M.clamp(o.ft / 0.6, 0, 1);
          o.x = K.M.lerp(o.sx, o.lane, k); o.vh -= 2600 * dt; o.h = Math.max(0, o.h + o.vh * dt);
          if (k >= 1 || o.h <= 0) { o.land = true; o.h = 0; o.x = o.lane; Sim.emit(s, 'fruitLand', { z: o.z - s.dist, lane: o.lane }); }
        } else { o.z -= 9 * dt; o.h = Math.abs(Math.sin(s.t * 9)) * 16; }
      }
      const rz = o.z - s.dist;
      if (o.k === 'snap' && !o.snapped && Sim.snapExt(rz) > 0.4) { o.snapped = true; Sim.emit(s, 'snap', { side: o.side, rz }); }
      if (o.k === 'pow') {
        if (!o.got && Math.abs(p.x - o.lane) < 0.6 && Math.abs(rz) < 1.1 && (p.y < 220 || s.swing > 0)) {
          o.got = true; s.bonus += 25;
          if (o.type === 'magnet') s.mag = POWS.magnet.dur; else if (o.type === 'double') s.dbl = POWS.double.dur;
          else { s.swing = POWS.vine.dur; p.air = true; p.slide = 0; }
          Sim.emit(s, 'pow', { pw: o.type });
        }
        continue;
      }
      if (!safe && !o.passed && Sim.hitTest(s, o, rz)) {
        s.over = true; s.cause = o.k; p.vy = 0;
        Sim.emit(s, 'hit', { kind: o.k, rz, lane: o.lane });
        return;
      }
      if (!o.passed && rz < (o.k === 'river' ? -o.len : -0.9)) {
        o.passed = true;
        if (o.k === 'log' && Math.abs(p.x - o.lane) < 0.55) { s.vaults++; s.bonus += 10; Sim.emit(s, 'vault', { pts: 10 }); }
        else if (o.k === 'branch' && Math.abs(p.x - o.lane) < 0.55) { s.bonus += 10; Sim.emit(s, 'duck', { pts: 10 }); }
        else if ((o.k === 'log' || o.k === 'branch' || o.k === 'snap' || o.k === 'fruit') && Math.abs(p.x - o.lane) < 1.35 && s.t - p.laneAt < 0.45 && !safe) {
          s.dodges++; s.bonus += 20; Sim.emit(s, 'close', { pts: 20 });
        }
      }
    }
    K.compact(s.obs, o => (o.k === 'river' ? o.z + o.len : o.z) - s.dist > -8 && !(o.k === 'pow' && o.got));
    // --- seeds
    const magOn = s.mag > 0 || s.swing > 0;
    for (const sd of s.seedArr) {
      sd.px = sd.x; sd.pz = sd.z; sd.ph = sd.h;
      let rz = sd.z - s.dist;
      if (magOn && !sd.mag && rz < 30 && rz > -1) sd.mag = true;
      if (sd.mag) {
        const k = 1 - Math.exp(-11 * dt);
        sd.x += (p.x - sd.x) * k; sd.h += (p.y + 50 - sd.h) * k; sd.z = s.dist + rz * (1 - k) - 0.2;
        rz = sd.z - s.dist;
      }
      if (!sd.got && Math.abs(sd.x - p.x) < 0.55 && Math.abs(rz) < 0.9 && Math.abs(sd.h - (p.y + 40)) < 130) {
        sd.got = true;
        const v = s.dbl > 0 ? 2 : 1; s.seeds += v; s.streak++; s.streakT = 0.9;
        Sim.emit(s, 'seed', { v, streak: s.streak, x: sd.x, h: sd.h });
      }
    }
    K.compact(s.seedArr, sd => !sd.got && sd.z - s.dist > -6);
    if (s.streakT > 0) { s.streakT -= dt; if (s.streakT <= 0) s.streak = 0; }
    s.score = Math.floor(s.dist) + s.seeds * 5 + s.bonus;
  },
};

/* ---------- 3c. PRESENTATION HELPERS (read sim state, never write it) ---------- */

const ART = {
  tree(v) {
    return K.draw.sprite('tree' + v, 300, 560, c => {
      const pal = [['#3d7a1c', '#4f9a26', '#6cc23a'], ['#2e6b2a', '#3f8a34', '#5aae46'], ['#2f5f1a', '#447f22', '#62a832']][v % 3];

      c.strokeStyle = 'rgba(31,42,18,0.35)'; c.lineWidth = 3; for (let i = 0; i < 6; i++) { c.beginPath(); c.moveTo(140, 260 + i * 50); c.lineTo(160, 280 + i * 50); c.stroke(); }
      c.strokeStyle = '#3d7a1c'; c.lineWidth = 7; c.beginPath(); c.moveTo(150, 230); c.bezierCurveTo(110, 330, 190, 380, 140, 470); c.stroke();
      const blobs = [[150, 170, 120], [70, 230, 80], [230, 225, 85], [110, 110, 80], [200, 105, 78], [150, 60, 66]];
      for (const [x, y, r] of blobs) { c.beginPath(); c.arc(x, y + 8, r, 0, TAU); c.fillStyle = INK; c.fill(); }

  palm() {

      c.lineWidth = 34; c.strokeStyle = INK; c.stroke(); c.lineWidth = 26; c.strokeStyle = '#a8743a'; c.stroke();

// --- backdrop: sky, sun, mountains, canopy ---------------------------------
const MNT = (() => { const n = K.noise(11), a = [], b = []; for (let i = 0; i <= 60; i++) { a.push(n.fbm1(i * 0.18, 3)); b.push(n.fbm1(i * 0.3 + 40, 3)); } return [a, b]; })();
function drawBackdrop(ctx, camX, t) {
  const v = K.view, x0 = -v.ox - 4, W = v.fullW + 8, hz = PV.hz;
  const g = ctx.createLinearGradient(0, -v.oy, 0, hz + 10);
  g.addColorStop(0, '#4cc4ff'); g.addColorStop(0.6, '#a6ecff'); g.addColorStop(1, '#e8ffd0');
  ctx.fillStyle = g; ctx.fillRect(x0, -v.oy - 4, W, hz + v.oy + 14);
  // sun
  const sx = v.w * 0.68 - camX * 0.04, sy = hz - 190;
  K.draw.glow(sx, sy, 260, '#fff6b0', 0.65);
  ctx.beginPath(); ctx.arc(sx, sy, 62, 0, TAU); ctx.fillStyle = '#fff3a8'; ctx.fill();
  // clouds
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  for (let i = 0; i < 5; i++) {
    const cw = v.fullW + 400, cx = ((i * 331 + t * (8 + i * 3)) % cw) - 200 - v.ox - camX * 0.03, cy = hz - 300 + (i * 97) % 220 - (i % 2) * 60;
    ctx.beginPath(); ctx.arc(cx, cy, 34, 0, TAU); ctx.arc(cx + 40, cy - 14, 44, 0, TAU); ctx.arc(cx + 86, cy, 32, 0, TAU); ctx.rect(cx, cy, 86, 32); ctx.fill();
  }
  // mountains (2 layers)
  const layers = [{ m: MNT[0], col: '#8fd0a8', amp: 150, base: hz - 30, par: 0.05 }, { m: MNT[1], col: '#5fae6e', amp: 90, base: hz + 4, par: 0.1 }];
  for (const L of layers) {
    ctx.beginPath(); ctx.moveTo(x0, hz + 20);
    const step = W / 60;
    for (let i = 0; i <= 60; i++) ctx.lineTo(x0 + i * step - camX * L.par, L.base - (0.5 + L.m[i] * 0.9) * L.amp);
    ctx.lineTo(x0 + W, hz + 20); ctx.closePath(); ctx.fillStyle = L.col; ctx.fill();
  }
  // far jungle treeline
  ctx.fillStyle = '#3f8a34';
  ctx.beginPath(); ctx.moveTo(x0, hz + 20);
  for (let x = x0; x <= x0 + W + 40; x += 38) { const k = Math.sin(x * 0.07) * 8 + Math.sin(x * 0.023) * 12; ctx.arc(x - camX * 0.14, hz - 6 + k, 28, Math.PI, 0); }
  ctx.lineTo(x0 + W, hz + 20); ctx.closePath(); ctx.fill();
}

// --- ground ------------------------------------------------------------------
const FOG = '#cfeeb6';
const GCOL = (() => { const o = {}; for (const [k, c] of Object.entries({ g1: '#57b83a', g2: '#4aa531', d1: '#d39a5a', d2: '#c4884a', e: '#7a4a22' })) { o[k] = []; for (let i = 0; i <= 12; i++) o[k].push(K.color.mix(c, FOG, Math.pow(i / 12, 1.6) * 0.85)); } return o; })();
const fogI = z => Math.round(K.M.clamp(z / ZMAX, 0, 1) * 12);
function drawGround(ctx, dist, rivers) {
  const v = K.view, x0 = -v.ox - 10, x1 = v.w + v.ox + 10, bottom = v.h + v.oy + 10;
  ctx.fillStyle = GCOL.g2[0]; ctx.fillRect(x0, PV.hz, x1 - x0, bottom - PV.hz);
  const B = 4; let zA = Math.floor((dist - 6) / B) * B;
  const fz = ZMAX + 2;
  for (; zA < dist + fz; zA += B) {
    const za = Math.max(zA - dist, -6.5), zb = Math.min(zA + B - dist, fz);
    if (zb <= za) continue;
    const sa = sOf(za), sb = sOf(zb), ya = SY(sa), yb = SY(sb), odd = (Math.round(zA / B) & 1), fi = fogI((za + zb) / 2);
    ctx.fillStyle = (odd ? GCOL.g1 : GCOL.g2)[fi]; ctx.fillRect(x0, yb, x1 - x0, ya - yb + 1);
    ctx.fillStyle = GCOL.e[fi];
    cPath(ctx, [SX(-1.78, sa), ya, SX(1.78, sa), ya, SX(1.78, sb), yb, SX(-1.78, sb), yb]); ctx.fill();
    ctx.fillStyle = (odd ? GCOL.d1 : GCOL.d2)[fi];
    cPath(ctx, [SX(-1.62, sa), ya, SX(1.62, sa), ya, SX(1.62, sb), yb, SX(-1.62, sb), yb]); ctx.fill();
  }
  // sky haze over the far ground
  const hg = ctx.createLinearGradient(0, PV.hz, 0, PV.hz + 70); hg.addColorStop(0, FOG); hg.addColorStop(1, 'rgba(207,238,182,0)');
  ctx.fillStyle = hg; ctx.fillRect(x0, PV.hz - 1, x1 - x0, 72);
  // lane dividers
  ctx.strokeStyle = 'rgba(110,61,24,0.35)'; ctx.lineWidth = 5;
  for (const lx of [-0.5, 0.5]) { const s0 = sOf(-6), s1 = sOf(ZMAX); ctx.beginPath(); ctx.moveTo(SX(lx, s0), SY(s0)); ctx.lineTo(SX(lx, s1), SY(s1)); ctx.stroke(); }

}
function drawRiver(ctx, r, dist, x0, x1) {
  const za = r.z - dist, zb = za + r.len;
  if (zb < -6 || za > ZMAX) return;
  const sa = sOf(Math.max(za, -6.5)), sb = sOf(Math.min(zb, ZMAX)), ya = SY(sa), yb = SY(sb);
  ctx.fillStyle = '#6e3d18'; ctx.fillRect(x0, yb - 6 * sb, x1 - x0, ya - yb + 14 * sa);
  const g = ctx.createLinearGradient(0, yb, 0, ya); g.addColorStop(0, '#5fd0e0'); g.addColorStop(1, '#1f8fb0');
  ctx.fillStyle = g; ctx.fillRect(x0, yb, x1 - x0, ya - yb);
  ctx.globalAlpha = fogA(za) ; ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineWidth = 4;
  const t = now();
  for (let i = 0; i < 6; i++) {
    const zz = za + ((i * 2.3 + t * 1.5) % r.len); if (zz < -6) continue; const s = sOf(zz), y = SY(s);
    for (let j = -4; j <= 4; j++) { const x = SX(j * 0.9 + (i % 2) * 0.45, s); ctx.beginPath(); ctx.moveTo(x - 30 * s, y); ctx.quadraticCurveTo(x, y - 8 * s, x + 30 * s, y); ctx.stroke(); }
  }
  ctx.globalAlpha = 1;
  // lily pads
  const pad = ART.pad();
  for (let li = 0; li < 3; li++) if (r.pads[li]) {
    for (let zz = za + 0.9; zz < zb - 0.4; zz += 2.15) {
      if (zz < -6 || zz > ZMAX) continue;
      const s = sOf(zz); const bob = Math.sin(t * 3 + zz) * 3 * s;
      K.draw.drawSprite(pad, SX(li - 1, s), SY(s) + bob, { scale: s * PV.k * (1 + (Math.round(zz) % 2) * 0.12), alpha: fogA(zz) });
    }
  }
}

// --- runner ------------------------------------------------------------------
function drawRunner(c, skin, x, y, R, o = {}) {
  const pal = K.color.pal(skin.body), front = !!o.front, t = o.t || 0, run = o.run == null ? 1 : o.run;
  const sq = o.sq || 1, slide = o.slide || 0;
  const sy = sq * (1 - slide * 0.38), sx = 1 / Math.sqrt(sq) * (1 + slide * 0.22);
  c.save(); c.translate(x, y); c.rotate(o.rot || 0);
  const cy = -R * 0.95 * sy;
  // feet
  const ph = t * 14;
  for (const fx of [-1, 1]) {
    const lift = run * Math.max(0, Math.sin(ph + (fx > 0 ? Math.PI : 0))) * R * 0.35 * (1 - slide);
    c.beginPath(); c.ellipse(fx * R * 0.38, -R * 0.1 - lift, R * 0.26, R * 0.17, 0, 0, TAU);
    c.fillStyle = K.color.shade(skin.body, -0.35); c.fill(); c.lineWidth = 5; c.strokeStyle = INK; c.stroke();
  }
  // tail (back view)
  if (!front && (skin.acc === 'monkey' || skin.acc === 'jaguar')) {
    c.lineCap = 'round'; c.beginPath(); c.moveTo(0, cy + R * 0.5);
    const w = Math.sin(t * 8) * R * 0.3;
    c.bezierCurveTo(R * 0.2 + w, cy + R * 1.1, R * 0.9 + w, cy + R * 0.6, R * 0.7 + w, cy + R * 0.05);
    c.lineWidth = R * 0.26; c.strokeStyle = INK; c.stroke(); c.lineWidth = R * 0.15; c.strokeStyle = skin.acc === 'jaguar' ? '#f2c230' : '#8a5a2b'; c.stroke();
  }

  if (skin.acc === 'jaguar') for (const ex of [-1, 1]) { cPath(c, [ex * R * 0.35, -R * 0.85, ex * R * 0.85, -R * 1.05, ex * R * 0.82, -R * 0.45]); c.fillStyle = pal[1]; c.fill(); c.lineWidth = 5; c.strokeStyle = INK; c.stroke(); }
  // arms
  const sw = Math.sin(ph) * run * 0.7;
  for (const ax of [-1, 1]) {
    c.save(); c.translate(ax * R * 0.86, R * 0.1); c.rotate(ax * 0.3 + (front ? 1 : -1) * ax * sw * 0.6 + (o.arms || 0) * ax);
    c.beginPath(); c.ellipse(0, R * 0.28, R * 0.18, R * 0.32, 0, 0, TAU); c.fillStyle = pal[1]; c.fill(); c.lineWidth = 5; c.strokeStyle = INK; c.stroke();

  c.beginPath(); c.arc(0, 0, R, 0, TAU);
  const g = c.createRadialGradient(-R * 0.35, -R * 0.4, R * 0.1, 0, 0, R); g.addColorStop(0, pal[0]); g.addColorStop(0.7, pal[1]); g.addColorStop(1, pal[2]);
  c.fillStyle = g; c.fill(); c.lineWidth = 6; c.strokeStyle = INK; c.stroke();
  // markings
  if (skin.acc === 'jaguar') { c.fillStyle = 'rgba(60,35,10,0.75)'; for (const [a, b, r] of [[-0.5, -0.4, 0.13], [0.45, -0.3, 0.11], [-0.2, 0.35, 0.12], [0.5, 0.35, 0.1], [0.05, -0.65, 0.09]]) { c.beginPath(); c.arc(a * R, b * R, r * R, 0, TAU); c.fill(); } }
  if (skin.acc === 'tiki') { c.strokeStyle = '#7a2a10'; c.lineWidth = R * 0.09; for (const yy of [0.3, 0.52]) { c.beginPath(); c.arc(0, 0, R * 0.92, Math.asin(yy) + 0.15, Math.PI - Math.asin(yy) - 0.15); c.stroke(); } }
  if (skin.acc === 'frog') { c.fillStyle = 'rgba(20,60,110,0.45)'; for (const [a, b, r] of [[-0.45, 0.3, 0.14], [0.5, 0.15, 0.12], [0.1, 0.55, 0.1]]) { c.beginPath(); c.arc(a * R, b * R, r * R, 0, TAU); c.fill(); } }
  if (skin.acc === 'idol') { c.strokeStyle = 'rgba(160,100,0,0.6)'; c.lineWidth = 4; c.beginPath(); c.arc(0, R * 0.15, R * 0.55, 0.2, Math.PI - 0.2); c.stroke(); }
  c.beginPath(); c.ellipse(-R * 0.35, -R * 0.45, R * 0.28, R * 0.15, -0.6, 0, TAU); c.fillStyle = 'rgba(255,255,255,0.6)'; c.fill();
  // backpack (back view)
  if (!front) {
    K.draw.rr(-R * 0.42, -R * 0.05, R * 0.84, R * 0.72, R * 0.2); c.fillStyle = '#9a6430'; c.fill(); c.lineWidth = 5; c.strokeStyle = INK; c.stroke();
    K.draw.rr(-R * 0.42, -R * 0.05, R * 0.84, R * 0.3, R * 0.16); c.fillStyle = skin.scarf; c.fill(); c.stroke();
    c.beginPath(); c.arc(0, R * 0.25, R * 0.07, 0, TAU); c.fillStyle = '#ffd23a'; c.fill(); c.lineWidth = 3; c.stroke();
    leaf(c, R * 0.3, -R * 0.02, R * 0.4, R * 0.13, -0.9, '#8ad64a');

// --- snapping plant -----------------------------------------------------------
function drawSnapper(c, o, rz, alpha) {
  const ext = Sim.snapExt(rz), s = sOf(rz), k = s * PV.k, baseX = SX(o.side * 1.95, s), gy = SY(s);
  const hx = SX(K.M.lerp(o.side * 1.95, o.lane * 0.98, ext), s), hy = gy - (95 + Math.sin(now() * 5 + o.id) * 10 * (1 - ext)) * k;
  c.globalAlpha = alpha;

  for (let i = 0; i < 5; i++) leaf(c, baseX, gy, 80 * k, 24 * k, -Math.PI / 2 + (i - 2) * 0.55, i % 2 ? '#3d7a1c' : '#4f9a26');

  c.lineCap = 'round'; c.beginPath(); c.moveTo(baseX, gy - 10 * k);
  c.quadraticCurveTo(baseX, hy - 40 * k, hx - o.side * 30 * k, hy);
  c.lineWidth = 26 * k; c.strokeStyle = INK; c.stroke(); c.lineWidth = 16 * k; c.strokeStyle = '#6cc23a'; c.stroke();

    for (let i = 0; i < 5; i++) { const tx = R * (0.0 + i * 0.24), ty = j * -R * (0.5 - i * 0.08); cPath(c, [tx - 7 * k, ty, tx + 7 * k, ty, tx, ty + j * 18 * k]); c.fillStyle = '#fff'; c.fill(); c.lineWidth = 2; c.strokeStyle = INK; c.stroke(); }

// --- world ---------------------------------------------------------------------
function decorAt(i) {   // deterministic side decor for slot i (presentation-only, never touches sim)
  const h = K.hashSeed('d' + i), r = (h % 1000) / 1000, r2 = ((h >>> 10) % 1000) / 1000, r3 = ((h >>> 20) % 1000) / 1000;

}
function drawDecor(c, d, rz) {
  const s = sOf(rz), x = SX(d.x, s), y = SY(s), a = fogA(rz), sc = s * PV.k;
  if (d.type === 'tree') K.draw.drawSprite(ART.tree(d.v), x, y, { scale: sc * 1.15, ax: 0.5, ay: 1, alpha: a });
  else if (d.type === 'palm') K.draw.drawSprite(ART.palm(), x, y, { scale: sc * 1.1, ax: 0.47, ay: 1, alpha: a, sx: d.side * sc * 1.1 });
  else if (d.type === 'fern') K.draw.drawSprite(ART.fern(d.v % 2), x, y, { scale: sc * 1.1, ax: 0.5, ay: 1, alpha: a });

  }

      case 'branch': K.draw.drawSprite(ART.branch(), SX(o.lane, s), SY(s) + 4 * k, { scale: k, ax: 0.5, ay: 1, alpha: a }); break;
      case 'snap': drawSnapper(ctx, o, rz, a); break;

async function openDaily(btn) {
  const st = K.meta.daily.status();
  if (!st.available) { K.ui.toast('Next chest tomorrow!', { icon: 'lock' }); K.audio.play('error'); return; }
  const day = Math.min(st.streak, 7), reward = 40 + (day - 1) * 30 + (day === 7 ? 150 : 0);
  const i = await K.ui.dialog({ title: 'SEED CHEST', color: 'yellow', text: `Day ${st.streak} streak! Come back every day for bigger chests.`, extraH: 210,
    draw(ctx, x, y) {
      for (let d = 1; d <= 7; d++) {
        const cx = x + (d - 4) * 72, cy = y + 52, cur = d === day, done = d < day;
        K.draw.block(cx - 32, cy - 40, 64, 80, cur ? 'yellow' : done ? 'green' : 'gray', { r: 16, depth: 6, outline: 4 });
        K.draw.text(String(d), cx, cy - 8, { size: 30, sw: 5 });
        if (done) K.draw.icon('check', cx, cy + 22, 28, '#fff');
      }
      seedIcon(x - 50, y + 160, 56);
      K.draw.text('+' + reward, x + 30, y + 160, { size: 54, color: '#fff0a0' });
    },
    buttons: [{ label: 'CLAIM', icon: 'check', color: 'green' }] });
  if (i !== 0) return;
  K.meta.daily.claim(); K.meta.wallet.add('seeds', reward); K.save.commit();
  if (btn) btn.badge = null;
  K.audio.play('chest'); K.haptic('success');
  const v = K.view;
  K.fx.burst(v.w / 2, v.h / 2, { screen: true, shape: 'star', colors: ['#fff08a', '#ffc21a', '#ffffff'], count: 36, speed: [300, 900], size: [10, 20] });
  K.fx.text(v.w / 2, v.h / 2 - 60, '+' + reward + ' SEEDS', { screen: true, size: 70, color: '#fff08a' });
}

let lastRunSkin = null;
K.scenes.add('play', {
  gameplay: true, pausable: true, music: 'vineRun', touch: null,
  enter(p) {
    layoutPV(0);
    this.skin = selSkin(); lastRunSkin = this.skin;
    if (p.resume) { this.s = p.resume; Sim.revive(this.s); this.resumed = true; }
    else {
      const tut = !(SAVE.tut.lane && SAVE.tut.jump && SAVE.tut.slide);
      this.s = Sim.create((Math.random() * 2 ** 31) | 0, { tut });
      SAVE.runs++; K.save.later();
    }
    this.cam = { x: this.s.p.x * PV.LW * 0.55 };
    this.fxs = { sq: 1, score: 1, lean: 0, flip: 0 };
    this.dead = 0; this.leaving = false; this.sw = null; this.hint = null; this.hintT = 0; this.lastStreak = 0; this.slowmo = 1;
    this.banner = null;
    K.ui.pauseButton();
    if (this.resumed) { K.fx.text(K.view.w / 2, K.view.h * 0.42, 'GO!', { screen: true, size: 110, color: '#c4f28a' }); K.audio.play('power'); }
  },
  layout() { layoutPV(this.cam ? this.cam.x : 0); },
  onQuit() { K.scenes.go('title'); },
  readInput() {
    const cmd = { left: false, right: false, jump: false, slide: false }, ptr = K.input.pointer, TH = 42;
    const fire = (dx, dy) => {
      if (Math.abs(dx) > Math.abs(dy)) { if (dx < 0) cmd.left = true; else cmd.right = true; }
      else if (dy < 0) cmd.jump = true; else cmd.slide = true;
    };
    if (ptr.pressed) this.sw = { fired: false };
    if (this.sw && ptr.down && !this.sw.fired && Math.hypot(ptr.dx, ptr.dy) > TH) { this.sw.fired = true; fire(ptr.dx, ptr.dy); }
    if (ptr.released && this.sw) {
      if (!this.sw.fired) { if (Math.hypot(ptr.dx, ptr.dy) > TH) fire(ptr.dx, ptr.dy); else cmd.jump = true; }
      this.sw = null;
    }
    if (K.input.pressed('left')) cmd.left = true;
    if (K.input.pressed('right')) cmd.right = true;
    if (K.input.pressed('up') || K.input.pressed('action')) cmd.jump = true;
    if (K.input.pressed('down')) cmd.slide = true;
    return cmd;
  },
  update(dt) {
    const s = this.s;
    if (this.dead > 0) {
      this.dead -= dt;
      if (this.dead <= 0 && !this.leaving) { this.leaving = true; K.scenes.go('over', { state: s }); }
      return;
    }
    const cmd = this.readInput();
    this.tutorial(cmd);
    Sim.step(s, dt * this.slowmo, cmd);
    for (const e of s.events) this.present(e);
    s.events.length = 0;
    // cosmetic camera
    this.cam.x = K.M.damp(this.cam.x, s.p.x * PV.LW * 0.55, 7, dt);
    PV.camX = this.cam.x;
    this.fxs.lean = K.M.damp(this.fxs.lean, (s.p.lane - s.p.x) * 0.5, 14, dt);
  },
  tutorial(cmd) {
    const s = this.s, T = SAVE.tut;
    if (!s.tut) { this.slowmo = 1; this.hint = null; return; }
    let hint = null, near = 99;
    if (cmd.left || cmd.right) { if (!T.lane) { T.lane = true; K.save.commit(); } }
    if (cmd.jump && !T.jump && this.hint === 'jump') { T.jump = true; K.save.commit(); }
    if (cmd.slide && !T.slide && this.hint === 'slide') { T.slide = true; K.save.commit(); }
    for (const o of s.obs) {
      const rz = o.z - s.dist;
      if (rz < 0 || rz > 26 || Math.abs(o.lane - s.p.lane) > 0.1) continue;
      if (o.k === 'log' && !T.jump && rz < near) { hint = 'jump'; near = rz; }
      if (o.k === 'branch' && !T.slide && rz < near) { hint = 'slide'; near = rz; }
    }
    if (!hint && !T.lane && s.dist < 60) { hint = 'lane'; near = 99; }
    if (hint !== this.hint) this.hintT = 0;
    this.hint = hint;

  },
  present(e) {

      case 'bump': K.audio.play('bounce', 0.6); K.fx.shake(5, 0.12); this.fxs.lean = e.dir * 0.3; break;

      case 'close': K.audio.play('whoosh'); K.haptic('light'); K.fx.text(px, py - 200, 'CLOSE! +20', { size: 46, color: '#9fe3e0', rise: 100 }); break;
      case 'snap': K.audio.play('chomp'); if (Math.abs(e.side - p.x) < 1.2) K.fx.shake(4, 0.1); break;
      case 'throw': K.audio.play('monkey'); break;
      case 'fruitLand': { K.audio.play('land'); const sc = sOf(e.z); K.fx.puff(PV.cx + (e.lane * PV.LW - PV.camX) * sc, SY(sc), { count: 5, colors: ['#e8c89a'] }); break; }

  squash(v) { this.fxs.sq = v; K.tween.killOf(this.fxs); K.tween(this.fxs, { sq: 1 }, 0.35, K.Ease.outElastic); },

    K.draw.text(Math.floor(s.dist) + ' m', v.w / 2, 66 + st, { size: 34, sw: 6, color: '#c4f28a' });
    // active power-ups
    const act = [['magnet', s.mag], ['double', s.dbl], ['vine', s.swing]].filter(a => a[1] > 0);
    act.forEach(([type, tl], i) => {
      const x = v.w / 2 + (i - (act.length - 1) / 2) * 120, y = 250 + st;
      K.draw.drawSprite(ART.pow(type), x, y, { scale: 0.62 });
      ctx.beginPath(); ctx.arc(x, y, 44, -Math.PI / 2, -Math.PI / 2 + TAU * tl / POWS[type].dur); ctx.lineWidth = 8; ctx.strokeStyle = '#ffffff'; ctx.stroke();
    });
    if (this.banner) {
      const b = this.banner, k = b.t < 0.2 ? K.Ease.outBack(b.t / 0.2) : 1;
      ctx.globalAlpha = K.M.clamp((1.6 - b.t) * 3, 0, 1);
      ctx.save(); ctx.translate(v.w / 2, v.h * 0.4); ctx.scale(k, k); ctx.rotate(-0.04);
      K.draw.text(b.text, 0, 0, { size: 84, color: K.color.shade(b.color, 0.4), sw: 12 }); ctx.restore(); ctx.globalAlpha = 1;
    }
    if (s.streak >= 5) K.draw.text('x' + s.streak + ' streak', v.w / 2, 214 + st + (act.length ? 124 : 0), { size: 32, sw: 6, color: '#fff08a' });
  },
});

let plays = 0;
const BANK = new WeakMap();   // seeds already banked per run (a continued run only banks new seeds)
function nextSkinGoal(seedsHave) {
  const locked = SKINS.filter(s => !K.meta.unlocks.has(s.id)).sort((a, b) => a.cost - b.cost);
  return locked.length ? locked[0] : null;
}
K.scenes.add('over', {
  music: 'vineMenu',
  enter(p) {
    const v = K.view, s = this.s = p.state;
    layoutPV(PV.camX);
    plays++;
    const prevBest = SAVE.best;
    this.newBest = s.score > prevBest;
    if (this.newBest) SAVE.best = s.score;
    this.prevBest = prevBest;
    // bank seeds earned since the last bank (a continued run only banks the new ones)
    const earned = s.seeds - (BANK.get(s) || 0);
    this.earned = earned; this.runSeeds = s.seeds;
    if (earned > 0) K.meta.wallet.add('seeds', earned);
    SAVE.totalSeeds += Math.max(0, earned);
    this.banked = s.seeds;
    K.save.commit();
    K.sdk.send('score', { value: s.score });
    this.shown = { n: 0, sd: 0 }; this.pan = { s: 0 };
    K.tween(this.shown, { n: s.score, sd: s.seeds }, 1.0, K.Ease.outCubic, 0.35);
    K.tween(this.pan, { s: 1 }, 0.5, K.Ease.outBack);
    let ticks = 0;
    this.tick = () => { if (this.shown.n < s.score && ticks++ % 4 === 0) K.audio.play('tick'); };
    if (this.newBest && s.score > 0) K.wait(1.1).then(() => {
      if (K.scenes.current !== this) return;
      K.audio.play('win'); K.haptic('success');
      K.fx.burst(v.w / 2, v.h * 0.36, { screen: true, shape: 'star', colors: ['#fff08a', '#ffc21a', '#ffffff', '#c4f28a'], count: 46, speed: [300, 1000], size: [10, 20] });
      K.fx.flash('#fff6b0', 0.3);
    });
    // near-miss line
    const goal = nextSkinGoal();
    const wal = K.meta.wallet.get('seeds');
    if (!this.newBest && prevBest - s.score > 0 && prevBest - s.score <= Math.max(150, prevBest * 0.25)) this.near = 'Only ' + (prevBest - s.score) + ' from your best!';
    else if (goal && wal < goal.cost) this.near = (goal.cost - wal) + ' more seeds for ' + goal.name + '!';
    else if (goal) this.near = goal.name + ' is ready to unlock!';
    else this.near = s.vaults + ' vaults · ' + s.dodges + ' close calls';
    this.goal = goal;
    const cause = { log: 'Tripped on a log!', branch: 'Bonked a branch!', snap: 'Snapped by a plant!', fruit: 'Coconut to the face!', river: 'Splash! Missed the lily pads.' }[s.cause] || 'Wipeout!';
    this.cause = cause;

    K.ui.button({ icon: 'home', color: 'blue', w: 120, h: 120, popIn: 0.4,
      place: v => ({ x: v.w / 2 - 210, y: v.h * 0.38 + 360 }), onTap: () => K.scenes.go('title') });
    K.ui.button({ label: 'RETRY', icon: 'retry', color: 'green', w: 300, h: 120, key: 'action', pulse: true, popIn: 0.45,
      place: v => ({ x: v.w / 2 + 70, y: v.h * 0.38 + 360 }), onTap: () => K.scenes.go('play') });
    if (!s.continued) {
      const cont = K.ui.button({ label: 'CONTINUE', icon: 'video', color: 'purple', w: 460, h: 112, popIn: 0.55, pulse: true,
        place: v => ({ x: v.w / 2, y: v.h * 0.38 + 505 }),
        onTap: async () => {
          if (!cont.enabled) return;
          cont.enabled = false;
          const r = await K.adBreak('rewarded');
          if (r.granted) { BANK.set(s, this.banked); K.audio.play('power'); K.scenes.go('play', { resume: s }); }
          else { cont.label = 'NO AD'; K.ui.toast('Ad not available', { icon: 'close' }); }
        } });
      cont.sub = 'keep this run going';
    }
  },
  update() { this.tick(); },
  backdrop(ctx) { drawBackdrop(ctx, PV.camX, K.time); },
  render(ctx) {
    drawWorld(ctx, this.s, 1, { noPlayer: true });
    const v = K.view; ctx.fillStyle = 'rgba(31,42,18,0.55)'; ctx.fillRect(-v.ox, -v.oy, v.fullW, v.fullH);
  },
  hud(ctx) {
    const v = K.view, cy = v.h * 0.38, s = this.s;
    ctx.save(); ctx.translate(v.w / 2, cy); ctx.scale(this.pan.s, this.pan.s);
    K.draw.panel(0, 0, 600, 500, { title: 'WIPEOUT!', color: 'red' });
    K.draw.label(this.cause, 0, -165, { size: 30, color: '#a3321c', maxW: 540 });
    K.draw.label('SCORE', 0, -112, { size: 32, color: '#7a7058' });
    K.draw.text(Math.round(this.shown.n).toLocaleString(), 0, -50, { size: 96, color: '#ffd23a' });
    // seeds earned
    seedIcon(-44, 40, 48);
    K.draw.text('+' + Math.round(this.shown.sd), -14, 40, { size: 48, color: '#fff0a0', align: 'left' });
    K.draw.pill(0, 112, 'BEST ' + Math.max(SAVE.best, s.score).toLocaleString(), { icon: 'trophy', size: 32 });
    if (this.newBest && s.score > 0) {
      ctx.save(); ctx.translate(0, 188); ctx.rotate(Math.sin(K.time * 4) * 0.05); const sc = 1 + Math.sin(K.time * 8) * 0.05; ctx.scale(sc, sc);
      K.draw.text('NEW BEST!', 0, 0, { size: 58, color: '#8ae65a' }); ctx.restore();
    } else K.draw.label(this.near, 0, 188, { size: 30, maxW: 540, color: '#3d7a1c' });
    ctx.restore();
    if (this.goal) {
      // progress toward next runner
      const w = Math.min(520, v.w - 120), y = cy - 400;
      const pr = K.meta.wallet.get('seeds') / this.goal.cost;
      drawRunner(ctx, this.goal, v.w / 2 - w / 2 - 20, y + 30, 34, { front: true, mood: pr >= 1 ? 'wow' : 'happy', run: 0 });
      K.draw.bar(v.w / 2 + 30, y + 4, w - 40, 40, pr, 'yellow');
      K.draw.text(Math.min(K.meta.wallet.get('seeds'), this.goal.cost) + ' / ' + this.goal.cost, v.w / 2 + 30, y + 4, { size: 26, sw: 5 });
    }
  },
});

/* Title card (tools/cards.py renders ?card to thumb.jpg): full-bleed key art, no buttons. */
K.scenes.add('card', {
  music: null,
  enter() {
    layoutPV(0);
    const v = K.view;
    PV.hz = v.h * 0.42; PV.base = v.h * 0.93; PV.LW = 250; PV.k = 1.25;
    this.ws = { dist: 0, pdist: 0, obs: [
      { k: 'log', lane: 0, z: 1.6, pz: 1.6 }, 
      { k: 'branch', lane: -1, z: 24, pz: 24 }, { k: 'log', lane: 1, z: 30, pz: 30 }, { k: 'pow', type: 'vine', lane: 0, z: 18, pz: 18, id: 1 },
      { k: 'river', lane: 0, z: 38, pz: 38, len: 10, pads: [true, false, true] },
    ], seedArr: [] };
    for (let i = 0; i < 6; i++) { const z = 9 + i * 2.4; this.ws.seedArr.push({ x: 0, px: 0, z, pz: z, h: 0, ph: 0 }); }
  },
  backdrop(ctx) { drawBackdrop(ctx, 0, 3.0); },
  render(ctx) {
    const v = K.view, r = K.rng(5);
    drawWorld(ctx, this.ws, 1, { noPlayer: true });
    // speed lines radiating from the vanishing point
    ctx.lineCap = 'round';
    for (let i = 0; i < 30; i++) {
      const a = r.range(0, TAU), d0 = r.range(330, 560), d1 = d0 + r.range(90, 240), cx = v.w / 2, cy = PV.hz;
      ctx.strokeStyle = 'rgba(255,255,255,' + r.range(0.3, 0.65).toFixed(2) + ')'; ctx.lineWidth = r.range(4, 10);
      ctx.beginPath(); ctx.moveTo(cx + Math.cos(a) * d0 * 1.7, cy + Math.sin(a) * d0); ctx.lineTo(cx + Math.cos(a) * d1 * 1.7, cy + Math.sin(a) * d1); ctx.stroke();
    }
    // monkey hurling a coconut from the left
    K.draw.drawSprite(ART.monkey(), 30, v.h * 0.5, { scale: 1.7, sx: 1.7, sy: 1.7 });
    K.draw.drawSprite(ART.fruit(), 210, v.h * 0.47, { scale: 1.6, rot: 0.6 });
    ctx.strokeStyle = 'rgba(255,255,255,0.8)'; ctx.lineWidth = 8; ctx.lineCap = 'round';
    for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.moveTo(150 - i * 10, v.h * 0.43 + i * 26); ctx.lineTo(90 - i * 20, v.h * 0.42 + i * 30); ctx.stroke(); }
    // hero mid-vault over the log
    const x = v.w / 2, gy = SY(sOf(0)), y = gy - 330, R = 132;
    ctx.globalAlpha = 0.28; ctx.fillStyle = INK; ctx.beginPath(); ctx.ellipse(x, gy + 8, 120, 26, 0, 0, TAU); ctx.fill(); ctx.globalAlpha = 1;
    K.draw.glow(x, y - R, 300, '#fff6b0', 0.5);
    for (let i = 0; i < 14; i++) { ctx.globalAlpha = 0.85 - i * 0.055; ctx.fillStyle = i % 2 ? '#c4f28a' : '#fff6b0'; ctx.beginPath(); ctx.arc(x + Math.sin(i * 1.7) * 26, y + 20 + i * 24, 18 - i, 0, TAU); ctx.fill(); }
    ctx.globalAlpha = 1;
    // seed arc over the hero
    for (let i = -3; i <= 3; i++) { const a = i / 3; K.draw.drawSprite(ART.seed(), x + a * 270, y - R * 1.4 - (1 - a * a) * 130, { scale: 1.5, rot: a * 0.5 }); }
    drawRunner(ctx, SKINS[0], x, y, R, { front: true, t: 0.7, run: 1, mood: 'wow', arms: -1.1, rot: -0.1, sq: 1.1 });
    // motion arcs
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 10;
    for (const sx of [-1, 1]) { ctx.beginPath(); ctx.arc(x, y - R, R * 1.45, Math.PI / 2 + sx * 0.5, Math.PI / 2 + sx * 0.95, sx < 0); ctx.stroke(); }
    // snapping plant lunging in from the right
    {
      const bx = v.w + 60, by = v.h * 0.9, hx = v.w * 0.88, hy = v.h * 0.56, k = 2.2;
      for (let i = 0; i < 6; i++) leaf(ctx, bx, by, 190, 52, -Math.PI / 2 - 0.5 + (i - 2.5) * 0.45, i % 2 ? '#3d7a1c' : '#4f9a26');
      ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(bx - 40, by - 20); ctx.bezierCurveTo(bx - 220, by - 160, hx + 300, hy + 120, hx + 60, hy);
      ctx.lineWidth = 58; ctx.strokeStyle = INK; ctx.stroke(); ctx.lineWidth = 40; ctx.strokeStyle = '#6cc23a'; ctx.stroke();
      leaf(ctx, bx - 30, hy - 120, 110, 34, -2.6, '#8ad64a');
      drawSnapHead(ctx, hx, hy, 52 * k, -1, 0.62, k);
    }
    foregroundVines(ctx, 1.0);
    // big foreground leaves framing the bottom corners
    for (const sx of [-1, 1]) {
      const bx = sx < 0 ? -v.ox - 30 : v.w + v.ox + 30, by = v.h + 10;
      for (let i = 0; i < 5; i++) leaf(ctx, bx, by, 330 + i * 30, 80, (sx < 0 ? -0.35 : Math.PI + 0.35) - sx * i * 0.28, i % 2 ? '#3d7a1c' : '#4f9a26');
    }
  },
  hud(ctx) {
    const v = K.view;
    ctx.save(); ctx.translate(v.w / 2, v.h * 0.19); ctx.rotate(-0.07);
    leaf(ctx, -230, -190, 120, 36, -2.3, '#8ad64a'); leaf(ctx, -230, -190, 100, 30, -0.9, '#6cc23a');
    K.draw.text('VINE', 0, -100, { size: 220, color: '#c4f28a', sw: 18 });
    K.draw.text('DASH', 0, 105, { size: 220, color: '#ffd23a', sw: 18 });
    ctx.restore();
  },
});

K.boot(/[?&]card\b/.test(location.search) ? 'card' : 'title');
